name: Maintainer 622 staging cleanup

on:
  push:
    branches:
      - maintainer/622-logical-upload-session

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/622-logical-upload-session
          fetch-depth: 0
      - name: Adapt staging path test helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/serve/uploads_durable_test.go')
          text = path.read_text()
          old = '''func singleDurableStagedPath(t *testing.T, stagingDir string) string {
          \tt.Helper()
          \tentries, err := os.ReadDir(stagingDir)
          \tif err != nil {
          \t\tt.Fatalf("read durable staging directory: %v", err)
          \t}
          \tfiles := make([]os.DirEntry, 0, len(entries))
          \tfor _, entry := range entries {
          \t\tif !entry.IsDir() {
          \t\t\tfiles = append(files, entry)
          \t\t}
          \t}
          \tif len(files) != 1 {
          \t\tt.Fatalf("durable staging files = %d, want 1", len(files))
          \t}
          \treturn filepath.Join(stagingDir, files[0].Name())
          }
          '''
          new = '''func singleDurableStagedPath(t *testing.T, stagingDir string) string {
          \tt.Helper()
          \tfiles := make([]string, 0, 1)
          \terr := filepath.WalkDir(stagingDir, func(path string, entry os.DirEntry, err error) error {
          \t\tif err != nil {
          \t\t\treturn err
          \t\t}
          \t\tif !entry.IsDir() {
          \t\t\tfiles = append(files, path)
          \t\t}
          \t\treturn nil
          \t})
          \tif err != nil {
          \t\tt.Fatalf("walk durable staging directory: %v", err)
          \t}
          \tif len(files) != 1 {
          \t\tt.Fatalf("durable staging files = %d, want 1", len(files))
          \t}
          \treturn files[0]
          }
          '''
          assert text.count(old) == 1, 'unexpected singleDurableStagedPath helper shape'
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/serve/uploads_durable_test.go
      - name: Check staging cleanup diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(gofmt -l internal/serve/uploads_durable.go internal/serve/uploads_durable_test.go internal/serve/uploads_durable_staging_cleanup_test.go internal/serve/upload_durable_staging.go internal/serve/upload_durable_staging_test.go)"
      - name: Test durable staging and cancellation
        run: go test ./internal/serve -run '^(TestStageDurableMultipartUpload|TestActivateDurableUploadDestination|TestChooseDurableUploadDestination|TestDurableStagedUploads|TestDurableUploadAsync|TestRemoveCanceledSavedUploads)' -count=1
      - name: Test serve package
        run: go test ./internal/serve -count=1
      - name: Persist helper and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fiso64"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git rm .github/workflows/maintainer-622-staging-isolation.yml
          git add internal/serve/uploads_durable_test.go
          git commit -m "test: support isolated upload staging paths"
          git push origin HEAD:maintainer/622-logical-upload-session
