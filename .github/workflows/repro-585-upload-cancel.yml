name: Repro #585 upload cancel

on:
  push:
    branches:
      - maintainer/repro-585-active-upload-cancel

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Reproduce cancellation while upload request is in flight
        run: npm run test:e2e -- upload-cancel-inflight.spec.ts
