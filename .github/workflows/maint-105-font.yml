name: maint-105-font
on:
  push:
    branches: [fix/105-bundled-comic-font]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Sync dependency lock
        working-directory: frontend
        run: npm install --save-exact @fontsource/comic-neue@5.3.0
      - name: Check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Font regression
        working-directory: frontend
        run: npx playwright test tests/font-style.spec.ts --project=chromium
      - name: Commit synchronized lockfile
        run: |
          if ! git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package.json frontend/package-lock.json
            git commit -m "chore(frontend): sync Comic Neue dependency lock"
            git push
          fi
