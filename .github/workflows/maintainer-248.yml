name: Maintainer 248

on:
  push:
    branches:
      - feat/248-upload-target-default-tags

permissions:
  contents: write

jobs:
  implement-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[maintainer-248-applied]') && !contains(github.event.head_commit.message, '[maintainer-248-cleanup]') }}
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/248-upload-target-default-tags
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace('internal/serve/config.go', '\t"gooru.local/internal/securekey"\n', '\t"gooru.local/internal/query"\n\t"gooru.local/internal/securekey"\n')
          replace('internal/serve/config.go', 'type UploadTarget struct {\n\tID              string `yaml:"id"`\n\tName            string `yaml:"name"`\n\tPath            string `yaml:"path"`\n\tAddedAtStrategy string `yaml:"added_at_strategy"`\n}', 'type UploadTarget struct {\n\tID              string   `yaml:"id"`\n\tName            string   `yaml:"name"`\n\tPath            string   `yaml:"path"`\n\tAddedAtStrategy string   `yaml:"added_at_strategy"`\n\tDefaultTags     []string `yaml:"default_tags"`\n}')
          replace('internal/serve/config.go', '\t\tcfg.Uploads.Targets[i].AddedAtStrategy = addedAtStrategy\n', '\t\tcfg.Uploads.Targets[i].AddedAtStrategy = addedAtStrategy\n\t\tfor tagIndex := range cfg.Uploads.Targets[i].DefaultTags {\n\t\t\tcfg.Uploads.Targets[i].DefaultTags[tagIndex] = strings.TrimSpace(cfg.Uploads.Targets[i].DefaultTags[tagIndex])\n\t\t}\n\t\tif err := query.ValidateTagDirectives(cfg.Uploads.Targets[i].DefaultTags); err != nil {\n\t\t\terrs = append(errs, fmt.Errorf("uploads target %q default_tags: %w", id, err))\n\t\t}\n')

          Path('internal/query/tag_directives.go').write_text('''package query\n\nimport (\n    "fmt"\n    "strings"\n)\n\n// ValidateTagDirective validates an upload tag directive. A leading dash means\n// the corresponding positive tag should be excluded from the resolved set.\nfunc ValidateTagDirective(directive string) error {\n    directive = strings.TrimSpace(directive)\n    if directive == "" {\n        return fmt.Errorf("tag directive cannot be empty")\n    }\n    tag := directive\n    if strings.HasPrefix(tag, "-") {\n        tag = strings.TrimPrefix(tag, "-")\n        if tag == "" {\n            return fmt.Errorf("tag exclusion cannot be empty")\n        }\n    }\n    return ValidateTag(tag)\n}\n\nfunc ValidateTagDirectives(directives []string) error {\n    for _, directive := range directives {\n        if err := ValidateTagDirective(directive); err != nil {\n            return err\n        }\n    }\n    return nil\n}\n\n// ResolveTagDirectives applies tag/-tag directives in order and returns the\n// positive tags to apply. Exclusions remove an earlier matching tag; a later\n// positive directive can add it again.\nfunc ResolveTagDirectives(directives []string) ([]string, error) {\n    if err := ValidateTagDirectives(directives); err != nil {\n        return nil, err\n    }\n    result := make([]string, 0, len(directives))\n    present := make(map[string]struct{}, len(directives))\n    for _, raw := range directives {\n        directive := strings.TrimSpace(raw)\n        if strings.HasPrefix(directive, "-") {\n            tag := strings.TrimPrefix(directive, "-")\n            if _, ok := present[tag]; !ok {\n                continue\n            }\n            delete(present, tag)\n            filtered := result[:0]\n            for _, existing := range result {\n                if existing != tag {\n                    filtered = append(filtered, existing)\n                }\n            }\n            result = filtered\n            continue\n        }\n        if _, ok := present[directive]; ok {\n            continue\n        }\n        present[directive] = struct{}{}\n        result = append(result, directive)\n    }\n    return result, nil\n}\n''')
          Path('internal/query/tag_directives_test.go').write_text('''package query\n\nimport (\n    "reflect"\n    "testing"\n)\n\nfunc TestResolveTagDirectives(t *testing.T) {\n    got, err := ResolveTagDirectives([]string{"project:inbox", "source:upload", "project:archive", "-project:archive", "project:inbox"})\n    if err != nil {\n        t.Fatalf("ResolveTagDirectives: %v", err)\n    }\n    want := []string{"project:inbox", "source:upload"}\n    if !reflect.DeepEqual(got, want) {\n        t.Fatalf("resolved tags=%v want %v", got, want)\n    }\n}\n\nfunc TestResolveTagDirectivesAllowsLaterReAdd(t *testing.T) {\n    got, err := ResolveTagDirectives([]string{"tag", "-tag", "tag"})\n    if err != nil || !reflect.DeepEqual(got, []string{"tag"}) {\n        t.Fatalf("resolved tags=%v err=%v", got, err)\n    }\n}\n\nfunc TestValidateTagDirectiveRejectsInvalidExclusion(t *testing.T) {\n    if err := ValidateTagDirective("-"); err == nil {\n        t.Fatal("expected empty exclusion error")\n    }\n}\n''')

          replace('internal/serve/uploads.go', 'type UploadTargetDTO struct {\n\tID              string `json:"id"`\n\tName            string `json:"name"`\n\tAddedAtStrategy string `json:"added_at_strategy"`\n}', 'type UploadTargetDTO struct {\n\tID              string   `json:"id"`\n\tName            string   `json:"name"`\n\tAddedAtStrategy string   `json:"added_at_strategy"`\n\tDefaultTags     []string `json:"default_tags"`\n}')
          replace('internal/serve/uploads.go', 'items = append(items, UploadTargetDTO{ID: target.ID, Name: target.Name, AddedAtStrategy: strategy})', 'items = append(items, UploadTargetDTO{ID: target.ID, Name: target.Name, AddedAtStrategy: strategy, DefaultTags: append([]string(nil), target.DefaultTags...)})')
          replace('internal/serve/uploads.go', '\tif err := query.ValidateTags(tags); err != nil {\n\t\tremoveSavedUploads(saved)\n\t\twriteError(w, http.StatusBadRequest, "invalid_request", err.Error(), nil)\n\t\treturn\n\t}\n', '\tresolvedTags, err := query.ResolveTagDirectives(tags)\n\tif err != nil {\n\t\tremoveSavedUploads(saved)\n\t\twriteError(w, http.StatusBadRequest, "invalid_request", err.Error(), nil)\n\t\treturn\n\t}\n')
          replace('internal/serve/uploads.go', 'response, err := importer.ImportUploadedFiles(ctx, stagedUploads(saved), tags)', 'response, err := importer.ImportUploadedFiles(ctx, stagedUploads(saved), resolvedTags)')

          Path('internal/serve/upload_default_tags_test.go').write_text('''package serve\n\nimport (\n    "path/filepath"\n    "strings"\n    "testing"\n)\n\nfunc TestConfigUploadTargetDefaultTagsValidateDirectives(t *testing.T) {\n    cfg := DefaultConfig(filepath.Join(t.TempDir(), "gooru.db"))\n    cfg.Uploads.Enabled = true\n    cfg.Uploads.Targets = []UploadTarget{{ID: "default", Name: "Default", Path: t.TempDir(), DefaultTags: []string{" project:inbox ", "-project:archive"}}}\n    if err := cfg.Validate(); err != nil {\n        t.Fatalf("Validate default_tags: %v", err)\n    }\n    if got := cfg.Uploads.Targets[0].DefaultTags[0]; got != "project:inbox" {\n        t.Fatalf("trimmed default tag=%q", got)\n    }\n    cfg.Uploads.Targets[0].DefaultTags = []string{"-"}\n    if err := cfg.Validate(); err == nil || !strings.Contains(err.Error(), "default_tags") {\n        t.Fatalf("expected default_tags validation error, got %v", err)\n    }\n}\n''')

          # Extend the existing upload-target endpoint contract test without changing its setup shape.
          p = Path('internal/serve/uploads_test.go')
          text = p.read_text()
          needle = 'Uploads: UploadsConfig{Enabled: true, Targets: []UploadTarget{{ID: "default", Name: "Default", Path: targetDir}}},'
          if needle in text:
              text = text.replace(needle, 'Uploads: UploadsConfig{Enabled: true, Targets: []UploadTarget{{ID: "default", Name: "Default", Path: targetDir, DefaultTags: []string{"project:inbox", "-project:archive"}}}},', 1)
          p.write_text(text)

          replace('frontend/src/lib/state/uploadItems.ts', 'export type UploadTargetOption = { id: string; name: string; added_at_strategy?: UploadAddedAtStrategy };', 'export type UploadTargetOption = { id: string; name: string; added_at_strategy?: UploadAddedAtStrategy; default_tags?: string[] };')
          replace('frontend/src/lib/state/uploadWorkflow.svelte.ts', '  let targetID = $state(\'\');\n', '  let targetID = $state(\'\');\n  let managedDefaultTags = $state<string[]>([]);\n')
          replace('frontend/src/lib/state/uploadWorkflow.svelte.ts', '    tags = \'\';\n    conflictPolicy = \'rename\';', '    tags = \'\';\n    managedDefaultTags = [];\n    conflictPolicy = \'rename\';')
          old = '''  function setTarget(value: string, defaultStrategy?: UploadAddedAtStrategy) {\n    targetID = value;\n    if (defaultStrategy) addedAtStrategy = defaultStrategy;\n    if (files.length) items = retargetStagedUploadItems(items, targetID);\n  }'''
          new = '''  function setTarget(value: string, defaultStrategy?: UploadAddedAtStrategy, defaultTags: string[] = []) {\n    const previousDefaults = new Set(managedDefaultTags);\n    const retained = parseTags(tags).filter((tag) => !previousDefaults.has(tag));\n    const nextDefaults = Array.from(new Set(defaultTags.map((tag) => tag.trim()).filter(Boolean)));\n    const merged = [...retained];\n    const seen = new Set(merged);\n    for (const tag of nextDefaults) {\n      if (!seen.has(tag)) {\n        merged.push(tag);\n        seen.add(tag);\n      }\n    }\n    tags = merged.join(' ');\n    managedDefaultTags = nextDefaults;\n    targetID = value;\n    if (defaultStrategy) addedAtStrategy = defaultStrategy;\n    if (files.length) items = retargetStagedUploadItems(items, targetID);\n  }'''
          replace('frontend/src/lib/state/uploadWorkflow.svelte.ts', old, new)
          replace('frontend/src/lib/components/AuthenticatedApp.svelte', "upload.setTarget(target.id, target.added_at_strategy ?? 'queue');", "upload.setTarget(target.id, target.added_at_strategy ?? 'queue', target.default_tags ?? []);")
          replace('frontend/src/lib/components/AuthenticatedApp.svelte', "upload.setTarget(value, target?.added_at_strategy ?? 'queue');", "upload.setTarget(value, target?.added_at_strategy ?? 'queue', target?.default_tags ?? []);")

          test_path = Path('frontend/src/lib/state/uploadWorkflow.svelte.test.ts')
          test = test_path.read_text()
          insertion = '''\n  it('replaces managed target defaults while preserving user tags', () => {\n    const workflow = createUploadWorkflow();\n    workflow.setTarget('one', 'queue', ['project:inbox', '-project:archive']);\n    expect(workflow.tags).toBe('project:inbox -project:archive');\n    workflow.tags += ' user:kept';\n    workflow.setTarget('two', 'queue', ['source:upload', 'user:kept']);\n    expect(workflow.tags).toBe('user:kept source:upload');\n  });\n\n  it('does not duplicate target defaults on repeated selection', () => {\n    const workflow = createUploadWorkflow();\n    workflow.setTarget('one', 'queue', ['project:inbox', 'project:inbox']);\n    workflow.setTarget('one', 'queue', ['project:inbox']);\n    expect(workflow.tags).toBe('project:inbox');\n  });\n'''
          pos = test.rfind('\n});')
          if pos < 0:
              raise SystemExit('could not locate upload workflow describe end')
          test_path.write_text(test[:pos] + insertion + test[pos:])

          replace('docs/CONFIG.md', '| `added_at_strategy` | Optional default for library-added ordering: `queue` (default), `reverse_queue`, or `modtime`. An upload request may override the target default. |', '| `added_at_strategy` | Optional default for library-added ordering: `queue` (default), `reverse_queue`, or `modtime`. An upload request may override the target default. |\n| `default_tags` | Optional list of visible, editable upload-tag directives. Entries use the Upload tab `tag` / `-tag` syntax; exclusions remove matching positive tags when the upload is submitted. |')
          replace('docs/CONFIG.md', '      added_at_strategy: queue\n', '      added_at_strategy: queue\n      default_tags:\n        - project:inbox\n        - source:upload\n        - -project:archive\n')

          # Add default_tags to the UploadTarget OpenAPI schema immediately after added_at_strategy.
          p = Path('docs/openapi.yaml')
          text = p.read_text()
          marker = '''        added_at_strategy:\n          type: string\n          enum: [queue, reverse_queue, modtime]\n'''
          if marker not in text:
              raise SystemExit('UploadTarget added_at_strategy schema marker not found')
          text = text.replace(marker, marker + '''        default_tags:\n          type: array\n          items:\n            type: string\n          description: Visible editable tag/-tag directives prefilled for this upload target.\n''', 1)
          p.write_text(text)
          PY
          gofmt -w internal/query/tag_directives.go internal/query/tag_directives_test.go internal/serve/config.go internal/serve/uploads.go internal/serve/upload_default_tags_test.go
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run generate:api
      - name: Focused Go tests
        run: go test ./internal/query ./internal/serve
      - name: Frontend unit and type checks
        working-directory: frontend
        run: |
          npm run test:unit -- --run src/lib/state/uploadWorkflow.svelte.test.ts
          npm run check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/query/tag_directives.go internal/query/tag_directives_test.go internal/serve/config.go internal/serve/uploads.go internal/serve/uploads_test.go internal/serve/upload_default_tags_test.go docs/CONFIG.md docs/openapi.yaml frontend/src/lib/api/openapi.ts frontend/src/lib/state/uploadItems.ts frontend/src/lib/state/uploadWorkflow.svelte.ts frontend/src/lib/state/uploadWorkflow.svelte.test.ts frontend/src/lib/components/AuthenticatedApp.svelte
          git commit -m "feat: support upload target default tags [maintainer-248-applied]"
          git push origin HEAD:feat/248-upload-target-default-tags
