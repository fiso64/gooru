name: Temporary 249 tag mutation diagnostic

on:
  push:
    branches:
      - feat/249-upload-item-tags
    paths:
      - .github/workflows/tmp-249-tag-mutation-diagnostic.yml
      - .github/tmp-249-tag-mutation-diagnostic.sh

permissions:
  contents: write

jobs:
  capture:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/249-upload-item-tags
      - name: Capture tag mutation references
        run: bash .github/tmp-249-tag-mutation-diagnostic.sh
