name: Maintainer 251 revalidate

on:
  push:
    branches: [feat/251-viewer-fit-modes]

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/251-viewer-fit-modes
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fix remaining integration errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def change(path, old, new):
              p = Path(path); text = p.read_text()
              if old not in text: raise SystemExit('missing anchor: ' + path)
              p.write_text(text.replace(old, new, 1))
          change('frontend/src/lib/components/PreviewDialog.svelte', "    fitMode: 'screen'", "    fitMode: 'fit_window'")
          change('frontend/src/lib/components/ViewerStage.svelte', "import { onMount } from 'svelte';", "import { onMount, untrack } from 'svelte';")
          change('frontend/src/lib/components/ViewerStage.svelte', '    fitMode: initialFitMode\n  });', '    fitMode: untrack(() => initialFitMode)\n  });')
          Path('.github/workflows/maintainer-251-revalidate.yml').unlink()
          PY
          git config user.name 'Gooru Maintainer'
          git config user.email 'maintainer@users.noreply.github.com'
          git add -A
          git commit -m 'fix(webui): align viewer fit preference defaults'
          git push origin HEAD:feat/251-viewer-fit-modes
      - name: Go tests
        run: go test ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend checks
        working-directory: frontend
        run: npm run check && npm run test:unit
      - name: Focused Chromium regression
        working-directory: frontend
        run: |
          chromium=$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)
          test -n "$chromium"
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$chromium" npx playwright test tests/viewer-fit-mode.spec.ts --project=chromium
