name: tmp-254-finalize
on:
  push:
    branches: [feat/254-added-at-strategy]
    paths: [.github/workflows/tmp-254-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Complete config documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/CONFIG.md')
          s = p.read_text()
          s = s.replace('`uploads.targets` | empty list | Allowed upload destinations. Each target has `id`, `name`, and `path`.', '`uploads.targets` | empty list | Allowed upload destinations. Each target has `id`, `name`, `path`, and optional `added_at_strategy`.')
          s = s.replace('| `path` | Absolute destination directory. Required. The path itself is not returned by the upload-target API. |', '| `path` | Absolute destination directory. Required. The path itself is not returned by the upload-target API. |\n| `added_at_strategy` | Optional default for library-added ordering: `queue` (default), `reverse_queue`, or `modtime`. An upload request may override the target default. |')
          s = s.replace('      path: /srv/gooru/incoming\n  max_file_size_bytes:', '      path: /srv/gooru/incoming\n      added_at_strategy: queue\n  max_file_size_bytes:')
          p.write_text(s)
          PY
      - name: Verify generated API contract
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          git diff --exit-code -- src/lib/api/openapi.ts
      - name: Validate backend
        run: go test ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
          npm run build
      - name: Validate diff
        run: git diff --check
      - name: Commit documentation and remove validator
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-254-finalize.yml
          git add docs/CONFIG.md
          git commit -m 'docs(upload): document added-at strategy defaults'
          git push origin HEAD:feat/254-added-at-strategy
