name: Temporary #333 frontend validation

on:
  push:
    branches:
      - perf/333-pagination-regressions

permissions:
  contents: read

jobs:
  frontend:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - run: npx playwright install chromium
      - name: Type and Svelte checks
        run: npm run check
      - name: Unit tests
        run: npm run test:unit -- --run
      - name: Production build
        run: npm run build
      - name: Pagination regressions
        run: npm run test:e2e -- pagination-regressions.spec.ts
      - name: Upload metadata refresh regression
        run: npm run test:e2e -- upload-metadata-refresh.spec.ts
