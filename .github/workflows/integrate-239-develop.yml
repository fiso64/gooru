name: Integrate develop into 239

on:
  push:
    branches:
      - feat/231-comic-ui

permissions:
  contents: write

concurrency:
  group: integrate-239-develop
  cancel-in-progress: true

jobs:
  merge-develop:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/231-comic-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Merge current develop and isolate expected conflicts
        shell: bash
        run: |
          git config user.name "gooru-maintainer"
          git config user.email "maintainer@users.noreply.github.com"
          git fetch origin develop
          set +e
          git merge --no-edit origin/develop
          merge_status=$?
          set -e
          conflicted="$(git diff --name-only --diff-filter=U)"
          if [ -z "$conflicted" ]; then
            if [ "$merge_status" -ne 0 ]; then exit "$merge_status"; fi
            echo "NEEDS_VIEWER_RECONCILIATION=false" >> "$GITHUB_ENV"
            exit 0
          fi
          expected=$'frontend/src/lib/components/PreviewDialog.svelte\nfrontend/src/lib/components/ViewerStage.svelte'
          if [ "$conflicted" != "$expected" ]; then
            echo "Unexpected conflicts:" >&2
            printf '%s\n' "$conflicted" >&2
            exit 1
          fi
          git checkout --ours frontend/src/lib/components/PreviewDialog.svelte frontend/src/lib/components/ViewerStage.svelte
          echo "NEEDS_VIEWER_RECONCILIATION=true" >> "$GITHUB_ENV"
      - name: Layer fullscreen exit semantics onto comic viewer
        if: env.NEEDS_VIEWER_RECONCILIATION == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          function replaceOnce(text, oldText, newText, label) {
            if (text.includes(newText)) return text;
            if (!text.includes(oldText)) throw new Error(`missing ${label} anchor`);
            return text.replace(oldText, newText);
          }

          let path = 'frontend/src/lib/components/PreviewDialog.svelte';
          let text = fs.readFileSync(path, 'utf8');
          text = replaceOnce(
            text,
            "    keyboardNavigation={comicEntered}\n    navigationUnit={comicEntered ? 'page' : 'file'}\n",
            "    keyboardNavigation={comicEntered}\n    navigationUnit={comicEntered ? 'page' : 'file'}\n    closeOnFullscreenExit={$runtimeConfig.fullscreenMediaByDefault}\n    onFullscreenExit={onClose}\n",
            'PreviewDialog fullscreen exit props'
          );
          fs.writeFileSync(path, text);

          path = 'frontend/src/lib/components/ViewerStage.svelte';
          text = fs.readFileSync(path, 'utf8');
          text = replaceOnce(
            text,
            "    keyboardNavigation = false,\n    navigationUnit = 'file',\n    comicAvailable = false,",
            "    keyboardNavigation = false,\n    navigationUnit = 'file',\n    closeOnFullscreenExit = false,\n    onFullscreenExit,\n    comicAvailable = false,",
            'ViewerStage fullscreen props'
          );
          text = replaceOnce(
            text,
            "    keyboardNavigation?: boolean;\n    navigationUnit?: string;\n    comicAvailable?: boolean;",
            "    keyboardNavigation?: boolean;\n    navigationUnit?: string;\n    closeOnFullscreenExit?: boolean;\n    onFullscreenExit?: () => void;\n    comicAvailable?: boolean;",
            'ViewerStage fullscreen prop types'
          );
          text = replaceOnce(
            text,
            "  let isFullscreen = $state(false);\n  let stageWidth = $state(0);",
            "  let isFullscreen = $state(false);\n  let keepViewerAfterFullscreenExit = false;\n  let stageWidth = $state(0);",
            'ViewerStage fullscreen state'
          );
          text = replaceOnce(
            text,
            "    const syncFullscreen = () => {\n      isFullscreen = document.fullscreenElement === stage;\n      resize();\n      if (isFullscreen) scheduleCursorIdle();\n      else {\n        cursorIdle = false;\n        if (cursorIdleTimer) clearTimeout(cursorIdleTimer);\n        cursorIdleTimer = undefined;\n      }\n    };",
            "    const syncFullscreen = () => {\n      const wasFullscreen = isFullscreen;\n      const nextFullscreen = document.fullscreenElement === stage;\n      isFullscreen = nextFullscreen;\n      resize();\n      if (isFullscreen) scheduleCursorIdle();\n      else {\n        cursorIdle = false;\n        if (cursorIdleTimer) clearTimeout(cursorIdleTimer);\n        cursorIdleTimer = undefined;\n      }\n      if (wasFullscreen && !nextFullscreen && closeOnFullscreenExit) {\n        if (keepViewerAfterFullscreenExit) keepViewerAfterFullscreenExit = false;\n        else onFullscreenExit?.();\n      }\n    };",
            'ViewerStage fullscreen sync'
          );
          text = replaceOnce(
            text,
            "  async function toggleFullscreen() {\n    const stage = stageElement;\n    if (!stage) return;\n    try {\n      if (document.fullscreenElement === stage) await document.exitFullscreen();\n      else await stage.requestFullscreen();\n    } catch {\n      // Browsers may deny fullscreen without a user gesture; keyboard/button use normally qualifies.\n    }\n  }",
            "  async function toggleFullscreen() {\n    const stage = stageElement;\n    if (!stage) return;\n    const exiting = document.fullscreenElement === stage;\n    if (exiting && closeOnFullscreenExit) keepViewerAfterFullscreenExit = true;\n    try {\n      if (exiting) await document.exitFullscreen();\n      else await stage.requestFullscreen();\n    } catch {\n      if (exiting) keepViewerAfterFullscreenExit = false;\n      // Browsers may deny fullscreen without a user gesture; keyboard/button use normally qualifies.\n    }\n  }",
            'ViewerStage fullscreen toggle'
          );
          fs.writeFileSync(path, text);
          NODE
          git add frontend/src/lib/components/PreviewDialog.svelte frontend/src/lib/components/ViewerStage.svelte
          git commit --no-edit
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check and unit tests
        working-directory: frontend
        run: npm run check && npm run test:unit
      - name: Focused comic and fullscreen regressions
        working-directory: frontend
        run: npm run test:e2e -- comic-ui.spec.ts viewer-fullscreen-default.spec.ts --project=chromium
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Push reconciled branch
        run: git push origin HEAD:feat/231-comic-ui
