name: issue-21 final cleanup validation

on:
  push:
    branches:
      - agent/issue-21-exact-concept-port

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply final residue cleanup
        run: |
          python3 .github/scripts/issue21_final_cleanup_patch.py
          rm frontend/src/lib/components/AccountView.svelte
          rm frontend/src/lib/components/JobStatus.svelte
          rm frontend/src/lib/state/viewport.svelte.ts
      - name: Verify removed residues have no live references
        run: |
          ! grep -R "AccountView" frontend/src --exclude-dir=.svelte-kit
          ! grep -R "JobStatus" frontend/src --exclude-dir=.svelte-kit
          ! grep -R "createViewportState\|viewport.svelte" frontend/src --exclude-dir=.svelte-kit
          ! grep -R "drag-active\|upload-list-wrap" frontend/src --exclude-dir=.svelte-kit
      - name: Check patch whitespace
        run: git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend with zero warnings
        working-directory: frontend
        run: |
          npm run check | tee /tmp/svelte-check.log
          grep -q "svelte-check found 0 errors and 0 warnings" /tmp/svelte-check.log
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Build Go packages
        run: go build ./...
      - name: Run Go tests
        run: go test ./...
      - name: Persist validated final cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/styles/components.css docs/issue-21-concept-discrepancies.md
          git add -u frontend/src/lib/components/AccountView.svelte frontend/src/lib/components/JobStatus.svelte frontend/src/lib/state/viewport.svelte.ts
          git commit -m "#21 remove obsolete functional-reference UI residue [skip ci]"
          git push
