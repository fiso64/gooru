name: Temporary delete maintainer state comment

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/tmp-delete-maintainer-state-comment.yml

permissions:
  issues: write

jobs:
  delete-comment:
    runs-on: self-hosted
    steps:
      - name: Delete obsolete issue #29 state comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/5574775184"
