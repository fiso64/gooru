name: Temporary delete maintainer state comment

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/tmp-delete-maintainer-state-comment.yml

permissions:
  issues: write

jobs:
  delete-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete issue #29 state comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE \
            repos/${GITHUB_REPOSITORY}/issues/comments/5574775184
