name: temp validate 171
on:
  push:
    branches:
      - feat/141-upload-concurrency
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - name: Playwright upload coverage
        shell: bash
        run: |
          set -o pipefail
          npx playwright test upload-concurrency.spec.ts upload-isolation.spec.ts upload-row-layout.spec.ts --project=chromium 2>&1 | tee playwright-output.log
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output-171
          path: frontend/playwright-output.log
