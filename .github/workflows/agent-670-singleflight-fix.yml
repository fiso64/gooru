name: Agent 670 single-flight fix

on:
  push:
    branches:
      - agent/670-eager-media-metadata
    paths:
      - .github/workflows/agent-670-singleflight-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/670-eager-media-metadata
      - name: Apply atomic single-flight fix and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gooru/background.go')
          text = path.read_text()
          start = text.index('func (c *Client) CreateBackgroundOperationWithTasks(')
          end = text.index('// ClaimBackgroundOperationProducer', start)
          replacement = r'''func (c *Client) CreateBackgroundOperationWithTasks(operationRequest BackgroundOperationRequest, taskRequests []BackgroundTaskRequest) (BackgroundOperation, []BackgroundTask, error) {
          operation, tasks, _, err := c.createBackgroundOperationWithTasks(operationRequest, taskRequests, false)
          return operation, tasks, err
          }

          // createBackgroundOperationWithTasksSingleFlight creates one operation and its
          // child tasks only when no pending/running operation of the same kind exists.
          // The active lookup and creation share the Store's immediate transaction, so
          // independent clients cannot both pass the lookup and create duplicate work.
          func (c *Client) createBackgroundOperationWithTasksSingleFlight(operationRequest BackgroundOperationRequest, taskRequests []BackgroundTaskRequest) (BackgroundOperation, []BackgroundTask, bool, error) {
          return c.createBackgroundOperationWithTasks(operationRequest, taskRequests, true)
          }

          func (c *Client) createBackgroundOperationWithTasks(operationRequest BackgroundOperationRequest, taskRequests []BackgroundTaskRequest, singleFlight bool) (BackgroundOperation, []BackgroundTask, bool, error) {
          tx, err := c.store.Begin()
          if err != nil {
          return BackgroundOperation{}, nil, false, fmt.Errorf("begin background operation transaction: %w", err)
          }
          defer func() { _ = tx.Rollback() }()

          if singleFlight {
          _, found, err := c.store.FindActiveBackgroundOperationIDByKind(tx, operationRequest.Kind)
          if err != nil {
          return BackgroundOperation{}, nil, false, fmt.Errorf("inspect active background operation: %w", err)
          }
          if found {
          return BackgroundOperation{}, nil, false, nil
          }
          }

          operation, err := c.createBackgroundOperation(tx, operationRequest)
          if err != nil {
          return BackgroundOperation{}, nil, false, err
          }

          tasks := make([]BackgroundTask, 0, len(taskRequests))
          for index, request := range taskRequests {
          if request.OperationID != "" {
          return BackgroundOperation{}, nil, false, fmt.Errorf("background child task %d already belongs to operation %q", index, request.OperationID)
          }
          if request.Operation != nil {
          return BackgroundOperation{}, nil, false, fmt.Errorf("background child task %d requests a nested operation", index)
          }
          request.OperationID = operation.ID
          if request.DedupeKey == "" {
          request.DedupeKey = fmt.Sprintf("task:%d", index)
          }
          request.DedupeKey = operation.ID + ":" + request.DedupeKey
          task, created, err := c.enqueueBackgroundTask(tx, request)
          if err != nil {
          return BackgroundOperation{}, nil, false, fmt.Errorf("enqueue background child task %d: %w", index, err)
          }
          if !created {
          return BackgroundOperation{}, nil, false, fmt.Errorf("enqueue background child task %d: scoped dedupe key already active", index)
          }
          tasks = append(tasks, task)
          }

          if err := tx.Commit(); err != nil {
          return BackgroundOperation{}, nil, false, fmt.Errorf("commit background operation transaction: %w", err)
          }
          if operation.Visible {
          c.notifyBackgroundOperationChange()
          }
          return operation, tasks, true, nil
          }

          '''
          path.write_text(text[:start] + replacement + text[end:])

          path = Path('gooru/media_metadata_sweep.go')
          text = path.read_text()
          start = text.index('func (c *Client) RunMediaMetadataSweep()')
          end = text.index('// EnsureMediaMetadataSweep', start)
          replacement = r'''func (c *Client) RunMediaMetadataSweep() (bool, error) {
          task, err := newMediaMetadataSweepTaskRequest()
          if err != nil {
          return false, err
          }
          _, tasks, created, err := c.createBackgroundOperationWithTasksSingleFlight(BackgroundOperationRequest{
          Kind:    BackgroundMediaMetadataSweepOperationKind,
          Visible: true,
          }, []BackgroundTaskRequest{task})
          if err != nil {
          return false, fmt.Errorf("enqueue media metadata sweep: %w", err)
          }
          if !created {
          return false, nil
          }
          if len(tasks) != 1 {
          return false, fmt.Errorf("enqueue media metadata sweep created %d tasks, want 1", len(tasks))
          }
          return true, nil
          }

          '''
          path.write_text(text[:start] + replacement + text[end:])

          path = Path('gooru/media_metadata_registration_test.go')
          text = path.read_text()
          text = text.replace('"path/filepath"\n\t"testing"', '"path/filepath"\n\t"sync"\n\t"testing"', 1)
          marker = 'func TestEnsureMediaMetadataSweepRecoversMissingWakeWithoutDuplicates'
          index = text.index(marker)
          regression = r'''func TestRunMediaMetadataSweepIsAtomicAcrossClients(t *testing.T) {
          dbPath := filepath.Join(t.TempDir(), "gooru.db")
          if err := Init(dbPath, types.StrategyFull, false); err != nil {
          t.Fatalf("Init: %v", err)
          }

          const clientCount = 8
          clients := make([]*Client, 0, clientCount)
          for i := 0; i < clientCount; i++ {
          client, err := New(dbPath, false)
          if err != nil {
          t.Fatalf("open client %d: %v", i, err)
          }
          clients = append(clients, client)
          }
          t.Cleanup(func() {
          for _, client := range clients {
          _ = client.Close()
          }
          })

          start := make(chan struct{})
          created := make(chan bool, clientCount)
          errs := make(chan error, clientCount)
          var wg sync.WaitGroup
          for _, client := range clients {
          client := client
          wg.Add(1)
          go func() {
          defer wg.Done()
          <-start
          didCreate, err := client.RunMediaMetadataSweep()
          if err != nil {
          errs <- err
          return
          }
          created <- didCreate
          }()
          }
          close(start)
          wg.Wait()
          close(created)
          close(errs)

          for err := range errs {
          t.Errorf("concurrent manual metadata sweep: %v", err)
          }
          createdCount := 0
          for didCreate := range created {
          if didCreate {
          createdCount++
          }
          }
          if createdCount != 1 {
          t.Fatalf("created metadata sweep count = %d, want 1", createdCount)
          }

          operations, err := clients[0].ListBackgroundOperations(BackgroundOperationListOptions{VisibleOnly: true})
          if err != nil {
          t.Fatalf("list visible operations: %v", err)
          }
          if len(operations) != 1 || operations[0].Kind != BackgroundMediaMetadataSweepOperationKind || operations[0].Status != BackgroundWorkPending {
          t.Fatalf("unexpected concurrent manual metadata operations: %+v", operations)
          }
          }

          '''
          path.write_text(text[:index] + regression + text[index:])
          PY
          gofmt -w gooru/background.go gooru/media_metadata_sweep.go gooru/media_metadata_registration_test.go
          go test ./gooru -run 'TestRunMediaMetadataSweep|TestEnsureMediaMetadataSweep|TestDefaultRegistrationMetadataSweep'
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add gooru/background.go gooru/media_metadata_sweep.go gooru/media_metadata_registration_test.go
          git commit -m 'fix(jobs): make manual metadata sweep single-flight'
          git push origin HEAD:agent/670-eager-media-metadata
