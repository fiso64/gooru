name: Maintainer opaque storage validation

on:
  push:
    branches:
      - feat/28-opaque-managed-storage

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply maintainer patch
        shell: bash
        env:
          PATCH_ZB64: ""
        run: |
          python - <<'PY'
          import base64, os, zlib
          open('/tmp/opaque.patch','wb').write(zlib.decompress(base64.b64decode(os.environ['PATCH_ZB64'])))
          PY
          git apply --check /tmp/opaque.patch
          git apply /tmp/opaque.patch
          gofmt -w cmd gooru internal types
          git diff --check
      - name: Focused tests
        run: go test ./cmd/gooru/cmd ./gooru ./internal/serve
      - name: Full tests
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Commit validated slice
        if: success()
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email 'chatgpt-codex-connector@users.noreply.github.com'
          git add cmd gooru internal types
          git commit -m 'feat(storage): hide protected managed filenames'
          git push
