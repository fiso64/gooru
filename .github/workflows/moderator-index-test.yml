name: Moderator index integration test

on:
  push:
    branches: [develop]

jobs:
  post-owner-feedback:
    if: github.event.head_commit.message == 'Run moderator index pending test'
    runs-on: gooru-moderator
    env:
      GH_TOKEN: ${{ secrets.MODERATOR_STATE_TOKEN }}
    steps:
      - name: Post owner-authored test feedback
        run: >-
          gh api --method POST repos/${{ github.repository }}/issues/507/comments
          -f body='Moderator index integration test: temporary owner feedback.'
