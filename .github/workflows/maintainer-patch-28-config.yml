name: Maintainer patch 28 config

on:
  push:
    branches:
      - feat/28-encryption-config

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.head_commit.message == 'ci: apply encryption config patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/28-encryption-config
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply config integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/serve/config.go')
          text = path.read_text()

          replacements = [
              (
                  '\t"time"\n\n\t"gopkg.in/yaml.v3"',
                  '\t"time"\n\n\t"gooru.local/internal/securekey"\n\t"gopkg.in/yaml.v3"',
              ),
              (
                  '\tDatabase DatabaseConfig `yaml:"database"`\n\tAuth     AuthConfig     `yaml:"auth"`',
                  '\tDatabase   DatabaseConfig   `yaml:"database"`\n\tEncryption EncryptionConfig `yaml:"encryption"`\n\tAuth       AuthConfig       `yaml:"auth"`',
              ),
              (
                  'type DatabaseConfig struct {\n\tPath string `yaml:"path"`\n}\n\ntype AuthConfig struct {',
                  'type DatabaseConfig struct {\n\tPath string `yaml:"path"`\n}\n\ntype EncryptionConfig struct {\n\tEnabled bool   `yaml:"enabled"`\n\tKey     []byte `yaml:"-"`\n}\n\ntype AuthConfig struct {',
              ),
              (
                  'func (cfg *Config) ResolveSecrets() error {\n\treturn nil\n}',
                  '''func (cfg *Config) ResolveSecrets() error {\n\tif !cfg.Encryption.Enabled {\n\t\tcfg.Encryption.Key = nil\n\t\treturn nil\n\t}\n\tkey, configured, err := securekey.LoadProcess()\n\tif err != nil {\n\t\treturn fmt.Errorf("resolve encryption key: %w", err)\n\t}\n\tif !configured {\n\t\treturn fmt.Errorf("encryption.enabled requires an encryption key via %s or %s", securekey.EnvKey, securekey.EnvKeyFile)\n\t}\n\tcfg.Encryption.Key = key\n\treturn nil\n}''',
              ),
              (
                  '\tif strings.TrimSpace(cfg.Database.Path) == "" {\n\t\terrs = append(errs, errors.New("database.path is required"))\n\t}\n\tif cfg.Server.MaxRequestBodyBytes <= 0 {',
                  '\tif strings.TrimSpace(cfg.Database.Path) == "" {\n\t\terrs = append(errs, errors.New("database.path is required"))\n\t}\n\tif cfg.Encryption.Enabled && len(cfg.Encryption.Key) != securekey.Size {\n\t\terrs = append(errs, errors.New("encryption.enabled requires a resolved 256-bit encryption key"))\n\t}\n\tif cfg.Server.MaxRequestBodyBytes <= 0 {',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one config patch target, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          gofmt -w internal/serve/config.go internal/serve/config_encryption_test.go
      - name: Go build
        run: go build ./...
      - name: Go tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name 'Gooru Maintainer'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git add internal/serve/config.go internal/serve/config_encryption_test.go
          git diff --cached --check
          git commit -m 'feat(encryption): resolve key into server config'
          git push origin HEAD:feat/28-encryption-config
