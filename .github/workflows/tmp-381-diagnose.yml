name: Temporary PR 381 Repair Diagnostic

on:
  push:
    branches:
      - fix/349-selection-snapshots

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/349-selection-snapshots
      - name: Extract and run repair script
        id: repair
        shell: bash
        continue-on-error: true
        run: |
          set +e
          awk '/python3 <<'"'"'PY'"'"'/{capture=1; next} /^          PY$/{capture=0} capture { sub(/^          /, ""); print }' .github/workflows/tmp-381-repair.yml > /tmp/pr381-repair.py
          python3 -m py_compile /tmp/pr381-repair.py > repair.log 2>&1
          compile_status=$?
          if [ "$compile_status" -eq 0 ]; then
            python3 /tmp/pr381-repair.py >> repair.log 2>&1
            run_status=$?
          else
            run_status=$compile_status
          fi
          printf '\ncompile_status=%s run_status=%s\n' "$compile_status" "$run_status" >> repair.log
          cat repair.log
          exit "$run_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr381-repair-diagnostic
          path: repair.log
      - name: Fail if repair failed
        if: steps.repair.outcome == 'failure'
        run: exit 1
