name: Temporary PR 381 Go Diagnostic

on:
  push:
    branches:
      - fix/349-selection-snapshots

jobs:
  diagnose:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/349-selection-snapshots
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply pending bulk-target repair
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /- name: Centralize bulk target resolution/ { found=1; next }
            found && /run: \|/ { inrun=1; next }
            inrun && /- name: Go tests/ { exit }
            inrun { sub(/^          /, ""); print }
          ' .github/workflows/tmp-381-finish.yml > /tmp/apply-381.sh
          bash /tmp/apply-381.sh
      - name: Capture Go tests
        id: gotest
        shell: bash
        run: |
          set +e
          go test ./internal/serve ./internal/database ./gooru/... > /tmp/go-test.log 2>&1
          status=$?
          cat /tmp/go-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr381-go-test
          path: /tmp/go-test.log
      - name: Preserve failure status
        shell: bash
        run: exit "${{ steps.gotest.outputs.status }}"
