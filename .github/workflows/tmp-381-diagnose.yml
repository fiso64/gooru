name: Temporary PR 381 Repair Diagnostic

on:
  push:
    branches:
      - fix/349-selection-snapshots

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/349-selection-snapshots
      - name: Exercise repair commands
        shell: bash
        run: |
          set +e
          : > repair.log
          awk '/python3 <<'"'"'PY'"'"'/{capture=1; next} /^          PY$/{capture=0} capture { sub(/^          /, ""); print }' .github/workflows/tmp-381-repair.yml > /tmp/pr381-repair.py
          echo "extract=$?" >> repair.log
          python3 -m py_compile /tmp/pr381-repair.py >> repair.log 2>&1
          echo "compile=$?" >> repair.log
          python3 /tmp/pr381-repair.py >> repair.log 2>&1
          echo "repair=$?" >> repair.log
          gofmt -w internal/serve/browse.go internal/serve/file_selections.go internal/serve/file_selections_test.go internal/serve/server.go gooru/query.go internal/database/database.go >> repair.log 2>&1
          echo "gofmt=$?" >> repair.log
          git diff --check >> repair.log 2>&1
          echo "diff_check=$?" >> repair.log
          git status --short >> repair.log 2>&1
          echo "status=$?" >> repair.log
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/components/AuthenticatedApp.svelte internal/serve/server.go internal/serve/browse.go internal/serve/file_selections.go internal/serve/file_selections_test.go gooru/query.go internal/database/database.go >> repair.log 2>&1
          echo "add=$?" >> repair.log
          git diff --cached --quiet
          echo "cached_quiet=$?" >> repair.log
          cat repair.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr381-repair-command-diagnostic
          path: repair.log
