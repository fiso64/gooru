name: validate-viewer-animation
on:
  push:
    branches:
      - fix/21-viewer-animation-regressions

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go build
        run: go build ./...
      - name: Go tests
        run: go test ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Viewer animation browser regressions
        working-directory: frontend
        run: npx playwright test tests/viewer-animation.spec.ts --project=chromium
