name: Temporary #311 runner

on:
  push:
    branches:
      - feat/311-paged-library-ui
    paths-ignore:
      - .github/tmp-311-validation.log

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/311-paged-library-ui
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Go
        run: |
          go test ./...
          go build ./...
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Capture frontend check
        id: frontend_check
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run check > ../.github/tmp-311-validation.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist frontend diagnostic
        if: steps.frontend_check.outputs.status != '0'
        shell: bash
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/tmp-311-validation.log
          git commit -m 'ci: capture #311 frontend diagnostic' || true
          git push origin HEAD:feat/311-paged-library-ui
      - name: Fail on frontend check error
        if: steps.frontend_check.outputs.status != '0'
        run: exit 1
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run test:unit
          npm run build
      - name: Validate paged browsing in Chromium
        working-directory: frontend
        run: npx playwright test tests/paged-library.spec.ts --project=chromium
