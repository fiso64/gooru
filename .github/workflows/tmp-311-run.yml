name: Temporary #311 runner

on:
  push:
    branches:
      - feat/311-paged-library-ui

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/311-paged-library-ui
          fetch-depth: 0
      - name: Reconcile current develop
        shell: bash
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin develop
          before=$(git rev-parse HEAD)
          git rebase origin/develop
          after=$(git rev-parse HEAD)
          if [ "$before" != "$after" ]; then
            git push --force-with-lease origin HEAD:feat/311-paged-library-ui
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Go
        run: |
          go test ./...
          go build ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          npm run build
      - name: Validate paged browsing in Chromium
        working-directory: frontend
        run: npx playwright test tests/paged-library.spec.ts --project=chromium
