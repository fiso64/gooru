name: Temporary #311 runner

on:
  push:
    branches:
      - feat/311-paged-library-ui

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/311-paged-library-ui
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply implementation staged in companion workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/tmp-311-implement.yml').read_text()
          body = source.split("python3 <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, 'tmp-311-implement.py', 'exec'))
          PY
          gofmt -w internal/serve/ui_config.go internal/serve/config_test.go
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/serve/ui_config.go internal/serve/config_test.go frontend/src/lib/queries/files.ts frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/components/MediaGrid.svelte frontend/tests/paged-library.spec.ts docs/CONFIG.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat(ui): add paged library browsing mode'
            git push origin HEAD:feat/311-paged-library-ui
          fi
      - name: Validate Go
        run: |
          go test ./...
          go build ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          npm run build
      - name: Validate paged browsing in Chromium
        working-directory: frontend
        run: npx playwright test tests/paged-library.spec.ts --project=chromium
