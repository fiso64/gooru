name: Fix 344 toggle order

on: [push]

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/344-pagination-toggle-order
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text()
          sort_block = '''            <div class="seg" aria-label="Sort field">
              {#each [{ value: 'added', label: 'Added' }, { value: 'name', label: 'Name' }, { value: 'size', label: 'Size' }] as option}
                <button
                  class:active={library.sort === option.value}
                  type="button"
                  onclick={() => (library.sort = option.value as FileSort)}
                >
                  {option.label}
                </button>
              {/each}
            </div>
            <button class="g-btn g-btn-sm" type="button" title="Sort direction" onclick={() => (library.order = library.order === 'desc' ? 'asc' : 'desc')}>
              <Icon name="sort" size={14} /> {library.order === 'desc' ? 'Newest' : 'Oldest'}
            </button>'''
          mode_block = '''            <div class="seg" aria-label="Library display mode">
              {#each [{ value: 'infinite', label: 'Infinite' }, { value: 'paged', label: 'Paged' }] as option}
                <button
                  class:active={effectivePaginationMode === option.value}
                  type="button"
                  aria-pressed={effectivePaginationMode === option.value}
                  onclick={() => setPaginationMode(option.value as PaginationMode)}
                >
                  {option.label}
                </button>
              {/each}
            </div>'''
          old = sort_block + '\n' + mode_block
          new = mode_block + '\n' + sort_block
          if text.count(old) != 1:
              raise SystemExit('library action ordering marker not unique')
          app.write_text(text.replace(old, new))

          spec = Path('frontend/tests/paged-library.spec.ts')
          text = spec.read_text()
          marker = "  await page.goto('/?page=3');\n  await expect(page.getByRole('button', { name: 'Page 3', exact: true })).toHaveAttribute('aria-current', 'page');"
          replacement = "  await page.goto('/?page=3');\n  const actionGroups = page.locator('.library-head-actions > [aria-label]');\n  await expect(actionGroups.nth(0)).toHaveAttribute('aria-label', 'Library display mode');\n  await expect(actionGroups.nth(1)).toHaveAttribute('aria-label', 'Sort field');\n  await expect(page.getByRole('button', { name: 'Page 3', exact: true })).toHaveAttribute('aria-current', 'page');"
          if text.count(marker) != 1:
              raise SystemExit('paged-library marker not unique')
          spec.write_text(text.replace(marker, replacement))
          PY
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          npm run build
          npx playwright test tests/paged-library.spec.ts --project=chromium
      - name: Commit validated change
        shell: bash
        run: |
          rm .github/workflows/fix-344-toggle-order.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(ui): place pagination mode before sort controls'
          git push origin HEAD:fix/344-pagination-toggle-order