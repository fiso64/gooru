name: Maintainer #333 batch refresh

on:
  push:
    branches:
      - perf/333-batch-upload-cache-refresh

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'coalesce upload cache refresh') }}
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch upload cache refresh policy and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          library = Path('frontend/src/lib/queries/library.ts')
          text = library.read_text()
          old = """export function createUploadMutation(getCSRFToken: () => string, queryClient: QueryClient) {\n  return createMutation<Job | UploadImportResponse, Error, UploadVariables>(() => ({\n    mutationFn: ({ files, tags, preferAsync, targetID, conflictPolicy, addedAtStrategy, queueTimeMs, queueFirstTimeMs, queueLastTimeMs, queueIndex, queueTotal, onProgress }) =>\n      new ApiClient(getCSRFToken()).uploadFiles(files, tags, preferAsync, targetID, conflictPolicy, onProgress, {\n        addedAtStrategy,\n        queueTimeMs: [queueTimeMs],\n        queueFirstTimeMs,\n        queueLastTimeMs,\n        queueIndex: [queueIndex],\n        queueTotal: [queueTotal]\n      }),\n    onSuccess: async () => {\n      await Promise.all([\n        queryClient.invalidateQueries({ queryKey: ['files'] }),\n        queryClient.invalidateQueries({ queryKey: ['jobs'] }),\n        queryClient.invalidateQueries({ queryKey: libraryKeys.tagsRoot })\n      ]);\n    }\n  }));\n}\n"""
          new = """export function createUploadMutation(getCSRFToken: () => string) {\n  return createMutation<Job | UploadImportResponse, Error, UploadVariables>(() => ({\n    mutationFn: ({ files, tags, preferAsync, targetID, conflictPolicy, addedAtStrategy, queueTimeMs, queueFirstTimeMs, queueLastTimeMs, queueIndex, queueTotal, onProgress }) =>\n      new ApiClient(getCSRFToken()).uploadFiles(files, tags, preferAsync, targetID, conflictPolicy, onProgress, {\n        addedAtStrategy,\n        queueTimeMs: [queueTimeMs],\n        queueFirstTimeMs,\n        queueLastTimeMs,\n        queueIndex: [queueIndex],\n        queueTotal: [queueTotal]\n      })\n  }));\n}\n\nexport async function refreshUploadQueries(queryClient: QueryClient) {\n  await Promise.all([\n    queryClient.invalidateQueries({ queryKey: ['files'] }),\n    queryClient.invalidateQueries({ queryKey: ['jobs'] }),\n    queryClient.invalidateQueries({ queryKey: libraryKeys.tagsRoot })\n  ]);\n}\n"""
          assert text.count(old) == 1
          library.write_text(text.replace(old, new))

          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text()
          text = text.replace('    createUploadMutation,\n    createUploadTargetsQuery', '    createUploadMutation,\n    createUploadTargetsQuery,\n    refreshUploadQueries')
          assert 'const uploadMutation = createUploadMutation(() => $authState.csrfToken, queryClient);' in text
          text = text.replace('const uploadMutation = createUploadMutation(() => $authState.csrfToken, queryClient);', 'const uploadMutation = createUploadMutation(() => $authState.csrfToken);')
          old = """    const result = upload.applyJob(job);\n    if (result.completed) void jobsQuery.refetch();"""
          new = """    const result = upload.applyJob(job);\n    if (result.changedFiles) void refreshUploadQueries(queryClient);\n    if (result.completed) void jobsQuery.refetch();"""
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = """      const result = await upload.submit((variables) => uploadMutation.mutateAsync(variables));\n      if (result.queued) void jobsQuery.refetch();"""
          new = """      const result = await upload.submit((variables) => uploadMutation.mutateAsync(variables));\n      if (result.changedFiles) await refreshUploadQueries(queryClient);\n      if (result.queued) void jobsQuery.refetch();"""
          assert text.count(old) == 1
          app.write_text(text.replace(old, new))

          spec = Path('frontend/tests/upload-concurrency.spec.ts')
          text = spec.read_text()
          old = "async function mockApp(page: Page, uploadJobStatus: JobStatus = 'pending', onBatchRequest?: (ids: string[]) => void) {"
          new = "async function mockApp(page: Page, uploadJobStatus: JobStatus = 'pending', onBatchRequest?: (ids: string[]) => void, onLibraryRefresh?: (kind: 'jobs' | 'tags') => void) {"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "await page.route('**/api/v1/jobs', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));"
          new = "await page.route('**/api/v1/jobs', async (route) => { onLibraryRefresh?.('jobs'); await route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }); });"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "await page.route('**/api/v1/tags?**', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ tags: [] }) }));"
          new = "await page.route('**/api/v1/tags?**', async (route) => { onLibraryRefresh?.('tags'); await route.fulfill({ contentType: 'application/json', body: JSON.stringify({ tags: [] }) }); });"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = """test('large completed WebUI uploads do not wait for timer-driven job-status batches', async ({ page }) => {\n  let statusBatchRequests = 0;\n  await mockApp(page, 'completed', () => statusBatchRequests += 1);\n\n  let requestCount = 0;"""
          new = """test('large completed WebUI uploads coalesce cache refresh and do not wait for timer-driven job-status batches', async ({ page }) => {\n  let statusBatchRequests = 0;\n  let jobsListRequests = 0;\n  let tagsRequests = 0;\n  await mockApp(page, 'completed', () => statusBatchRequests += 1, (kind) => {\n    if (kind === 'jobs') jobsListRequests += 1;\n    else tagsRequests += 1;\n  });\n\n  let requestCount = 0;"""
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = """  await page.locator('input[type=\"file\"]').setInputFiles(\n    Array.from({ length: total }, (_, index) => ({\n      name: `batch-${index + 1}.jpg`,\n      mimeType: 'image/jpeg',\n      buffer: Buffer.from(`batch-${index + 1}`)\n    }))\n  );\n  await page.getByRole('button', { name: /Upload 130 files/ }).click();"""
          new = """  await page.locator('input[type=\"file\"]').setInputFiles(\n    Array.from({ length: total }, (_, index) => ({\n      name: `batch-${index + 1}.jpg`,\n      mimeType: 'image/jpeg',\n      buffer: Buffer.from(`batch-${index + 1}`)\n    }))\n  );\n  const jobsBeforeUpload = jobsListRequests;\n  const tagsBeforeUpload = tagsRequests;\n  await page.getByRole('button', { name: /Upload 130 files/ }).click();"""
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = """  expect(statusBatchRequests).toBe(0);\n});"""
          new = """  expect(statusBatchRequests).toBe(0);\n  await expect.poll(() => jobsListRequests - jobsBeforeUpload).toBe(1);\n  await expect.poll(() => tagsRequests - tagsBeforeUpload).toBe(1);\n});"""
          assert text.count(old) == 1
          spec.write_text(text.replace(old, new))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Check frontend
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Upload concurrency browser regression
        working-directory: frontend
        run: npx playwright test tests/upload-concurrency.spec.ts --project=chromium
      - name: Commit validated fix
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add frontend/src/lib/queries/library.ts frontend/src/lib/components/AuthenticatedApp.svelte frontend/tests/upload-concurrency.spec.ts
          git commit -m 'perf(ui): coalesce upload cache refresh'
          git push origin HEAD:perf/333-batch-upload-cache-refresh
