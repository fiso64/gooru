name: maintainer-249-removal-lifecycle

on:
  push:
    branches: [feat/249-upload-item-tags]
    paths:
      - .github/workflows/maintainer-249-removal-lifecycle.yml

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/249-upload-item-tags
          fetch-depth: 0
      - name: Align removal confirmation lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dialog = Path('frontend/src/lib/components/UploadViewerDialog.svelte')
          text = dialog.read_text()
          old = '''  let remoteNestedNavigation = $state(false);\n  let tagDraft = $state('');'''
          new = '''  let remoteNestedNavigation = $state(false);\n  let observedItem = $state<UploadItem | undefined>();\n  let tagDraft = $state('');'''
          if old not in text:
              raise SystemExit('observed item declaration anchor missing')
          text = text.replace(old, new, 1)

          old = '''  $effect(() => {\n    if (activeIndex === observedIndex) return;\n    observedIndex = activeIndex;\n    tagDraft = '';\n    tagMode = 'add';\n    tagOverride = undefined;\n    remoteNestedNavigation = false;\n  });'''
          new = '''  $effect(() => {\n    const item = activeItem;\n    if (!item) {\n      onClose();\n      return;\n    }\n    if (activeIndex === observedIndex) {\n      if (observedItem && item !== observedItem) onClose();\n      return;\n    }\n    observedIndex = activeIndex;\n    observedItem = item;\n    tagDraft = '';\n    tagMode = 'add';\n    tagOverride = undefined;\n    remoteNestedNavigation = false;\n  });'''
          if old not in text:
              raise SystemExit('active item effect anchor missing')
          text = text.replace(old, new, 1)

          old = '''  $effect(() => {\n    if (!activeItem) onClose();\n  });\n\n'''
          if old not in text:
              raise SystemExit('legacy close effect anchor missing')
          text = text.replace(old, '', 1)

          old = '''    onUntrack={(file) => {\n      onClose();\n      onRemoteUntrack(file);\n    }}\n    onDelete={(file) => {\n      onClose();\n      onRemoteDelete(file);\n    }}'''
          new = '''    onUntrack={onRemoteUntrack}\n    onDelete={onRemoteDelete}'''
          if old not in text:
              raise SystemExit('remote removal callback anchor missing')
          dialog.write_text(text.replace(old, new, 1))

          spec = Path('frontend/tests/upload-viewer.spec.ts')
          text = spec.read_text()
          old = '''  await page.keyboard.press('Delete');\n  const removalDialog = page.getByRole('dialog', { name: 'Remove from library' });\n  await expect(removalDialog).toBeVisible();\n  await removalDialog.getByRole('button', { name: 'Remove' }).click();\n  await expect.poll(() => fileRemovals).toEqual([{ method: 'DELETE', body: { mode: 'untrack' } }]);\n  await expect(page.getByRole('button', { name: 'Preview duplicate.png' })).toHaveCount(0);'''
          new = '''  await page.keyboard.press('Delete');\n  const removalDialog = page.getByRole('dialog', { name: 'Remove from library' });\n  await expect(removalDialog).toBeVisible();\n  await expect(dialog).toBeVisible();\n  await removalDialog.getByRole('button', { name: 'Remove' }).click();\n  await expect.poll(() => fileRemovals).toEqual([{ method: 'DELETE', body: { mode: 'untrack' } }]);\n  await expect(dialog).toHaveCount(0);\n  await expect(page.getByRole('button', { name: 'Preview duplicate.png' })).toHaveCount(0);'''
          if old not in text:
              raise SystemExit('remote removal browser test anchor missing')
          spec.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/maintainer-249-removal-lifecycle.yml
          git config user.name 'fiso64'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git add frontend/src/lib/components/UploadViewerDialog.svelte frontend/tests/upload-viewer.spec.ts .github/workflows/maintainer-249-removal-lifecycle.yml
          git commit -m 'fix(upload): preserve viewer through removal confirm'
          git push origin HEAD:feat/249-upload-item-tags
