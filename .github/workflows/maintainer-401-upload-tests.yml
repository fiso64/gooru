name: Maintainer 401 upload test migration
on:
  push:
    branches:
      - maintainer/401-durable-upload-http-v2
permissions:
  contents: write
jobs:
  migrate:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/401-durable-upload-http-v2
      - name: Patch real-library upload tests
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("internal/serve/uploads_test.go"); s=p.read_text(); old="\tdefer client.Close()\n"; assert s.count(old)==3, s.count(old); s=s.replace(old,"\tt.Cleanup(func() { _ = client.Close() })\n"); old="\tserver := newUploadTestServer(t, uploadDir, true, NewGooruLibrary(client, false))\n"; assert s.count(old)==2, s.count(old); s=s.replace(old,old+"\tstartTestBackgroundRuntime(t, server, client, \"test-gooru-upload\")\n"); old="\tserver := NewServerWithLibrary(cfg, NewGooruLibrary(client, false))\n"; assert s.count(old)==1, s.count(old); s=s.replace(old,old+"\tstartTestBackgroundRuntime(t, server, client, \"test-gooru-video-upload\")\n"); p.write_text(s)'
          gofmt -w internal/serve/uploads_test.go
      - name: Focused upload tests
        run: go test ./internal/serve -run 'Upload' -count=1 -timeout=5m
      - name: Persist test migration
        shell: bash
        run: |
          rm .github/workflows/maintainer-401-upload-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(upload): run real-library tests with durable worker'
          git push origin HEAD:maintainer/401-durable-upload-http-v2
