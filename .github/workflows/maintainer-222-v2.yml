name: maintainer-222-v2
on:
  push:
    branches: [feat/222-filename-contains-metatag]
permissions:
  contents: write
jobs:
  validate:
    if: "${{ ! contains(github.event.head_commit.message, '[maintainer-222]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply maintained patch
        run: python3 .github/maintainer-222.py
      - name: Format Go
        run: gofmt -w internal/serve/search_saved.go internal/serve/openapi_test.go internal/query/metatags_test.go internal/serve/search_saved_metatags_test.go
      - name: Generate API types
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
      - name: Validate Go
        run: go test ./internal/query ./internal/serve
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run test:unit
          npm run check
          npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal frontend docs
          git commit -m "feat(query): finish backend-owned metatag contract [maintainer-222]"
          git push
