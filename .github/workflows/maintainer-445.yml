name: maintainer-445

on:
  push:
    branches:
      - fix/445-upload-conflict-default-rename

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply upload conflict fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'internal/serve/config.go': [
                  ('Uploads: UploadsConfig{Enabled: false, ConflictPolicy: "skip", PreserveModTime: true}', 'Uploads: UploadsConfig{Enabled: false, ConflictPolicy: "rename", PreserveModTime: true}'),
              ],
              'internal/serve/uploads.go': [
                  ('if fallback == "" {\n\t\treturn "skip", nil\n\t}', 'if fallback == "" {\n\t\treturn "rename", nil\n\t}'),
              ],
              'internal/serve/config_upload_policy_test.go': [
                  ('func TestDefaultUploadConflictPolicyIsSkip(t *testing.T) {', 'func TestDefaultUploadConflictPolicyIsRename(t *testing.T) {'),
                  ('if cfg.Uploads.ConflictPolicy != "skip" {\n\t\tt.Fatalf("expected default uploads.conflict_policy=skip, got %q", cfg.Uploads.ConflictPolicy)\n\t}', 'if cfg.Uploads.ConflictPolicy != "rename" {\n\t\tt.Fatalf("expected default uploads.conflict_policy=rename, got %q", cfg.Uploads.ConflictPolicy)\n\t}'),
                  ('if policy != "skip" {\n\t\tt.Fatalf("expected omitted conflict policy to resolve to skip, got %q", policy)\n\t}', 'if policy != "rename" {\n\t\tt.Fatalf("expected omitted conflict policy to resolve to rename, got %q", policy)\n\t}'),
              ],
              'internal/serve/uploads_test.go': [
                  ('func TestUploadOmittedConflictPolicySkipsExistingName(t *testing.T) {', 'func TestUploadOmittedConflictPolicyRenamesExistingName(t *testing.T) {'),
                  ('if got := string(mustReadFile(t, filepath.Join(dir, "a.txt"))); got != "existing" {\n\t\tt.Fatalf("existing file was overwritten: %q", got)\n\t}\n\tvar response UploadImportResponse\n\tif err := json.NewDecoder(rec.Body).Decode(&response); err != nil {\n\t\tt.Fatalf("decode response: %v", err)\n\t}\n\tif len(response.Files) != 1 || response.Files[0].Status != "skipped" {\n\t\tt.Fatalf("expected skipped response, got %+v", response.Files)\n\t}\n}\n\nfunc TestUploadRequestedConflictPolicySkipReturnsSkippedFile', 'if got := string(mustReadFile(t, filepath.Join(dir, "a.txt"))); got != "existing" {\n\t\tt.Fatalf("existing file was overwritten: %q", got)\n\t}\n\tif got := string(mustReadFile(t, filepath.Join(dir, "a-1.txt"))); got != "uploaded" {\n\t\tt.Fatalf("renamed upload was not retained: %q", got)\n\t}\n\tvar response UploadImportResponse\n\tif err := json.NewDecoder(rec.Body).Decode(&response); err != nil {\n\t\tt.Fatalf("decode response: %v", err)\n\t}\n\tif len(response.Files) != 1 || response.Files[0].Status != "imported" || response.Files[0].Name != "a-1.txt" {\n\t\tt.Fatalf("expected renamed imported response, got %+v", response.Files)\n\t}\n\tif len(library.paths) != 1 || filepath.Base(library.paths[0]) != "a-1.txt" {\n\t\tt.Fatalf("expected renamed logical import path, got %+v", library.paths)\n\t}\n}\n\nfunc TestUploadRequestedConflictPolicySkipReturnsSkippedFile'),
              ],
              'frontend/src/lib/state/uploadWorkflow.svelte.ts': [
                  ("let conflictPolicy = $state('skip');", "let conflictPolicy = $state('rename');"),
                  ("conflictPolicy = 'skip';", "conflictPolicy = 'rename';"),
              ],
              'frontend/tests/upload-conflict-default.spec.ts': [
                  ("test('WebUI hides conflict policy choices and uploads with skip'", "test('WebUI hides conflict policy choices and uploads with rename'"),
                  ("expect(requestBody).toMatch(/name=\"conflict_policy\"\\r?\\n\\r?\\nskip/);", "expect(requestBody).toMatch(/name=\"conflict_policy\"\\r?\\n\\r?\\nrename/);"),
                  ("expect(requestBody).not.toMatch(/name=\"conflict_policy\"\\r?\\n\\r?\\n(rename|replace)/);", "expect(requestBody).not.toMatch(/name=\"conflict_policy\"\\r?\\n\\r?\\n(skip|replace)/);"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one match for {old!r}, got {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          rm -f .maintainer-trigger-445 .github/workflows/maintainer-445.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(upload): default filename conflicts to rename'
          git push origin HEAD:fix/445-upload-conflict-default-rename
