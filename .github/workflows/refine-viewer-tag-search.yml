name: Refine viewer tag search diff

on:
  push:
    branches: [fix/21-viewer-tag-search]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/21-viewer-tag-search
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Normalize implementation after self-review
        run: |
          git fetch origin main
          git show origin/main:frontend/src/lib/components/PreviewDialog.svelte > frontend/src/lib/components/PreviewDialog.svelte
          python3 - <<'PY'
          from pathlib import Path

          preview = Path('frontend/src/lib/components/PreviewDialog.svelte')
          text = preview.read_text()
          text = text.replace('    onRemoveTag,\n    onUntrack', '    onRemoveTag,\n    onTagSearch,\n    onUntrack', 1)
          text = text.replace('    onRemoveTag: (file: FileItem, tag: string) => void;\n    onUntrack:', '    onRemoveTag: (file: FileItem, tag: string) => void;\n    onTagSearch: (tag: string) => void;\n    onUntrack:', 1)
          old = '''              <span class="g-tag">\n                {#if tag.includes(':')}\n                  <span class="ns">{tag.split(':')[0]}:</span><span>{tag.slice(tag.indexOf(':') + 1)}</span>\n                {:else}\n                  <span>{tag}</span>\n                {/if}\n                <button class="g-tag-x" type="button" aria-label={`Remove ${tag}`} disabled={tagBusy} onclick={() => onRemoveTag(file, tag)}>\n                  <Icon name="close" size={11} />\n                </button>\n              </span>'''
          new = '''              <span class="g-tag">\n                <button class="g-tag-search" type="button" aria-label={`Search for ${tag}`} onclick={() => onTagSearch(tag)}>\n                  {#if tag.includes(':')}\n                    <span class="ns">{tag.split(':')[0]}:</span><span>{tag.slice(tag.indexOf(':') + 1)}</span>\n                  {:else}\n                    <span>{tag}</span>\n                  {/if}\n                </button>\n                <button class="g-tag-x" type="button" aria-label={`Remove ${tag}`} disabled={tagBusy} onclick={() => onRemoveTag(file, tag)}>\n                  <Icon name="close" size={11} />\n                </button>\n              </span>'''
          if old not in text:
              raise SystemExit('tag pill block not found')
          text = text.replace(old, new, 1)
          style_marker = '<style>\n'
          style = '''<style>\n  :global(.lightbox-tag-list .g-tag-search) {\n    display: inline-flex;\n    align-items: center;\n    padding: 0;\n    border: 0;\n    background: transparent;\n    color: inherit;\n    font: inherit;\n    cursor: pointer;\n  }\n\n  :global(.lightbox-tag-list .g-tag-search:focus-visible) {\n    outline: 2px solid var(--accent-line);\n    outline-offset: 2px;\n    border-radius: 2px;\n  }\n\n'''
          if style_marker not in text:
              raise SystemExit('style marker not found')
          preview.write_text(text.replace(style_marker, style, 1))

          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text().replace('onTagSearch={library.runPreviewTagSearch}', 'onTagSearch={library.runTagSearch}', 1)
          app.write_text(text)

          workflow = Path('frontend/src/lib/state/libraryWorkflow.svelte.ts')
          text = workflow.read_text()
          text = text.replace('''\n  function runPreviewTagSearch(query: string) {\n    runTagSearch(query);\n    activeFile = null;\n  }\n''', '')
          text = text.replace('    runTagSearch,\n    runPreviewTagSearch,\n', '    runTagSearch,\n')
          workflow.write_text(text)

          test = Path('frontend/src/lib/state/libraryWorkflow.test.ts')
          text = test.read_text().replace("describe('viewer tag search transition'", "describe('tag search transition'")
          text = text.replace("library.runPreviewTagSearch('artist:example');", "library.runTagSearch('artist:example');")
          test.write_text(text)
          PY
      - name: Backend validation
        run: |
          go build ./...
          go test ./...
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm run test:unit
          npm run check
          npm run build
      - name: Commit refined slice and remove temporary workflow
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-viewer-tag-search.yml
          git add frontend/src/lib/components/PreviewDialog.svelte frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/state/libraryWorkflow.svelte.ts frontend/src/lib/state/libraryWorkflow.test.ts
          git commit -m "refactor(frontend): keep viewer tag search diff focused"
          git push origin HEAD:fix/21-viewer-tag-search
