name: Maintainer Upload Progress Apply

on:
  push:
    branches:
      - maintainer/401-overall-upload-progress

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply upload progress implementation
        shell: bash
        run: |
          python3 .github/maintainer-upload-progress-apply.py
          gofmt -w \
            internal/serve/background_uploads.go \
            internal/serve/uploads_durable.go \
            internal/serve/upload_receiving_progress.go \
            internal/serve/upload_receiving_progress_test.go \
            internal/serve/background_operations.go \
            internal/serve/background_operations_upload_progress_test.go \
            internal/serve/background_operation_recovery.go \
            internal/serve/background_operation_recovery_test.go \
            internal/serve/uploads_durable_test.go \
            internal/database/durable_work_attachment.go \
            internal/database/durable_work_attachment_test.go \
            internal/database/durable_work_recovery.go \
            internal/database/durable_work_recovery_test.go \
            gooru/background.go \
            gooru/background_checkpoint.go
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run generate:api
          npm run check
          npm run test:unit
          cd ..
          go test ./internal/database ./gooru ./internal/serve
          go build ./...
      - name: Commit clean implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/maintainer-upload-progress-apply.yml .github/maintainer-upload-progress-apply.py
          git add docs/openapi.yaml frontend/src/lib/api/openapi.ts frontend/src/lib/api/operations.ts frontend/src/lib/api/operations.progress.test.ts frontend/src/lib/components/JobRow.svelte gooru/background.go gooru/background_checkpoint.go internal/database/durable_work_attachment.go internal/database/durable_work_attachment_test.go internal/database/durable_work_recovery.go internal/database/durable_work_recovery_test.go internal/serve/background_operation_recovery.go internal/serve/background_operation_recovery_test.go internal/serve/background_operations.go internal/serve/background_operations_upload_progress_test.go internal/serve/background_uploads.go internal/serve/uploads_durable.go internal/serve/uploads_durable_test.go internal/serve/upload_receiving_progress.go internal/serve/upload_receiving_progress_test.go
          git commit -m "Show overall upload progress while receiving"
          git push origin HEAD:maintainer/401-overall-upload-progress
