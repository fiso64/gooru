      : fallbackProgress;
''')
          replace('frontend/src/lib/components/JobRow.svelte',
          '''  const percent = $derived(Math.round(Math.max(0, Math.min(1, job.progress ?? 0)) * 100));
''',
          '''  const percent = $derived(job.progress === undefined ? undefined : Math.round(Math.max(0, Math.min(1, job.progress)) * 100));
''')
          replace('frontend/src/lib/components/JobRow.svelte',
          '''  <div class={`job-progress ${visualStatus}`} aria-label={`${percent}% complete`}>
    <div style={`width: ${percent}%`}></div>
  </div>
  <div class="job-meta">
    <span>{percent}%</span>
    {#if detail}<span class="job-detail">{detail}</span>{/if}
  </div>
''',
          '''  {#if percent !== undefined}
    <div class={`job-progress ${visualStatus}`} aria-label={`${percent}% complete`}>
      <div style={`width: ${percent}%`}></div>
    </div>
  {/if}
  <div class="job-meta">
    {#if percent !== undefined}<span>{percent}%</span>{/if}
    {#if detail}<span class="job-detail">{detail}</span>{/if}
  </div>
''')

          # OpenAPI contract for the optional overall fraction.
          replace('docs/openapi.yaml',
          '''        progress_failed:
          type: integer
          format: int64
          minimum: 0
        created_at:
''',
          '''        progress_failed:
          type: integer
          format: int64
          minimum: 0
        progress:
          type: number
          format: double
          minimum: 0
