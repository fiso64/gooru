''')

          # Public DTO carries an optional overall fraction without changing raw file counters.
          replace('internal/serve/background_operations.go',
          '''\tProgressFailed          int64                     `json:"progress_failed"`
\tCreatedAt               time.Time                 `json:"created_at"`
''',
          '''\tProgressFailed          int64                     `json:"progress_failed"`
\tProgress                *float64                  `json:"progress,omitempty"`
\tCreatedAt               time.Time                 `json:"created_at"`
''')
          replace('internal/serve/background_operations.go',
