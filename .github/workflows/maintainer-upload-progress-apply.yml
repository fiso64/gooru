          text = text.replace("    expect(job.progress).toBe(0.8);", "    expect(job.progress).toBe(0.71);", 1)
          text = text.replace("  });\n});", '''  });

  it('leaves receiving uploads indeterminate when the server has no overall fraction', () => {
    const operation: BackgroundOperation = {
      id: 'upload-receiving',
