\ttotal := int64(checkpoint.FileTotal)
''')
          replace('internal/serve/background_operations.go',
          '''\tdto.ProgressTotal = total
\tdto.ProgressCompleted = completed
\tdto.ProgressCompletedPrefix = completedPrefix
\treturn dto
}
''',
          '''\tdto.ProgressTotal = total
\tdto.ProgressCompleted = completed
\tdto.ProgressCompletedPrefix = completedPrefix
\tprogress := 0.5 + 0.5*float64(completed)/float64(total)
\tif operation.Status == core.BackgroundWorkCompleted {
\t\tprogress = 1
\t}
\tif progress > 1 {
\t\tprogress = 1
\t}
\tdto.Progress = &progress
\treturn dto
}
''')

          # Frontend consumes explicit upload overall progress; absent upload progress is indeterminate.
          replace('frontend/src/lib/api/operations.ts',
          '''  progress_failed: number;
  created_at: string;
''',
          '''  progress_failed: number;
  progress?: number;
  created_at: string;
''')
          replace('frontend/src/lib/api/operations.ts',
          '''  const progress = total > 0
    ? Math.max(0, Math.min(1, completed / total))
