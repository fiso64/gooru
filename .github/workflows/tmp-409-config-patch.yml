name: Temporary #409 config patch
on:
  push:
    branches: [feat/409-hover-media-previews]
    paths: [.github/workflows/tmp-409-config-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/409-hover-media-previews
      - name: Patch UI config and docs
        shell: python
        run: |
          from pathlib import Path

          p = Path('internal/serve/config.go')
          text = p.read_text()
          old = '''\tLoadFullMediaByDefault   bool     `yaml:"load_full_media_by_default"`\n\tFullscreenMediaByDefault bool     `yaml:"fullscreen_media_by_default"`\n\tViewerFitMode            string   `yaml:"viewer_fit_mode"`'''
          new = '''\tLoadFullMediaByDefault   bool     `yaml:"load_full_media_by_default"`\n\tFullscreenMediaByDefault bool     `yaml:"fullscreen_media_by_default"`\n\tHoverPlayVideos          bool     `yaml:"hover_play_videos"`\n\tHoverPlayGIFs            bool     `yaml:"hover_play_gifs"`\n\tViewerFitMode            string   `yaml:"viewer_fit_mode"`'''
          if old not in text:
              raise SystemExit('UIConfig field anchor not found')
          text = text.replace(old, new, 1)
          old = '''\t\tUI: UIConfig{\n\t\t\tFontStyle:      "editorial",\n\t\t\tGridSize:       DefaultGridSize,'''
          new = '''\t\tUI: UIConfig{\n\t\t\tFontStyle:       "editorial",\n\t\t\tHoverPlayVideos: true,\n\t\t\tHoverPlayGIFs:   true,\n\t\t\tGridSize:        DefaultGridSize,'''
          if old not in text:
              raise SystemExit('DefaultConfig UI anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('docs/CONFIG.md')
          text = p.read_text()
          old = '''  load_full_media_by_default: false\n  fullscreen_media_by_default: false'''
          new = '''  load_full_media_by_default: false\n  fullscreen_media_by_default: false\n  hover_play_videos: true\n  hover_play_gifs: true'''
          if old not in text:
              raise SystemExit('CONFIG.md UI anchor not found')
          p.write_text(text.replace(old, new, 1))
      - name: Commit patch
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/serve/config.go docs/CONFIG.md
          git diff --cached --check
          git commit -m "feat(config): add hover playback options"
          git push origin HEAD:feat/409-hover-media-previews
