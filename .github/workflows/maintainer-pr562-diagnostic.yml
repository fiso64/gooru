name: Maintainer PR562 diagnostic

on:
  push:
    branches:
      - maintainer/401-restore-protected-upload-retry

permissions:
  contents: read

jobs:
  focused-go-test:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Run focused regression
        id: focused
        shell: bash
        run: |
          set +e
          go test -count=1 -run '^TestProtectedUploadImportFailureRestoresOriginalRetryPathAfterRename$' -v ./internal/serve > /tmp/pr562-focused.txt 2>&1
          status=$?
          cat /tmp/pr562-focused.txt
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused output
        uses: actions/upload-artifact@v4
        with:
          name: pr562-focused-output
          path: /tmp/pr562-focused.txt
          if-no-files-found: error
      - name: Fail when regression failed
        if: steps.focused.outputs.status != '0'
        run: exit 1
