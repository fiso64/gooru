name: Maintainer 251 scaling validate

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go test ./...
      - working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - working-directory: frontend
        run: npm run check && npm run test:unit && npm run build
      - working-directory: frontend
        run: |
          chromium=$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)
          test -n "$chromium"
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$chromium" npx playwright test tests/viewer-fit-mode.spec.ts --project=chromium
