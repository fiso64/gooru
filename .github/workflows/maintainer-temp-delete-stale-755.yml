name: Maintainer temporary stale-branch cleanup

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/maintainer-temp-delete-stale-755.yml

permissions:
  contents: write

jobs:
  delete-stale-branch:
    runs-on: [self-hosted, gooru]
    steps:
      - name: Delete stale branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/maintainer%2F755-cli-registration-sort"
