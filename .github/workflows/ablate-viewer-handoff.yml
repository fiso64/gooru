name: Ablate viewer handoff

on:
  push:
    branches: [fix/22-image-geometry-hold]

permissions:
  contents: write

jobs:
  ablate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/22-image-geometry-hold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Simplify held handoff experiment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/components/ViewerStage.svelte')
          s = p.read_text()
          start = s.index('  type ViewerDebugWindow = Window & { __gooruViewerDebug?: boolean };\n')
          end = s.index('  const renderedFile = $derived', start)
          s = s[:start] + s[end:]
          s = s.replace("      traceViewerFrames('handoff-before', generation);\n", '')
          s = s.replace("      queueMicrotask(() => traceViewerFrames('handoff-after', generation));\n", '')
          old = '''    const transitionAtLoad = transitionGeneration;\n    traceViewerFrames('image-load', transitionAtLoad);\n    if (viewerDebugEnabled()) {\n      void image.decode().then(\n        () => traceViewerFrames('image-decode', transitionAtLoad, 6),\n        () => traceViewerFrames('image-decode-error', transitionAtLoad, 2)\n      );\n    }\n\n    // `load` can run before the new pixels have reached a composited frame. Keep the exact frozen\n    // old pixels through two paints while the correctly-sized target remains visually concealed,\n    // then atomically exchange the two presentations so old and new pixels are never exposed together.\n    const generation = freezeGeneration;\n    requestAnimationFrame(() => requestAnimationFrame(() => {\n      if (generation === freezeGeneration) freezeVisible = false;\n    }));\n'''
          new = '''    // Keep the frozen old pixels until the next paint after target load. The target is already\n    // laid out at final geometry underneath, so changing both visibility states in the same\n    // animation-frame callback presents only one image while avoiding an extra frame of latency.\n    const generation = freezeGeneration;\n    requestAnimationFrame(() => {\n      if (generation === freezeGeneration) freezeVisible = false;\n    });\n'''
          if old not in s:
              raise SystemExit('expected syncImage diagnostic/two-frame block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          git diff -- frontend/src/lib/components/ViewerStage.svelte
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Static check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Focused Chromium viewer coverage
        working-directory: frontend
        run: |
          mapfile -t specs < <(find tests -maxdepth 1 -type f \( -name 'viewer-image-geometry-hold.spec.ts' -o -name '*viewer*animation*.spec.ts' -o -name '*viewer*zoom*.spec.ts' -o -name '*viewer*navigation*.spec.ts' \) -print)
          printf 'Running %s\n' "${specs[@]}"
          test ${#specs[@]} -gt 0
          npx playwright test --project=chromium "${specs[@]}"
      - name: Commit validated simplification and remove workflow
        if: success()
        run: |
          rm .github/workflows/ablate-viewer-handoff.yml
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/ViewerStage.svelte .github/workflows/ablate-viewer-handoff.yml
          git commit -m 'fix(viewer): simplify image presentation handoff'
          git push origin HEAD:fix/22-image-geometry-hold
