name: Temporary media playback validation

on:
  push:
    branches:
      - fix/21-media-playback-routing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair clickable mocked media fixture
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/tests/shortcut-focus.spec.ts")
          text = path.read_text()
          needle = "    const element = node as HTMLMediaElement;\n    let paused = false;"
          replacement = "    const element = node as HTMLMediaElement;\n    element.style.width = '320px';\n    element.style.height = '180px';\n    element.style.display = 'block';\n    let paused = false;"
          if needle in text:
              path.write_text(text.replace(needle, replacement, 1))
      - name: Persist fixture repair
        run: |
          if ! git diff --quiet -- frontend/tests/shortcut-focus.spec.ts; then
            git config user.name "chatgpt-codex-connector"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/tests/shortcut-focus.spec.ts
            git commit -m "test(viewer): make mocked media clickable"
            git push origin HEAD:fix/21-media-playback-routing
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go build
        run: go build ./...
      - name: Go test
        run: go test ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Focused browser regression
        working-directory: frontend
        run: npx playwright test tests/shortcut-focus.spec.ts --project=chromium
