name: temp-21-video-controls-fade
on:
  push:
    branches:
      - fix/21-video-controls-idle-fade
permissions:
  contents: write
jobs:
  validate:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply playback control fade fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/lib/components/ViewerStage.svelte')
          s = p.read_text()
          s = s.replace('''  let videoPaused = $state(true);\n  let videoTime = $state(0);\n  let videoLength = $state(0);''', '''  let videoPaused = $state(true);\n  let videoTime = $state(0);\n  let videoLength = $state(0);\n  let playbackControlsIdle = $state(false);\n  let playbackControlsTimer: ReturnType<typeof setTimeout> | undefined;''')
          s = s.replace('''    return () => {\n      observer.disconnect();\n      document.removeEventListener('fullscreenchange', syncFullscreen);\n    };''', '''    return () => {\n      observer.disconnect();\n      document.removeEventListener('fullscreenchange', syncFullscreen);\n      if (playbackControlsTimer) clearTimeout(playbackControlsTimer);\n    };''')
          marker = '''  async function togglePlayback() {\n    const media = videoElement ?? audioElement;\n    if (!media) return;\n    if (media.paused) await media.play();\n    else media.pause();\n  }\n'''
          replacement = '''  function showPlaybackControls() {\n    if (renderedFile.media_kind !== 'video') return;\n    playbackControlsIdle = false;\n    if (playbackControlsTimer) clearTimeout(playbackControlsTimer);\n    playbackControlsTimer = setTimeout(() => {\n      playbackControlsIdle = true;\n      playbackControlsTimer = undefined;\n    }, 2000);\n  }\n\n  async function togglePlayback() {\n    const media = videoElement ?? audioElement;\n    if (!media) return;\n    showPlaybackControls();\n    if (media.paused) await media.play();\n    else media.pause();\n  }\n'''
          if marker not in s:
              raise SystemExit('togglePlayback marker not found')
          s = s.replace(marker, replacement, 1)
          s = s.replace('''    videoPaused = true;\n    videoTime = 0;\n    videoLength = 0;\n  });''', '''    videoPaused = true;\n    videoTime = 0;\n    videoLength = 0;\n    if (nextFile.media_kind === 'video') showPlaybackControls();\n    else if (playbackControlsTimer) {\n      clearTimeout(playbackControlsTimer);\n      playbackControlsTimer = undefined;\n      playbackControlsIdle = false;\n    }\n  });''', 1)
          s = s.replace('''  function handleViewerKeydown(event: KeyboardEvent) {\n    if (event.defaultPrevented || hasCommandModifier(event) || isEditableShortcutTarget(event.target)) return;''', '''  function handleViewerKeydown(event: KeyboardEvent) {\n    if (event.defaultPrevented || hasCommandModifier(event) || isEditableShortcutTarget(event.target)) return;\n    showPlaybackControls();''', 1)
          s = s.replace('''<div bind:this={stageElement} class:fullscreen={isFullscreen} class:waiting={waitingForTarget} class="lightbox-stage viewer-stage" tabindex="-1" aria-busy={waitingForTarget}>''', '''<div bind:this={stageElement} class:fullscreen={isFullscreen} class:waiting={waitingForTarget} class="lightbox-stage viewer-stage" tabindex="-1" aria-busy={waitingForTarget} onpointermove={showPlaybackControls}>''', 1)
          s = s.replace('''    <div class="lightbox-video-controls">''', '''    <div class="lightbox-video-controls" class:is-idle={playbackControlsIdle} onpointerenter={showPlaybackControls} onfocusin={showPlaybackControls}>''', 1)
          p.write_text(s)

          p = Path('frontend/src/lib/styles/viewer.css')
          s = p.read_text()
          s = s.replace('''  background: rgba(255, 255, 255, 0.15);\n  opacity: 0;\n  transition: opacity 160ms ease;''', '''  background: rgba(255, 255, 255, 0.15);''', 1)
          s = s.replace('''  background: var(--accent);\n  opacity: 0;\n  transition: opacity 160ms ease;\n}\n\n.video-progress:hover::before,\n.video-progress:hover span,\n.video-progress:focus::before,\n.video-progress:focus span {\n  opacity: 1;\n}''', '''  background: var(--accent);\n}\n\n.lightbox-video-controls {\n  transition: opacity 160ms ease;\n}\n\n.lightbox-video-controls.is-idle:not(:hover):not(:focus-within) {\n  opacity: 0;\n}''', 1)
          p.write_text(s)

          p = Path('frontend/tests/playable-media-seek.spec.ts')
          s = p.read_text()
          old = '''test('video seekbar fades out until hover or keyboard focus', async ({ page }) => {\n  await mockApp(page, 'video');\n  await makeMediaControllable(page, 'video');\n  const seekbar = page.getByRole('button', { name: 'Seek video' });\n\n  await expect.poll(() => seekbar.evaluate((element) => getComputedStyle(element, '::before').opacity)).toBe('0');\n\n  await seekbar.hover();\n  await expect.poll(() => seekbar.evaluate((element) => getComputedStyle(element, '::before').opacity)).toBe('1');\n\n  await page.locator('.viewer-stage').hover({ position: { x: 20, y: 20 } });\n  await expect.poll(() => seekbar.evaluate((element) => getComputedStyle(element, '::before').opacity)).toBe('0');\n\n  await seekbar.focus();\n  await expect.poll(() => seekbar.evaluate((element) => getComputedStyle(element, '::before').opacity)).toBe('1');\n});'''
          new = '''test('complete video control panel fades after idle and returns on interaction', async ({ page }) => {\n  await mockApp(page, 'video');\n  await makeMediaControllable(page, 'video');\n  const stage = page.locator('.viewer-stage');\n  const controls = page.locator('.lightbox-video-controls');\n  const seekbar = page.getByRole('button', { name: 'Seek video' });\n\n  await expect(controls.getByRole('button', { name: 'Pause video' })).toBeVisible();\n  await expect(controls.locator('.video-time')).toHaveCount(2);\n  await expect(seekbar).toBeVisible();\n  await expect.poll(() => controls.evaluate((element) => getComputedStyle(element).opacity)).toBe('1');\n  await expect.poll(() => seekbar.evaluate((element) => getComputedStyle(element, '::before').opacity)).toBe('1');\n\n  await expect.poll(() => controls.evaluate((element) => getComputedStyle(element).opacity), { timeout: 3500 }).toBe('0');\n\n  const box = await stage.boundingBox();\n  if (!box) throw new Error('viewer stage has no bounding box');\n  await page.mouse.move(box.x + 30, box.y + 30);\n  await expect.poll(() => controls.evaluate((element) => getComputedStyle(element).opacity)).toBe('1');\n\n  await seekbar.focus();\n  await page.waitForTimeout(2200);\n  await expect.poll(() => controls.evaluate((element) => getComputedStyle(element).opacity)).toBe('1');\n\n  await stage.focus();\n  await expect.poll(() => controls.evaluate((element) => getComputedStyle(element).opacity), { timeout: 3500 }).toBe('0');\n\n  await page.keyboard.press('Shift+ArrowRight');\n  await expect.poll(() => controls.evaluate((element) => getComputedStyle(element).opacity)).toBe('1');\n});'''
          if old not in s:
              raise SystemExit('old playable fade test not found')
          p.write_text(s.replace(old, new, 1))
          PY

          cd frontend
          npm ci
          npx playwright install --with-deps chromium
          npm run check
          npm run test:unit
          npm run build
          npx playwright test tests/playable-media-seek.spec.ts --project=chromium
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name gooru-maintainer-bot
          git config user.email maintainer@users.noreply.github.com
          git add frontend/src/lib/components/ViewerStage.svelte frontend/src/lib/styles/viewer.css frontend/tests/playable-media-seek.spec.ts
          git commit -m 'fix(viewer): fade complete video controls when idle'
          git push origin HEAD:fix/21-video-controls-idle-fade
