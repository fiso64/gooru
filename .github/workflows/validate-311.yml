name: Validate 311

on:
  push:
    branches:
      - fix/311-pagination-overflow

permissions:
  contents: read

jobs:
  pagination-browser:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Focused pagination browser regression
        run: npm run test:e2e -- tests/paged-library.spec.ts --project=chromium
