name: Temporary #401 task lifecycle validation

on:
  push:
    branches:
      - refactor/401-task-lifecycle

permissions:
  contents: write

concurrency:
  group: temporary-401-task-lifecycle
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/401-task-lifecycle
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Database package tests
        run: go test ./internal/database
      - name: Full Go tests
        run: go test ./...
      - name: Build
        run: go build ./...
