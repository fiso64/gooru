name: maintainer-249-remove-status

on:
  push:
    branches: [feat/249-upload-item-tags]
    paths:
      - .github/workflows/maintainer-249-remove-status.yml

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/249-upload-item-tags
          fetch-depth: 0
      - name: Preserve remaining upload status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/state/uploadWorkflow.svelte.ts')
          text = path.read_text()
          old = '''    items = items.filter((_, itemIndex) => itemIndex !== index);\n    status = '';\n    statusCounts = countUploadStatuses(items);'''
          new = '''    items = items.filter((_, itemIndex) => itemIndex !== index);\n    statusCounts = countUploadStatuses(items);\n    status = items.some((item) => item.status !== 'staged') ? uploadSummaryFromCounts(statusCounts) : '';'''
          if old not in text:
              raise SystemExit('removeAt status anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/maintainer-249-remove-status.yml
          git config user.name 'fiso64'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git add frontend/src/lib/state/uploadWorkflow.svelte.ts .github/workflows/maintainer-249-remove-status.yml
          git commit -m 'fix(upload): preserve queue status after removal'
          git push origin HEAD:feat/249-upload-item-tags
