name: tmp encrypted file migration validation
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - refactor/28-encrypted-file-migration
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/encryptedfile
      - run: go test ./...
      - run: go build ./...
