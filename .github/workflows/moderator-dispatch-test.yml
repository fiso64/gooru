name: Dispatch moderator full test

on:
  push:
    branches: [develop]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Dispatch moderator full test'
    runs-on: gooru-moderator
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch full moderator reconcile
        run: gh api --method POST repos/${{ github.repository }}/actions/workflows/lock-maintainer-threads.yml/dispatches -f ref=develop
