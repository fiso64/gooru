name: Maintainer 330

on:
  push:
    branches:
      - fix/330-upload-conflict-default

permissions:
  contents: write

concurrency:
  group: maintainer-330
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/330-upload-conflict-default
      - name: Synchronize conflict-policy documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('docs/CONFIG.md')
          text = config.read_text()
          text = text.replace('| `uploads.conflict_policy` | `rename` |', '| `uploads.conflict_policy` | `skip` |')
          text = text.replace('  conflict_policy: rename', '  conflict_policy: skip')
          config.write_text(text)

          openapi = Path('docs/openapi.yaml')
          text = openapi.read_text()
          old = '''                conflict_policy:
                  type: string
                  enum: [skip, rename, replace]
                  description: How to handle uploaded filenames that already exist in the target.'''
          new = '''                conflict_policy:
                  type: string
                  enum: [skip, rename, replace]
                  default: skip
                  description: How to handle uploaded filenames that already exist in the target; omitted values default to skip.'''
          if old not in text and new not in text:
              raise SystemExit('upload conflict policy schema not found')
          text = text.replace(old, new)
          openapi.write_text(text)
          PY
          if ! git diff --quiet -- docs/CONFIG.md docs/openapi.yaml; then
            git config user.name "chatgpt-codex-connector[bot]"
            git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
            git add docs/CONFIG.md docs/openapi.yaml
            git commit -m "docs: document skip upload conflict default"
            git push origin HEAD:fix/330-upload-conflict-default
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go tests with durable diagnostic
        shell: bash
        run: |
          set +e
          go test ./... -count=1 2>&1 | tee .maintainer-330-go.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git config user.name "chatgpt-codex-connector[bot]"
            git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
            git add -f .maintainer-330-go.log
            git commit -m "chore: capture #330 Go test failure"
            git push origin HEAD:fix/330-upload-conflict-default
            exit "$status"
          fi
          rm -f .maintainer-330-go.log
      - name: Go build
        run: go build ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Focused browser regression
        working-directory: frontend
        run: npx playwright test tests/upload-conflict-default.spec.ts
