name: Maintainer 330

on:
  push:
    branches:
      - fix/330-upload-conflict-default

permissions:
  contents: write

concurrency:
  group: maintainer-330
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/330-upload-conflict-default
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go tests with durable diagnostic
        shell: bash
        run: |
          set +e
          go test ./... -count=1 2>&1 | tee .maintainer-330-go.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git config user.name "chatgpt-codex-connector[bot]"
            git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
            git add -f .maintainer-330-go.log
            git commit -m "chore: capture #330 Go test failure"
            git push origin HEAD:fix/330-upload-conflict-default
            exit "$status"
          fi
          rm -f .maintainer-330-go.log
      - name: Go build
        run: go build ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend build
        working-directory: frontend
        run: npm run build
