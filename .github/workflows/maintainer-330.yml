name: Maintainer 330

on:
  push:
    branches:
      - fix/330-upload-conflict-default

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/330-upload-conflict-default
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply focused fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new))

          replace('internal/serve/config.go', 'Uploads: UploadsConfig{Enabled: false, ConflictPolicy: "rename", PreserveModTime: true}', 'Uploads: UploadsConfig{Enabled: false, ConflictPolicy: "skip", PreserveModTime: true}')
          replace('internal/serve/uploads.go', 'if fallback == "" {\n\t\treturn "rename", nil\n\t}', 'if fallback == "" {\n\t\treturn "skip", nil\n\t}')
          replace('frontend/src/lib/api/client.ts', "conflictPolicy = 'rename',", "conflictPolicy = 'skip',")
          replace('frontend/src/lib/state/uploadWorkflow.svelte.ts', "let conflictPolicy = $state('rename');", "let conflictPolicy = $state('skip');")
          replace('frontend/src/lib/state/uploadWorkflow.svelte.ts', "conflictPolicy = 'rename';", "conflictPolicy = 'skip';")

          panel = Path('frontend/src/lib/components/UploadPanel.svelte')
          text = panel.read_text()
          block = '''        <div class="field-row">\n          <span>On conflict</span>\n          <div class="field-control">\n            <div class="seg" aria-label="Upload conflict policy">\n              {#each [{ value: 'skip', label: 'Skip' }, { value: 'rename', label: 'Rename' }, { value: 'replace', label: 'Replace' }] as option}\n                <button type="button" class={conflictPolicy === option.value ? 'is-active' : ''} onclick={() => onConflictInput(option.value)}>{option.label}</button>\n              {/each}\n            </div>\n          </div>\n        </div>\n'''
          if text.count(block) != 1:
              raise SystemExit('UploadPanel: conflict selector block mismatch')
          text = text.replace(block, '')
          for old in ['    conflictPolicy,\n', '    onConflictInput,\n', '    conflictPolicy: string;\n', '    onConflictInput: (value: string) => void;\n']:
              if text.count(old) != 1:
                  raise SystemExit(f'UploadPanel: expected one {old!r}')
              text = text.replace(old, '')
          panel.write_text(text)

          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text()
          for old in ['        conflictPolicy={upload.conflictPolicy}\n', '        onConflictInput={(value) => (upload.conflictPolicy = value)}\n']:
              if text.count(old) != 1:
                  raise SystemExit(f'AuthenticatedApp: expected one {old!r}')
              text = text.replace(old, '')
          app.write_text(text)

          tests = Path('internal/serve/config_upload_policy_test.go')
          text = tests.read_text()
          addition = '''\nfunc TestDefaultUploadConflictPolicyIsSkip(t *testing.T) {\n\tcfg := DefaultConfig(filepath.Join(t.TempDir(), "gooru.db"))\n\tif cfg.Uploads.ConflictPolicy != "skip" {\n\t\tt.Fatalf("expected default uploads.conflict_policy=skip, got %q", cfg.Uploads.ConflictPolicy)\n\t}\n\tpolicy, err := uploadConflictPolicy("", "")\n\tif err != nil {\n\t\tt.Fatalf("resolve omitted conflict policy: %v", err)\n\t}\n\tif policy != "skip" {\n\t\tt.Fatalf("expected omitted conflict policy to resolve to skip, got %q", policy)\n\t}\n}\n'''
          if 'func TestDefaultUploadConflictPolicyIsSkip' not in text:
              tests.write_text(text + addition)

          tests = Path('frontend/src/lib/state/uploadWorkflow.svelte.test.ts')
          text = tests.read_text()
          marker = "  it('appends later file selections to the staged batch', () => {"
          addition = '''  it('defaults browser uploads to skip conflicts', async () => {\n    const workflow = createUploadWorkflow();\n    workflow.select([uploadFile('first.jpg')]);\n    let policy = '';\n\n    await workflow.submit(async (variables) => {\n      policy = variables.conflictPolicy;\n      return pendingJob('job-first');\n    });\n\n    expect(policy).toBe('skip');\n  });\n\n'''
          if addition not in text:
              if text.count(marker) != 1:
                  raise SystemExit('upload workflow test marker mismatch')
              tests.write_text(text.replace(marker, addition + marker))
          PY
      - name: Commit fix
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add internal/serve/config.go internal/serve/uploads.go internal/serve/config_upload_policy_test.go frontend/src/lib/api/client.ts frontend/src/lib/state/uploadWorkflow.svelte.ts frontend/src/lib/state/uploadWorkflow.svelte.test.ts frontend/src/lib/components/UploadPanel.svelte frontend/src/lib/components/AuthenticatedApp.svelte
          git commit -m "fix(upload): default conflict handling to skip"
          git push origin HEAD:fix/330-upload-conflict-default
      - name: Go tests
        run: go test ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend build
        working-directory: frontend
        run: npm run build
