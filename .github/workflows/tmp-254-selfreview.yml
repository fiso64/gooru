name: tmp-254-selfreview

on:
  push:
    branches:
      - feat/254-preserve-upload-modtime

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply self-review patch
        run: python .github/tmp-254-selfreview.py
      - name: Format Go
        run: gofmt -w internal/serve/upload_stream.go
      - name: Backend validation
        run: go test ./internal/serve
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run test:unit
          npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit self-review fixes if needed
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/serve/upload_stream.go frontend/src/lib/api/client.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'test(upload): cover source timestamp transport'
            git push origin HEAD:feat/254-preserve-upload-modtime
          fi
