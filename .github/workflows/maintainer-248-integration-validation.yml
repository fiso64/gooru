name: Maintainer 248 integration validation

on:
  push:
    branches:
      - feat/248-upload-target-default-tags
    paths:
      - .github/workflows/maintainer-248-integration-validation.yml

permissions:
  contents: read

jobs:
  integration:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/248-upload-target-default-tags
          fetch-depth: 0
      - name: Integrate current develop for validation
        run: |
          git fetch origin develop
          git -c user.name=maintainer -c user.email=maintainer@localhost merge --no-commit --no-ff origin/develop
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: go test ./...
      - name: Go build
        run: go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Select Chromium
        shell: bash
        run: |
          chrome="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -n "$chrome" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          else
            cd frontend
            npx playwright install chromium
          fi
      - name: Focused upload default-tag browser regression
        working-directory: frontend
        run: npx playwright test tests/upload-drop-control.spec.ts --project=chromium
