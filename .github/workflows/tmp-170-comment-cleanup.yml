name: Temporary viewer comment cleanup

on:
  push:
    branches:
      - fix/22-image-geometry-hold

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/22-image-geometry-hold
      - name: Align implementation comment
        run: python3 -c "from pathlib import Path; p=Path('frontend/src/lib/components/ViewerStage.svelte'); t=p.read_text(); old='    // Image geometry stays at the last painted dimensions until the target image loads.\n    // Non-image media waits for its own metadata path and starts with no image geometry.\n'; new='    // Image transitions install target metadata geometry while the presentation shield preserves old pixels separately.\n    // Non-image media waits for its own metadata path and starts with no image geometry.\n'; assert old in t; p.write_text(t.replace(old,new,1))"
      - name: Commit cleanup
        run: |
          rm .github/workflows/tmp-170-comment-cleanup.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(viewer): align handoff comment"
          git push origin HEAD:fix/22-image-geometry-hold
