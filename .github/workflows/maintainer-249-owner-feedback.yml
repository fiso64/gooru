name: maintainer 249 owner feedback

on:
  push:
    branches:
      - feat/249-upload-item-tags

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/249-upload-item-tags
          fetch-depth: 0
      - name: Repair merge, apply owner feedback, and validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.head_commit.message }}" != "chore(ci): repair #249 merge and apply owner feedback" ]]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path

          uploads = Path('internal/serve/uploads.go')
          text = uploads.read_text()
          old = '''\tConflictPolicy string\n\tOwnershipPath  string\n}'''
          new = '''\tConflictPolicy string\n\tTags           *[]string\n\tOwnershipPath  string\n}'''
          assert text.count(old) == 1, ('StagedUpload fields', text.count(old))
          text = text.replace(old, new)
          old = '''\tdefer releaseSavedUploadOwnership(saved)\n\tif err := query.ValidateTags(tags); err != nil {'''
          new = '''\tdefer releaseSavedUploadOwnership(saved)\n\tif err := validateUploadTags(tags, saved); err != nil {'''
          assert text.count(old) == 1, ('validateUploadTags', text.count(old))
          text = text.replace(old, new)
          old = '''\tconflictPolicy  string\n\townershipPath   string\n}'''
          new = '''\tconflictPolicy  string\n\ttags            *[]string\n\townershipPath   string\n}'''
          assert text.count(old) == 1, ('savedUpload fields', text.count(old))
          text = text.replace(old, new)
          old = '''ConflictPolicy: file.conflictPolicy, OwnershipPath: file.ownershipPath'''
          new = '''ConflictPolicy: file.conflictPolicy, Tags: cloneUploadTags(file.tags), OwnershipPath: file.ownershipPath'''
          assert text.count(old) == 1, ('stagedUploads fields', text.count(old))
          uploads.write_text(text.replace(old, new))

          panel = Path('frontend/src/lib/components/UploadPanel.svelte')
          text = panel.read_text()
          old = '''  .upload-row.is-viewable:hover {\n    background: var(--surface-2);\n  }\n\n  .upload-row :is(button:not(.upload-row-open-target), input) {\n    position: relative;\n    z-index: 2;\n  }\n\n  .upload-item-main {\n    min-width: 0;\n  }\n\n  .upload-item-tags {\n    margin-top: 6px;\n    min-height: 30px;\n  }'''
          new = '''  .upload-row.is-viewable:hover {\n    background: color-mix(in oklab, var(--accent-soft) 60%, transparent);\n  }\n\n  .upload-row :is(button:not(.upload-row-open-target), input) {\n    position: relative;\n    z-index: 2;\n  }\n\n  .upload-item-main {\n    min-width: 0;\n  }\n\n  .upload-item-tags {\n    position: relative;\n    z-index: 2;\n    margin-top: 6px;\n    min-height: 30px;\n  }'''
          assert text.count(old) == 1, ('UploadPanel style', text.count(old))
          panel.write_text(text.replace(old, new))

          css = Path('frontend/src/lib/styles/components.css')
          text = css.read_text()
          old = '''.upload-row-staged {\n  background: color-mix(in oklab, var(--accent-soft) 60%, transparent);\n}'''
          new = '''.upload-row-staged {\n  background: var(--surface-2);\n}'''
          assert text.count(old) == 1, ('staged color', text.count(old))
          css.write_text(text.replace(old, new))

          spec = Path('frontend/tests/upload-viewer.spec.ts')
          text = spec.read_text()
          old = '''  await page.getByLabel('Filter staged files').fill('alpha');\n  const alphaRow = page.getByTestId('upload-row-0');\n  await expect(alphaRow).toBeVisible();\n  await alphaRow.hover();\n  await expect.poll(() => alphaRow.evaluate((element) => getComputedStyle(element).cursor)).toBe('pointer');\n  await expect(alphaRow.getByRole('button', { name: 'alpha.png', exact: true })).toHaveCount(0);\n  await expect(page.getByRole('button', { name: 'Preview beta.png' })).toHaveCount(0);\n\n  // The filename is plain text; clicking its row surface opens the viewer.\n  await alphaRow.getByRole('button', { name: 'Preview alpha.png' }).click();'''
          new = '''  await page.getByLabel('Filter staged files').fill('alpha');\n  const alphaRow = page.getByTestId('upload-row-0');\n  await expect(alphaRow).toBeVisible();\n  const restingBackground = await alphaRow.evaluate((element) => getComputedStyle(element).backgroundColor);\n  await alphaRow.hover();\n  const hoveredBackground = await alphaRow.evaluate((element) => getComputedStyle(element).backgroundColor);\n  expect(hoveredBackground).not.toBe(restingBackground);\n  await expect.poll(() => alphaRow.evaluate((element) => getComputedStyle(element).cursor)).toBe('pointer');\n  await expect(alphaRow.getByRole('button', { name: 'alpha.png', exact: true })).toHaveCount(0);\n  await expect(page.getByRole('button', { name: 'Preview beta.png' })).toHaveCount(0);\n\n  const rowTagInput = alphaRow.getByRole('textbox', { name: 'Add tag to alpha.png' });\n  const tagControlBox = await alphaRow.locator('.upload-item-tags').boundingBox();\n  if (!tagControlBox) throw new Error('staged tag control has no layout box');\n  await page.mouse.click(tagControlBox.x + tagControlBox.width - 2, tagControlBox.y + tagControlBox.height / 2);\n  await expect(page.getByRole('dialog', { name: 'alpha.png' })).toHaveCount(0);\n  await rowTagInput.click();\n  await expect(rowTagInput).toBeFocused();\n  await expect(page.getByRole('dialog', { name: 'alpha.png' })).toHaveCount(0);\n\n  // The filename is plain text; clicking its row surface opens the viewer.\n  await alphaRow.getByRole('button', { name: 'Preview alpha.png' }).click();'''
          assert text.count(old) == 1, ('browser test', text.count(old))
          spec.write_text(text.replace(old, new))
          PY

          gofmt -w internal/serve/uploads.go
          go test ./internal/database ./gooru ./internal/serve
          pushd frontend >/dev/null
          npm ci
          npx playwright install chromium
          npm run test:e2e -- upload-viewer.spec.ts
          npm run check
          popd >/dev/null

          git config user.name 'gooru-maintainer'
          git config user.email 'maintainer@users.noreply.github.com'
          git rm .github/workflows/maintainer-249-owner-feedback.yml
          git add internal/serve/uploads.go frontend/src/lib/components/UploadPanel.svelte frontend/src/lib/styles/components.css frontend/tests/upload-viewer.spec.ts
          git diff --cached --check
          git commit -m 'fix(upload): preserve item tags through branch sync'
          git push origin HEAD:feat/249-upload-item-tags
