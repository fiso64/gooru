name: Materialize protected history fix

on:
  push:
    branches:
      - fix/28-protected-browser-privacy

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated race hardening and remove staging machinery
        run: |
          python .github/maintainer-28-history-race.py
          rm .github/maintainer-28-history-race.py
          rm .github/workflows/maintainer-28-materialize-history.yml
      - name: Commit materialized fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/state/libraryWorkflow.svelte.ts frontend/tests/protected-browser-privacy.spec.ts .github/maintainer-28-history-race.py .github/workflows/maintainer-28-materialize-history.yml
          git commit -m "fix: prevent stale protected history restores"
          git push
