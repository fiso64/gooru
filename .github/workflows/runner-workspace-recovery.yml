name: Reclaim self-hosted runner workspaces

on:
  push:
    branches:
      - feat/248-upload-target-default-tags

permissions:
  contents: read

jobs:
  cleanup:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, gooru]
    steps:
      - name: Reclaim only disposable frontend workspace and npm cache
        shell: bash
        run: |
          set -euxo pipefail
          echo "runner=$RUNNER_NAME home=$HOME"
          df -h /run
          du -sh "$HOME/gooru/gooru/frontend/node_modules" "$HOME/gooru/gooru/frontend/.svelte-kit" "$HOME/gooru/gooru/frontend/build" "$HOME/.npm" 2>/dev/null || true
          rm -rf "$HOME/gooru/gooru/frontend/node_modules" "$HOME/gooru/gooru/frontend/.svelte-kit" "$HOME/gooru/gooru/frontend/build" "$HOME/.npm/_cacache"
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d -mtime +0 -exec rm -rf {} + 2>/dev/null || true
          df -h /run
