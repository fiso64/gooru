name: Trigger moderator reconciliation test

on:
  push:
    branches: [develop]

permissions:
  actions: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Trigger moderator reconciliation test'
    runs-on: gooru-moderator
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch moderator full reconcile
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/lock-maintainer-threads.yml/dispatches" -f ref=develop
