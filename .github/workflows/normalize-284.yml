name: Normalize 284 source endings

on:
  push:
    branches:
      - feat/284-default-fullscreen

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Normalize trailing newlines
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ['internal/serve/config.go', 'frontend/src/lib/components/AppPage.svelte']) {
            const data = fs.readFileSync(path);
            if (data.length && data[data.length - 1] !== 10) fs.appendFileSync(path, '\n');
          }
          NODE
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/serve/config.go frontend/src/lib/components/AppPage.svelte
          git commit -m 'chore: restore source trailing newlines'
          git push origin HEAD:feat/284-default-fullscreen
