name: Normalize 284 source endings

on:
  push:
    branches:
      - feat/284-default-fullscreen

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize trailing newlines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['internal/serve/config.go', 'frontend/src/lib/components/AppPage.svelte']:
              path = Path(name)
              data = path.read_bytes()
              if not data.endswith(b'\n'):
                  path.write_bytes(data + b'\n')
          PY
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/serve/config.go frontend/src/lib/components/AppPage.svelte
          git commit -m 'chore: restore source trailing newlines'
          git push origin HEAD:feat/284-default-fullscreen
