name: tmp validate 105 nix package
on:
  push:
    branches:
      - fix/105-comic-render-boundary
    paths-ignore:
      - 'tmp-validation/**'
permissions:
  contents: write
jobs:
  diagnose-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Capture packaged application build result
        shell: bash
        run: |
          mkdir -p tmp-validation
          set +e
          nix build .#default --print-build-logs > tmp-validation/nix-build.txt 2>&1
          status=$?
          echo "$status" > tmp-validation/nix-status.txt
          grep -E 'hash mismatch|specified:|got:|error:|npm-deps|vendorHash|npmDepsHash' tmp-validation/nix-build.txt | tail -40 > tmp-validation/nix-summary.txt || true
          set -e
      - name: Persist diagnostics on the temporary branch
        shell: bash
        run: |
          git config user.name 'gooru-maintainer-validation'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git add tmp-validation
          git commit -m 'ci: summarize issue 105 nix failure'
          git push
