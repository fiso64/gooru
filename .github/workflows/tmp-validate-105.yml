name: tmp validate 105 firefox font
on:
  push:
    branches:
      - fix/105-comic-render-boundary
jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Firefox
        working-directory: frontend
        run: npx playwright install --with-deps firefox
      - name: Run focused comic-font regression in Firefox
        working-directory: frontend
        shell: bash
        run: |
          cat > playwright.issue105.config.ts <<'EOF'
          import { defineConfig, devices } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            timeout: 30_000,
            use: { baseURL: 'http://127.0.0.1:4173', trace: 'on-first-retry' },
            webServer: {
              command: 'npm run build && npm run preview -- --host 127.0.0.1',
              url: 'http://127.0.0.1:4173',
              reuseExistingServer: false,
              timeout: 120_000
            },
            projects: [{ name: 'firefox', use: { ...devices['Desktop Firefox'] } }]
          });
          EOF
          npx playwright test tests/font-style.spec.ts --config=playwright.issue105.config.ts --project=firefox
