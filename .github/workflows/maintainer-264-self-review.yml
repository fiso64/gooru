name: Maintainer saved-search drag self-review

on:
  push:
    branches:
      - fix/264-saved-search-drag-animation

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[264-self-review]') }}
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply self-review correction
        run: node -e "const fs=require('node:fs');const p='frontend/src/lib/components/AppShell.svelte';let s=fs.readFileSync(p,'utf8');const a=\"    if (!sourceID || sourceID === targetID || savedSearchReorderBusy) return;\\n    event.preventDefault();\";const b=\"    if (!sourceID || savedSearchReorderBusy) return;\\n    event.preventDefault();\\n    if (sourceID === targetID) return;\";if(!s.includes(a))throw new Error('expected preview guard not found');fs.writeFileSync(p,s.replace(a,b));"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Focused Chromium regression
        working-directory: frontend
        run: npx playwright test tests/saved-search-reorder.spec.ts --project=chromium
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/components/AppShell.svelte
          git diff --cached --check
          git commit -m "fix(webui): keep saved-search drop target active [264-self-review]"
          git push origin HEAD:fix/264-saved-search-drag-animation
