name: maintainer-254-strategy-discovery

on:
  push:
    branches:
      - feat/254-added-at-strategy
    paths:
      - .github/workflows/maintainer-254-strategy-discovery.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace importer and added-at persistence
        run: |
          grep -R -n "ImportUploadedFiles" internal gooru types || true
          grep -R -n "BatchUpsertLocations" internal gooru || true
          grep -R -n "added_at" internal/database gooru types | head -n 100 || true
          grep -R -n "type LocationInfo" types gooru internal || true
