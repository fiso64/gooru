name: Maintainer SQLite renewal diagnostic

on:
  push:
    branches:
      - maintainer/sqlite-foreground-upgrade

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce lease-renewal contention
        run: go test -count=1 -run TestRunnerSurvivesRealSQLiteContentionDuringLeaseRenewal -v ./internal/background
