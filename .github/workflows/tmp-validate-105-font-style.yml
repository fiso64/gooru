name: tmp validate 105 font style
on:
  push:
    branches: [feat/105-font-style-polish]
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Check
        working-directory: frontend
        run: npm run check
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox
      - name: Font preset regressions
        working-directory: frontend
        run: npx playwright test tests/font-style.spec.ts --project=chromium --project=firefox
