name: Temporary sidebar kind filter validation

on:
  push:
    branches:
      - fix/227-sidebar-kind-filters

permissions:
  contents: write

jobs:
  implement-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/227-sidebar-kind-filters
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Implement unified sidebar kind filters
        run: |
          cat > frontend/src/lib/utils/sidebarKinds.ts <<'EOF'
          export const sidebarKindFilters = [
            { key: 'photo', label: 'Photos', icon: 'photo', query: 'type:photo' },
            { key: 'video', label: 'Videos', icon: 'video', query: 'type:video' },
            { key: 'gif', label: 'GIFs', icon: 'gif', query: 'type:gif' }
          ] as const;

          const kindTerms = new Set([...sidebarKindFilters.map((kind) => kind.query), 'ext:cbz']);

          function terms(query: string) {
            return query.trim().split(/\s+/).filter(Boolean);
          }

          export function isSidebarKindFilter(term: string) {
            return kindTerms.has(term.toLowerCase() as (typeof sidebarKindFilters)[number]['query'] | 'ext:cbz');
          }

          export function queryWithoutSidebarKind(query: string) {
            return terms(query).filter((term) => !isSidebarKindFilter(term)).join(' ');
          }

          export function sidebarKindActive(query: string, filter: string) {
            const normalized = filter.toLowerCase();
            return terms(query).some((term) => term.toLowerCase() === normalized);
          }

          export function replaceSidebarKind(query: string, filter: string) {
            const base = queryWithoutSidebarKind(query);
            if (sidebarKindActive(query, filter)) return base;
            return [base, filter].filter(Boolean).join(' ');
          }

          export function appendSidebarKind(query: string, filter: string) {
            return [queryWithoutSidebarKind(query), filter].filter(Boolean).join(' ');
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          shell = 'frontend/src/lib/components/AppShell.svelte'
          replace(shell,
          "  import { readBrowserPreference, writeBrowserPreference } from '$lib/utils/browserStorage';\n",
          "  import { readBrowserPreference, writeBrowserPreference } from '$lib/utils/browserStorage';\n  import { replaceSidebarKind, sidebarKindActive, sidebarKindFilters } from '$lib/utils/sidebarKinds';\n")
          replace(shell, "    activeKind,\n", "")
          replace(shell, "    comicActive,\n", "")
          replace(shell, "    onKind,\n", "")
          replace(shell, "    activeKind: string;\n", "")
          replace(shell, "    comicActive: boolean;\n", "")
          replace(shell, "    onKind: (kind: string) => void;\n", "")
          replace(shell,
          "  const kinds = [\n    { key: 'photo', label: 'Photos', icon: 'photo' },\n    { key: 'video', label: 'Videos', icon: 'video' },\n    { key: 'gif', label: 'GIFs', icon: 'gif' }\n  ];\n",
          "  const kinds = sidebarKindFilters;\n")
          replace(shell,
          "  function openLibrary() {\n    if (route === 'library' && !activeKind) onSearchCommit('');\n    onRoute('library');\n    onKind('');\n  }\n\n  function openCommonTag(tag: string) {\n    onKind('');\n    onSearchCommit(tag);\n  }\n\n  function toggleComics() {\n    const terms = search.trim().split(/\\s+/).filter((term: string) => term && term.toLowerCase() !== 'ext:cbz');\n    if (!comicActive) terms.push('ext:cbz');\n    onRoute('library');\n    onKind('');\n    onSearchCommit(terms.join(' '));\n  }\n",
          "  function openLibrary() {\n    onRoute('library');\n    onSearchCommit('');\n  }\n\n  function openCommonTag(tag: string) {\n    onSearchCommit(tag);\n  }\n\n  function toggleKind(filter: string) {\n    onRoute('library');\n    onSearchCommit(replaceSidebarKind(search, filter));\n  }\n")
          replace(shell, "class:active={route === 'library' && !activeKind}", "class:active={route === 'library'}")
          replace(shell, "active={route === 'library' && !activeKind}", "active={route === 'library'}")
          replace(shell,
          "        <button class:active={route === 'library' && activeKind === kind.key} class=\"sidebar-item\" type=\"button\" onclick={() => { onRoute('library'); onKind(activeKind === kind.key ? '' : kind.key); }}>\n          <Icon name={kind.icon} size={16} active={route === 'library' && activeKind === kind.key} />",
          "        <button class:active={route === 'library' && sidebarKindActive(search, kind.query)} class=\"sidebar-item\" type=\"button\" onclick={() => toggleKind(kind.query)}>\n          <Icon name={kind.icon} size={16} active={route === 'library' && sidebarKindActive(search, kind.query)} />")
          replace(shell,
          "        <button class:active={route === 'library' && comicActive} class=\"sidebar-item\" type=\"button\" onclick={toggleComics}>\n          <Icon name=\"bookmark\" size={16} active={route === 'library' && comicActive} />",
          "        <button class:active={route === 'library' && sidebarKindActive(search, 'ext:cbz')} class=\"sidebar-item\" type=\"button\" onclick={() => toggleKind('ext:cbz')}>\n          <Icon name=\"bookmark\" size={16} active={route === 'library' && sidebarKindActive(search, 'ext:cbz')} />")

          files = 'frontend/src/lib/queries/files.ts'
          replace(files,
          "  count: (scope: number, query: string) => ['files', 'count', scope, query] as const,\n",
          "  count: (scope: number, query: string) => ['files', 'count', scope, query] as const,\n  facets: (scope: number, query: string) => ['files', 'facets', scope, query] as const,\n")
          marker = "export function createFileCountQuery(\n"
          p = Path(files); text = p.read_text(); idx = text.index(marker)
          addition = """export function createFileFacetsQuery(\n  getAuthenticated: () => boolean,\n  getQuery: () => string,\n  getAuthScope: () => number,\n  getEnabled: () => boolean = () => true\n) {\n  return createQuery(() => ({\n    queryKey: fileKeys.facets(getAuthScope(), getQuery()),\n    enabled: getAuthenticated() && getEnabled(),\n    queryFn: ({ signal }) => new ApiClient().listFiles({\n      query: getQuery(),\n      limit: 1,\n      sort: 'modified',\n      order: 'desc',\n      includeFacets: true,\n      signal\n    })\n  }));\n}\n\n"""
          p.write_text(text[:idx] + addition + text[idx:])

          app = 'frontend/src/lib/components/AuthenticatedApp.svelte'
          replace(app,
          "import { createFileCountQuery, createFilesQuery, createFileRemovalMutation, createFilesRemovalMutation, createTagMutation, pageTokenOffset, type FileSort } from '$lib/queries/files';",
          "import { createFileCountQuery, createFileFacetsQuery, createFilesQuery, createFileRemovalMutation, createFilesRemovalMutation, createTagMutation, pageTokenOffset, type FileSort } from '$lib/queries/files';")
          replace(app,
          "  import { hasCommandModifier, isEditableShortcutTarget, libraryShortcutAction } from '$lib/utils/keyboard';\n",
          "  import { hasCommandModifier, isEditableShortcutTarget, libraryShortcutAction } from '$lib/utils/keyboard';\n  import { appendSidebarKind, queryWithoutSidebarKind } from '$lib/utils/sidebarKinds';\n")
          replace(app,
          "    () => library.activeKind,\n",
          "    () => '',\n")
          replace(app,
          "  const comicCountQuery = createFileCountQuery(() => Boolean($authState.user), () => 'ext:cbz', () => authScope, () => Boolean(filesQuery.data?.pages.length));\n",
          "  const sidebarBaseQuery = $derived(queryWithoutSidebarKind($submittedSearch));\n  const kindFacetsQuery = createFileFacetsQuery(() => Boolean($authState.user), () => sidebarBaseQuery, () => authScope, () => library.route === 'library');\n  const comicCountQuery = createFileCountQuery(() => Boolean($authState.user), () => appendSidebarKind(sidebarBaseQuery, 'ext:cbz'), () => authScope, () => library.route === 'library');\n")
          replace(app,
          "  const fileMetadataKey = $derived(`${authScope}|${$submittedSearch}|${library.activeKind}|${library.sort}|${library.order}`);\n",
          "  const fileMetadataKey = $derived(`${authScope}|${$submittedSearch}|${library.sort}|${library.order}`);\n")
          replace(app, "    activeKind={library.activeKind}\n", "")
          replace(app,
          "    kindCounts={page?.facets?.kind ?? tagsQuery.data?.facets?.kind ?? []}\n",
          "    kindCounts={kindFacetsQuery.data?.facets?.kind ?? tagsQuery.data?.facets?.kind ?? page?.facets?.kind ?? []}\n")
          replace(app, "    comicActive={library.activeKind === '' && /(^|\\s)ext:cbz(?:\\s|$)/i.test($submittedSearch)}\n", "")
          replace(app, "    onKind={library.setKind}\n", "")
          replace(app,
          "        searchActive={Boolean($submittedSearch || library.activeKind)}\n",
          "        searchActive={Boolean($submittedSearch)}\n")

          workflow = 'frontend/src/lib/state/libraryWorkflow.svelte.ts'
          replace(workflow,
          "import { isEditableShortcutTarget } from '$lib/utils/keyboard';\n",
          "import { isEditableShortcutTarget } from '$lib/utils/keyboard';\nimport { replaceSidebarKind } from '$lib/utils/sidebarKinds';\n")
          replace(workflow,
          "  const searchDraft = writable(initialLibraryState.query);\n  const submittedSearch = writable(initialLibraryState.query);\n  const suggestionSearch = writable(initialLibraryState.query);\n  let submittedQuery = $state(initialLibraryState.query);\n  let route: AppRoute = $state(initialRoute);\n  let activeKind = $state(initialLibraryState.kind);\n",
          "  const initialQuery = initialLibraryState.kind\n    ? replaceSidebarKind(initialLibraryState.query, `type:${initialLibraryState.kind}`)\n    : initialLibraryState.query;\n  const searchDraft = writable(initialQuery);\n  const submittedSearch = writable(initialQuery);\n  const suggestionSearch = writable(initialQuery);\n  let submittedQuery = $state(initialQuery);\n  let route: AppRoute = $state(initialRoute);\n  let activeKind = $state('');\n")
          replace(workflow,
          "      ? searchForLibraryURLState({ query: submittedQuery, kind: activeKind, sort, order, fileID: pendingPreviewID })\n",
          "      ? searchForLibraryURLState({ query: submittedQuery, kind: '', sort, order, fileID: pendingPreviewID })\n")
          replace(workflow,
          "      activeKind = nextLibraryState.kind;\n      activeSavedSearch = '';\n",
          "      const restoredQuery = nextLibraryState.kind\n        ? replaceSidebarKind(nextLibraryState.query, `type:${nextLibraryState.kind}`)\n        : nextLibraryState.query;\n      activeKind = '';\n      activeSavedSearch = '';\n")
          replace(workflow,
          "      searchDraft.set(nextLibraryState.query);\n      suggestionSearch.set(nextLibraryState.query);\n      setSubmittedSearch(nextLibraryState.query);\n",
          "      searchDraft.set(restoredQuery);\n      suggestionSearch.set(restoredQuery);\n      setSubmittedSearch(restoredQuery);\n")
          replace(workflow,
          "    const query = value.trim();\n    searchDraft.set(query);\n",
          "    const query = value.trim();\n    activeKind = '';\n    searchDraft.set(query);\n")
          replace(workflow,
          "  function filterQuery() {\n    const parts = [submittedQuery.trim()];\n    if (activeKind) parts.push(`type:${activeKind}`);\n    return parts.filter(Boolean).join(' ');\n  }\n\n  function setKind(kind: string) {\n    activeKind = kind;\n    selection = emptySelection();\n    selectionAnchorID = '';\n  }\n",
          "  function filterQuery() {\n    return submittedQuery.trim();\n  }\n\n  function setKind(kind: string) {\n    activeKind = '';\n    commitSearch(kind ? replaceSidebarKind(get(searchDraft), `type:${kind}`) : get(searchDraft));\n  }\n")
          replace(workflow,
          "  function runSavedSearch(query: string, name: string) {\n    activeSavedSearch = name;\n",
          "  function runSavedSearch(query: string, name: string) {\n    activeKind = '';\n    activeSavedSearch = name;\n")
          PY

          cat >> frontend/tests/shell.spec.ts <<'EOF'

          test('sidebar kind filters stay visible, mutually exclusive, and keep counts stable', async ({ page }) => {
            await mockAuth(page);
            await mockShellApis(page);
            const fileQueries: string[] = [];
            await page.route('**/api/v1/files?**', async (route) => {
              const url = new URL(route.request().url());
              const query = url.searchParams.get('query') ?? '';
              fileQueries.push(query);
              const baseFacets = { kind: [
                { value: 'photo', count: 7 },
                { value: 'video', count: 2 },
                { value: 'gif', count: 1 }
              ] };
              const total = query.includes('ext:cbz') ? 3
                : query.includes('type:photo') ? 7
                : query.includes('type:video') ? 2
                : query.includes('type:gif') ? 1
                : 10;
              const filteredKind = query.match(/type:(photo|video|gif)/)?.[1];
              await route.fulfill({
                contentType: 'application/json',
                body: JSON.stringify({
                  files: [],
                  total_count: total,
                  library_count: 10,
                  facets: filteredKind
                    ? { kind: [{ value: filteredKind, count: total }] }
                    : baseFacets
                })
              });
            });

            await page.goto('/');
            await signIn(page);
            const search = page.getByLabel('Search library');
            await search.fill('technology');
            await search.press('Enter');

            const photos = page.getByRole('button', { name: /Photos/ });
            const videos = page.getByRole('button', { name: /Videos/ });
            const gifs = page.getByRole('button', { name: /GIFs/ });
            await expect(photos.getByText('7')).toBeVisible();
            await expect(videos.getByText('2')).toBeVisible();
            await expect(gifs.getByText('1')).toBeVisible();

            await videos.click();
            await expect(search).toHaveValue('technology type:video');
            await expect(photos.getByText('7')).toBeVisible();
            await expect(videos.getByText('2')).toBeVisible();
            await expect(gifs.getByText('1')).toBeVisible();

            await photos.click();
            await expect(search).toHaveValue('technology type:photo');
            await expect(search).not.toHaveValue(/type:video/);

            await gifs.click();
            await expect(search).toHaveValue('technology type:gif');
            await expect(search).not.toHaveValue(/type:photo/);

            const comics = page.getByRole('button', { name: /Comics/ });
            await expect(comics).toBeVisible();
            await comics.click();
            await expect(search).toHaveValue('technology ext:cbz');
            await expect(search).not.toHaveValue(/type:gif/);

            await page.getByRole('button', { name: 'Safe blue' }).click();
            await expect(search).toHaveValue('rating:safe blue');

            await page.getByRole('button', { name: /^blue\s+2$/ }).click();
            await expect(search).toHaveValue('blue');
            expect(fileQueries).toContain('technology type:video');
            expect(fileQueries).toContain('technology');
          });
          EOF
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Static check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Sidebar browser regression
        working-directory: frontend
        run: npx playwright test tests/shell.spec.ts --project=chromium --grep 'sidebar kind filters'
      - name: Commit validated change and remove temporary workflow
        run: |
          rm .github/workflows/tmp-sidebar-kind-filters.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add frontend/src/lib/utils/sidebarKinds.ts frontend/src/lib/components/AppShell.svelte frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/queries/files.ts frontend/src/lib/state/libraryWorkflow.svelte.ts frontend/tests/shell.spec.ts .github/workflows/tmp-sidebar-kind-filters.yml
          git commit -m 'fix(sidebar): unify kind filters with visible queries'
          git push origin HEAD:fix/227-sidebar-kind-filters
