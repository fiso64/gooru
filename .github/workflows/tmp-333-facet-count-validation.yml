name: temporary #333 facet-count validation

on:
  push:
    branches:
      - perf/333-reuse-kind-facet-total

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l internal/serve/browse.go internal/serve/browse_aggregate_count_test.go)"
      - name: Focused regression tests
        run: go test ./internal/serve -run 'TestBrowse(UnfilteredAggregatesReuseKindFacetTotal|FilteredAggregatesReuseKindFacetTotal|AggregatesFallBackToExactCountWhenFacetsFail)$' -count=1
      - name: Server package
        run: go test ./internal/serve -count=1
