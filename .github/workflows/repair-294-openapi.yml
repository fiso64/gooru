name: Repair 294 OpenAPI edit

on:
  push:
    branches:
      - feat/248-upload-target-default-tags

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/248-upload-target-default-tags
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Revert oversized connector edit and apply one-line contract correction
        run: |
          git config user.name "gooru-maintainer"
          git config user.email "maintainer@users.noreply.github.com"
          git revert --no-edit 1836f6cf13a533f63d722811a59ff1c3a47d64d0
          node - <<'NODE'
          const fs = require('fs');
          const p = 'docs/openapi.yaml';
          let s = fs.readFileSync(p, 'utf8');
          const old = 'description: Visible editable tag/-tag directives prefilled for this upload target.';
          const next = 'description: Visible editable ordinary tags prefilled for this upload target.';
          if (!s.includes(old)) throw new Error('stale OpenAPI description not found');
          s = s.replace(old, next);
          fs.writeFileSync(p, s);
          NODE
      - name: Regenerate API client type
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit && npm run generate:api
      - name: Commit scoped correction
        run: |
          git add docs/openapi.yaml frontend/src/lib/api/openapi.ts
          git commit -m "docs(api): describe upload defaults as ordinary tags"
          git push origin HEAD:feat/248-upload-target-default-tags
