name: Maintainer 549 batch set-tag patch

on:
  push:
    branches:
      - maintainer/549-batch-set-query-tags

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/549-batch-set-query-tags
      - name: Apply focused batching cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('gooru/background_tag_mutation.go')
          text = path.read_text()
          old = '\t\tif len(tags) > 0 {\n\t\t\ttagIDs, err := c.tagIDsForMutation(tx, tags, true)\n\t\t\tif err != nil {\n\t\t\t\treturn 0, err\n\t\t\t}\n\t\t\tfor _, tagID := range tagIDs {\n\t\t\t\tinsertArgs := make([]interface{}, 0, len(args)+1)\n\t\t\t\tinsertArgs = append(insertArgs, tagID)\n\t\t\t\tinsertArgs = append(insertArgs, args...)\n\t\t\t\tif _, err := tx.Exec(\n\t\t\t\t\t`INSERT OR IGNORE INTO content_tags (content_hash, tag_id) SELECT hash, ? FROM (`+sqlQuery+`)`,\n\t\t\t\t\tinsertArgs...,\n\t\t\t\t); err != nil {\n\t\t\t\t\treturn 0, fmt.Errorf("associate snapshotted replacement tags: %w", err)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n'
          new = '\t\tif len(tags) > 0 {\n\t\t\ttagIDs, err := c.tagIDsForMutation(tx, tags, true)\n\t\t\tif err != nil {\n\t\t\t\treturn 0, err\n\t\t\t}\n\t\t\tif _, err := c.store.BatchAssociateTagsByContentQueryTx(tx, sqlQuery, args, tagIDs); err != nil {\n\t\t\t\treturn 0, fmt.Errorf("associate snapshotted replacement tags: %w", err)\n\t\t\t}\n\t\t}\n'
          if old not in text:
              raise SystemExit('background set-tag loop not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('gooru/tagging_query_exclusions.go')
          text = path.read_text()
          old = '\t\tif len(tags) > 0 {\n\t\t\ttagIDs, err := c.tagIDsForMutation(tx, tags, true)\n\t\t\tif err != nil {\n\t\t\t\treturn 0, err\n\t\t\t}\n\t\t\tfor _, tagID := range tagIDs {\n\t\t\t\tif _, err := tx.Exec("INSERT OR IGNORE INTO content_tags (content_hash, tag_id) SELECT hash, ? FROM hashes_to_update", tagID); err != nil {\n\t\t\t\t\treturn 0, fmt.Errorf("failed to associate replacement tags: %w", err)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n'
          new = '\t\tif len(tags) > 0 {\n\t\t\ttagIDs, err := c.tagIDsForMutation(tx, tags, true)\n\t\t\tif err != nil {\n\t\t\t\treturn 0, err\n\t\t\t}\n\t\t\tif _, err := c.store.BatchAssociateTagsByContentQueryTx(tx, "SELECT hash FROM hashes_to_update", nil, tagIDs); err != nil {\n\t\t\t\treturn 0, fmt.Errorf("failed to associate replacement tags: %w", err)\n\t\t\t}\n\t\t}\n'
          if old not in text:
              raise SystemExit('query-excluding set-tag loop not found')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w gooru/background_tag_mutation.go gooru/tagging_query_exclusions.go
      - name: Validate production change
        shell: bash
        run: |
          set -euxo pipefail
          go test ./gooru -count=1
          go vet -structtag=false ./gooru
      - name: Commit clean source patch
        shell: bash
        run: |
          set -euxo pipefail
          git rm .github/workflows/maintainer-549-batch-set.yml
          git add gooru/background_tag_mutation.go gooru/tagging_query_exclusions.go
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '1144995+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git commit -m 'perf: batch replacement tags for query mutations'
          git push origin HEAD:maintainer/549-batch-set-query-tags
