name: Maintainer 248 exclusion correction

on:
  push:
    branches:
      - feat/248-upload-target-default-tags
    paths:
      - .github/workflows/maintainer-248-correction.yml

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/248-upload-target-default-tags
          fetch-depth: 0
      - name: Apply correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "internal/serve/config.go",
              '''\t\tfor tagIndex := range cfg.Uploads.Targets[i].DefaultTags {\n\t\t\tcfg.Uploads.Targets[i].DefaultTags[tagIndex] = strings.TrimSpace(cfg.Uploads.Targets[i].DefaultTags[tagIndex])\n\t\t}\n\t\tif err := query.ValidateTags(cfg.Uploads.Targets[i].DefaultTags); err != nil {\n\t\t\terrs = append(errs, fmt.Errorf("uploads target %q default_tags: %w", id, err))\n\t\t}\n''',
              '''\t\tfor tagIndex := range cfg.Uploads.Targets[i].DefaultTags {\n\t\t\tvalue := strings.TrimSpace(cfg.Uploads.Targets[i].DefaultTags[tagIndex])\n\t\t\tcfg.Uploads.Targets[i].DefaultTags[tagIndex] = value\n\t\t\ttag := strings.TrimPrefix(value, "-")\n\t\t\tif err := query.ValidateTag(tag); err != nil {\n\t\t\t\terrs = append(errs, fmt.Errorf("uploads target %q default_tags: %w", id, err))\n\t\t\t}\n\t\t}\n''')

          replace(
              "internal/serve/upload_default_tags_test.go",
              '''\tcfg.Uploads.Targets = []UploadTarget{{ID: "default", Name: "Default", Path: t.TempDir(), DefaultTags: []string{" project:inbox ", "source:upload"}}}\n''',
              '''\tcfg.Uploads.Targets = []UploadTarget{{ID: "default", Name: "Default", Path: t.TempDir(), DefaultTags: []string{" project:inbox ", "source:upload", " -project:archive "}}}\n''')
          replace(
              "internal/serve/upload_default_tags_test.go",
              '''\tif got := cfg.Uploads.Targets[0].DefaultTags; len(got) != 2 || got[0] != "project:inbox" || got[1] != "source:upload" {\n''',
              '''\tif got := cfg.Uploads.Targets[0].DefaultTags; len(got) != 3 || got[0] != "project:inbox" || got[1] != "source:upload" || got[2] != "-project:archive" {\n''')

          replace(
              "docs/CONFIG.md",
              '''| `default_tags` | Optional list of ordinary tags used to pre-populate the Upload tab when this destination is selected. These tags remain visible and editable before upload. |''',
              '''| `default_tags` | Optional list of tags and `-tag` exclusions used to pre-populate the Upload tab when this destination is selected. These values remain visible and editable before upload. |''')
          replace(
              "docs/CONFIG.md",
              '''        - source:upload\n''',
              '''        - source:upload\n        - -project:archive\n''')
          replace(
              "docs/openapi.yaml",
              '''description: Visible editable ordinary tags prefilled for this upload target.''',
              '''description: Visible editable tags and -tag exclusions prefilled for this upload target.''')
          replace(
              "frontend/src/lib/api/openapi.ts",
              '''/** @description Visible editable ordinary tags prefilled for this upload target. */''',
              '''/** @description Visible editable tags and -tag exclusions prefilled for this upload target. */''')

          replace(
              "frontend/tests/upload-drop-control.spec.ts",
              '''{ id: 'inbox', name: 'Inbox', default_tags: ['project:inbox', 'source:upload'] },''',
              '''{ id: 'inbox', name: 'Inbox', default_tags: ['project:inbox', 'source:upload', '-project:archive'] },''')
          replace(
              "frontend/tests/upload-drop-control.spec.ts",
              '''  await expect(config.getByText('upload', { exact: true })).toBeVisible();\n''',
              '''  await expect(config.getByText('upload', { exact: true })).toBeVisible();\n  await expect(config.getByRole('button', { name: 'Remove -project:archive' })).toBeVisible();\n''')
          PY
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Focused Go regression
        run: go test ./internal/serve
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend unit regression
        working-directory: frontend
        run: npm run test:unit -- --run src/lib/state/uploadWorkflow.svelte.test.ts
      - name: Select Chromium
        shell: bash
        run: |
          chrome="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -n "$chrome" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          else
            cd frontend
            npx playwright install chromium
          fi
      - name: Focused browser regression
        working-directory: frontend
        run: npx playwright test tests/upload-drop-control.spec.ts --project=chromium
      - name: Commit clean correction
        shell: bash
        run: |
          rm -f .github/workflows/maintainer-248-integration-validation.yml .github/workflows/maintainer-248-correction.yml
          git config user.name maintainer
          git config user.email maintainer@localhost
          git add -A
          git commit -m 'fix(webui): support upload default tag exclusions'
          git push origin HEAD:feat/248-upload-target-default-tags
