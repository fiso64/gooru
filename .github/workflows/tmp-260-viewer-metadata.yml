name: Temporary issue 260 implementation
on:
  push:
    branches:
      - fix/260-viewer-metadata
permissions:
  contents: write
jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply issue 260 implementation
        run: |
          python3 .github/tmp-260-apply.py
          gofmt -w types/types.go internal/database/database.go internal/database/migration_test.go internal/serve/metadata.go internal/serve/browse.go internal/serve/uploads.go internal/serve/upload_cbz_e2e_test.go
      - name: Generate frontend API types
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
      - name: Go build
        run: go build ./...
      - name: Go test
        run: go test ./...
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test tests/viewer-metadata.spec.ts --project=chromium
      - name: Commit validated implementation
        run: |
          rm .github/workflows/tmp-260-viewer-metadata.yml .github/tmp-260-apply.py
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: persist comic page counts in viewer metadata"
          git push
