name: Temporary semantic select-all validation
on:
  push:
    branches:
      - feat/21-query-select-all
    paths:
      - .github/workflows/temp-select-all.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/21-query-select-all
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Integrate library controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = p.read_text()
          text = text.replace("    kind: 'none' | 'save-create' | 'save-update' | 'save-delete' | 'bulk-selected' | 'bulk-remove-selected' | 'bulk-filtered' | 'untrack-file' | 'delete-file';", "    kind: 'none' | 'save-create' | 'save-update' | 'save-delete' | 'bulk-selected' | 'bulk-remove-selected' | 'untrack-file' | 'delete-file';")
          text = text.replace('  const fileMetadataKey = $derived(`${authScope}|${$submittedSearch}|${library.activeKind}|${library.sort}|${library.order}`);', '  const fileMetadataKey = $derived(`${authScope}|${$submittedSearch}|${library.activeKind}|${library.sort}|${library.order}`);\n  const currentTotalCount = $derived(fileMetadata?.total_count ?? loadedFiles.length);\n  const selectedCount = $derived(library.selectedCount(currentTotalCount));')
          text = text.replace("\n  function bulkTagFiltered() {\n    actionDialog = { kind: 'bulk-filtered', value: '', error: '', busy: false, id: '', name: '', previousQuery: '' };\n  }\n", '\n')
          text = text.replace('tagWorkflow.bulkSelected(library.selectedIDs, value', 'tagWorkflow.bulkSelected(library.selection, value')
          text = text.replace("      } else if (actionDialog.kind === 'bulk-filtered') {\n        await tagWorkflow.bulkFiltered(library.filterQuery(), value, (variables) => tagMutation.mutateAsync(variables));\n", '')
          text = text.replace("      case 'bulk-filtered': return 'Tag filtered results';\n", '')
          text = text.replace("      case 'bulk-filtered': return 'Add tags to every file matching the current filter without materializing all results.';\n", '')
          text = text.replace("      case 'bulk-filtered': return 'Add tags';\n", '')
          text = text.replace("      case 'bulk-selected': return `Add tags to ${library.selectedIDs.size} selected file${library.selectedIDs.size === 1 ? '' : 's'}.`;", "      case 'bulk-selected': return `Add tags to ${selectedCount} selected file${selectedCount === 1 ? '' : 's'}.`;")
          text = text.replace("      case 'bulk-remove-selected': return `Remove tags from ${library.selectedIDs.size} selected file${library.selectedIDs.size === 1 ? '' : 's'}.`;", "      case 'bulk-remove-selected': return `Remove tags from ${selectedCount} selected file${selectedCount === 1 ? '' : 's'}.`;")
          text = text.replace('        selectedIDs={library.selectedIDs}', '        selectedCount={selectedCount}\n        isSelected={library.isSelected}')
          text = text.replace('        onSelectAll={() => library.selectFiles(files)}', '        onSelectAll={library.selectAll}')
          actions = '          <div class="library-head-actions">\n            <div class="seg" aria-label="Sort field">'
          replacement = '          <div class="library-head-actions">\n            <label class="g-btn g-btn-sm" title="Select all files in the current view">\n              <input type="checkbox" aria-label="Select all files in current view" checked={currentTotalCount > 0 && selectedCount === currentTotalCount} onchange={(event) => event.currentTarget.checked ? library.selectAll() : library.clearSelection()} />\n              Select all\n            </label>\n            <div class="seg" aria-label="Sort field">'
          if actions not in text: raise SystemExit('library actions block changed unexpectedly')
          text = text.replace(actions, replacement, 1)
          filtered = '            {#if library.filterQuery()}\n              <button class="g-btn g-btn-sm" type="button" title="Tag every matching file without materializing all results" onclick={bulkTagFiltered}>\n                <Icon name="tag" size={14} /> Tag filtered\n              </button>\n            {/if}\n'
          if filtered not in text: raise SystemExit('Tag filtered button changed unexpectedly')
          p.write_text(text.replace(filtered, '', 1))
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Format Go
        run: gofmt -w internal/serve/tag_mutations.go internal/serve/tag_mutation_exclusions_test.go gooru/tagging_query_exclusions.go gooru/tagging_query_exclusions_test.go
      - name: Validate Go
        run: |
          go build ./...
          go test ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run test:unit
          npm run check
          npm run build
      - name: Commit integrated UI
        run: |
          git config user.name autonomous-maintainer
          git config user.email autonomous-maintainer@users.noreply.github.com
          git add frontend/src/lib/components/AuthenticatedApp.svelte internal/serve/tag_mutations.go internal/serve/tag_mutation_exclusions_test.go gooru/tagging_query_exclusions.go gooru/tagging_query_exclusions_test.go
          if ! git diff --cached --quiet; then
            git commit -m "feat(library): select all matching files"
            git push origin HEAD:feat/21-query-select-all
          fi
