name: Temporary select-all contract update
on:
  push:
    branches:
      - feat/21-query-select-all
    paths:
      - .github/workflows/temp-select-all.yml
permissions:
  contents: write
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/21-query-select-all
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update query-exclusion contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/openapi.yaml')
          text = p.read_text()
          old = """        query:
                    type: string
                    description: Query selector. Exactly one of file_ids or query must be provided.
                  tags:"""
          new = """        query:
                    type: string
                    description: Query selector. Exactly one of file_ids or query must be provided.
                  exclude_file_ids:
                    type: array
                    items:
                      type: string
                    description: Opaque file IDs to exclude from a query selector. Only valid with query.
                  tags:"""
          if old not in text:
              raise SystemExit('TagMutationRequest schema block changed unexpectedly')
          text = text.replace(old, new, 1)
          old = """            query:
                          type: string
                    matched_files:"""
          new = """            query:
                          type: string
                        exclude_file_ids:
                          type: array
                          items:
                            type: string
                    matched_files:"""
          if old not in text:
              raise SystemExit('TagMutationResponse selector block changed unexpectedly')
          p.write_text(text.replace(old, new, 1))
          PY
          cd frontend
          npm ci
          npm run generate:api
          cd ..
          git config user.name autonomous-maintainer
          git config user.email autonomous-maintainer@users.noreply.github.com
          git add docs/openapi.yaml frontend/src/lib/api/openapi.ts
          git commit -m "feat(api): expose query selection exclusions"
          git push origin HEAD:feat/21-query-select-all
