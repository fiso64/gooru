name: Maintainer 817 cleanup

on:
  push:
    branches:
      - maintainer-817-nixos-instances

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/maintainer-817-lazy-fix3.yml
          git config user.name gooru-maintainer
          git config user.email 64778819+fiso64@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove temporary validation workflow'
          git push origin HEAD:maintainer-817-nixos-instances
