name: Temporary PDF API generation
on:
  push:
    branches: [feat-pdf-scrolling-viewer]
    paths:
      - .github/workflows/maintainer-pdf-api-generation.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate and commit frontend OpenAPI types
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit
          npm run generate:api
          if ! git diff --quiet -- src/lib/api/openapi.ts; then
            git config user.name "gooru-maintainer"
            git config user.email "gooru-maintainer@users.noreply.github.com"
            git add src/lib/api/openapi.ts
            git commit -m "chore(api): regenerate frontend PDF viewer types"
            git push origin HEAD:feat-pdf-scrolling-viewer
          fi
