name: Validate 401 background runtime

on:
  push:
    branches:
      - refactor/401-background-runtime

permissions:
  contents: read

concurrency:
  group: validate-401-background-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format guard
        run: test -z "$(gofmt -l gooru/background.go gooru/database_boundary.go internal/serve/background_runtime.go internal/serve/background_runtime_test.go)"
      - name: Focused tests
        run: go test ./gooru ./internal/background ./internal/serve
      - name: Full Go tests
        run: go test ./...
      - name: Build
        run: go build ./...
