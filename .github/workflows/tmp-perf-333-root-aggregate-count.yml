name: Temporary perf 333 root aggregate edit

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused edit
        run: python3 .github/tmp/perf333_apply.py
      - name: Validate
        run: |
          gofmt -w internal/serve/browse.go internal/serve/browse_aggregate_count_test.go
          go test ./internal/serve
      - name: Commit validated change and remove temporary machinery
        run: |
          rm .github/workflows/tmp-perf-333-root-aggregate-count.yml .github/tmp/perf333_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf(browse): reuse unfiltered aggregate count"
          git push origin HEAD:perf/333-root-aggregate-count
