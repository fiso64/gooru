name: Refine shared tag entry

on:
  push:
    branches: [refactor/21-shared-tag-entry]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/21-shared-tag-entry
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply self-review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          suggestions = Path('frontend/src/lib/utils/tagSuggestions.ts')
          text = suggestions.read_text()
          text += '''\nexport function plainTagsFromInput(value: string): string[] {\n  return Array.from(new Set(value.split(/\\s+/).map((tag) => tag.trim()).filter(isPlainTag)));\n}\n'''
          suggestions.write_text(text)

          test = Path('frontend/src/lib/utils/tagSuggestions.test.ts')
          text = test.read_text().replace("import { isPlainTag, plainTagSuggestions } from './tagSuggestions';", "import { isPlainTag, plainTagSuggestions, plainTagsFromInput } from './tagSuggestions';")
          text += '''\ndescribe('plainTagsFromInput', () => {\n  it('preserves multi-tag entry while excluding search-only syntax', () => {\n    expect(plainTagsFromInput('artist:alice landscape @rating:5 -exclude landscape')).toEqual(['artist:alice', 'landscape']);\n  });\n});\n'''
          test.write_text(text)

          component = Path('frontend/src/lib/components/TagAutocompleteInput.svelte')
          text = component.read_text()
          text = text.replace("import { isPlainTag, plainTagSuggestions, type TagCandidate }", "import { plainTagSuggestions, plainTagsFromInput, type TagCandidate }")
          text = text.replace("    value,\n    tags,", "    id,\n    value,\n    tags,", 1)
          text = text.replace("  } = $props<{\n    value: string;", "  } = $props<{\n    id?: string;\n    value: string;", 1)
          old = "    const tag = raw.trim();\n    if (!isPlainTag(tag) || existing.includes(tag)) return;\n    open = false;\n    active = 0;\n    onCommit(tag);"
          new = "    const tags = plainTagsFromInput(raw).filter((tag) => !existing.includes(tag));\n    if (!tags.length) return;\n    open = false;\n    active = 0;\n    onCommit(tags.join(' '));"
          if old not in text:
              raise SystemExit('component commit block not found')
          text = text.replace(old, new, 1)
          text = text.replace("  <input\n    bind:this={inputRef}", "  <input\n    {id}\n    bind:this={inputRef}", 1)
          component.write_text(text)

          editor = Path('frontend/src/lib/components/TagEditor.svelte')
          text = editor.read_text().replace("    <TagAutocompleteInput\n      value={draft}", "    <TagAutocompleteInput\n      id={`tags-${fileID}`}\n      value={draft}", 1)
          editor.write_text(text)

          upload = Path('frontend/src/lib/components/UploadPanel.svelte')
          text = upload.read_text()
          old = "  function commitInitialTag(tag: string) {\n    onTagsInput(Array.from(new Set([...initialTags, tag])).join(' '));\n    tagDraft = '';\n  }"
          new = "  function commitInitialTag(tagInput: string) {\n    onTagsInput(Array.from(new Set([...initialTags, ...parseTags(tagInput)])).join(' '));\n    tagDraft = '';\n  }"
          if old not in text:
              raise SystemExit('upload commit block not found')
          upload.write_text(text.replace(old, new, 1))

          css = Path('frontend/src/lib/styles/components.css')
          text = css.read_text()
          old = '''.upload-tags-control {\n  flex-wrap: wrap;\n}\n\n.upload-tag-entry {\n  flex: 1 1 220px;\n  min-width: 180px;\n  max-width: 320px;\n}\n'''
          new = '''.upload-tags-control {\n  flex-wrap: wrap;\n  min-height: 36px;\n  padding: 4px 8px;\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--r-3);\n  font-family: var(--font-mono);\n  font-size: 12px;\n}\n\n.upload-tags-control:focus-within {\n  border-color: var(--accent-line);\n}\n'''
          if old not in text:
              raise SystemExit('upload tag styles not found')
          css.write_text(text.replace(old, new, 1))
          PY
      - name: Backend validation
        run: |
          go build ./...
          go test ./...
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm run test:unit
          npm run check
          npm run build
      - name: Commit refined slice and remove temporary workflow
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-shared-tag-entry.yml
          git add frontend/src/lib/components/TagAutocompleteInput.svelte frontend/src/lib/components/TagEditor.svelte frontend/src/lib/components/UploadPanel.svelte frontend/src/lib/utils/tagSuggestions.ts frontend/src/lib/utils/tagSuggestions.test.ts frontend/src/lib/styles/components.css
          git commit -m "refactor(frontend): preserve tag-entry ergonomics"
          git push origin HEAD:refactor/21-shared-tag-entry
