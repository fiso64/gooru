name: Maintainer 401 current validation

on:
  push:
    branches:
      - maintainer/401-durable-upload-http-v2

permissions:
  contents: read

concurrency:
  group: maintainer-401-current-validation
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Test
        shell: bash
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Check
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Browser regressions
        run: npm run test:e2e -- startup-query-churn.spec.ts upload-metadata-refresh.spec.ts upload-concurrency.spec.ts hover-media-preview.spec.ts saved-search-completions.spec.ts
      - name: Build
        run: npm run build
