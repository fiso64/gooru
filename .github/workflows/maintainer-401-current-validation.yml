name: Maintainer 401 current validation

on:
  push:
    branches:
      - maintainer/401-durable-upload-http-v2

permissions:
  contents: read

concurrency:
  group: maintainer-401-current-validation
  cancel-in-progress: true

jobs:
  go:
    name: Full Go validation
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...
