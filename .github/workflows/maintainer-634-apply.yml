name: Apply maintainer 634 patch
on:
  push:
    branches: [maintainer/634-relink-scan-errors]
permissions:
  contents: write
jobs:
  apply:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 temp/maintainer_634.py
          gofmt -w internal/scanning/scanner.go gooru/sync.go gooru/sync_test.go
          go test ./...
          git config user.name autonomous-maintainer
          git config user.email actions@users.noreply.github.com
          git add internal/scanning/scanner.go gooru/sync.go gooru/sync_test.go
          git rm temp/maintainer_634.py .github/workflows/maintainer-634-apply.yml
          git commit -m 'Fail closed on relink scan errors (#634)'
          git push origin HEAD:maintainer/634-relink-scan-errors
