name: Maintainer hidden-tag facet v2

on:
  push:
    branches:
      - perf/333-hidden-tag-facets-v2

permissions:
  contents: write

jobs:
  test:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w gooru/query.go gooru/query_tag_fastpath.go gooru/query_tag_exclusion_facets.go gooru/query_tag_exclusion_facets_test.go internal/database/tag_kind_counts.go types/tag_facets.go
          set +e
          timeout 240s go test ./gooru ./internal/database ./internal/serve > /tmp/hidden-tag-test.log 2>&1
          status=$?
          set -e
          git config user.name "Gooru autonomous maintainer"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/maintainer-hidden-tag-v2.yml
          if [ "$status" -ne 0 ]; then
            cp /tmp/hidden-tag-test.log .maintainer-hidden-tag-test.log
            git add -A
            git commit -m "ci: capture hidden-tag facet validation failure"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit "$status"
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "ci: remove temporary hidden-tag validation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
