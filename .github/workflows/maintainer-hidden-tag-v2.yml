name: Maintainer hidden-tag facet v2

on:
  push:
    branches:
      - perf/333-hidden-tag-facets-v2

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Wire and validate exclusion fast path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("gooru/query.go")
          text = path.read_text()
          old = '''\tif filter, ok := parseSimpleUserTagFacetFilter(expression); ok {
          \t\tif filter.KeyOnly {
          \t\t\treturn c.store.KindFacetsForTagKey(filter.Tag.Key)
          \t\t}
          \t\treturn c.store.KindFacetsForTag(filter.Tag.Key, filter.Tag.Value)
          \t}
          \tsqlQuery, args, err := c.buildLocationQuery(expression)
          '''
          new = '''\tif filter, ok := parseSimpleUserTagFacetFilter(expression); ok {
          \t\tif filter.KeyOnly {
          \t\t\treturn c.store.KindFacetsForTagKey(filter.Tag.Key)
          \t\t}
          \t\treturn c.store.KindFacetsForTag(filter.Tag.Key, filter.Tag.Value)
          \t}
          \tif exclusions, ok := parseSimpleUserTagFacetExclusions(expression); ok {
          \t\treturn c.kindFacetsForUserTagExclusions(exclusions)
          \t}
          \tsqlQuery, args, err := c.buildLocationQuery(expression)
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one KindFacetsByQuery insertion point, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          gofmt -w gooru/query.go gooru/query_tag_fastpath.go gooru/query_tag_exclusion_facets.go gooru/query_tag_exclusion_facets_test.go internal/database/tag_kind_counts.go
          set +e
          go test ./gooru ./internal/database ./internal/serve > /tmp/hidden-tag-test.log 2>&1
          status=$?
          set -e
          git config user.name "Gooru autonomous maintainer"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/maintainer-hidden-tag-v2.yml
          if [ "$status" -ne 0 ]; then
            cp /tmp/hidden-tag-test.log .maintainer-hidden-tag-test.log
            git add gooru/query.go gooru/query_tag_fastpath.go gooru/query_tag_exclusion_facets.go gooru/query_tag_exclusion_facets_test.go internal/database/tag_kind_counts.go .maintainer-hidden-tag-test.log .github/workflows/maintainer-hidden-tag-v2.yml
            git commit -m "ci: capture hidden-tag facet failure"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit "$status"
          fi
          git add gooru/query.go gooru/query_tag_fastpath.go gooru/query_tag_exclusion_facets.go gooru/query_tag_exclusion_facets_test.go internal/database/tag_kind_counts.go .github/workflows/maintainer-hidden-tag-v2.yml
          git commit -m "perf: avoid full facet scans for hidden tags"
          git push origin "HEAD:${GITHUB_REF_NAME}"
