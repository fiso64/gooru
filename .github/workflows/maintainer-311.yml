name: Maintainer #311 patch

on:
  push:
    branches:
      - fix/311-page-nav-container-width

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.head_commit.message != 'fix(ui): keep authoritative paged library totals'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch authoritative paged metadata and regression fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text()
          anchor = "  const kindFacetsQuery = createFileFacetsQuery(() => Boolean($authState.user), () => sidebarBaseQuery, () => authScope, () => library.route === 'library');\n"
          replacement = anchor + "  const pagedMetadataQuery = createFileFacetsQuery(() => Boolean($authState.user), () => $submittedSearch, () => authScope, () => library.route === 'library' && $runtimeConfig.paginationMode === 'paged');\n"
          assert text.count(anchor) == 1
          text = text.replace(anchor, replacement)
          old = "    const metadataPage = filesQuery.data?.pages.find((page) => page.facets) ?? filesQuery.data?.pages[0];"
          new = "    const metadataPage = pagedMode\n      ? pagedMetadataQuery.data\n      : filesQuery.data?.pages.find((page) => page.facets);"
          assert text.count(old) == 1
          text = text.replace(old, new)
          app.write_text(text)

          spec = Path('frontend/tests/paged-library.spec.ts')
          text = spec.read_text()
          old = """    const files = allFiles.slice(offset, offset + limit);\n    await route.fulfill({ contentType: 'application/json', body: JSON.stringify({\n      files, total_count: allFiles.length, library_count: allFiles.length,\n      facets: offset === 0 ? { kind: [{ value: 'photo', count: allFiles.length }] } : undefined,\n      next_page_token: offset + limit < allFiles.length ? String(offset + limit) : undefined,\n      previous_page_token: offset > 0 ? String(Math.max(0, offset - limit)) : undefined\n    }) });"""
          new = """    const files = allFiles.slice(offset, offset + limit);\n    const includeFacets = url.searchParams.get('include_facets') === 'true';\n    const hasNext = offset + limit < allFiles.length;\n    const totalCount = includeFacets ? allFiles.length : offset + files.length + (hasNext ? 1 : 0);\n    await route.fulfill({ contentType: 'application/json', body: JSON.stringify({\n      files, total_count: totalCount, library_count: includeFacets ? allFiles.length : 0,\n      facets: includeFacets ? { kind: [{ value: 'photo', count: allFiles.length }] } : undefined,\n      next_page_token: hasNext ? String(offset + limit) : undefined,\n      previous_page_token: offset > 0 ? String(Math.max(0, offset - limit)) : undefined\n    }) });"""
          assert text.count(old) == 1
          text = text.replace(old, new)
          anchor = "  await expect(page.getByRole('button', { name: 'Page 4', exact: true })).toHaveAttribute('aria-current', 'page');\n  await expect(page).toHaveURL(/[?&]page=4(?:&|$)/);"
          replacement = anchor + "\n  await expect(page.getByRole('button', { name: 'Page 11', exact: true })).toBeVisible();"
          assert text.count(anchor) == 1
          text = text.replace(anchor, replacement)
          spec.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Check frontend
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Paged library browser regression
        working-directory: frontend
        run: npx playwright test tests/paged-library.spec.ts --project=chromium
      - name: Commit validated fix
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/AuthenticatedApp.svelte frontend/tests/paged-library.spec.ts
          git commit -m 'fix(ui): keep authoritative paged library totals'
          git push origin HEAD:fix/311-page-nav-container-width
