name: Maintainer 311

on:
  push:
    branches:
      - fix/311-standard-pager

permissions:
  contents: write

concurrency:
  group: maintainer-311
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/311-standard-pager
      - name: Apply pager integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'patch anchor missing in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          path = 'frontend/src/lib/queries/files.ts'
          replace(path,
              "import { libraryKeys } from './library';\n",
              "import { libraryKeys } from './library';\nimport { offsetPageToken } from '$lib/utils/pagination';\n")
          replace(path,
              "  pages: (scope: number, query: string, kind: string, sort: FileSort, order: SortOrder, limit: number, paged: boolean) =>\n    ['files', 'pages', scope, query, kind, sort, order, limit, paged ? 'paged' : 'infinite'] as const,",
              "  pages: (scope: number, query: string, kind: string, sort: FileSort, order: SortOrder, limit: number, paged: boolean, pageIndex: number) =>\n    ['files', 'pages', scope, query, kind, sort, order, limit, paged ? `paged:${pageIndex}` : 'infinite'] as const,")
          replace(path,
              "  getPageLimit: () => number = () => pageLimit,\n  getPaged: () => boolean = () => false\n) {\n  return createInfiniteQuery<FileListResponse, Error, InfiniteData<FileListResponse, string>, ReturnType<typeof fileKeys.pages>, string>(() => ({\n    ...filesQueryOptions(getAuthenticated, getSearch, getKind, getSort, getOrder, getAuthScope, getPageLimit, getPaged),",
              "  getPageLimit: () => number = () => pageLimit,\n  getPaged: () => boolean = () => false,\n  getPageIndex: () => number = () => 0\n) {\n  return createInfiniteQuery<FileListResponse, Error, InfiniteData<FileListResponse, string>, ReturnType<typeof fileKeys.pages>, string>(() => ({\n    ...filesQueryOptions(getAuthenticated, getSearch, getKind, getSort, getOrder, getAuthScope, getPageLimit, getPaged, getPageIndex),")
          replace(path,
              "  getPageLimit: () => number = () => pageLimit,\n  getPaged: () => boolean = () => false\n) {\n  const limit = getPageLimit();\n  const paged = getPaged();\n  return {\n    queryKey: fileKeys.pages(getAuthScope(), getSearch(), getKind(), getSort(), getOrder(), limit, paged),\n    enabled: getAuthenticated(),\n    initialPageParam: '',",
              "  getPageLimit: () => number = () => pageLimit,\n  getPaged: () => boolean = () => false,\n  getPageIndex: () => number = () => 0\n) {\n  const limit = getPageLimit();\n  const paged = getPaged();\n  const pageIndex = paged ? Math.max(0, Math.floor(getPageIndex())) : 0;\n  return {\n    queryKey: fileKeys.pages(getAuthScope(), getSearch(), getKind(), getSort(), getOrder(), limit, paged, pageIndex),\n    enabled: getAuthenticated(),\n    initialPageParam: paged ? offsetPageToken(pageIndex, limit) : '',")

          path = 'frontend/src/lib/components/AuthenticatedApp.svelte'
          replace(path,
              "    () => $runtimeConfig.itemsPerPage,\n    () => $runtimeConfig.paginationMode === 'paged'\n  );",
              "    () => $runtimeConfig.itemsPerPage,\n    () => $runtimeConfig.paginationMode === 'paged',\n    () => pagedPageIndex\n  );")
          replace(path,
              "  async function loadNextFilesPage() {\n    if (!filesQuery.hasNextPage || filesQuery.isFetchingNextPage) return;\n    const result = await filesQuery.fetchNextPage();\n    if (pagedMode && !result.isError) pagedPageIndex += 1;\n  }\n\n  async function loadPreviousFilesPage() {\n    if (!filesQuery.hasPreviousPage || filesQuery.isFetchingPreviousPage) return;\n    const result = await filesQuery.fetchPreviousPage();\n    if (pagedMode && !result.isError) pagedPageIndex = Math.max(0, pagedPageIndex - 1);\n  }",
              "  async function loadNextFilesPage() {\n    if (pagedMode || !filesQuery.hasNextPage || filesQuery.isFetchingNextPage) return;\n    await filesQuery.fetchNextPage();\n  }\n\n  async function loadPreviousFilesPage() {\n    if (pagedMode || !filesQuery.hasPreviousPage || filesQuery.isFetchingPreviousPage) return;\n    await filesQuery.fetchPreviousPage();\n  }\n\n  function selectFilesPage(pageIndex: number) {\n    if (!pagedMode || filesQuery.isFetching || pageIndex === pagedPageIndex) return;\n    pagedPageIndex = Math.min(Math.max(0, pageIndex), Math.max(0, pagedPageCount - 1));\n  }")
          replace(path,
              "        onLoadMore={loadNextFilesPage}\n        onLoadPrevious={loadPreviousFilesPage}\n      >",
              "        onLoadMore={loadNextFilesPage}\n        onLoadPrevious={loadPreviousFilesPage}\n        onPage={selectFilesPage}\n      >")

          path = 'frontend/src/lib/components/MediaGrid.svelte'
          replace(path,
              "  import { hasCommandModifier, isEditableShortcutTarget } from '$lib/utils/keyboard';\n",
              "  import { hasCommandModifier, isEditableShortcutTarget } from '$lib/utils/keyboard';\n  import { paginationWindow } from '$lib/utils/pagination';\n")
          replace(path,
              "    onBulkDelete, onLoadMore, onLoadPrevious, actions\n",
              "    onBulkDelete, onLoadMore, onLoadPrevious, onPage, actions\n")
          replace(path,
              "    onBulkUntrack: () => void; onBulkDelete: () => void; onLoadMore: () => void | Promise<void>;\n    onLoadPrevious: () => void | Promise<void>; actions?: Snippet;",
              "    onBulkUntrack: () => void; onBulkDelete: () => void; onLoadMore: () => void | Promise<void>;\n    onLoadPrevious: () => void | Promise<void>; onPage: (pageIndex: number) => void; actions?: Snippet;")
          replace(path,
              "  async function movePaged(direction: 'previous' | 'next') {\n    if (direction === 'previous') await onLoadPrevious();\n    else await onLoadMore();\n    mainHost?.scrollTo({ top: 0 });\n    paneScrollY = 0;\n  }",
              "  function selectPagedPage(page: number) {\n    if (page < 1 || page > pageCount || page === pageNumber || isFetchingNextPage || isFetchingPreviousPage) return;\n    onPage(page - 1);\n    mainHost?.scrollTo({ top: 0 });\n    paneScrollY = 0;\n  }")
          replace(path,
              "    <div bind:this={gridHost} class=\"virtual-grid\" style={`height: ${squareVirtual.totalHeight}px;`}>",
              "    <div bind:this={gridHost} class=\"virtual-grid\" class:paged-virtual-grid={pagedMode} style={`height: ${squareVirtual.totalHeight}px;`}>")
          replace(path,
              "    <div bind:this={gridHost} class=\"virtual-grid\" style={`height: ${tileVirtual.totalHeight}px;`}>",
              "    <div bind:this={gridHost} class=\"virtual-grid\" class:paged-virtual-grid={pagedMode} style={`height: ${tileVirtual.totalHeight}px;`}>")
          replace(path,
              '''  {#if pagedMode && files.length}\n    <nav class="library-pager" aria-label="Library pages" data-testid="library-pager">\n      <button class="g-btn g-btn-sm" type="button" disabled={!hasPreviousPage || isFetchingPreviousPage || isFetchingNextPage} onclick={() => void movePaged('previous')}>Previous</button>\n      <span>Page {pageNumber.toLocaleString()} of {pageCount.toLocaleString()}</span>\n      <button class="g-btn g-btn-sm" type="button" disabled={!hasNextPage || isFetchingNextPage || isFetchingPreviousPage} onclick={() => void movePaged('next')}>Next</button>\n    </nav>''',
              '''  {#if pagedMode && files.length}\n    <nav class="library-pager" aria-label="Library pages" data-testid="library-pager">\n      <button class="g-btn g-btn-sm" type="button" aria-label="Previous page" disabled={pageNumber <= 1 || isFetchingPreviousPage || isFetchingNextPage} onclick={() => selectPagedPage(pageNumber - 1)}>Previous</button>\n      <div class="library-pager-pages">\n        {#each paginationWindow(pageNumber, pageCount) as control, index (`${control}-${index}`)}\n          {#if control === 'ellipsis'}\n            <span class="library-pager-ellipsis" aria-hidden="true">…</span>\n          {:else}\n            <button\n              class="g-btn g-btn-sm library-page-button"\n              type="button"\n              aria-label={`Page ${control}`}\n              aria-current={control === pageNumber ? 'page' : undefined}\n              disabled={isFetchingPreviousPage || isFetchingNextPage}\n              onclick={() => selectPagedPage(control)}\n            >{control.toLocaleString()}</button>\n          {/if}\n        {/each}\n      </div>\n      <button class="g-btn g-btn-sm" type="button" aria-label="Next page" disabled={pageNumber >= pageCount || isFetchingNextPage || isFetchingPreviousPage} onclick={() => selectPagedPage(pageNumber + 1)}>Next</button>\n    </nav>''')
          PY
          if ! git diff --quiet -- frontend/src/lib/queries/files.ts frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/components/MediaGrid.svelte; then
            git config user.name "chatgpt-codex-connector[bot]"
            git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
            git add frontend/src/lib/queries/files.ts frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/components/MediaGrid.svelte
            git commit -m "feat(ui): add direct numbered library pagination"
            git push origin HEAD:fix/311-standard-pager
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Check frontend
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Browser pagination regression
        working-directory: frontend
        run: npx playwright test tests/paged-library.spec.ts
