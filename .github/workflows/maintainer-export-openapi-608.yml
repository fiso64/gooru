name: Maintainer export OpenAPI #608

on:
  push:
    branches:
      - maintainer/fix-606-inaccurate-ui

permissions:
  contents: read

jobs:
  export-openapi:
    if: github.event.head_commit.message == 'ci: export openapi for maintainer edit'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-608-${{ github.run_id }}
          path: docs/openapi.yaml
          if-no-files-found: error
          retention-days: 1
