name: Validate 331 upload responsiveness

on:
  push:
    branches:
      - fix/331-inline-upload-import-status

permissions:
  contents: read

jobs:
  upload-e2e:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Focused upload browser regression
        run: npx playwright test tests/upload-concurrency.spec.ts --project=chromium
