name: Validate 331

on:
  push:
    branches:
      - fix/331-upload-job-reconciliation

permissions:
  contents: write

concurrency:
  group: validate-331-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/331-upload-job-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Document batch job lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/openapi.yaml')
          text = path.read_text()
          needle = '''      parameters:\n        - name: status\n          in: query\n          required: false\n          schema:\n            type: string\n            enum: [pending, running, completed, failed, canceled]\n'''
          replacement = '''      parameters:\n        - name: id\n          in: query\n          required: false\n          description: Specific asynchronous job IDs to return. May be repeated; at most 64 unique IDs are accepted.\n          schema:\n            type: array\n            maxItems: 64\n            items:\n              type: string\n          style: form\n          explode: true\n        - name: status\n          in: query\n          required: false\n          schema:\n            type: string\n            enum: [pending, running, completed, failed, canceled]\n'''
          if 'Specific asynchronous job IDs to return.' not in text:
              if needle not in text:
                  raise SystemExit('jobs parameters block not found')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Regenerate API client
        working-directory: frontend
        run: npm run generate:api
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
          npm run build
      - name: Focused upload browser regression
        working-directory: frontend
        run: |
          chrome="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -n "$chrome" ]; then
            export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$chrome"
          fi
          npx playwright test tests/upload-concurrency.spec.ts --project=chromium
      - name: Persist API contract regeneration
        run: |
          if git diff --quiet -- docs/openapi.yaml frontend/src/lib/api/openapi.ts; then
            exit 0
          fi
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/openapi.yaml frontend/src/lib/api/openapi.ts
          git commit -m 'docs(api): document batched job status lookup'
          git push origin HEAD:fix/331-upload-job-reconciliation
