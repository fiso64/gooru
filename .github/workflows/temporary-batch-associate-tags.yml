name: Temporary batch tag association validation

on:
  push:
    branches:
      - maintainer/549-batch-associate-tags-query
    paths:
      - .github/workflows/temporary-batch-associate-tags.yml
      - internal/database/database.go
      - internal/database/batch_associate_tags_test.go

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Run focused database regressions
        run: go test ./internal/database -run '^TestBatchAssociateTagsByContentQueryTx' -count=1
