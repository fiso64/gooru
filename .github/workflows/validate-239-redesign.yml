name: Validate 239 comic redesign

on:
  push:
    branches:
      - feat/231-comic-ui

permissions:
  contents: read

jobs:
  e2e:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Focused Chromium comic UI
        run: npm run test:e2e -- comic-ui.spec.ts --project=chromium
