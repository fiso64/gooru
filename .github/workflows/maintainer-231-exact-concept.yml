name: Maintainer 231 exact concept correction

on:
  push:
    branches:
      - feat/231-comic-ui

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/231-comic-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply exact concept correction
        run: node tools/maintainer_231_exact_concept.mjs
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Focused Chromium comic UI
        working-directory: frontend
        run: npx playwright test tests/comic-ui.spec.ts --project=chromium
      - name: Commit validated correction and remove harness
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '1144995+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/ViewerStage.svelte frontend/src/lib/styles/viewer.css frontend/tests/comic-ui.spec.ts
          git rm .github/workflows/maintainer-231-exact-concept.yml tools/maintainer_231_exact_concept.mjs
          git commit -m 'fix(comics): match supplied reader concept exactly'
          git push origin HEAD:feat/231-comic-ui
