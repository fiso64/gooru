name: tmp validate 28 config docs
on:
  push:
    branches: [docs/28-protected-mode-config]
jobs:
  config-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Config and encryption tests
        run: go test ./internal/serve ./internal/securekey ./cmd/gooru/cmd
