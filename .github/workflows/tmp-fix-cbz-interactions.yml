name: Temporary CBZ interaction patch
on:
  push:
    branches:
      - feat/22-cbz-viewer
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/22-cbz-viewer
      - name: Apply interaction hardening
        run: python scripts/tmp_fix_cbz_interactions.py
      - name: Check patch
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "Gooru Maintainer"
          git config user.email "maintainer@users.noreply.github.com"
          git add frontend/src/lib/components/PreviewDialog.svelte frontend/src/lib/components/ViewerStage.svelte
          git commit -m "fix(comics): harden nested viewer shortcuts"
          git push origin HEAD:feat/22-cbz-viewer
