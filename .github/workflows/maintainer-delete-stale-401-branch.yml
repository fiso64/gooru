name: maintainer-delete-stale-401-branch

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/maintainer-delete-stale-401-branch.yml

permissions:
  contents: write

jobs:
  delete-stale-branch:
    runs-on: [self-hosted, gooru]
    steps:
      - name: Delete merged stale branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/refactor/401-background-operation-read >/dev/null || exit 0
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete refactor/401-background-operation-read
