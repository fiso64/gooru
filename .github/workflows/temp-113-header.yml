name: temp-113-header
on:
  push:
    branches: [fix/113-common-tags-header]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restyle common-tags header and add regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/components/AppShell.svelte')
          s = p.read_text()
          old = '''        <button\n          class="sidebar-section-head common-tags-toggle"\n          type="button"\n          aria-expanded={!commonTagsCollapsed}\n          aria-controls="common-tags-list"\n          aria-label={commonTagsCollapsed ? 'Expand Common tags' : 'Collapse Common tags'}\n          onclick={toggleCommonTags}\n        >\n          <span>Common tags</span>\n          <span class:expanded={!commonTagsCollapsed} class="common-tags-chevron"><Icon name="chev_right" size={11} /></span>\n        </button>'''
          new = '''        <div class="sidebar-section-head">\n          <span>Common tags</span>\n          <button\n            class="sidebar-head-action common-tags-toggle"\n            type="button"\n            title={commonTagsCollapsed ? 'Expand Common tags' : 'Collapse Common tags'}\n            aria-expanded={!commonTagsCollapsed}\n            aria-controls="common-tags-list"\n            aria-label={commonTagsCollapsed ? 'Expand Common tags' : 'Collapse Common tags'}\n            onclick={toggleCommonTags}\n          >\n            <span class:expanded={!commonTagsCollapsed} class="common-tags-chevron"><Icon name="chev_right" size={11} /></span>\n          </button>\n        </div>'''
          if old not in s:
              raise SystemExit('expected Common tags header markup not found')
          s = s.replace(old, new, 1)
          old_css = '''  .common-tags-toggle {\n    width: 100%;\n    border: 0;\n    background: transparent;\n    cursor: pointer;\n    text-align: left;\n  }'''
          new_css = '''  .common-tags-toggle {\n    cursor: pointer;\n  }'''
          if old_css not in s:
              raise SystemExit('expected Common tags toggle CSS not found')
          s = s.replace(old_css, new_css, 1)
          p.write_text(s)

          t = Path('frontend/tests/common-tags-sidebar.spec.ts')
          q = t.read_text()
          needle = '''  await expect(common.getByText('Common tags')).toBeVisible();\n  await expect(page.locator('.saved-searches-section + .common-tags-section')).toHaveCount(1);\n'''
          replacement = '''  await expect(common.getByText('Common tags')).toBeVisible();\n  await expect(page.locator('.saved-searches-section + .common-tags-section')).toHaveCount(1);\n  const commonHeader = common.locator(':scope > .sidebar-section-head');\n  const savedHeader = page.locator('.saved-searches-section > .sidebar-section-head');\n  await expect(commonHeader).toHaveCount(1);\n  await expect(commonHeader).toHaveJSProperty('tagName', 'DIV');\n  await expect(commonHeader.locator('.common-tags-toggle')).toHaveClass(/sidebar-head-action/);\n  const commonHeaderStyle = await commonHeader.evaluate((node) => {\n    const style = getComputedStyle(node);\n    return [style.fontSize, style.fontWeight, style.letterSpacing, style.textTransform, style.color, style.paddingLeft, style.paddingRight];\n  });\n  const savedHeaderStyle = await savedHeader.evaluate((node) => {\n    const style = getComputedStyle(node);\n    return [style.fontSize, style.fontWeight, style.letterSpacing, style.textTransform, style.color, style.paddingLeft, style.paddingRight];\n  });\n  expect(commonHeaderStyle).toEqual(savedHeaderStyle);\n'''
          if needle not in q:
              raise SystemExit('expected common-tags test insertion point not found')
          t.write_text(q.replace(needle, replacement, 1))
          PY
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm run test:unit
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test tests/common-tags-sidebar.spec.ts tests/common-tags-long-label.spec.ts
      - name: Commit validated change and remove workflow
        run: |
          rm .github/workflows/temp-113-header.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/AppShell.svelte frontend/tests/common-tags-sidebar.spec.ts .github/workflows/temp-113-header.yml
          git commit -m 'fix(sidebar): align common tags header styling'
          git push
