name: maintainer-254-saved-search-default

on:
  push:
    branches:
      - feat/254-added-at-sorting
    paths:
      - .github/workflows/maintainer-254-saved-search-default.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply contract fix and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path('frontend/src/lib/api/client.ts')
          text = client.read_text()
          old = "    sort: body.sort ?? 'name',\n    order: body.order ?? 'asc'"
          new = "    sort: body.sort ?? 'added',\n    order: body.order ?? 'desc'"
          if text.count(old) != 1:
              raise SystemExit('savedSearchBody default pattern mismatch')
          client.write_text(text.replace(old, new))

          test = Path('frontend/src/lib/api/client.test.ts')
          text = test.read_text()
          marker = "  it('maps API error envelopes', async () => {"
          regression = """  it('uses added-desc defaults when creating a saved search without explicit sorting', async () => {\n    let requestBody = '';\n    globalThis.fetch = (async (input: RequestInfo | URL, init?: RequestInit) => {\n      const request = new Request(input, init);\n      requestBody = await request.clone().text();\n      return Response.json({ id: 'saved-one', name: 'Recent', query: '', sort: 'added', order: 'desc', created_at: '', updated_at: '' });\n    }) as typeof fetch;\n\n    await new ApiClient('csrf').createSavedSearch({ name: 'Recent', query: '' });\n\n    expect(JSON.parse(requestBody)).toMatchObject({ name: 'Recent', query: '', sort: 'added', order: 'desc' });\n  });\n\n"""
          if text.count(marker) != 1:
              raise SystemExit('client test insertion marker mismatch')
          test.write_text(text.replace(marker, regression + marker))
          PY
          git diff --check
      - name: Validate frontend contract
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          npm run check
          npm run test:unit
          npm run build
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email chatgpt-codex-connector@users.noreply.github.com
          git add frontend/src/lib/api/client.ts frontend/src/lib/api/client.test.ts
          git commit -m 'test: align saved-search added sort defaults'
          git push origin HEAD:feat/254-added-at-sorting
