name: Maintainer 292 integration

on:
  push:
    branches:
      - feat/278-grid-layout-types
    paths:
      - .github/workflows/maintainer-292-integration.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/278-grid-layout-types
          fetch-depth: 0
      - name: Diagnose develop integration
        shell: bash
        run: |
          git fetch origin develop
          set +e
          git -c user.name=maintainer -c user.email=maintainer@localhost merge --no-commit --no-ff origin/develop
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '::error::Conflicting files:'
            git diff --name-only --diff-filter=U | sed 's/^/::error file=/'
            echo '--- conflict diff ---'
            git diff --cc
            exit "$status"
          fi
          echo 'develop merges cleanly'
