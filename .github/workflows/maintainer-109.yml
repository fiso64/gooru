name: maintainer-109
on:
  push:
    branches:
      - fix/109-request-size-policy
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/serve
      - run: go test -race ./internal/serve
