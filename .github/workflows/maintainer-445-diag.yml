name: Maintainer 445 validation
on:
  push:
    branches:
      - fix/445-upload-conflict-default-rename
permissions:
  contents: write
jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/445-upload-conflict-default-rename
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply fix
        shell: bash
        run: |
          set -o pipefail
          python3 .github/maintainer-445-apply.py 2>&1 | tee .maintainer-445-error.txt
      - name: Format
        run: gofmt -w internal/serve/config.go internal/serve/uploads.go internal/serve/config_upload_policy_test.go internal/serve/uploads_test.go internal/serve/upload_encryption_e2e_test.go
      - name: Focused backend tests
        run: go test ./internal/serve -run 'Test(DefaultUploadConflictPolicyIsRename|UploadOmittedConflictPolicyRenamesExistingName|UploadRequestedConflictPolicySkipReturnsSkippedFile|UploadRequestedConflictPolicyReplaceOverwritesExistingName|EncryptedUploadDefaultConflictRenamesLogicalPathAfterHashDedup)$' -count=1
      - name: Full backend tests
        run: go test ./...
      - name: Backend build
        run: go build ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend conflict regression
        working-directory: frontend
        run: npx playwright install chromium && npx playwright test tests/upload-conflict-default.spec.ts
      - name: Commit failure diagnostic
        if: failure()
        run: |
          git config user.name fiso64
          git config user.email 64778819+fiso64@users.noreply.github.com
          git add .maintainer-445-error.txt
          git commit -m 'chore: capture upload validation failure [skip ci]' || true
          git push origin HEAD:fix/445-upload-conflict-default-rename
      - name: Commit validated fix
        if: success()
        run: |
          rm .github/workflows/maintainer-445-diag.yml .github/maintainer-445-apply.py .maintainer-445-error.txt
          git config user.name fiso64
          git config user.email 64778819+fiso64@users.noreply.github.com
          git add -A
          git commit -m 'fix: rename upload conflicts by default'
          git push origin HEAD:fix/445-upload-conflict-default-rename
