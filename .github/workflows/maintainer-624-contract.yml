name: Maintainer 624 contract sync

on:
  push:
    branches:
      - maintainer/624-jobs-api-ui

permissions:
  contents: write

jobs:
  sync:
    runs-on:
      - self-hosted
      - gooru
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/624-jobs-api-ui
          fetch-depth: 0
      - name: Run contract sync
        run: bash .github/maintainer-624-contract.sh
