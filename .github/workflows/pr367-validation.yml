name: PR 367 validation

on:
  push:
    branches:
      - perf/333-decouple-upload-transfer-import

permissions:
  contents: read

jobs:
  frontend:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Check
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Upload concurrency regression
        run: npm run test:e2e -- upload-concurrency.spec.ts
      - name: Build
        run: npm run build
