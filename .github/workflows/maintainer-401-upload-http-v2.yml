name: maintainer 401 durable upload HTTP v2

on:
  push:
    branches:
      - maintainer/401-durable-upload-http-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test serve package
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s go test -count=1 -timeout=170s ./internal/serve
      - name: Remove temporary workflow and superseded branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintainer-401-upload-http-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove durable upload HTTP validation workflow'
          git push origin HEAD:maintainer/401-durable-upload-http-v2
          git push origin --delete maintainer/401-durable-upload-http || true
