name: Validate #316 viewer regressions

on:
  push:
    branches:
      - fix/316-latest-wins-viewer

permissions:
  contents: read

jobs:
  browser:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Focused Chromium viewer regressions
        shell: bash
        run: |
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -n "$browser" ]; then
            export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$browser"
          else
            npx playwright install chromium
          fi
          npx playwright test tests/viewer-rapid-navigation.spec.ts tests/viewer-image-geometry-hold.spec.ts --project=chromium
