name: Validate 316 latest-wins viewer

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/316-latest-wins-viewer
          fetch-depth: 0
      - name: Integrate current develop and staged patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gooru Maintainer'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git fetch origin develop
          git merge --no-edit origin/develop
          if [ -f scripts/patch_316_latest_wins.py ]; then
            python scripts/patch_316_latest_wins.py
            rm scripts/patch_316_latest_wins.py
            git add frontend scripts
            git commit -m 'fix: make viewer navigation latest-wins'
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/fix/316-latest-wins-viewer)" ]; then
            git push origin HEAD:fix/316-latest-wins-viewer
          fi

  browser:
    needs: integrate
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/316-latest-wins-viewer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Validate frontend and focused viewer regressions
        shell: bash
        run: |
          npm run check
          npm test -- --run
          CHROMIUM="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -n "$CHROMIUM" ]; then export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$CHROMIUM"; else npx playwright install chromium; fi
          npx playwright test tests/viewer-rapid-navigation.spec.ts tests/viewer-image-geometry-hold.spec.ts
