name: Patch 284 default fullscreen

on:
  push:
    branches:
      - feat/284-default-fullscreen

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply focused source edits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          let path = 'frontend/src/lib/components/PreviewDialog.svelte';
          let source = fs.readFileSync(path, 'utf8');
          const mountOld = `  onMount(() => {\n    const previous = document.activeElement instanceof HTMLElement ? document.activeElement : undefined;\n    return claimFocus(dialogElement, previous);\n  });`;
          const mountNew = `  onMount(() => {\n    const previous = document.activeElement instanceof HTMLElement ? document.activeElement : undefined;\n    if ($runtimeConfig.fullscreenMediaByDefault) {\n      const stage = dialogElement?.querySelector<HTMLElement>('.viewer-stage');\n      if (stage) void stage.requestFullscreen().catch(() => undefined);\n    }\n    return claimFocus(dialogElement, previous);\n  });`;
          if (!source.includes(mountOld)) throw new Error('PreviewDialog mount block not found');
          fs.writeFileSync(path, source.replace(mountOld, mountNew));

          path = 'docs/CONFIG.md';
          source = fs.readFileSync(path, 'utf8');
          const row = '| `ui.load_full_media_by_default` | `false` | Start image viewers on the original/full media instead of the derived preview when an original is available. The viewer button remains available to switch back to the preview for the current viewer session. |';
          const added = row + '\n| `ui.fullscreen_media_by_default` | `false` | Request browser fullscreen for the media viewer whenever a file is opened. Browsers may deny fullscreen when the opening interaction does not provide user activation; the viewer remains usable normally in that case. |';
          if (!source.includes(row)) throw new Error('CONFIG ui row not found');
          source = source.replace(row, added);
          const example = '  load_full_media_by_default: false\n';
          if (!source.includes(example)) throw new Error('CONFIG example option not found');
          source = source.replace(example, example + '  fullscreen_media_by_default: false\n');
          fs.writeFileSync(path, source);
          NODE
      - name: Commit source edits
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/components/PreviewDialog.svelte docs/CONFIG.md
          git commit -m 'feat(webui): request configured fullscreen on viewer open'
          git push origin HEAD:feat/284-default-fullscreen
