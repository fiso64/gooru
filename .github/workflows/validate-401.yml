name: Validate eager thumbnails

on:
  push:
    branches:
      - feat/401-eager-thumbnails

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/401-eager-thumbnails
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f internal/serve/background_thumbnails.go ]; then
            python3 .github/validate401.py
            gofmt -w gooru/tagging.go gooru/content_lookup.go gooru/tag_known_background_test.go internal/serve/browse.go internal/serve/uploads.go internal/serve/server.go internal/serve/background_thumbnails.go internal/serve/background_thumbnails_test.go cmd/gooru/cmd/serve.go
            git config user.name "chatgpt-codex-connector"
            git config user.email "chatgpt-codex-connector@users.noreply.github.com"
            git add gooru internal/serve cmd/gooru/cmd/serve.go
            git commit -m "feat(background): eagerly generate imported thumbnails"
            git push origin HEAD:feat/401-eager-thumbnails
          fi
      - name: Focused tests
        run: go test ./gooru ./internal/serve ./cmd/gooru/cmd
      - name: Full tests
        run: go test ./...
      - name: Build
        run: go build ./...
