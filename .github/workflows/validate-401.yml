name: Validate eager thumbnails

on:
  push:
    branches:
      - feat/401-eager-thumbnails

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/401-eager-thumbnails
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f internal/serve/background_thumbnails.go ]; then
            python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}")
              p.write_text(text.replace(old, new, 1))

          # Core: expose an atomic known-file registration + durable task boundary.
          p = Path('gooru/tagging.go')
          text = p.read_text()
          old = '''// TagKnownFiles imports files whose content hash and filesystem metadata have
          // already been computed by the caller, avoiding a second hashing pass.
          func (c *Client) TagKnownFiles(files []types.LocationInfo, tags []string, progressCb func(filePath string, err error)) (types.TagOperationResult, error) {
          \tresult := types.TagOperationResult{}
          '''
          new = '''// TagKnownFiles imports files whose content hash and filesystem metadata have
          // already been computed by the caller, avoiding a second hashing pass.
          func (c *Client) TagKnownFiles(files []types.LocationInfo, tags []string, progressCb func(filePath string, err error)) (types.TagOperationResult, error) {
          \treturn c.TagKnownFilesWithBackgroundTasks(files, tags, nil, progressCb)
          }

          // TagKnownFilesWithBackgroundTasks atomically registers known files and enqueues
          // durable follow-up work. If any task cannot be persisted, file registration and
          // tag mutations roll back with it.
          func (c *Client) TagKnownFilesWithBackgroundTasks(files []types.LocationInfo, tags []string, tasks []BackgroundTaskRequest, progressCb func(filePath string, err error)) (types.TagOperationResult, error) {
          \tresult := types.TagOperationResult{}
          '''
          if old not in text:
              raise SystemExit('TagKnownFiles signature block not found')
          text = text.replace(old, new, 1)
          text = text.replace('affectedCount, _, err := c.executeTaggingTransaction(analysis, tags, opTag)', 'affectedCount, _, err := c.executeTaggingTransaction(analysis, tags, opTag, tasks)', 1)
          text = text.replace('func (c *Client) executeTaggingTransaction(analysis *fileStateAnalysis, tags []string, kind opKind) (int64, map[string]string, error) {', 'func (c *Client) executeTaggingTransaction(analysis *fileStateAnalysis, tags []string, kind opKind, tasks []BackgroundTaskRequest) (int64, map[string]string, error) {', 1)
          needle = '''\t// 3. Perform the specific tagging operation.
          \taffectedCount, err := c.applyTaggingOperationInTx(tx, analysis.allHashes, tags, kind)
          \tif err != nil {
          \t\treturn 0, nil, err
          \t}

          \treturn affectedCount, movesHandled, tx.Commit()
          '''
          replacement = '''\t// 3. Perform the specific tagging operation.
          \taffectedCount, err := c.applyTaggingOperationInTx(tx, analysis.allHashes, tags, kind)
          \tif err != nil {
          \t\treturn 0, nil, err
          \t}

          \t// 4. Persist durable follow-up work in the same transaction as content registration.
          \tfor _, task := range tasks {
          \t\tif _, _, err := c.enqueueBackgroundTask(tx, task); err != nil {
          \t\t\treturn 0, nil, fmt.Errorf("failed to enqueue background task: %w", err)
          \t\t}
          \t}

          \treturn affectedCount, movesHandled, tx.Commit()
          '''
          if needle not in text:
              raise SystemExit('transaction tail not found')
          text = text.replace(needle, replacement, 1)
          text = text.replace('c.executeTaggingTransaction(analysis, tags, kind)', 'c.executeTaggingTransaction(analysis, tags, kind, nil)', 1)
          p.write_text(text)

          Path('gooru/content_lookup.go').write_text(r'''package gooru

import (
    "fmt"

    "gooru.local/types"
)

// GetFileInfoByContentHash resolves a currently tracked location for immutable
// content identity. It intentionally chooses the lexicographically first current
// path so background work survives moves without persisting a stale filesystem path.
func (c *Client) GetFileInfoByContentHash(hash string) (types.FileInfo, error) {
    files, err := c.store.GetFilesInfoByContentQuery("SELECT ?", []interface{}{hash})
    if err != nil {
        return types.FileInfo{}, err
    }
    if len(files) == 0 {
        return types.FileInfo{}, fmt.Errorf("content %q has no tracked location", hash)
    }
    return files[0], nil
}
''')

          # Serve library: store a media-owned task factory and expose content-hash lookup.
