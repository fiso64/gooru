name: tmp-254-reverse-bounds
on:
  push:
    branches: [feat/254-upload-strategy-ui-client]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply correctness patch
        run: python .github/tmp-254-reverse-bounds.py
      - name: Format backend
        run: gofmt -w internal/serve/upload_stream.go internal/serve/upload_added_at_strategy_test.go
      - name: Install and generate frontend API
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
      - name: Validate backend
        run: go test ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
          npm run build
      - name: Validate diff
        run: git diff --check
      - name: Commit correctness patch
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal docs frontend
          if ! git diff --cached --quiet; then
            git commit -m 'fix(upload): reverse queues across staged selections'
            git fetch origin feat/254-upload-strategy-ui-client
            git rebase origin/feat/254-upload-strategy-ui-client
            git push origin HEAD:feat/254-upload-strategy-ui-client
          fi