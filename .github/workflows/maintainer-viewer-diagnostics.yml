name: Maintainer viewer diagnostics

on:
  push:
    branches:
      - fix/22-image-geometry-hold
    paths:
      - .github/workflows/maintainer-viewer-diagnostics.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/22-image-geometry-hold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Add frame-level viewer diagnostics
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/lib/components/ViewerStage.svelte')
          s = p.read_text()
          old = """  let zoom = $state(1);\n  let panX = $state(0);\n  let panY = $state(0);\n\n  const renderedFile = $derived(displayedFile ?? file);"""
          new = """  let zoom = $state(1);\n  let panX = $state(0);\n  let panY = $state(0);\n\n  type ViewerDebugWindow = Window & { __gooruViewerDebug?: boolean };\n\n  function viewerDebugEnabled() {\n    return typeof window !== 'undefined' && Boolean((window as ViewerDebugWindow).__gooruViewerDebug);\n  }\n\n  function viewerDebugRect(element: Element | undefined) {\n    if (!element) return null;\n    const rect = element.getBoundingClientRect();\n    return { x: rect.x, y: rect.y, width: rect.width, height: rect.height };\n  }\n\n  function logViewerFrame(phase: string, frame: number, generation: number) {\n    if (!viewerDebugEnabled() || generation !== transitionGeneration) return;\n    const image = imageElement;\n    const canvas = freezeCanvasElement;\n    const computed = image ? getComputedStyle(image) : undefined;\n    console.info('[gooru viewer frame]', {\n      t: Math.round(performance.now() * 10) / 10,\n      phase,\n      frame,\n      generation,\n      fitMode,\n      rotation,\n      zoom,\n      intrinsic: { width: intrinsicWidth, height: intrinsicHeight },\n      geometry: { width: geometry.width, height: geometry.height, scale: geometry.scale },\n      stage: viewerDebugRect(stageElement),\n      image: image ? {\n        complete: image.complete,\n        naturalWidth: image.naturalWidth,\n        naturalHeight: image.naturalHeight,\n        rect: viewerDebugRect(image),\n        cssWidth: computed?.width,\n        cssHeight: computed?.height,\n        transform: computed?.transform\n      } : null,\n      shield: canvas ? { visible: freezeVisible, rect: viewerDebugRect(canvas) } : null\n    });\n  }\n\n  function traceViewerFrames(phase: string, generation: number, count = 12) {\n    if (!viewerDebugEnabled()) return;\n    let frame = 0;\n    const capture = () => {\n      logViewerFrame(phase, frame, generation);\n      frame += 1;\n      if (frame < count && generation === transitionGeneration) requestAnimationFrame(capture);\n    };\n    logViewerFrame(`${phase}:sync`, -1, generation);\n    requestAnimationFrame(capture);\n  }\n\n  const renderedFile = $derived(displayedFile ?? file);"""
          if old not in s:
              raise SystemExit('state insertion anchor not found')
          s = s.replace(old, new, 1)

          old = """    if (rendersImage) {\n      // A single <img> cannot preserve both sides of an aspect-ratio handoff: keeping old geometry"""
          new = """    if (rendersImage) {\n      traceViewerFrames('handoff-before', generation);\n      // A single <img> cannot preserve both sides of an aspect-ratio handoff: keeping old geometry"""
          if old not in s:
              raise SystemExit('handoff anchor not found')
          s = s.replace(old, new, 1)

          old = """      displayedFile = targetFile;\n      displayedImageSource = targetImageSource;\n      return;\n    }\n\n    const waitingTimer"""
          new = """      displayedFile = targetFile;\n      displayedImageSource = targetImageSource;\n      queueMicrotask(() => traceViewerFrames('handoff-after', generation));\n      return;\n    }\n\n    const waitingTimer"""
          if old not in s:
              raise SystemExit('handoff completion anchor not found')
          s = s.replace(old, new, 1)

          old = """  function syncImage(event: Event) {\n    const image = event.currentTarget;\n    if (!(image instanceof HTMLImageElement)) return;\n    intrinsicWidth = image.naturalWidth;\n    intrinsicHeight = image.naturalHeight;\n\n    // `load` can run before"""
          new = """  function syncImage(event: Event) {\n    const image = event.currentTarget;\n    if (!(image instanceof HTMLImageElement)) return;\n    intrinsicWidth = image.naturalWidth;\n    intrinsicHeight = image.naturalHeight;\n    const transitionAtLoad = transitionGeneration;\n    traceViewerFrames('image-load', transitionAtLoad);\n    if (viewerDebugEnabled()) {\n      void image.decode().then(\n        () => traceViewerFrames('image-decode', transitionAtLoad, 6),\n        () => traceViewerFrames('image-decode-error', transitionAtLoad, 2)\n      );\n    }\n\n    // `load` can run before"""
          if old not in s:
              raise SystemExit('syncImage anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run test:unit
          npm run build
      - name: Commit diagnostics and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/maintainer-viewer-diagnostics.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/ViewerStage.svelte .github/workflows/maintainer-viewer-diagnostics.yml
          git commit -m 'chore(viewer): add opt-in frame diagnostics'
          git push origin HEAD:fix/22-image-geometry-hold