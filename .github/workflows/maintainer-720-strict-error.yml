name: Maintainer 720 strict error

on:
  push:
    branches:
      - maintainer/720-simplify-upload-conflicts

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Apply strict error semantics
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/maintainer-720-strict.py
          python3 /tmp/maintainer-720-strict.py
          gofmt -w internal/serve/uploads.go internal/serve/upload_durable_staging.go internal/serve/upload_conflict_policy_batch_test.go internal/serve/upload_durable_staging_test.go
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run generate:api
          cd ..
          rm .github/workflows/maintainer-720-strict-error.yml
          git add -A
          git diff --cached --check
      - name: Focused Go tests
        run: go test -count=1 ./internal/serve
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Commit strict error semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'autonomous-maintainer'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix(upload): make error conflicts reject the request'
          git push origin HEAD:maintainer/720-simplify-upload-conflicts
