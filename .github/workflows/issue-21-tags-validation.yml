name: issue-21 tags validation

on:
  push:
    branches:
      - agent/issue-21-exact-concept-port

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wire Tags count, styles, regression coverage, and lightbox a11y
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} not found')
              return text.replace(old, new, 1)

          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text()
          text = replace_once(text, "      <TagsView\n        tags={tagsQuery.data?.tags ?? []}\n        loading={tagsQuery.isLoading}", "      <TagsView\n        tags={tagsQuery.data?.tags ?? []}\n        libraryCount={page?.library_count ?? files.length}\n        loading={tagsQuery.isLoading}", 'TagsView props')
          app.write_text(text)

          css = Path('frontend/src/lib/styles/components.css')
          text = css.read_text()
          text = replace_once(text, ".tagscloud {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));\n  gap: 8px;\n}", ".tagscloud {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));\n  gap: 4px;\n}", 'tagscloud grid')
          marker = '.tag-index-section {'
          additions = ".tag-filter-sticky {\n  position: sticky;\n  top: 0;\n  z-index: 2;\n  padding-bottom: 12px;\n  background: var(--bg);\n}\n\n.tag-ns-header {\n  display: flex;\n  align-items: baseline;\n  gap: 12px;\n  padding: 18px 0 10px;\n  border-bottom: 1px solid var(--border);\n  margin-bottom: 14px;\n}\n\n.tag-ns-header h3 {\n  margin: 0;\n  font-family: var(--font-display);\n  font-size: 22px;\n  font-weight: 400;\n  letter-spacing: -0.005em;\n}\n\n.tag-ns-header .count {\n  color: var(--text-4);\n  font-family: var(--font-mono);\n  font-size: 11px;\n  letter-spacing: 0.05em;\n}\n\n.tagscloud-item .tag-name {\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n"
          if '.tag-filter-sticky {' not in text:
              text = replace_once(text, marker, additions + marker, 'tag style insertion')
          css.write_text(text)

          preview = Path('frontend/src/lib/components/PreviewDialog.svelte')
          text = preview.read_text()
          text = replace_once(
              text,
              '  aria-labelledby="preview-title"\n  onclick={(event) => { if (event.target === event.currentTarget) onClose(); }}',
              '  aria-labelledby="preview-title"\n  tabindex="-1"\n  onclick={(event) => { if (event.target === event.currentTarget) onClose(); }}\n  onkeydown={(event) => { if (event.key === \'Escape\') onClose(); }}',
              'lightbox accessibility attributes'
          )
          preview.write_text(text)

          spec = Path('frontend/tests/shell.spec.ts')
          text = spec.read_text()
          text = replace_once(
              text,
              "  await expect(page.getByRole('heading', { name: 'Tag index' })).toBeVisible();\n  await expect(page.getByRole('button', { name: 'rating: 3' })).toBeVisible();",
              "  await expect(page.getByRole('heading', { name: '2 tags across 3 files' })).toBeVisible();\n  await expect(page.getByRole('heading', { name: 'rating', exact: true })).toBeVisible();",
              'legacy Tags assertion'
          )
          if "test('Tags index matches concept grouping and filtering'" not in text:
              text += """\n\ntest('Tags index matches concept grouping and filtering', async ({ page }) => {\n  await mockAuth(page);\n  await mockShellApis(page);\n  await page.route('**/api/v1/files?**', async (route) => {\n    await route.fulfill({ contentType: 'application/json', body: JSON.stringify({ files: [], total_count: 9, library_count: 9, facets: { kind: [] } }) });\n  });\n\n  await page.goto('/');\n  await signIn(page);\n  await page.getByText('Tags', { exact: true }).first().click();\n  await expect(page.getByRole('heading', { name: '2 tags across 9 files' })).toBeVisible();\n  await expect(page.getByRole('heading', { name: 'tags', exact: true })).toBeVisible();\n  await expect(page.getByRole('heading', { name: 'rating', exact: true })).toBeVisible();\n\n  const filter = page.getByLabel('Filter tags');\n  await filter.fill('safe');\n  await expect(page.locator('.tagscloud-item')).toHaveCount(1);\n  await expect(page.locator('.tagscloud-item').filter({ hasText: 'rating:safe' })).toBeVisible();\n\n  await page.locator('.tagscloud-item').filter({ hasText: 'rating:safe' }).click();\n  await expect(page.getByRole('heading', { name: 'Library' })).toBeVisible();\n  await expect(page.locator('.searchbar-pill').filter({ hasText: 'rating:safe' })).toBeVisible();\n});\n"""
          spec.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend with zero warnings
        working-directory: frontend
        run: |
          npm run check | tee /tmp/svelte-check.log
          grep -q "svelte-check found 0 errors and 0 warnings" /tmp/svelte-check.log
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Build Go packages
        run: go build ./...
      - name: Run Go tests
        run: go test ./...
      - name: Persist validated Tags port
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/components/PreviewDialog.svelte frontend/src/lib/styles/components.css frontend/tests/shell.spec.ts
          git commit -m "#21 wire exact Tags index [skip ci]"
          git push
