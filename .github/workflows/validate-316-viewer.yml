name: Validate #316 viewer

on:
  push:
    branches:
      - fix/316-latest-wins-viewer

permissions:
  contents: read

jobs:
  viewer:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Isolate Playwright preview port
        run: |
          sed -i 's/4173/4273/g' playwright.config.ts
          sed -i 's/npm run preview -- --host 127.0.0.1/npm run preview -- --host 127.0.0.1 --port 4273/' playwright.config.ts
      - name: Latest-wins browser regression
        run: npx playwright test tests/viewer-rapid-navigation.spec.ts --project=chromium
      - name: Viewer transition regressions
        run: npx playwright test tests/viewer*.spec.ts --project=chromium
