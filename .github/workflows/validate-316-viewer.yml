name: Validate #316 viewer

on:
  push:
    branches:
      - fix/316-latest-wins-viewer

permissions:
  contents: read

jobs:
  viewer:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Latest-wins browser regression
        run: npx playwright test tests/viewer-latest-wins.spec.ts --project=chromium
      - name: Viewer transition regressions
        run: npx playwright test tests/viewer*.spec.ts --project=chromium
