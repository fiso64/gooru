name: Maintainer #28 derivative validation

on:
  push:
    branches:
      - refactor/28-derivative-policy

permissions:
  contents: write

jobs:
  go:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Move lock-lifecycle regression to derivative store
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/serve/media_test.go')
          text = path.read_text()
          old = '''\tserver.media.cacheMu.Lock()\n\tlocks := len(server.media.cacheLocks)\n\tserver.media.cacheMu.Unlock()\n\tif locks != 0 {\n\t\tt.Fatalf("expected cache lock cleanup, got %d locks", locks)\n\t}\n'''
          new = '''\tstore, ok := server.media.derivatives.(*persistentDerivativeStore)\n\tif !ok {\n\t\tt.Fatalf("derivative store type = %T, want persistentDerivativeStore", server.media.derivatives)\n\t}\n\tstore.mu.Lock()\n\tlocks := len(store.locks)\n\tstore.mu.Unlock()\n\tif locks != 0 {\n\t\tt.Fatalf("expected derivative lock cleanup, got %d locks", locks)\n\t}\n'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('expected lock regression block not found')
          PY
          if ! git diff --quiet -- internal/serve/media_test.go; then
            git config user.name "chatgpt-codex-connector"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/serve/media_test.go
            git commit -m "test(media): move cache lock regression to derivative store"
            git push
          fi
      - name: Focused derivative tests
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          go test ./internal/serve -run 'Test(MemoryDerivativeStore|PersistentDerivativeStore|NewDerivativeStore|ProtectedDerivativeStore|Media|Comic)' -count=1 2>&1 | tee focused-test.log
      - name: Preserve focused diagnostics
        if: steps.focused.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: focused-test-log
          path: focused-test.log
          if-no-files-found: error
      - name: Fail after preserving diagnostics
        if: steps.focused.outcome == 'failure'
        run: exit 1
      - name: Full Go tests
        run: go test ./...
      - name: Build
        run: go build ./...
