name: Maintainer #28 derivative validation

on:
  push:
    branches:
      - refactor/28-derivative-policy

permissions:
  contents: read

jobs:
  go:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Focused derivative tests
        run: go test ./internal/serve -run 'Test(MemoryDerivativeStore|PersistentDerivativeStore|NewDerivativeStore|Media|Comic)' -count=1
      - name: Full Go tests
        run: go test ./...
      - name: Build
        run: go build ./...
