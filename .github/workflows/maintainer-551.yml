name: Maintainer 551

on:
  push:
    branches:
      - maintainer/551-new-items-banner
    paths:
      - .github/workflows/maintainer-551.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/551-new-items-banner
      - name: Apply #551 fix and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text()
          old = "  const newUploadResultCount = $derived(trackUploadResults ? Math.max(0, liveCurrentQueryCount - uploadResultsFloor) : 0);"
          new = "  const uploadResultsBaseline = $derived(Math.max(uploadResultsFloor, gridSnapshotTotalCount));\n  const newUploadResultCount = $derived(trackUploadResults ? Math.max(0, liveCurrentQueryCount - uploadResultsBaseline) : 0);"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one banner count expression, found {text.count(old)}')
          text = text.replace(old, new)
          old_finish = "    if (!upload.busy && !upload.activeJobIDs.length && finalTotal != null && finalTotal <= uploadResultsFloor) {"
          new_finish = "    if (!upload.busy && !upload.activeJobIDs.length && finalTotal != null && finalTotal <= uploadResultsBaseline) {"
          if text.count(old_finish) != 1:
              raise SystemExit(f'expected exactly one finish condition, found {text.count(old_finish)}')
          app.write_text(text.replace(old_finish, new_finish))

          spec = Path('frontend/tests/upload-metadata-refresh.spec.ts')
          test = r'''

test('grid requery clears upload refresh banner when the new rows are already represented', async ({ page }) => {
  const server = await mockApp(page);
  let pendingUpload: Route | undefined;
  await page.route('**/api/v1/uploads', async (route) => {
    pendingUpload = route;
  });

  await signIn(page);
  await page.getByRole('button', { name: 'Upload' }).click();
  await page.locator('input[type="file"]').setInputFiles({
    name: 'fresh.jpg',
    mimeType: 'image/jpeg',
    buffer: Buffer.from('fresh')
  });
  await page.getByRole('button', { name: /Upload 1 file/ }).click();
  await expect.poll(() => Boolean(pendingUpload)).toBe(true);

  server.setServerTotal(76);
  await librarySidebar(page).click();
  const refreshButton = page.getByTestId('refresh-upload-results');
  await expect(refreshButton).toHaveText('1 new item · Refresh results');

  const gridBeforeRequery = server.gridRequests();
  await page.getByRole('button', { name: 'Paged' }).click();
  await expect.poll(() => server.gridRequests()).toBeGreaterThan(gridBeforeRequery);
  await expect(page.getByTestId('library-header-count')).toHaveText('76 files');
  await expect(refreshButton).toHaveCount(0);

  await pendingUpload!.fulfill({
    status: 200,
    contentType: 'application/json',
    body: JSON.stringify({ files: [{ name: 'fresh.jpg', size: 5, target_id: 'default', status: 'imported' }], affected_count: 1 })
  });
});
'''
          current = spec.read_text()
          marker = "test('grid requery clears upload refresh banner when the new rows are already represented'"
          if marker in current:
              raise SystemExit('regression test already present')
          spec.write_text(current.rstrip() + test)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Check
        working-directory: frontend
        run: npm run check
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Targeted browser regression
        working-directory: frontend
        run: npm run test:e2e -- upload-metadata-refresh.spec.ts
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Commit validated change
        shell: bash
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/AuthenticatedApp.svelte frontend/tests/upload-metadata-refresh.spec.ts
          git diff --cached --check
          git commit -m 'fix(frontend): clear represented upload results banner'
          git push origin HEAD:maintainer/551-new-items-banner
