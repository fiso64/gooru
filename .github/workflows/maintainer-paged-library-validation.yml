name: Maintainer Paged Library Validation

on:
  push:
    branches:
      - maintainer/paged-grid-clamp-out-of-range

permissions:
  contents: read

jobs:
  frontend:
    name: Focused frontend validation
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Check
        run: npm run check
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Paged library regression
        run: npm run test:e2e -- paged-library.spec.ts
