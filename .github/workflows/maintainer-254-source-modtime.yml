name: maintainer-254-source-modtime

on:
  push:
    branches:
      - feat/254-upload-source-modtime
    paths:
      - .github/workflows/maintainer-254-source-modtime.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-modtime slice
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          replace('internal/serve/config.go',
              'type UploadsConfig struct {\n\tEnabled          bool           `yaml:"enabled"`\n\tTargets          []UploadTarget `yaml:"targets"`\n\tMaxFileSizeBytes int64          `yaml:"max_file_size_bytes"`\n\tConflictPolicy   string         `yaml:"conflict_policy"`\n}',
              'type UploadsConfig struct {\n\tEnabled          bool           `yaml:"enabled"`\n\tTargets          []UploadTarget `yaml:"targets"`\n\tMaxFileSizeBytes int64          `yaml:"max_file_size_bytes"`\n\tConflictPolicy   string         `yaml:"conflict_policy"`\n\tPreserveModTime  bool           `yaml:"preserve_modtime"`\n}')
          replace('internal/serve/config.go',
              'Uploads: UploadsConfig{Enabled: false, ConflictPolicy: "rename"},',
              'Uploads: UploadsConfig{Enabled: false, ConflictPolicy: "rename", PreserveModTime: true},')
          replace('internal/serve/config_test.go',
              'if cfg.Uploads.ConflictPolicy != "rename" {\n\t\tt.Fatalf("unexpected upload conflict policy default %q", cfg.Uploads.ConflictPolicy)\n\t}',
              'if cfg.Uploads.ConflictPolicy != "rename" {\n\t\tt.Fatalf("unexpected upload conflict policy default %q", cfg.Uploads.ConflictPolicy)\n\t}\n\tif !cfg.Uploads.PreserveModTime {\n\t\tt.Fatal("uploads.preserve_modtime should default true")\n\t}')

          replace('internal/serve/upload_stream.go', '"path/filepath"\n)', '"path/filepath"\n\t"strconv"\n\t"strings"\n\t"time"\n)')
          replace('internal/serve/upload_stream.go',
              'type streamedUpload struct {\n\tname   string\n\tpath   string\n\tsize   int64\n\tstatus string\n\terror  string\n}',
              'type streamedUpload struct {\n\tname          string\n\tpath          string\n\tsize          int64\n\tstatus        string\n\terror         string\n\tsourceModTime time.Time\n}')
          replace('internal/serve/upload_stream.go',
              '\tvar targetID, conflictRequested string\n\tvar targetSeen, conflictSeen bool\n\ttagValues := make([]string, 0)',
              '\tvar targetID, conflictRequested string\n\tvar targetSeen, conflictSeen bool\n\ttagValues := make([]string, 0)\n\tsourceModTimeValues := make([]string, 0)')
          replace('internal/serve/upload_stream.go',
              '\t\t\tcase "tags":\n\t\t\t\ttagValues = append(tagValues, value)\n\t\t\t}',
              '\t\t\tcase "tags":\n\t\t\t\ttagValues = append(tagValues, value)\n\t\t\tcase "source_modtime_ms":\n\t\t\t\tsourceModTimeValues = append(sourceModTimeValues, value)\n\t\t\t}')
          replace('internal/serve/upload_stream.go',
              '\tif fileCount == 0 {\n\t\treturn nil, saved, multipartUploadError{message: "at least one file is required", err: errors.New("missing upload file")}\n\t}\n\ttarget, err := s.uploadTarget(targetID)',
              '\tif fileCount == 0 {\n\t\treturn nil, saved, multipartUploadError{message: "at least one file is required", err: errors.New("missing upload file")}\n\t}\n\tfor i := range streamed {\n\t\tif i >= len(sourceModTimeValues) {\n\t\t\tbreak\n\t\t}\n\t\tstreamed[i].sourceModTime = parseUploadSourceModTime(sourceModTimeValues[i])\n\t}\n\ttarget, err := s.uploadTarget(targetID)')
          replace('internal/serve/upload_stream.go',
              'finalized, finalErr := finalizeStreamedUpload(target, *file, conflictPolicy)',
              'finalized, finalErr := finalizeStreamedUpload(target, *file, conflictPolicy, s.cfg.Uploads.PreserveModTime)')
          replace('internal/serve/upload_stream.go',
              'func finalizeStreamedUpload(target UploadTarget, file streamedUpload, conflictPolicy string) (savedUpload, error) {',
              'func finalizeStreamedUpload(target UploadTarget, file streamedUpload, conflictPolicy string, preserveModTime bool) (savedUpload, error) {')
          replace('internal/serve/upload_stream.go',
              'return savedUpload{name: file.name, path: path, destinationPath: path, size: file.size, targetID: target.ID, status: "skipped"}, nil',
              'return savedUpload{name: file.name, path: path, destinationPath: path, size: file.size, targetID: target.ID, status: "skipped", sourceModTime: file.sourceModTime}, nil')
          replace('internal/serve/upload_stream.go',
              '\tif replace {\n\t\treturn savedUpload{name: filepath.Base(path), path: stagedPath, destinationPath: path, size: file.size, targetID: target.ID, replace: true}, nil\n\t}',
              '\tif replace {\n\t\tif err := applyUploadedSourceModTime(stagedPath, file.sourceModTime, preserveModTime); err != nil {\n\t\t\t_ = os.Remove(stagedPath)\n\t\t\treturn savedUpload{}, uploadFileError{name: file.name, err: err}\n\t\t}\n\t\treturn savedUpload{name: filepath.Base(path), path: stagedPath, destinationPath: path, size: file.size, targetID: target.ID, replace: true, sourceModTime: file.sourceModTime}, nil\n\t}')
          replace('internal/serve/upload_stream.go',
              '\tif err := commitUploadDestination(stagedPath, path); err != nil {\n\t\t_ = os.Remove(stagedPath)\n\t\treturn savedUpload{}, uploadFileError{name: file.name, err: err}\n\t}\n\treturn savedUpload{name: filepath.Base(path), path: path, destinationPath: path, size: file.size, targetID: target.ID}, nil\n}',
              '\tif err := commitUploadDestination(stagedPath, path); err != nil {\n\t\t_ = os.Remove(stagedPath)\n\t\treturn savedUpload{}, uploadFileError{name: file.name, err: err}\n\t}\n\tif err := applyUploadedSourceModTime(path, file.sourceModTime, preserveModTime); err != nil {\n\t\t_ = os.Remove(path)\n\t\treturn savedUpload{}, uploadFileError{name: file.name, err: err}\n\t}\n\treturn savedUpload{name: filepath.Base(path), path: path, destinationPath: path, size: file.size, targetID: target.ID, sourceModTime: file.sourceModTime}, nil\n}\n\nfunc parseUploadSourceModTime(value string) time.Time {\n\tmillis, err := strconv.ParseInt(strings.TrimSpace(value), 10, 64)\n\tif err != nil || millis <= 0 {\n\t\treturn time.Time{}\n\t}\n\treturn time.UnixMilli(millis).UTC()\n}\n\nfunc applyUploadedSourceModTime(path string, sourceModTime time.Time, preserve bool) error {\n\tif !preserve || sourceModTime.IsZero() {\n\t\treturn nil\n\t}\n\tif err := os.Chtimes(path, sourceModTime, sourceModTime); err != nil {\n\t\treturn errors.New("failed to preserve uploaded file modification time")\n\t}\n\treturn nil\n}')

          replace('internal/serve/uploads.go', '"strings"\n', '"strings"\n\t"time"\n')
          replace('internal/serve/uploads.go',
              'type StagedUpload struct {\n\tName         string\n\tPath         string\n\tAnalysisPath string\n\tSize         int64\n\tTargetID     string\n\tStatus       string\n\tError        string\n}',
              'type StagedUpload struct {\n\tName          string\n\tPath          string\n\tAnalysisPath  string\n\tSize          int64\n\tTargetID      string\n\tStatus        string\n\tError         string\n\tSourceModTime time.Time\n}')
          replace('internal/serve/uploads.go',
              '\treplace         bool\n}',
              '\treplace         bool\n\tsourceModTime   time.Time\n}')
          replace('internal/serve/uploads.go',
              'out = append(out, StagedUpload{Name: file.name, Path: path, AnalysisPath: path, Size: file.size, TargetID: file.targetID, Status: file.status, Error: file.error})',
              'out = append(out, StagedUpload{Name: file.name, Path: path, AnalysisPath: path, Size: file.size, TargetID: file.targetID, Status: file.status, Error: file.error, SourceModTime: file.sourceModTime})')

          replace('frontend/src/lib/api/client.ts',
              "    for (const file of files) form.append('files', file, file.name);\n    if (tags.length)",
              "    for (const file of files) form.append('files', file, file.name);\n    for (const file of files) form.append('source_modtime_ms', String(file.lastModified));\n    if (tags.length)")

          replace('docs/openapi.yaml',
              '                target_id:\n                  type: string\n                  description: Configured upload target ID. Defaults to the first configured target.',
              '                source_modtime_ms:\n                  type: array\n                  description: Source modification timestamps in Unix milliseconds, in the same order as `files`. Invalid or missing entries are treated as unavailable.\n                  items:\n                    type: integer\n                    format: int64\n                target_id:\n                  type: string\n                  description: Configured upload target ID. Defaults to the first configured target.')

          replace('docs/CONFIG.md',
              '- `uploads.max_file_size_bytes`: maximum bytes accepted per uploaded file. `0` disables the per-file limit.\n- `uploads.conflict_policy`:',
              '- `uploads.max_file_size_bytes`: maximum bytes accepted per uploaded file. `0` disables the per-file limit.\n- `uploads.preserve_modtime`: preserve each browser-uploaded file\'s source modification timestamp on the stored destination. Defaults to `true`; source timestamps are still carried through upload processing when disabled.\n- `uploads.conflict_policy`:')

          replace('internal/serve/uploads_test.go', '"path/filepath"\n', '"path/filepath"\n\t"strconv"\n')
          marker = 'func TestUploadConflictPolicyErrorRejectsExistingName(t *testing.T) {'
          test = r'''func TestUploadPreservesSourceModTimeAndCarriesItWhenDisabled(t *testing.T) {
\tsource := time.Date(2020, time.July, 8, 9, 10, 11, 123000000, time.UTC)
\n\tfor _, preserve := range []bool{true, false} {
\t\tt.Run(map[bool]string{true: "preserve", false: "do-not-preserve"}[preserve], func(t *testing.T) {
\t\t\tdir := t.TempDir()
\t\t\tlibrary := &recordingUploadLibrary{}
\t\t\tserver := newUploadTestServer(t, dir, true, library)
\t\t\tserver.cfg.Uploads.PreserveModTime = preserve
\t\t\trec := httptest.NewRecorder()
\n\t\t\tserver.Handler().ServeHTTP(rec, uploadBinaryRequestWithSourceModTime(t, "a.txt", []byte("hello"), source))
\n\t\t\tif rec.Code != http.StatusOK {
\t\t\t\tt.Fatalf("expected 200, got %d: %s", rec.Code, rec.Body.String())
\t\t\t}
\t\t\tif len(library.files) != 1 || !library.files[0].SourceModTime.Equal(source) {
\t\t\t\tt.Fatalf("source modtime was not carried to importer: %+v", library.files)
\t\t\t}
\t\t\tinfo, err := os.Stat(filepath.Join(dir, "a.txt"))
\t\t\tif err != nil {
\t\t\t\tt.Fatal(err)
\t\t\t}
\t\t\tif preserve && !info.ModTime().Equal(source) {
\t\t\t\tt.Fatalf("stored modtime=%v want source=%v", info.ModTime(), source)
\t\t\t}
\t\t\tif !preserve && info.ModTime().Equal(source) {
\t\t\t\tt.Fatalf("stored modtime unexpectedly preserved while disabled: %v", info.ModTime())
\t\t\t}
\t\t})
\t}
}

'''
          p = Path('internal/serve/uploads_test.go')
          text = p.read_text()
          if text.count(marker) != 1:
              raise SystemExit('uploads_test insertion marker mismatch')
          p.write_text(text.replace(marker, test.replace('\\t', '\t').replace('\\n', '\n') + marker))

          helper_marker = 'func mustReadFile(t *testing.T, path string) []byte {'
          helper = r'''func uploadBinaryRequestWithSourceModTime(t *testing.T, name string, content []byte, source time.Time) *http.Request {
\tt.Helper()
\tvar body bytes.Buffer
\twriter := multipart.NewWriter(&body)
\tpart, err := writer.CreateFormFile("files", name)
\tif err != nil {
\t\tt.Fatal(err)
\t}
\tif _, err := part.Write(content); err != nil {
\t\tt.Fatal(err)
\t}
\tif err := writer.WriteField("source_modtime_ms", strconv.FormatInt(source.UnixMilli(), 10)); err != nil {
\t\tt.Fatal(err)
\t}
\tif err := writer.Close(); err != nil {
\t\tt.Fatal(err)
\t}
\treq := httptest.NewRequest(http.MethodPost, "/api/v1/uploads", &body)
\treq.Header.Set("Content-Type", writer.FormDataContentType())
\treturn req
}

'''
          p = Path('internal/serve/uploads_test.go')
          text = p.read_text()
          if text.count(helper_marker) != 1:
              raise SystemExit('uploads_test helper insertion marker mismatch')
          p.write_text(text.replace(helper_marker, helper.replace('\\t', '\t').replace('\\n', '\n') + helper_marker))

          replace('internal/serve/upload_encryption_e2e_test.go',
              '"testing"\n', '"testing"\n\t"time"\n')
          replace('internal/serve/upload_encryption_e2e_test.go',
              '\trec := httptest.NewRecorder()\n\tserver.Handler().ServeHTTP(rec, uploadBinaryRequest(t, map[string][]byte{"secret.png": plaintext}, []string{"private"}))',
              '\tsourceModTime := time.Date(2021, time.March, 4, 5, 6, 7, 0, time.UTC)\n\trec := httptest.NewRecorder()\n\tserver.Handler().ServeHTTP(rec, uploadBinaryRequestWithSourceModTime(t, "secret.png", plaintext, sourceModTime))')
          replace('internal/serve/upload_encryption_e2e_test.go',
              '\tstored, err := os.ReadFile(storedPath)\n\tif err != nil {\n\t\tt.Fatalf("read stored upload: %v", err)\n\t}',
              '\tstored, err := os.ReadFile(storedPath)\n\tif err != nil {\n\t\tt.Fatalf("read stored upload: %v", err)\n\t}\n\tstoredInfo, err := os.Stat(storedPath)\n\tif err != nil {\n\t\tt.Fatalf("stat stored upload: %v", err)\n\t}\n\tif !storedInfo.ModTime().Equal(sourceModTime) {\n\t\tt.Fatalf("encrypted stored modtime=%v want source=%v", storedInfo.ModTime(), sourceModTime)\n\t}')
          replace('internal/serve/upload_encryption_e2e_test.go',
              '\tif file.Size != int64(len(plaintext)) {\n\t\tt.Fatalf("registered plaintext size = %d, want %d", file.Size, len(plaintext))\n\t}',
              '\tif file.Size != int64(len(plaintext)) {\n\t\tt.Fatalf("registered plaintext size = %d, want %d", file.Size, len(plaintext))\n\t}\n\tif !file.ModTime.Equal(sourceModTime) {\n\t\tt.Fatalf("registered modtime=%v want source=%v", file.ModTime, sourceModTime)\n\t}')
          PY
          gofmt -w internal/serve/config.go internal/serve/config_test.go internal/serve/upload_stream.go internal/serve/uploads.go internal/serve/uploads_test.go internal/serve/upload_encryption_e2e_test.go
          git diff --check
      - name: Validate Go upload boundary
        run: go test ./internal/serve ./gooru
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          npm run check
          npm run test:unit
          npm run build
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email chatgpt-codex-connector@users.noreply.github.com
          git add internal/serve/config.go internal/serve/config_test.go internal/serve/upload_stream.go internal/serve/uploads.go internal/serve/uploads_test.go internal/serve/upload_encryption_e2e_test.go frontend/src/lib/api/client.ts docs/openapi.yaml docs/CONFIG.md frontend/src/lib/api/openapi.ts
          git commit -m 'feat: preserve browser upload source modtimes'
          git push origin HEAD:feat/254-upload-source-modtime
