# validation trigger v6
name: maintainer-254-source-modtime

on:
  push:
    branches:
      - feat/254-upload-source-modtime
    paths:
      - .github/workflows/maintainer-254-source-modtime.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 .maintainer-254-source-modtime-docfix.py
          python3 .maintainer-254-source-modtime.py
          python3 .maintainer-254-source-modtime-testfix.py
          gofmt -w internal/serve/config.go internal/serve/config_test.go internal/serve/upload_stream.go internal/serve/uploads.go internal/serve/uploads_test.go internal/serve/upload_encryption_e2e_test.go
          git diff --check
      - name: Validate Go upload boundary
        run: go test ./internal/serve ./gooru
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          npm run check
          npm run test:unit
          npm run build
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email chatgpt-codex-connector@users.noreply.github.com
          git add internal/serve/config.go internal/serve/config_test.go internal/serve/upload_stream.go internal/serve/uploads.go internal/serve/uploads_test.go internal/serve/upload_encryption_e2e_test.go frontend/src/lib/api/client.ts docs/openapi.yaml docs/CONFIG.md frontend/src/lib/api/openapi.ts
          git commit -m 'feat: preserve browser upload source modtimes'
          git push origin HEAD:feat/254-upload-source-modtime
