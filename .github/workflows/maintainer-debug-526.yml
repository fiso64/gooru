name: Maintainer debug 526

on:
  push:
    branches:
      - maintainer/28-protected-tag-persistence

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Run managed tag regression verbosely
        run: go test -count=1 -run '^TestBackgroundTagMutationManagedFileUsesStoragePath$' -v ./gooru
