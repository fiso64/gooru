name: Maintainer debug 526

on:
  push:
    branches:
      - maintainer/28-protected-tag-persistence

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Inspect managed file lookup path
        run: |
          grep -R -n 'func (c \*Client) GetFileInfoByPublicID\|func (c \*Client) GetFileInfoByPublicIDs\|ManagedStorage\|managed_storage_locations' gooru internal/database | head -200
          go test -count=1 -run '^TestBackgroundTagMutationManagedFileUsesStoragePath$' -v ./gooru
