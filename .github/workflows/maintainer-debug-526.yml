name: Maintainer debug 526

on:
  push:
    branches:
      - maintainer/28-protected-tag-persistence

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Inspect server file lookup
        run: |
          grep -R -n 'func (l \*GooruLibrary) GetFileByPublicID\|GetFileByPublicID(ctx' internal/serve | head -100
