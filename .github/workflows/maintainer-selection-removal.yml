name: Maintainer selection removal

on:
  push:
    branches:
      - fix/21-selection-removal

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply implementation
        run: |
          python3 .github/maintainer_selection_removal.py
          gofmt -w internal/serve/server.go internal/serve/browse.go internal/serve/file_removals.go internal/serve/file_delete_test.go
      - name: Validate backend
        run: |
          go test ./internal/serve -run 'BulkUntrack|DeleteMode|ManagedDelete' -count=1
          go test ./...
      - name: Generate frontend API
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
      - name: Validate browser regression
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/shortcut-focus.spec.ts --grep 'Delete and Shift\+Delete'
      - name: Commit validated implementation
        run: |
          rm .github/maintainer_selection_removal.py
          rm .github/workflows/maintainer-selection-removal.yml
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/serve/server.go internal/serve/browse.go internal/serve/file_removals.go internal/serve/file_delete_test.go docs/openapi.yaml frontend/src/lib/api/openapi.ts frontend/src/lib/api/types.ts frontend/src/lib/api/client.ts frontend/src/lib/queries/files.ts frontend/src/lib/utils/keyboard.ts frontend/src/lib/utils/keyboard.test.ts frontend/src/lib/components/MediaGrid.svelte frontend/src/lib/components/AuthenticatedApp.svelte frontend/tests/shortcut-focus.spec.ts .github/maintainer_selection_removal.py .github/workflows/maintainer-selection-removal.yml
          git commit -m "feat(library): remove selected files in bulk"
          git push origin HEAD:fix/21-selection-removal
