name: maintainer-388-library-relocation-retry

on:
  push:
    branches:
      - fix/388-library-relocation

permissions:
  contents: write

jobs:
  retry-patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip relocation patch]') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/388-library-relocation
          fetch-depth: 0
      - name: Reapply patch with explicit Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          GO_BIN="$(find /nix/store -type f -path '*/bin/go' -perm -111 2>/dev/null | head -n 1)"
          if [ -z "$GO_BIN" ]; then
            echo "No Go toolchain found in /nix/store" >&2
            exit 1
          fi
          export PATH="$(dirname "$GO_BIN"):$PATH"
          go version
          python3 <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/maintainer-388-library-relocation.yml').read_text().splitlines()
          marker = '        run: |'
          start = None
          for i, line in enumerate(src):
              if i >= 1 and src[i-1].strip() == 'shell: bash' and line == marker:
                  start = i + 1
                  break
          if start is None:
              raise SystemExit('repair script not found')
          body = []
          for line in src[start:]:
              if line.startswith('      - '):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/repair-388.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/repair-388.sh
