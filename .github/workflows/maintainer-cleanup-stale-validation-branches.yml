name: Maintainer cleanup stale validation branches

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Delete obsolete validation branches and workflow
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete validate-issue-279-booru-search-polish validate-issue-279-text-search-submit
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git rm .github/workflows/maintainer-cleanup-stale-validation-branches.yml
          git commit -m "chore: remove stale validation cleanup workflow"
          git push origin HEAD:develop
