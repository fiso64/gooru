name: Maintainer cleanup stale validation branches

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/maintainer-cleanup-stale-validation-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete integrated validation branches
        run: git push origin --delete validate-issue-279-grid validate-issue-279-shell
