name: maintainer-validate
on:
  push:
    branches: [fix/129-real-upload-progress]
permissions:
  contents: write
jobs:
  frontend:
    if: "${{ !contains(github.event.head_commit.message, 'chore: persist validation output') }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check and persist output
        run: |
          set +e
          npm run check > ../maintainer-validation.txt 2>&1
          code=$?
          set -e
          git config user.name 'gooru-maintainer-bot'
          git config user.email 'maintainer@users.noreply.github.com'
          git add ../maintainer-validation.txt
          git commit -m 'chore: persist validation output'
          git push
          exit $code
      - run: npm run test:unit
      - run: npm run build
