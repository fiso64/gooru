name: Maintainer validation

on:
  push:
    branches: [fix/21-password-policy]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: true
      - name: Go build
        run: go build ./...
      - name: Go test
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend type and Svelte checks
        working-directory: frontend
        run: npm run check
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
