name: Maintainer 817 lazy fix 2

on:
  push:
    branches:
      - maintainer-817-nixos-instances

permissions:
  contents: write

jobs:
  integrate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate staged Nix changes
        shell: bash
        run: |
          test -f nix/root-flake.nix
          test -f nix/module-fixed.nix
          test -f nix/module-lazy2.patch

          cp nix/root-flake.nix flake.nix
          cp nix/module-fixed.nix nix/module.nix
          git apply nix/module-lazy2.patch

          sed -i "/- 'flake.nix'/a\      - 'nix/**'" .github/workflows/nix-package.yml

          git diff --check
          nix build .#checks.x86_64-linux.nixos-module --print-build-logs --show-trace
          nix build .#packages.x86_64-linux.default --print-build-logs

          rm -f nix/root-flake.nix nix/module-fixed.nix nix/module-lazy.patch nix/module-lazy2.patch
          rm -f .github/workflows/maintainer-817-integrate.yml
          rm -f .github/workflows/maintainer-817-fix.yml
          rm -f .github/workflows/maintainer-817-lazy-fix.yml
          rm -f .github/workflows/maintainer-817-lazy-fix2.yml

          git config user.name "gooru-maintainer"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git add -A
          git commit -m "refactor(nix): wire multi-instance module"
          git push origin HEAD:maintainer-817-nixos-instances
