name: Maintainer 655

on:
  push:
    branches:
      - maintainer/655-viewer-tag-groups

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/655-viewer-tag-groups

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply fix
        run: python3 .github/maintainer-655.py

      - name: Make viewer groups explicit derived state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/components/PreviewDialog.svelte')
          text = path.read_text()
          marker = "  const imageSource = $derived(comicEntered && currentComicPage ? currentComicPage.url : viewerImageSource(file, effectivePreferOriginal));\n"
          derived = marker + "  const tagGroups = $derived(groupTags(file.tags));\n  const hasTagNamespaces = $derived(tagGroups.some((group) => Boolean(group.namespace)));\n"
          if text.count(marker) != 1:
              raise SystemExit('imageSource marker mismatch')
          text = text.replace(marker, derived)
          invalid = "      {@const tagGroups = groupTags(file.tags)}\n      {@const hasTagNamespaces = tagGroups.some((group) => Boolean(group.namespace))}\n      {#each tagGroups as group (group.namespace)}"
          valid = "      {#each tagGroups as group (group.namespace)}"
          if text.count(invalid) != 1:
              raise SystemExit('generated tag group markup mismatch')
          path.write_text(text.replace(invalid, valid))
          PY

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --prefer-offline --no-audit

      - name: Validate grouping unit tests
        run: npm --prefix frontend run test:unit -- --run src/lib/utils/format.test.ts

      - name: Validate frontend types
        run: npm --prefix frontend run check

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Validate viewer tag grouping regressions
        working-directory: frontend
        run: npx playwright test tests/viewer-tag-groups.spec.ts

      - name: Commit focused fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/maintainer-655.yml .github/maintainer-655.py
          git config user.name 'gooru-maintainer'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git add frontend/src/lib/utils/format.ts frontend/src/lib/components/PreviewDialog.svelte frontend/src/lib/utils/format.test.ts frontend/tests/viewer-tag-groups.spec.ts .github/workflows/maintainer-655.yml .github/maintainer-655.py
          git diff --cached --check
          git commit -m 'fix(ui): keep viewer tag groups ordered'
          git push origin HEAD:maintainer/655-viewer-tag-groups
