name: Maintainer PR 646 refresh

on:
  push:
    branches: [fix/645-file-removal-staging-containment]

permissions:
  contents: write

jobs:
  refresh-validate:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/645-file-removal-staging-containment
          fetch-depth: 0
      - name: Merge current develop
        run: |
          git config user.name "gooru-maintainer"
          git config user.email "maintainer@users.noreply.github.com"
          git fetch origin develop
          git merge --no-edit origin/develop
          git diff --check
      - name: Go tests
        run: go test -count=1 ./...
      - name: Go build
        run: go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Browser regressions
        working-directory: frontend
        run: npm run test:e2e -- startup-query-churn.spec.ts upload-metadata-refresh.spec.ts upload-concurrency.spec.ts upload-cancel-inflight.spec.ts hover-media-preview.spec.ts saved-search-completions.spec.ts jobs-layout.spec.ts jobs-pagination.spec.ts jobs-polling.spec.ts jobs-history-controls.spec.ts issue-606-followup.spec.ts build-identity.spec.ts
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Remove temporary workflow and push refreshed branch
        run: |
          git rm .github/workflows/maintainer-pr646-refresh.yml
          git commit -m "Merge develop into file removal hardening"
          git push origin HEAD:fix/645-file-removal-staging-containment
