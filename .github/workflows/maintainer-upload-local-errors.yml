name: Maintainer upload local error isolation

on:
  push:
    branches:
      - fix/21-upload-file-local-errors

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply patch
        run: |
          python3 .github/maintainer_upload_local_errors.py
          gofmt -w internal/serve/uploads.go internal/serve/uploads_test.go
      - name: Validate uploads
        run: go test ./internal/serve -run 'Upload' -count=1
      - name: Validate Go suite
        run: go test ./...
      - name: Commit validated patch
        run: |
          rm .github/maintainer_upload_local_errors.py
          rm .github/workflows/maintainer-upload-local-errors.yml
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/serve/uploads.go internal/serve/uploads_test.go .github/maintainer_upload_local_errors.py .github/workflows/maintainer-upload-local-errors.yml
          git commit -m "fix(upload): isolate file-local batch failures"
          git push origin HEAD:fix/21-upload-file-local-errors
