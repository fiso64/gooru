name: Temporary 249 tag refresh coalescing validation

on:
  push:
    branches:
      - feat/249-upload-item-tags
    paths:
      - .github/workflows/tmp-249-tag-refresh-coalesce.yml
      - .github/tmp-249-tag-refresh-coalesce.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/249-upload-item-tags
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply performance patch
        run: python3 .github/tmp-249-tag-refresh-coalesce.py
      - name: Check frontend
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        id: unit
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee ../.github/tmp-249-tag-refresh-unit.log
      - name: Persist unit failure diagnostic
        if: failure() && steps.unit.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gooru-maintainer-bot"
          git config user.email "maintainer@localhost"
          git add .github/tmp-249-tag-refresh-unit.log
          git commit -m 'ci: capture #249 tag refresh unit failure'
          git push origin HEAD:feat/249-upload-item-tags
      - name: Install browser
        if: success()
        working-directory: frontend
        run: npx playwright install chromium
      - name: Upload viewer browser regressions
        id: e2e
        if: success()
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e -- upload-viewer.spec.ts 2>&1 | tee ../.github/tmp-249-tag-refresh-e2e.log
      - name: Persist browser failure diagnostic
        if: failure() && steps.e2e.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gooru-maintainer-bot"
          git config user.email "maintainer@localhost"
          git add .github/tmp-249-tag-refresh-e2e.log
          git commit -m 'ci: capture #249 tag refresh browser failure'
          git push origin HEAD:feat/249-upload-item-tags
      - name: Commit source changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "gooru-maintainer-bot"
          git config user.email "maintainer@localhost"
          git add frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/state/uploadTagReconciliation.ts frontend/src/lib/state/uploadTagReconciliation.test.ts
          git commit -m 'perf: coalesce upload tag reconciliation refreshes'
          git push origin HEAD:feat/249-upload-item-tags
