name: tmp tune 159
on:
  push:
    branches: [fix/159-native-scroll-pan]
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/159-native-scroll-pan
      - name: Apply requested zoom tuning and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/components/ViewerStage.svelte')
          s = p.read_text()
          old = 'Math.exp(-event.deltaY * 0.007)'
          new = 'Math.exp(-event.deltaY * 0.0075)'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          PY
          cd frontend
          npm ci
          npm run check
          npm run test:unit
          npm run build
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email 'chatgpt-codex-connector@users.noreply.github.com'
          git add frontend/src/lib/components/ViewerStage.svelte
          git rm .github/workflows/tmp-tune-159.yml
          git commit -m 'fix(viewer): tune touchpad zoom response'
          git push origin HEAD:fix/159-native-scroll-pan
