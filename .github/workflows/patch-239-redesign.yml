name: Patch 239 comic transition redesign

on:
  push:
    branches:
      - feat/231-comic-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply redesign
        run: node .github/patch-239.mjs
      - name: Commit redesign
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/components/ViewerStage.svelte frontend/src/lib/styles/viewer.css frontend/tests/comic-ui.spec.ts
          git commit -m 'fix(comics): make reader transition transient'
          git push origin HEAD:feat/231-comic-ui
