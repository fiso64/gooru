# rerun after stale migration/media-type assertion repair
name: Temporary 333 Go diagnostics
on:
  push:
    branches: [perf/333-comic-kind-facet]
    paths: ['.github/workflows/tmp-333-go-diagnose.yml']
jobs:
  diagnose:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Combined Go regression command
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go test -json ./internal/database ./internal/query ./internal/serve ./gooru/... 2>&1 | tee validation-combined.jsonl
      - name: Combined verbose fallback
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/database ./internal/query ./internal/serve ./gooru/... 2>&1 | tee validation-combined-verbose.log
      - uses: actions/upload-artifact@v4
        with:
          name: go-combined-diagnostics
          path: validation-combined*
