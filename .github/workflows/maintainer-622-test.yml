name: Maintainer 622 validation

on:
  push:
    branches:
      - maintainer/622-logical-upload-session

permissions:
  contents: read

concurrency:
  group: maintainer-622-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go focused validation
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Upload worker recovery tests
        run: go test -count=1 -run TestRunBackgroundUploadTask ./internal/serve
      - name: Focused tests
        run: go test -count=1 ./internal/database ./gooru ./internal/serve
      - name: Build
        run: go build ./...
