name: Maintainer 345
on: [push]
permissions:
  contents: write
jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/345-jobs-pagination
          fetch-depth: 0
      - run: python3 scripts/maintainer_345.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go test ./...
      - run: go build ./...
      - run: npm ci --prefer-offline --no-audit
        working-directory: frontend
      - run: npm run generate:api
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright test tests/jobs-pagination.spec.ts --project=chromium
        working-directory: frontend
      - run: |
          rm scripts/maintainer_345.py .github/workflows/maintainer-345.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(jobs): reconcile paginated history consumers'
          git push origin HEAD:feat/345-jobs-pagination
