name: tmp protected storage validation
on:
  pull_request:
    branches:
      - develop
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/encryptedfile ./internal/serve ./cmd/gooru/cmd
      - run: go test ./...
      - run: go build ./...
