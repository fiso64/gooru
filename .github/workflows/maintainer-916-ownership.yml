name: Temporary #916 managed-state ownership integration
on:
  push:
    branches: [feat-916-secure-upload-default]
    paths: [.github/workflows/maintainer-916-ownership.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Wire managed-state identity precondition and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/serve/config.go')
          text = path.read_text()
          original = '\tif automatic {\n\t\tif err := prepareDefaultUploadDir(cfg.Uploads.Targets[0].Path); err != nil {'
          replacement = '\tif automatic {\n\t\tif err := verifyManagedUploadStateOwner(path); err != nil {\n\t\t\treturn Config{}, err\n\t\t}\n\t\tif err := prepareDefaultUploadDir(cfg.Uploads.Targets[0].Path); err != nil {'
          assert text.count(original) == 1, 'unexpected LoadConfig automatic-upload block'
          path.write_text(text.replace(original, replacement))
          PY
          gofmt -w internal/serve/config.go internal/serve/default_uploads.go internal/serve/default_uploads_owner_unix.go internal/serve/default_uploads_owner_other.go internal/serve/default_uploads_owner_linux_test.go
          git rm .github/workflows/maintainer-916-ownership.yml
          git add internal/serve/config.go internal/serve/default_uploads.go internal/serve/default_uploads_owner_unix.go internal/serve/default_uploads_owner_other.go internal/serve/default_uploads_owner_linux_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wire managed upload state ownership check and format"
          git push origin HEAD:feat-916-secure-upload-default
      - name: Focused regression tests
        run: go test ./internal/serve -run 'TestManagedUpload|TestExistingDefaultUploadTarget|TestDefaultUploadDirectory|TestLoadConfigImplicitUploadModes|TestFirstRunConfigAdminLoginUploadsFile' -count=1
