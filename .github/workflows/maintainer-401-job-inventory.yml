name: Maintainer 401 remove legacy jobs

on:
  push:
    branches:
      - maintainer/401-remove-job-manager

permissions:
  contents: write

jobs:
  cleanup:
    if: "github.event.head_commit.message == 'chore: retry #401 cleanup after OpenAPI assertion'"
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/401-remove-job-manager
      - name: Remove legacy JobManager surfaces
        run: |
          python3 .github/maintainer-401-cleanup.py
          python3 .github/maintainer-401-cleanup-residual.py
      - name: Format Go
        run: gofmt -w cmd/gooru/cmd/serve.go internal/serve/server.go internal/serve/server_test.go internal/serve/authorization_test.go internal/serve/config.go internal/serve/config_test.go internal/serve/openapi_test.go internal/background/runner.go scripts/devprofile/main.go
      - name: Regenerate API client
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run generate:api
      - name: Verify removed production compatibility surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'JobManager|/api/v1/jobs|JobsConfig|AsyncJob|createClearJobsMutation|clearJobsMutation|\.clearJobs\(|\.getJob\(|\.listJobs\(|\.cancelJob\(' -- gooru internal cmd docs scripts spec frontend/src; then
            echo 'legacy production compatibility references remain' >&2
            exit 1
          fi
          if git grep -n -E '^jobs:|^[[:space:]]+jobs:' -- docs/CONFIG.md scripts/devprofile/main.go; then
            echo 'legacy jobs configuration remains' >&2
            exit 1
          fi
          git grep -n 'job_queue_full' -- internal/serve frontend/src
      - name: Validate Go
        run: |
          go test -count=1 ./...
          go build ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
          npx playwright install chromium
          npm run test:e2e -- jobs-layout.spec.ts jobs-pagination.spec.ts jobs-polling.spec.ts
      - name: Validate patch and commit
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name fiso64
          git config user.email 64778819+fiso64@users.noreply.github.com
          git add -A
          git commit -m 'refactor: remove legacy in-memory job manager'
          git push origin HEAD:maintainer/401-remove-job-manager
