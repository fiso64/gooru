name: Reconcile 248 default tags

on:
  push:
    branches:
      - feat/248-upload-target-default-tags

permissions:
  contents: write

concurrency:
  group: reconcile-248-default-tags
  cancel-in-progress: true

jobs:
  reconcile-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/248-upload-target-default-tags
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Merge current develop
        run: |
          git config user.name "gooru-maintainer"
          git config user.email "maintainer@users.noreply.github.com"
          git fetch origin develop
          git merge --no-edit origin/develop
      - name: Narrow implementation to editable ordinary default tags
        id: patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          function replace(text, oldText, newText, label) {
            if (text.includes(newText)) return text;
            if (!text.includes(oldText)) throw new Error(`missing ${label}`);
            return text.replace(oldText, newText);
          }

          let path = 'internal/serve/config.go';
          let text = fs.readFileSync(path, 'utf8');
          text = replace(text, 'query.ValidateTagDirectives(cfg.Uploads.Targets[i].DefaultTags)', 'query.ValidateTags(cfg.Uploads.Targets[i].DefaultTags)', 'config tag validation');
          fs.writeFileSync(path, text);

          path = 'internal/serve/uploads.go';
          text = fs.readFileSync(path, 'utf8');
          text = replace(text,
            '\tresolvedTags, err := query.ResolveTagDirectives(tags)\n\tif err != nil {\n\t\tremoveSavedUploads(saved)\n\t\twriteError(w, http.StatusBadRequest, "invalid_request", err.Error(), nil)\n\t\treturn\n\t}\n',
            '\tif err := query.ValidateTags(tags); err != nil {\n\t\tremoveSavedUploads(saved)\n\t\twriteError(w, http.StatusBadRequest, "invalid_request", err.Error(), nil)\n\t\treturn\n\t}\n',
            'upload explicit tag validation');
          text = replace(text, 'stagedUploads(saved), resolvedTags)', 'stagedUploads(saved), tags)', 'upload importer tags');
          fs.writeFileSync(path, text);

          path = 'docs/CONFIG.md';
          text = fs.readFileSync(path, 'utf8');
          text = text.replace('Optional list of visible, editable upload-tag directives. Entries use the Upload tab `tag` / `-tag` syntax; exclusions remove matching positive tags when the upload is submitted.', 'Optional list of ordinary tags used to pre-populate the Upload tab when this destination is selected. These tags remain visible and editable before upload.');
          text = text.replace(/\n\s*- -project:archive/g, '');
          fs.writeFileSync(path, text);

          path = 'internal/serve/upload_default_tags_test.go';
          fs.writeFileSync(path, `package serve\n\nimport (\n\t"path/filepath"\n\t"strings"\n\t"testing"\n)\n\nfunc TestConfigUploadTargetDefaultTagsValidateOrdinaryTags(t *testing.T) {\n\tcfg := DefaultConfig(filepath.Join(t.TempDir(), "gooru.db"))\n\tcfg.Uploads.Enabled = true\n\tcfg.Uploads.Targets = []UploadTarget{{ID: "default", Name: "Default", Path: t.TempDir(), DefaultTags: []string{" project:inbox ", "source:upload"}}}\n\tif err := cfg.Validate(); err != nil {\n\t\tt.Fatalf("Validate default_tags: %v", err)\n\t}\n\tif got := cfg.Uploads.Targets[0].DefaultTags; len(got) != 2 || got[0] != "project:inbox" || got[1] != "source:upload" {\n\t\tt.Fatalf("trimmed default tags=%v", got)\n\t}\n\tcfg.Uploads.Targets[0].DefaultTags = []string{"bad tag"}\n\tif err := cfg.Validate(); err == nil || !strings.Contains(err.Error(), "default_tags") {\n\t\tt.Fatalf("expected default_tags validation error, got %v", err)\n\t}\n}\n`);

          path = 'internal/serve/uploads_test.go';
          text = fs.readFileSync(path, 'utf8').replace('[]string{"project:inbox", "-project:archive"}', '[]string{"project:inbox", "source:upload"}').replace('got[1] != "-project:archive"', 'got[1] != "source:upload"');
          fs.writeFileSync(path, text);

          path = 'frontend/src/lib/state/uploadWorkflow.svelte.test.ts';
          text = fs.readFileSync(path, 'utf8').replace("['project:inbox', '-project:archive']", "['project:inbox', 'source:upload']").replace("'project:inbox -project:archive'", "'project:inbox source:upload'");
          fs.writeFileSync(path, text);
          NODE
          gofmt -w internal/serve/config.go internal/serve/uploads.go internal/serve/upload_default_tags_test.go internal/serve/uploads_test.go
          if git diff --quiet; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - name: Regenerate frontend API types
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit && npm run generate:api
      - name: Commit reconciled implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git add docs/CONFIG.md docs/openapi.yaml frontend/src/lib/api/openapi.ts frontend/src/lib/state/uploadWorkflow.svelte.test.ts internal/serve/config.go internal/serve/uploads.go internal/serve/upload_default_tags_test.go internal/serve/uploads_test.go
          git commit -m "refactor(upload): keep target defaults editable and explicit"
      - name: Go validation
        run: go test ./... && go build ./...
      - name: Frontend validation
        working-directory: frontend
        run: npm run check && npm run test:unit && npm run build
      - name: Push reconciled branch
        run: git push origin HEAD:feat/248-upload-target-default-tags
