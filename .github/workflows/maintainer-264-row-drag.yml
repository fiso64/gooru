name: Maintainer 264 row drag repair

on:
  push:
    branches:
      - fix/264-saved-search-row-drag

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/264-saved-search-row-drag
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply focused repair
        run: node tools/maintainer_264_patch.mjs
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Focused Chromium regression
        working-directory: frontend
        run: npx playwright test tests/saved-search-reorder.spec.ts --project=chromium
      - name: Commit validated repair and remove harness
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '1144995+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/AppShell.svelte frontend/tests/saved-search-reorder.spec.ts
          git rm .github/workflows/maintainer-264-row-drag.yml tools/maintainer_264_patch.py tools/maintainer_264_patch.mjs
          git commit -m 'fix(web): drag saved-search entries directly'
          git push origin HEAD:fix/264-saved-search-row-drag
