name: Maintainer 251 freeze patch

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/251-viewer-scaling'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Keep nearest scaling through freeze handoffs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/components/ViewerStage.svelte')
          text = path.read_text()
          old = """      context.clearRect(0, 0, canvas.width, canvas.height);\n      context.drawImage(image, 0, 0, canvas.width, canvas.height);"""
          new = """      context.clearRect(0, 0, canvas.width, canvas.height);\n      context.imageSmoothingEnabled = scaling !== 'nearest';\n      context.drawImage(image, 0, 0, canvas.width, canvas.height);"""
          if old not in text:
              print('freeze smoothing correction already present; no change')
          else:
              path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet -- frontend/src/lib/components/ViewerStage.svelte; then
            exit 0
          fi
          git config user.name 'autonomous-maintainer'
          git config user.email 'autonomous-maintainer@users.noreply.github.com'
          git add frontend/src/lib/components/ViewerStage.svelte
          git commit -m 'fix(viewer): preserve nearest scaling during handoffs'
          git push origin HEAD:${{ github.head_ref }}
