name: Temporary indexed tag suggestion validation

on:
  push:
    branches:
      - perf/333-index-tag-suggestions

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply indexed tag suggestion patch
        run: python3 scripts/tmp_patch_tag_suggestions.py
      - name: Format
        run: gofmt -w internal/database/database.go internal/database/tag_suggestions_index_test.go
      - name: Validate database package
        run: go test ./internal/database
      - name: Validate browse integration
        run: go test ./internal/serve
      - name: Commit validated change and remove temporary validation files
        run: |
          rm scripts/tmp_patch_tag_suggestions.py .github/workflows/tmp-index-tag-suggestions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/database/database.go internal/database/tag_suggestions_index_test.go scripts/tmp_patch_tag_suggestions.py .github/workflows/tmp-index-tag-suggestions.yml
          git commit -m "perf(db): index tag suggestion prefixes"
          git push origin HEAD:perf/333-index-tag-suggestions
