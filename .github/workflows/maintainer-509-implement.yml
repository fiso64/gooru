name: Maintainer 509 implementation

on:
  push:
    branches:
      - maintainer/509-open-current-new-tab

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply focused viewer shortcut change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          preview = Path('frontend/src/lib/components/PreviewDialog.svelte')
          text = preview.read_text()
          old = "  let downloadLink = $state<HTMLAnchorElement | undefined>();\n"
          new = old + "  let openOriginalLink = $state<HTMLAnchorElement | undefined>();\n"
          if text.count(old) != 1:
              raise SystemExit('unexpected downloadLink declaration shape')
          text = text.replace(old, new, 1)

          old = """    if (key === 'd') {\n      event.preventDefault();\n      event.stopPropagation();\n      downloadLink?.click();\n      return;\n    }\n"""
          new = old + """    if (key === 'o') {\n      event.preventDefault();\n      event.stopPropagation();\n      openOriginalLink?.click();\n      return;\n    }\n"""
          if text.count(old) != 1:
              raise SystemExit('unexpected download shortcut shape')
          text = text.replace(old, new, 1)

          old = """    <a class=\"g-btn g-btn-ghost\" href={file.media_urls.content} target=\"_blank\" rel=\"noreferrer\" title=\"Open original in new tab\" aria-label={`Open original ${file.name}`}>\n"""
          new = """    <a bind:this={openOriginalLink} class=\"g-btn g-btn-ghost\" href={file.media_urls.content} target=\"_blank\" rel=\"noreferrer\" title=\"Open original in new tab (O)\" aria-label={`Open original ${file.name}`}>\n"""
          if text.count(old) != 1:
              raise SystemExit('unexpected external-link anchor shape')
          preview.write_text(text.replace(old, new, 1))

          shortcuts = Path('frontend/src/lib/components/ShortcutsView.svelte')
          text = shortcuts.read_text()
          old = "        { keys: ['d'], description: 'Download original' },\n"
          new = "        { keys: ['o'], description: 'Open original in new tab' },\n" + old
          if text.count(old) != 1:
              raise SystemExit('unexpected shortcut reference shape')
          shortcuts.write_text(text.replace(old, new, 1))

          tests = Path('frontend/tests/viewer-shortcuts.spec.ts')
          text = tests.read_text()
          marker = "test('shortcuts open as a modal and number keys follow visible sidebar order', async ({ page }) => {\n"
          addition = """test('O opens the currently viewed original in a new browser tab', async ({ page }) => {\n  await mockApp(page);\n  await page.getByRole('button', { name: 'Preview one.jpg' }).click();\n  const preview = page.getByRole('dialog', { name: 'one.jpg' });\n  await expect(preview.getByTitle('Open original in new tab (O)')).toBeVisible();\n\n  const openedPromise = page.context().waitForEvent('page');\n  await preview.focus();\n  await page.keyboard.press('o');\n  const opened = await openedPromise;\n  await expect.poll(() => {\n    try { return new URL(opened.url()).pathname; } catch { return ''; }\n  }).toBe('/api/v1/files/one/content');\n  await opened.close();\n});\n\n"""
          if text.count(marker) != 1:
              raise SystemExit('unexpected viewer-shortcuts insertion point')
          text = text.replace(marker, addition + marker, 1)
          old = "  await expect(shortcuts.getByText('Toggle original / preview media')).toBeVisible();\n"
          new = old + "  await expect(shortcuts.getByText('Open original in new tab')).toBeVisible();\n"
          if text.count(old) != 1:
              raise SystemExit('unexpected shortcut modal assertion shape')
          tests.write_text(text.replace(old, new, 1))
          PY
      - name: Validate focused frontend surface
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run check
          npx playwright install chromium
          npx playwright test tests/viewer-shortcuts.spec.ts
      - name: Commit feature without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintainer-509-implement.yml
          git add frontend/src/lib/components/PreviewDialog.svelte frontend/src/lib/components/ShortcutsView.svelte frontend/tests/viewer-shortcuts.spec.ts
          git diff --cached --check
          git config user.name 'gooru-maintainer'
          git config user.email 'gooru-maintainer@users.noreply.github.com'
          git commit -m 'feat(viewer): open current file in new tab shortcut'
          git push origin HEAD:maintainer/509-open-current-new-tab
