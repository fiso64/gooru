name: Validate 337 Head

on:
  push:
    branches:
      - fix/311-pagination-overflow

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused protected-state pagination fix
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/api/client.ts')
          text = path.read_text()
          replacements = [
              (
                  "body: JSON.stringify({ query: state.query, kind: state.kind, sort: state.sort, order: state.order, file_id: state.fileID })",
                  "body: JSON.stringify({ query: state.query, kind: state.kind, sort: state.sort, order: state.order, file_id: state.fileID, page: state.page })",
              ),
              (
                  "const payload = await parseJSONResponse<{ query?: string; kind?: string; sort?: FileSort; order?: SortOrder; file_id?: string }>(response);",
                  "const payload = await parseJSONResponse<{ query?: string; kind?: string; sort?: FileSort; order?: SortOrder; file_id?: string; page?: number }>(response);",
              ),
              (
                  "return { query: payload.query ?? '', kind: payload.kind ?? '', sort: payload.sort ?? 'added', order: payload.order ?? 'desc', fileID: payload.file_id ?? '' };",
                  "return { query: payload.query ?? '', kind: payload.kind ?? '', sort: payload.sort ?? 'added', order: payload.order ?? 'desc', fileID: payload.file_id ?? '', page: payload.page ?? 1 };",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match for: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          git diff -- frontend/src/lib/api/client.ts
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/api/client.ts
          git commit -m "fix(ui): round-trip protected pagination state"
          git push
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate backend
        run: |
          set -euxo pipefail
          go test ./...
          go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        working-directory: frontend
        run: |
          set -euxo pipefail
          npm ci
          npm run check
          npm run test:unit
          npm run build
      - name: Validate focused browser regressions
        working-directory: frontend
        run: |
          set -euxo pipefail
          npx playwright test tests/paged-library.spec.ts tests/upload-large-batch.spec.ts --project=chromium
      - name: Remove one-shot validation workflow
        if: success()
        run: |
          set -euxo pipefail
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-337-head.yml
          git commit -m "chore: remove pagination validation workflow"
          git push
