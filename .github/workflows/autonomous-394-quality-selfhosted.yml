name: autonomous-394-quality-selfhosted

on:
  push:
    branches: [feat/394-preview-options]

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/394-preview-options
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply source repair from staged repair workflow
        shell: python
        run: |
          from pathlib import Path
          lines = Path('.github/workflows/autonomous-394-quality-direct.yml').read_text().splitlines()
          marker = '      - name: Replace preview quality round-trip with direct backend quality'
          start = lines.index(marker)
          run_line = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name:'))
          code = '\n'.join(line[10:] if line.startswith('          ') else '' for line in lines[run_line + 1:end])
          exec(compile(code, 'embedded-preview-repair', 'exec'), {'__name__': '__main__'})
      - name: Format and validate backend
        run: |
          gofmt -w internal/serve/media.go internal/serve/media_govips.go internal/serve/media_thumbnailers.go internal/serve/preview_quality_test.go
          go test ./internal/serve ./internal/filesource
          go test ./...
          go build ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run test:unit -- --run
          npm run build
      - name: Commit repair and remove temporary workflows
        run: |
          rm .github/workflows/autonomous-394-quality-direct.yml .github/workflows/autonomous-394-quality-selfhosted.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: apply preview JPEG quality in image backends [394-self-review]'
          git push origin HEAD:feat/394-preview-options
