name: Temporary 322 validate

on:
  push:
    branches:
      - fix/322-large-upload-queue

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/322-large-upload-queue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply bounded upload queue rendering
        run: |
          python3 .github/tmp-322-apply.py
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/UploadPanel.svelte frontend/src/lib/components/UploadMediaPreview.svelte frontend/tests/upload-large-batch.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ui): bound large upload queue rendering'
            git push origin HEAD:fix/322-large-upload-queue
          fi
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          npm run build
      - name: Validate upload browser regressions
        working-directory: frontend
        run: npx playwright test tests/upload-large-batch.spec.ts tests/upload-drop-control.spec.ts tests/upload-row-layout.spec.ts --project=chromium
