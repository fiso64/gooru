name: Temporary #416 frontend diagnostics

on:
  push:
    branches:
      - feat/416-bound-actual-size

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/416-bound-actual-size
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply the implementation script from the primary temporary workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          text = Path('.github/workflows/tmp-416-implement.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          Path('/tmp/implement-416.py').write_text(textwrap.dedent(text[start:end]))
          PY
          python3 /tmp/implement-416.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Capture frontend check
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ../frontend-check.log
      - name: Capture frontend unit tests
        if: always()
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm test -- --run 2>&1 | tee ../frontend-unit.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-logs
          path: |
            frontend-check.log
            frontend-unit.log
          if-no-files-found: ignore
