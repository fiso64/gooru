name: Wire #316 viewer benchmark telemetry

on:
  push:
    branches:
      - fix/316-latest-wins-viewer

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/316-latest-wins-viewer
      - name: Wire timing boundaries and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/components/ViewerStage.svelte')
          s = p.read_text()
          old = "  import { preserveNativeViewerSize } from '$lib/utils/media';\n"
          new = old + "  import { recordViewerPresentation, recordViewerRequest } from '$lib/utils/viewerPerformance';\n"
          if old not in s:
              raise SystemExit('missing media import anchor')
          s = s.replace(old, new, 1)
          old = "    const generation = ++transitionGeneration;\n    clearWaitingTimer();"
          new = "    const generation = ++transitionGeneration;\n    recordViewerRequest(generation);\n    clearWaitingTimer();"
          if old not in s:
              raise SystemExit('missing transition generation anchor')
          s = s.replace(old, new, 1)
          old = "      freezeGeneration += 1;\n      freezeVisible = false;\n      onPresented?.(source);"
          new = "      freezeGeneration += 1;\n      freezeVisible = false;\n      recordViewerPresentation(generation);\n      onPresented?.(source);"
          if old not in s:
              raise SystemExit('missing presentation anchor')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'Gooru Maintainer'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git rm .github/workflows/repair-316-perf.yml
          git add frontend/src/lib/components/ViewerStage.svelte
          git commit -m 'feat(webui): instrument viewer request-to-present timing'
          git push origin HEAD:fix/316-latest-wins-viewer
