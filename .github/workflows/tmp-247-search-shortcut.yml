name: tmp-247-search-shortcut

on:
  push:
    branches:
      - fix/247-search-shortcut-indicator-polish
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  focused-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npx playwright test tests/viewer-shortcuts.spec.ts --project=chromium

# Temporary branch-local validation; remove after the focused run completes.
