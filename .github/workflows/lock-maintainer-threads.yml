name: Lock maintainer threads

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    if: >-
      (github.event_name == 'issues' && github.event.issue.user.login == 'fiso64') ||
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'fiso64')
    runs-on: gooru-moderator
    steps:
      - name: Lock conversation
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/lock"
