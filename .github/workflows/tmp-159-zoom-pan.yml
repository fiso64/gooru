name: tmp-159-viewer-zoom-pan

on:
  push:
    branches: [feat/159-viewer-zoom-pan]

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/159-viewer-zoom-pan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply implementation
        run: python3 .github/tmp-159-patch.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
          npm run build
          npx playwright test viewer-zoom-pan.spec.ts viewer-player-controls.spec.ts --project=chromium
      - name: Commit validated implementation
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/lib/utils/viewer.ts frontend/src/lib/components/ViewerStage.svelte frontend/tests/viewer-zoom-pan.spec.ts; then
            exit 0
          fi
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/utils/viewer.ts frontend/src/lib/components/ViewerStage.svelte frontend/tests/viewer-zoom-pan.spec.ts
          git commit -m "feat(viewer): add pointer anchored zoom and pan"
          git push origin HEAD:feat/159-viewer-zoom-pan
