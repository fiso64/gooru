name: Maintainer 251 validate

on:
  push:
    branches:
      - feat/251-viewer-fit-modes

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/251-viewer-fit-modes
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply self-review fixes and regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'frontend/src/lib/components/ViewerStage.svelte',
              '      if (playbackControlsTimer) clearTimeout(playbackControlsTimer);\n      if (cursorIdleTimer) clearTimeout(cursorIdleTimer);\n    };',
              '      if (playbackControlsTimer) clearTimeout(playbackControlsTimer);\n      if (cursorIdleTimer) clearTimeout(cursorIdleTimer);\n      if (fitModeFeedbackTimer) clearTimeout(fitModeFeedbackTimer);\n    };'
          )

          replace(
              'frontend/src/lib/state/viewerSessionPreferences.test.ts',
              "  it('ignores malformed, stale, and invalid saved values', () => {",
              "  it('migrates the legacy screen fit preference to fit_window', () => {\n    const storage = memoryStorage(JSON.stringify({ version: 1, fitMode: 'screen' }));\n    expect(readViewerSessionPreferences(defaults, storage).fitMode).toBe('fit_window');\n  });\n\n  it('ignores malformed, stale, and invalid saved values', () => {"
          )

          p = Path('docs/CONFIG.md')
          text = p.read_text()
          table_anchor = '| `ui.grid_size` | `180` | Minimum media-grid cell width in pixels. Must be between `64` and `1024`. The grid remains fluid: cells expand to fill each row rather than becoming fixed-width. |\n'
          if '`ui.viewer_fit_mode` |' not in text:
              if table_anchor not in text:
                  raise SystemExit('missing ui grid_size table anchor')
              text = text.replace(
                  table_anchor,
                  table_anchor + '| `ui.viewer_fit_mode` | `fit_window` | Default viewer scaling policy: `fit_window` fills the available viewer bounds, `fit_down_only` never enlarges smaller media, and `original_size_if_fit` keeps media at 1:1 when it fits and otherwise scales down. The viewer can cycle these policies for the current browser session with `V`. |\n',
                  1
              )
          trailing = '\n### Viewer fit mode\n\n`ui.viewer_fit_mode` controls the viewer default: `fit_window` (current contain behavior), `fit_down_only` (never upscale), or `original_size_if_fit` (use 1:1 when it fits, otherwise scale down). Press `V` in the viewer to cycle the configured fit policies for the current browser session.\n'
          text = text.replace(trailing, '\n')
          p.write_text(text)

          Path('frontend/tests/viewer-fit-mode.spec.ts').write_text(r'''import { expect, test, type Page } from '@playwright/test';

const session = {
  user: { id: 'usr_fit', username: 'fit-user', role: 'admin' },
  capabilities: { upload: true, tag: true, delete: true, admin: true },
  csrf_token: 'csrf-fit'
};

async function openTinyAnimatedViewer(page: Page) {
  let loggedIn = false;
  const file = {
    id: 'tiny-gif',
    content_id: 'hash-tiny-gif',
    name: 'tiny.gif',
    safe_display_path: 'library/tiny.gif',
    size: 1024,
    added_at: '2026-09-01T00:00:00Z',
    modified_time: '2026-09-01T00:00:00Z',
    media_type: 'image/gif',
    media_kind: 'gif',
    metadata: { image_width: 320, image_height: 200 },
    tags: [],
    can_delete: true,
    media_urls: {
      thumbnail: '/api/v1/files/tiny-gif/thumbnail',
      preview: '/api/v1/files/tiny-gif/preview',
      content: '/api/v1/files/tiny-gif/content',
      download: '/api/v1/files/tiny-gif/download'
    }
  };

  await page.route('**/api/v1/auth/me', async (route) => route.fulfill({
    status: loggedIn ? 200 : 401,
    contentType: 'application/json',
    body: JSON.stringify(loggedIn ? session : { error: { code: 'unauthorized', message: 'login required' } })
  }));
  await page.route('**/api/v1/auth/login', async (route) => {
    loggedIn = true;
    await route.fulfill({ contentType: 'application/json', body: JSON.stringify(session) });
  });
  await page.route('**/api/v1/ui-config', async (route) => route.fulfill({
    contentType: 'application/json',
    body: JSON.stringify({ viewer_fit_mode: 'original_size_if_fit' })
  }));
  await page.route('**/api/v1/jobs', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/saved-searches', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/upload-targets', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/tags?**', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ tags: [] }) }));
  await page.route('**/api/v1/search/suggestions?**', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/files?**', async (route) => route.fulfill({
    contentType: 'application/json',
    body: JSON.stringify({ files: [file], total_count: 1, library_count: 1, facets: { kind: [] } })
  }));
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><rect width="320" height="200"/></svg>';
  for (const endpoint of ['thumbnail', 'preview', 'content']) {
    await page.route(`**/api/v1/files/tiny-gif/${endpoint}`, async (route) => route.fulfill({ contentType: 'image/svg+xml', body: svg }));
  }

  await page.goto('/');
  await page.getByLabel('Username').fill('fit-user');
  await page.getByLabel('Password').fill('correct horse');
  await page.getByRole('button', { name: 'Sign in' }).click();
  await expect(page.getByRole('heading', { name: 'Library' })).toBeVisible();
  await page.getByRole('button', { name: 'Preview tiny.gif' }).click();
  const stage = page.locator('.viewer-stage');
  const image = page.locator('img.viewer-visual-media');
  await expect(image).toBeVisible();
  await stage.focus();
  return { stage, image };
}

test('configured non-upscaling default and V cycling apply to animated image viewer content', async ({ page }) => {
  const { image } = await openTinyAnimatedViewer(page);

  await expect.poll(async () => (await image.boundingBox())?.width ?? 0).toBeGreaterThan(318);
  const configured = await image.boundingBox();
  expect(configured).not.toBeNull();
  expect(configured!.width).toBeLessThan(322);

  await page.keyboard.press('1');
  await expect(page.getByRole('status')).toContainText('Fit window');
  await expect.poll(async () => (await image.boundingBox())?.width ?? 0).toBeGreaterThan(500);

  await page.keyboard.press('v');
  await expect(page.getByRole('status')).toContainText('Fit down only');
  await expect.poll(async () => (await image.boundingBox())?.width ?? 0).toBeLessThan(322);

  await page.keyboard.press('v');
  await expect(page.getByRole('status')).toContainText('Original size if it fits');
  await expect.poll(async () => (await image.boundingBox())?.width ?? 0).toBeLessThan(322);
});
''')

          Path('.github/workflows/maintainer-251-validate.yml').unlink()
          PY
          git config user.name "Gooru Maintainer"
          git config user.email "maintainer@users.noreply.github.com"
          git add -A
          git commit -m "test(webui): cover viewer fit mode interaction"
          git push origin HEAD:feat/251-viewer-fit-modes
      - name: Go tests
        run: go test ./...
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Focused Chromium regression
        working-directory: frontend
        shell: bash
        run: |
          chromium="${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)}"
          if [ -z "$chromium" ]; then
            echo 'No Chromium executable available on runner' >&2
            exit 1
          fi
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$chromium" npx playwright test tests/viewer-fit-mode.spec.ts --project=chromium
