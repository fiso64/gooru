name: Temporary query namespace cardinality validation

on:
  push:
    branches:
      - perf/333-query-namespace-cardinality

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/333-query-namespace-cardinality
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply planner call-site patch
        shell: bash
        run: |
          set -euxo pipefail
          sed -i '/parsedTags := query.ToParsedTags(userTags)/d' gooru/query.go
          sed -i 's/parsedTags := query.ToParsedTags(query.ExtractTags(ast))/userTags := query.ExtractTags(ast)/' gooru/query.go
          sed -i 's/c.store.BatchGetTagCounts(parsedTags)/c.store.BatchGetQueryTagCounts(userTags)/g' gooru/query.go
          test "$(grep -c 'BatchGetQueryTagCounts(userTags)' gooru/query.go)" -eq 2
          gofmt -w gooru/query.go internal/database/query_tag_counts.go internal/database/query_tag_counts_test.go
      - name: Validate
        shell: bash
        run: |
          set -euxo pipefail
          go test ./internal/database ./internal/query ./gooru -count=1
          go test ./internal/serve -count=1
      - name: Commit validated change and remove temporary machinery
        shell: bash
        run: |
          rm .github/workflows/tmp-query-namespace-cardinality.yml .github/tmp_patch_query_namespace.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'perf(query): use namespace summaries for planner counts'
          git push origin HEAD:perf/333-query-namespace-cardinality
