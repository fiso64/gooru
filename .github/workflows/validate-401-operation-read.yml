name: Maintainer operation read validation

on:
  push:
    branches:
      - refactor/401-background-operation-read

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(gooru/background_read.go gooru/background_read_test.go gooru/database_boundary.go internal/database/durable_work_read.go)
          test -z "$(gofmt -l "${files[@]}")"
      - name: Focused tests
        run: go test -count=1 ./gooru ./internal/database
      - name: Full tests
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...
