name: Ignore moderator timestamps in maintainer

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Ignore moderator timestamps in maintainer'
    runs-on: gooru-moderator
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Patch maintainer prompt
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          path='.github/maintainer-prompt.md'
          sha="$(gh api "repos/${repo}/contents/${path}?ref=develop" --jq '.sha')"
          content="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${repo}/contents/${path}?ref=develop")"

          old='A moderator state is fresh when its `Last index update` timestamp is no more than 30 minutes old. `Last full reconcile` is diagnostic and advances only on full passes. If the state is missing, malformed, identity/marker-invalid, or older than 30 minutes, fetch `.github/maintainer-exhaustive-fallback.md` from `develop` fresh, read that entire file, and execute its fallback procedure for this run. If moderator failure persists, treat it as a maintenance-system defect and repair the workflow minimally when safe.'
          new='Moderator timestamps are diagnostic only and do not determine whether the index is usable. If the state is missing, malformed, or identity/marker-invalid, fetch `.github/maintainer-exhaustive-fallback.md` from `develop` fresh, read that entire file, and execute its fallback procedure for this run. If moderator failure persists, treat it as a maintenance-system defect and repair the workflow minimally when safe.'
          [[ "$content" == *"$old"* ]]
          content="${content/"$old"/"$new"}"

          old='- when moderator state is fresh, use its open issue/PR inventory and labels to resolve priority.'
          new='- use the moderator state open issue/PR inventory and labels to resolve priority.'
          [[ "$content" == *"$old"* ]]
          content="${content/"$old"/"$new"}"

          encoded="$(printf '%s' "$content" | base64 | tr -d '\n')"
          gh api --method PUT "repos/${repo}/contents/${path}" \
            -f message='Ignore moderator timestamps for maintainer discovery' \
            -f content="$encoded" \
            -f sha="$sha" \
            -f branch=develop >/dev/null
