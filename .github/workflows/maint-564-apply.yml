name: Maintainer 564 drag-to-pan

on:
  push:
    branches:
      - maint/564-drag-to-pan
    paths:
      - .github/workflows/maint-564-apply.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/564-drag-to-pan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reapply implementation from prior verifier
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          source = subprocess.check_output(['git', 'show', 'HEAD^:.github/workflows/maint-564-apply.yml'], text=True)
          block = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/maint-564-patch.py').write_text(script)
          PY
          python3 /tmp/maint-564-patch.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Static checks
        working-directory: frontend
        run: npm run check
      - name: Focused zoom/pan browser regressions
        working-directory: frontend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('playwright.config.ts')
          text = p.read_text().replace('127.0.0.1:4173', '127.0.0.1:43170')
          text = text.replace("npm run preview -- --host 127.0.0.1'", "npm run preview -- --host 127.0.0.1 --port 43170'")
          p.write_text(text)
          PY
          npx playwright install chromium
          npx playwright test viewer-zoom-pan.spec.ts --grep "touchpad-sized zoom|ctrl-wheel zooms toward|dragging a zoomed image" --reporter=line
          git checkout -- playwright.config.ts
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/workflows/maint-564-apply.yml
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(viewer): drag zoomed images to pan (#564)'
          git push origin HEAD:maint/564-drag-to-pan