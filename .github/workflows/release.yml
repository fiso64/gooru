name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate tag and canonical version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - name: Test Go
        run: go test -count=1 ./...
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          npm run build
      - name: Validate Nix package
        run: nix build .#packages.x86_64-linux.default --print-build-logs
      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-X=gooru.local/internal/buildinfo.Version=$version -X=gooru.local/internal/buildinfo.Revision=$GITHUB_SHA -X=gooru.local/internal/buildinfo.Dirty=false" \
            -o dist/gooru-linux-amd64 ./cmd/gooru
          dist/gooru-linux-amd64 version
          tar -C dist -czf "dist/gooru_${version}_linux_amd64.tar.gz" gooru-linux-amd64
          sha256sum "dist/gooru_${version}_linux_amd64.tar.gz" > "dist/gooru_${version}_linux_amd64.tar.gz.sha256"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\n' < VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/gooru_${version}_linux_amd64.tar.gz" \
            "dist/gooru_${version}_linux_amd64.tar.gz.sha256" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
