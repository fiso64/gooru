name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate tag and canonical version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - name: Test Go
        run: go test -count=1 ./...
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          npm run build
      - name: Browser regressions
        working-directory: frontend
        run: |
          npx playwright install chromium
          npm run test:e2e -- startup-query-churn.spec.ts upload-metadata-refresh.spec.ts upload-concurrency.spec.ts upload-cancel-inflight.spec.ts hover-media-preview.spec.ts saved-search-completions.spec.ts jobs-layout.spec.ts jobs-pagination.spec.ts jobs-history-controls.spec.ts issue-606-followup.spec.ts build-identity.spec.ts
      - name: Validate Nix package
        run: nix build .#packages.x86_64-linux.default --print-build-logs
      - name: Build all three portable release archives
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 windows/amd64; do
            IFS=/ read -r os arch <<< "$target"
            bash scripts/build-portable.sh "$os" "$arch"
          done
          for artifact in dist/*.tar.gz dist/*.zip; do
            sha256sum -c "$artifact.sha256"
          done
      - name: Render versioned release notes
        run: node scripts/release-notes.mjs > dist/release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\n' < VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/gooru_${version}_linux_amd64.tar.gz" \
            "dist/gooru_${version}_linux_amd64.tar.gz.sha256" \
            --verify-tag --notes-file dist/release-notes.md --title "$GITHUB_REF_NAME"
