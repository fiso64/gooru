name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate tag, version and release notes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          node scripts/release-notes.mjs > /dev/null
      - name: Test Go
        run: go test -count=1 ./...
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          npm run build
      - name: Browser regressions
        working-directory: frontend
        run: |
          npx playwright install chromium
          npm run test:e2e -- startup-query-churn.spec.ts upload-metadata-refresh.spec.ts upload-concurrency.spec.ts upload-cancel-inflight.spec.ts hover-media-preview.spec.ts saved-search-completions.spec.ts jobs-layout.spec.ts jobs-pagination.spec.ts jobs-history-controls.spec.ts issue-606-followup.spec.ts build-identity.spec.ts
      - name: Validate Nix package
        run: nix build .#packages.x86_64-linux.default --print-build-logs
      - name: Build all three portable release archives
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 windows/amd64; do
            IFS=/ read -r os arch <<< "$target"
            bash scripts/build-portable.sh "$os" "$arch"
          done
          for artifact in dist/*.tar.gz dist/*.zip; do
            sha256sum -c "$artifact.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-portable
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  deb:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native package build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev pkg-config dpkg-dev
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit
          npm run build
      - name: Build and validate native Debian package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-deb.sh
          version="$(tr -d '\n' < VERSION)"
          artifact="dist/gooru_$(printf '%s' "$version")_linux_${{ matrix.arch }}.deb"
          test "$(dpkg-deb -f "$artifact" Architecture)" = "${{ matrix.arch }}"
          dpkg-deb -f "$artifact" Depends | grep -F libvips
          sha256sum -c "$artifact.sha256"
          dpkg-deb -c "$artifact" | grep -F '/usr/share/gooru/frontend/index.html'
          dpkg-deb -c "$artifact" | grep -F '/lib/systemd/system/gooru@.service'
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          dpkg-deb -x "$artifact" "$stage"
          ldd "$stage/usr/bin/gooru" | grep -F libvips.so
          "$stage/usr/bin/gooru" version
          "$stage/usr/bin/gooru" --database "$stage/test.db" init --hashing-strategy partial
          printf 'server:\n  frontend_dir: %s/usr/share/gooru/frontend\n' "$stage" > "$stage/serve.yaml"
          (
            cd "$stage"
            ./usr/bin/gooru --database "$stage/test.db" --config "$stage/serve.yaml" serve --listen 127.0.0.1:45736 >"$stage/serve.log" 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
            ready=0
            for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:45736/ >"$stage/index.html" 2>/dev/null; then ready=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.5
            done
            if (( ready == 0 )); then cat "$stage/serve.log"; exit 1; fi
            grep -Eiq '<!doctype html|<html' "$stage/index.html"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: release-deb-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 7

  nix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: [self-hosted, gooru]
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix on native arm64
        if: matrix.system == 'aarch64-linux'
        uses: cachix/install-nix-action@v31
      - name: Resolve Cachix CLI from pinned nixpkgs
        if: github.event_name != 'pull_request'
        id: cachix-cli
        shell: bash
        run: |
          set -euo pipefail
          client="$(nix build --impure --no-link --print-out-paths --expr 'let flake = builtins.getFlake (toString ./.); in flake.inputs.nixpkgs.legacyPackages.${{ matrix.system }}.cachix')"
          test -x "$client/bin/cachix"
          echo "bin=$client/bin/cachix" >> "$GITHUB_OUTPUT"
          echo "$client/bin" >> "$GITHUB_PATH"
      - name: Configure Cachix publication for release tags
        if: github.event_name != 'pull_request'
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachixBin: ${{ steps.cachix-cli.outputs.bin }}
          skipPush: true
          skipAddingSubstituter: true
      - name: Build native Nix package and module check
        run: |
          nix build .#packages.${{ matrix.system }}.default --out-link result --print-build-logs
          nix build .#checks.${{ matrix.system }}.nixos-module --no-link --print-build-logs
      - name: Publish native package and runtime closure to Cachix
        if: github.event_name != 'pull_request'
        env:
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CACHIX_CACHE_NAME"
          test -n "$CACHIX_AUTH_TOKEN"
          cachix push "$CACHIX_CACHE_NAME" "$(readlink -f result)"

  assemble:
    needs: [portable, deb, nix]
    runs-on: [self-hosted, gooru]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-portable
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: release-deb-*
          merge-multiple: true
          path: dist
      - name: Verify complete five-package release
        run: bash scripts/verify-release-assets.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Render release notes
        run: node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
      - name: Publish verified packages and checksums as GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\n' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$GITHUB_REF_NAME"
