name: Temporary 333 comic kind repair
on:
  push:
    branches: [perf/333-comic-kind-facet]
    paths: ['.github/workflows/tmp-333-comic-kind-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/333-comic-kind-facet
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Repair CBZ classification
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('internal/serve/browse.go')
          s = p.read_text()
          old = '''func mediaKindForType(mediaType string) string {
\tswitch {
\tcase mediaType == "image/gif":'''
          new = '''func mediaKindForType(mediaType string) string {
\tswitch {
\tcase strings.EqualFold(strings.TrimSpace(strings.SplitN(mediaType, ";", 2)[0]), "application/vnd.comicbook+zip"):
\t\treturn "comic"
\tcase mediaType == "image/gif":'''
          if old not in s:
              raise SystemExit('mediaKindForType snippet not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('internal/database/migrations/019_comic_kind_summary.up.sql')
          s = p.read_text()
          marker = '''DROP TRIGGER IF EXISTS kind_counts_metadata_delete;

DELETE FROM kind_counts;'''
          replacement = '''DROP TRIGGER IF EXISTS kind_counts_metadata_delete;

-- Older CBZ imports were classified from their application/* MIME as `other`.
-- Normalize those persisted rows before rebuilding the aggregate so the
-- existing metadata-first kind semantics remain consistent with CBZ fallback.
UPDATE media_metadata
SET media_kind = 'comic'
WHERE location_id IN (
    SELECT id FROM locations WHERE lower(extension) = '.cbz'
)
  AND media_kind <> 'comic';

DELETE FROM kind_counts;'''
          if marker not in s:
              raise SystemExit('migration insertion point not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY
          gofmt -w internal/serve/browse.go
          git diff --check
      - name: Add focused regressions
        shell: bash
        run: |
          cat > internal/serve/comic_kind_test.go <<'EOF'
          package serve

          import "testing"

          func TestMediaKindForComicBookZip(t *testing.T) {
              for _, mediaType := range []string{
                  "application/vnd.comicbook+zip",
                  "application/vnd.comicbook+zip; charset=binary",
              } {
                  if got := mediaKindForType(mediaType); got != "comic" {
                      t.Fatalf("mediaKindForType(%q) = %q, want comic", mediaType, got)
                  }
              }
          }
          EOF
          gofmt -w internal/serve/comic_kind_test.go
      - name: Validate focused packages
        run: go test ./internal/database ./internal/query ./internal/serve ./gooru/...
      - name: Commit durable repair
        shell: bash
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/serve/browse.go internal/serve/comic_kind_test.go internal/database/migrations/019_comic_kind_summary.up.sql
          git diff --cached --check
          git commit -m 'fix: classify CBZ metadata as comic'
          git push origin HEAD:perf/333-comic-kind-facet
