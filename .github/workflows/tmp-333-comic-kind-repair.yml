name: Temporary 333 comic kind repair
on:
  push:
    branches: [perf/333-comic-kind-facet]
    paths: ['.github/workflows/tmp-333-comic-kind-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/333-comic-kind-facet
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Repair CBZ classification
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("internal/serve/browse.go"); s=p.read_text(); old="func mediaKindForType(mediaType string) string {\n\tswitch {\n\tcase mediaType == \"image/gif\":"; new="func mediaKindForType(mediaType string) string {\n\tswitch {\n\tcase strings.EqualFold(strings.TrimSpace(strings.SplitN(mediaType, \";\", 2)[0]), \"application/vnd.comicbook+zip\"):\n\t\treturn \"comic\"\n\tcase mediaType == \"image/gif\":"; assert old in s; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("internal/database/migrations/019_comic_kind_summary.up.sql"); s=p.read_text(); old="DROP TRIGGER IF EXISTS kind_counts_metadata_delete;\n\nDELETE FROM kind_counts;"; new="DROP TRIGGER IF EXISTS kind_counts_metadata_delete;\n\n-- Older CBZ imports were classified from their application/* MIME as other.\n-- Normalize persisted rows before rebuilding the aggregate.\nUPDATE media_metadata SET media_kind = '\''comic'\'' WHERE location_id IN (SELECT id FROM locations WHERE lower(extension) = '\''.cbz'\'') AND media_kind <> '\''comic'\'';\n\nDELETE FROM kind_counts;"; assert old in s; p.write_text(s.replace(old,new,1))'
          gofmt -w internal/serve/browse.go
          cat > internal/serve/comic_kind_test.go <<'EOF'
          package serve

          import "testing"

          func TestMediaKindForComicBookZip(t *testing.T) {
          	for _, mediaType := range []string{"application/vnd.comicbook+zip", "application/vnd.comicbook+zip; charset=binary"} {
          		if got := mediaKindForType(mediaType); got != "comic" {
          			t.Fatalf("mediaKindForType(%q) = %q, want comic", mediaType, got)
          		}
          	}
          }
          EOF
          gofmt -w internal/serve/comic_kind_test.go
          git diff --check
      - name: Validate focused packages
        run: go test ./internal/database ./internal/query ./internal/serve ./gooru/...
      - name: Commit durable repair
        shell: bash
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/serve/browse.go internal/serve/comic_kind_test.go internal/database/migrations/019_comic_kind_summary.up.sql
          git diff --cached --check
          git commit -m 'fix: classify CBZ metadata as comic'
          git push origin HEAD:perf/333-comic-kind-facet
