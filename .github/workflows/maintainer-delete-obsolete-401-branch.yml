name: Maintainer delete obsolete 401 branch

on:
  push:
    branches:
      - maintainer/401-remove-legacy-jobs

permissions:
  contents: write

jobs:
  delete-obsolete-branch:
    runs-on: [self-hosted, gooru]
    steps:
      - name: Delete superseded branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/maintainer%2F401-durable-upload-http"
