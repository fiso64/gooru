name: Temporary #264 OpenAPI generation

on:
  push:
    branches:
      - feat/264-saved-search-order
    paths:
      - '.github/workflows/tmp-264-openapi.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/264-saved-search-order
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate API types
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
      - name: Commit generated client
        run: |
          if git diff --quiet -- frontend/src/lib/api/openapi.ts; then
            echo 'Generated OpenAPI client already matches canonical schema.'
            exit 0
          fi
          git config user.name 'Gooru Maintainer'
          git config user.email 'maintainer@users.noreply.github.com'
          git add frontend/src/lib/api/openapi.ts
          git commit -m 'chore: regenerate OpenAPI client for saved-search reorder'
          git push origin HEAD:feat/264-saved-search-order
