name: Temporary #264 client finalization

on:
  push:
    branches:
      - feat/264-saved-search-order
    paths:
      - '.github/workflows/tmp-264-openapi.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/264-saved-search-order
      - name: Switch reorder client to generated route and self-remove
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/api/client.ts')
          text = path.read_text()
          old = '''  async reorderSavedSearches(ids: string[]): Promise<void> {\n    const response = await generatedFetch(`${absoluteBaseURL(this.baseURL)}/saved-searches/reorder`, {\n      method: 'PUT',\n      credentials: 'same-origin',\n      headers: {\n        'Content-Type': 'application/json',\n        ...this.csrfHeaderParam('PUT')\n      },\n      body: JSON.stringify({ ids })\n    });\n    if (!response.ok) {\n      let payload: ApiErrorResponse | undefined;\n      try {\n        payload = (await response.json()) as ApiErrorResponse;\n      } catch {\n        payload = undefined;\n      }\n      const apiError = new ApiError(\n        response.status,\n        payload?.error.code ?? 'http_error',\n        payload?.error.message ?? `Request failed with HTTP ${response.status}`\n      );\n      if (response.status === 401) unauthorizedHandler?.();\n      throw apiError;\n    }\n  }\n'''
          new = '''  async reorderSavedSearches(ids: string[]): Promise<void> {\n    await this.unwrap(\n      this.client.PUT('/saved-searches/reorder', { params: { header: this.csrfHeaderParam('PUT') }, body: { ids } })\n    );\n  }\n'''
          if old not in text:
              raise SystemExit('expected raw reorder client block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/tmp-264-openapi.yml
          git config user.name 'Gooru Maintainer'
          git config user.email 'maintainer@users.noreply.github.com'
          git add frontend/src/lib/api/client.ts .github/workflows/tmp-264-openapi.yml
          git commit -m 'refactor: use generated saved-search reorder route'
          git push origin HEAD:feat/264-saved-search-order
