name: Finalize 311 URL state

on:
  push:
    branches:
      - fix/311-pagination-overflow

permissions:
  contents: write

jobs:
  finalize:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/311-pagination-overflow
          fetch-depth: 0
      - name: Preserve restored page across session initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/state/libraryWorkflow.svelte.ts')
          s = p.read_text()
          old = "    activeFile = null;\n    resetPage();\n    clearViewerPreloadCache();\n"
          new = "    activeFile = null;\n    clearViewerPreloadCache();\n"
          if s.count(old) != 1:
            raise SystemExit(f'expected one reset block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit finalized source and remove one-shot workflow
        run: |
          git rm .github/workflows/finalize-311-url-state.yml
          git add frontend/src/lib/state/libraryWorkflow.svelte.ts
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): preserve restored paged URL state"
          git push origin HEAD:fix/311-pagination-overflow
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go validation
        run: go test ./... && go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend validation
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit && npm run check && npm run test:unit && npm run build
      - name: Focused browser validation
        working-directory: frontend
        run: npm run test:e2e -- tests/paged-library.spec.ts tests/upload-large-batch.spec.ts --project=chromium
