name: Community CI

# Keep the workflow definition on the trusted base branch while executing
# untrusted community PR code only on GitHub-hosted runners.
on:
  pull_request_target:
    branches:
      - develop

permissions: {}

concurrency:
  group: community-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go:
    name: Community Go
    if: github.event.pull_request.user.login != 'fiso64' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout untrusted PR head without credentials
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$HEAD_REPO"
          git fetch --depth=1 origin "$HEAD_SHA"
          git checkout --detach FETCH_HEAD

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        env:
          GOTOOLCHAIN: local
        run: go test -count=1 ./...

      - name: Build
        env:
          GOTOOLCHAIN: local
        run: go build ./...

  frontend:
    name: Community Frontend
    if: github.event.pull_request.user.login != 'fiso64' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout untrusted PR head without credentials
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$HEAD_REPO"
          git fetch --depth=1 origin "$HEAD_SHA"
          git checkout --detach FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Verify generated API client
        run: |
          npm run generate:api
          git diff --exit-code -- src/lib/api/openapi.ts

      - name: Check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Verify built CSP
        run: node tests/verify-build-csp.mjs

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser regressions
        run: GOORU_E2E_PREBUILT=1 npm run test:e2e -- --max-failures=3 --workers=3

