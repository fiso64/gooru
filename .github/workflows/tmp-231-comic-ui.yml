name: tmp-231-comic-ui

on:
  push:
    branches:
      - feat/231-comic-ui

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright test tests/comic-ui.spec.ts tests/viewer-shortcuts.spec.ts --project=chromium
