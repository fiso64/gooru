name: Temporary Go vet/race audit

on:
  push:
    branches:
      - maintainer/549-go-vet-race-audit
    paths:
      - .github/workflows/temporary-go-vet-race-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run go vet
        shell: bash
        run: |
          set -euo pipefail
          go vet -structtag=false ./...

      - name: Run race-enabled Go tests and persist diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .github/maintainer-artifacts
          set +e
          go test -race ./... -count=1 2>&1 | tee .github/maintainer-artifacts/549-race-audit.log
          status=${PIPESTATUS[0]}
          set -e
          git config user.name 'fiso64'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git add .github/maintainer-artifacts/549-race-audit.log
          git rm .github/workflows/temporary-go-vet-race-audit.yml
          git commit -m 'chore: persist Go race audit diagnostics'
          git push origin HEAD:maintainer/549-go-vet-race-audit
          exit "$status"
