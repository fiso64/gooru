name: maintainer upload analysis path

on:
  push:
    branches:
      - refactor/28-upload-analysis-path

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply upload analysis-path refactor
        run: |
          python3 .github/maintainer_upload_analysis_path.py
          gofmt -w internal/serve/uploads.go internal/serve/upload_analysis_path_test.go
      - name: Validate Go
        run: |
          go build ./...
          go test ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:unit
          npm run check
          npm run build
      - name: Commit validated production changes
        run: |
          rm .github/workflows/maintainer-upload-analysis-path.yml .github/maintainer_upload_analysis_path.py
          git config user.name "Gooru autonomous maintainer"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git add -A
          git commit -m "refactor(upload): separate analysis from storage path"
          git push origin HEAD:refactor/28-upload-analysis-path
