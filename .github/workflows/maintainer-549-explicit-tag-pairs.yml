name: Maintainer 549 explicit tag pair validation

on:
  push:
    branches:
      - "maintainer/549-bound-explicit-tag-pairs"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply caller patch
        run: |
          python3 .github/maintainer-549-explicit-tag-pairs.py
          gofmt -w gooru/tagging.go internal/database/content_tag_cartesian.go internal/database/content_tag_cartesian_test.go
      - name: Validate
        run: |
          go test ./internal/database -run 'TestBatch(Associate|Disassociate)TagsForContentHashes' -count=1
          go test ./internal/database -count=1
          go test ./gooru -count=1
          go vet -structtag=false ./internal/database ./gooru
      - name: Commit validated implementation
        if: success()
        run: |
          rm .github/workflows/maintainer-549-explicit-tag-pairs.yml .github/maintainer-549-explicit-tag-pairs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gooru/tagging.go internal/database/content_tag_cartesian.go internal/database/content_tag_cartesian_test.go .github/workflows/maintainer-549-explicit-tag-pairs.yml .github/maintainer-549-explicit-tag-pairs.py
          git commit -m "perf: bound explicit tag pair batches"
          git push origin HEAD:maintainer/549-bound-explicit-tag-pairs
