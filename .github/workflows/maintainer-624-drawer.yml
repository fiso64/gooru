name: Maintainer 624 drawer completion

on:
  push:
    branches:
      - maintainer/624-jobs-api-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/624-jobs-api-ui
          fetch-depth: 0
      - name: Apply and validate drawer completion
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/maintainer-624-drawer.py
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          npx playwright install chromium
          npm run test:e2e -- jobs-pagination.spec.ts
          cd ..
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/components/AppShell.svelte frontend/src/lib/components/JobsDrawer.svelte frontend/tests/jobs-pagination.spec.ts
          git diff --cached --check
          git commit -m 'Add Jobs drawer view-all navigation'
          git push origin HEAD:maintainer/624-jobs-api-ui
