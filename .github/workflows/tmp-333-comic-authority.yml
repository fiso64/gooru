name: Temporary 333 comic authority repair

on:
  push:
    branches: [perf/333-comic-kind-facet]
    paths:
      - .github/workflows/tmp-333-comic-authority.yml
      - .github/scripts/tmp_333_comic_authority.py
      - .github/scripts/tmp_333_comic_path.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/333-comic-kind-facet
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply repair
        run: |
          python3 .github/scripts/tmp_333_comic_authority.py
          python3 .github/scripts/tmp_333_comic_path.py
      - name: Format and inspect
        run: |
          gofmt -w internal/serve/browse.go internal/serve/comic_kind_test.go internal/database/database.go internal/database/kind_counts_test.go internal/query/sqlbuilder.go
          git diff --check
      - name: Commit repair
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/serve/browse.go internal/serve/comic_kind_test.go internal/database/database.go internal/database/kind_counts_test.go internal/database/migrations/019_comic_kind_summary.up.sql internal/query/sqlbuilder.go
          git diff --cached --check
          git commit -m 'fix: keep CBZ kind authoritative'
          git push origin HEAD:perf/333-comic-kind-facet
      - name: Narrow database regression
        run: go test ./internal/database -run TestKindCountsMigrationBackfillsAndTracksMutations -count=1 -v
      - name: Focused Go validation
        run: go test ./internal/database ./internal/query ./internal/serve ./gooru/...
