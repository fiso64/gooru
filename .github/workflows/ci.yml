name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner Go and caches
        shell: bash
        run: |
          go version
          gocache="$(go env GOCACHE)"
          gomodcache="$(go env GOMODCACHE)"
          printf 'GOCACHE=%s\n' "$gocache"
          printf 'GOMODCACHE=%s\n' "$gomodcache"
          test -d "$gocache" && test -w "$gocache"
          test -d "$gomodcache" && test -w "$gomodcache"
      - name: Test
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Verify generated API client
        run: |
          npm run generate:api
          git diff --exit-code -- src/lib/api/openapi.ts
      - name: Check
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Browser regressions
        id: browser
        run: npm run test:e2e -- booru-theme.spec.ts booru-search-feedback.spec.ts viewer-image-geometry-hold.spec.ts viewer-seekbar-scrub.spec.ts startup-query-churn.spec.ts upload-metadata-refresh.spec.ts upload-concurrency.spec.ts upload-bulk-tags.spec.ts upload-cancel-inflight.spec.ts upload-viewer.spec.ts hover-media-preview.spec.ts saved-search-completions.spec.ts jobs-layout.spec.ts jobs-pagination.spec.ts jobs-polling.spec.ts jobs-history-controls.spec.ts issue-606-followup.spec.ts build-identity.spec.ts grid-layout-config.spec.ts grid-keyboard-cursor.spec.ts selection-root-query.spec.ts tag-grid-refresh.spec.ts
      - name: Upload browser failure artifacts
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build
        run: npm run build
      - name: Verify built CSP
        run: node tests/verify-build-csp.mjs
      - name: Root selection through Go server
        working-directory: ${{ github.workspace }}
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          go build -o "$tmp/gooru" ./cmd/gooru
          "$tmp/gooru" --database "$tmp/gooru.db" init --hashing-strategy partial
          "$tmp/gooru" --database "$tmp/gooru.db" serve --listen 127.0.0.1:4174 >"$tmp/server.log" 2>&1 &
          server_pid=$!

          ready=0
          for _ in $(seq 1 60); do
            if node -e "fetch('http://127.0.0.1:4174/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if (( ready == 0 )); then
            cat "$tmp/server.log"
            exit 1
          fi

          if ! (
            cd frontend
            GOORU_E2E_BASE_URL=http://127.0.0.1:4174 npx playwright test selection-root-query.spec.ts
          ); then
            cat "$tmp/server.log"
            exit 1
          fi
