name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - perf/28-protected-runtime-profile

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Protected source benchmarks
        if: github.ref == 'refs/heads/perf/28-protected-runtime-profile'
        run: go test ./internal/encryptedfile ./internal/filesource -run '^$' -bench 'EncryptedFile|ProtectedSource' -benchmem -benchtime=1s -count=3

  frontend:
    if: github.ref != 'refs/heads/perf/28-protected-runtime-profile'
    name: Frontend
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Check
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Browser regressions
        run: npm run test:e2e -- startup-query-churn.spec.ts upload-metadata-refresh.spec.ts upload-concurrency.spec.ts hover-media-preview.spec.ts
      - name: Build
        run: npm run build
