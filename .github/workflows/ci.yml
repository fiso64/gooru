name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner Go and caches
        shell: bash
        run: |
          go version
          gocache="$(go env GOCACHE)"
          gomodcache="$(go env GOMODCACHE)"
          printf 'GOCACHE=%s\n' "$gocache"
          printf 'GOMODCACHE=%s\n' "$gomodcache"
          test -d "$gocache" && test -w "$gocache"
          test -d "$gomodcache" && test -w "$gomodcache"
      - name: Test
        shell: bash
        run: |
          set +e
          go test -json -count=1 ./... > /tmp/go-test.json
          status=$?
          set -e
          python3 - <<'PY'
          import json

          tests = []
          packages = []
          failures = []
          outputs = []
          with open("/tmp/go-test.json", encoding="utf-8") as f:
              for line in f:
                  try:
                      rec = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  action = rec.get("Action")
                  elapsed = rec.get("Elapsed")
                  package = rec.get("Package", "")
                  test = rec.get("Test")
                  output = rec.get("Output")
                  if output:
                      outputs.append((package, test, output.rstrip("\n")))
                  if action == "pass" and elapsed is not None:
                      if test:
                          tests.append((float(elapsed), package, test))
                      elif package:
                          packages.append((float(elapsed), package))
                  elif action == "fail":
                      failures.append((package, test or "<package>"))

          print("Slowest packages:")
          for elapsed, package in sorted(packages, reverse=True):
              print(f"{elapsed:8.3f}s  {package}")

          print("\nSlowest tests/subtests:")
          for elapsed, package, test in sorted(tests, reverse=True)[:60]:
              print(f"{elapsed:8.3f}s  {package}  {test}")

          if failures:
              print("\nFailures:")
              for package, test in failures:
                  print(f"{package}  {test}")

              failing_packages = {package for package, _ in failures if package}
              print("\nFailure output:")
              for package, test, output in outputs:
                  if package in failing_packages:
                      where = package
                      if test:
                          where += f"  {test}"
                      print(f"[{where}] {output}")
          PY
          exit "$status"
      - name: Build
        run: go build ./...

  frontend:
    name: Frontend
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Check
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Browser regressions
        run: npm run test:e2e -- startup-query-churn.spec.ts upload-metadata-refresh.spec.ts upload-concurrency.spec.ts upload-cancel-inflight.spec.ts hover-media-preview.spec.ts saved-search-completions.spec.ts jobs-layout.spec.ts jobs-pagination.spec.ts jobs-history-controls.spec.ts issue-606-followup.spec.ts build-identity.spec.ts
      - name: Build
        run: npm run build
