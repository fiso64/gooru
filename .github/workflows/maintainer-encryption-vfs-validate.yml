name: Maintainer encryption VFS validation
on:
  push:
    branches:
      - feat/28-database-encryption-vfs
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Wire encrypted store lifecycle
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("internal/database/database.go"); s=p.read_text(); s=s.replace("\tlogger         *log.Logger\n}", "\tlogger         *log.Logger\n\tbackendClose   func() error\n}", 1); s=s.replace("dataSourceName + \"-shm\"}", "dataSourceName + \"-shm\", dataSourceName + \"-journal\"}", 1); s=s.replace("err := s.DB.Close()", "var err error\n\tif s.backendClose != nil {\n\t\terr = s.backendClose()\n\t} else {\n\t\terr = s.DB.Close()\n\t}", 1); p.write_text(s)'
          grep -q 'backendClose' internal/database/database.go
          grep -q -- '-journal' internal/database/database.go
          go get gosqlite.org/vfs/crypto@v0.14.0
          go mod tidy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/database/database.go go.mod go.sum
          git commit -m 'feat(database): wire encrypted store lifecycle'
          git push
      - name: Focused encryption tests
        run: go test ./internal/database -run 'Encrypted|MigratePlaintext' -count=1 -v
      - name: Go build
        run: go build ./...
      - name: Go tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend build
        working-directory: frontend
        run: npm run build
