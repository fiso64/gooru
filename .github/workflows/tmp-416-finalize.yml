name: Temporary #416 corrected validation

on:
  push:
    branches:
      - feat/416-bound-actual-size

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/416-bound-actual-size
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply reviewed implementation
        shell: bash
        run: |
          git show fc49899ce24d9ff3ff19ae0ca332eb402215941b:.github/workflows/tmp-416-implement.yml > /tmp/old-416.yml
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          text = Path('/tmp/old-416.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          Path('/tmp/implement-416.py').write_text(textwrap.dedent(text[start:end]))
          PY
          python3 /tmp/implement-416.py
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/components/ViewerStage.svelte')
          text = p.read_text()
          old = "  const minimumZoom = $derived(fitMode === 'actual' && !boundActualSizeToFit ? Math.min(1, fitGeometry.scale) : 1);\n  const panLimits"
          new = "  const minimumZoom = $derived(fitMode === 'actual' && !boundActualSizeToFit ? Math.min(1, fitGeometry.scale) : 1);\n  // Geometry carries the capped Actual-mode baseline. Scale the local ceiling inversely so\n  // manual zoom preserves the same absolute 32x ceiling and can always pass back through 1:1.\n  const maximumZoom = $derived(fitMode === 'actual' && boundActualSizeToFit && geometry.scale > 0 ? Math.max(32, 32 / geometry.scale) : 32);\n  const panLimits"
          if old not in text:
              raise SystemExit('missing #416 zoom-bound insertion anchor')
          text = text.replace(old, new, 1)
          old = "Math.max(minimumZoom, Math.min(32, zoom * Math.exp(-event.deltaY * 0.0075)))"
          new = "Math.max(minimumZoom, Math.min(maximumZoom, zoom * Math.exp(-event.deltaY * 0.0075)))"
          if old not in text:
              raise SystemExit('missing #416 wheel clamp anchor')
          p.write_text(text.replace(old, new, 1))

          # The historical temporary patch used a raw Python string for its appended E2E block,
          # so its escaped newlines were written literally. Normalize only that appended block.
          p = Path('frontend/tests/viewer-fit-mode.spec.ts')
          text = p.read_text()
          marker = r'\n\nasync function openOversizedActualViewer'
          if marker not in text:
              raise SystemExit('missing #416 generated E2E marker')
          prefix, suffix = text.split(marker, 1)
          p.write_text(prefix + '\n\nasync function openOversizedActualViewer' + suffix.replace(r'\n', '\n'))
          PY
      - name: Format and focused Go validation
        shell: bash
        run: |
          gofmt -w internal/serve/config.go internal/serve/ui_config.go internal/serve/ui_config_test.go
          go test ./internal/serve
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend type and Svelte checks
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ../frontend-check.log
      - name: Frontend unit tests
        if: success()
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm test -- --run 2>&1 | tee ../frontend-unit.log
      - name: Frontend build
        if: success()
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../frontend-build.log
      - name: Upload frontend validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-logs
          path: |
            frontend-check.log
            frontend-unit.log
            frontend-build.log
          if-no-files-found: ignore
      - name: Focused Chromium viewer regression
        working-directory: frontend
        shell: bash
        run: npx playwright test tests/viewer-fit-mode.spec.ts --project=chromium
      - name: Commit validated product changes
        shell: bash
        run: |
          git add internal/serve/config.go internal/serve/ui_config.go internal/serve/ui_config_test.go frontend/src/lib/stores/runtimeConfig.ts frontend/src/lib/components/AppPage.svelte frontend/src/lib/components/PreviewDialog.svelte frontend/src/lib/utils/viewer.ts frontend/src/lib/utils/viewer.test.ts frontend/src/lib/components/ViewerStage.svelte frontend/tests/viewer-fit-mode.spec.ts docs/CONFIG.md
          git diff --cached --check
          git config user.name 'chatgpt-codex-connector'
          git config user.email 'chatgpt-codex-connector@users.noreply.github.com'
          git commit -m 'feat(viewer): bound actual-size baseline by fit scale'
          git push origin HEAD:feat/416-bound-actual-size
