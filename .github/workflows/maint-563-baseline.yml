name: Maintainer 563 baseline

on:
  push:
    branches:
      - maint/563-minor-ui-improvements
    paths:
      - .github/workflows/maint-563-baseline.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Run matching develop browser baseline
        working-directory: frontend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('playwright.config.ts')
          text = p.read_text().replace('127.0.0.1:4173', '127.0.0.1:43165')
          text = text.replace("npm run preview -- --host 127.0.0.1'", "npm run preview -- --host 127.0.0.1 --port 43165'")
          p.write_text(text)
          PY
          npx playwright install chromium
          set +e
          npm run test:e2e -- grid-keyboard-cursor.spec.ts shortcut-focus.spec.ts tag-input-behavior.spec.ts paged-library.spec.ts font-style.spec.ts 2>&1 | tee ../maint-563-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          exit $status
      - name: Upload baseline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maint-563-baseline-diagnostics
          path: maint-563-baseline.log
          if-no-files-found: error
