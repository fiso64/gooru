name: Temporary PR 381 Test Build Repair

on:
  push:
    branches:
      - fix/349-selection-snapshots

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/349-selection-snapshots
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Repair and capture tests
        id: repairtest
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/serve/file_selections_test.go')
          text = p.read_text()
          if '"errors"' not in text:
              text = text.replace('"encoding/json"\n', '"encoding/json"\n\t"errors"\n', 1)
          text = text.replace('containsString(file.Tags, expression)', 'snapshotContainsString(file.Tags, expression)')
          text = text.replace('func containsString(values []string, wanted string) bool {', 'func snapshotContainsString(values []string, wanted string) bool {')
          p.write_text(text)
          PY
          "$(go env GOROOT)/bin/gofmt" -w internal/serve/file_selections_test.go
          go test ./internal/serve > /tmp/repair-test.log 2>&1
          status=$?
          git diff --check >> /tmp/repair-test.log 2>&1
          diff_status=$?
          cat /tmp/repair-test.log
          if [ "$status" -eq 0 ] && [ "$diff_status" -eq 0 ]; then final=0; else final=1; fi
          echo "status=$final" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr381-test-repair
          path: /tmp/repair-test.log
      - name: Commit repair
        if: steps.repairtest.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/serve/file_selections_test.go
          git diff --cached --quiet && exit 0
          git commit -m "test(selection): fix snapshot regression build"
          git push origin HEAD:fix/349-selection-snapshots
      - name: Preserve failure
        if: steps.repairtest.outputs.status != '0'
        run: exit 1
