name: Maintainer 401 surface scan

on:
  push:
    branches:
      - maintainer/401-remove-legacy-jobs

permissions:
  contents: read

jobs:
  scan:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Locate durable and legacy work surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DURABLE PRODUCERS / BULK PATTERNS ==='
          rg -n 'CreateBackgroundOperation|BackgroundOperationRequest|BackgroundTaskRequest|CreateBackgroundOperationWith|EnqueueBackgroundTask|resource_class|ResourceClass' internal gooru frontend || true
          echo '=== LEGACY FRONTEND JOB REFERENCES ==='
          rg -n 'fetchJobs|fetchJob|cancelJob|JobStatus|JobListResponse|/api/v1/jobs|job_id|jobId' frontend internal || true
          echo '=== OPENAPI / API JOB REFERENCES ==='
          rg -n '/api/v1/jobs|/jobs|JobStatus|JobListResponse|BackgroundOperation|operations' . --glob '!frontend/node_modules/**' --glob '!.git/**' --glob '!.github/workflows/maintainer-401-surface-scan.yml' || true
          echo '=== TAG MUTATION CALLERS ==='
          rg -n 'tags/apply|tags/remove|tags/mutate|tag mutation|tagMutation|applyTags|removeTags|mutateTags' frontend internal || true
