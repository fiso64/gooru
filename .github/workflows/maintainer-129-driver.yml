name: maintainer-129-driver
on:
  push:
    branches:
      - fix/129-stream-multipart-upload
permissions:
  contents: write
jobs:
  validate:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run implementation and validation script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/maintainer-129-stream.yml').read_text()
          start = text.index('        run: |\n') + len('        run: |\n')
          end = text.index('      - name: Commit implementation\n', start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/maintainer-129.sh').write_text(script)
          PY
          bash /tmp/maintainer-129.sh
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name gooru-maintainer-bot
          git config user.email maintainer@users.noreply.github.com
          git add internal/serve/uploads.go internal/serve/upload_stream.go internal/serve/upload_stream_test.go
          git commit -m 'fix(upload): stream multipart files into managed staging'
          git push origin HEAD:fix/129-stream-multipart-upload
