name: Temporary managed-location upsert patch

on:
  push:
    branches:
      - agent/issue-549-batch-managed-location-upserts
    paths:
      - .github/workflows/temporary-batch-managed-location-upserts.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify regression is red before implementation
        shell: bash
        run: |
          set -euo pipefail
          if go test ./internal/database -run '^TestBatchUpsertLocationsBatchesManagedStorageWrites$' -count=1; then
            echo 'expected managed-storage batching regression to fail before implementation' >&2
            exit 1
          fi

      - name: Batch managed-storage upserts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/database/database.go')
          text = path.read_text()
          old = '''\t\tfor _, loc := range batch {
          \t\t\tif strings.TrimSpace(loc.StoragePath) == "" {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tif _, err := q.Exec(`INSERT INTO managed_storage_locations (location_id, physical_path)
          \t\t\t\tSELECT id, ? FROM locations WHERE path = ?
          \t\t\t\tON CONFLICT(location_id) DO UPDATE SET physical_path = excluded.physical_path`, loc.StoragePath, loc.Path); err != nil {
          \t\t\t\treturn err
          \t\t\t}
          \t\t}
          '''
          new = '''\t\tmanagedPlaceholders := make([]string, 0, len(batch))
          \t\tmanagedArgs := make([]interface{}, 0, len(batch)*2)
          \t\tfor _, loc := range batch {
          \t\t\tif strings.TrimSpace(loc.StoragePath) == "" {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tmanagedPlaceholders = append(managedPlaceholders, "(?, ?)")
          \t\t\tmanagedArgs = append(managedArgs, loc.StoragePath, loc.Path)
          \t\t}
          \t\tif len(managedPlaceholders) > 0 {
          \t\t\tmanagedQuery := `WITH managed(physical_path, path) AS (VALUES ` +
          \t\t\t\tstrings.Join(managedPlaceholders, ",") +
          \t\t\t\t`)
          \t\t\t\tINSERT INTO managed_storage_locations (location_id, physical_path)
          \t\t\t\tSELECT l.id, managed.physical_path
          \t\t\t\tFROM managed
          \t\t\t\tJOIN locations l ON l.path = managed.path
          \t\t\t\tWHERE true
          \t\t\t\tON CONFLICT(location_id) DO UPDATE SET physical_path = excluded.physical_path`
          \t\t\tif _, err := q.Exec(managedQuery, managedArgs...); err != nil {
          \t\t\t\treturn err
          \t\t\t}
          \t\t}
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one managed-storage loop, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          gofmt -w internal/database/database.go

      - name: Validate database package
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/database -count=1

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fiso64'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git rm .github/workflows/temporary-batch-managed-location-upserts.yml
          git add internal/database/database.go
          git commit -m 'perf: batch managed location upserts'
          git push origin HEAD:agent/issue-549-batch-managed-location-upserts
