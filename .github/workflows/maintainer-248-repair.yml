name: Maintainer 248 Repair

on:
  push:
    branches:
      - feat/248-upload-target-default-tags

permissions:
  contents: write

jobs:
  implement-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[maintainer-248-applied]') && !contains(github.event.head_commit.message, '[maintainer-248-cleanup]') }}
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/248-upload-target-default-tags
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply corrected implementation
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/maintainer-248-apply.log
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/maintainer-248.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          old = "marker = '''        added_at_strategy:\\n          type: string\\n          enum: [queue, reverse_queue, modtime]\\n'''"
          new = "marker = '''              added_at_strategy:\\n                type: string\\n                enum: [queue, reverse_queue, modtime]\\n'''"
          if old not in script:
              raise SystemExit('could not locate original OpenAPI marker in transformation script')
          script = script.replace(old, new, 1)
          script = script.replace("marker + '''        default_tags:\\n          type: array\\n          items:\\n            type: string\\n          description: Visible editable tag/-tag directives prefilled for this upload target.\\n'''", "marker + '''              default_tags:\\n                type: array\\n                items:\\n                  type: string\\n                description: Visible editable tag/-tag directives prefilled for this upload target.\\n'''")
          exec(compile(script, 'maintainer-248-embedded.py', 'exec'))

          p = Path('internal/serve/uploads_test.go')
          text = p.read_text()
          setup = 'server := newUploadTestServer(t, t.TempDir(), true, &recordingUploadLibrary{})\n\trec := httptest.NewRecorder()\n\n\tserver.Handler().ServeHTTP(rec, httptest.NewRequest(http.MethodGet, "/api/v1/upload-targets", nil))'
          replacement = 'server := newUploadTestServer(t, t.TempDir(), true, &recordingUploadLibrary{})\n\tserver.cfg.Uploads.Targets[0].DefaultTags = []string{"project:inbox", "-project:archive"}\n\trec := httptest.NewRecorder()\n\n\tserver.Handler().ServeHTTP(rec, httptest.NewRequest(http.MethodGet, "/api/v1/upload-targets", nil))'
          if setup not in text:
              raise SystemExit('could not locate upload-target endpoint test setup')
          text = text.replace(setup, replacement, 1)
          assertion = '\tif len(payload.Items) != 1 || payload.Items[0].ID != "default" || payload.Items[0].Name != "Default" {\n\t\tt.Fatalf("unexpected targets response: %+v", payload)\n\t}\n'
          extra = assertion + '\tif got := payload.Items[0].DefaultTags; len(got) != 2 || got[0] != "project:inbox" || got[1] != "-project:archive" {\n\t\tt.Fatalf("unexpected default tags: %+v", got)\n\t}\n'
          if assertion not in text:
              raise SystemExit('could not locate upload-target endpoint assertion')
          p.write_text(text.replace(assertion, extra, 1))
          PY
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/maintainer-248-apply.log
            exit "$status"
          fi
          gofmt -w internal/query/tag_directives.go internal/query/tag_directives_test.go internal/serve/config.go internal/serve/uploads.go internal/serve/uploads_test.go internal/serve/upload_default_tags_test.go
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run generate:api
      - name: Focused Go tests
        run: go test ./internal/query ./internal/serve
      - name: Frontend unit and type checks
        working-directory: frontend
        run: |
          npm run test:unit -- --run src/lib/state/uploadWorkflow.svelte.test.ts
          npm run check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/query/tag_directives.go internal/query/tag_directives_test.go internal/serve/config.go internal/serve/uploads.go internal/serve/uploads_test.go internal/serve/upload_default_tags_test.go docs/CONFIG.md docs/openapi.yaml frontend/src/lib/api/openapi.ts frontend/src/lib/state/uploadItems.ts frontend/src/lib/state/uploadWorkflow.svelte.ts frontend/src/lib/state/uploadWorkflow.svelte.test.ts frontend/src/lib/components/AuthenticatedApp.svelte
          git commit -m "feat: support upload target default tags [maintainer-248-applied]"
          git push origin HEAD:feat/248-upload-target-default-tags
