name: temp-105-comic-wordmark
on:
  push:
    branches: [fix/105-comic-wordmark]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rebuild comic wordmark from bundled font and shared spirals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/components/Logo.svelte')
          s = p.read_text()
          s = s.replace(
              '  <img class="gooru-logo-comic" src="/gooru-logo-comic.svg" alt="" aria-hidden="true" />\n',
              '''  <svg class="gooru-logo-comic" viewBox="7.57 -187.22 944.03 247.49" aria-hidden="true">\n    <text class="gooru-logo-comic-letter gooru-logo-comic-g" x="8" y="9">g</text>\n    <text class="gooru-logo-comic-letter gooru-logo-comic-r" x="660" y="9">r</text>\n    <text class="gooru-logo-comic-letter gooru-logo-comic-u" x="805" y="9">u</text>\n  </svg>\n''',
              1,
          )
          s = s.replace(
              '''  .gooru-logo img,\n  .gooru-logo-accent {\n''',
              '''  .gooru-logo img,\n  .gooru-logo-comic,\n  .gooru-logo-accent {\n''',
              1,
          )
          s = s.replace(
              '''  .gooru-logo-comic {\n    display: none;\n  }\n''',
              '''  .gooru-logo-comic {\n    display: none;\n    overflow: visible;\n  }\n\n  .gooru-logo-comic-letter {\n    fill: var(--text);\n    font-family: var(--font-display);\n    font-size: 226px;\n    font-weight: var(--font-display-weight);\n  }\n''',
              1,
          )
          s = s.replace(
              '''  :global(.gooru-type-comic) .gooru-logo-default,\n  :global(.gooru-type-comic) .gooru-logo-accent {\n    display: none;\n  }\n''',
              '''  :global(.gooru-type-comic) .gooru-logo-default {\n    display: none;\n  }\n''',
              1,
          )
          p.write_text(s)

          t = Path('frontend/tests/font-style.spec.ts')
          q = t.read_text()
          q = q.replace(
              "test('comic font preset uses a bold bundled heading and the alternate comic logo', async ({ page }) => {",
              "test('comic font preset uses the bundled face for headings and wordmark letters while preserving the regular spiral Os', async ({ page }) => {",
              1,
          )
          old = '''  const comicLogo = page.locator('.gooru-logo-comic');\n  await expect(comicLogo).toBeVisible();\n  await expect(comicLogo).toHaveAttribute('src', '/gooru-logo-comic.svg');\n  await expect(page.locator('.gooru-logo-default')).toBeHidden();\n'''
          new = '''  const comicLogo = page.locator('.gooru-logo-comic');\n  const comicLetters = comicLogo.locator('.gooru-logo-comic-letter');\n  await expect(comicLogo).toBeVisible();\n  await expect(comicLetters).toHaveCount(3);\n  await expect(page.locator('.gooru-logo-default')).toBeHidden();\n  await expect(page.locator('.gooru-logo-accent')).toBeVisible();\n  await expect(page.locator('.gooru-logo-accent image[href="/favicon.svg"]')).toHaveCount(2);\n\n  const logoTypography = await comicLetters.first().evaluate(async (element) => {\n    const style = getComputedStyle(element);\n    const faces = await document.fonts.load(`${style.fontWeight} ${style.fontSize} "Comic Neue"`, element.textContent ?? 'g');\n    return { family: style.fontFamily, weight: style.fontWeight, loadedFaces: faces.length };\n  });\n  expect(logoTypography.family).toMatch(/^"?Comic Neue"?/);\n  expect(logoTypography.weight).toBe('700');\n  expect(logoTypography.loadedFaces).toBeGreaterThan(0);\n'''
          if old not in q:
              raise SystemExit('expected comic-logo test block not found')
          q = q.replace(old, new, 1)
          q = q.replace(
              "  await expect(page.locator('.gooru-logo-comic')).toBeHidden();\n});\n\ntest('editorial preset",
              "  await expect(page.locator('.gooru-logo-comic')).toBeHidden();\n  await expect(page.locator('.gooru-logo-accent')).toBeVisible();\n});\n\ntest('editorial preset",
              1,
          )
          q = q.replace(
              "  await expect(page.locator('.gooru-logo-comic')).toBeHidden();\n});",
              "  await expect(page.locator('.gooru-logo-comic')).toBeHidden();\n  await expect(page.locator('.gooru-logo-accent')).toBeVisible();\n});",
              1,
          )
          t.write_text(q)
          PY
          rm frontend/static/gooru-logo-comic.svg
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm run test:unit
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium firefox
      - working-directory: frontend
        run: npx playwright test tests/font-style.spec.ts --project=chromium
      - name: Run font-style regression in Firefox
        working-directory: frontend
        run: |
          cp playwright.config.ts playwright.firefox.config.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('playwright.firefox.config.ts')
          s = p.read_text().replace("name: 'chromium'", "name: 'firefox'").replace("devices['Desktop Chrome']", "devices['Desktop Firefox']")
          p.write_text(s)
          PY
          npx playwright test tests/font-style.spec.ts --config=playwright.firefox.config.ts --project=firefox
          rm playwright.firefox.config.ts
      - name: Commit validated change and remove workflow
        run: |
          rm .github/workflows/temp-105-comic-wordmark.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add -A frontend/src/lib/components/Logo.svelte frontend/tests/font-style.spec.ts frontend/static/gooru-logo-comic.svg .github/workflows/temp-105-comic-wordmark.yml
          git commit -m 'fix(ui): preserve spiral Os in comic wordmark'
          git push
