name: Apply upload write deadline fix

on:
  push:
    branches:
      - fix/22-cbz-upload-ingress
    paths:
      - .github/workflows/apply-upload-write-deadline-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/22-cbz-upload-ingress
      - name: Keep upload responses writable after long body transfers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path('internal/serve/server.go')
          text = server.read_text()
          old = '''\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          \t\tcontroller := http.NewResponseController(w)
          \t\tif r.Body == nil || r.Body == http.NoBody || controller.SetReadDeadline(time.Time{}) != nil {
          '''
          new = '''\treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          \t\tcontroller := http.NewResponseController(w)
          \t\t// http.Server.WriteTimeout starts after the request headers are read,
          \t\t// so it can expire while a large upload body is still arriving and
          \t\t// prevent the handler from returning its small JSON response. Uploads
          \t\t// are already bounded by an idle read deadline and optional size limit.
          \t\tif r.URL.Path == "/api/v1/uploads" {
          \t\t\t_ = controller.SetWriteDeadline(time.Time{})
          \t\t}
          \t\tif r.Body == nil || r.Body == http.NoBody || controller.SetReadDeadline(time.Time{}) != nil {
          '''
          if old not in text:
              raise SystemExit('server middleware snippet not found')
          server.write_text(text.replace(old, new))

          test = Path('internal/serve/upload_cbz_e2e_test.go')
          text = test.read_text()
          text = text.replace('func TestCBZUploadCanProgressLongerThanReadTimeout(t *testing.T) {', 'func TestCBZUploadCanProgressLongerThanServerIOTimeouts(t *testing.T) {')
          text = text.replace('server.cfg.Server.WriteTimeout = 2 * time.Second', 'server.cfg.Server.WriteTimeout = 40 * time.Millisecond')
          test.write_text(text)
          PY
          rm .github/workflows/apply-upload-write-deadline-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/serve/server.go internal/serve/upload_cbz_e2e_test.go .github/workflows/apply-upload-write-deadline-fix.yml
          git commit -m 'fix(server): keep long upload responses writable'
          git push origin HEAD:fix/22-cbz-upload-ingress
