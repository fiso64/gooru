name: Diagnose post-297 grid integration

on:
  push:
    branches:
      - feat/278-grid-layout-types

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture merge conflicts against develop
        shell: bash
        run: |
          set +e
          git fetch origin develop
          git merge --no-commit --no-ff origin/develop
          status=$?
          {
            echo "merge_status=$status"
            echo "conflict_files:"
            git diff --name-only --diff-filter=U
            for f in $(git diff --name-only --diff-filter=U); do
              echo "===== $f ====="
              grep -n -B 25 -A 50 -E '^(<<<<<<<|=======|>>>>>>>)' "$f" || true
            done
          } > /tmp/conflicts.txt
          git merge --abort || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: post-297-conflicts
          path: /tmp/conflicts.txt
