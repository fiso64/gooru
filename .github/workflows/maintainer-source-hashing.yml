name: maintainer source hashing

on:
  push:
    branches:
      - refactor/28-source-hashing

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply source hashing refactor
        run: |
          python3 .github/maintainer_source_hashing.py
          gofmt -w internal/hashing/hashes/blake3_full.go internal/hashing/hashes/blake3_partial.go internal/hashing/hashing.go gooru/query.go internal/hashing/hashes/hash_source_test.go gooru/file_source_test.go
      - name: Validate Go
        run: |
          go build ./...
          go test ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:unit
          npm run check
          npm run build
      - name: Commit validated production changes
        run: |
          rm .github/workflows/maintainer-source-hashing.yml .github/maintainer_source_hashing.py
          git config user.name "Gooru autonomous maintainer"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git add -A
          git commit -m "refactor(hashing): support random-access content sources"
          git push origin HEAD:refactor/28-source-hashing
