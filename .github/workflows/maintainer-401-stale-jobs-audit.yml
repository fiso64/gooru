name: Maintainer 401 transformed accent probe

on:
  push:
    branches:
      - maintainer/401-remove-job-manager

permissions:
  contents: read

jobs:
  probe:
    if: "github.event.head_commit.message == 'chore: isolate #401 accent transform failure'"
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/401-remove-job-manager
      - name: Apply cleanup
        run: python3 .github/maintainer-401-browser-cleanup.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npx playwright install chromium
      - name: Repeat transformed accent regression
        working-directory: frontend
        run: npx playwright test tests/accent-controls.spec.ts --repeat-each=5
