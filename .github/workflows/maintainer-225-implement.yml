name: Maintainer 225 implementation

on:
  push:
    branches:
      - feat/225-grid-size-config

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply cross-layer grid-size changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace('internal/serve/config.go',
              'const DefaultListenAddress = "127.0.0.1:5678"',
              'const (\n\tDefaultListenAddress = "127.0.0.1:5678"\n\tDefaultGridSize      = 180\n\tMinGridSize          = 64\n\tMaxGridSize          = 1024\n)')
          replace('internal/serve/config.go',
              'type UIConfig struct {\n\tAccentColor string `yaml:"accent_color"`\n\tFontStyle   string `yaml:"font_style"`\n}',
              'type UIConfig struct {\n\tAccentColor string `yaml:"accent_color"`\n\tFontStyle   string `yaml:"font_style"`\n\tGridSize    int    `yaml:"grid_size"`\n}')
          replace('internal/serve/config.go',
              '\t\tUI:      UIConfig{FontStyle: "editorial"},',
              '\t\tUI:      UIConfig{FontStyle: "editorial", GridSize: DefaultGridSize},')
          replace('internal/serve/config.go',
              '\tswitch cfg.UI.FontStyle {\n\tcase "editorial", "modern", "comic":\n\tdefault:\n\t\terrs = append(errs, errors.New("ui.font_style must be one of: editorial, modern, comic"))\n\t}\n',
              '\tswitch cfg.UI.FontStyle {\n\tcase "editorial", "modern", "comic":\n\tdefault:\n\t\terrs = append(errs, errors.New("ui.font_style must be one of: editorial, modern, comic"))\n\t}\n\tif cfg.UI.GridSize < MinGridSize || cfg.UI.GridSize > MaxGridSize {\n\t\terrs = append(errs, fmt.Errorf("ui.grid_size must be between %d and %d pixels", MinGridSize, MaxGridSize))\n\t}\n')

          replace('internal/serve/ui_config.go',
              '\tLoadFullMediaByDefault bool   `json:"load_full_media_by_default"`\n}',
              '\tLoadFullMediaByDefault bool   `json:"load_full_media_by_default"`\n\tGridSize               int    `json:"grid_size"`\n}')
          replace('internal/serve/ui_config.go',
              '\t\tLoadFullMediaByDefault: s.cfg.Media.LoadFullByDefault,\n',
              '\t\tLoadFullMediaByDefault: s.cfg.Media.LoadFullByDefault,\n\t\tGridSize:               s.cfg.UI.GridSize,\n')

          replace('internal/serve/ui_config_test.go',
              'func TestConfigLoadsFullMediaDefault(t *testing.T) {',
              '''func TestConfigValidatesGridSize(t *testing.T) {
\tcfg := DefaultConfig(t.TempDir() + "/gooru.db")
\tif cfg.UI.GridSize != DefaultGridSize {
\t\tt.Fatalf("default grid size = %d, want %d", cfg.UI.GridSize, DefaultGridSize)
\t}
\tcfg.UI.GridSize = 240
\tif err := cfg.Validate(); err != nil {
\t\tt.Fatalf("valid grid size rejected: %v", err)
\t}
\tcfg.UI.GridSize = MinGridSize - 1
\tif err := cfg.Validate(); err == nil || !strings.Contains(err.Error(), "ui.grid_size") {
\t\tt.Fatalf("expected invalid grid size error, got %v", err)
\t}
}

func TestConfigLoadsGridSize(t *testing.T) {
\tdir := t.TempDir()
\tpath := filepath.Join(dir, "gooru.yaml")
\tif err := os.WriteFile(path, []byte("ui:\\n  grid_size: 240\\n"), 0o600); err != nil {
\t\tt.Fatalf("write config: %v", err)
\t}
\tcfg, err := LoadConfig(path, filepath.Join(dir, "gooru.db"), Overrides{})
\tif err != nil {
\t\tt.Fatalf("load config: %v", err)
\t}
\tif cfg.UI.GridSize != 240 {
\t\tt.Fatalf("ui.grid_size = %d, want 240", cfg.UI.GridSize)
\t}
}

func TestConfigLoadsFullMediaDefault(t *testing.T) {''')
          replace('internal/serve/ui_config_test.go',
              '\tcfg.Media.LoadFullByDefault = true\n',
              '\tcfg.Media.LoadFullByDefault = true\n\tcfg.UI.GridSize = 240\n')
          replace('internal/serve/ui_config_test.go',
              '\tif !strings.Contains(rec.Body.String(), `"load_full_media_by_default":true`) {\n\t\tt.Fatalf("response missing full-media preference: %s", rec.Body.String())\n\t}\n',
              '\tif !strings.Contains(rec.Body.String(), `"load_full_media_by_default":true`) {\n\t\tt.Fatalf("response missing full-media preference: %s", rec.Body.String())\n\t}\n\tif !strings.Contains(rec.Body.String(), `"grid_size":240`) {\n\t\tt.Fatalf("response missing grid size: %s", rec.Body.String())\n\t}\n')

          replace('frontend/src/lib/components/AppPage.svelte',
              "import { runtimeConfig } from '$lib/stores/runtimeConfig';",
              "import { defaultGridSize, runtimeConfig } from '$lib/stores/runtimeConfig';")
          replace('frontend/src/lib/components/AppPage.svelte',
              "type UIConfig = { accent_color?: string; font_style?: FontStyle; load_full_media_by_default?: boolean };",
              "type UIConfig = { accent_color?: string; font_style?: FontStyle; load_full_media_by_default?: boolean; grid_size?: number };")
          replace('frontend/src/lib/components/AppPage.svelte',
              "let runtimeFontStyle = $state<FontStyle>('editorial');\n  let faviconHref",
              "let runtimeFontStyle = $state<FontStyle>('editorial');\n  let runtimeGridSize = $state(defaultGridSize);\n  let faviconHref")
          replace('frontend/src/lib/components/AppPage.svelte',
              "runtimeFontStyle = config.font_style ?? 'editorial';\n    runtimeConfig.set({ loadFullMediaByDefault: config.load_full_media_by_default ?? false });",
              "runtimeFontStyle = config.font_style ?? 'editorial';\n    runtimeGridSize = config.grid_size ?? defaultGridSize;\n    runtimeConfig.set({ loadFullMediaByDefault: config.load_full_media_by_default ?? false, gridSize: runtimeGridSize });")
          replace('frontend/src/lib/components/AppPage.svelte',
              "style={runtimeAccent ? `--accent:${runtimeAccent.accent};--accent-ink:${runtimeAccent.accentInk}` : undefined}",
              "style={`--grid-cell:${runtimeGridSize}px;${runtimeAccent ? `--accent:${runtimeAccent.accent};--accent-ink:${runtimeAccent.accentInk}` : ''}`}")

          replace('frontend/src/lib/components/MediaGrid.svelte',
              "import { virtualGrid, virtualGridStartRow } from '$lib/state/ui';",
              "import { virtualGrid, virtualGridStartRow } from '$lib/state/ui';\n  import { runtimeConfig } from '$lib/stores/runtimeConfig';")
          replace('frontend/src/lib/components/MediaGrid.svelte',
              'const virtual = $derived(virtualGrid(files, gridWidth, paneHeight, paneScrollY, gridTop, totalCount || files.length, retainedStartIndex));',
              'const virtual = $derived(virtualGrid(files, gridWidth, paneHeight, paneScrollY, gridTop, totalCount || files.length, retainedStartIndex, $runtimeConfig.gridSize));')

          replace('docs/CONFIG.md',
              '| `ui.font_style` | `editorial` | Typography preset: `editorial` keeps the serif display face, `modern` uses the sans-serif UI face for display text too, and `comic` uses a Comic Sans-style stack for most UI/display text and the Gooru wordmark while retaining the mono face for code/data. |',
              '| `ui.font_style` | `editorial` | Typography preset: `editorial` keeps the serif display face, `modern` uses the sans-serif UI face for display text too, and `comic` uses a Comic Sans-style stack for most UI/display text and the Gooru wordmark while retaining the mono face for code/data. |\n| `ui.grid_size` | `180` | Minimum media-grid cell width in pixels. Must be between `64` and `1024`. The grid remains fluid: cells expand to fill each row rather than becoming fixed-width. |')
          replace('docs/CONFIG.md',
              'ui:\n  accent_color: "#2f80ed"\n  font_style: editorial',
              'ui:\n  accent_color: "#2f80ed"\n  font_style: editorial\n  grid_size: 180')

          Path('frontend/tests/grid-size-config.spec.ts').write_text(r'''import { expect, test, type Page } from '@playwright/test';

const session = {
  user: { id: 'usr_test', username: 'mac', role: 'admin' },
  capabilities: { upload: true, tag: true, delete: true, admin: true },
  csrf_token: 'csrf-one'
};

async function mockApp(page: Page, gridSize: number) {
  const files = Array.from({ length: 8 }, (_, index) => ({
    id: `file-${index}`,
    content_id: `hash-${index}`,
    name: `file-${index}.jpg`,
    safe_display_path: `library/file-${index}.jpg`,
    size: 2048,
    modified_time: '2026-05-20T00:00:00Z',
    media_type: 'image/jpeg',
    media_kind: 'photo',
    metadata: { image_width: 800, image_height: 600 },
    tags: [],
    media_urls: {
      thumbnail: `/api/v1/files/file-${index}/thumbnail`,
      preview: `/api/v1/files/file-${index}/preview`,
      content: `/api/v1/files/file-${index}/content`,
      download: `/api/v1/files/file-${index}/download`
    }
  }));
  let loggedIn = false;

  await page.route('**/api/v1/ui-config', async (route) => route.fulfill({
    contentType: 'application/json',
    body: JSON.stringify({ font_style: 'editorial', load_full_media_by_default: false, grid_size: gridSize })
  }));
  await page.route('**/api/v1/auth/me', async (route) => route.fulfill({
    status: loggedIn ? 200 : 401,
    contentType: 'application/json',
    body: JSON.stringify(loggedIn ? session : { error: { code: 'unauthorized', message: 'login required' } })
  }));
  await page.route('**/api/v1/auth/login', async (route) => {
    loggedIn = true;
    await route.fulfill({ contentType: 'application/json', body: JSON.stringify(session) });
  });
  await page.route('**/api/v1/jobs', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/saved-searches', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/upload-targets', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/tags?**', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ tags: [] }) }));
  await page.route('**/api/v1/search/suggestions?**', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [], meta_tags: [] }) }));
  await page.route('**/api/v1/files?**', async (route) => route.fulfill({
    contentType: 'application/json',
    body: JSON.stringify({ files, total_count: files.length, library_count: files.length, facets: { kind: [] } })
  }));
  await page.route('**/api/v1/files/*/thumbnail', async (route) => route.fulfill({
    contentType: 'image/svg+xml',
    body: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" fill="#fff"/></svg>'
  }));

  await page.goto('/');
  await page.getByLabel('Username').fill('mac');
  await page.getByLabel('Password').fill('correct horse');
  await page.getByRole('button', { name: 'Sign in' }).click();
  await expect(page.getByRole('heading', { name: 'Library' })).toBeVisible();
}

test('runtime ui grid_size changes the fluid media grid and virtualization together', async ({ page }) => {
  await page.setViewportSize({ width: 1200, height: 900 });
  await mockApp(page, 240);

  const rootGridCell = await page.locator('.gooru-root').evaluate((node) => getComputedStyle(node).getPropertyValue('--grid-cell').trim());
  expect(rootGridCell).toBe('240px');

  const grid = page.getByTestId('virtual-media-grid');
  const columns = await grid.evaluate((node) => getComputedStyle(node).gridTemplateColumns.split(' ').length);
  expect(columns).toBe(3);

  const cards = grid.locator('.thumb');
  await expect(cards).toHaveCount(8);
  const firstBox = await cards.first().boundingBox();
  expect(firstBox?.width).toBeGreaterThanOrEqual(240);
});
''')
          PY
          gofmt -w internal/serve/config.go internal/serve/ui_config.go internal/serve/ui_config_test.go
      - name: Backend tests
        run: go test ./internal/serve
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Grid-size browser regression
        working-directory: frontend
        run: npx playwright test tests/grid-size-config.spec.ts --project=chromium
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/serve/config.go internal/serve/ui_config.go internal/serve/ui_config_test.go docs/CONFIG.md frontend/src/lib/components/AppPage.svelte frontend/src/lib/components/MediaGrid.svelte frontend/tests/grid-size-config.spec.ts
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat(ui): configure fluid media grid size'
          git push
