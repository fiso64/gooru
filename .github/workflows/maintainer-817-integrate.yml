name: Maintainer 817 integration

on:
  push:
    branches:
      - maintainer-817-nixos-instances

permissions:
  contents: write

jobs:
  integrate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged flake refactor
        shell: bash
        run: |
          if [[ ! -f nix/root-flake.nix ]]; then
            echo "staged root flake already consumed"
            exit 0
          fi
          cp nix/root-flake.nix flake.nix
          rm nix/root-flake.nix
          git diff --check
          nix build .#checks.x86_64-linux.nixos-module --print-build-logs
          git config user.name "gooru-maintainer"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git add flake.nix nix/root-flake.nix
          git commit -m "refactor(nix): delegate flake outputs"
          git push origin HEAD:maintainer-817-nixos-instances
