name: Temporary completion scale review

on:
  push:
    branches:
      - fix/387-completion-stability
    paths:
      - .github/workflows/tmp-390-scale-review.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/387-completion-stability
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply scale-safe repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp-390-scale-review.py
          gofmt -w internal/database/database_test.go
      - name: Validate Go suggestions
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/database ./internal/serve
      - name: Validate frontend unit and type checks
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit
          npm run test:unit -- --run src/lib/utils/tagSuggestions.test.ts src/lib/state/libraryWorkflow.test.ts
          npm run check
      - name: Validate browser completion regression
        shell: bash
        working-directory: frontend
        env:
          CI: '1'
        run: |
          set -euo pipefail
          npx playwright install chromium
          npm run test:e2e -- tests/search-completion-ranking.spec.ts
      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git add internal/database/database.go internal/database/database_test.go frontend/src/lib/utils/tagSuggestions.ts
          git config user.name 'Gooru Maintainer'
          git config user.email 'maintainer@users.noreply.github.com'
          git commit -m 'fix: keep completion counts on maintained summaries'
          git push origin HEAD:fix/387-completion-stability
