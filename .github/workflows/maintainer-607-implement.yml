name: Maintainer 607

on:
  push:
    branches:
      - maintainer/607-versioning
    paths:
      - .github/workflows/maintainer-607-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Implement and validate
        shell: bash
        run: bash .github/maintainer-607-implement.sh
