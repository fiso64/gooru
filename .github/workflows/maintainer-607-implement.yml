name: Maintainer 607

on:
  push:
    branches:
      - maintainer/607-versioning
    paths:
      - .github/workflows/maintainer-607-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare implementation script for app-safe push
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/maintainer-607-implement.sh')
          s = p.read_text()
          s = s.replace('git rebase origin/develop', 'git merge --no-edit origin/develop')
          s = s.replace('rm -f .github/workflows/maintainer-607-implement.yml .github/maintainer-607-implement.sh', 'git restore -- .github/workflows/nix-package.yml\nrm -f .github/workflows/release.yml')
          s = s.replace('git push --force-with-lease origin HEAD:maintainer/607-versioning', 'npm --prefix frontend run generate:api\ngit add frontend/src/lib/api/openapi.ts\ngit commit --amend --no-edit\ngit push origin HEAD:maintainer/607-versioning')
          p.write_text(s)
          PY
      - name: Implement and validate
        shell: bash
        run: |
          set -o pipefail
          bash .github/maintainer-607-implement.sh 2>&1 | tee maintainer-607.log
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintainer-607-log-${{ github.run_id }}
          path: maintainer-607.log
          if-no-files-found: error
          retention-days: 3
