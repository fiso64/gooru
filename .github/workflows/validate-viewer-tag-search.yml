name: Validate viewer tag search slice

on:
  push:
    branches: [fix/21-viewer-tag-search]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/21-viewer-tag-search
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Complete viewer tag search integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text()
          old = "      onRemoveTag={(file, tag) => tagWorkflow.removeTag(file, tag, (variables) => tagMutation.mutateAsync(variables))}\n      onUntrack={untrackPreview}"
          new = "      onRemoveTag={(file, tag) => tagWorkflow.removeTag(file, tag, (variables) => tagMutation.mutateAsync(variables))}\n      onTagSearch={library.runPreviewTagSearch}\n      onUntrack={untrackPreview}"
          if old not in text:
              raise SystemExit('AuthenticatedApp insertion point not found')
          app.write_text(text.replace(old, new, 1))

          workflow = Path('frontend/src/lib/state/libraryWorkflow.svelte.ts')
          text = workflow.read_text()
          old = "  function runSavedSearch(query: string, name: string) {"
          new = "  function runPreviewTagSearch(query: string) {\n    runTagSearch(query);\n    activeFile = null;\n  }\n\n  function runSavedSearch(query: string, name: string) {"
          if old not in text:
              raise SystemExit('library workflow insertion point not found')
          text = text.replace(old, new, 1)
          old = "    runTagSearch,\n    runSavedSearch,"
          new = "    runTagSearch,\n    runPreviewTagSearch,\n    runSavedSearch,"
          if old not in text:
              raise SystemExit('library workflow export point not found')
          workflow.write_text(text.replace(old, new, 1))

          Path('frontend/src/lib/state/libraryWorkflow.test.ts').write_text('''import { describe, expect, it } from \'vitest\';\nimport type { FileItem } from \'$lib/api/types\';\nimport { createLibraryWorkflow } from \'./libraryWorkflow.svelte\';\n\nfunction storeValue<T>(store: { subscribe: (run: (value: T) => void) => () => void }): T {\n  let value!: T;\n  const unsubscribe = store.subscribe((next) => (value = next));\n  unsubscribe();\n  return value;\n}\n\ndescribe(\'viewer tag search transition\', () => {\n  it(\'uses the canonical tag search state and closes the preview\', () => {\n    const library = createLibraryWorkflow();\n    library.setKind(\'video\');\n    library.openPreview({ id: \'file-1\' } as FileItem);\n\n    library.runPreviewTagSearch(\'artist:example\');\n\n    expect(library.activeFile).toBeNull();\n    expect(library.activeKind).toBe(\'\');\n    expect(library.route).toBe(\'library\');\n    expect(storeValue(library.searchDraft)).toBe(\'artist:example\');\n    expect(storeValue(library.submittedSearch)).toBe(\'artist:example\');\n  });\n});\n''')
          PY
      - name: Backend validation
        run: |
          go build ./...
          go test ./...
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm run test:unit
          npm run check
          npm run build
      - name: Commit validated slice and remove temporary workflow
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-viewer-tag-search.yml
          git add frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/state/libraryWorkflow.svelte.ts frontend/src/lib/state/libraryWorkflow.test.ts
          git commit -m "fix(frontend): make viewer tags searchable"
          git push origin HEAD:fix/21-viewer-tag-search
