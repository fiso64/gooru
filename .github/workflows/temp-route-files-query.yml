name: Temporary route files-query validation
on:
  push:
    branches: [fix/21-route-gate-files-query]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply route gating and regression
        shell: python
        run: |
          from pathlib import Path

          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text()
          old = "  const filesQuery = createFilesQuery(\n    () => Boolean($authState.user),\n"
          new = "  const filesQuery = createFilesQuery(\n    () => Boolean($authState.user) && library.route === 'library',\n"
          if old not in text:
              raise SystemExit('AuthenticatedApp files-query call did not match expected source')
          app.write_text(text.replace(old, new, 1))

          test = Path('frontend/tests/route-files-query.spec.ts')
          test.write_text(r'''import { expect, test, type Page } from '@playwright/test';

const session = {
  user: { id: 'usr_test', username: 'mac', role: 'admin' },
  capabilities: { upload: true, tag: true, delete: true, admin: true },
  csrf_token: 'csrf-one'
};

async function mockApp(page: Page, onFilesRequest: () => void) {
  await page.route('**/api/v1/auth/me', async (route) => {
    await route.fulfill({ contentType: 'application/json', body: JSON.stringify(session) });
  });
  await page.route('**/api/v1/ui-config', async (route) => route.fulfill({ contentType: 'application/json', body: '{}' }));
  await page.route('**/api/v1/files?**', async (route) => {
    onFilesRequest();
    await route.fulfill({ contentType: 'application/json', body: JSON.stringify({ files: [], total_count: 0, library_count: 0, facets: { kind: [] } }) });
  });
  await page.route('**/api/v1/saved-searches', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/upload-targets', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/tags?**', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ tags: [] }) }));
  await page.route('**/api/v1/search/suggestions?**', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/jobs', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
}

test('non-library route does not materialize the files grid and library still loads it on demand', async ({ page }) => {
  let filesRequests = 0;
  await mockApp(page, () => filesRequests += 1);

  await page.goto('/tags');
  await expect(page.getByRole('heading', { name: 'Tags' })).toBeVisible();
  await page.waitForTimeout(250);
  expect(filesRequests).toBe(0);

  await page.getByRole('button', { name: 'Library' }).click();
  await expect(page.getByRole('heading', { name: 'Library' })).toBeVisible();
  await expect.poll(() => filesRequests).toBeGreaterThan(0);
});
''')
      - name: Backend validation
        run: |
          go build ./...
          go test ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm run test:unit
          npm run check
          npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Focused browser regression
        working-directory: frontend
        run: npx playwright test tests/route-files-query.spec.ts --project=chromium
      - name: Commit validated change and remove temporary workflow
        run: |
          rm .github/workflows/temp-route-files-query.yml
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/AuthenticatedApp.svelte frontend/tests/route-files-query.spec.ts .github/workflows/temp-route-files-query.yml
          git commit -m 'fix(ui): avoid files query outside library route'
          git push origin HEAD:fix/21-route-gate-files-query
