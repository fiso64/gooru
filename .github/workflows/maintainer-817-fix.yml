name: Maintainer 817 fix

on:
  push:
    branches:
      - maintainer-817-nixos-instances

permissions:
  contents: write

jobs:
  integrate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged Nix changes
        shell: bash
        run: |
          if [[ ! -f nix/root-flake.nix || ! -f nix/module-fixed.nix ]]; then
            echo "staged files already consumed"
            exit 0
          fi

          cp nix/root-flake.nix flake.nix
          cp nix/module-fixed.nix nix/module.nix
          rm nix/root-flake.nix nix/module-fixed.nix

          sed -i "/- 'flake.nix'/a\      - 'nix/**'" .github/workflows/nix-package.yml

          git diff --check
          nix build .#checks.x86_64-linux.nixos-module --print-build-logs
          nix build .#packages.x86_64-linux.default --print-build-logs

          rm .github/workflows/maintainer-817-integrate.yml
          rm .github/workflows/maintainer-817-fix.yml

          git config user.name "gooru-maintainer"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git add -A
          git commit -m "refactor(nix): wire multi-instance module"
          git push origin HEAD:maintainer-817-nixos-instances
