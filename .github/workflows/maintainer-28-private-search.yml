name: Maintainer protected search integration

on:
  push:
    branches:
      - fix/28-protected-browser-privacy

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply protected search transport
        run: python3 .github/maintainer-28-private-search.py
      - name: Format Go
        run: gofmt -w internal/serve/browse.go internal/serve/search_saved.go internal/serve/server.go internal/serve/ui_config.go internal/serve/protected_search_test.go
      - name: Generate frontend API types
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run generate:api
      - name: Validate Go
        run: go test ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
          npm run build
      - name: Commit integrated change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/serve frontend/src/lib docs
          git commit -m 'fix: keep protected WebUI searches out of URLs'
          git push
