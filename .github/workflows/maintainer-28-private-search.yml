name: Maintainer protected search validation

on:
  push:
    branches:
      - fix/28-protected-browser-privacy

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Apply protected history fix
        run: python .github/maintainer-28-fix-history.py
      - name: Commit protected history fix
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/lib/state/libraryWorkflow.svelte.ts; then
            exit 0
          fi
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/state/libraryWorkflow.svelte.ts
          git commit -m "fix: preserve opaque URL during restore"
          git push origin HEAD:fix/28-protected-browser-privacy
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Go
        id: go
        shell: bash
        run: |
          set -o pipefail
          { go test ./... && go build ./...; } 2>&1 | tee go-validation.log
      - name: Upload Go diagnostics
        if: failure() && steps.go.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: go-validation-diagnostics
          path: go-validation.log
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Validate frontend
        id: frontend
        shell: bash
        working-directory: frontend
        run: |
          set -o pipefail
          { npm run check && npm run test:unit && npm run build; } 2>&1 | tee ../frontend-validation.log
      - name: Upload frontend diagnostics
        if: failure() && steps.frontend.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-diagnostics
          path: frontend-validation.log
      - name: Validate protected browser privacy
        id: browser
        shell: bash
        working-directory: frontend
        run: |
          set -o pipefail
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$browser" ]; then
            echo 'No Chromium executable found on self-hosted runner' | tee ../browser-validation.log
            exit 1
          fi
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$browser"
          npx playwright test tests/protected-browser-privacy.spec.ts --project=chromium 2>&1 | tee ../browser-validation.log
      - name: Upload browser diagnostics
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation-diagnostics
          path: browser-validation.log
