name: Maintainer protected search integration

on:
  push:
    branches:
      - fix/28-protected-browser-privacy

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply opaque protected URL state
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/maintainer-28-opaque-url.py')
          text = p.read_text()
          bad = "''').write_text(Path('internal/serve/url_state_test.go').read_text().replace('\\\"encoding/json\\\"', '\\\"encoding/json\\\"\\n    \\\"errors\\\"'))"
          if bad not in text:
              bad = "''').write_text(Path('internal/serve/url_state_test.go').read_text().replace('\\\"encoding/json\\\"', '\\\"encoding/json\\\"\\\\n    \\\"errors\\\"'))"
          replacement = "''')\np = Path('internal/serve/url_state_test.go')\np.write_text(p.read_text().replace('\\\"encoding/json\\\"', '\\\"encoding/json\\\"\\n    \\\"errors\\\"'))"
          if bad not in text:
              raise SystemExit('generator bug pattern not found')
          p.write_text(text.replace(bad, replacement, 1))
          PY
          python3 .github/maintainer-28-opaque-url.py > .github/maintainer-28-generator.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/maintainer-28-generator.log
            git commit -m 'chore: capture protected URL generator failure'
            git push
            exit "$status"
          fi
          rm -f .github/maintainer-28-generator.log
      - name: Format Go
        run: gofmt -w internal/serve/server.go internal/serve/ui_config.go internal/serve/config.go internal/serve/url_state.go internal/serve/url_state_test.go
      - name: Generate frontend API types
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run generate:api
      - name: Persist integrated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/serve frontend/src/lib docs
          git commit -m 'fix: protect WebUI state with opaque URL tokens'
          git push
      - name: Validate Go
        id: go_test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee go-test.log
      - name: Upload Go diagnostics
        if: failure() && steps.go_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: go-test-diagnostics
          path: go-test.log
      - name: Validate frontend
        id: frontend_test
        shell: bash
        working-directory: frontend
        run: |
          set -o pipefail
          { npm run check && npm run test:unit && npm run build; } 2>&1 | tee ../frontend-test.log
      - name: Upload frontend diagnostics
        if: failure() && steps.frontend_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-diagnostics
          path: frontend-test.log
