name: Maintainer protected search integration

on:
  push:
    branches:
      - fix/28-protected-browser-privacy

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply protected search and opaque URL state
        run: |
          python3 .github/maintainer-28-private-search.py
          python3 .github/maintainer-28-fix-import.py
          python3 .github/maintainer-28-fix-openapi.py
          python3 .github/maintainer-28-opaque-url.py
      - name: Format Go
        run: gofmt -w internal/serve/browse.go internal/serve/search_saved.go internal/serve/server.go internal/serve/ui_config.go internal/serve/config.go internal/serve/protected_search_test.go internal/serve/url_state.go internal/serve/url_state_test.go
      - name: Generate frontend API types
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run generate:api
      - name: Validate Go
        id: go_test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee go-test.log
      - name: Upload Go diagnostics
        if: failure() && steps.go_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: go-test-diagnostics
          path: go-test.log
      - name: Validate frontend
        id: frontend_test
        shell: bash
        working-directory: frontend
        run: |
          set -o pipefail
          { npm run check && npm run test:unit && npm run build; } 2>&1 | tee ../frontend-test.log
      - name: Upload frontend diagnostics
        if: failure() && steps.frontend_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-diagnostics
          path: frontend-test.log
      - name: Commit integrated change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/serve frontend/src/lib docs
          git commit -m 'fix: protect WebUI state with opaque URL tokens'
          git push
