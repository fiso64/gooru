name: Validate 284 default fullscreen

on:
  push:
    branches:
      - feat/284-default-fullscreen

permissions:
  contents: write

jobs:
  fullscreen-default:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Normalize touched source files
        shell: bash
        run: |
          gofmt -w internal/serve/config.go internal/serve/ui_config.go internal/serve/ui_config_test.go
          node - <<'NODE'
          const fs = require('node:fs');
          for (const path of ['frontend/src/lib/components/AppPage.svelte']) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.endsWith('\n')) fs.writeFileSync(path, source + '\n');
          }
          NODE
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Focused Chromium regression
        working-directory: frontend
        run: npx playwright test tests/viewer-fullscreen-default.spec.ts --project=chromium
      - name: Commit normalized source if needed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/serve/config.go internal/serve/ui_config.go internal/serve/ui_config_test.go frontend/src/lib/components/AppPage.svelte
          git commit -m 'chore: normalize default fullscreen source formatting'
          git push origin HEAD:feat/284-default-fullscreen
