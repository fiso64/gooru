name: Temporary validate 333 root count

on:
  push:
    branches:
      - perf/333-root-aggregate-count

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate Go browse path
        run: |
          test -z "$(gofmt -l internal/serve/browse.go internal/serve/browse_aggregate_count_test.go)"
          go test ./internal/serve
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/tmp-validate-333-root-count.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-validate-333-root-count.yml
          git commit -m "ci: remove temporary validation workflow"
          git push origin HEAD:perf/333-root-aggregate-count
