name: maintainer-222-integrate
on:
  push:
    branches: [feat/222-filename-contains-metatag]
permissions:
  contents: write
jobs:
  integrate:
    if: "${{ ! contains(github.event.head_commit.message, '[maintainer-222-integrated]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Merge current develop
        run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-edit origin/develop
      - name: Validate Go
        run: go test ./internal/query ./internal/serve
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          git diff --exit-code -- src/lib/api/openapi.ts
          npm run test:unit
          npm run check
          npm run build
      - name: Push integrated branch
        run: |
          git commit --amend -m "Merge develop into feat/222-filename-contains-metatag [maintainer-222-integrated]"
          git push
