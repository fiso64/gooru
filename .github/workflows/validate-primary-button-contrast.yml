name: Validate primary button contrast

on:
  push:
    branches: [fix/21-primary-button-contrast]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/21-primary-button-contrast
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fix primary button contrast cascade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/styles/components.css')
          text = path.read_text()
          old = '.g-btn-primary {\n  background: var(--accent);\n  color: var(--accent-ink);\n  border-color: var(--accent);\n}'
          new = '.gooru-root .g-btn-primary {\n  background: var(--accent);\n  color: var(--accent-ink);\n  border-color: var(--accent);\n}'
          if old not in text:
              raise SystemExit('primary button rule not found')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -n -A4 '^\.gooru-root \.g-btn-primary' frontend/src/lib/styles/components.css
      - name: Backend validation
        run: |
          go build ./...
          go test ./...
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm run test:unit
          npm run check
          npm run build
      - name: Commit validated fix and remove temporary workflow
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-primary-button-contrast.yml
          git add frontend/src/lib/styles/components.css
          git commit -m "fix(frontend): preserve primary button contrast"
          git push origin HEAD:fix/21-primary-button-contrast
