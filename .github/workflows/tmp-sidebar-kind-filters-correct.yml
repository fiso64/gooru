name: Temporary corrected sidebar kind filter validation

on:
  push:
    branches:
      - fix/227-sidebar-kind-filters

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/227-sidebar-kind-filters
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply implementation from original validation workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/tmp-sidebar-kind-filters.yml').read_text().splitlines()
          marker = '      - name: Implement unified sidebar kind filters'
          start = source.index(marker)
          run_line = next(i for i in range(start + 1, len(source)) if source[i] == '        run: |')
          lines = []
          for line in source[run_line + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          Path('/tmp/sidebar-implementation.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/sidebar-implementation.sh
      - name: Correct browser boundary assertions and preserve library navigation semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          test = Path('frontend/tests/shell.spec.ts')
          text = test.read_text()
          replacements = {
            "await expect(search).toHaveValue('technology type:video');": "await expect(page.locator('.searchbar-pill')).toHaveText(['technology', 'type:video']);",
            "await expect(search).toHaveValue('technology type:photo');": "await expect(page.locator('.searchbar-pill')).toHaveText(['technology', 'type:photo']);",
            "await expect(search).not.toHaveValue(/type:video/);": "await expect(page.locator('.searchbar-pill')).not.toContainText(['type:video']);",
            "await expect(search).toHaveValue('technology type:gif');": "await expect(page.locator('.searchbar-pill')).toHaveText(['technology', 'type:gif']);",
            "await expect(search).not.toHaveValue(/type:photo/);": "await expect(page.locator('.searchbar-pill')).not.toContainText(['type:photo']);",
            "await expect(search).toHaveValue('technology ext:cbz');": "await expect(page.locator('.searchbar-pill')).toHaveText(['technology', 'ext:cbz']);",
            "await expect(search).not.toHaveValue(/type:gif/);": "await expect(page.locator('.searchbar-pill')).not.toContainText(['type:gif']);",
            "await expect(search).toHaveValue('rating:safe blue');": "await expect(page.locator('.searchbar-pill')).toHaveText(['rating:safe', 'blue']);",
            "await expect(search).toHaveValue('blue');": "await expect(page.locator('.searchbar-pill')).toHaveText(['blue']);",
            "page.getByRole('button', { name: 'Safe blue' })": "page.getByRole('button', { name: 'Safe blue', exact: true })"
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing browser assertion/locator: {old}')
              text = text.replace(old, new, 1)
          test.write_text(text)

          shell = Path('frontend/src/lib/components/AppShell.svelte')
          text = shell.read_text()
          old = "  function openLibrary() {\n    onRoute('library');\n    onSearchCommit('');\n  }"
          new = "  function openLibrary() {\n    if (route === 'library') onSearchCommit('');\n    onRoute('library');\n  }"
          if old not in text:
              raise SystemExit('missing openLibrary implementation')
          shell.write_text(text.replace(old, new, 1))
          PY
          cat > frontend/src/lib/utils/sidebarKinds.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { appendSidebarKind, queryWithoutSidebarKind, replaceSidebarKind, sidebarKindActive } from './sidebarKinds';

          describe('sidebar kind query helpers', () => {
            it('replaces only sidebar kind terms while preserving unrelated query terms', () => {
              expect(replaceSidebarKind('technology type:video rating:safe', 'type:photo')).toBe('technology rating:safe type:photo');
              expect(replaceSidebarKind('technology ext:cbz', 'type:gif')).toBe('technology type:gif');
            });

            it('toggles the active kind off and normalizes legacy counts queries', () => {
              expect(replaceSidebarKind('technology type:photo', 'type:photo')).toBe('technology');
              expect(queryWithoutSidebarKind('technology TYPE:VIDEO ext:cbz rating:safe')).toBe('technology rating:safe');
              expect(sidebarKindActive('technology TYPE:VIDEO', 'type:video')).toBe(true);
              expect(appendSidebarKind('technology type:photo', 'ext:cbz')).toBe('technology ext:cbz');
            });
          });
          EOF
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Static check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Sidebar browser regression
        working-directory: frontend
        run: npx playwright test tests/shell.spec.ts --project=chromium --grep 'sidebar kind filters'
      - name: Commit validated product change and remove temporary workflows
        run: |
          rm .github/workflows/tmp-sidebar-kind-filters.yml .github/workflows/tmp-sidebar-kind-filters-correct.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add frontend/src/lib/utils/sidebarKinds.ts frontend/src/lib/utils/sidebarKinds.test.ts frontend/src/lib/components/AppShell.svelte frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/queries/files.ts frontend/src/lib/state/libraryWorkflow.svelte.ts frontend/tests/shell.spec.ts .github/workflows/tmp-sidebar-kind-filters.yml .github/workflows/tmp-sidebar-kind-filters-correct.yml
          git commit -m 'fix(sidebar): unify kind filters with visible queries'
          git push origin HEAD:fix/227-sidebar-kind-filters
