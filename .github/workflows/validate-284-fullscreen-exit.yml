name: Validate 284 fullscreen exit

on:
  push:
    branches:
      - fix/284-fullscreen-escape-grid

permissions:
  contents: read

concurrency:
  group: validate-284-fullscreen-exit
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/284-fullscreen-escape-grid
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check and unit tests
        working-directory: frontend
        run: npm run check && npm run test:unit
      - name: Focused fullscreen browser regression
        working-directory: frontend
        run: npm run test:e2e -- viewer-fullscreen-default.spec.ts --project=chromium
      - name: Frontend build
        working-directory: frontend
        run: npm run build
