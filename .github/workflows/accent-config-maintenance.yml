name: Accent config maintenance

on:
  push:
    branches: [feat/21-accent-config]

permissions:
  contents: write

jobs:
  complete-and-validate:
    if: "${{ github.event.head_commit.message != 'feat(ui): wire configurable runtime accent' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/21-accent-config
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Complete runtime accent configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected snippet in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace('internal/serve/config.go',
              '\tLogging  LoggingConfig  `yaml:"logging"`\n}',
              '\tLogging  LoggingConfig  `yaml:"logging"`\n\tUI       UIConfig       `yaml:"ui"`\n}')
          replace('internal/serve/config.go',
              'type LoggingConfig struct {\n\tLevel string `yaml:"level"`\n}\n',
              'type LoggingConfig struct {\n\tLevel string `yaml:"level"`\n}\n\ntype UIConfig struct {\n\tAccentColor string `yaml:"accent_color"`\n}\n')
          replace('internal/serve/config.go',
              '\tif cfg.Logging.Level == "" {\n',
              '\tcfg.UI.AccentColor = strings.TrimSpace(cfg.UI.AccentColor)\n\tif cfg.UI.AccentColor != "" && !accentColorPattern.MatchString(cfg.UI.AccentColor) {\n\t\terrs = append(errs, errors.New("ui.accent_color must be a six-digit hex color such as #2f80ed"))\n\t}\n\tif cfg.Logging.Level == "" {\n')
          replace('internal/serve/config.go',
              'var uploadTargetIDPattern = regexp.MustCompile(`^[A-Za-z0-9][A-Za-z0-9_-]*$`)\n',
              'var uploadTargetIDPattern = regexp.MustCompile(`^[A-Za-z0-9][A-Za-z0-9_-]*$`)\nvar accentColorPattern = regexp.MustCompile(`^#[0-9A-Fa-f]{6}$`)\n')

          replace('internal/serve/server.go',
              '\tmux.HandleFunc("/api/v1/health", methodHandler(http.MethodGet, s.handleHealth))\n',
              '\tmux.HandleFunc("/api/v1/health", methodHandler(http.MethodGet, s.handleHealth))\n\tmux.HandleFunc("/api/v1/ui-config", methodHandler(http.MethodGet, s.handleUIConfig))\n')

          replace('frontend/src/lib/styles/tokens.css',
              '  --accent-soft: oklch(0.88 0.14 85 / 0.12);\n  --accent-line: oklch(0.88 0.14 85 / 0.45);',
              '  --accent-soft: color-mix(in oklab, var(--accent) 12%, transparent);\n  --accent-line: color-mix(in oklab, var(--accent) 45%, transparent);')

          p = Path('frontend/src/lib/components/AppPage.svelte')
          text = p.read_text()
          text = text.replace("  import { errorMessage } from '$lib/utils/format';\n", "  import { errorMessage } from '$lib/utils/format';\n  import { accentTheme, type AccentTheme } from '$lib/utils/theme';\n", 1)
          text = text.replace("  let loginError = $state('');\n", "  let loginError = $state('');\n  let runtimeAccent = $state<AccentTheme | null>(null);\n", 1)
          text = text.replace("  onMount(() => {\n    new ApiClient()\n", "  onMount(() => {\n    fetch('/api/v1/ui-config', { credentials: 'same-origin' })\n      .then(async (response) => {\n        if (!response.ok) return null;\n        return await response.json() as { accent_color?: string };\n      })\n      .then((config) => { runtimeAccent = accentTheme(config?.accent_color ?? ''); })\n      .catch(() => { runtimeAccent = null; });\n\n    new ApiClient()\n", 1)
          text = text.replace('<div class="gooru-root gooru-accent-sodium gooru-type-editorial">', '<div\n  class="gooru-root gooru-accent-sodium gooru-type-editorial"\n  style={runtimeAccent ? `--accent:${runtimeAccent.accent};--accent-ink:${runtimeAccent.accentInk}` : undefined}\n>')
          p.write_text(text)

          p = Path('docs/CONFIG.md')
          text = p.read_text()
          marker = '## `logging`\n\n'
          ui = '## `ui`\n\n| Option | Default | Description |\n| --- | --- | --- |\n| `ui.accent_color` | empty | Optional runtime UI accent in six-digit hex form such as `#2f80ed`. When empty, the built-in yellow accent is used. The UI derives readable foreground and translucent accent tokens from this color. |\n\n'
          if marker not in text:
              raise SystemExit('missing logging section marker')
          text = text.replace(marker, ui + marker, 1)
          text = text.replace('logging:\n  level: info\n```', 'logging:\n  level: info\n\nui:\n  accent_color: "#2f80ed"\n```', 1)
          p.write_text(text)
          PY
          gofmt -w internal/serve/config.go internal/serve/ui_config.go internal/serve/ui_config_test.go
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate
        run: |
          go build ./...
          go test ./...
          cd frontend
          npm run test:unit
          npm run check
          npm run build
      - name: Commit completed implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/serve/config.go internal/serve/server.go internal/serve/ui_config.go internal/serve/ui_config_test.go frontend/src/lib/components/AppPage.svelte frontend/src/lib/styles/tokens.css frontend/src/lib/utils/theme.ts frontend/src/lib/utils/theme.test.ts docs/CONFIG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(ui): wire configurable runtime accent"
          git push origin HEAD:feat/21-accent-config
