name: Maintainer #401 atomic upload result repair 2

on:
  push:
    branches:
      - maintainer/401-atomic-upload-result

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse staged implementation with corrected import patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/maintainer-401-atomic-upload-result.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == 'run: |') + 1
          body = []
          for line in workflow[start:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  break
          script = '\n'.join(body) + '\n'
          old = '''replace_once(path, 'import (\\n\\t"database/sql"', 'import (\\n\\t"database/sql"\\n\\t"encoding/json"')'''
          new = '''replace_once(path, 'import (\\n\\t"database/sql"', 'import (\\n\\t"database/sql"\\n\\t"encoding/json"\\n\\t"errors"')'''
          if script.count(old) != 1:
              raise SystemExit(f'expected one import patch marker, found {script.count(old)}')
          script = script.replace(old, new, 1)
          cleanup = 'rm .github/workflows/maintainer-401-atomic-upload-result.yml'
          if cleanup not in script:
              raise SystemExit('expected cleanup marker not found')
          script = script.replace(
              cleanup,
              cleanup + ' .github/workflows/maintainer-401-atomic-upload-result-repair.yml .github/workflows/maintainer-401-atomic-upload-result-repair2.yml',
              1,
          )
          Path('/tmp/maintainer-401-atomic-upload-result.sh').write_text(script)
          PY
          bash /tmp/maintainer-401-atomic-upload-result.sh
