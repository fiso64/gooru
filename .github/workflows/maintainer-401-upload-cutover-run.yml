name: Maintainer 401 upload cutover run

on:
  push:
    branches:
      - maintainer/401-remove-legacy-jobs

permissions:
  contents: write

jobs:
  implement:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --pretty=%s)" != "chore: rerun #401 upload cutover validation" ]]; then
            echo "Not the validation kickoff commit; nothing to do."
            exit 0
          fi
          python3 .github/maintainer-401-upload-cutover.py
          python3 .github/maintainer-401-upload-cutover-fixes.py
          gofmt -w internal/serve/uploads.go internal/serve/config.go internal/serve/background_operations.go internal/serve/background_operations_test.go internal/serve/uploads_test.go internal/serve/config_test.go
          npm --prefix frontend ci
          npm --prefix frontend run generate:api
          go test ./internal/serve
          npm --prefix frontend run check
          npm --prefix frontend run test:unit
          rm .github/maintainer-401-upload-cutover.py .github/maintainer-401-upload-cutover-fixes.py .github/workflows/maintainer-401-upload-cutover-run.yml
          git status --short
          git add -A
          git config user.name 'fiso64'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git commit -m 'feat: finish durable upload API cutover'
          git push origin HEAD:maintainer/401-remove-legacy-jobs
