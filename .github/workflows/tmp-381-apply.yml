name: Temporary PR 381 Apply Repair

on:
  push:
    branches:
      - fix/349-selection-snapshots

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/349-selection-snapshots
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply and commit repair
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/tmp-381-repair.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          prefix = '          '
          body = '\n'.join(line[len(prefix):] if line.startswith(prefix) else line for line in lines[start:end]) + '\n'
          Path('/tmp/pr381-repair.py').write_text(body)
          PY
          python3 -m py_compile /tmp/pr381-repair.py
          python3 /tmp/pr381-repair.py
          gofmt -w internal/serve/browse.go internal/serve/file_selections.go internal/serve/file_selections_test.go internal/serve/server.go gooru/query.go internal/database/database.go
          git diff --check
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/components/AuthenticatedApp.svelte internal/serve/server.go internal/serve/browse.go internal/serve/file_selections.go internal/serve/file_selections_test.go gooru/query.go internal/database/database.go
          git diff --cached --quiet && { echo 'repair produced no staged changes'; exit 2; }
          git commit -m "fix(selection): bound immutable snapshot resources"
          git push origin HEAD:fix/349-selection-snapshots
