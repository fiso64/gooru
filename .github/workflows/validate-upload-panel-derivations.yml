name: Validate upload panel derivations

on:
  push:
    branches:
      - perf/333-upload-panel-derivations

permissions:
  contents: read

jobs:
  frontend:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright test tests/upload-large-batch.spec.ts
