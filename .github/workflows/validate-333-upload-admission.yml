name: Validate #333 upload admission

on:
  push:
    branches:
      - perf/333-upload-admission-wakeup

permissions:
  contents: read

concurrency:
  group: validate-333-upload-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Check
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Upload browser regressions
        run: npm run test:e2e -- upload-backpressure.spec.ts upload-admission-throughput.spec.ts upload-concurrency.spec.ts
      - name: Build
        run: npm run build
