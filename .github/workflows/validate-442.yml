name: Validate 442

on:
  push:
    branches:
      - feat/442-query-syntax-contract

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format
        run: test -z "$(gofmt -l internal/query/specialsyntax.go internal/query/metatags.go internal/query/validation.go internal/serve/search_saved_metatags_test.go)"
      - name: Go tests
        run: go test ./...
      - name: Go build
        run: go build ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend build
        working-directory: frontend
        run: npm run build
