name: Validate 442

on:
  push:
    branches:
      - feat/442-query-syntax-contract

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format
        run: test -z "$(gofmt -l internal/query/specialsyntax.go internal/query/metatags.go internal/query/validation.go internal/serve/search_saved_metatags_test.go)"
      - name: Go tests
        id: go-tests
        continue-on-error: true
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee go-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-442-go-test
          path: go-test.log
      - name: Fail on Go test failure
        if: steps.go-tests.outcome == 'failure'
        run: exit 1
      - name: Go build
        run: go build ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend build
        working-directory: frontend
        run: npm run build
