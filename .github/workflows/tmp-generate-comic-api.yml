name: Temporary comic API generation
on:
  push:
    branches:
      - feat/22-cbz-viewer
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/22-cbz-viewer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Update OpenAPI source
        run: python scripts/tmp_add_comic_openapi.py
      - name: Generate TypeScript API types
        working-directory: frontend
        run: npm run generate:api
      - name: Check generated changes
        run: git diff --check
      - name: Commit generated contract
        run: |
          git config user.name "Gooru Maintainer"
          git config user.email "maintainer@users.noreply.github.com"
          git add docs/openapi.yaml frontend/src/lib/api/openapi.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "api(comics): document comic manifest and page routes"
          git push origin HEAD:feat/22-cbz-viewer
