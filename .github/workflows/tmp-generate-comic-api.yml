name: Temporary comic API generation
on:
  push:
    branches:
      - feat/22-cbz-viewer
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/22-cbz-viewer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Add comic API to OpenAPI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/openapi.yaml')
          text = path.read_text()
          routes = '''  /comics/{id}:
    get:
      summary: List naturally ordered image pages in a CBZ comic.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comic page manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
  /comics/{id}/{page}:
    get:
      summary: Stream one naturally ordered image page from a CBZ comic.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Requested comic page image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
'''
          schemas = '''    ComicPage:
      type: object
      required: [index, name, url]
      properties:
        index:
          type: integer
          minimum: 0
        name:
          type: string
        url:
          type: string
    ComicManifest:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items:
            $ref: "#/components/schemas/ComicPage"
'''
          route_anchor = '  /files/tags:\n'
          schema_anchor = '    TagMutationRequest:\n'
          if '  /comics/{id}:\n' not in text:
              if route_anchor not in text:
                  raise SystemExit('route anchor missing')
              text = text.replace(route_anchor, routes + route_anchor, 1)
          if '    ComicManifest:\n' not in text:
              if schema_anchor not in text:
                  raise SystemExit('schema anchor missing')
              text = text.replace(schema_anchor, schemas + schema_anchor, 1)
          path.write_text(text)
          PY
      - name: Generate TypeScript API types
        working-directory: frontend
        run: npm run generate:api
      - name: Verify generated contract
        run: git diff --check && git diff --exit-code -- frontend/src/lib/api/openapi.ts >/dev/null || true
      - name: Commit generated contract
        run: |
          git config user.name "Gooru Maintainer"
          git config user.email "maintainer@users.noreply.github.com"
          git add docs/openapi.yaml frontend/src/lib/api/openapi.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "api(comics): document comic manifest and page routes"
          git push origin HEAD:feat/22-cbz-viewer
