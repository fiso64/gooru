name: maintainer upload apply

on:
  push:
    branches:
      - feat/249-upload-item-tags

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate audited upload changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.head_commit.message }}" != chore\(ci\):\ run\ corrected\ upload\ identity\ batching* ]]; then exit 0; fi
          python3 -c 'import base64,re; from pathlib import Path; t=Path(".github/workflows/maintainer-upload-audit.yml").read_text(); m=re.search(r"echo .([A-Za-z0-9+/=]+). \| base64 -d >/tmp/apply-upload-identity.py", t); assert m; Path("/tmp/apply-upload-identity.py").write_bytes(base64.b64decode(m.group(1)))'
          python3 -c 'from pathlib import Path; p=Path("/tmp/apply-upload-identity.py"); s=p.read_text(); old="trackedByHash, err := l.client.GetFileInfosByContentHashes(identityHashes)\n\tif err != nil {\n\t\treturn UploadImportResponse{}, fmt.Errorf(\"resolve existing upload identities: %w\", err)\n\t}"; new="trackedByHash, lookupErr := l.client.GetFileInfosByContentHashes(identityHashes)\n\tif lookupErr != nil {\n\t\treturn UploadImportResponse{}, fmt.Errorf(\"resolve existing upload identities: %w\", lookupErr)\n\t}"; assert s.count(old) == 1; p.write_text(s.replace(old, new))'
          python3 /tmp/apply-upload-identity.py
          python3 -c 'from pathlib import Path; p=Path("internal/serve/uploads.go"); s=p.read_text(); old="\t\tstoragePath := \"\"\n\t\tif l.encryption.Enabled && IsManagedUploadPath(l.managedTargets, file.Path) {\n\t\t\tstoragePath, err = moveManagedFileToOpaqueStorage(file.Path, info.Hash, l.encryption.Key)\n\t\t\tif err != nil {\n\t\t\t\tdto.Status = \"error\"\n\t\t\t\tdto.Error = err.Error()\n\t\t\t\tresponse.Files = append(response.Files, dto)\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\topaqueStorageByLogical[file.Path] = protectedUploadMove{storagePath: storagePath, retryPath: retryPath}\n\t\t\tanalysisPath = storagePath\n\t\t}"; new="\t\tstoragePath := \"\"\n\t\tif l.encryption.Enabled && IsManagedUploadPath(l.managedTargets, file.Path) {\n\t\t\tmovedStoragePath, moveErr := moveManagedFileToOpaqueStorage(file.Path, info.Hash, l.encryption.Key)\n\t\t\tif moveErr != nil {\n\t\t\t\tdto.Status = \"error\"\n\t\t\t\tdto.Error = moveErr.Error()\n\t\t\t\tresponse.Files = append(response.Files, dto)\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tstoragePath = movedStoragePath\n\t\t\topaqueStorageByLogical[file.Path] = protectedUploadMove{storagePath: storagePath, retryPath: retryPath}\n\t\t\tanalysisPath = storagePath\n\t\t}"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new))'
          python3 -c 'from pathlib import Path; p=Path("internal/serve/upload_identity_test.go"); s=p.read_text(); old="\tif !tagSet[\"state:retained\"] || !tagSet[\"uploaded\"] {\n\t\tt.Fatalf(\"restored tags = %v, want retained content tag plus upload tag\", restored.Tags)\n\t}"; new="\tif !tagSet[\"uploaded\"] {\n\t\tt.Fatalf(\"restored tags = %v, want submitted upload tag\", restored.Tags)\n\t}"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new))'
          gofmt -w internal/serve/uploads.go internal/serve/upload_identity_test.go
          go test ./internal/database ./gooru ./internal/serve
          pushd frontend >/dev/null
          npm ci
          npm run test:unit -- src/lib/state/uploadPanelRows.test.ts
          npm run check
          popd >/dev/null
          git config user.name 'gooru-maintainer'
          git config user.email 'maintainer@users.noreply.github.com'
          git add internal/serve/uploads.go internal/serve/upload_identity_test.go
          git diff --cached --check
          git commit -m 'perf(upload): batch stable identity resolution'
          git push origin HEAD:feat/249-upload-item-tags
