name: Validate PR 398

on:
  push:
    branches:
      - perf/333-lightweight-job-history

permissions:
  contents: read

concurrency:
  group: validate-pr-398-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Focused jobs regressions
        run: go test ./internal/serve -run 'JobManagerListPage'
      - name: Full Go suite
        run: go test ./...
      - name: Build
        run: go build ./...
