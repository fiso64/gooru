name: maintainer-254-added-sort

on:
  push:
    branches:
      - feat/254-added-at-sorting
    paths:
      - .github/workflows/maintainer-254-added-sort.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply added-at sorting slice
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              p.write_text(text.replace(old, new))

          replace(
              'internal/database/database.go',
              'switch sort {\n\tcase "modified":\n\t\treturn "l.mod_time"',
              'switch sort {\n\tcase "added":\n\t\treturn "l.added_at"\n\tcase "modified":\n\t\treturn "l.mod_time"',
          )
          replace(
              'internal/database/database.go',
              'case "modified", "size":',
              'case "added", "modified", "size":',
          )

          replace(
              'internal/serve/browse.go',
              'case "modified", "name", "size", "kind":\n\t\treturn strings.ToLower(strings.TrimSpace(value))\n\tdefault:\n\t\treturn "name"',
              'case "added", "modified", "name", "size", "kind":\n\t\treturn strings.ToLower(strings.TrimSpace(value))\n\tdefault:\n\t\treturn "added"',
          )
          replace(
              'internal/serve/browse.go',
              'func normalizeSortOrder(value string) string {\n\tif strings.EqualFold(strings.TrimSpace(value), "desc") {\n\t\treturn "desc"\n\t}\n\treturn "asc"\n}',
              'func normalizeSortOrder(value string) string {\n\tif strings.EqualFold(strings.TrimSpace(value), "asc") {\n\t\treturn "asc"\n\t}\n\treturn "desc"\n}',
          )

          replace(
              'docs/openapi.yaml',
              'enum: [name, modified, size, kind]\n            default: name',
              'enum: [added, name, modified, size, kind]\n            default: added',
          )
          replace(
              'docs/openapi.yaml',
              'enum: [asc, desc]\n            default: asc',
              'enum: [asc, desc]\n            default: desc',
          )

          replace(
              'frontend/src/lib/queries/files.ts',
              "export type FileSort = 'modified' | 'name' | 'size' | 'kind';",
              "export type FileSort = 'added' | 'modified' | 'name' | 'size' | 'kind';",
          )
          replace(
              'frontend/src/lib/queries/files.ts',
              "sort: 'modified',\n      order: 'desc',",
              "sort: 'added',\n      order: 'desc',",
              2,
          )

          replace(
              'frontend/src/lib/utils/appRoute.ts',
              "sort: 'modified',\n  order: 'desc',",
              "sort: 'added',\n  order: 'desc',",
          )
          replace(
              'frontend/src/lib/utils/appRoute.ts',
              "const fileSorts = new Set<FileSort>(['modified', 'name', 'size', 'kind']);",
              "const fileSorts = new Set<FileSort>(['added', 'modified', 'name', 'size', 'kind']);",
          )

          replace(
              'frontend/src/lib/utils/appRoute.test.ts',
              "expect(searchForLibraryURLState({ query: '', kind: '', sort: 'modified', order: 'desc', fileID: '' })).toBe('');",
              "expect(searchForLibraryURLState({ query: '', kind: '', sort: 'added', order: 'desc', fileID: '' })).toBe('');",
          )
          replace(
              'frontend/src/lib/utils/appRoute.test.ts',
              "sort: 'modified',\n      order: 'desc',",
              "sort: 'added',\n      order: 'desc',",
          )

          replace(
              'frontend/src/lib/components/AuthenticatedApp.svelte',
              "{#each [{ value: 'modified', label: 'Modified' }, { value: 'name', label: 'Name' }, { value: 'size', label: 'Size' }] as option}",
              "{#each [{ value: 'added', label: 'Added' }, { value: 'name', label: 'Name' }, { value: 'size', label: 'Size' }] as option}",
          )

          marker = '''func TestBrowseIncludesCountsFacetsAndCachedMetadata(t *testing.T) {'''
          test = r'''func TestBrowseDefaultsToAddedNewestAndSupportsAddedCursor(t *testing.T) {
	server, cleanup := newTestBrowseServer(t)
	defer cleanup()

	if got := normalizeFileSort(""); got != "added" {
		t.Fatalf("expected default sort added, got %q", got)
	}
	if got := normalizeSortOrder(""); got != "desc" {
		t.Fatalf("expected default order desc, got %q", got)
	}

	rec := httptest.NewRecorder()
	server.Handler().ServeHTTP(rec, authedRequest(http.MethodGet, "/api/v1/files?limit=3"))
	if rec.Code != http.StatusOK {
		t.Fatalf("expected default list 200, got %d: %s", rec.Code, rec.Body.String())
	}
	var page FileListResponse
	if err := json.Unmarshal(rec.Body.Bytes(), &page); err != nil {
		t.Fatalf("decode default list: %v", err)
	}
	if len(page.Files) < 2 {
		t.Fatalf("expected multiple files, got %d", len(page.Files))
	}
	for i := 1; i < len(page.Files); i++ {
		if page.Files[i-1].AddedAt.Before(page.Files[i].AddedAt) {
			t.Fatalf("default list is not added-at descending: %v before %v", page.Files[i-1].AddedAt, page.Files[i].AddedAt)
		}
	}

	firstRec := httptest.NewRecorder()
	server.Handler().ServeHTTP(firstRec, authedRequest(http.MethodGet, "/api/v1/files?sort=added&order=desc&limit=1"))
	if firstRec.Code != http.StatusOK {
		t.Fatalf("expected first added page 200, got %d: %s", firstRec.Code, firstRec.Body.String())
	}
	var first FileListResponse
	if err := json.Unmarshal(firstRec.Body.Bytes(), &first); err != nil {
		t.Fatalf("decode first added page: %v", err)
	}
	if len(first.Files) != 1 {
		t.Fatalf("expected one first-page file, got %d", len(first.Files))
	}
	stored, err := server.getFileByPublicID(context.Background(), first.Files[0].ID)
	if err != nil {
		t.Fatalf("resolve first added-sort file: %v", err)
	}
	cursor := CursorPageToken("added", "desc", stored.ID)
	secondRec := httptest.NewRecorder()
	secondURL := "/api/v1/files?sort=added&order=desc&limit=1&page_token=" + url.QueryEscape(cursor)
	server.Handler().ServeHTTP(secondRec, authedRequest(http.MethodGet, secondURL))
	if secondRec.Code != http.StatusOK {
		t.Fatalf("expected added cursor page 200, got %d: %s", secondRec.Code, secondRec.Body.String())
	}
	var second FileListResponse
	if err := json.Unmarshal(secondRec.Body.Bytes(), &second); err != nil {
		t.Fatalf("decode second added page: %v", err)
	}
	if len(second.Files) != 1 || second.Files[0].ID == first.Files[0].ID {
		t.Fatalf("expected cursor to advance to another file, first=%+v second=%+v", first.Files, second.Files)
	}
}

'''
          p = Path('internal/serve/browse_test.go')
          text = p.read_text()
          if text.count(marker) != 1:
              raise SystemExit('browse_test.go: insertion marker mismatch')
          p.write_text(text.replace(marker, test + marker))
          PY
          gofmt -w internal/database/database.go internal/serve/browse.go internal/serve/browse_test.go
          git diff --check
      - name: Validate Go sorting surface
        run: go test ./internal/database ./internal/serve ./gooru
      - name: Validate frontend contract and UI
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          npm run check
          npm run test:unit
          npm run build
          git diff --check
      - name: Commit sorting slice
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email 'chatgpt-codex-connector@users.noreply.github.com'
          git add internal/database/database.go internal/serve/browse.go internal/serve/browse_test.go docs/openapi.yaml frontend/src/lib/queries/files.ts frontend/src/lib/utils/appRoute.ts frontend/src/lib/utils/appRoute.test.ts frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/api/openapi.ts
          git commit -m 'feat: make added time the library sort default [maintainer-254-sorting-applied]'
          git push origin HEAD:feat/254-added-at-sorting
