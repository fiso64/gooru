# temporary #254 validation trigger v4
name: maintainer-254-added-sort

on:
  push:
    branches:
      - feat/254-added-at-sorting
    paths:
      - .github/workflows/maintainer-254-added-sort.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 .maintainer-254-sort.py
          gofmt -w internal/database/database.go internal/serve/browse.go internal/serve/browse_test.go
          git diff --check
      - name: Validate Go
        run: go test ./internal/database ./internal/serve ./gooru
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          npm run check
          npm run test:unit
          npm run build
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email chatgpt-codex-connector@users.noreply.github.com
          git add internal/database/database.go internal/serve/browse.go internal/serve/browse_test.go docs/openapi.yaml frontend/src/lib/api/client.ts frontend/src/lib/queries/files.ts frontend/src/lib/utils/appRoute.ts frontend/src/lib/utils/appRoute.test.ts frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/api/openapi.ts
          git commit -m 'feat: make added time the library sort default [maintainer-254-sorting-applied]'
          git push origin HEAD:feat/254-added-at-sorting
