name: maintainer media open policy

on:
  push:
    branches:
      - refactor/28-media-open-policy

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply storage-aware media read integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          media_source = r'''package serve

import (
    "fmt"
    "io"
    "os"
    "time"

    "gooru.local/internal/encryptedfile"
)

type mediaReadSource interface {
    io.Reader
    io.ReaderAt
    io.Seeker
    io.Closer
}

type openedMediaSource struct {
    mediaReadSource
    size    int64
    modTime time.Time
}

func (m *MediaService) openMediaSource(path string) (*openedMediaSource, error) {
    if m.cfg.Encryption.Enabled {
        file, err := encryptedfile.Open(path, m.cfg.Encryption.Key)
        if err != nil {
            return nil, err
        }
        return &openedMediaSource{
            mediaReadSource: file,
            size:            file.Size(),
            modTime:         file.ModTime(),
        }, nil
    }

    file, err := os.Open(path)
    if err != nil {
        return nil, err
    }
    info, err := file.Stat()
    if err != nil {
        _ = file.Close()
        return nil, err
    }
    if info.IsDir() {
        _ = file.Close()
        return nil, fmt.Errorf("media source is a directory")
    }
    return &openedMediaSource{
        mediaReadSource: file,
        size:            info.Size(),
        modTime:         info.ModTime(),
    }, nil
}
'''
          Path('internal/serve/media_source.go').write_text(media_source)

          media = Path('internal/serve/media.go')
          text = media.read_text()
          old = '''func (m *MediaService) ServeContent(w http.ResponseWriter, r *http.Request, file types.FileInfo) {
\tf, err := os.Open(file.Path)
\tif err != nil {
\t\twriteError(w, http.StatusNotFound, "not_found", "file content not found", nil)
\t\treturn
\t}
\tdefer f.Close()
\tinfo, err := f.Stat()
\tif err != nil || info.IsDir() {
\t\twriteError(w, http.StatusNotFound, "not_found", "file content not found", nil)
\t\treturn
\t}
\tapplyOriginalContentPolicy(w, file)
\tm.applyProtectedMediaCachePolicy(w)
\thttp.ServeContent(w, r, filepath.Base(file.Path), info.ModTime(), f)
}'''
          new = '''func (m *MediaService) ServeContent(w http.ResponseWriter, r *http.Request, file types.FileInfo) {
\tsource, err := m.openMediaSource(file.Path)
\tif err != nil {
\t\twriteError(w, http.StatusNotFound, "not_found", "file content not found", nil)
\t\treturn
\t}
\tdefer source.Close()
\tapplyOriginalContentPolicy(w, file)
\tm.applyProtectedMediaCachePolicy(w)
\thttp.ServeContent(w, r, filepath.Base(file.Path), source.modTime, source)
}'''
          if old not in text:
              raise SystemExit('ServeContent source block not found')
          text = text.replace(old, new, 1)
          old_thumb = 'return thumbnailCBZFirstPage(file.Path, dst, size, format)'
          if old_thumb not in text:
              raise SystemExit('CBZ thumbnail dispatch not found')
          text = text.replace(old_thumb, 'return m.thumbnailCBZFirstPage(file.Path, dst, size, format)', 1)
          media.write_text(text)

          comic = Path('internal/serve/comic.go')
          text = comic.read_text()
          marker = '''// openComicArchiveReader contains the archive logic independently of the
// filesystem.'''
          method = '''func (m *MediaService) openComicArchive(path string) (*comicArchive, error) {
\tsource, err := m.openMediaSource(path)
\tif err != nil {
\t\treturn nil, fmt.Errorf("open cbz: %w", err)
\t}
\tarchive, err := openComicArchiveReader(path, source, source.size, source.Close)
\tif err != nil {
\t\t_ = source.Close()
\t\treturn nil, err
\t}
\treturn archive, nil
}

'''
          if marker not in text:
              raise SystemExit('comic reader marker not found')
          text = text.replace(marker, method + marker, 1)
          serve_old = '''func (m *MediaService) ServeComic(w http.ResponseWriter, r *http.Request, file types.FileInfo, publicID string) {
\tarchive, err := openComicArchive(file.Path)'''
          serve_new = '''func (m *MediaService) ServeComic(w http.ResponseWriter, r *http.Request, file types.FileInfo, publicID string) {
\tarchive, err := m.openComicArchive(file.Path)'''
          if serve_old not in text:
              raise SystemExit('ServeComic open block not found')
          text = text.replace(serve_old, serve_new, 1)
          old_fn = '''func thumbnailCBZFirstPage(src string, dst io.Writer, size int, format string) error {
\tarchive, err := openComicArchive(src)
\tif err != nil {
\t\treturn err
\t}
\tdefer archive.Close()
\treader, _, err := archive.openPage(0)
\tif err != nil {
\t\treturn err
\t}
\tdefer reader.Close()
\timg, _, err := image.Decode(io.LimitReader(reader, maxComicPageBytes))
\tif err != nil {
\t\treturn fmt.Errorf("%w: decode first comic page: %v", ErrUnsupportedMedia, err)
\t}
\tresized := scaleImage(img, size)
\tswitch format {
\tcase "jpeg":
\t\treturn jpeg.Encode(dst, resized, &jpeg.Options{Quality: derivativeJPEGQuality})
\tcase "png":
\t\treturn png.Encode(dst, resized)
\tdefault:
\t\treturn fmt.Errorf("%w: thumbnail format %q", ErrUnsupportedMedia, format)
\t}
}'''
          new_fn = '''func (m *MediaService) thumbnailCBZFirstPage(src string, dst io.Writer, size int, format string) error {
\tarchive, err := m.openComicArchive(src)
\tif err != nil {
\t\treturn err
\t}
\tdefer archive.Close()
\treturn thumbnailComicArchiveFirstPage(archive, dst, size, format)
}

func thumbnailCBZFirstPage(src string, dst io.Writer, size int, format string) error {
\tarchive, err := openComicArchive(src)
\tif err != nil {
\t\treturn err
\t}
\tdefer archive.Close()
\treturn thumbnailComicArchiveFirstPage(archive, dst, size, format)
}

func thumbnailComicArchiveFirstPage(archive *comicArchive, dst io.Writer, size int, format string) error {
\treader, _, err := archive.openPage(0)
\tif err != nil {
\t\treturn err
\t}
\tdefer reader.Close()
\timg, _, err := image.Decode(io.LimitReader(reader, maxComicPageBytes))
\tif err != nil {
\t\treturn fmt.Errorf("%w: decode first comic page: %v", ErrUnsupportedMedia, err)
\t}
\tresized := scaleImage(img, size)
\tswitch format {
\tcase "jpeg":
\t\treturn jpeg.Encode(dst, resized, &jpeg.Options{Quality: derivativeJPEGQuality})
\tcase "png":
\t\treturn png.Encode(dst, resized)
\tdefault:
\t\treturn fmt.Errorf("%w: thumbnail format %q", ErrUnsupportedMedia, format)
\t}
}'''
          if old_fn not in text:
              raise SystemExit('CBZ thumbnail function not found')
          text = text.replace(old_fn, new_fn, 1)
          comic.write_text(text)

          existing_test = Path('internal/serve/media_encryption_test.go')
          text = existing_test.read_text()
          target = '''\tserver := protectedMediaTestServer(t, types.FileInfo{ID: 91, Path: file, Hash: "protected-content", Size: 3})
\trec := httptest.NewRecorder()'''
          replacement = '''\tserver := protectedMediaTestServer(t, types.FileInfo{ID: 91, Path: file, Hash: "protected-content", Size: 3})
\tencryptMediaFixture(t, file, server.cfg.Encryption.Key)
\trec := httptest.NewRecorder()'''
          if target not in text:
              raise SystemExit('protected content test insertion point not found')
          existing_test.write_text(text.replace(target, replacement, 1))

          new_test = r'''package serve

import (
    "bytes"
    "image/color"
    "net/http"
    "net/http/httptest"
    "os"
    "path/filepath"
    "testing"

    "gooru.local/internal/encryptedfile"
    "gooru.local/internal/securekey"
    "gooru.local/types"
)

func encryptMediaFixture(t *testing.T, path string, key []byte) {
    t.Helper()
    plaintext, err := os.ReadFile(path)
    if err != nil {
        t.Fatal(err)
    }
    out, err := os.Create(path)
    if err != nil {
        t.Fatal(err)
    }
    if err := encryptedfile.Encrypt(out, bytes.NewReader(plaintext), int64(len(plaintext)), key); err != nil {
        _ = out.Close()
        t.Fatal(err)
    }
    if err := out.Close(); err != nil {
        t.Fatal(err)
    }
}

func TestProtectedContentReadsEncryptedOriginalWithRange(t *testing.T) {
    plaintext := []byte("private-media-0123456789")
    path := writeNamedMediaFile(t, "secret.bin", plaintext)
    cfg := DefaultConfig(filepath.Join(t.TempDir(), "gooru.db"))
    cfg.Encryption.Enabled = true
    cfg.Encryption.Key = bytes.Repeat([]byte{0x42}, securekey.Size)
    encryptMediaFixture(t, path, cfg.Encryption.Key)

    ciphertext, err := os.ReadFile(path)
    if err != nil {
        t.Fatal(err)
    }
    if bytes.Contains(ciphertext, plaintext) {
        t.Fatal("encrypted original contains plaintext media bytes")
    }

    service := NewMediaService(cfg)
    recorder := httptest.NewRecorder()
    request := httptest.NewRequest(http.MethodGet, "/content", nil)
    request.Header.Set("Range", "bytes=8-12")
    service.ServeContent(recorder, request, types.FileInfo{Path: path, Size: int64(len(plaintext))})

    if recorder.Code != http.StatusPartialContent {
        t.Fatalf("status = %d: %s", recorder.Code, recorder.Body.String())
    }
    if got, want := recorder.Body.String(), string(plaintext[8:13]); got != want {
        t.Fatalf("range body = %q, want %q", got, want)
    }
    if got := recorder.Header().Get("Cache-Control"); got != "private, no-store" {
        t.Fatalf("Cache-Control = %q, want private, no-store", got)
    }
}

func TestProtectedComicReadsEncryptedArchiveWithoutPlaintextMaterialization(t *testing.T) {
    page := tinyPNG(t, 6, 4, color.RGBA{G: 255, A: 255})
    path := writeComic(t, map[string][]byte{"1.png": page})
    cfg := DefaultConfig(filepath.Join(t.TempDir(), "gooru.db"))
    cfg.Encryption.Enabled = true
    cfg.Encryption.Key = bytes.Repeat([]byte{0x24}, securekey.Size)
    cfg.Media.CacheDir = filepath.Join(t.TempDir(), "cache")
    cfg.Media.ThumbnailSizes = []int{4}
    cfg.Media.ThumbnailFormat = "png"
    encryptMediaFixture(t, path, cfg.Encryption.Key)

    service := NewMediaService(cfg)
    pageRecorder := httptest.NewRecorder()
    pageRequest := httptest.NewRequest(http.MethodGet, "/api/v1/comics/file-id/0?page=0", nil)
    service.ServeComic(pageRecorder, pageRequest, types.FileInfo{Path: path}, "file-id")
    if pageRecorder.Code != http.StatusOK {
        t.Fatalf("comic page status = %d: %s", pageRecorder.Code, pageRecorder.Body.String())
    }
    if !bytes.Equal(pageRecorder.Body.Bytes(), page) {
        t.Fatal("decrypted comic page differs from archived plaintext")
    }

    thumbRecorder := httptest.NewRecorder()
    thumbRequest := httptest.NewRequest(http.MethodGet, "/thumbnail?size=4", nil)
    service.ServeDerivative(thumbRecorder, thumbRequest, types.FileInfo{Path: path, Hash: "encrypted-comic"}, "thumbnail")
    if thumbRecorder.Code != http.StatusOK {
        t.Fatalf("comic thumbnail status = %d: %s", thumbRecorder.Code, thumbRecorder.Body.String())
    }
    if got := thumbRecorder.Header().Get("X-Gooru-Cache"); got != "bypass" {
        t.Fatalf("protected comic thumbnail cache = %q, want bypass", got)
    }
    if _, err := os.Stat(cfg.Media.CacheDir); !os.IsNotExist(err) {
        t.Fatalf("protected comic thumbnail must not create plaintext cache, stat error = %v", err)
    }
}
'''
          Path('internal/serve/media_source_encryption_test.go').write_text(new_test)
          PY
          gofmt -w internal/serve/media_source.go internal/serve/media.go internal/serve/comic.go internal/serve/media_encryption_test.go internal/serve/media_source_encryption_test.go
      - name: Validate Go
        run: |
          go build ./...
          go test ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:unit
          npm run check
          npm run build
      - name: Commit validated production changes
        run: |
          rm .github/workflows/maintainer-media-open-policy.yml
          git config user.name "Gooru autonomous maintainer"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git add -A
          git commit -m "refactor(media): centralize protected original reads"
          git push origin HEAD:refactor/28-media-open-policy
