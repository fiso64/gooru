name: maintainer media open policy

on:
  push:
    branches:
      - refactor/28-media-open-policy

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply storage-aware media read integration
        run: |
          python3 .github/maintainer_media_open_policy.py
          gofmt -w internal/serve/media_source.go internal/serve/media.go internal/serve/comic.go internal/serve/media_encryption_test.go internal/serve/media_source_encryption_test.go
      - name: Validate Go
        run: |
          go build ./...
          go test ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test:unit
          npm run check
          npm run build
      - name: Commit validated production changes
        run: |
          rm .github/workflows/maintainer-media-open-policy.yml .github/maintainer_media_open_policy.py
          git config user.name "Gooru autonomous maintainer"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git add -A
          git commit -m "refactor(media): centralize protected original reads"
          git push origin HEAD:refactor/28-media-open-policy
