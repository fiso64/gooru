name: Maintainer hidden-tag scale profile

on:
  push:
    branches:
      - perf/333-hidden-tag-facets-v2

permissions:
  contents: write

jobs:
  profile:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Add temporary handler-scale probe
        shell: bash
        run: |
          cat > internal/serve/maintainer_hidden_tag_scale_test.go <<'EOF'
          package serve

          import (
              "database/sql"
              "fmt"
              "net/http"
              "net/http/httptest"
              "testing"
              "time"

              _ "gosqlite.org"
          )

          func maintainerPopulateLibrary(t *testing.T, dbPath string, total int) {
              t.Helper()
              db, err := sql.Open("sqlite3", dbPath+"?_foreign_keys=on&_journal=WAL&_busy_timeout=5000")
              if err != nil { t.Fatal(err) }
              defer db.Close()
              tx, err := db.Begin()
              if err != nil { t.Fatal(err) }
              defer tx.Rollback()
              for i := 0; i < total; i++ {
                  hash := fmt.Sprintf("maintainer-%08d", i)
                  if _, err := tx.Exec("INSERT INTO contents(hash) VALUES (?)", hash); err != nil { t.Fatal(err) }
                  if _, err := tx.Exec("INSERT INTO locations(public_id, content_hash, path, size_bytes, mod_time, extension) VALUES (?, ?, ?, 1, 1, '.jpg')", fmt.Sprintf("file_%08d", i), hash, fmt.Sprintf("/scale/%08d.jpg", i)); err != nil { t.Fatal(err) }
              }
              res, err := tx.Exec("INSERT INTO tags(key, value) VALUES ('hidden', '')")
              if err != nil { t.Fatal(err) }
              tagID, err := res.LastInsertId()
              if err != nil { t.Fatal(err) }
              hidden := 100
              if total < hidden { hidden = total }
              for i := 0; i < hidden; i++ {
                  if _, err := tx.Exec("INSERT INTO content_tags(content_hash, tag_id) VALUES (?, ?)", fmt.Sprintf("maintainer-%08d", i), tagID); err != nil { t.Fatal(err) }
              }
              if err := tx.Commit(); err != nil { t.Fatal(err) }
          }

          func maintainerMeanHandler(t *testing.T, h http.Handler, target string) time.Duration {
              t.Helper()
              for i := 0; i < 3; i++ {
                  rec := httptest.NewRecorder()
                  h.ServeHTTP(rec, authedRequest(http.MethodGet, target))
                  if rec.Code != http.StatusOK { t.Fatalf("warmup %s: %d %s", target, rec.Code, rec.Body.String()) }
              }
              const runs = 20
              start := time.Now()
              for i := 0; i < runs; i++ {
                  rec := httptest.NewRecorder()
                  h.ServeHTTP(rec, authedRequest(http.MethodGet, target))
                  if rec.Code != http.StatusOK { t.Fatalf("GET %s: %d %s", target, rec.Code, rec.Body.String()) }
              }
              return time.Since(start) / runs
          }

          func maintainerMeasureHiddenScale(t *testing.T, total int) (time.Duration, time.Duration) {
              t.Helper()
              server, cleanup := newTestBrowseServer(t)
              defer cleanup()
              inner := server.library.(*GooruLibrary)
              maintainerPopulateLibrary(t, server.cfg.Database.Path, total)
              cfg := server.cfg
              cfg.UI.HiddenTags = []string{"hidden"}
              server = NewServerWithLibrary(cfg, inner)
              h := server.Handler()
              tags := maintainerMeanHandler(t, h, "/api/v1/tags?counts=true&limit=200")
              files := maintainerMeanHandler(t, h, "/api/v1/files?limit=60&sort=added&order=desc&include_facets=true")
              return tags, files
          }

          func TestMaintainerHiddenTagScale(t *testing.T) {
              tags1k, files1k := maintainerMeasureHiddenScale(t, 1000)
              tags10k, files10k := maintainerMeasureHiddenScale(t, 10000)
              t.Logf("hidden-tag handler means: 1K tags=%s files=%s; 10K tags=%s files=%s", tags1k, files1k, tags10k, files10k)
              if tags10k > tags1k*4+5*time.Millisecond {
                  t.Fatalf("tags hidden baseline regressed with library size: 1K=%s 10K=%s", tags1k, tags10k)
              }
              if files10k > files1k*4+5*time.Millisecond {
                  t.Fatalf("files hidden baseline regressed with library size: 1K=%s 10K=%s", files1k, files10k)
              }
          }
          EOF
          gofmt -w internal/serve/maintainer_hidden_tag_scale_test.go
          set +e
          timeout 300s go test -run TestMaintainerHiddenTagScale -count=1 -v ./internal/serve 2>&1 | tee .maintainer-hidden-tag-profile.log
          status=${PIPESTATUS[0]}
          set -e
          rm internal/serve/maintainer_hidden_tag_scale_test.go
          rm .github/workflows/maintainer-hidden-tag-scale.yml
          git config user.name "Gooru autonomous maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci: capture hidden-tag scale profile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit "$status"
