name: Integrate protected privacy into held grid PR

on:
  push:
    branches:
      - feat/278-grid-layout-types

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Merge current develop and remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop
          git merge --no-commit --no-ff origin/develop
          rm .github/workflows/maintainer-292-post-297-diagnose.yml
          rm .github/workflows/maintainer-292-post-297-integrate.yml
      - name: Validate Go
        run: |
          go test ./...
          go build ./...
      - name: Validate frontend and overlapping browser behavior
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          chromium="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          test -n "$chromium"
          CI=1 PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$chromium" npx playwright test tests/grid-layout-config.spec.ts tests/protected-browser-privacy.spec.ts --project=chromium
      - name: Commit clean integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: integrate protected browser privacy into grid PR"
          git push
