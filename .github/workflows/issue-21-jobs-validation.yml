name: issue-21 jobs validation

on:
  push:
    branches:
      - agent/issue-21-exact-concept-port

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wire Jobs app state, discrepancy decisions, and regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} not found')
              return text.replace(old, new, 1)

          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text()
          text = replace_once(text, "  let cancelRequestedJobID = $state('');\n  let fileMetadata = $state<{", "  let cancelRequestedJobID = $state('');\n  let jobsDrawerOpen = $state(false);\n  let fileMetadata = $state<{", 'jobs drawer state')
          text = replace_once(text, "    fileMetadata = null;\n    cancelRequestedJobID = '';\n    closeActionDialog();", "    fileMetadata = null;\n    cancelRequestedJobID = '';\n    jobsDrawerOpen = false;\n    closeActionDialog();", 'jobs drawer auth reset')
          text = replace_once(text, "  function handleKeydown(event: KeyboardEvent) {\n    library.handleKeydown(event, loadedFiles);\n  }\n\n  function closeActionDialog() {", "  function handleKeydown(event: KeyboardEvent) {\n    library.handleKeydown(event, loadedFiles);\n  }\n\n  function setRoute(route: string) {\n    jobsDrawerOpen = false;\n    library.setRoute(route);\n  }\n\n  function toggleJobsDrawer() {\n    jobsDrawerOpen = !jobsDrawerOpen;\n  }\n\n  function closeJobsDrawer() {\n    jobsDrawerOpen = false;\n  }\n\n  function closeActionDialog() {", 'jobs drawer helpers')
          text = replace_once(text, "    jobsActiveCount={activeJobs.length}\n    kindCounts={page?.facets?.kind ?? []}", "    jobsActiveCount={activeJobs.length}\n    jobs={jobsQuery.data?.items ?? []}\n    jobsDrawerOpen={jobsDrawerOpen}\n    kindCounts={page?.facets?.kind ?? []}", 'AppShell jobs props')
          text = replace_once(text, "    onRoute={library.setRoute}", "    onRoute={setRoute}", 'AppShell route wrapper')
          text = replace_once(text, "    onSearchCommit={library.commitSearch}\n    onJobs={library.toggleJobsRoute}", "    onSearchCommit={library.commitSearch}\n    onJobs={toggleJobsDrawer}\n    onCloseJobs={closeJobsDrawer}\n    onCancelJob={cancelJob}", 'AppShell Jobs callbacks')
          app.write_text(text)

          workflow = Path('frontend/src/lib/state/libraryWorkflow.svelte.ts')
          text = workflow.read_text()
          text = replace_once(text, "\n  function toggleJobsRoute() {\n    route = route === 'jobs' ? 'library' : 'jobs';\n  }\n", "\n", 'obsolete Jobs route helper')
          text = replace_once(text, "    handleKeydown,\n    setRoute,\n    toggleJobsRoute", "    handleKeydown,\n    setRoute", 'obsolete Jobs route export')
          workflow.write_text(text)

          docs = Path('docs/issue-21-concept-discrepancies.md')
          text = docs.read_text()
          additions = "\n".join([
              "29. Jobs page and top-bar drawer row rendering: B. Use one shared concept-shaped row component so status, progress, timestamps, and cancel behavior cannot drift between the page and drawer.",
              "30. Jobs pause-all control: A. The concept affordance remains visible in the drawer but disabled/coming soon because the backend has no pause/resume endpoint.",
              "31. Concept job `done / total` counters: C. The backend exposes a normalized progress ratio but not authoritative item totals, so the real UI must render percentage/progress and timestamps rather than invent prototype counts.",
              "32. Running-job cancel and clear-completed actions: B. Preserve the supported backend actions, but keep them visually subordinate (row/header hover or focus) so the resting Jobs surfaces remain faithful to the concept.",
          ])
          if '29. Jobs page and top-bar drawer row rendering:' not in text:
              text = text.rstrip() + '\n' + additions + '\n'
          docs.write_text(text)

          spec = Path('frontend/tests/shell.spec.ts')
          text = spec.read_text()
          encoded = ''
          test_body = base64.b64decode(encoded).decode()
          if "test('Jobs drawer preserves route and shares real job actions with the page'" not in text:
              text += test_body
          spec.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend with zero warnings
        working-directory: frontend
        run: |
          npm run check | tee /tmp/svelte-check.log
          grep -q "svelte-check found 0 errors and 0 warnings" /tmp/svelte-check.log
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Build Go packages
        run: go build ./...
      - name: Run Go tests
        run: go test ./...
      - name: Persist validated Jobs wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/state/libraryWorkflow.svelte.ts docs/issue-21-concept-discrepancies.md frontend/tests/shell.spec.ts
          git commit -m "#21 wire exact Jobs page and drawer [skip ci]"
          git push
