name: Temporary PR 374 validation

on:
  push:
    branches:
      - perf/333-cover-tag-filter-index

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exact tag covering-index plan regression
        run: go test ./internal/database -run '^TestExactTagFilterUsesCoveringAssociationIndex$' -count=1
      - name: Database suite
        run: go test ./internal/database
      - name: Core query tests
        run: go test ./gooru
      - name: Server tests
        run: go test ./internal/serve
