name: Validate #240 thumbnail cover resolution

on:
  push:
    branches:
      - fix/240-thumbnail-cover-resolution

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/grid-size-config.spec.ts --project=chromium
      - name: Remove temporary validation workflow
        working-directory: .
        run: |
          rm .github/workflows/validate-240.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add .github/workflows/validate-240.yml
          git commit -m "ci: remove #240 validation workflow"
          git push
