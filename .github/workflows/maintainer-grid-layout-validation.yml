name: Maintainer grid layout validation

on:
  push:
    branches:
      - feat/278-grid-layout-types
    paths:
      - .github/workflows/maintainer-grid-layout-validation.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/278-grid-layout-types
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Select Chromium
        shell: bash
        run: |
          chrome="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -n "$chrome" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          else
            cd frontend
            npx playwright install chromium
          fi
      - name: Run focused grid layout browser regression
        working-directory: frontend
        run: npx playwright test tests/grid-layout-config.spec.ts --project=chromium
