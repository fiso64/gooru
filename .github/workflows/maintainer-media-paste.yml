name: Maintainer global media paste

on:
  push:
    branches:
      - feat/21-global-media-paste

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/21-global-media-paste
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go build ./...
      - run: go test ./...
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test:unit
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm run build
