name: Fix 344 branch

on:
  push:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/344-pagination-toggle-order
          fetch-depth: 0
      - name: Apply requested ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = path.read_text()
          start = text.index('            <div class="seg" aria-label="Sort field">')
          mode = text.index('            <div class="seg" aria-label="Library display mode">', start)
          end = text.index('            </div>', mode) + len('            </div>')
          sort = text[start:mode]
          display = text[mode:end]
          path.write_text(text[:start] + display + '\n' + sort.rstrip('\n') + text[end:])

          spec = Path('frontend/tests/paged-library.spec.ts')
          text = spec.read_text()
          marker = "  await page.goto('/?page=3');\n  await expect(page.getByRole('button', { name: 'Page 3', exact: true })).toHaveAttribute('aria-current', 'page');"
          replacement = "  await page.goto('/?page=3');\n  const actionGroups = page.locator('.library-head-actions > [aria-label]');\n  await expect(actionGroups.nth(0)).toHaveAttribute('aria-label', 'Library display mode');\n  await expect(actionGroups.nth(1)).toHaveAttribute('aria-label', 'Sort field');\n  await expect(page.getByRole('button', { name: 'Page 3', exact: true })).toHaveAttribute('aria-current', 'page');"
          if marker not in text:
              raise SystemExit('test insertion marker missing')
          spec.write_text(text.replace(marker, replacement, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          npm run build
          npx playwright test tests/paged-library.spec.ts --project=chromium
      - name: Commit
        run: |
          rm .github/workflows/fix-344-toggle-order.yml .github/workflows/fix-344-run.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(ui): place pagination mode before sort controls'
          git push origin HEAD:fix/344-pagination-toggle-order