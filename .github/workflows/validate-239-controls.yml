name: Validate comic controls continuity

on:
  push:
    branches:
      - feat/231-comic-ui

permissions:
  contents: read

concurrency:
  group: validate-239-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Locate system Chromium
        shell: bash
        run: |
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [[ -z "$browser" ]]; then
            echo 'No system Chromium found on runner' >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
      - name: Run focused comic UI regression
        run: npm run test:e2e -- comic-ui.spec.ts --project=chromium
