name: Temporary #272 Nix browser validation

on:
  push:
    branches:
      - feat/272-upload-drop-control
    paths:
      - '.github/workflows/tmp-272-nix-e2e.yml'

permissions:
  contents: write

jobs:
  validate-and-fix:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/272-upload-drop-control
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply accessible drop-zone semantics
        run: |
          nix shell nixpkgs#python3 --command python3 - <<'PY'
          from pathlib import Path

          panel = Path('frontend/src/lib/components/UploadPanel.svelte')
          text = panel.read_text()
          old = '''      <section\n        class={`upload-zone ${dragActive ? 'is-drag' : ''}`}\n        style="position: relative;"\n'''
          new = '''      <section\n        class={`upload-zone ${dragActive ? 'is-drag' : ''}`}\n        role="group"\n        aria-label="File upload drop zone"\n        style="position: relative;"\n'''
          if old not in text:
              raise SystemExit('expected upload-zone section not found')
          panel.write_text(text.replace(old, new, 1))

          spec = Path('frontend/tests/upload-drop-control.spec.ts')
          text = spec.read_text()
          old = '''  const dropZone = page.locator('.upload-zone');\n  const behavior = dropZone.getByLabel('Upload drop behavior');\n  const browseSurface = dropZone.getByRole('button', { name: 'Browse files from drop zone' });\n\n  await expect(dropZone).not.toHaveAttribute('role', 'button');\n  await expect(dropZone).not.toHaveAttribute('tabindex');\n'''
          new = '''  const dropZone = page.getByRole('group', { name: 'File upload drop zone' });\n  const behavior = dropZone.getByLabel('Upload drop behavior');\n  const browseSurface = dropZone.getByRole('button', { name: 'Browse files from drop zone' });\n\n  await expect(dropZone).toBeVisible();\n  await expect(dropZone).not.toHaveAttribute('tabindex');\n'''
          if old not in text:
              raise SystemExit('expected drop-zone test block not found')
          spec.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: npm run check
      - name: Create Nix Chromium Playwright config
        working-directory: frontend
        run: |
          cat > playwright.nix-ci.config.ts <<'EOF'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: './tests',
            timeout: 30_000,
            use: {
              baseURL: 'http://127.0.0.1:4173',
              trace: 'on-first-retry'
            },
            webServer: {
              command: 'npm run build && npm run preview -- --host 127.0.0.1',
              url: 'http://127.0.0.1:4173',
              reuseExistingServer: false,
              timeout: 120_000
            },
            projects: [
              {
                name: 'chromium',
                use: {
                  ...devices['Desktop Chrome'],
                  launchOptions: { executablePath: process.env.CHROMIUM_BIN }
                }
              }
            ]
          });
          EOF
      - name: Run focused browser regression with Nix Chromium
        working-directory: frontend
        run: |
          nix shell nixpkgs#chromium --command bash -c 'CHROMIUM_BIN=$(command -v chromium) npm run test:e2e -- upload-drop-control.spec.ts --config=playwright.nix-ci.config.ts'
      - name: Commit validated fix and remove temporary workflow
        run: |
          rm frontend/playwright.nix-ci.config.ts
          rm .github/workflows/tmp-272-nix-e2e.yml
          git config user.name 'Gooru Maintainer'
          git config user.email 'maintainer@users.noreply.github.com'
          git add frontend/src/lib/components/UploadPanel.svelte frontend/tests/upload-drop-control.spec.ts .github/workflows/tmp-272-nix-e2e.yml
          git commit -m 'fix: preserve accessible upload drop-zone semantics'
          git push origin HEAD:feat/272-upload-drop-control
