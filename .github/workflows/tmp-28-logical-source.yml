name: Temporary #28 logical source validation

on:
  push:
    branches:
      - refactor/28-logical-file-source

permissions:
  contents: read

concurrency:
  group: tmp-28-logical-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Gofmt changed files
        run: |
          mapfile -t files < <(git diff --name-only origin/develop...HEAD -- '*.go')
          if [ ${#files[@]} -eq 0 ]; then
            exit 0
          fi
          bad=$(gofmt -l "${files[@]}")
          if [ -n "$bad" ]; then
            echo "::error::gofmt required: $bad"
            exit 1
          fi
      - name: Focused tests
        run: go test ./internal/filesource ./internal/hashing ./internal/scanning ./internal/serve ./gooru ./cmd/gooru/cmd
      - name: Full tests
        run: go test ./...
      - name: Build
        run: go build ./...
