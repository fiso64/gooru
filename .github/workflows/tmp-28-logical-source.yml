name: Temporary #28 logical source validation

on:
  push:
    branches:
      - refactor/28-logical-file-source

permissions:
  contents: read

jobs:
  go:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Gofmt
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then
            echo "::error::gofmt required: $bad"
            exit 1
          fi
      - name: Focused tests
        run: go test ./internal/filesource ./internal/hashing ./internal/scanning ./internal/serve ./gooru ./cmd/gooru/cmd
      - name: Full tests
        run: go test ./...
      - name: Build
        run: go build ./...
