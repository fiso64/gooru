name: patch cbz type
on:
  push:
    branches: [feat/22-cbz-kind]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cbz-type-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Svelte diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/components/AppShell.svelte')
          text = path.read_text()
          old = ".filter((term) => term && term.toLowerCase() !== 'ext:cbz')"
          new = ".filter((term: string) => term && term.toLowerCase() !== 'ext:cbz')"
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/patch-cbz-type.yml
          git config user.name 'chatgpt-codex-connector'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git add frontend/src/lib/components/AppShell.svelte .github/workflows/patch-cbz-type.yml
          git commit -m 'fix(sidebar): type Comics search terms [cbz-type-patched]'
          git push origin HEAD:feat/22-cbz-kind
