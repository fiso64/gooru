name: Patch maintainer startup state reconciliation

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add startup state reconciliation patch'
    runs-on: gooru-moderator
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Patch maintainer prompt
        shell: bash
        run: |
          set -euo pipefail
          path='.github/maintainer-prompt.md'
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=develop" --jq '.sha')"
          content="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=develop")"

          startup_anchor='- inspect recent merges/current checkpoint only as needed to understand active integration state.'
          startup_insert='- before substantive work, compare #29 against the live moderator index and any exact item/branch state already fetched. If a current priority/resume point, owner hold/focus, item status, or unfinished no-PR branch recorded in #29 is now known stale or contradicted, fetch #29 again and correct/remove that stale state immediately. Startup discovery is not complete while known stale recovery state remains in #29.'
          [[ "$content" == *"$startup_anchor"* ]]
          content="${content/"$startup_anchor"/"$startup_anchor"$'\n'"$startup_insert"}"

          recovery_anchor='**Never overwrite #29 from memory, stale context, or a reconstructed copy. Immediately before every edit, fetch/read its current body fresh and base the edit on that exact contents.** Keep it compact: current priority/resume point, explicit owner holds/focus not safely recoverable from live state, and relevant unfinished branches with no PR. Detailed history belongs in issues, PRs, commits/tests/review discussions. Do not use #29 comments for maintainer-written recovery state; the trusted moderator-state comment is reserved for the mechanical moderator index.'
          recovery_insert='Known stale recovery claims are a maintenance defect, not harmless cache. Whenever live discovery proves a #29 statement stale, correct or remove it at that same checkpoint rather than waiting for an eventual end-of-task update.'
          [[ "$content" == *"$recovery_anchor"* ]]
          content="${content/"$recovery_anchor"/"$recovery_anchor"$'\n\n'"$recovery_insert"}"

          encoded="$(printf '%s' "$content" | base64 | tr -d '\n')"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='Require startup recovery-state reconciliation' \
            -f content="$encoded" \
            -f sha="$sha" \
            -f branch=develop >/dev/null
