name: Maintainer managed file deletion

on:
  push:
    branches:
      - feat/21-delete-uploaded-files

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/21-delete-uploaded-files
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply implementation if needed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('temp/apply-managed-delete.py')
          s = p.read_text()
          s = s.replace("'    MediaURLs       MediaURLs     `json:\"media_urls\"`\\n'", "'\\tMediaURLs       MediaURLs     `json:\"media_urls\"`\\n'")
          s = s.replace("'    MediaURLs       MediaURLs     `json:\"media_urls\"`\\n    CanDelete       bool          `json:\"can_delete\"`\\n'", "'\\tMediaURLs       MediaURLs     `json:\"media_urls\"`\\n\\tCanDelete       bool          `json:\"can_delete\"`\\n'")
          p.write_text(s)
          PY
          python3 temp/apply-managed-delete.py
      - name: Generate and commit implementation
        shell: bash
        run: |
          gofmt -w internal/serve/file_delete.go internal/serve/file_delete_test.go internal/serve/browse.go
          cd frontend
          npm ci
          npm run generate:api
          cd ..
          git restore temp/apply-managed-delete.py
          if ! git diff --quiet; then
            git config user.name autonomous-maintainer
            git config user.email 64778819+fiso64@users.noreply.github.com
            git add internal/serve/file_delete.go internal/serve/file_delete_test.go internal/serve/browse.go docs/openapi.yaml docs/SERVE.md frontend/src/lib/api/client.ts frontend/src/lib/api/openapi.ts frontend/src/lib/queries/files.ts frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/components/PreviewDialog.svelte
            git commit -m "feat(files): safely delete managed uploaded files"
            git push origin HEAD:feat/21-delete-uploaded-files
          fi
      - name: Go build
        run: go build ./...
      - name: Go tests
        run: go test ./...
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend build
        working-directory: frontend
        run: npm run build
