name: Maintainer 401 durable tag HTTP

on:
  push:
    branches:
      - maintainer/401-durable-tag-mutations

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: "github.event.head_commit.message == 'chore: retry #401 durable tag HTTP patch'"
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Apply durable tag HTTP patch
        run: python3 .github/maintainer/401-durable-tag-http.py
      - name: Format
        run: |
          gofmt -w \
            gooru/background_tag_mutation.go \
            gooru/background_tag_mutation_test.go \
            internal/serve/background_tag_mutations.go \
            internal/serve/tag_mutations.go \
            internal/serve/background_operations.go \
            internal/serve/background_thumbnails.go \
            internal/serve/background_operation_recovery.go \
            internal/serve/background_operation_recovery_test.go \
            internal/serve/tag_mutations_test.go
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate OpenAPI client
        working-directory: frontend
        run: npm run generate:api
      - name: Validate affected Go packages
        run: go test -count=1 ./gooru ./internal/database ./internal/serve
      - name: Build Go
        run: go build ./...
      - name: Check frontend
        working-directory: frontend
        run: npm run check
      - name: Unit test frontend
        working-directory: frontend
        run: npm run test:unit
      - name: Check patch
        run: git diff --check
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add \
            gooru/background_tag_mutation.go \
            gooru/background_tag_mutation_test.go \
            internal/serve/background_tag_mutations.go \
            internal/serve/tag_mutations.go \
            internal/serve/background_operations.go \
            internal/serve/background_thumbnails.go \
            internal/serve/background_operation_recovery.go \
            internal/serve/background_operation_recovery_test.go \
            internal/serve/tag_mutations_test.go \
            docs/openapi.yaml \
            frontend/src/lib/api/openapi.ts
          git commit -m 'feat: cut tag mutations over to durable operations'
          git push origin HEAD:maintainer/401-durable-tag-mutations
