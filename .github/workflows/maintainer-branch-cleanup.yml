name: Maintainer branch cleanup

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, gooru]
    steps:
      - name: Delete completed validation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/validate-issue-279-viewer-shadow"
