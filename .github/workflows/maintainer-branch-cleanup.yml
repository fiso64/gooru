name: Maintainer branch cleanup

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, gooru]
    steps:
      - name: Delete integrated validation branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in validate-issue-279-booru-variants validate-issue-279-plain-search; do
            curl --fail-with-body --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
