name: Temporary #416 landing validation

on:
  push:
    branches:
      - feat/416-bound-actual-size

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/416-bound-actual-size
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply reviewed implementation and corrected browser regression
        shell: bash
        run: |
          git show fc49899ce24d9ff3ff19ae0ca332eb402215941b:.github/workflows/tmp-416-implement.yml > /tmp/old-416.yml
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          text = Path('/tmp/old-416.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          Path('/tmp/implement-416.py').write_text(textwrap.dedent(text[start:end]))
          PY
          python3 /tmp/implement-416.py
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/components/ViewerStage.svelte')
          text = p.read_text()
          old = "  const minimumZoom = $derived(fitMode === 'actual' && !boundActualSizeToFit ? Math.min(1, fitGeometry.scale) : 1);\n  const panLimits"
          new = "  const minimumZoom = $derived(fitMode === 'actual' && !boundActualSizeToFit ? Math.min(1, fitGeometry.scale) : 1);\n  // Geometry carries the capped Actual-mode baseline. Scale the local ceiling inversely so\n  // manual zoom preserves the same absolute 32x ceiling and can always pass back through 1:1.\n  const maximumZoom = $derived(fitMode === 'actual' && boundActualSizeToFit && geometry.scale > 0 ? Math.max(32, 32 / geometry.scale) : 32);\n  const panLimits"
          if old not in text: raise SystemExit('missing #416 zoom insertion anchor')
          text = text.replace(old, new, 1)
          old = "Math.max(minimumZoom, Math.min(32, zoom * Math.exp(-event.deltaY * 0.0075)))"
          new = "Math.max(minimumZoom, Math.min(maximumZoom, zoom * Math.exp(-event.deltaY * 0.0075)))"
          if old not in text: raise SystemExit('missing #416 wheel clamp anchor')
          p.write_text(text.replace(old, new, 1))

          p = Path('frontend/tests/viewer-fit-mode.spec.ts')
          text = p.read_text()
          marker = r'\n\nasync function openOversizedActualViewer'
          if marker not in text: raise SystemExit('missing #416 generated E2E marker')
          prefix, suffix = text.split(marker, 1)
          text = prefix + '\n\nasync function openOversizedActualViewer' + suffix.replace(r'\n', '\n')
          old = "await stage.dispatchEvent('wheel', { deltaY: -120, ctrlKey: true, clientX: stageBox!.x + stageBox!.width / 2, clientY: stageBox!.y + stageBox!.height / 2 });"
          new = "await page.locator('.viewer-pan-viewport').dispatchEvent('wheel', { deltaY: -120, ctrlKey: true, clientX: stageBox!.x + stageBox!.width / 2, clientY: stageBox!.y + stageBox!.height / 2 });"
          if old not in text: raise SystemExit('missing #416 E2E wheel-target anchor')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/serve/config.go internal/serve/ui_config.go internal/serve/ui_config_test.go
      - name: Focused Go validation
        run: go test ./internal/serve
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend check, unit tests, and build
        working-directory: frontend
        run: npm run check && npm run test:unit && npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Focused Chromium viewer regression
        working-directory: frontend
        run: npx playwright test tests/viewer-fit-mode.spec.ts --project=chromium
      - name: Commit product changes and remove temporary machinery
        shell: bash
        run: |
          rm -f .github/workflows/tmp-416-implement.yml .github/workflows/tmp-416-finalize.yml .github/workflows/tmp-416-frontend.yml .github/workflows/tmp-416-land.yml .github/diagnostics/416-playwright.log
          git add -A
          git diff --cached --check
          git config user.name 'chatgpt-codex-connector'
          git config user.email 'chatgpt-codex-connector@users.noreply.github.com'
          git commit -m 'feat(viewer): bound actual-size baseline by fit scale'
          git push origin HEAD:feat/416-bound-actual-size
