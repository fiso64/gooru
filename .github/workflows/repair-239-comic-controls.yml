name: Validate 239 comic controls

on:
  push:
    branches:
      - feat/231-comic-ui

permissions:
  contents: read

concurrency:
  group: validate-239-comic-controls
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/231-comic-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check and unit tests
        working-directory: frontend
        run: npm run check && npm run test:unit
      - name: Focused Chromium comic regression
        working-directory: frontend
        run: npm run test:e2e -- comic-ui.spec.ts --project=chromium
      - name: Frontend build
        working-directory: frontend
        run: npm run build
