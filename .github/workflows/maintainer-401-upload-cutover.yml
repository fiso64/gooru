name: Maintainer 401 upload cutover

on:
  push:
    branches:
      - maintainer/401-remove-legacy-jobs

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'chore: implement #401 upload cutover cleanup'
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply upload durable-operation cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'{path}: expected replacement target not found')
              text = text.replace(old, new, count)
              p.write_text(text)

          # Upload fallback: importer-only doubles/embedders are synchronous-only.
          p = Path('internal/serve/uploads.go')
          text = p.read_text()
          start = text.index('func (s *Server) handleUpload(w http.ResponseWriter, r *http.Request) {')
          end = text.index('\nfunc (s *Server) uploadRequestBodyLimit()', start)
          replacement = r'''func (s *Server) handleUpload(w http.ResponseWriter, r *http.Request) {
          	if r.Method != http.MethodPost {
          		w.Header().Set("Allow", http.MethodPost)
          		writeError(w, http.StatusMethodNotAllowed, "method_not_allowed", "method not allowed", nil)
          		return
          	}
          	importer, ok := s.library.(UploadLibrary)
          	if s.library == nil || !ok {
          		writeError(w, http.StatusServiceUnavailable, "service_unavailable", "upload import service is not configured", nil)
          		return
          	}
          	if !s.cfg.Uploads.Enabled {
          		writeError(w, http.StatusForbidden, "uploads_disabled", "uploads are disabled", nil)
          		return
          	}
          	if !hasUploadTarget(s.cfg.Uploads.Targets) {
          		writeError(w, http.StatusForbidden, "uploads_disabled", "upload target is not configured", nil)
          		return
          	}
          	// Real GooruLibrary uploads are selected into handleDurableUpload before
          	// reaching this fallback. Importer-only doubles and embedders cannot
          	// safely promise asynchronous recovery, so reject that capability
          	// before reading or staging the request body instead of creating a
          	// second in-memory upload work model.
          	if PreferAsync(r) {
          		writeError(w, http.StatusServiceUnavailable, "service_unavailable", "asynchronous uploads require durable background operations", nil)
          		return
          	}
          	if limit := s.uploadRequestBodyLimit(); limit > 0 {
          		r.Body = http.MaxBytesReader(w, r.Body, limit)
          	}
          	tags, saved, err := s.stageMultipartUpload(r)
          	if err != nil {
          		writeMultipartUploadError(w, err)
          		return
          	}
          	if err := query.ValidateTags(tags); err != nil {
          		removeSavedUploads(saved)
          		writeError(w, http.StatusBadRequest, "invalid_request", err.Error(), nil)
          		return
          	}
          	if len(saved) == 1 && saved[0].status == "error" && saved[0].error == errUploadTooLarge.Error() {
          		fileErr := uploadFileError{name: saved[0].name, err: errUploadTooLarge}
          		writeError(w, http.StatusRequestEntityTooLarge, "payload_too_large", fileErr.Error(), uploadErrorDetails(fileErr))
          		return
          	}
          	activated, err := activateSavedReplacements(saved)
          	if err != nil {
          		removeSavedUploads(saved)
          		writeError(w, http.StatusInternalServerError, "internal_error", "failed to import uploaded files", nil)
          		return
          	}
          	response, err := importer.ImportUploadedFiles(r.Context(), stagedUploads(saved), tags)
          	if err != nil {
          		rollbackErr := rollbackSavedReplacements(activated)
          		removeSavedUploads(saved)
          		if rollbackErr != nil {
          			err = fmt.Errorf("%w; replacement rollback failed: %v", err, rollbackErr)
          		}
          		if errors.Is(err, context.Canceled) || errors.Is(err, context.DeadlineExceeded) {
          			writeError(w, http.StatusRequestTimeout, "request_canceled", "request was canceled", nil)
          			return
          		}
          		writeError(w, http.StatusInternalServerError, "internal_error", "failed to import uploaded files", nil)
          		return
          	}
          	if err := settleSavedReplacements(activated, response); err != nil {
          		writeError(w, http.StatusInternalServerError, "internal_error", "failed to finalize uploaded files", nil)
          		return
          	}
          	writeJSON(w, http.StatusOK, response)
          }'''.replace('          \t', '\t')
          text = text[:start] + replacement + text[end:]
          p.write_text(text)

          # Give durable upload admission its own config instead of borrowing JobManager limits.
          replace('internal/serve/config.go',
              'type UploadsConfig struct {\n\tEnabled          bool           `yaml:"enabled"`\n\tTargets          []UploadTarget `yaml:"targets"`\n\tMaxFileSizeBytes int64          `yaml:"max_file_size_bytes"`',
              'type UploadsConfig struct {\n\tEnabled          bool           `yaml:"enabled"`\n\tTargets          []UploadTarget `yaml:"targets"`\n\tMaxFileSizeBytes int64          `yaml:"max_file_size_bytes"`\n\tMaxQueued        int            `yaml:"max_queued"`')
          replace('internal/serve/config.go',
              'Uploads: UploadsConfig{Enabled: false, ConflictPolicy: "rename", PreserveModTime: true},',
              'Uploads: UploadsConfig{Enabled: false, MaxQueued: 100, ConflictPolicy: "rename", PreserveModTime: true},')
          replace('internal/serve/config.go',
              '\tif cfg.Uploads.Enabled && !hasUploadTarget(cfg.Uploads.Targets) {',
              '\tif cfg.Uploads.MaxQueued <= 0 {\n\t\terrs = append(errs, errors.New("uploads.max_queued must be greater than zero"))\n\t}\n\tif cfg.Uploads.Enabled && !hasUploadTarget(cfg.Uploads.Targets) {')
          replace('internal/serve/uploads_durable.go',
              '\tif s.cfg.Jobs.MaxQueued > 0 {\n\t\treturn s.cfg.Jobs.MaxQueued\n\t}',
              '\tif s.cfg.Uploads.MaxQueued > 0 {\n\t\treturn s.cfg.Uploads.MaxQueued\n\t}')

          # Bounded operation-by-ID batch read, including durable completed results.
          p = Path('internal/serve/background_operations.go')
          text = p.read_text()
          text = text.replace('const defaultBackgroundOperationAPILimit = 100', 'const (\n\tdefaultBackgroundOperationAPILimit = 100\n\tmaxBackgroundOperationStatusBatch = 64\n)')
          marker = '\tlimit := defaultBackgroundOperationAPILimit\n'
          batch = r'''	if rawIDs, ok := r.URL.Query()["id"]; ok {
          		ids := make([]string, 0, len(rawIDs))
          		seen := make(map[string]struct{}, len(rawIDs))
          		for _, rawID := range rawIDs {
          			id := strings.TrimSpace(rawID)
          			if id == "" {
          				writeError(w, http.StatusBadRequest, "invalid_request", "operation id must not be blank", nil)
          				return
          			}
          			if _, exists := seen[id]; exists {
          				continue
          			}
          			seen[id] = struct{}{}
          			ids = append(ids, id)
          			if len(ids) > maxBackgroundOperationStatusBatch {
          				writeError(w, http.StatusBadRequest, "invalid_request", "at most 64 operation ids may be requested", nil)
          				return
          			}
          		}
          		items := make([]BackgroundOperationDTO, 0, len(ids))
          		for _, id := range ids {
          			operation, found, err := s.backgroundOperations.GetBackgroundOperation(id)
          			if err != nil {
          				writeError(w, http.StatusInternalServerError, "internal_error", "failed to load background operation", nil)
          				return
          			}
          			if !found || !operation.Visible {
          				continue
          			}
          			dto := backgroundOperationDTO(operation)
          			if operation.Status == core.BackgroundWorkCompleted {
          				var result json.RawMessage
          				found, err := s.backgroundOperations.GetBackgroundOperationResult(id, &result)
          				if err != nil {
          					writeError(w, http.StatusInternalServerError, "internal_error", "failed to load background operation result", nil)
          					return
          				}
          				if found {
          					dto.Result = result
          				}
          			}
          			items = append(items, dto)
          		}
          		writeJSON(w, http.StatusOK, BackgroundOperationListResponse{Items: items})
          		return
          	}
          '''.replace('          \t', '\t')
          if marker not in text:
              raise SystemExit('background_operations.go: list marker missing')
          text = text.replace(marker, batch + marker, 1)
          p.write_text(text)

          # Focused backend regressions.
          p = Path('internal/serve/background_operations_test.go')
          text = p.read_text()
          insert = r'''
          func TestHandleOperationsBatchesRequestedIDsWithCompletedResults(t *testing.T) {
          	finishedAt := time.Now().UTC()
          	reader := &fakeBackgroundOperationReader{
          		byID: map[string]core.BackgroundOperationState{
          			"operation-upload": {ID: "operation-upload", Kind: "upload_import", Visible: true, Status: core.BackgroundWorkCompleted, CreatedAt: finishedAt.Add(-time.Second), FinishedAt: &finishedAt},
          			"operation-running": {ID: "operation-running", Kind: "upload_import", Visible: true, Status: core.BackgroundWorkRunning, CreatedAt: finishedAt.Add(-time.Second)},
          			"operation-hidden": {ID: "operation-hidden", Kind: "thumbnail", Visible: false, Status: core.BackgroundWorkCompleted, CreatedAt: finishedAt},
          		},
          		results: map[string]json.RawMessage{
          			"operation-upload": json.RawMessage(`{"affected_count":1,"files":[{"name":"a.jpg","size":1,"target_id":"default","status":"imported"}]}`),
          		},
          	}
          	server := &Server{backgroundOperations: reader}
          	request := httptest.NewRequest(http.MethodGet, "/api/v1/operations?id=operation-running&id=operation-upload&id=operation-hidden&id=missing", nil)
          	response := httptest.NewRecorder()

          	server.handleOperations(response, request)

          	if response.Code != http.StatusOK {
          		t.Fatalf("status = %d body=%s", response.Code, response.Body.String())
          	}
          	var payload BackgroundOperationListResponse
          	if err := json.Unmarshal(response.Body.Bytes(), &payload); err != nil {
          		t.Fatalf("decode response: %v", err)
          	}
          	if len(payload.Items) != 2 || payload.Items[0].ID != "operation-running" || payload.Items[1].ID != "operation-upload" {
          		t.Fatalf("items = %+v", payload.Items)
          	}
          	var result UploadImportResponse
          	if err := json.Unmarshal(payload.Items[1].Result, &result); err != nil {
          		t.Fatalf("decode upload result: %v", err)
          	}
          	if result.AffectedCount != 1 || len(result.Files) != 1 || result.Files[0].Name != "a.jpg" {
          		t.Fatalf("result = %+v", result)
          	}
          }

          func TestHandleOperationsRejectsOversizedIDBatch(t *testing.T) {
          	server := &Server{backgroundOperations: &fakeBackgroundOperationReader{}}
          	request := httptest.NewRequest(http.MethodGet, "/api/v1/operations", nil)
          	query := request.URL.Query()
          	for i := 0; i <= maxBackgroundOperationStatusBatch; i++ {
          		query.Add("id", fmt.Sprintf("operation-%d", i))
          	}
          	request.URL.RawQuery = query.Encode()
          	response := httptest.NewRecorder()

          	server.handleOperations(response, request)

          	if response.Code != http.StatusBadRequest {
          		t.Fatalf("status = %d body=%s", response.Code, response.Body.String())
          	}
          }
          '''.replace('          \t', '\t')
          text = text.replace('import (\n', 'import (\n\t"fmt"\n', 1)
          text += insert
          p.write_text(text)

          p = Path('internal/serve/uploads_test.go')
          text = p.read_text()
          test = r'''
          func TestUploadAsyncFallbackRejectsBeforeReadingBody(t *testing.T) {
          	server := newUploadTestServer(t, t.TempDir(), true, &recordingUploadLibrary{})
          	body := &uploadReadTracker{}
          	request := httptest.NewRequest(http.MethodPost, "/api/v1/uploads", body)
          	request.Header.Set("Content-Type", "multipart/form-data; boundary=unused")
          	request.Header.Set("Prefer", "respond-async")
          	response := httptest.NewRecorder()

          	server.Handler().ServeHTTP(response, request)

          	assertAPIError(t, response, http.StatusServiceUnavailable, "service_unavailable")
          	if body.read {
          		t.Fatal("async importer-only fallback read request body before rejecting unsupported durable capability")
          	}
          }
          '''.replace('          \t', '\t')
          text += test
          p.write_text(text)

          replace('internal/serve/config_test.go',
              '\tif cfg.Uploads.ConflictPolicy != "rename" {',
              '\tif cfg.Uploads.MaxQueued != 100 {\n\t\tt.Fatalf("unexpected upload queue default %d", cfg.Uploads.MaxQueued)\n\t}\n\tif cfg.Uploads.ConflictPolicy != "rename" {')
          replace('internal/serve/config_test.go',
              'func TestLoadConfigRejectsInvalidJobLimits(t *testing.T) {',
              'func TestLoadConfigRejectsInvalidUploadQueueLimit(t *testing.T) {\n\tcfg := DefaultConfig(filepath.Join(t.TempDir(), "gooru.db"))\n\tcfg.Uploads.MaxQueued = 0\n\tif err := cfg.Validate(); err == nil || !strings.Contains(err.Error(), "uploads.max_queued") {\n\t\tt.Fatalf("expected upload queue limit validation error, got %v", err)\n\t}\n}\n\nfunc TestLoadConfigRejectsInvalidJobLimits(t *testing.T) {')

          # Frontend: upload lifecycle reads durable operations in one bounded batch.
          replace('frontend/src/lib/api/operations.ts',
              '  error_message?: string;\n}',
              '  error_message?: string;\n  result?: unknown;\n}')
          replace('frontend/src/lib/api/operations.ts',
              'export function listBackgroundOperations(limit = 1000) {\n  const params = new URLSearchParams({ limit: String(limit) });\n  return operationRequest<BackgroundOperationListResponse>(`/api/v1/operations?${params.toString()}`);\n}\n',
              'export function listBackgroundOperations(limit = 1000) {\n  const params = new URLSearchParams({ limit: String(limit) });\n  return operationRequest<BackgroundOperationListResponse>(`/api/v1/operations?${params.toString()}`);\n}\n\nexport function listBackgroundOperationsByIDs(ids: string[]) {\n  const params = new URLSearchParams();\n  for (const id of ids) params.append(\'id\', id);\n  return operationRequest<BackgroundOperationListResponse>(`/api/v1/operations?${params.toString()}`);\n}\n')
          replace('frontend/src/lib/api/operations.ts',
              '    finished_at: operation.finished_at,\n    error: operation.error_message\n',
              '    finished_at: operation.finished_at,\n    result: operation.result,\n    error: operation.error_message\n')
          replace('frontend/src/lib/queries/jobs.ts',
              "import { ApiClient } from '$lib/api/client';\n", '')
          replace('frontend/src/lib/queries/jobs.ts',
              '  cancelBackgroundOperation,\n  listBackgroundOperations\n',
              '  cancelBackgroundOperation,\n  listBackgroundOperations,\n  listBackgroundOperationsByIDs\n')
          start_marker = 'async function fetchJobBatch(ids: string[]) {'
          p = Path('frontend/src/lib/queries/jobs.ts')
          text = p.read_text()
          start = text.index(start_marker)
          end = text.index('\nasync function fetchJobsPage', start)
          replacement = '''async function fetchJobBatch(ids: string[]) {\n  const response = await listBackgroundOperationsByIDs(ids);\n  return { items: response.items.map(backgroundOperationAsJob) };\n}\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('// Upload result polling still uses the legacy JobManager until uploads become\n// durable-operation producers. Keep this mutation for callers outside the\n// durable operation history UI while that migration is incomplete.',
              '// Tag mutation is the final legacy JobManager producer. Keep finished-job\n// clearing only until tag mutation moves to durable operations in the next slice.')
          p.write_text(text)

          replace('frontend/src/lib/api/client.ts',
              "import type { LibraryURLState } from '$lib/utils/appRoute';\n",
              "import type { LibraryURLState } from '$lib/utils/appRoute';\nimport type { BackgroundOperation } from './operations';\n")
          replace('frontend/src/lib/api/client.ts',
              '  ): Promise<Job | UploadImportResponse> {',
              '  ): Promise<BackgroundOperation | UploadImportResponse> {')
          replace('frontend/src/lib/api/client.ts',
              '    return uploadMultipart<Job | UploadImportResponse>',
              '    return uploadMultipart<BackgroundOperation | UploadImportResponse>')

          replace('frontend/src/lib/queries/library.ts',
              "import type { SavedSearch, SavedSearchRequest, UploadImportResponse, Job } from '$lib/api/types';\n",
              "import type { SavedSearch, SavedSearchRequest, UploadImportResponse } from '$lib/api/types';\nimport type { BackgroundOperation } from '$lib/api/operations';\n")
          replace('frontend/src/lib/queries/library.ts',
              '  return createMutation<Job | UploadImportResponse, Error, UploadVariables>',
              '  return createMutation<BackgroundOperation | UploadImportResponse, Error, UploadVariables>')

          replace('frontend/src/lib/state/uploadWorkflow.svelte.ts',
              "import type { Job, UploadImportResponse } from '$lib/api/types';\n",
              "import type { Job, UploadImportResponse } from '$lib/api/types';\nimport type { BackgroundOperation } from '$lib/api/operations';\n")
          replace('frontend/src/lib/state/uploadWorkflow.svelte.ts',
              'type UploadMutate = (variables: UploadVariables) => Promise<Job | UploadImportResponse>;',
              'type UploadMutate = (variables: UploadVariables) => Promise<BackgroundOperation | UploadImportResponse>;')
          replace('frontend/src/lib/state/uploadWorkflow.svelte.ts',
              '          let response: Job | UploadImportResponse;',
              '          let response: BackgroundOperation | UploadImportResponse;')

          # OpenAPI: document durable operations and correct async upload response.
          p = Path('docs/openapi.yaml')
          text = p.read_text()
          operations_paths = r'''  /operations:
            get:
              summary: List durable background operations.
              security:
                - sessionAuth: []
              parameters:
                - name: id
                  in: query
                  required: false
                  description: Specific durable operation IDs to return. May be repeated; at most 64 unique IDs are accepted. Completed results are included for this bounded status-batch form.
                  schema:
                    type: array
                    maxItems: 64
                    items:
                      type: string
                  style: form
                  explode: true
                - name: limit
                  in: query
                  required: false
                  schema:
                    type: integer
                    minimum: 1
                    maximum: 1000
                    default: 100
              responses:
                "200":
                  description: Visible durable operations matching the request.
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/BackgroundOperationListResponse"
                "400":
                  $ref: "#/components/responses/BadRequest"
                "401":
                  $ref: "#/components/responses/Unauthorized"
                "403":
                  $ref: "#/components/responses/Forbidden"
            /operations/{id}:
              get:
                summary: Get one durable background operation.
                security:
                  - sessionAuth: []
                parameters:
                  - name: id
                    in: path
                    required: true
                    schema:
                      type: string
                responses:
                  "200":
                    description: Durable operation state, including a structured result when completed and available.
                    content:
                      application/json:
                        schema:
                          $ref: "#/components/schemas/BackgroundOperation"
                  "401":
                    $ref: "#/components/responses/Unauthorized"
                  "403":
                    $ref: "#/components/responses/Forbidden"
                  "404":
                    $ref: "#/components/responses/NotFound"
              delete:
                summary: Cancel an active durable background operation.
                security:
                  - sessionAuth: []
                parameters:
                  - name: id
                    in: path
                    required: true
                    schema:
                      type: string
                  - $ref: "#/components/parameters/CSRF"
                responses:
                  "202":
                    description: Operation canceled.
                    content:
                      application/json:
                        schema:
                          $ref: "#/components/schemas/BackgroundOperation"
                  "401":
                    $ref: "#/components/responses/Unauthorized"
                  "403":
                    $ref: "#/components/responses/Forbidden"
                  "404":
                    $ref: "#/components/responses/NotFound"
          '''.replace('            ', '  ', 1)
          # Normalize accidental leading indentation from raw block explicitly.
          operations_paths = operations_paths.replace('\n            ', '\n  ').replace('\n              ', '\n    ').replace('\n                ', '\n      ').replace('\n                  ', '\n        ').replace('\n                    ', '\n          ').replace('\n                      ', '\n            ').replace('\n                        ', '\n              ')
          if '  /jobs:\n' not in text:
              raise SystemExit('openapi jobs path marker missing')
          text = text.replace('  /jobs:\n', operations_paths + '  /jobs:\n', 1)
          # Correct only uploads 202 block.
          uploads_start = text.index('  /uploads:\n')
          tags_start = text.index('  /tags:\n', uploads_start)
          upload_block = text[uploads_start:tags_start]
          old = '        "202":\n          $ref: "#/components/responses/AsyncJob"'
          if old not in upload_block:
              raise SystemExit('upload AsyncJob marker missing')
          upload_block = upload_block.replace(old, '        "202":\n          $ref: "#/components/responses/AsyncOperation"', 1)
          text = text[:uploads_start] + upload_block + text[tags_start:]
          text = text.replace('      description: Set to respond-async to enqueue the mutation and poll the returned job.',
              '      description: Set to respond-async to accept the mutation asynchronously; poll the returned durable operation or legacy job as documented by the endpoint.')
          text = text.replace('    AsyncJob:\n', '    AsyncOperation:\n      description: Mutation was accepted as a durable background operation.\n      content:\n        application/json:\n          schema:\n            $ref: "#/components/schemas/BackgroundOperation"\n    AsyncJob:\n', 1)
          schemas = r'''    BackgroundOperation:
                type: object
                required: [id, kind, status, progress_total, progress_completed, progress_failed, created_at]
                properties:
                  id:
                    type: string
                  kind:
                    type: string
                  status:
                    type: string
                    enum: [pending, running, completed, failed, canceled]
                  progress_total:
                    type: integer
                    format: int64
                    minimum: 0
                  progress_completed:
                    type: integer
                    format: int64
                    minimum: 0
                  progress_failed:
                    type: integer
                    format: int64
                    minimum: 0
                  created_at:
                    type: string
                    format: date-time
                  started_at:
                    type: string
                    format: date-time
                  finished_at:
                    type: string
                    format: date-time
                  error_code:
                    type: string
                  error_message:
                    type: string
                  result: {}
              BackgroundOperationListResponse:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackgroundOperation"
          '''
          schemas = schemas.replace('\n                ', '\n      ').replace('\n                  ', '\n        ').replace('\n                    ', '\n          ').replace('\n                      ', '\n            ')
          if '    Job:\n' not in text:
              raise SystemExit('openapi Job schema marker missing')
          text = text.replace('    Job:\n', schemas + '    Job:\n', 1)
          p.write_text(text)

          # Remove this one-shot workflow from the resulting substantive commit.
          Path('.github/workflows/maintainer-401-upload-cutover.yml').unlink()
          PY

          gofmt -w internal/serve/uploads.go internal/serve/config.go internal/serve/background_operations.go internal/serve/background_operations_test.go internal/serve/uploads_test.go internal/serve/config_test.go
          npm --prefix frontend ci
          npm --prefix frontend run generate:api
          go test ./internal/serve
          npm --prefix frontend run check
          npm --prefix frontend run test:unit
          git status --short
          git add -A
          git config user.name 'fiso64'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git commit -m 'feat: finish durable upload API cutover'
          git push origin HEAD:maintainer/401-remove-legacy-jobs
