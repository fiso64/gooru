name: Maintainer PR 659 self-review

on:
  push:
    branches: [fix/624-job-outcome-summary]

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/624-job-outcome-summary
          fetch-depth: 0
      - name: Apply self-review fix
        run: |
          python3 .github/maintainer-pr659-fix.py
          gofmt -w internal/serve/uploads_durable.go internal/serve/uploads_durable_failure.go internal/serve/background_operation_job_summary.go internal/serve/background_operation_job_summary_test.go internal/serve/uploads_durable_failure_test.go
          git diff --check
      - name: Go tests
        run: go test -count=1 ./...
      - name: Go build
        run: go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Commit validated fix and remove temporary files
        run: |
          git rm .github/workflows/maintainer-pr659-selfreview.yml .github/maintainer-pr659-fix.py
          git config user.name "gooru-maintainer"
          git config user.email "maintainer@users.noreply.github.com"
          git add internal/serve/uploads_durable.go internal/serve/uploads_durable_failure.go internal/serve/background_operation_job_summary.go internal/serve/background_operation_job_summary_test.go internal/serve/uploads_durable_failure_test.go
          git commit -m "Fix oversized upload job failure count"
          git push origin HEAD:fix/624-job-outcome-summary
