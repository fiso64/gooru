name: maintainer upload audit

on:
  push:
    branches:
      - feat/249-upload-item-tags

jobs:
  inspect:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Trace upload identity APIs
        shell: bash
        run: |
          set -euo pipefail
          echo '=== client/store definitions ==='
          rg -n -C 5 "type Client struct|GetFilesInfoByContentQuery|GetFileInfoByPath|ContentExists" gooru internal/database | head -n 320 || true
          echo '=== content table/index schema ==='
          rg -n -C 5 "CREATE (TABLE|INDEX).*content|content_hash|files.*hash|hash.*files" internal/database migrations . | head -n 320 || true
          echo '=== upload identity context ==='
          sed -n '720,970p' internal/serve/uploads.go
