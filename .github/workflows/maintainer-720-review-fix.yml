name: Maintainer 720 review fix

on:
  push:
    branches:
      - maintainer/720-simplify-upload-conflicts

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("docs/openapi.yaml"); t=p.read_text(); a="                  default: skip\n                  description: How to handle uploaded filenames that already exist in the target; omitted values default to skip."; b="                  default: rename\n                  description: How to handle a requested filename that already exists in the target; omitted values default to rename."; assert a in t; p.write_text(t.replace(a,b,1))'
          echo '' | base64 -d > internal/serve/upload_conflict_policy_batch_test.go
          gofmt -w internal/serve/upload_conflict_policy_batch_test.go
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run generate:api
          cd ..
          rm .github/workflows/maintainer-720-review-fix.yml
          git add -A
          git diff --cached --check
      - name: Focused Go tests
        run: go test -count=1 ./internal/serve
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'autonomous-maintainer'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix(upload): correct conflict policy schema default'
          git push origin HEAD:maintainer/720-simplify-upload-conflicts
