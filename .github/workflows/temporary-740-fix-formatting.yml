name: temporary 740 fix formatting

on:
  push:
    branches:
      - maintainer/549-clear-frontend-a11y-warnings

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fix helper indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          next_functions = {
              'frontend/src/lib/components/PasswordDialog.svelte': 'handleKeydown',
              'frontend/src/lib/components/PreviewDialog.svelte': 'modifiedLabel',
              'frontend/src/lib/components/UploadViewerDialog.svelte': 'handleWindowKeydown',
          }
          for filename, next_function in next_functions.items():
              path = Path(filename)
              text = path.read_text()
              start = text.index('  function handleBackdropKeydown')
              marker = '\n}\n\nfunction ' + next_function
              end = text.index(marker, start)
              block = text[start:end + 2]
              lines = block.splitlines()
              fixed = '\n'.join([lines[0], *[('  ' + line) if line else line for line in lines[1:]]])
              text = text[:start] + fixed + text[end + 2:]
              text = text.replace('\n\nfunction ' + next_function, '\n\n  function ' + next_function, 1)
              path.write_text(text)
          PY
      - name: Revalidate frontend
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit
          npm run check | tee /tmp/check.log
          grep -q "svelte-check found 0 errors and 0 warnings" /tmp/check.log
          npm run test:unit
      - name: Commit formatting fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-740-fix-formatting.yml
          git config user.name "chatgpt-codex-connector"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git add frontend/src/lib/components/PasswordDialog.svelte frontend/src/lib/components/PreviewDialog.svelte frontend/src/lib/components/UploadViewerDialog.svelte .github/workflows/temporary-740-fix-formatting.yml
          git commit -m "chore: format dialog keyboard helpers"
          git push origin HEAD:maintainer/549-clear-frontend-a11y-warnings
