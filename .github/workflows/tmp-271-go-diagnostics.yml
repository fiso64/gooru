name: Temporary PR 271 Go diagnostics

on:
  push:
    branches:
      - feat/264-saved-search-order

permissions:
  contents: read

jobs:
  go-diagnostics:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Capture Go test output
        shell: bash
        run: |
          set +e
          go test ./... > go-test.log 2>&1
          status=$?
          printf 'go_status=%s\n' "$status" > statuses.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr-271-go-diagnostics-${{ github.sha }}
          path: |
            go-test.log
            statuses.txt
          if-no-files-found: error
