name: issue-21 utility views fidelity validation

on:
  push:
    branches:
      - agent/issue-21-exact-concept-port

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Add rendered utility-view regression coverage
        run: python3 .github/scripts/issue21_utility_views_patch.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend with zero warnings
        working-directory: frontend
        run: |
          npm run check | tee /tmp/svelte-check.log
          grep -q "svelte-check found 0 errors and 0 warnings" /tmp/svelte-check.log
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Build Go packages
        run: go build ./...
      - name: Run Go tests
        run: go test ./...
      - name: Persist validated utility-view coverage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/tests/shell.spec.ts docs/issue-21-concept-discrepancies.md
          git commit -m "#21 lock concept utility views with browser regressions [skip ci]"
          git push
