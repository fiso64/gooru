name: Temporary 249 stale tag rebase validation

on:
  push:
    branches:
      - feat/249-upload-item-tags
    paths:
      - .github/workflows/tmp-249-stale-tag-rebase.yml
      - .github/tmp-249-stale-tag-rebase.py

permissions:
  contents: write

jobs:
  patch-check-capture:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/249-upload-item-tags
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply stale rebase guard
        run: python3 .github/tmp-249-stale-tag-rebase.py
      - name: Capture frontend check
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee ../.github/tmp-249-stale-tag-rebase-check.log
          status=${PIPESTATUS[0]}
          printf '\n__EXIT_STATUS__=%s\n' "$status" >> ../.github/tmp-249-stale-tag-rebase-check.log
          exit 0
      - name: Commit diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gooru-maintainer-bot"
          git config user.email "maintainer@localhost"
          git add .github/tmp-249-stale-tag-rebase-check.log
          git commit -m 'ci: capture #249 stale rebase check failure'
          git push origin HEAD:feat/249-upload-item-tags
