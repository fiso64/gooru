name: Temporary 333 comic kind implementation
on:
  push:
    branches: [perf/333-comic-kind-facet]
    paths: ['.github/workflows/tmp-333-comic-kind-implement.yml']
permissions:
  contents: write
jobs:
  implement:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/333-comic-kind-facet
          fetch-depth: 0
      - name: Apply coherent comic-kind facet slice
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if count is not None and n != count: raise SystemExit(f'{path}: expected {count} occurrences, found {n}: {old[:80]!r}')
              if n == 0: raise SystemExit(f'{path}: missing pattern {old[:80]!r}')
              p.write_text(s.replace(old,new))

          # Canonical kind expression used by query-specific facets.
          replace('internal/database/database.go',
              "return `coalesce(mm.media_kind, CASE\n\t\tWHEN lower(l.extension) = '.gif' THEN 'gif'",
              "return `coalesce(mm.media_kind, CASE\n\t\tWHEN lower(l.extension) = '.cbz' THEN 'comic'\n\t\tWHEN lower(l.extension) = '.gif' THEN 'gif'", 1)

          # Query semantics already recognize `comic`; make extension fallback match facet semantics.
          replace('internal/query/sqlbuilder.go',
              "return `coalesce(mm.media_kind, CASE\n\t\tWHEN lower(l.extension) = '.gif' THEN 'gif'",
              "return `coalesce(mm.media_kind, CASE\n\t\tWHEN lower(l.extension) = '.cbz' THEN 'comic'\n\t\tWHEN lower(l.extension) = '.gif' THEN 'gif'", 1)
          replace('internal/query/sqlbuilder.go',
              'switch strings.ToLower(value) {\n\tcase "gif":',
              'switch strings.ToLower(value) {\n\tcase "comic":\n\t\treturn `lower(l.extension) = \'.cbz\'`\n\tcase "gif":', 1)
          replace('internal/query/sqlbuilder.go',
              "NOT IN ('.gif', '.jpg', '.jpeg', '.png', '.webp', '.bmp', '.tif', '.tiff', '.heic', '.heif', '.mp4'",
              "NOT IN ('.cbz', '.gif', '.jpg', '.jpeg', '.png', '.webp', '.bmp', '.tif', '.tiff', '.heic', '.heif', '.mp4'", 1)

          # Upgrade existing summaries/triggers without rewriting historical migration 12.
          old=Path('internal/database/migrations/012_kind_counts_summary.up.sql').read_text()
          rest=old[old.index('INSERT INTO kind_counts'):]
          drops='''-- Treat CBZ archives as the existing first-class `comic` media kind so root\n-- kind facets can answer comics availability without an extra browse query.\nDROP TRIGGER IF EXISTS kind_counts_location_insert;\nDROP TRIGGER IF EXISTS kind_counts_location_delete;\nDROP TRIGGER IF EXISTS kind_counts_location_extension_update;\nDROP TRIGGER IF EXISTS kind_counts_metadata_insert;\nDROP TRIGGER IF EXISTS kind_counts_metadata_update;\nDROP TRIGGER IF EXISTS kind_counts_metadata_delete;\n\nDELETE FROM kind_counts;\n'''
          def with_comic(s):
              for expr in ('l.extension','NEW.extension','OLD.extension','extension'):
                  old_line=f"WHEN lower({expr}) = '.gif' THEN 'gif'"
                  new_line=f"WHEN lower({expr}) = '.cbz' THEN 'comic'\n            WHEN lower({expr}) = '.gif' THEN 'gif'"
                  if expr == 'l.extension': new_line=f"WHEN lower({expr}) = '.cbz' THEN 'comic'\n        WHEN lower({expr}) = '.gif' THEN 'gif'"
                  s=s.replace(old_line,new_line)
              return s
          Path('internal/database/migrations/019_comic_kind_summary.up.sql').write_text(drops+with_comic(rest))
          Path('internal/database/migrations/019_comic_kind_summary.down.sql').write_text(drops+rest)

          # Database migration/trigger coverage: CBZ starts in comic, leaves it on extension mutation.
          replace('internal/database/kind_counts_test.go',
              'otherID := insertLocation("other", "file_other", "/notes.txt", ".txt")\n\tvideoID :=',
              'otherID := insertLocation("other", "file_other", "/notes.txt", ".txt")\n\tcomicID := insertLocation("comic", "file_comic", "/book.cbz", ".cbz")\n\tvideoID :=', 1)
          replace('internal/database/kind_counts_test.go',
              "if _, err := db.Exec(`UPDATE locations SET extension = '.png' WHERE id = ?`, otherID); err != nil {",
              "if _, err := db.Exec(`UPDATE locations SET extension = '.png' WHERE id = ?`, otherID); err != nil {", 1)
          marker='''\tassertKindCountsMatchRecomputed(t, db)\n\n\tif _, err := db.Exec(`DELETE FROM media_metadata WHERE location_id = ?`, photoID); err != nil {'''
          repl='''\tassertKindCountsMatchRecomputed(t, db)\n\n\tif _, err := db.Exec(`UPDATE locations SET extension = '.zip' WHERE id = ?`, comicID); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tassertKindCountsMatchRecomputed(t, db)\n\n\tif _, err := db.Exec(`DELETE FROM media_metadata WHERE location_id = ?`, photoID); err != nil {'''
          replace('internal/database/kind_counts_test.go',marker,repl,1)
          replace('internal/database/kind_counts_test.go',
              "SELECT coalesce(mm.media_kind, CASE\n\t\t\tWHEN lower(l.extension) = '.gif' THEN 'gif'",
              "SELECT coalesce(mm.media_kind, CASE\n\t\t\tWHEN lower(l.extension) = '.cbz' THEN 'comic'\n\t\t\tWHEN lower(l.extension) = '.gif' THEN 'gif'",1)

          # Query boundary coverage, including keeping CBZ out of `other`.
          replace('internal/query/sqlbuilder_test.go',
              "(5, 'other', '.txt')`,",
              "(5, 'other', '.txt'),\n\t\t\t(6, 'comic', '.cbz')`,",1)
          replace('internal/query/sqlbuilder_test.go',
              '{query: "type:gif", want: []int64{3}},\n\t\t{query: "type:audio"',
              '{query: "type:gif", want: []int64{3}},\n\t\t{query: "type:comic", want: []int64{6}},\n\t\t{query: "type:audio"',1)

          # Frontend: derive context/global comic counts from facets already fetched for the library.
          replace('frontend/src/lib/components/AuthenticatedApp.svelte',
              "import { appendSidebarKind, queryWithoutSidebarKind } from '$lib/utils/sidebarKinds';",
              "import { queryWithoutSidebarKind } from '$lib/utils/sidebarKinds';",1)
          replace('frontend/src/lib/components/AuthenticatedApp.svelte',
              "  const comicCountQuery = createFileCountQuery(() => Boolean($authState.user), () => appendSidebarKind(sidebarBaseQuery, 'ext:cbz'), () => authScope, () => library.route === 'library');\n  const comicLibraryCountQuery = createFileCountQuery(() => Boolean($authState.user), () => 'ext:cbz', () => authScope, () => library.route === 'library');\n",
              '',1)
          insert_after='''  const selectedCount = $derived(library.selectedCount());\n'''
          derived='''  const selectedCount = $derived(library.selectedCount());\n  const sidebarKindCounts = $derived(\n    sidebarBaseQuery !== $submittedSearch\n      ? (kindFacetsQuery.data?.facets?.kind ?? [])\n      : (fileMetadata?.facets?.kind ?? [])\n  );\n  const comicCount = $derived(sidebarKindCounts.find((item) => item.value === 'comic')?.count ?? 0);\n  const comicAvailable = $derived((tagsQuery.data?.facets?.kind ?? []).some((item) => item.value === 'comic' && item.count > 0));\n'''
          replace('frontend/src/lib/components/AuthenticatedApp.svelte',insert_after,derived,1)
          replace('frontend/src/lib/components/AuthenticatedApp.svelte',
              "        comicCountQuery.refetch(),\n        comicLibraryCountQuery.refetch(),\n",
              '',1)
          replace('frontend/src/lib/components/AuthenticatedApp.svelte',
              "    comicCount={comicCountQuery.data?.total_count ?? 0}\n    comicAvailable={(comicLibraryCountQuery.data?.total_count ?? 0) > 0}",
              "    comicCount={comicCount}\n    comicAvailable={comicAvailable}",1)

          # Browser regression: global facet keeps Comics visible; current-search facets drive its count.
          replace('frontend/tests/comics-sidebar-visibility.spec.ts',
              "body: JSON.stringify({ tags: [], library_count: 3, facets: { kind: [] } })",
              "body: JSON.stringify({ tags: [], library_count: 3, facets: { kind: [{ value: 'comic', count: 2 }] } })",1)
          replace('frontend/tests/comics-sidebar-visibility.spec.ts',
              "facets: includeFacets ? { kind: [] } : undefined",
              "facets: includeFacets ? { kind: total > 0 && !query.includes('tag:no-comics') ? [{ value: 'comic', count: 2 }] : [] } : undefined",1)

          # Ensure this performance slice cannot silently reintroduce the dedicated startup browse query.
          replace('frontend/tests/comics-sidebar-visibility.spec.ts',
              "  let loggedIn = false;\n",
              "  let loggedIn = false;\n  let dedicatedComicCountRequests = 0;\n",1)
          replace('frontend/tests/comics-sidebar-visibility.spec.ts',
              "const query = url.searchParams.get('query') ?? '';\n    const includeFacets",
              "const query = url.searchParams.get('query') ?? '';\n    if (query === 'ext:cbz' && url.searchParams.get('limit') === '1') dedicatedComicCountRequests += 1;\n    const includeFacets",1)
          replace('frontend/tests/comics-sidebar-visibility.spec.ts',
              "  await expect(page.getByRole('heading', { name: 'Library' })).toBeVisible();\n}",
              "  await expect(page.getByRole('heading', { name: 'Library' })).toBeVisible();\n  return () => dedicatedComicCountRequests;\n}",1)
          replace('frontend/tests/comics-sidebar-visibility.spec.ts',
              "  await mockApp(page);\n\n  const comics",
              "  const dedicatedComicCountRequests = await mockApp(page);\n\n  const comics",1)
          replace('frontend/tests/comics-sidebar-visibility.spec.ts',
              "  await expect(comics.locator('.count')).toHaveText('0');\n});",
              "  await expect(comics.locator('.count')).toHaveText('0');\n  expect(dedicatedComicCountRequests()).toBe(0);\n});",1)
          PY
          gofmt -w internal/database/kind_counts_test.go internal/query/sqlbuilder.go internal/query/sqlbuilder_test.go
          rm .github/workflows/tmp-333-comic-kind-implement.yml
          git config user.name 'Gooru Maintainer'
          git config user.email 'maintainer@users.noreply.github.com'
          git add -A
          git commit -m 'perf: reuse comic kind facets for sidebar counts'
          git push origin HEAD:perf/333-comic-kind-facet
