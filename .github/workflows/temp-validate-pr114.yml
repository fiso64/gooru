name: Temporary PR 114 validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend validation
        run: |
          go build ./...
          go test ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm run test:unit
          npm run check
          npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Focused browser regression
        working-directory: frontend
        run: npx playwright test tests/route-files-query.spec.ts --project=chromium
