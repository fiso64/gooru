name: Recover self-hosted runner disk

on:
  push:
    branches:
      - feat/248-upload-target-default-tags

permissions:
  contents: read

jobs:
  cleanup:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, gooru]
    steps:
      - name: Report and clean disposable runner caches
        shell: bash
        run: |
          set -euxo pipefail
          echo "runner=$RUNNER_NAME"
          df -h /run || df -h .
          du -sh "$HOME/.npm" 2>/dev/null || true
          rm -rf "$HOME/.npm/_cacache"
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d -mtime +0 -exec rm -rf {} + 2>/dev/null || true
          df -h /run || df -h .
