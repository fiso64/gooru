name: Maintainer 231 branch sync

on:
  push:
    branches:
      - feat/231-comic-ui

permissions:
  contents: write

jobs:
  sync:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/231-comic-ui
          fetch-depth: 0
      - name: Merge develop and remove temporary workflow
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '1144995+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git fetch origin develop
          git merge --no-edit origin/develop
          git rm .github/workflows/maintainer-231-sync.yml
          git commit --amend --no-edit
          git push origin HEAD:feat/231-comic-ui
