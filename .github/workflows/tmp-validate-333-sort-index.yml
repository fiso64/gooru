name: Temporary validate 333 sort index

on:
  push:
    branches:
      - perf/333-root-aggregate-dedup

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate database index slice
        run: |
          test -z "$(gofmt -l internal/database/performance_indexes_test.go)"
          go test ./internal/database
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/tmp-validate-333-sort-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-validate-333-sort-index.yml
          git commit -m "ci: remove temporary sort-index validation workflow"
          git push origin HEAD:perf/333-root-aggregate-dedup
