name: issue-21 library validation

on:
  push:
    branches:
      - agent/issue-21-exact-concept-port

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply Library completion patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('frontend/src/lib/state/tagWorkflow.svelte.ts')
          text = workflow.read_text()
          old = "  async function bulkSelected(ids: Set<string>, tagInput: string, mutateTags: MutateTags) {\n    const tags = parseTags(tagInput);\n    if (!tags.length || !ids.size) return false;\n    await mutateTags({ operation: 'add', body: { file_ids: Array.from(ids), tags } });\n    return true;\n  }"
          new = "  async function bulkSelected(ids: Set<string>, tagInput: string, operation: 'add' | 'remove', mutateTags: MutateTags) {\n    const tags = parseTags(tagInput);\n    if (!tags.length || !ids.size) return false;\n    await mutateTags({ operation, body: { file_ids: Array.from(ids), tags } });\n    return true;\n  }"
          if old not in text: raise SystemExit('bulkSelected block not found')
          workflow.write_text(text.replace(old, new))

          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text()
          text = text.replace(
              "kind: 'none' | 'save-create' | 'save-update' | 'save-delete' | 'bulk-selected' | 'bulk-filtered';",
              "kind: 'none' | 'save-create' | 'save-update' | 'save-delete' | 'bulk-selected' | 'bulk-remove-selected' | 'bulk-filtered';"
          )
          old = "  function bulkTagSelected() {\n    actionDialog = { kind: 'bulk-selected', value: '', error: '', busy: false, id: '', name: '', previousQuery: '' };\n  }\n\n  function bulkTagFiltered() {"
          new = "  function bulkTagSelected() {\n    actionDialog = { kind: 'bulk-selected', value: '', error: '', busy: false, id: '', name: '', previousQuery: '' };\n  }\n\n  function bulkUntagSelected() {\n    actionDialog = { kind: 'bulk-remove-selected', value: '', error: '', busy: false, id: '', name: '', previousQuery: '' };\n  }\n\n  function bulkTagFiltered() {"
          if old not in text: raise SystemExit('bulk action functions not found')
          text = text.replace(old, new)
          old = "      } else if (actionDialog.kind === 'bulk-selected') {\n        const changed = await tagWorkflow.bulkSelected(library.selectedIDs, value, (variables) => tagMutation.mutateAsync(variables));\n        if (changed) library.clearSelection();\n      } else if (actionDialog.kind === 'bulk-filtered') {"
          new = "      } else if (actionDialog.kind === 'bulk-selected') {\n        const changed = await tagWorkflow.bulkSelected(library.selectedIDs, value, 'add', (variables) => tagMutation.mutateAsync(variables));\n        if (changed) library.clearSelection();\n      } else if (actionDialog.kind === 'bulk-remove-selected') {\n        const changed = await tagWorkflow.bulkSelected(library.selectedIDs, value, 'remove', (variables) => tagMutation.mutateAsync(variables));\n        if (changed) library.clearSelection();\n      } else if (actionDialog.kind === 'bulk-filtered') {"
          if old not in text: raise SystemExit('bulk submit branch not found')
          text = text.replace(old, new)
          text = text.replace("      case 'bulk-selected': return 'Tag selected files';", "      case 'bulk-selected': return 'Tag selected files';\n      case 'bulk-remove-selected': return 'Untag selected files';")
          text = text.replace("      case 'bulk-selected': return `Add tags to ${library.selectedIDs.size} selected file${library.selectedIDs.size === 1 ? '' : 's'}.`;", "      case 'bulk-selected': return `Add tags to ${library.selectedIDs.size} selected file${library.selectedIDs.size === 1 ? '' : 's'}.`;\n      case 'bulk-remove-selected': return `Remove tags from ${library.selectedIDs.size} selected file${library.selectedIDs.size === 1 ? '' : 's'}.`;")
          text = text.replace("      case 'bulk-selected':\n      case 'bulk-filtered': return 'Add tags';", "      case 'bulk-selected':\n      case 'bulk-filtered': return 'Add tags';\n      case 'bulk-remove-selected': return 'Remove tags';")
          old = "        onClearSelection={library.clearSelection}\n        onBulkTag={bulkTagSelected}\n        onLoadMore="
          new = "        onClearSelection={library.clearSelection}\n        onBulkTag={bulkTagSelected}\n        onBulkUntag={bulkUntagSelected}\n        onLoadMore="
          if old not in text: raise SystemExit('MediaGrid handler block not found')
          app.write_text(text.replace(old, new))

          css = Path('frontend/src/lib/styles/components.css')
          text = css.read_text()
          text = re.sub(r"\n\.thumb-tags \{.*?\n\.thumb-tags span \{.*?\n\}\n", "\n", text, flags=re.S)
          text = text.replace('.thumb.selected .thumb-checkbox,\n.thumb-checkbox.selected', '.thumb.is-selected .thumb-checkbox,\n.thumb-checkbox.is-selected')
          text = text.replace('.thumb.selected .thumb-checkbox,\n.thumb-checkbox.is-selected', '.thumb.is-selected .thumb-checkbox,\n.thumb-checkbox.is-selected')
          text = text.replace('.thumb.selected::after', '.thumb.is-selected::after')
          old = ".selection-bar {\n  position: sticky;\n  top: 0;\n  z-index: 4;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 10px 24px;\n  background: var(--accent);\n  color: var(--accent-ink);\n  font-family: var(--font-mono);\n  font-size: 12px;\n}\n\n.selection-bar > div,\n.sb-actions {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}"
          new = ".selection-bar {\n  position: sticky;\n  top: 0;\n  z-index: 4;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 10px 24px;\n  background: var(--accent);\n  color: var(--accent-ink);\n  font-family: var(--font-mono);\n  font-size: 12px;\n  font-weight: 500;\n}\n\n.selection-summary {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n}\n\n.sb-actions {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.selection-bar .g-btn {\n  background: rgba(0, 0, 0, 0.18);\n  color: var(--accent-ink);\n  border-color: rgba(0, 0, 0, 0.22);\n}\n\n.selection-bar .g-btn:hover:not(:disabled) {\n  background: rgba(0, 0, 0, 0.28);\n  border-color: rgba(0, 0, 0, 0.32);\n  color: var(--accent-ink);\n}"
          if old not in text: raise SystemExit('selection css block not found')
          text = text.replace(old, new)
          text = text.replace('  padding: 80px 24px;\n  color: var(--text-3);', '  padding: 80px;\n  color: var(--text-3);')
          text = text.replace(".empty-state h2 {\n  margin: 8px 0 0;", ".empty-state-inner {\n  max-width: 380px;\n}\n\n.empty-state h2 {\n  margin: 0;")
          text = text.replace('  font-size: 24px;', '  font-size: 22px;', 1)
          text = text.replace('.empty-state p {\n  max-width: 420px;\n}', '.empty-state p {\n  margin: 8px 0 0;\n}\n\n.empty-state code {\n  color: var(--text);\n}')
          text = text.replace('  margin: 0 auto;\n  display: grid;', '  margin: 0 auto 16px;\n  display: grid;', 1)
          infinite = re.compile(r"\.infinite-sentinel \{.*?\n\}", re.S)
          replacement = ".infinite-sentinel {\n  display: grid;\n  place-items: center;\n  padding: 40px 0 8px;\n  color: var(--text-4);\n  font-family: var(--font-mono);\n  font-size: 11px;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n}\n\n.infinite-sentinel-content {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n}\n\n.infinite-sentinel-spinner {\n  display: inline-block;\n  width: 10px;\n  height: 10px;\n  border-radius: 50%;\n  border: 1.5px solid var(--text-4);\n  border-top-color: transparent;\n  animation: g-spin 0.9s linear infinite;\n}\n\n@keyframes g-spin {\n  to { transform: rotate(360deg); }\n}"
          if not infinite.search(text): raise SystemExit('infinite sentinel css not found')
          text = infinite.sub(replacement, text, count=1)
          css.write_text(text)

          spec = Path('frontend/tests/shell.spec.ts')
          text = spec.read_text()
          marker = "test('bulk selection supports concept untag action'"
          if marker not in text:
            text += r'''\n\ntest('bulk selection supports concept untag action', async ({ page }) => {\n  await mockAuth(page);\n  await mockShellApis(page);\n  const files = [fileItem('one', 'one.jpg'), fileItem('two', 'two.jpg')];\n  const mutations: Array<{ method: string; csrf: string; body: unknown }> = [];\n\n  await page.route('**/api/v1/files?**', async (route) => {\n    await route.fulfill({\n      contentType: 'application/json',\n      body: JSON.stringify({ files, total_count: 2, library_count: 2, facets: { kind: [{ value: 'photo', count: 2 }] } })\n    });\n  });\n  await page.route('**/api/v1/files/*/thumbnail', async (route) => {\n    await route.fulfill({ contentType: 'image/svg+xml', body: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" />' });\n  });\n  await page.route('**/api/v1/files/tags', async (route) => {\n    mutations.push({\n      method: route.request().method(),\n      csrf: route.request().headers()['x-gooru-csrf'] ?? '',\n      body: route.request().postDataJSON()\n    });\n    await route.fulfill({\n      contentType: 'application/json',\n      body: JSON.stringify({ operation: 'remove', selector: { file_ids: ['one'] }, affected_count: 1 })\n    });\n  });\n\n  await page.goto('/');\n  await signIn(page);\n  await page.getByRole('checkbox', { name: 'Select one.jpg' }).click();\n  await expect(page.locator('.thumb.is-selected')).toHaveCount(1);\n  await expect(page.getByText('1 of 2 selected')).toBeVisible();\n  await page.getByRole('button', { name: 'Untag…' }).click();\n  await expect(page.getByRole('heading', { name: 'Untag selected files' })).toBeVisible();\n  await page.getByLabel('Tags').fill('blue');\n  await page.getByRole('button', { name: 'Remove tags' }).click();\n\n  await expect.poll(() => mutations.length).toBe(1);\n  expect(mutations[0]).toMatchObject({ method: 'DELETE', csrf: 'csrf-one', body: { file_ids: ['one'], tags: ['blue'], verbose: false } });\n  await expect(page.locator('.selection-bar')).toHaveCount(0);\n});\n'''.replace('\\n', '\n')
          spec.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Build Go packages
        run: go build ./...
      - name: Run Go tests
        run: go test ./...
      - name: Persist validated Library completion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/state/tagWorkflow.svelte.ts frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/styles/components.css frontend/tests/shell.spec.ts
          git commit -m "#21 complete exact Library selection behavior [skip ci]"
          git push
