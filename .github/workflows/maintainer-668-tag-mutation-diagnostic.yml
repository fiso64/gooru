name: Maintainer 668 tag mutation diagnostic

on:
  push:
    branches:
      - fix/668-tag-mutation-performance

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
      GOORU_TAG_MUTATION_DIAGNOSTIC: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Runner Go version
        run: go version
      - name: Run actual-path latency diagnostic
        run: go test -count=1 -run '^TestTagMutationLatencyDiagnostic$' -v ./internal/serve
