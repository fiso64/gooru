name: Validate #28 protected derivatives

on:
  push:
    branches:
      - feat/28-encrypted-derivative-cache

permissions:
  contents: read

jobs:
  govips:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Build packaged application with libvips
        run: nix build .#packages.x86_64-linux.default --print-build-logs
