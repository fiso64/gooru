name: Maintainer opaque storage source validation

on:
  push:
    branches:
      - feat/28-opaque-managed-storage

permissions:
  contents: read

jobs:
  go:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting check
        shell: bash
        run: |
          files=$(git diff --name-only origin/develop...HEAD -- '*.go')
          if [ -n "$files" ]; then
            test -z "$(gofmt -l $files)"
          fi
      - name: Focused tests
        id: focused
        shell: bash
        run: |
          set +e
          go test -count=1 ./cmd/gooru/cmd ./gooru ./internal/serve ./internal/database > /tmp/focused.log 2>&1
          status=$?
          cat /tmp/focused.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused output
        uses: actions/upload-artifact@v4
        with:
          name: opaque-storage-focused-output
          path: /tmp/focused.log
          retention-days: 1
      - name: Stop on focused failure
        if: steps.focused.outputs.status != '0'
        run: exit 1
      - name: Full tests
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...
