name: Maintainer opaque storage source validation

on:
  push:
    branches:
      - feat/28-opaque-managed-storage

permissions:
  contents: read

jobs:
  go:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Focused tests
        run: go test -count=1 ./cmd/gooru/cmd ./gooru ./internal/serve ./internal/database
      - name: Full tests
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...
