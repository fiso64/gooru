name: validate held-navigation viewer repair
on:
  push:
    branches: [fix/22-held-navigation-presentation]

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/22-held-navigation-presentation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply viewer presentation repair and regression
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Static check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Viewer browser regressions
        working-directory: frontend
        run: npx playwright test tests/viewer-animation.spec.ts --project=chromium
      - name: Commit repair and remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/repair-held-navigation.yml
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/components/ViewerStage.svelte frontend/tests/viewer-animation.spec.ts .github/workflows/repair-held-navigation.yml
          git commit -m "fix(viewer): keep held navigation presenting images"
          git push origin HEAD:fix/22-held-navigation-presentation
