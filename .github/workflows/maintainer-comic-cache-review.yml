name: maintainer-comic-cache-review
on:
  push:
    branches: [fix/22-comic-navigation-cache]
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply cache correctness review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1))

          replace('internal/serve/comic.go', '''func comicArchiveCacheKey(file types.FileInfo) string {
          \treturn file.Path + "\\x00" + strconv.FormatInt(file.Size, 10) + "\\x00" + strconv.FormatInt(file.ModTime, 10)
          }

          func (m *MediaService) acquireComicArchive(file types.FileInfo) (*comicArchive, func(), error) {
          \tkey := comicArchiveCacheKey(file)

          \tm.comicMu.Lock()
          \tif entry := m.comicCache[key]; entry != nil {
          \t\tm.comicTick++
          \t\tentry.refs++
          \t\tentry.lastUsed = m.comicTick
          \t\tm.comicMu.Unlock()
          \t\treturn entry.archive, func() { m.releaseComicArchive(entry) }, nil
          \t}
          \tm.comicMu.Unlock()

          \tarchive, err := m.openComicArchive(file.Path)
          \tif err != nil {
          \t\treturn nil, nil, err
          \t}
          \tentry := &cachedComicArchive{key: key, path: file.Path, archive: archive, refs: 1}
          ''', '''func comicArchiveCacheKey(path string, size, modTimeNano int64) string {
          \treturn path + "\\x00" + strconv.FormatInt(size, 10) + "\\x00" + strconv.FormatInt(modTimeNano, 10)
          }

          func (m *MediaService) acquireComicArchive(file types.FileInfo) (*comicArchive, func(), error) {
          \t// Open the current source before consulting the cache. This makes cache
          \t// invalidation follow the file actually being served rather than possibly
          \t// stale database metadata, and avoids a stat/open race on cache misses.
          \tsource, err := m.openMediaSource(file.Path)
          \tif err != nil {
          \t\treturn nil, nil, fmt.Errorf("open cbz: %w", err)
          \t}
          \tkey := comicArchiveCacheKey(file.Path, source.size, source.modTime.UnixNano())

          \tm.comicMu.Lock()
          \tif entry := m.comicCache[key]; entry != nil {
          \t\tm.comicTick++
          \t\tentry.refs++
          \t\tentry.lastUsed = m.comicTick
          \t\tm.comicMu.Unlock()
          \t\t_ = source.Close()
          \t\treturn entry.archive, func() { m.releaseComicArchive(entry) }, nil
          \t}
          \tm.comicMu.Unlock()

          \tarchive, err := openComicArchiveReader(file.Path, source, source.size, source.Close)
          \tif err != nil {
          \t\t_ = source.Close()
          \t\treturn nil, nil, err
          \t}
          \tentry := &cachedComicArchive{key: key, path: file.Path, archive: archive, refs: 1}
          ''')

          replace('internal/serve/comic_test.go', '''\tkey := comicArchiveCacheKey(file)
          ''', '''\tkey := comicArchiveCacheKey(path, info.Size(), info.ModTime().UnixNano())
          ''')

          old_test = '''func TestComicArchiveCacheInvalidatesWhenTrackedFileChanges(t *testing.T) {
          \tpage := tinyPNG(t, 2, 2, color.White)
          \tpath := writeComic(t, map[string][]byte{"1.png": page})
          \tinfo, err := os.Stat(path)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tservice := NewMediaService(DefaultConfig(filepath.Join(t.TempDir(), "gooru.db")))
          \tfirstFile := types.FileInfo{Path: path, Size: info.Size(), ModTime: info.ModTime().UnixNano()}
          \tfirst, releaseFirst, err := service.acquireComicArchive(firstFile)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \treleaseFirst()

          \tchangedFile := firstFile
          \tchangedFile.ModTime++
          \tsecond, releaseSecond, err := service.acquireComicArchive(changedFile)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \treleaseSecond()
          \tif first == second {
          \t\tt.Fatal("changed tracked file metadata reused a stale comic archive")
          \t}
          \tservice.comicMu.Lock()
          \tcacheSize := len(service.comicCache)
          \tservice.comicMu.Unlock()
          \tif cacheSize != 1 {
          \t\tt.Fatalf("comic cache size after invalidation = %d, want 1", cacheSize)
          \t}
          }
          '''
          new_test = '''func TestComicArchiveCacheInvalidatesWhenSourceChangesBeforeTrackedMetadata(t *testing.T) {
          \tpage := tinyPNG(t, 2, 2, color.White)
          \tpath := writeComic(t, map[string][]byte{"1.png": page})
          \tinfo, err := os.Stat(path)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tservice := NewMediaService(DefaultConfig(filepath.Join(t.TempDir(), "gooru.db")))
          \ttracked := types.FileInfo{Path: path, Size: info.Size(), ModTime: info.ModTime().Unix()}
          \tfirst, releaseFirst, err := service.acquireComicArchive(tracked)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \treleaseFirst()

          \t// Keep the database-facing FileInfo unchanged and mutate only the actual
          \t// source metadata. The next request must not reuse the stale ZIP index.
          \tchangedTime := info.ModTime().Add(2 * time.Second)
          \tif err := os.Chtimes(path, changedTime, changedTime); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tsecond, releaseSecond, err := service.acquireComicArchive(tracked)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \treleaseSecond()
          \tif first == second {
          \t\tt.Fatal("changed source reused a stale comic archive before tracked metadata refreshed")
          \t}
          \tservice.comicMu.Lock()
          \tcacheSize := len(service.comicCache)
          \tservice.comicMu.Unlock()
          \tif cacheSize != 1 {
          \t\tt.Fatalf("comic cache size after invalidation = %d, want 1", cacheSize)
          \t}
          }
          '''
          replace('internal/serve/comic_test.go', old_test, new_test)

          anchor = '''func TestComicArchiveCacheInvalidatesWhenSourceChangesBeforeTrackedMetadata(t *testing.T) {'''
          concurrent = '''func TestServeComicCacheSupportsConcurrentPageRequests(t *testing.T) {
          \tentries := make(map[string][]byte, 32)
          \tpage := tinyPNG(t, 4, 4, color.White)
          \tfor index := 0; index < 32; index++ {
          \t\tentries[fmt.Sprintf("%02d.png", index)] = page
          \t}
          \tpath := writeComic(t, entries)
          \tservice := NewMediaService(DefaultConfig(filepath.Join(t.TempDir(), "gooru.db")))
          \tfile := types.FileInfo{Path: path}

          \twarm := httptest.NewRecorder()
          \tservice.ServeComic(warm, httptest.NewRequest(http.MethodGet, "/api/v1/comics/file-id", nil), file, "file-id")
          \tif warm.Code != http.StatusOK {
          \t\tt.Fatalf("manifest status = %d: %s", warm.Code, warm.Body.String())
          \t}

          \tvar wg sync.WaitGroup
          \terrs := make(chan error, 32)
          \tfor index := 0; index < 32; index++ {
          \t\tindex := index
          \t\twg.Add(1)
          \t\tgo func() {
          \t\t\tdefer wg.Done()
          \t\t\trecorder := httptest.NewRecorder()
          \t\t\ttarget := fmt.Sprintf("/api/v1/comics/file-id/%d?page=%d", index, index)
          \t\t\tservice.ServeComic(recorder, httptest.NewRequest(http.MethodGet, target, nil), file, "file-id")
          \t\t\tif recorder.Code != http.StatusOK {
          \t\t\t\terrs <- fmt.Errorf("%s status = %d: %s", target, recorder.Code, recorder.Body.String())
          \t\t\t}
          \t\t}()
          \t}
          \twg.Wait()
          \tclose(errs)
          \tfor err := range errs {
          \t\tt.Error(err)
          \t}
          }

          ''' + anchor
          replace('internal/serve/comic_test.go', anchor, concurrent)

          replace('internal/serve/comic_test.go', '''\t"os"
          \t"path/filepath"
          \t"testing"
          ''', '''\t"os"
          \t"path/filepath"
          \t"sync"
          \t"testing"
          \t"time"
          ''')
          PY
          gofmt -w internal/serve/comic.go internal/serve/comic_test.go
      - name: Validate focused comic tests
        run: go test ./internal/serve -run 'Test(ServeComic|ComicArchive|OpenComic|CBZ)' -count=1
      - name: Validate concurrent archive reuse under race detector
        run: go test -race ./internal/serve -run 'TestServeComicCacheSupportsConcurrentPageRequests' -count=1
      - name: Validate full Go suite
        run: go test ./...
      - name: Commit reviewed fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/maintainer-comic-cache-review.yml
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/serve/comic.go internal/serve/comic_test.go .github/workflows/maintainer-comic-cache-review.yml
          git commit -m 'fix: invalidate comic cache from live source metadata'
          git push origin HEAD:fix/22-comic-navigation-cache
