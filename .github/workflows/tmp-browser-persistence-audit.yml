name: tmp browser persistence audit
on:
  pull_request:
    branches:
      - develop
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory frontend persistence and media-loading surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '=== persistence APIs ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=build --exclude-dir=.svelte-kit \
            'serviceWorker|navigator[.]serviceWorker|caches[.]|CacheStorage|indexedDB|localStorage|sessionStorage|createObjectURL|revokeObjectURL|FileReader|blob:' frontend || true
          echo '=== service worker/cache-like filenames ==='
          find frontend -type f \( -iname '*service*worker*' -o -iname '*cache*' -o -iname '*manifest*' \) \
            -not -path '*/node_modules/*' -not -path '*/build/*' -not -path '*/.svelte-kit/*' -print
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
