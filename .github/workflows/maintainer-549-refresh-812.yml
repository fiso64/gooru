name: Maintainer 549 refresh PR 812

on:
  push:
    branches:
      - maintainer-549-share-string-batch-args

permissions:
  contents: write

jobs:
  refresh:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current develop and self-clean
        shell: bash
        run: |
          git config user.name gooru-maintainer
          git config user.email 64778819+fiso64@users.noreply.github.com
          git fetch origin develop
          git merge --no-edit origin/develop
          rm .github/workflows/maintainer-549-refresh-812.yml
          git add -A
          git commit -m 'chore: remove temporary branch refresh workflow'
          git push origin HEAD:maintainer-549-share-string-batch-args
