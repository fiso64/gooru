name: Temporary PR 373 validation

on:
  push:
    branches:
      - perf/333-extension-facet-summary

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Database tests
        run: go test ./internal/database
      - name: Core query tests
        run: go test ./gooru
      - name: Server tests
        run: go test ./internal/serve
