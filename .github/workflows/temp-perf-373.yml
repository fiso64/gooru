name: Temporary PR 373 validation

on:
  push:
    branches:
      - perf/333-extension-facet-summary

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: New extension-sort plan regression
        run: go test ./internal/database -run '^TestExtensionFilterDefaultSortUsesCoveringOrderIndex$' -count=1
      - name: Existing extension-filter plan regression
        run: go test ./internal/database -run '^TestExtensionFilterUsesCaseInsensitiveExpressionIndex$' -count=1
      - name: Existing default-sort plan regression
        run: go test ./internal/database -run '^TestDefaultLibrarySortUsesExactDirectionIndex$' -count=1
      - name: Database suite
        id: database
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/database 2>&1 | tee db-test.log
      - name: Upload database test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-373-db-test-output
          path: db-test.log
          if-no-files-found: error
      - name: Fail if database suite failed
        if: steps.database.outcome != 'success'
        run: exit 1
      - name: Core query tests
        run: go test ./gooru
      - name: Server tests
        run: go test ./internal/serve
