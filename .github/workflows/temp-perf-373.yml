name: Temporary PR 373 validation

on:
  push:
    branches:
      - perf/333-extension-facet-summary

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: New extension-sort plan regression
        continue-on-error: true
        run: go test ./internal/database -run '^TestExtensionFilterDefaultSortUsesCoveringOrderIndex$' -count=1
      - name: Existing extension-filter plan regression
        continue-on-error: true
        run: go test ./internal/database -run '^TestExtensionFilterUsesCaseInsensitiveExpressionIndex$' -count=1
      - name: Existing default-sort plan regression
        continue-on-error: true
        run: go test ./internal/database -run '^TestDefaultLibrarySortUsesExactDirectionIndex$' -count=1
      - name: Database suite
        run: go test ./internal/database
      - name: Core query tests
        run: go test ./gooru
      - name: Server tests
        run: go test ./internal/serve
