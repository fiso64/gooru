name: Maintainer PDF Thumbnail Validation
on:
  push:
    branches: [pdf-thumbnail-backend]
permissions:
  contents: read
jobs:
  backend:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - run: go test -count=1 ./...
      - run: go build ./...
