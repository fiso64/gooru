name: Maintainer 720 patch

on:
  push:
    branches:
      - maintainer/720-simplify-upload-conflicts

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Apply simplification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/maintainer_720_patch.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          def rw(path, old, new):
              p = root / path
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: missing {old!r}')
              p.write_text(text.replace(old, new))

          rw('internal/serve/background_upload_import_state_test.go', 'backgroundUploadImportState{taskID: task.ID}, nil)', 'backgroundUploadImportState{taskID: task.ID})')
          rw('internal/serve/background_upload_worker_test.go', 'backgroundUploadImportedCheckpoint(nil, response)', 'backgroundUploadImportedCheckpoint(response)')
          rw('internal/serve/background_uploads_test.go', 'backgroundUploadActivatedCheckpoint(nil,', 'backgroundUploadActivatedCheckpoint(')
          rw('internal/serve/background_uploads_test.go', 'backgroundUploadImportedCheckpoint(nil,', 'backgroundUploadImportedCheckpoint(')
          rw('internal/serve/upload_durable_recovery_test.go', 'cleanupCanceledClaimedUpload(files, nil)', 'cleanupCanceledClaimedUpload(files)')

          for path in root.glob('internal/serve/*_test.go'):
              text = path.read_text()
              text = text.replace('backgroundUploadImportedCheckpoint(nil, ', 'backgroundUploadImportedCheckpoint(')
              text = re.sub(r'(?m)^([ \t]*)_, err := activateSavedDurableUploads\(([^\n]+)\)$', r'\1err := activateSavedDurableUploads(\2)', text)
              text = re.sub(r'if _, err := activateSavedDurableUploads\(([^;]+)\);', r'if err := activateSavedDurableUploads(\1);', text)
              path.write_text(text)

          for name in ['internal/serve/upload_protected_retry_test.go']:
              p = root / name
              text = p.read_text()
              text = re.sub(r'(library\.importUploadedFiles\([^\n]+), nil\)', r'\1)', text)
              p.write_text(text)

          p = root / 'internal/serve/background_upload_worker_test.go'
          text = p.read_text()
          starts = list(re.finditer(r'(?m)^func (Test\w+)\(', text))
          removals = []
          for i, m in enumerate(starts):
              end = starts[i + 1].start() if i + 1 < len(starts) else len(text)
              chunk = text[m.start():end]
              if 'replace: true' in chunk or 'activatedReplacement' in chunk or 'prepareDurableReplacementRecoveryMarkers' in chunk:
                  removals.append((m.start(), end))
          for start, end in reversed(removals):
              text = text[:start] + text[end:]
          for imp in ['\t"errors"\n', '\t"os"\n', '\t"path/filepath"\n']:
              text = text.replace(imp, '')
          p.write_text(text)
          PY
          rm scripts/maintainer_720_patch.py .github/workflows/maintainer-720.yml
          changed_go="$(git diff --name-only --diff-filter=ACM -- '*.go')"
          if [ -n "$changed_go" ]; then printf '%s\n' "$changed_go" | xargs gofmt -w; fi
          # Stage the post-transform tree before tests. The storage architecture
          # guard intentionally enumerates git's index via `git ls-files`; without
          # staging, files deliberately deleted by this change still appear there.
          git add -A
          git diff --cached --check
          echo '=== remaining upload-policy/replacement-specific symbols ==='
          git grep -n -E 'uploads\.conflict_policy|case "skip"|case "replace"|activatedSavedReplacement|upload_replacement_recovery|conflict_policy.*skip|conflict_policy.*replace' -- internal/serve docs spec scripts frontend/src frontend/tests || true
          git status --short
      - name: Focused Go tests
        run: go test -count=1 ./internal/serve
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Regenerate API client
        working-directory: frontend
        run: npm run generate:api
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'autonomous-maintainer'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'fix(upload): simplify filename conflicts to rename/error'
          git push origin HEAD:maintainer/720-simplify-upload-conflicts
