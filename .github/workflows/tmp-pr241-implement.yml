name: Temporary PR 241 implementation

on:
  push:
    branches:
      - fix/241-ui-full-media-config

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/241-ui-full-media-config
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply configuration move
        run: python3 .github/tmp-pr241.py
      - name: Format
        run: gofmt -w internal/serve/config.go internal/serve/ui_config.go internal/serve/ui_config_test.go
      - name: Focused configuration tests
        run: go test ./internal/serve
      - name: Full Go tests
        run: go test ./...
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/serve/config.go internal/serve/ui_config.go internal/serve/ui_config_test.go docs/CONFIG.md
          git commit -m "fix(config): move full-media default under ui"
          git push origin HEAD:fix/241-ui-full-media-config
