name: Maintainer issue 657

on:
  push:
    branches:
      - maintainer/issue-657-simplify-search-suggestions

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/issue-657-simplify-search-suggestions
      - name: Simplify search suggestions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/lib/components/SearchBar.svelte')
          text = path.read_text()
          replacements = {
              "  type SuggestionGroup = { head: string; items: SuggestionItem[] };\n":
                  "  type SuggestionGroup = { items: SuggestionItem[] };\n",
              "  const flat = $derived(groups.flatMap((group) => group.items.map((item) => ({ ...item, group: group.head }))));\n":
                  "  const flat = $derived(groups.flatMap((group) => group.items));\n",
              "      if (completionItems.length) result.push({ head: 'Suggestions', items: completionItems });\n":
                  "      if (completionItems.length) result.push({ items: completionItems });\n",
              "      if (specialItems.length) result.push({ head: 'Query', items: specialItems });\n":
                  "      if (specialItems.length) result.push({ items: specialItems });\n",
              "    if (values.length) result.push({ head: `${ns}:`, items: values });\n":
                  "    if (values.length) result.push({ items: values });\n",
              "    if (specialItems.length) result.push({ head: 'Query', items: specialItems });\n":
                  "    if (specialItems.length) result.push({ items: specialItems });\n",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing SearchBar fragment: {old!r}')
              text = text.replace(old, new, 1)

          old_markup = '''      {#each groups as group, groupIndex}\n        {@const offset = groups.slice(0, groupIndex).reduce((sum, item) => sum + item.items.length, 0)}\n        <li class="group-head">\n          <span>{group.head}</span>\n          <span>{group.items.length}</span>\n        </li>\n        {#each group.items as item, itemIndex}\n          {@const flatIndex = offset + itemIndex}\n          <li role="presentation">\n            <button\n              class:is-active={flatIndex === active}\n              type="button"\n              role="option"\n              aria-selected={flatIndex === active}\n              onmouseenter={() => (active = flatIndex)}\n              onclick={() => selectSuggestion(item)}\n            >\n              <span class="tok">\n                {#if item.ns}<span class="ns">{item.ns}:</span>{/if}<span>{item.val}</span>\n              </span>\n              {#if item.hint}<span class="hint">{item.hint}</span>{/if}\n              {#if item.count != null}<span class="count">{item.count.toLocaleString()}</span>{/if}\n            </button>\n          </li>\n        {/each}\n      {/each}\n      <li class="search-suggestions-footer">\n        <span class="keys">\n          <span><span class="g-kbd">↑</span><span class="g-kbd">↓</span> navigate</span>\n          <span><span class="g-kbd">↵</span> select</span>\n          <span><span class="g-kbd">Esc</span> close</span>\n        </span>\n        <span>prefix <span class="g-kbd">-</span> to exclude</span>\n      </li>\n'''
          new_markup = '''      {#each flat as item, flatIndex}\n        <li role="presentation">\n          <button\n            class:is-active={flatIndex === active}\n            type="button"\n            role="option"\n            aria-selected={flatIndex === active}\n            onmouseenter={() => (active = flatIndex)}\n            onclick={() => selectSuggestion(item)}\n          >\n            <span class="tok">\n              {#if item.ns}<span class="ns">{item.ns}:</span>{/if}<span>{item.val}</span>\n            </span>\n            {#if item.hint}<span class="hint">{item.hint}</span>{/if}\n            {#if item.count != null}<span class="count">{item.count.toLocaleString()}</span>{/if}\n          </button>\n        </li>\n      {/each}\n'''
          if old_markup not in text:
              raise SystemExit('search suggestion markup block not found')
          path.write_text(text.replace(old_markup, new_markup, 1))

          test_path = Path('frontend/tests/search-completion-ranking.spec.ts')
          test_text = test_path.read_text()
          regression = '''\n\ntest('search suggestions omit redundant group headers and keyboard footer', async ({ page }) => {\n  await mockApp(page);\n  const search = page.getByLabel('Search library');\n\n  await search.pressSequentially('hero', { delay: 10 });\n  const suggestions = page.getByRole('listbox', { name: 'Search suggestions' });\n  await expect(suggestions).toBeVisible();\n  await expect(suggestions.getByRole('option')).not.toHaveCount(0);\n  await expect(suggestions.getByText('Suggestions', { exact: true })).toHaveCount(0);\n  await expect(suggestions.getByText('Query', { exact: true })).toHaveCount(0);\n  await expect(suggestions.getByText(/navigate|select|close|prefix .* to exclude/i)).toHaveCount(0);\n});\n'''
          if "search suggestions omit redundant group headers and keyboard footer" in test_text:
              raise SystemExit('regression already present')
          test_path.write_text(test_text.rstrip() + regression)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: New popup regression
        working-directory: frontend
        run: npx playwright test search-completion-ranking.spec.ts --grep 'search suggestions omit redundant group headers and keyboard footer'
      - name: Search ranking regressions
        working-directory: frontend
        run: npx playwright test search-completion-ranking.spec.ts --grep-invert 'search suggestions omit redundant group headers and keyboard footer'
      - name: Completion scroll regression
        working-directory: frontend
        run: npx playwright test completion-scroll.spec.ts
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Commit implementation
        run: |
          rm .github/workflows/maintainer-issue-657.yml
          git config user.name "OpenAI Maintainer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: simplify search suggestion popup"
          git push origin HEAD:maintainer/issue-657-simplify-search-suggestions
