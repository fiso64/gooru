name: Temporary AGPL license sync

on:
  push:
    branches: [feat/242-agpl-3-license]
    paths:
      - .github/workflows/tmp-242-license-sync.yml

permissions:
  contents: write

jobs:
  sync-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/242-agpl-3-license
      - name: Replace license with canonical SPDX text
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/AGPL-3.0-only.txt \
            --output LICENSE
          grep -qx 'GNU AFFERO GENERAL PUBLIC LICENSE' <(head -n 1 LICENSE)
          grep -qx 'END OF TERMS AND CONDITIONS' <(grep 'END OF TERMS AND CONDITIONS' LICENSE)
      - name: Commit canonical text and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-242-license-sync.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add LICENSE .github/workflows/tmp-242-license-sync.yml
          git commit -m 'docs: sync canonical AGPL-3.0-only text'
          git push origin HEAD:feat/242-agpl-3-license
