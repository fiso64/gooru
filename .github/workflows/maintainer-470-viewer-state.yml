name: Maintainer 470 viewer state

on:
  push:
    branches:
      - fix/470-viewer-media-state

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on:
      - self-hosted
      - gooru
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/470-viewer-media-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply focused regression fix
        run: python3 .github/maintainer-470-patch.py
      - name: Format Go
        run: gofmt -w internal/serve/browse.go internal/serve/browse_test.go
      - name: Install frontend dependencies and generate API types
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run generate:api
      - name: Focused Go regression
        run: go test ./internal/serve -run 'TestFileDTOReportsViewerSupportFromBackendMediaKind|TestBrowseFilesAndDetailsUseOpaqueIDs' -count=1
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run check
      - name: Focused browser regression
        working-directory: frontend
        run: |
          npx playwright install chromium
          npm run test:e2e -- viewer-image-geometry-hold.spec.ts
      - name: Full Go validation
        run: |
          go test ./...
          go build ./...
      - name: Frontend unit and build
        working-directory: frontend
        run: |
          npm run test:unit
          npm run build
      - name: Commit validated fix and remove temporary files
        run: |
          rm .github/workflows/maintainer-470-viewer-state.yml .github/maintainer-470-patch.py
          git config user.name "gooru maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(viewer): distinguish unsupported media from missing files"
          git push origin HEAD:fix/470-viewer-media-state
