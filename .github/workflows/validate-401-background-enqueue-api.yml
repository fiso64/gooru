name: Validate #401 background enqueue API

on:
  push:
    branches:
      - refactor/401-background-enqueue-api

permissions:
  contents: write

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Normalize formatting
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w gooru/background.go gooru/database_boundary.go gooru/background_enqueue_test.go
          if ! git diff --quiet -- gooru/background.go gooru/database_boundary.go gooru/background_enqueue_test.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gooru/background.go gooru/database_boundary.go gooru/background_enqueue_test.go
            git commit -m "style: gofmt background enqueue slice"
            git push origin HEAD:refactor/401-background-enqueue-api
          fi
      - name: Formatting guard
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l gooru/background.go gooru/database_boundary.go gooru/background_enqueue_test.go)
          test -z "$files" || { printf 'gofmt required:\n%s\n' "$files"; exit 1; }
      - name: Focused tests
        run: go test ./gooru ./internal/database ./internal/background
      - name: Full Go tests
        run: go test ./...
      - name: Build
        run: go build ./...
