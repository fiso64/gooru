name: Validate #401 background enqueue API

on:
  push:
    branches:
      - refactor/401-background-enqueue-api

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Locate Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          gofmt_path="$(find /nix/store /usr/local /opt -type f -name gofmt -perm -111 2>/dev/null | head -n 1 || true)"
          if [ -z "$gofmt_path" ]; then
            echo "unable to locate gofmt" >&2
            exit 1
          fi
          go_bin="$(dirname "$gofmt_path")"
          test -x "$go_bin/go" || { echo "go binary missing beside $gofmt_path" >&2; exit 1; }
          echo "$go_bin" >> "$GITHUB_PATH"
          "$go_bin/go" version
      - name: Formatting guard
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l gooru/background.go gooru/database_boundary.go gooru/background_enqueue_test.go)
          test -z "$files" || { printf 'gofmt required:\n%s\n' "$files"; exit 1; }
      - name: Focused tests
        run: go test ./gooru ./internal/database ./internal/background
      - name: Full Go tests
        run: go test ./...
      - name: Build
        run: go build ./...
