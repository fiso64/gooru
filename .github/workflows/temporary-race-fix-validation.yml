name: Temporary race fix validation

on:
  push:
    branches:
      - maintainer/549-go-vet-race-audit
    paths:
      - .github/workflows/temporary-race-fix-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and validate cancellation synchronization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('internal/serve/uploads_durable_test.go')
          text = path.read_text()
          old = "\tdone := make(chan struct{})\n\tgo func() {\n\t\tserver.Handler().ServeHTTP(rec, req)\n\t\tclose(done)\n\t}()\n\n\t<-store.attached\n\tcancel()\n"
          new = "\tdone := make(chan struct{})\n\tattached := store.attached\n\tgo func() {\n\t\tserver.Handler().ServeHTTP(rec, req)\n\t\tclose(done)\n\t}()\n\n\t<-attached\n\tcancel()\n"
          if text.count(old) != 1:
              raise SystemExit('unexpected cancellation synchronization block count')
          path.write_text(text.replace(old, new, 1))
          PY
          go test -race ./internal/serve -run '^TestDurableUploadSyncCancellationCancelsOperation$' -count=20
          git config user.name 'fiso64'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git add internal/serve/uploads_durable_test.go
          git commit -m 'test: avoid raced upload attachment signal'
          git push origin HEAD:maintainer/549-go-vet-race-audit
