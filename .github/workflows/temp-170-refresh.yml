name: temp-170-refresh
on:
  push:
    branches: [fix/22-image-geometry-hold]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply current experiment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/components/ViewerStage.svelte')
          s = p.read_text()
          old = '''      // Foreground images should enter the browser's native loading/decoding pipeline immediately.\n      // Blocking the visible source swap on Image.decode() starves progressive presentation when\n      // key-repeat advances targets faster than full decodes can finish. Metadata preserves atomic\n      // geometry where available; the real image load reconciles natural dimensions afterward.\n      const metadataWidth = targetFile.metadata?.image_width ?? 0;\n      const metadataHeight = targetFile.metadata?.image_height ?? 0;\n      if (metadataWidth > 0 && metadataHeight > 0) {\n        intrinsicWidth = metadataWidth;\n        intrinsicHeight = metadataHeight;\n      }\n'''
          new = '''      // Foreground images should enter the browser's native loading/decoding pipeline immediately.\n      // Keep the currently painted image geometry until the target's load event updates natural\n      // dimensions. Applying target metadata before those pixels are ready visibly resizes the old\n      // bitmap during the network/decode gap when aspect ratios differ.\n'''
          if old not in s:
              raise SystemExit('expected current develop image-transition block not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              '''    // Image transitions install metadata dimensions before swapping sources, then the\n    // rendered image reconciles natural dimensions on load. Non-image media waits for metadata.\n''',
              '''    // Image geometry stays at the last painted dimensions until the target image loads.\n    // Non-image media waits for its own metadata path and starts with no image geometry.\n''',
              1,
          )
          p.write_text(s)
          PY
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm run test:unit
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test tests/viewer-image-geometry-hold.spec.ts tests/viewer-zoom-pan.spec.ts tests/viewer-animation.spec.ts
      - name: Commit validated experiment and remove temporary workflow
        run: |
          rm .github/workflows/temp-170-refresh.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/ViewerStage.svelte .github/workflows/temp-170-refresh.yml
          git commit -m 'fix(viewer): refresh geometry hold on current develop'
          git push
