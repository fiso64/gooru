name: Temporary #310 validation

on:
  push:
    branches:
      - fix/310-prefix-stable-tile-pages

permissions:
  contents: read

jobs:
  frontend:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright test tests/grid-scroll-performance.spec.ts --project=chromium
