name: Temporary CBZ viewer patch
on:
  push:
    branches:
      - feat/22-cbz-viewer
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/22-cbz-viewer
      - name: Patch parent viewer integration
        run: python scripts/tmp_patch_cbz_viewer.py
      - name: Check patch
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "Gooru Maintainer"
          git config user.email "maintainer@users.noreply.github.com"
          git add frontend/src/lib/components/AuthenticatedApp.svelte
          git commit -m "feat(comics): route nested viewer navigation"
          git push origin HEAD:feat/22-cbz-viewer
