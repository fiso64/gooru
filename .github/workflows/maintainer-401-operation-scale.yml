name: Maintainer 401 operation scale diagnostic

on:
  push:
    branches:
      - maintainer/401-operation-progress-scale

permissions:
  contents: read

concurrency:
  group: maintainer-401-operation-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Benchmark 1000-task operation lifecycle
        run: go test ./internal/database -run '^$' -bench '^BenchmarkBackgroundOperationLifecycleFanout$' -benchtime=1x -count=1
