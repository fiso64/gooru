name: PR271 contract repair
on:
  push:
    branches: [feat/264-saved-search-order]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[pr271-contract-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Align OpenAPI and generated client
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/openapi.yaml')
          s = p.read_text()
          marker = '  /saved-searches/{id}:\n'
          block = '''  /saved-searches/reorder:\n    put:\n      summary: Replace the current user's complete saved-search order.\n      security:\n        - sessionAuth: []\n      parameters:\n        - $ref: "#/components/parameters/CSRF"\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              required: [ids]\n              properties:\n                ids:\n                  type: array\n                  items:\n                    type: string\n      responses:\n        "200":\n          description: Saved-search order persisted.\n        "400":\n          $ref: "#/components/responses/BadRequest"\n        "401":\n          $ref: "#/components/responses/Unauthorized"\n        "403":\n          $ref: "#/components/responses/Forbidden"\n'''
          if '  /saved-searches/reorder:\n' not in s:
              if marker not in s:
                  raise SystemExit('saved-search marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)

          p = Path('frontend/src/lib/api/client.ts')
          s = p.read_text()
          start = s.index('  async reorderSavedSearches(ids: string[]): Promise<void> {')
          end = s.index('\n  async deleteSavedSearch', start)
          replacement = '''  async reorderSavedSearches(ids: string[]): Promise<void> {\n    await this.unwrap(\n      this.client.PUT('/saved-searches/reorder', {\n        params: { header: this.csrfHeaderParam('PUT') },\n        body: { ids }\n      })\n    );\n  }\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
          cd frontend
          npm ci
          npm run generate:api
          npm run check
          npm run test:unit
          npm run build
          cd ..
          go test ./...
          git diff --check
      - name: Commit repaired contract and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-pr271-contract.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(saved-search): align reorder API contract [pr271-contract-done]'
          git push origin HEAD:feat/264-saved-search-order
