name: Maintainer #916 one-shot Go formatting
on:
  push:
    branches:
      - feat-916-secure-upload-default
    paths:
      - .github/workflows/maintainer-916-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-916-secure-upload-default
          persist-credentials: true
      - name: Format affected Go sources and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/serve/default_uploads*.go internal/serve/upload_default*.go internal/serve/auth_store_test.go internal/serve/config.go
          git rm .github/workflows/maintainer-916-gofmt.yml
          git add internal/serve/default_uploads*.go internal/serve/upload_default*.go internal/serve/auth_store_test.go internal/serve/config.go
          git diff --cached --check
          git config user.name "gooru-maintainer"
          git config user.email "gooru-maintainer@users.noreply.github.com"
          git commit -m "style: gofmt secure default-upload implementation and tests"
          git push origin HEAD:feat-916-secure-upload-default
