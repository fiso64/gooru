name: maint-409
on:
  push:
    branches: [fix/409-hover-play-defaults-docs]
jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/409-hover-play-defaults-docs
      - name: Validate focused configuration behavior
        run: nix develop -c go test -mod=mod ./internal/serve -run 'TestHoverPlaybackConfigDefaultsAndOverrides|TestUIConfigExposesHoverPlaybackPreferences'
      - name: Validate full Go suite
        run: nix develop -c go test -mod=mod ./...
      - name: Validate Go build
        run: nix develop -c go build -mod=mod ./...
      - name: Validate frontend
        run: nix develop -c bash -lc 'cd frontend && npm ci && npm run check && npm test -- --run && npm run build'
