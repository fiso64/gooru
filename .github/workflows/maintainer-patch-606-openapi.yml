name: Maintainer patch #606 OpenAPI

on:
  push:
    branches:
      - maintainer/fix-606-inaccurate-ui
    paths:
      - .github/workflows/maintainer-patch-606-openapi.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/fix-606-inaccurate-ui
          fetch-depth: 0
      - name: Add cancel-all operation contract and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/openapi.yaml')
          text = path.read_text()
          marker = '  /operations/{id}:\n'
          if marker not in text:
              raise SystemExit('operations/{id} marker not found')
          if '  /operations/cancel-all:\n' in text:
              raise SystemExit('cancel-all contract already present')
          block = '''  /operations/cancel-all:\n    delete:\n      summary: Cancel all visible active durable background operations.\n      description: Cancels every visible pending or running durable operation. Terminal history and hidden implementation operations are not affected.\n      security:\n        - sessionAuth: []\n      parameters:\n        - $ref: "#/components/parameters/CSRF"\n      responses:\n        "200":\n          description: Active visible operations canceled.\n          content:\n            application/json:\n              schema:\n                type: object\n                required: [canceled]\n                properties:\n                  canceled:\n                    type: integer\n                    minimum: 0\n        "401":\n          $ref: "#/components/responses/Unauthorized"\n        "403":\n          $ref: "#/components/responses/Forbidden"\n        "500":\n          description: Active operations could not be listed or canceled.\n          content:\n            application/json:\n              schema:\n                $ref: "#/components/schemas/ErrorResponse"\n        "503":\n          $ref: "#/components/responses/ServiceUnavailable"\n'''
          path.write_text(text.replace(marker, block + marker, 1))
          PY
          rm .github/workflows/maintainer-patch-606-openapi.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.yaml .github/workflows/maintainer-patch-606-openapi.yml
          git diff --cached --check
          git commit -m "docs: document bulk operation cancellation"
          git push origin HEAD:maintainer/fix-606-inaccurate-ui
