name: Validate #401 background operation API

on:
  push:
    branches:
      - refactor/401-background-operation-api

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting guard
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l gooru/background.go gooru/database_boundary.go gooru/background_enqueue_test.go)
          test -z "$files" || { printf 'gofmt required:\n%s\n' "$files"; exit 1; }
      - name: Focused tests
        run: go test ./gooru ./internal/database ./internal/background
      - name: Full Go tests
        run: go test ./...
      - name: Build
        run: go build ./...
