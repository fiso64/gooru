name: temp-333-hidden-facet-patch

on:
  push:
    branches:
      - perf/333-hidden-tag-facet-exclusions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/333-hidden-tag-facet-exclusions
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check function marker
        run: grep -Fq 'func (c *Client) KindFacetsByQuery(expression string, verbose bool) ([]types.TagWithCount, error) {' gooru/query.go
      - name: Check fallback anchor
        run: grep -Fq $'\tsqlQuery, args, err := c.buildLocationQuery(expression)' gooru/query.go
      - name: Decode insertion
        run: echo '' | base64 -d >/tmp/hidden-block.go
      - name: Insert exclusion fast path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gooru/query.go')
          text = path.read_text()
          marker = 'func (c *Client) KindFacetsByQuery(expression string, verbose bool) ([]types.TagWithCount, error) {'
          start = text.index(marker)
          anchor_text = '\n\tsqlQuery, args, err := c.buildLocationQuery(expression)'
          anchor = text.index(anchor_text, start)
          block = Path('/tmp/hidden-block.go').read_text()
          path.write_text(text[:anchor] + '\n' + block + text[anchor:])
          PY
      - name: Format source
        run: gofmt -w gooru/query.go
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gooru/query.go
          git commit -m 'perf: use summaries for hidden tag facet exclusions'
          git push origin HEAD:perf/333-hidden-tag-facet-exclusions
