name: temp-333-hidden-facet-patch

on:
  push:
    branches:
      - perf/333-hidden-tag-facet-exclusions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/333-hidden-tag-facet-exclusions
      - name: Patch or persist diagnostic
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/patch.log 2>&1
          import base64
          from pathlib import Path
          path = Path('gooru/query.go')
          text = path.read_text()
          marker = 'func (c *Client) KindFacetsByQuery(expression string, verbose bool) ([]types.TagWithCount, error) {'
          anchor_text = '\n\tsqlQuery, args, err := c.buildLocationQuery(expression)'
          print('marker_index', text.find(marker))
          start = text.index(marker)
          print('anchor_index_after_marker', text.find(anchor_text, start))
          anchor = text.index(anchor_text, start)
          block = base64.b64decode('').decode()
          path.write_text(text[:anchor] + '\n' + block + text[anchor:])
          PY
          status=$?
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -ne 0 ]; then
            cp /tmp/patch.log .github/temp-333-patch-diagnostic.txt
            git add .github/temp-333-patch-diagnostic.txt
            git commit -m 'ci: capture hidden facet patch diagnostic'
            git push origin HEAD:perf/333-hidden-tag-facet-exclusions
            exit 0
          fi
          gofmt -w gooru/query.go
          git add gooru/query.go
          git commit -m 'perf: use summaries for hidden tag facet exclusions'
          git push origin HEAD:perf/333-hidden-tag-facet-exclusions
