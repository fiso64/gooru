name: temp-333-hidden-facet-patch

on:
  push:
    branches:
      - perf/333-hidden-tag-facet-exclusions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/333-hidden-tag-facet-exclusions
      - name: Patch KindFacetsByQuery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gooru/query.go')
          text = path.read_text()
          marker = 'func (c *Client) KindFacetsByQuery(expression string, verbose bool) ([]types.TagWithCount, error) {'
          if marker not in text:
              raise SystemExit('KindFacetsByQuery marker not found')
          prefix, rest = text.split(marker, 1)
          anchor = '\n\tsqlQuery, args, err := c.buildLocationQuery(expression)'
          if anchor not in rest:
              raise SystemExit('KindFacetsByQuery fallback anchor not found')
          block = (
              '\n\tif exclusions, ok := parseSimpleUserTagFacetExclusions(expression); ok {\n'
              '\t\tall, err := c.store.KindFacets()\n'
              '\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\n'
              '\t\tvar excluded []types.TagWithCount\n'
              '\t\tif len(exclusions) == 1 {\n'
              '\t\t\tfilter := exclusions[0]\n'
              '\t\t\tif filter.KeyOnly {\n'
              '\t\t\t\texcluded, err = c.store.KindFacetsForTagKey(filter.Tag.Key)\n'
              '\t\t\t} else {\n'
              '\t\t\t\texcluded, err = c.store.KindFacetsForTag(filter.Tag.Key, filter.Tag.Value)\n'
              '\t\t\t}\n'
              '\t\t} else {\n'
              '\t\t\tdbExclusions := make([]tagFacetExclusion, 0, len(exclusions))\n'
              '\t\t\tfor _, filter := range exclusions {\n'
              '\t\t\t\tdbExclusions = append(dbExclusions, tagFacetExclusion{\n'
              '\t\t\t\t\tKey: filter.Tag.Key, Value: filter.Tag.Value, KeyOnly: filter.KeyOnly,\n'
              '\t\t\t\t})\n'
              '\t\t\t}\n'
              '\t\t\texcluded, err = c.store.KindFacetsForTagExclusions(dbExclusions)\n'
              '\t\t}\n'
              '\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n'
              '\t\treturn subtractKindFacets(all, excluded), nil\n'
              '\t}\n'
          )
          rest = rest.replace(anchor, block + anchor, 1)
          path.write_text(prefix + marker + rest)
          PY
          gofmt -w gooru/query.go
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gooru/query.go
          git commit -m 'perf: use summaries for hidden tag facet exclusions'
          git push origin HEAD:perf/333-hidden-tag-facet-exclusions
