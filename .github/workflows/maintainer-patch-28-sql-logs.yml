name: Maintainer patch 28 SQL logs

on:
  push:
    branches:
      - fix/28-redact-sql-log-args

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/28-redact-sql-log-args
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply SQL log redaction
        id: patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/database/database.go')
          text = path.read_text()
          if 'bound values redacted' in text:
              Path('/tmp/changed').write_text('false')
              raise SystemExit(0)
          anchor = '''func (s *Store) Close() error {\n\terr := s.DB.Close()\n\tif secureErr := SecureDBFiles(s.dataSourceName); err == nil {\n\t\terr = secureErr\n\t}\n\treturn err\n}\n'''
          helper = anchor + '''\nfunc logQuery(logger *log.Logger, query string, args []interface{}) {\n\tlogger.Printf("QUERY: %s\\n-- ARGS: %d bound values redacted", query, len(args))\n}\n'''
          if text.count(anchor) != 1:
              raise SystemExit('store Close anchor not found exactly once')
          text = text.replace(anchor, helper)
          old = 's.logger.Printf("QUERY: %s\\n-- ARGS: %v", query, args)'
          if text.count(old) != 3:
              raise SystemExit(f'expected 3 Store SQL log sites, found {text.count(old)}')
          text = text.replace(old, 'logQuery(s.logger, query, args)')
          old = 'tx.logger.Printf("QUERY: %s\\n-- ARGS: %v", query, args)'
          if text.count(old) != 3:
              raise SystemExit(f'expected 3 Tx SQL log sites, found {text.count(old)}')
          text = text.replace(old, 'logQuery(tx.logger, query, args)')
          path.write_text(text)
          Path('/tmp/changed').write_text('true')
          PY
          echo "changed=$(cat /tmp/changed)" >> "$GITHUB_OUTPUT"
          if [ "$(cat /tmp/changed)" = true ]; then
            gofmt -w internal/database/database.go internal/database/logging_test.go
          fi
      - name: Go build
        if: steps.patch.outputs.changed == 'true'
        run: go build ./...
      - name: Go tests
        if: steps.patch.outputs.changed == 'true'
        run: go test ./...
      - uses: actions/setup-node@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        if: steps.patch.outputs.changed == 'true'
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        if: steps.patch.outputs.changed == 'true'
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend check
        if: steps.patch.outputs.changed == 'true'
        working-directory: frontend
        run: npm run check
      - name: Frontend build
        if: steps.patch.outputs.changed == 'true'
        working-directory: frontend
        run: npm run build
      - name: Commit validated redaction
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name 'Gooru Maintainer'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git add internal/database/database.go internal/database/logging_test.go
          git diff --cached --check
          git commit -m 'fix(security): redact SQL log arguments'
          git push origin HEAD:fix/28-redact-sql-log-args
