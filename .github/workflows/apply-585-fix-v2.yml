name: Apply 585 cancellation fix v2

on:
  push:
    branches:
      - maintainer/repro-585-active-upload-cancel

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once('frontend/src/lib/api/client.ts', """      preferAsync,\n      onProgress\n    });""", """      preferAsync,\n      onProgress,\n      signal: ordering.signal\n    });""")
          replace_once('frontend/src/lib/api/client.ts', """  queueIndex?: number[];\n  queueTotal?: number[];\n}""", """  queueIndex?: number[];\n  queueTotal?: number[];\n  signal?: AbortSignal;\n}""")
          replace_once('frontend/src/lib/api/client.ts', """interface UploadMultipartOptions {\n  csrfToken: string;\n  preferAsync: boolean;\n  onProgress?: (progress: number) => void;\n}""", """interface UploadMultipartOptions {\n  csrfToken: string;\n  preferAsync: boolean;\n  onProgress?: (progress: number) => void;\n  signal?: AbortSignal;\n}""")
          replace_once('frontend/src/lib/api/client.ts', """    xhr.addEventListener('error', () => reject(new ApiError(0, 'network_error', 'Network error while uploading files')));\n    xhr.addEventListener('abort', () => reject(new ApiError(0, 'request_aborted', 'Upload was canceled')));\n    xhr.send(form);""", """    xhr.addEventListener('error', () => reject(new ApiError(0, 'network_error', 'Network error while uploading files')));\n    xhr.addEventListener('abort', () => reject(new ApiError(0, 'request_aborted', 'Upload was canceled')));\n\n    if (options.signal?.aborted) {\n      reject(new ApiError(0, 'request_aborted', 'Upload was canceled'));\n      return;\n    }\n    const abortUpload = () => xhr.abort();\n    options.signal?.addEventListener('abort', abortUpload, { once: true });\n    xhr.addEventListener('loadend', () => options.signal?.removeEventListener('abort', abortUpload), { once: true });\n    xhr.send(form);""")

          replace_once('frontend/src/lib/queries/library.ts', """  queueIndex: number[];\n  queueTotal: number[];\n  onProgress?: (progress: number) => void;""", """  queueIndex: number[];\n  queueTotal: number[];\n  onProgress?: (progress: number) => void;\n  signal?: AbortSignal;""")
          replace_once('frontend/src/lib/queries/library.ts', """    mutationFn: ({ files, tags, preferAsync, targetID, conflictPolicy, addedAtStrategy, queueTimeMs, queueFirstTimeMs, queueLastTimeMs, queueIndex, queueTotal, onProgress }) =>\n      new ApiClient(getCSRFToken()).uploadFiles(files, tags, preferAsync, targetID, conflictPolicy, onProgress, {\n        addedAtStrategy,\n        queueTimeMs,\n        queueFirstTimeMs,\n        queueLastTimeMs,\n        queueIndex,\n        queueTotal\n      })""", """    mutationFn: ({ files, tags, preferAsync, targetID, conflictPolicy, addedAtStrategy, queueTimeMs, queueFirstTimeMs, queueLastTimeMs, queueIndex, queueTotal, onProgress, signal }) =>\n      new ApiClient(getCSRFToken()).uploadFiles(files, tags, preferAsync, targetID, conflictPolicy, onProgress, {\n        addedAtStrategy,\n        queueTimeMs,\n        queueFirstTimeMs,\n        queueLastTimeMs,\n        queueIndex,\n        queueTotal,\n        signal\n      })""")

          replace_once('frontend/src/lib/state/uploadWorkflow.svelte.ts', """  let activeSubmissions = $state(0);\n  let cancelBusy = $state(false);""", """  let activeSubmissions = $state(0);\n  const activeSubmissionControllers = new Set<AbortController>();\n  let cancelBusy = $state(false);""")
          replace_once('frontend/src/lib/state/uploadWorkflow.svelte.ts', """  function reset() {\n    files = [];""", """  function reset() {\n    for (const controller of activeSubmissionControllers) controller.abort();\n    activeSubmissionControllers.clear();\n    files = [];""")
          replace_once('frontend/src/lib/state/uploadWorkflow.svelte.ts', """    items = nextItems;\n    files = [];\n    activeSubmissions += 1;""", """    items = nextItems;\n    files = [];\n    const controller = new AbortController();\n    activeSubmissionControllers.add(controller);\n    activeSubmissions += 1;""")
          replace_once('frontend/src/lib/state/uploadWorkflow.svelte.ts', """        onProgress: (progress) => {\n          const fileProgress = perFileUploadProgress(batchFiles, progress);\n          batchItemIndices.forEach((itemIndex, fileIndex) => {\n            const current = items[itemIndex];\n            replaceItem(itemIndex, current ? uploadProgressItem([current], 0, fileProgress[fileIndex] ?? progress)[0] : undefined);\n          });\n        }\n      });""", """        onProgress: (progress) => {\n          const fileProgress = perFileUploadProgress(batchFiles, progress);\n          batchItemIndices.forEach((itemIndex, fileIndex) => {\n            const current = items[itemIndex];\n            replaceItem(itemIndex, current ? uploadProgressItem([current], 0, fileProgress[fileIndex] ?? progress)[0] : undefined);\n          });\n        },\n        signal: controller.signal\n      });""")
          replace_once('frontend/src/lib/state/uploadWorkflow.svelte.ts', """    } catch (error) {\n      const message = errorMessage(error);\n      for (const itemIndex of batchItemIndices) {\n        const current = items[itemIndex];\n        if (current) replaceItem(itemIndex, { ...current, status: 'error', error: message });\n      }\n    } finally {\n      activeSubmissions = Math.max(0, activeSubmissions - 1);""", """    } catch (error) {\n      if (controller.signal.aborted) {\n        for (const itemIndex of batchItemIndices) {\n          const current = items[itemIndex];\n          if (current) replaceItem(itemIndex, { ...current, status: 'canceled', error: '' });\n        }\n      } else {\n        const message = errorMessage(error);\n        for (const itemIndex of batchItemIndices) {\n          const current = items[itemIndex];\n          if (current) replaceItem(itemIndex, { ...current, status: 'error', error: message });\n        }\n      }\n    } finally {\n      activeSubmissionControllers.delete(controller);\n      activeSubmissions = Math.max(0, activeSubmissions - 1);""")
          replace_once('frontend/src/lib/state/uploadWorkflow.svelte.ts', """    if (activeSubmissions > 0) {\n      cancelPending = true;\n      cancelPendingMutate = mutate;\n      changed = true;\n    }""", """    if (activeSubmissions > 0) {\n      cancelPending = true;\n      cancelPendingMutate = mutate;\n      for (const controller of activeSubmissionControllers) controller.abort();\n      changed = true;\n    }""")

          replace_once('frontend/src/lib/components/UploadPanel.svelte', """          <div class:has-active-job={Boolean(activeUploadJobID)} class=\"upload-list-head upload-queue-head\">""", """          <div class:has-active-job={uploadBusy || Boolean(activeUploadJobID)} class=\"upload-list-head upload-queue-head\">""")
          replace_once('frontend/src/lib/components/UploadPanel.svelte', """            {#if activeUploadJobID}\n              <button""", """            {#if uploadBusy || activeUploadJobID}\n              <button""")

          replace_once('.github/workflows/ci.yml', """startup-query-churn.spec.ts upload-metadata-refresh.spec.ts upload-concurrency.spec.ts hover-media-preview.spec.ts""", """startup-query-churn.spec.ts upload-metadata-refresh.spec.ts upload-concurrency.spec.ts upload-cancel-inflight.spec.ts hover-media-preview.spec.ts""")

          Path('.github/workflows/apply-585-fix.yml').unlink(missing_ok=True)
          Path('.github/workflows/apply-585-fix-v2.yml').unlink(missing_ok=True)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(frontend): cancel uploads during active transfer"
          git push origin HEAD:maintainer/repro-585-active-upload-cancel
