name: Validate tag input regression

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  tag-input-browser:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Focused Chromium regression
        run: npx playwright test tests/tag-input-behavior.spec.ts --project=chromium
