name: Temporary PR 271 diagnostics

on:
  push:
    branches:
      - feat/264-saved-search-order

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Capture diagnostics
        id: diagnostics
        shell: bash
        run: |
          set +e
          go test ./... > go-test.log 2>&1
          go_status=$?
          (cd frontend && npm run check) > frontend-check.log 2>&1
          frontend_status=$?
          printf 'go_status=%s\nfrontend_status=%s\n' "$go_status" "$frontend_status" > statuses.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr-271-diagnostics
          path: |
            go-test.log
            frontend-check.log
            statuses.txt
          if-no-files-found: error
