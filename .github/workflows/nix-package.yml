name: Nix package

on:
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'flake.nix'
      - 'flake.lock'
      - 'VERSION'
      - 'internal/buildinfo/**'
      - '.github/workflows/nix-package.yml'
  push:
    branches: [develop]
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'flake.nix'
      - 'flake.lock'
      - 'VERSION'
      - 'internal/buildinfo/**'
      - '.github/workflows/nix-package.yml'

permissions:
  contents: read

concurrency:
  group: nix-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Build packaged application
        run: nix build .#packages.x86_64-linux.default --print-build-logs
      - name: Validate NixOS module
        run: nix build .#checks.x86_64-linux.nixos-module --print-build-logs
