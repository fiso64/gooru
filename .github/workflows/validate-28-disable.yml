name: Validate #28 reversible disable

on:
  push:
    branches:
      - feat/28-reversible-encryption

permissions:
  contents: read

concurrency:
  group: validate-28-disable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        shell: bash
        run: |
          files=$(gofmt -l internal/encryptedfile/migration.go internal/encryptedfile/migration_test.go internal/database/decryption.go internal/database/decryption_test.go internal/serve/protected_cache_transition.go cmd/gooru/cmd/encryption_disable.go cmd/gooru/cmd/encryption_disable_test.go cmd/gooru/cmd/database_storage.go cmd/gooru/cmd/database_storage_test.go)
          test -z "$files" || { echo "$files"; exit 1; }
      - name: Focused tests
        run: go test ./internal/encryptedfile ./internal/database ./internal/serve ./cmd/gooru/cmd
      - name: Full tests
        run: go test ./...
      - name: Build
        run: go build ./...
