name: Temporary 321 validate

on:
  push:
    branches:
      - fix/321-autocomplete-scroll

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/321-autocomplete-scroll
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply fix
        run: |
          python3 .github/tmp-321-apply.py
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/SearchBar.svelte frontend/src/lib/components/TagAutocompleteInput.svelte frontend/tests/completion-scroll.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ui): keep active completions visible'
            git push origin HEAD:fix/321-autocomplete-scroll
          fi
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          npm run build
      - name: Validate completion keyboard regressions
        working-directory: frontend
        run: npx playwright test tests/completion-scroll.spec.ts tests/search-completion-ranking.spec.ts tests/bulk-tag-completions.spec.ts --project=chromium
