name: maintainer-222-run
on:
  push:
    branches: [feat/222-filename-contains-metatag]
permissions:
  contents: write
jobs:
  finish:
    if: "${{ ! contains(github.event.head_commit.message, '[maintainer-222]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply maintained patch
        shell: bash
        run: |
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/maintainer-222.yml | sed 's/^          //' > /tmp/maintainer-222.sh
          bash /tmp/maintainer-222.sh
      - name: Generate API types
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
      - name: Validate Go
        run: go test ./internal/query ./internal/serve
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run test:unit
          npm run check
          npm run build
      - name: Commit finished contract
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal frontend docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(query): finish backend-owned metatag contract [maintainer-222]"
          git push
