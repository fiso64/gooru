name: Maintainer 401 validation

on:
  push:
    branches:
      - maintainer/401-durable-upload-cancel-cleanup

permissions:
  contents: read

concurrency:
  group: maintainer-401-upload-cancel-cleanup
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format gate
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only origin/develop...HEAD -- '*.go')
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            printf 'unformatted changed files:\n%s\n\n' "$unformatted"
            gofmt -d "${files[@]}"
            exit 1
          fi
      - name: Focused tests
        run: go test -count=1 ./internal/database ./gooru ./internal/background ./internal/serve
      - name: Full tests
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...
      - name: Diff check
        run: git diff --check origin/develop...HEAD
