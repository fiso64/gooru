name: maintainer-fix-588

on:
  push:
    branches:
      - maintainer/fix-588-batch-predispatch-state

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Confirm regression reproduces before fix
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run test:unit -- uploadWorkflow.largeBatchDispatch.test.ts --reporter=verbose
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected the pre-fix regression test to fail, but it passed"
            exit 1
          fi
          echo "Confirmed: pre-fix workflow performs per-row Object.assign calls before transport dispatch"
      - name: Batch pre-dispatch upload state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/state/uploadWorkflow.svelte.ts')
          text = path.read_text()
          old_import = "  uploadingItem,\n"
          old_stage = ("    const batchID = ++nextBatchID;\n"
                       "    const nextItems = [...items];\n"
                       "    for (const itemIndex of batchItemIndices) {\n"
                       "      const current = nextItems[itemIndex];\n"
                       "      if (current) nextItems[itemIndex] = { ...current, batchID, status: 'waiting', progress: 0, error: '' };\n"
                       "    }\n"
                       "    items = nextItems;\n")
          new_stage = old_stage.replace("status: 'waiting'", "status: 'uploading'")
          old_loop = ("    for (const itemIndex of batchItemIndices) {\n"
                      "      const current = items[itemIndex];\n"
                      "      replaceItem(itemIndex, current ? uploadingItem([current], 0)[0] : undefined);\n"
                      "    }\n"
                      "    refreshStatus();\n")
          if text.count(old_import) != 1 or text.count(old_stage) != 1 or text.count(old_loop) != 1:
              raise SystemExit('expected uploadWorkflow source blocks were not found exactly once')
          text = text.replace(old_import, '', 1).replace(old_stage, new_stage, 1).replace(old_loop, '    refreshStatus();\n', 1)
          path.write_text(text)
          PY
      - name: Run focused upload tests
        working-directory: frontend
        run: npm run test:unit -- uploadWorkflow.largeBatchDispatch.test.ts uploadWorkflow.svelte.test.ts uploadWorkflow.cancel.test.ts --reporter=verbose
      - name: Run frontend checks
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/maintainer-fix-588.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add frontend/src/lib/state/uploadWorkflow.svelte.ts .github/workflows/maintainer-fix-588.yml
          git commit -m "fix(upload): batch 10k pre-dispatch state transition"
          git push origin HEAD:maintainer/fix-588-batch-predispatch-state
