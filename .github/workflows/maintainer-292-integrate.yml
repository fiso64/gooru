name: Maintainer 292 integration validation

on:
  push:
    branches:
      - feat/278-grid-layout-types

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Repair overlapping config contracts
        run: python3 .github/maintainer-292-repair.py
      - name: Assert combined contracts
        run: |
          grep -q 'GridType' internal/serve/config.go
          grep -q 'ViewerScaling' internal/serve/config.go
          grep -q 'gridType' frontend/src/lib/components/AppPage.svelte
          grep -q 'viewerScaling' frontend/src/lib/components/AppPage.svelte
          grep -q 'ui.grid_type' docs/CONFIG.md
          grep -q 'ui.viewer_scaling' docs/CONFIG.md
      - name: Go tests
        run: go test ./...
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
      - name: Focused Chromium regressions
        working-directory: frontend
        run: |
          chromium=$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)
          test -n "$chromium"
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$chromium" npx playwright test tests/grid-layout-config.spec.ts tests/viewer-fit-mode.spec.ts --project=chromium
      - name: Commit repaired overlaps
        run: |
          if git diff --quiet -- internal/serve/config.go docs/CONFIG.md; then
            exit 0
          fi
          git config user.name 'autonomous-maintainer'
          git config user.email 'autonomous-maintainer@users.noreply.github.com'
          git add internal/serve/config.go docs/CONFIG.md
          git commit -m 'fix(ui): preserve viewer config across grid integration'
          git push origin HEAD:${{ github.ref_name }}
