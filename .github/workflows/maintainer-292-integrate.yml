name: Maintainer 292 integrate develop

on:
  push:
    branches:
      - feat/278-grid-layout-types

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref_name == 'feat/278-grid-layout-types'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Integrate current develop for explicit overlap repair
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop HEAD; then
            echo 'develop already integrated'
            exit 0
          fi
          git config user.name 'autonomous-maintainer'
          git config user.email 'autonomous-maintainer@users.noreply.github.com'
          git merge --no-edit -X ours origin/develop
          git push origin HEAD:${{ github.ref_name }}
