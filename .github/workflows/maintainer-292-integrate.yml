name: Maintainer 292 integrate develop

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feat/278-grid-layout-types'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Integrate current develop and validate combined contracts
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop HEAD; then
            echo 'develop already integrated'
            exit 0
          fi
          git config user.name 'autonomous-maintainer'
          git config user.email 'autonomous-maintainer@users.noreply.github.com'
          git merge --no-edit -X ours origin/develop
          grep -q 'GridType' internal/serve/config.go
          grep -q 'ViewerScaling' internal/serve/config.go
          grep -q 'gridType' frontend/src/lib/components/AppPage.svelte
          grep -q 'viewerScaling' frontend/src/lib/components/AppPage.svelte
          grep -q 'gridType' frontend/src/lib/stores/runtimeConfig.ts
          grep -q 'viewerScaling' frontend/src/lib/stores/runtimeConfig.ts
          grep -q 'ui.grid_type' docs/CONFIG.md
          grep -q 'ui.viewer_scaling' docs/CONFIG.md
          go test ./...
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          chromium=$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)
          test -n "$chromium"
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$chromium" npx playwright test tests/grid-layout-config.spec.ts tests/viewer-fit-mode.spec.ts --project=chromium
          cd ..
          git push origin HEAD:${{ github.head_ref }}
