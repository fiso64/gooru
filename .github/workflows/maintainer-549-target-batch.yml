name: Maintainer 549 target snapshot batching

on:
  push:
    branches:
      - maintainer/549-batch-tag-target-snapshot

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/549-batch-tag-target-snapshot
      - name: Apply bounded target snapshot batching
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/database/durable_tag_mutation.go')
          text = path.read_text()
          text = text.replace('\t"fmt"\n', '\t"fmt"\n\t"strings"\n', 1)
          start = text.index('\tcase BackgroundTagTargetFileID:\n')
          end = text.index('\tcase BackgroundTagTargetContentHash:\n', start)
          replacement = '''\tcase BackgroundTagTargetFileID:
\t\tconst columns = 3 // operation_id, target_id, target_order
\t\tbatchSize := maxVars / columns
\t\tfor start := 0; start < len(targetIDs); start += batchSize {
\t\t\tend := start + batchSize
\t\t\tif end > len(targetIDs) {
\t\t\t\tend = len(targetIDs)
\t\t\t}
\t\t\tvar query strings.Builder
\t\t\tquery.WriteString(`INSERT OR IGNORE INTO background_tag_mutation_targets
\t\t\t\t(operation_id, target_id, target_order)
\t\t\tVALUES `)
\t\t\targs := make([]interface{}, 0, (end-start)*columns)
\t\t\tfor index := start; index < end; index++ {
\t\t\t\ttargetID := targetIDs[index]
\t\t\t\tif targetID == "" {
\t\t\t\t\treturn 0, fmt.Errorf("background tag mutation target %d is blank", index)
\t\t\t\t}
\t\t\t\tif index > start {
\t\t\t\t\tquery.WriteString(", ")
\t\t\t\t}
\t\t\t\tquery.WriteString("(?, ?, ?)")
\t\t\t\targs = append(args, operationID, targetID, index)
\t\t\t}
\t\t\tif _, err := tx.Exec(query.String(), args...); err != nil {
\t\t\t\treturn 0, fmt.Errorf("insert background tag mutation targets %d-%d: %w", start, end-1, err)
\t\t\t}
\t\t}
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          gofmt -w internal/database/durable_tag_mutation.go
      - name: Validate database package
        shell: bash
        run: |
          set -euxo pipefail
          go test ./internal/database -count=1
          go vet -structtag=false ./internal/database
      - name: Commit clean source patch
        shell: bash
        run: |
          set -euxo pipefail
          git rm .github/workflows/maintainer-549-target-batch.yml
          git add internal/database/durable_tag_mutation.go
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '1144995+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git commit -m 'perf: batch durable tag mutation targets'
          git push origin HEAD:maintainer/549-batch-tag-target-snapshot
