name: Maintainer 563 final

on:
  push:
    branches:
      - maint/563-minor-ui-improvements
    paths:
      - .github/workflows/maint-563-final.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/563-minor-ui-improvements
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply focused maintenance patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          def append(path: str, block: str):
              p = Path(path)
              text = p.read_text()
              marker = block.strip().splitlines()[0]
              if marker in text:
                  raise SystemExit(f"{path}: append marker already exists: {marker}")
              p.write_text(text.rstrip() + "\n\n" + block.strip() + "\n")

          replace(
              'frontend/src/lib/utils/keyboard.ts',
              "export function hasCommandModifier(event: KeyboardEvent) {\n  return event.altKey || event.ctrlKey || event.metaKey;\n}\n\nexport type LibraryShortcutAction",
              "export function hasCommandModifier(event: KeyboardEvent) {\n  return event.altKey || event.ctrlKey || event.metaKey;\n}\n\nfunction isModalShortcutTarget(target: EventTarget | null) {\n  return shortcutAncestors(target).some((node) =>\n    node.getAttribute?.('role')?.toLowerCase() === 'dialog'\n    && node.getAttribute?.('aria-modal')?.toLowerCase() === 'true'\n  );\n}\n\nexport type SearchShortcutAction = 'focus-search' | 'filename-search' | null;\n\nexport function searchShortcutAction(\n  key: string,\n  target: EventTarget | null,\n  modified = false,\n  shiftKey = false\n): SearchShortcutAction {\n  if (modified || shiftKey || isEditableShortcutTarget(target) || isModalShortcutTarget(target)) return null;\n  if (key === '/') return 'focus-search';\n  if (key.toLowerCase() === 'f') return 'filename-search';\n  return null;\n}\n\nexport type LibraryShortcutAction"
          )

          replace(
              'frontend/src/lib/utils/keyboard.test.ts',
              "import { isEditableShortcutTarget, isInteractiveShortcutTarget, libraryShortcutAction } from './keyboard';",
              "import { isEditableShortcutTarget, isInteractiveShortcutTarget, libraryShortcutAction, searchShortcutAction } from './keyboard';"
          )
          replace(
              'frontend/src/lib/utils/keyboard.test.ts',
              "    if (name === 'type') return value.type ?? null;\n    return null;",
              "    if (name === 'type') return value.type ?? null;\n    if (name === 'aria-modal') return (value as FakeNode & { ariaModal?: string }).ariaModal ?? null;\n    return null;"
          )
          replace(
              'frontend/src/lib/utils/keyboard.test.ts',
              "  role?: string;\n  type?: string;",
              "  role?: string;\n  ariaModal?: string;\n  type?: string;"
          )
          replace(
              'frontend/src/lib/utils/keyboard.test.ts',
              "  it('maps library action shortcuts without enabling tag actions for an empty selection', () => {",
              "  it('scopes search shortcuts away from editors, modal dialogs, modifiers, and shifted keys', () => {\n    const modal = { tagName: 'div', getAttribute: (name: string) => name === 'role' ? 'dialog' : name === 'aria-modal' ? 'true' : null } as FakeNode;\n    expect(searchShortcutAction('/', node({ tagName: 'div' }))).toBe('focus-search');\n    expect(searchShortcutAction('f', node({ tagName: 'button' }))).toBe('filename-search');\n    expect(searchShortcutAction('/', node({ tagName: 'input' }))).toBeNull();\n    expect(searchShortcutAction('f', node({ tagName: 'span', parentElement: modal }))).toBeNull();\n    expect(searchShortcutAction('f', node({ tagName: 'div' }), true)).toBeNull();\n    expect(searchShortcutAction('f', node({ tagName: 'div' }), false, true)).toBeNull();\n  });\n\n  it('maps library action shortcuts without enabling tag actions for an empty selection', () => {"
          )

          replace(
              'frontend/src/lib/components/SearchBar.svelte',
              "  import { isEditableShortcutTarget } from '$lib/utils/keyboard';",
              "  import { hasCommandModifier, searchShortcutAction } from '$lib/utils/keyboard';"
          )
          replace(
              'frontend/src/lib/components/SearchBar.svelte',
              "  $effect(() => {\n    const handleKeydown = (event: KeyboardEvent) => {\n      if (event.key === '/' && !isEditableShortcutTarget(event.target)) {\n        event.preventDefault();\n        inputRef?.focus();\n      }\n    };\n    window.addEventListener('keydown', handleKeydown);\n    return () => window.removeEventListener('keydown', handleKeydown);\n  });",
              "  function beginFilenameSearch() {\n    const retainedTokens = tokens.filter((token) => token.ns.toLowerCase() !== '@filename_contains');\n    if (retainedTokens.length !== tokens.length) syncCommit(retainedTokens);\n    draft = '@filename_contains:';\n    open = true;\n    active = 0;\n    onDraftInput(draft);\n    void tick().then(() => {\n      inputRef?.focus();\n      inputRef?.setSelectionRange(draft.length, draft.length);\n    });\n  }\n\n  $effect(() => {\n    const handleKeydown = (event: KeyboardEvent) => {\n      const action = searchShortcutAction(event.key, event.target, hasCommandModifier(event), event.shiftKey);\n      if (!action) return;\n      event.preventDefault();\n      if (action === 'filename-search') beginFilenameSearch();\n      else inputRef?.focus();\n    };\n    window.addEventListener('keydown', handleKeydown);\n    return () => window.removeEventListener('keydown', handleKeydown);\n  });"
          )

          replace(
              'frontend/src/lib/components/MediaGrid.svelte',
              "  const tileVirtual = $derived(virtualMediaWindow(tileGeometry, paneHeight, paneScrollY, gridTop, layoutGridSize));",
              "  const tileVirtual = $derived(virtualMediaWindow(tileGeometry, paneHeight, paneScrollY, gridTop, layoutGridSize));\n  const tileVirtualHeight = $derived(pagedMode ? tileGeometry.localHeight : tileVirtual.totalHeight);"
          )
          replace(
              'frontend/src/lib/components/MediaGrid.svelte',
              "  function handleGridKeydown(event: KeyboardEvent) {\n    if (!isGridDirection(event.key) || !(event.target instanceof HTMLButtonElement) || !event.target.classList.contains('thumb-open')) return;",
              "  function handleGridKeydown(event: KeyboardEvent) {\n    if (!(event.target instanceof HTMLButtonElement) || !event.target.classList.contains('thumb-open')) return;\n    if (event.key === 'Escape') {\n      if (selectedCount > 0) return;\n      event.preventDefault();\n      event.stopPropagation();\n      event.target.blur();\n      return;\n    }\n    if (!isGridDirection(event.key)) return;"
          )
          replace(
              'frontend/src/lib/components/MediaGrid.svelte',
              "style={`height: ${tileVirtual.totalHeight}px;`}",
              "style={`height: ${tileVirtualHeight}px;`}"
          )

          replace(
              'frontend/src/lib/styles/pagination.css',
              ".paged-virtual-grid {\n  margin-bottom: 18px;\n}\n",
              ".paged-virtual-grid {\n  min-height: 0;\n}\n"
          )
          replace(
              'frontend/src/lib/components/PageNav.svelte',
              "    margin-top: 18px;\n    padding: 0 24px 28px;",
              "    margin-top: auto;\n    padding: 18px 24px 28px;"
          )

          replace(
              'frontend/src/lib/components/PreviewDialog.svelte',
              "      return;\n    }\n\n    if (isEditableShortcutTarget(event.target)) return;",
              "      return;\n    }\n\n    if (\n      (event.key === '+' || event.key === '-')\n      && event.target instanceof HTMLInputElement\n      && event.target.id === `tags-${file.id}`\n      && event.target.value === ''\n    ) {\n      event.preventDefault();\n      event.stopPropagation();\n      tagMode = event.key === '-' ? 'remove' : 'add';\n      return;\n    }\n\n    if (isEditableShortcutTarget(event.target)) return;"
          )

          replace('internal/serve/config.go', 'FontStyle:              "editorial",', 'FontStyle:              "comic",')
          replace('internal/serve/config.go', 'cfg.UI.FontStyle = "editorial"', 'cfg.UI.FontStyle = "comic"')
          replace(
              'internal/serve/font_style_config_test.go',
              'if cfg.UI.FontStyle != "editorial" {\n\t\tt.Fatalf("default font style = %q, want editorial", cfg.UI.FontStyle)',
              'if cfg.UI.FontStyle != "comic" {\n\t\tt.Fatalf("default font style = %q, want comic", cfg.UI.FontStyle)'
          )
          replace('frontend/src/lib/components/AppPage.svelte', "let runtimeFontStyle = $state<FontStyle>('editorial');", "let runtimeFontStyle = $state<FontStyle>('comic');")
          replace('frontend/src/lib/components/AppPage.svelte', "runtimeFontStyle = config.font_style ?? 'editorial';", "runtimeFontStyle = config.font_style ?? 'comic';")
          replace('frontend/src/lib/components/AppPage.svelte', "font_style: 'editorial'", "font_style: 'comic'", count=2)
          replace('docs/CONFIG.md', '| `ui.font_style` | `editorial` |', '| `ui.font_style` | `comic` |')
          replace('docs/CONFIG.md', '  font_style: editorial', '  font_style: comic')

          replace(
              'frontend/src/lib/components/ShortcutsView.svelte',
              "      { keys: ['/'], description: 'Focus search' },",
              "      { keys: ['/'], description: 'Focus search' },\n      { keys: ['f'], description: 'Search filenames' },"
          )
          replace(
              'frontend/src/lib/components/ShortcutsView.svelte',
              "      { keys: ['u'], description: 'Focus tag input in untag mode' },",
              "      { keys: ['u'], description: 'Focus tag input in untag mode' },\n      { keys: ['+', '−'], description: 'Switch tag / untag mode while the tag input is empty' },"
          )

          append('frontend/tests/grid-keyboard-cursor.spec.ts', r'''test('Escape clears selection before hiding the grid keyboard cursor', async ({ page }) => {
            await mockApp(page);
            await page.keyboard.press('ArrowDown');
            const first = page.locator('.thumb-open').first();
            await expect(first).toBeFocused();

            await page.keyboard.press('Space');
            await expect(page.getByText('1 of 3 selected')).toBeVisible();
            await page.keyboard.press('Escape');
            await expect(page.locator('.selection-bar')).toHaveCount(0);
            await expect(first).toBeFocused();

            await page.keyboard.press('Escape');
            await expect(first).not.toBeFocused();
          });''')

          append('frontend/tests/shortcut-focus.spec.ts', r'''test('filename search shortcut replaces only filename_contains and viewer shortcuts do not steal search focus', async ({ page }) => {
            await mockApp(page);
            const search = page.getByLabel('Search library');
            await search.fill('alpha');
            await search.press('Enter');
            await search.fill('@filename_contains:old.jpg');
            await search.press('Enter');
            await search.press('Escape');

            await page.keyboard.press('f');
            await expect(search).toBeFocused();
            await expect(search).toHaveValue('@filename_contains:');
            await expect(page.getByRole('button', { name: 'Remove alpha' })).toBeVisible();
            await expect(page.getByRole('button', { name: 'Remove @filename_contains:old.jpg' })).toHaveCount(0);
            await expect.poll(() => search.evaluate((node) => (node as HTMLInputElement).selectionStart)).toBe('@filename_contains:'.length);

            await search.press('Escape');
            await page.getByRole('button', { name: 'Preview one.jpg' }).click();
            const stage = page.locator('.viewer-stage');
            await stage.focus();
            await page.keyboard.press('/');
            await expect(search).not.toBeFocused();
            await expect(stage).toBeFocused();
          });''')

          append('frontend/tests/tag-input-behavior.spec.ts', r'''test('viewer +/- toggles tag mode only while the tag input is empty', async ({ page }) => {
            await mockApp(page);
            await page.getByRole('button', { name: 'Preview one.jpg' }).click();
            let input = page.getByRole('textbox', { name: 'Tags for one.jpg' });
            await input.focus();
            await input.press('-');
            input = page.getByRole('textbox', { name: 'Remove tags from one.jpg' });
            await expect(input).toBeFocused();
            await input.press('+');
            input = page.getByRole('textbox', { name: 'Tags for one.jpg' });
            await expect(input).toBeFocused();

            await input.fill('rating:safe');
            await input.press('-');
            await expect(input).toHaveValue('rating:safe-');
            await expect(page.getByRole('textbox', { name: 'Tags for one.jpg' })).toBeFocused();
          });''')

          append('frontend/tests/paged-library.spec.ts', r'''test('short final page keeps controls at the viewport bottom without artificial scrolling', async ({ page }) => {
            await page.setViewportSize({ width: 1280, height: 900 });
            const requests = await mockPagedLibrary(page, 26);
            await page.goto('/?page=2');
            await expect.poll(() => requests.some((request) => request.offset === 25 && request.limit === 25)).toBe(true);
            await expect(page.getByRole('button', { name: /page-25\.jpg$/ })).toBeVisible();

            const viewport = page.locator('main.main');
            const pager = page.getByTestId('library-pager');
            const metrics = await viewport.evaluate((node) => ({ clientHeight: node.clientHeight, scrollHeight: node.scrollHeight }));
            expect(metrics.scrollHeight).toBe(metrics.clientHeight);
            const [viewportBox, pagerBox] = await Promise.all([viewport.boundingBox(), pager.boundingBox()]);
            expect(viewportBox).not.toBeNull();
            expect(pagerBox).not.toBeNull();
            expect(Math.abs((viewportBox!.y + viewportBox!.height) - (pagerBox!.y + pagerBox!.height))).toBeLessThan(2);
          });''')

          append('frontend/tests/font-style.spec.ts', r'''test('missing font_style defaults the web UI to comic', async ({ page }) => {
            await mockAuthenticatedLibrary(page);
            await page.route('**/api/v1/ui-config', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({}) }));
            await page.goto('/');
            await expect(page.locator('.gooru-root')).toHaveClass(/gooru-type-comic/);
          });''')
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend static and unit checks
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit -- src/lib/utils/keyboard.test.ts
      - name: Focused browser regressions on isolated port
        working-directory: frontend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('playwright.config.ts')
          text = p.read_text().replace('127.0.0.1:4173', '127.0.0.1:43163')
          text = text.replace("npm run preview -- --host 127.0.0.1'", "npm run preview -- --host 127.0.0.1 --port 43163'")
          p.write_text(text)
          PY
          npx playwright install chromium
          npm run test:e2e -- grid-keyboard-cursor.spec.ts shortcut-focus.spec.ts tag-input-behavior.spec.ts paged-library.spec.ts font-style.spec.ts
          git checkout -- playwright.config.ts
      - name: Focused server config tests
        run: go test ./internal/serve -run 'FontStyle|ConfigDocs'
      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/maint-563-final.yml
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: refine minor UI interactions (#563)'
          git push origin HEAD:maint/563-minor-ui-improvements
