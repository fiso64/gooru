name: Temporary #326 diagnostic

on:
  push:
    branches:
      - fix/28-cli-encrypted-storage
    paths-ignore:
      - .github/tmp-326-go-test.log

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/28-cli-encrypted-storage
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Capture focused Go test
        shell: bash
        run: |
          set +e
          go test ./cmd/gooru/cmd > .github/tmp-326-go-test.log 2>&1
          status=$?
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/tmp-326-go-test.log
          git commit -m 'ci: capture #326 Go test diagnostic' || true
          git push origin HEAD:fix/28-cli-encrypted-storage
          exit "$status"
