name: maintainer-fix-401-delete

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/maintainer-fix-401-delete.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and test durable file removal branch
        shell: bash
        run: |
          set -euo pipefail
          git show c6fe1fbb87137837d5878651c69e6af48bf581a9:.github/workflows/maintainer-implement-401-delete.yml > /tmp/old-implement.yml
          awk 'BEGIN{capture=0} /      - name: Implement durable selected-file removal/{found=1} found && /        run: \|/{capture=1; next} capture{sub(/^          /, ""); print}' /tmp/old-implement.yml > /tmp/implement.sh
          sed -i '/^go test /,$d' /tmp/implement.sh
          bash /tmp/implement.sh
          python3 <<'PY'
          from pathlib import Path

          p = Path('internal/serve/file_delete_test.go')
          s = p.read_text()
          s = s.replace('''\tif rec.Code != http.StatusOK {\n\t\tt.Fatalf("expected bulk untrack 200, got %d: %s", rec.Code, rec.Body.String())\n\t}\n''', '''\tif rec.Code != http.StatusAccepted {\n\t\tt.Fatalf("expected bulk untrack 202, got %d: %s", rec.Code, rec.Body.String())\n\t}\n''', 1)
          old = '''\tif response.Mode != "untrack" || response.RemovedLocations != len(page.Files)-1 {\n\t\tt.Fatalf("unexpected response: %+v", response)\n\t}\n\n\tkept := httptest.NewRecorder()\n\tserver.Handler().ServeHTTP(kept, authedRequest(http.MethodGet, "/api/v1/files/"+page.Files[0].ID))\n\tif kept.Code != http.StatusOK {\n\t\tt.Fatalf("excluded file should remain tracked, got %d: %s", kept.Code, kept.Body.String())\n\t}\n\tfor _, removed := range page.Files[1:] {\n\t\tmissing := httptest.NewRecorder()\n\t\tserver.Handler().ServeHTTP(missing, authedRequest(http.MethodGet, "/api/v1/files/"+removed.ID))\n\t\tif missing.Code != http.StatusNotFound {\n\t\t\tt.Fatalf("selected file %s should be untracked, got %d: %s", removed.ID, missing.Code, missing.Body.String())\n\t\t}\n\t}\n'''
          new = '''\tif response.Mode != "untrack" || response.OperationID == "" || response.RemovedLocations != 0 {\n\t\tt.Fatalf("unexpected response: %+v", response)\n\t}\n\toperation, found, err := server.backgroundOperations.GetBackgroundOperation(response.OperationID)\n\tif err != nil || !found {\n\t\tt.Fatalf("load queued operation: found=%v err=%v", found, err)\n\t}\n\tif operation.Kind != "files.untrack" || operation.ProgressTotal != int64(len(page.Files)-1) {\n\t\tt.Fatalf("unexpected queued operation: %+v", operation)\n\t}\n\n\tkept := httptest.NewRecorder()\n\tserver.Handler().ServeHTTP(kept, authedRequest(http.MethodGet, "/api/v1/files/"+page.Files[0].ID))\n\tif kept.Code != http.StatusOK {\n\t\tt.Fatalf("excluded file should remain tracked while work is queued, got %d: %s", kept.Code, kept.Body.String())\n\t}\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('internal/serve/file_selections_test.go')
          s = p.read_text()
          s = s.replace('''\t"time"\n\n\t"gooru.local/types"\n''', '''\t"time"\n\n\tcore "gooru.local/gooru"\n\t"gooru.local/types"\n''', 1)
          marker = '''func (l *snapshotTestLibrary) DeleteFileByPublicID(_ context.Context, id string) (bool, error) {\n\tl.mu.Lock()\n\tdefer l.mu.Unlock()\n\tif _, ok := l.files[id]; !ok {\n\t\treturn false, nil\n\t}\n\tdelete(l.files, id)\n\tl.removed = append(l.removed, id)\n\treturn true, nil\n}\n'''
          addition = marker + '''\nfunc (l *snapshotTestLibrary) CreateBackgroundOperationWithTasks(operation core.BackgroundOperationRequest, tasks []core.BackgroundTaskRequest) (core.BackgroundOperation, []core.BackgroundTask, error) {\n\tfor _, task := range tasks {\n\t\tvar input backgroundFileRemovalInput\n\t\tif err := json.Unmarshal([]byte(task.InputKey), &input); err != nil {\n\t\t\treturn core.BackgroundOperation{}, nil, err\n\t\t}\n\t\tif input.Mode != "untrack" {\n\t\t\treturn core.BackgroundOperation{}, nil, errors.New("snapshot test library only supports queued untrack")\n\t\t}\n\t\tif _, err := l.DeleteFileByPublicID(context.Background(), input.PublicID); err != nil {\n\t\t\treturn core.BackgroundOperation{}, nil, err\n\t\t}\n\t}\n\treturn core.BackgroundOperation{ID: "operation-test", Kind: operation.Kind, Visible: operation.Visible, ProgressTotal: operation.ProgressTotal}, nil, nil\n}\n'''
          assert marker in s
          s = s.replace(marker, addition, 1)
          s = s.replace('snapshot untrack: expected 200', 'snapshot untrack: expected 202', 1).replace('rec.Code != http.StatusOK', 'rec.Code != http.StatusAccepted', 1)
          idx = s.index('snapshot include/exclude: expected 200')
          before = s[:idx]
          after = s[idx:].replace('snapshot include/exclude: expected 200', 'snapshot include/exclude: expected 202', 1)
          check_pos = before.rfind('rec.Code != http.StatusOK')
          assert check_pos >= 0
          before = before[:check_pos] + before[check_pos:].replace('rec.Code != http.StatusOK', 'rec.Code != http.StatusAccepted', 1)
          p.write_text(before + after)
          PY
          gofmt -w internal/serve/*.go
          go test ./internal/serve ./gooru ./internal/background ./internal/database
          go test ./...
          git add -A
          git -c user.name=chatgpt-codex-connector -c user.email=chatgpt-codex-connector@users.noreply.github.com commit -m 'feat(files): make bulk removals durable'
          git push --force origin refactor/401-durable-file-removal
