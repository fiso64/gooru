name: tmp-264-saved-search-order

on:
  push:
    branches:
      - feat/264-saved-search-order
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  validate-saved-search-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply product patch
        run: |
          python .github/tmp-264-order.py
          python .github/tmp-264-tests.py
          python .github/tmp-264-fixes.py
      - name: Format Go
        run: |
          gofmt -w types/types.go internal/database/database.go gooru/saved_search.go gooru/saved_search_test.go cmd/gooru/cmd/saved_search.go internal/serve/saved_search_library.go internal/serve/search_saved.go internal/serve/server.go
      - name: Install and generate API
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
      - name: Validate backend
        run: go test ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e -- --grep "persists saved-search drag order across reload"
      - name: Validate diff
        run: git diff --check
      - name: Commit product patch
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add types internal gooru cmd docs frontend
          if ! git diff --cached --quiet; then
            git commit -m 'feat(saved-search): persist sidebar ordering'
            git fetch origin feat/264-saved-search-order
            git rebase origin/feat/264-saved-search-order
            git push origin HEAD:feat/264-saved-search-order
          fi