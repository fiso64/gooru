name: Maintainer 720 stream error fix

on:
  push:
    branches:
      - maintainer/720-simplify-upload-conflicts

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - name: Patch active streaming path
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("internal/serve/upload_stream.go"); t=p.read_text(); a="\\t\\tvar fileScoped uploadFileError\\n\\t\\tif errors.As(finalErr, &fileScoped) && errors.Is(finalErr, errUploadConflict) {\\n\\t\\t\\t_ = os.Remove(file.path)\\n\\t\\t\\tfile.path = \\\"\\\"\\n\\t\\t\\tsaved = append(saved, savedUpload{name: fileScoped.name, size: file.size, targetID: target.ID, status: \\\"error\\\", error: fileScoped.err.Error()})\\n\\t\\t\\tcontinue\\n\\t\\t}\\n\\t\\treturn nil, saved, finalErr\\n"; b="\\t\\treturn nil, saved, finalErr\\n"; assert a in t; p.write_text(t.replace(a,b,1))'
          gofmt -w internal/serve/upload_stream.go
          rm .github/workflows/maintainer-720-stream-error-fix.yml
          git add -A
          git diff --cached --check
      - name: Commit active-path fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'autonomous-maintainer'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git commit -m 'fix(upload): reject streaming error conflicts'
          git push origin HEAD:maintainer/720-simplify-upload-conflicts
