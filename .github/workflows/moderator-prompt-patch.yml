name: Patch moderator prompt wording

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry moderator prompt patch'
    runs-on: gooru-moderator
    steps:
      - name: Patch one sentence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/maintainer-prompt.md'
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=develop" --jq '.sha')"
          content="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=develop")"
          old='The dedicated moderator runner performs a mechanical full reconciliation on relevant repository events and every 15 minutes.'
          new='The dedicated moderator runner applies targeted updates on relevant repository events and performs a mechanical full reconciliation every 15 minutes.'
          [[ "$content" == *"$old"* ]]
          content="${content/"$old"/"$new"}"
          encoded="$(printf '%s' "$content" | base64 | tr -d '\n')"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='Describe incremental moderator updates' \
            -f content="$encoded" \
            -f sha="$sha" \
            -f branch=develop >/dev/null
