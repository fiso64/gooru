name: Temporary #264 OpenAPI repair

on:
  push:
    branches:
      - feat/264-saved-search-order

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip tmp-264]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/264-saved-search-order
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Add reorder contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/openapi.yaml')
          text = path.read_text()
          anchor = '''  /saved-searches/{id}:\n    put:\n'''
          block = '''  /saved-searches/reorder:\n    put:\n      summary: Replace the saved-search order for the current user.\n      security:\n        - sessionAuth: []\n      parameters:\n        - $ref: "#/components/parameters/CSRF"\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: "#/components/schemas/SavedSearchReorderRequest"\n      responses:\n        "200":\n          description: Saved-search order replaced.\n          content:\n            application/json:\n              schema:\n                type: object\n                required: [ok]\n                properties:\n                  ok:\n                    type: boolean\n        "400":\n          $ref: "#/components/responses/BadRequest"\n        "401":\n          $ref: "#/components/responses/Unauthorized"\n        "403":\n          $ref: "#/components/responses/Forbidden"\n  /saved-searches/{id}:\n    put:\n'''
          if '  /saved-searches/reorder:\n' not in text:
              if anchor not in text:
                  raise SystemExit('saved-search anchor missing')
              text = text.replace(anchor, block, 1)
          schema_anchor = '''    SavedSearchRequest:\n'''
          schema = '''    SavedSearchReorderRequest:\n      type: object\n      required: [ids]\n      properties:\n        ids:\n          type: array\n          items:\n            type: string\n    SavedSearchRequest:\n'''
          if '    SavedSearchReorderRequest:\n' not in text:
              if schema_anchor not in text:
                  raise SystemExit('saved-search schema anchor missing')
              text = text.replace(schema_anchor, schema, 1)
          path.write_text(text)
          PY
      - name: Regenerate typed API
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          npm run check
          npm run test:unit
      - name: Verify Go
        run: go test ./...
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/openapi.yaml frontend/src/lib/api/openapi.ts
          git rm .github/workflows/tmp-264-openapi-repair.yml
          git diff --cached --check
          git commit -m 'fix(saved-search): align reorder API contract [skip tmp-264]'
          git push origin HEAD:feat/264-saved-search-order
