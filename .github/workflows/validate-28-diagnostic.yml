name: Maintainer opaque storage diagnostics

on:
  push:
    branches:
      - feat/28-opaque-managed-storage

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply embedded opaque-storage patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, pathlib, re, zlib
          workflow = pathlib.Path('.github/workflows/maintainer-source.yml').read_text()
          match = re.search(r'PATCH_ZB64: "([A-Za-z0-9+/=]+)"', workflow)
          if not match:
              raise SystemExit('PATCH_ZB64 not found')
          pathlib.Path('/tmp/opaque.patch').write_bytes(zlib.decompress(base64.b64decode(match.group(1))))
          PY
          git apply --check /tmp/opaque.patch
          git apply /tmp/opaque.patch
          gofmt -w cmd gooru internal types
          git diff --check
      - name: Run focused tests with captured output
        id: focused
        shell: bash
        run: |
          set +e
          go test -count=1 -v ./cmd/gooru/cmd ./gooru ./internal/serve > /tmp/focused-test.log 2>&1
          status=$?
          cat /tmp/focused-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused test log
        uses: actions/upload-artifact@v4
        with:
          name: opaque-storage-focused-test-log
          path: /tmp/focused-test.log
          retention-days: 1
      - name: Fail if focused tests failed
        if: steps.focused.outputs.status != '0'
        run: exit 1
