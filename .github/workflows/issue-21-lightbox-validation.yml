      value={draft}
      placeholder="add tag — e.g. subject:portrait"
      disabled={busy}
      oninput={(event) => onInput(event.currentTarget.value)}
      onkeydown={(event) => { if (event.key === 'Enter' && canSubmit && !busy) onMutate('add'); }}
