name: issue-21 lightbox validation

on:
  push:
    branches:
      - agent/issue-21-exact-concept-port

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wire lightbox app, styles, and regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} not found')
              return text.replace(old, new, 1)

          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text()
          text = replace_once(text, "import { createFilesQuery, createTagMutation, pageTokenOffset, type FileSort } from '$lib/queries/files';", "import { createFilesQuery, createTagMutation, createUntrackFileMutation, pageTokenOffset, type FileSort } from '$lib/queries/files';", 'query import')
          text = replace_once(text, "kind: 'none' | 'save-create' | 'save-update' | 'save-delete' | 'bulk-selected' | 'bulk-remove-selected' | 'bulk-filtered';", "kind: 'none' | 'save-create' | 'save-update' | 'save-delete' | 'bulk-selected' | 'bulk-remove-selected' | 'bulk-filtered' | 'untrack-file';", 'dialog kind')
          text = replace_once(text, "  const tagMutation = createTagMutation(() => $authState.csrfToken, queryClient);", "  const tagMutation = createTagMutation(() => $authState.csrfToken, queryClient);\n  const untrackFileMutation = createUntrackFileMutation(() => $authState.csrfToken, queryClient);", 'mutation setup')
          text = replace_once(text, "  function bulkTagSelected() {", "  function untrackPreview(file: { id: string; name: string }) {\n    actionDialog = { kind: 'untrack-file', value: '', error: '', busy: false, id: file.id, name: file.name, previousQuery: '' };\n  }\n\n  function bulkTagSelected() {", 'untrack action')
          text = replace_once(text, "      } else if (actionDialog.kind === 'bulk-filtered') {\n        await tagWorkflow.bulkFiltered(library.filterQuery(), value, (variables) => tagMutation.mutateAsync(variables));\n      }\n      closeActionDialog();", "      } else if (actionDialog.kind === 'bulk-filtered') {\n        await tagWorkflow.bulkFiltered(library.filterQuery(), value, (variables) => tagMutation.mutateAsync(variables));\n      } else if (actionDialog.kind === 'untrack-file') {\n        await untrackFileMutation.mutateAsync(actionDialog.id);\n        if (library.activeFile?.id === actionDialog.id) library.closePreview();\n      }\n      closeActionDialog();", 'untrack submit')
          text = replace_once(text, "      case 'bulk-filtered': return 'Tag filtered results';", "      case 'bulk-filtered': return 'Tag filtered results';\n      case 'untrack-file': return 'Remove from library';", 'dialog title')
          text = replace_once(text, "      case 'bulk-filtered': return 'Add tags to every file matching the current filter without materializing all results.';", "      case 'bulk-filtered': return 'Add tags to every file matching the current filter without materializing all results.';\n      case 'untrack-file': return `Untrack \\\"${actionDialog.name}\\\" from the library. The file remains on disk.`;", 'dialog description')
          text = replace_once(text, "      case 'bulk-remove-selected': return 'Remove tags';", "      case 'bulk-remove-selected': return 'Remove tags';\n      case 'untrack-file': return 'Remove';", 'dialog confirm')
          text = replace_once(text, "      onMutateTags={(file, operation) => tagWorkflow.mutateFile(file, operation, (variables) => tagMutation.mutateAsync(variables))}\n    />", "      onMutateTags={(file, operation) => tagWorkflow.mutateFile(file, operation, (variables) => tagMutation.mutateAsync(variables))}\n      onRemoveTag={(file, tag) => tagWorkflow.removeTag(file, tag, (variables) => tagMutation.mutateAsync(variables))}\n      onUntrack={untrackPreview}\n    />", 'preview callbacks')
          text = replace_once(text, "      destructive={actionDialog.kind === 'save-delete'}", "      destructive={actionDialog.kind === 'save-delete' || actionDialog.kind === 'untrack-file'}", 'destructive dialog')
          text = replace_once(text, "      input={actionDialog.kind !== 'save-delete'}", "      input={actionDialog.kind !== 'save-delete' && actionDialog.kind !== 'untrack-file'}", 'dialog input')
          app.write_text(text)

          css = Path('frontend/src/lib/styles/components.css')
          text = css.read_text()
          css_add = base64.b64decode('').decode()
          if '.lightbox-video-controls {' not in text:
              marker = '@media (max-width: 900px)'
              text = text.replace(marker, css_add + '\n\n' + marker, 1) if marker in text else text.rstrip() + '\n\n' + css_add + '\n'
          css.write_text(text)

          spec = Path('frontend/tests/shell.spec.ts')
          text = spec.read_text()
          text = replace_once(text, "  await dialog.getByLabel('Tags for sample.jpg').fill('reviewed');\n  await dialog.getByRole('button', { name: 'Add tags to sample.jpg' }).click();", "  await dialog.getByLabel('Tags for sample.jpg').fill('reviewed');\n  await dialog.getByLabel('Tags for sample.jpg').press('Enter');", 'existing preview tag test')
          test_add = base64.b64decode('').decode()
          if "test('lightbox supports per-tag removal and confirmed untrack'" not in text:
              text = text.rstrip() + '\n\n' + test_add + '\n'
          spec.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Build Go packages
        run: go build ./...
      - name: Run Go tests
        run: go test ./...
      - name: Persist validated lightbox wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/styles/components.css frontend/tests/shell.spec.ts
          git commit -m "#21 wire exact lightbox behavior [skip ci]"
          git push
