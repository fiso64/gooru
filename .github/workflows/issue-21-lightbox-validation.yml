          {#if group.namespace}<div class="lightbox-tag-group-head"><span>{group.namespace}</span><span>{group.tags.length}</span></div>{/if}
          <div class="lightbox-tag-list">
            {#each group.tags as tag}
              <span class="g-tag">
                {#if tag.includes(':')}<span class="ns">{tag.split(':')[0]}:</span><span>{tag.slice(tag.indexOf(':') + 1)}</span>{:else}<span>{tag}</span>{/if}
                <button class="g-tag-x" type="button" aria-label={`Remove ${tag}`} disabled={tagBusy} onclick={() => onRemoveTag(file, tag)}>
                  <Icon name="close" size={11} />
