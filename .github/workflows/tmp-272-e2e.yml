name: Temporary #272 browser validation

on:
  push:
    branches:
      - feat/272-upload-drop-control
    paths:
      - '.github/workflows/tmp-272-e2e.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Run focused browser regression
        working-directory: frontend
        run: npm run test:e2e -- upload-drop-control.spec.ts
