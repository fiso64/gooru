name: tmp-187-protected-path-validation

on:
  pull_request:
    branches:
      - develop

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libvips-dev libfuse-dev
      - run: go test ./internal/serve ./cmd/gooru/cmd
      - run: go test -race ./internal/serve ./cmd/gooru/cmd
