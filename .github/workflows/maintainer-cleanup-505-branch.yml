name: Maintainer cleanup merged #505 branch

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Delete merged maintainer branch and workflow
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete maintainer/401-atomic-upload-result
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git rm .github/workflows/maintainer-cleanup-505-branch.yml
          git commit -m "chore: remove merged branch cleanup workflow"
          git push origin HEAD:develop
