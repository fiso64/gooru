name: maintainer-254-added-strategy

on:
  push:
    branches:
      - feat/254-added-at-strategy
    paths:
      - .github/workflows/maintainer-254-added-strategy.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply backend strategy slice
        run: |
          python3 .maintainer-254-added-strategy-fix.py
          python3 .maintainer-254-added-strategy.py
          gofmt -w types/types.go internal/database/database.go internal/serve/config.go internal/serve/uploads.go internal/serve/upload_stream.go internal/serve/upload_stream_test.go
          git diff --check
      - name: Validate Go
        run: go test ./internal/database ./internal/serve ./gooru
      - name: Validate frontend contract generation
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          npm run check
          npm run test:unit
          npm run build
          git diff --check
      - name: Commit product changes
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email chatgpt-codex-connector@users.noreply.github.com
          git add types/types.go internal/database/database.go internal/serve/config.go internal/serve/uploads.go internal/serve/upload_stream.go internal/serve/upload_stream_test.go docs/CONFIG.md docs/openapi.yaml frontend/src/lib/api/openapi.ts
          git commit -m 'feat: add upload added-at strategies'
          git push origin HEAD:feat/254-added-at-strategy
