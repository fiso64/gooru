name: Temporary key summary read validation

on:
  push:
    branches:
      - perf/333-key-summary-reads

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/333-key-summary-reads
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply key summary read patch
        run: |
          python3 .github/tmp_patch_key_summary.py
          gofmt -w internal/database/database.go internal/database/key_summary_reads_test.go
      - name: Validate
        run: |
          go test ./internal/database -count=1
          go test ./gooru ./internal/serve -count=1
      - name: Commit validated change and remove temporary machinery
        run: |
          rm .github/workflows/tmp-key-summary-reads.yml .github/tmp_patch_key_summary.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'perf(database): use maintained key summaries for key reads'
          git push origin HEAD:perf/333-key-summary-reads
