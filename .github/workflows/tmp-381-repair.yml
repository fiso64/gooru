name: Temporary PR 381 Repair
on:
  push:
    branches: [fix/349-selection-snapshots]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/349-selection-snapshots
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply architectural repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          p = Path("frontend/src/lib/components/AuthenticatedApp.svelte")
          text = p.read_text()
          if "{/if>" in text:
              p.write_text(text.replace("{/if>", "{/if}"))

          replace(
              "internal/serve/server.go",
              'mux.Handle("/api/v1/file-selections/", s.protected(requestBodyLimitMiddleware(metadataRequestBodyLimit, http.HandlerFunc(s.handleFileSelection))))',
              'mux.Handle("/api/v1/file-selections/", s.adminProtected(requestBodyLimitMiddleware(metadataRequestBodyLimit, http.HandlerFunc(s.handleFileSelection))))',
          )
          replace(
              "internal/serve/server.go",
              'mux.Handle("/api/v1/file-selections", s.protected(requestBodyLimitMiddleware(metadataRequestBodyLimit, http.HandlerFunc(s.handleFileSelections))))',
              'mux.Handle("/api/v1/file-selections", s.adminProtected(requestBodyLimitMiddleware(metadataRequestBodyLimit, http.HandlerFunc(s.handleFileSelections))))',
          )

          replace(
              "internal/serve/browse.go",
              '''type PublicFileLibrary interface {
          \tPublicFileID(file types.FileInfo) string
          \tGetFileByPublicID(ctx context.Context, id string) (types.FileInfo, error)
          \tDeleteFileByPublicID(ctx context.Context, id string) (bool, error)
          }
          ''',
              '''type PublicFileLibrary interface {
          \tPublicFileID(file types.FileInfo) string
          \tGetFileByPublicID(ctx context.Context, id string) (types.FileInfo, error)
          \tDeleteFileByPublicID(ctx context.Context, id string) (bool, error)
          }

          type FileSelectionLibrary interface {
          \tListPublicFileIDs(ctx context.Context, query string) ([]string, error)
          }
          ''',
          )
          replace(
              "internal/serve/browse.go",
              '''func (l *GooruLibrary) ListFiles(ctx context.Context, query string) ([]types.FileInfo, error) {
          \tif err := ctx.Err(); err != nil {
          \t\treturn nil, err
          \t}
          \tif strings.TrimSpace(query) == "" {
          \t\treturn l.client.GetAllFilesInfo()
          \t}
          \treturn l.client.GetFilesInfoByQuery(query, l.verbose)
          }
          ''',
              '''func (l *GooruLibrary) ListFiles(ctx context.Context, query string) ([]types.FileInfo, error) {
          \tif err := ctx.Err(); err != nil {
          \t\treturn nil, err
          \t}
          \tif strings.TrimSpace(query) == "" {
          \t\treturn l.client.GetAllFilesInfo()
          \t}
          \treturn l.client.GetFilesInfoByQuery(query, l.verbose)
          }

          func (l *GooruLibrary) ListPublicFileIDs(ctx context.Context, query string) ([]string, error) {
          \tif err := ctx.Err(); err != nil {
          \t\treturn nil, err
          \t}
          \treturn l.client.ListPublicFileIDsByQuery(query, l.verbose)
          }
          ''',
          )

          query = Path("gooru/query.go")
          text = query.read_text()
          if "func (c *Client) ListPublicFileIDsByQuery(" not in text:
              marker = "// GetFilesInfoByQueryPage parses and executes a query expression with bounded pagination."
              method = '''// ListPublicFileIDsByQuery returns only stable public IDs for matching tracked locations.
          // It deliberately avoids materializing FileInfo rows for large immutable selections.
          func (c *Client) ListPublicFileIDsByQuery(expression string, verbose bool) ([]string, error) {
          \tsqlQuery, args, err := c.buildLocationQuery(expression)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tif sqlQuery == "" {
          \t\treturn c.store.ListAllPublicFileIDs()
          \t}
          \tif verbose {
          \t\tfmt.Fprintf(os.Stderr, "--- DEBUG ---\\nExpression: %s\\nBuilt SQL : %s\\nSQL Args  : %v\\n-------------\\n", expression, sqlQuery, args)
          \t}
          \treturn c.store.GetPublicFileIDsByLocationQuery(sqlQuery, args)
          }

          '''
              if marker not in text:
                  raise SystemExit("query insertion marker missing")
              query.write_text(text.replace(marker, method + marker, 1))

          db = Path("internal/database/database.go")
          text = db.read_text()
          if "func (s *Store) ListAllPublicFileIDs(" not in text:
              text = text.rstrip() + '''

          // ListAllPublicFileIDs returns stable public API identifiers without materializing full file metadata.
          func (s *Store) ListAllPublicFileIDs() ([]string, error) {
          \trows, err := s.Query("SELECT public_id FROM locations WHERE public_id IS NOT NULL AND public_id <> '' ORDER BY public_id")
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tdefer rows.Close()
          \tids := make([]string, 0)
          \tfor rows.Next() {
          \t\tvar id string
          \t\tif err := rows.Scan(&id); err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\tids = append(ids, id)
          \t}
          \treturn ids, rows.Err()
          }

          // GetPublicFileIDsByLocationQuery executes a location-ID subquery and projects only public IDs.
          func (s *Store) GetPublicFileIDsByLocationQuery(query string, args []interface{}) ([]string, error) {
          \tfinalQuery := fmt.Sprintf(`
          \t\tWITH result_locations(id) AS (%s)
          \t\tSELECT l.public_id
          \t\tFROM locations l
          \t\tJOIN result_locations rl ON l.id = rl.id
          \t\tWHERE l.public_id IS NOT NULL AND l.public_id <> ''
          \t\tORDER BY l.public_id`, query)
          \trows, err := s.Query(finalQuery, args...)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tdefer rows.Close()
          \tids := make([]string, 0)
          \tfor rows.Next() {
          \t\tvar id string
          \t\tif err := rows.Scan(&id); err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\tids = append(ids, id)
          \t}
          \treturn ids, rows.Err()
          }
          '''
              db.write_text(text + "\n")

          p = Path("internal/serve/file_selections.go")
          text = p.read_text()
          text = text.replace(
              '''\tif _, ok := s.library.(PublicFileLibrary); !ok {
          \t\twriteError(w, http.StatusServiceUnavailable, "service_unavailable", "file selection service is not configured", nil)
          \t\treturn
          \t}
          ''',
              '''\tselectionLibrary, ok := s.library.(FileSelectionLibrary)
          \tif !ok {
          \t\twriteError(w, http.StatusServiceUnavailable, "service_unavailable", "file selection service is not configured", nil)
          \t\treturn
          \t}
          ''', 1)
          old = '''\tfiles, err := s.library.ListFiles(r.Context(), request.Query)
          \tif err != nil {
          \t\twriteError(w, http.StatusInternalServerError, "internal_error", "failed to resolve file selection", nil)
          \t\treturn
          \t}
          \tfileIDs := make([]string, 0, len(files))
          \tfor _, file := range files {
          \t\tfileIDs = append(fileIDs, s.publicFileID(file))
          \t}
          '''
          new = '''\tfileIDs, err := selectionLibrary.ListPublicFileIDs(r.Context(), request.Query)
          \tif err != nil {
          \t\twriteError(w, http.StatusInternalServerError, "internal_error", "failed to resolve file selection", nil)
          \t\treturn
          \t}
          '''
          if old not in text:
              raise SystemExit("file selection materialization block missing")
          p.write_text(text.replace(old, new, 1))

          Path("internal/serve/bulk_file_targets.go").write_text('''package serve

          import "context"

          // bulkFileTarget is the shared server-side boundary for bulk-action selectors.
          // Selection snapshots are resolved here, so handlers cannot accidentally fall
          // back to a live query after a snapshot expires or changes underneath them.
          type bulkFileTarget struct {
          \tFileIDs        []string
          \tQuery          string
          \tSelectionID    string
          \tIncludeFileIDs []string
          \tExcludeFileIDs []string
          }

          func (s *Server) resolveBulkFileTarget(ctx context.Context, ownerID string, target bulkFileTarget) (bulkFileTarget, error) {
          \tif target.SelectionID == "" {
          \t\treturn target, nil
          \t}
          \tfileIDs, err := s.fileSelections.resolve(ownerID, target.SelectionID)
          \tif err != nil {
          \t\treturn bulkFileTarget{}, err
          \t}
          \ttarget.FileIDs = mergeSnapshotSelectionIDs(fileIDs, target.IncludeFileIDs, target.ExcludeFileIDs)
          \ttarget.Query = ""
          \ttarget.SelectionID = ""
          \ttarget.IncludeFileIDs = nil
          \ttarget.ExcludeFileIDs = nil
          \treturn target, nil
          }
          ''')

          p = Path("internal/serve/tag_mutations.go")
          text = p.read_text()
          start = text.index("\tselector := TagMutationSelector{")
          end = text.index("\n\tjob, err :=", start)
          replacement = '''\tselector := TagMutationSelector{
          \t\tFileIDs:        request.FileIDs,
          \t\tQuery:          request.Query,
          \t\tSelectionID:    request.SelectionID,
          \t\tIncludeFileIDs: request.IncludeFileIDs,
          \t\tExcludeFileIDs: request.ExcludeFileIDs,
          \t}
          \ttarget, err := s.resolveBulkFileTarget(r.Context(), fileSelectionOwnerID(r), bulkFileTarget{
          \t\tFileIDs:        request.FileIDs,
          \t\tQuery:          request.Query,
          \t\tSelectionID:    request.SelectionID,
          \t\tIncludeFileIDs: request.IncludeFileIDs,
          \t\tExcludeFileIDs: request.ExcludeFileIDs,
          \t})
          \tif errors.Is(err, errFileSelectionNotFound) {
          \t\twriteError(w, http.StatusGone, "selection_expired", "file selection has expired", nil)
          \t\treturn
          \t}
          \tif err != nil {
          \t\twriteError(w, http.StatusInternalServerError, "internal_error", "failed to resolve file selection", nil)
          \t\treturn
          \t}
          \tresolvedRequest := request
          \tresolvedRequest.FileIDs = target.FileIDs
          \tresolvedRequest.Query = target.Query
          \tresolvedRequest.SelectionID = target.SelectionID
          \tresolvedRequest.IncludeFileIDs = target.IncludeFileIDs
          \tresolvedRequest.ExcludeFileIDs = target.ExcludeFileIDs
          \tif request.SelectionID == "" {
          \t\tif err := s.validateTagMutationFiles(r.Context(), request); err != nil {
          \t\t\tif errors.Is(err, ErrNotFound) {
          \t\t\t\twriteError(w, http.StatusNotFound, "not_found", "file not found", nil)
          \t\t\t\treturn
          \t\t\t}
          \t\t\twriteError(w, http.StatusInternalServerError, "internal_error", "failed to load file", nil)
          \t\t\treturn
          \t\t}
          \t}
          '''
          p.write_text(text[:start] + replacement + text[end:])

          p = Path("internal/serve/file_removals.go")
          text = p.read_text()
          start = text.index("func (s *Server) resolveFileRemovalSelection(")
          end = text.index("\nfunc (s *Server) resolveSnapshotFileIDs(", start)
          replacement = '''func (s *Server) resolveFileRemovalSelection(ctx context.Context, ownerID string, request FileRemovalRequest) ([]types.FileInfo, error) {
          \ttarget, err := s.resolveBulkFileTarget(ctx, ownerID, bulkFileTarget{
          \t\tFileIDs:        request.FileIDs,
          \t\tQuery:          request.Query,
          \t\tSelectionID:    request.SelectionID,
          \t\tIncludeFileIDs: request.IncludeFileIDs,
          \t\tExcludeFileIDs: request.ExcludeFileIDs,
          \t})
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tif len(target.FileIDs) > 0 || request.SelectionID != "" {
          \t\treturn s.resolveFileIDs(ctx, target.FileIDs, nil)
          \t}

          \texcluded := make(map[string]struct{}, len(target.ExcludeFileIDs))
          \tfor _, id := range target.ExcludeFileIDs {
          \t\tif _, err := s.getFileByPublicID(ctx, id); err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\texcluded[id] = struct{}{}
          \t}
          \tfiles, err := s.library.ListFiles(ctx, target.Query)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tselected := make([]types.FileInfo, 0, len(files))
          \tfor _, file := range files {
          \t\tif _, skip := excluded[s.publicFileID(file)]; skip {
          \t\t\tcontinue
          \t\t}
          \t\tselected = append(selected, file)
          \t}
          \treturn selected, nil
          }
          '''
          p.write_text(text[:start] + replacement + text[end:])

          p = Path("internal/serve/file_selections_test.go")
          text = p.read_text()
          marker = "func (l *snapshotTestLibrary) GetFile(_ context.Context, _ int64) (types.FileInfo, error) {"
          if "func (l *snapshotTestLibrary) ListPublicFileIDs(" not in text:
              method = '''func (l *snapshotTestLibrary) ListPublicFileIDs(ctx context.Context, expression string) ([]string, error) {
          \tfiles, err := l.ListFiles(ctx, expression)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tids := make([]string, 0, len(files))
          \tfor _, file := range files {
          \t\tids = append(ids, file.PublicID)
          \t}
          \treturn ids, nil
          }

          '''
              text = text.replace(marker, method + marker, 1)
          if "TestFileSelectionStoreRetainsOversizedSingleSnapshot" not in text:
              text += '''

          func TestFileSelectionStoreRetainsOversizedSingleSnapshot(t *testing.T) {
          \tstore := newFileSelectionStore()
          \tstore.maxSnapshots = 10
          \tstore.maxRetainedIDs = 3
          \tfirst, _, err := store.create("owner", []string{"a", "b"})
          \tif err != nil { t.Fatal(err) }
          \tsecond, _, err := store.create("owner", []string{"c", "d"})
          \tif err != nil { t.Fatal(err) }
          \tif _, err := store.resolve("owner", first); !errors.Is(err, errFileSelectionNotFound) {
          \t\tt.Fatalf("expected oldest snapshot eviction, got %v", err)
          \t}
          \tif _, err := store.resolve("owner", second); err != nil { t.Fatal(err) }
          \toversized, _, err := store.create("owner", []string{"e", "f", "g", "h", "i"})
          \tif err != nil { t.Fatal(err) }
          \tif _, err := store.resolve("owner", second); !errors.Is(err, errFileSelectionNotFound) {
          \t\tt.Fatalf("expected prior snapshot eviction for oversized selection, got %v", err)
          \t}
          \tids, err := store.resolve("owner", oversized)
          \tif err != nil { t.Fatal(err) }
          \tif len(ids) != 5 { t.Fatalf("expected oversized snapshot to remain usable, got %d ids", len(ids)) }
          }

          func TestExpiredFileSelectionFailsClosedForTagMutation(t *testing.T) {
          \tlibrary := newSnapshotTestLibrary("a")
          \tserver := newSnapshotTestServer(t, library)
          \tbase := time.Now().UTC()
          \tserver.fileSelections.now = func() time.Time { return base }
          \tsnapshot := createSnapshotForTest(t, server, "hidden")
          \tserver.fileSelections.now = func() time.Time { return base.Add(fileSelectionTTL + time.Second) }
          \tbody := []byte(`{"selection_id":` + quoteJSON(snapshot.ID) + `,"tags":["reviewed"]}`)
          \treq := httptest.NewRequest(http.MethodPost, "/api/v1/files/tags", bytes.NewReader(body))
          \treq.Header.Set("Content-Type", "application/json")
          \trec := httptest.NewRecorder()
          \tserver.Handler().ServeHTTP(rec, req)
          \tassertAPIError(t, rec, http.StatusGone, "selection_expired")
          \tif len(library.lastTagRequest.FileIDs) != 0 {
          \t\tt.Fatalf("expired selection must not reach tag mutator: %+v", library.lastTagRequest)
          \t}
          }
          '''
          p.write_text(text)
          PY
          GOFMT="$(go env GOROOT)/bin/gofmt"
          "$GOFMT" -w internal/serve/file_selections.go internal/serve/bulk_file_targets.go internal/serve/tag_mutations.go internal/serve/file_removals.go internal/serve/browse.go internal/serve/file_selections_test.go gooru/query.go internal/database/database.go
          go test ./internal/serve ./internal/database ./gooru/...
          rm -f .github/workflows/tmp-381-apply.yml .github/workflows/tmp-381-diagnose.yml .github/workflows/tmp-381-selfhosted.yml .github/workflows/tmp-381-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden immutable bulk selection boundary"
          git push origin HEAD:fix/349-selection-snapshots
