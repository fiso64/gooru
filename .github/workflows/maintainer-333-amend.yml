name: Maintainer #333 refresh cleanup

on:
  push:
    branches:
      - perf/333-batch-upload-cache-refresh

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'avoid redundant upload jobs refresh') }}
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove redundant inline jobs refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/lib/queries/library.ts')
          text = path.read_text()
          old = """  await Promise.all([\n    queryClient.invalidateQueries({ queryKey: ['files'] }),\n    queryClient.invalidateQueries({ queryKey: ['jobs'] }),\n    queryClient.invalidateQueries({ queryKey: libraryKeys.tagsRoot })\n  ]);"""
          new = """  await Promise.all([\n    queryClient.invalidateQueries({ queryKey: ['files'] }),\n    queryClient.invalidateQueries({ queryKey: libraryKeys.tagsRoot })\n  ]);"""
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))

          path = Path('frontend/tests/upload-concurrency.spec.ts')
          text = path.read_text()
          old = "await expect.poll(() => jobsListRequests - jobsBeforeUpload).toBe(1);"
          new = "await expect.poll(() => jobsListRequests - jobsBeforeUpload).toBe(0);"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Check frontend
        working-directory: frontend
        run: npm run check
      - name: Upload concurrency browser regression
        working-directory: frontend
        run: npx playwright test tests/upload-concurrency.spec.ts --project=chromium
      - name: Commit validated cleanup
        run: |
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add frontend/src/lib/queries/library.ts frontend/tests/upload-concurrency.spec.ts
          git commit -m 'perf(ui): avoid redundant upload jobs refresh'
          git push origin HEAD:perf/333-batch-upload-cache-refresh
