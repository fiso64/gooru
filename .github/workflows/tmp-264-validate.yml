name: Temporary #264 validation

on:
  push:
    branches:
      - feat/264-saved-search-order
    paths:
      - '.github/workflows/tmp-264-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/264-saved-search-order
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go test
        run: go test ./...
      - name: Go build
        run: go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Focused saved-search browser regression
        working-directory: frontend
        run: npx playwright test tests/saved-search-reorder.spec.ts --project=chromium
