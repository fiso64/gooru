name: tmp-254-strategy-review
on:
  push:
    branches: [feat/254-added-at-strategy]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply self-review patch
        run: python .github/tmp-254-strategy-review.py
      - name: Format
        run: gofmt -w internal/serve/config.go internal/serve/config_test.go internal/serve/upload_stream.go internal/database/database_test.go
      - name: Generate API types
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
      - name: Validate backend
        run: go test ./...
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
          npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit self-review patch
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal docs frontend/src/lib/api/openapi.ts
          if ! git diff --cached --quiet; then
            git commit -m 'test(upload): harden added-at strategy contracts'
            git push origin HEAD:feat/254-added-at-strategy
          fi