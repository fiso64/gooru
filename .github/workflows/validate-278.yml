name: Validate grid layout regressions

on:
  push:
    branches:
      - feat/278-grid-layout-types

permissions:
  contents: read

jobs:
  grid-layouts:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Resolve Chromium
        shell: bash
        run: |
          CHROMIUM="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$CHROMIUM" ]; then
            echo "No system Chromium executable found" >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROMIUM" >> "$GITHUB_ENV"
      - name: Focused grid layout regression
        run: npx playwright test tests/grid-layout-config.spec.ts --project=chromium
