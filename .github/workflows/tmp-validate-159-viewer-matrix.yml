name: tmp validate 159 viewer matrix
on:
  push:
    branches: [fix/159-native-scroll-pan]
permissions:
  contents: write
jobs:
  viewer-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/159-native-scroll-pan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check video-control baseline on develop
        run: |
          git checkout --detach origin/develop
          cd frontend
          npx playwright test tests/playable-media-seek.spec.ts --project=chromium
