name: tmp validate 159 viewer matrix
on:
  push:
    branches: [fix/159-native-scroll-pan]
permissions:
  contents: write
jobs:
  viewer-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/159-native-scroll-pan
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Align stale video-control regression with proximity contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/tests/playable-media-seek.spec.ts')
          s = p.read_text()
          old = "  await page.mouse.move(box.x + 30, box.y + 30);\n  await expect.poll(() => controls.evaluate((element) => getComputedStyle(element).opacity)).toBe('1');"
          new = "  // Player chrome is proximity-triggered: movement near the lower control zone reveals it.\n  await page.mouse.move(box.x + 30, box.y + box.height - 30);\n  await expect.poll(() => controls.evaluate((element) => getComputedStyle(element).opacity)).toBe('1');"
          assert old in s
          p.write_text(s.replace(old, new))
          PY
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run viewer integration matrix
        working-directory: frontend
        run: >-
          npx playwright test
          tests/viewer-zoom-pan.spec.ts
          tests/viewer-player-controls.spec.ts
          tests/viewer-animation.spec.ts
          tests/viewer-full-media-default.spec.ts
          tests/viewer-gif-fit.spec.ts
          tests/viewer-tag-navigation.spec.ts
          tests/playable-media-seek.spec.ts
          tests/review-regressions.spec.ts
          --project=chromium
      - name: Commit validated regression alignment and remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/tmp-validate-159-viewer-matrix.yml
          git add frontend/tests/playable-media-seek.spec.ts
          git config user.name 'chatgpt-codex-connector'
          git config user.email 'chatgpt-codex-connector@users.noreply.github.com'
          git commit -m 'test(viewer): align controls reveal with proximity behavior'
          git push origin HEAD:fix/159-native-scroll-pan
