name: maintainer cleanup obsolete branch

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/maintainer-cleanup-obsolete-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, gooru]
    steps:
      - name: Delete obsolete validation branch if still duplicated
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: validate-booru-develop-sync-20260914
          CANONICAL_BRANCH: booru-theme
          EXPECTED_SHA: f42a7a7c1fdfd393c85c0f5c5a0f54f71e362a5f
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}/git/ref/heads"
          token = os.environ['GH_TOKEN']
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(branch):
              req = urllib.request.Request(f"{base}/{branch}", headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)["object"]["sha"]

          target = os.environ['TARGET_BRANCH']
          canonical = os.environ['CANONICAL_BRANCH']
          expected = os.environ['EXPECTED_SHA']
          target_sha = get(target)
          canonical_sha = get(canonical)
          if target_sha != expected or canonical_sha != expected:
              raise SystemExit(
                  f"ref safety check failed: target={target_sha}, canonical={canonical_sha}, expected={expected}"
              )

          req = urllib.request.Request(f"{base}/{target}", headers=headers, method="DELETE")
          with urllib.request.urlopen(req) as response:
              if response.status not in (200, 204):
                  raise SystemExit(f"unexpected delete status: {response.status}")
          print(f"deleted {target} at {target_sha}; canonical {canonical} retains the same commit")
          PY
