name: Temporary #416 implementation

on:
  push:
    branches:
      - feat/416-bound-actual-size

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/416-bound-actual-size
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply implementation and regressions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace('internal/serve/config.go',
              '\tViewerFitMode            string   `yaml:"viewer_fit_mode"`\n\tViewerScaling            string   `yaml:"viewer_scaling"`',
              '\tViewerFitMode            string   `yaml:"viewer_fit_mode"`\n\tViewerActualSizeFitCap   bool     `yaml:"viewer_actual_size_fit_cap"`\n\tViewerScaling            string   `yaml:"viewer_scaling"`')
          replace('internal/serve/config.go',
              '\t\t\tViewerFitMode:  "fit_window",\n\t\t\tViewerScaling:  "smooth",',
              '\t\t\tViewerFitMode:          "fit_window",\n\t\t\tViewerActualSizeFitCap: true,\n\t\t\tViewerScaling:          "smooth",')

          replace('internal/serve/ui_config.go',
              '\tViewerFitMode            string   `json:"viewer_fit_mode"`\n\tViewerScaling            string   `json:"viewer_scaling"`',
              '\tViewerFitMode            string   `json:"viewer_fit_mode"`\n\tViewerActualSizeFitCap   bool     `json:"viewer_actual_size_fit_cap"`\n\tViewerScaling            string   `json:"viewer_scaling"`')
          replace('internal/serve/ui_config.go',
              '\t\tViewerFitMode:            s.cfg.UI.ViewerFitMode,\n\t\tViewerScaling:            s.cfg.UI.ViewerScaling,',
              '\t\tViewerFitMode:            s.cfg.UI.ViewerFitMode,\n\t\tViewerActualSizeFitCap:   s.cfg.UI.ViewerActualSizeFitCap,\n\t\tViewerScaling:            s.cfg.UI.ViewerScaling,')

          replace('frontend/src/lib/stores/runtimeConfig.ts',
              '  viewerFitMode: ViewerConfiguredFitMode;\n  viewerScaling: ViewerScaling;',
              '  viewerFitMode: ViewerConfiguredFitMode;\n  viewerActualSizeFitCap: boolean;\n  viewerScaling: ViewerScaling;')
          replace('frontend/src/lib/stores/runtimeConfig.ts',
              "  viewerFitMode: 'fit_window',\n  viewerScaling: 'smooth',",
              "  viewerFitMode: 'fit_window',\n  viewerActualSizeFitCap: true,\n  viewerScaling: 'smooth',")

          replace('frontend/src/lib/components/AppPage.svelte',
              '    viewer_fit_mode?: ViewerConfiguredFitMode;\n    viewer_scaling?: ViewerScaling;',
              '    viewer_fit_mode?: ViewerConfiguredFitMode;\n    viewer_actual_size_fit_cap?: boolean;\n    viewer_scaling?: ViewerScaling;')
          replace('frontend/src/lib/components/AppPage.svelte',
              "      viewerFitMode: config.viewer_fit_mode ?? 'fit_window',\n      viewerScaling: config.viewer_scaling ?? 'smooth',",
              "      viewerFitMode: config.viewer_fit_mode ?? 'fit_window',\n      viewerActualSizeFitCap: config.viewer_actual_size_fit_cap ?? true,\n      viewerScaling: config.viewer_scaling ?? 'smooth',")

          replace('frontend/src/lib/components/PreviewDialog.svelte',
              '    initialFitMode={$runtimeConfig.viewerFitMode}\n    initialScaling={$runtimeConfig.viewerScaling}',
              '    initialFitMode={$runtimeConfig.viewerFitMode}\n    boundActualSizeToFit={$runtimeConfig.viewerActualSizeFitCap}\n    initialScaling={$runtimeConfig.viewerScaling}')

          replace('frontend/src/lib/utils/viewer.ts',
              '  fitMode: ViewerFitMode;\n  inset?: number;',
              '  fitMode: ViewerFitMode;\n  boundActualSizeToFit?: boolean;\n  inset?: number;')
          replace('frontend/src/lib/utils/viewer.ts',
              "  if (input.fitMode === 'actual') {\n    return { width: intrinsicWidth, height: intrinsicHeight, rotation: input.rotation, scale: 1 };\n  }\n\n  const quarterTurn = normalizedRotation === 90 || normalizedRotation === 270;\n  const rotatedWidth = quarterTurn ? intrinsicHeight : intrinsicWidth;\n  const rotatedHeight = quarterTurn ? intrinsicWidth : intrinsicHeight;\n  const maxScale = input.maxScale ?? Number.POSITIVE_INFINITY;\n  const fitScale = Math.min(viewportWidth / rotatedWidth, viewportHeight / rotatedHeight, maxScale);",
              "  const quarterTurn = normalizedRotation === 90 || normalizedRotation === 270;\n  const rotatedWidth = quarterTurn ? intrinsicHeight : intrinsicWidth;\n  const rotatedHeight = quarterTurn ? intrinsicWidth : intrinsicHeight;\n  const maxScale = input.maxScale ?? Number.POSITIVE_INFINITY;\n  const fitScale = Math.min(viewportWidth / rotatedWidth, viewportHeight / rotatedHeight, maxScale);\n\n  if (input.fitMode === 'actual') {\n    const scale = input.boundActualSizeToFit ? Math.min(1, fitScale) : 1;\n    return { width: intrinsicWidth * scale, height: intrinsicHeight * scale, rotation: input.rotation, scale };\n  }")

          replace('frontend/src/lib/components/ViewerStage.svelte',
              "    initialFitMode = 'fit_window',\n    initialScaling = 'smooth',",
              "    initialFitMode = 'fit_window',\n    boundActualSizeToFit = true,\n    initialScaling = 'smooth',")
          replace('frontend/src/lib/components/ViewerStage.svelte',
              '    initialFitMode?: ViewerConfiguredFitMode;\n    initialScaling?: ViewerScaling;',
              '    initialFitMode?: ViewerConfiguredFitMode;\n    boundActualSizeToFit?: boolean;\n    initialScaling?: ViewerScaling;')
          replace('frontend/src/lib/components/ViewerStage.svelte',
              '    fitMode,\n    inset: isFullscreen ? 0 : 36,',
              '    fitMode,\n    boundActualSizeToFit,\n    inset: isFullscreen ? 0 : 36,')
          replace('frontend/src/lib/components/ViewerStage.svelte',
              "  const minimumZoom = $derived(fitMode === 'actual' ? Math.min(1, fitGeometry.scale) : 1);",
              "  const minimumZoom = $derived(fitMode === 'actual' && !boundActualSizeToFit ? Math.min(1, fitGeometry.scale) : 1);")

          replace('internal/serve/ui_config_test.go',
              '\tcfg.UI.ViewerFitMode = "original_size_if_fit"\n\tcfg.UI.ViewerScaling = "nearest"',
              '\tcfg.UI.ViewerFitMode = "original_size_if_fit"\n\tcfg.UI.ViewerActualSizeFitCap = false\n\tcfg.UI.ViewerScaling = "nearest"')
          replace('internal/serve/ui_config_test.go',
              '\tif !strings.Contains(rec.Body.String(), `"viewer_fit_mode":"original_size_if_fit"`) {\n\t\tt.Fatalf("response missing viewer fit mode: %s", rec.Body.String())\n\t}\n\tif !strings.Contains(rec.Body.String(), `"viewer_scaling":"nearest"`) {',
              '\tif !strings.Contains(rec.Body.String(), `"viewer_fit_mode":"original_size_if_fit"`) {\n\t\tt.Fatalf("response missing viewer fit mode: %s", rec.Body.String())\n\t}\n\tif !strings.Contains(rec.Body.String(), `"viewer_actual_size_fit_cap":false`) {\n\t\tt.Fatalf("response missing actual-size fit cap: %s", rec.Body.String())\n\t}\n\tif !strings.Contains(rec.Body.String(), `"viewer_scaling":"nearest"`) {')
          insert = '''\nfunc TestConfigLoadsViewerActualSizeFitCap(t *testing.T) {\n\tdir := t.TempDir()\n\tpath := filepath.Join(dir, "gooru.yaml")\n\tif err := os.WriteFile(path, []byte("ui:\\n  viewer_actual_size_fit_cap: false\\n"), 0o600); err != nil {\n\t\tt.Fatalf("write config: %v", err)\n\t}\n\tcfg, err := LoadConfig(path, filepath.Join(dir, "gooru.db"), Overrides{})\n\tif err != nil {\n\t\tt.Fatalf("load config: %v", err)\n\t}\n\tif cfg.UI.ViewerActualSizeFitCap {\n\t\tt.Fatal("ui.viewer_actual_size_fit_cap should allow explicitly disabling the default cap")\n\t}\n\tdefaults := DefaultConfig(filepath.Join(dir, "default.db"))\n\tif !defaults.UI.ViewerActualSizeFitCap {\n\t\tt.Fatal("ui.viewer_actual_size_fit_cap should default enabled")\n\t}\n}\n\n'''
          p = Path('internal/serve/ui_config_test.go')
          text = p.read_text()
          anchor = 'func TestConfigLoadsAndValidatesViewerFitMode(t *testing.T) {'
          if anchor not in text: raise SystemExit('missing ui config test insertion anchor')
          p.write_text(text.replace(anchor, insert + anchor, 1))

          replace('docs/CONFIG.md',
              '| `ui.viewer_fit_mode` | `fit_window` | Default viewer fit policy: `fit_window` (legacy alias `screen`) fills the available viewer bounds, `fit_down_only` never enlarges smaller media, `original_size_if_fit` keeps media at 1:1 when it fits and otherwise scales down, and `actual` starts at original size. Press `V` to cycle the fit policies for the current browser session. |\n| `ui.viewer_scaling`',
              '| `ui.viewer_fit_mode` | `fit_window` | Default viewer fit policy: `fit_window` (legacy alias `screen`) fills the available viewer bounds, `fit_down_only` never enlarges smaller media, `original_size_if_fit` keeps media at 1:1 when it fits and otherwise scales down, and `actual` starts from 1:1 semantics. Press `V` to cycle the fit policies for the current browser session. |\n| `ui.viewer_actual_size_fit_cap` | `true` | When enabled, `actual`/1:1 mode starts no larger than fit-window size for oversized media. Manual zoom remains available above that fitted baseline. Disable this to preserve an uncapped intrinsic 1:1 starting size. |\n| `ui.viewer_scaling`')
          replace('docs/CONFIG.md',
              '  viewer_fit_mode: fit_window\n  viewer_scaling: smooth',
              '  viewer_fit_mode: fit_window\n  viewer_actual_size_fit_cap: true\n  viewer_scaling: smooth')

          test_path = Path('frontend/tests/viewer-fit-mode.spec.ts')
          text = test_path.read_text()
          addition = r'''\n\nasync function openOversizedActualViewer(page: Page, fitCap?: boolean) {\n  await mockSession(page);\n  const file = {\n    id: 'large-image', content_id: 'hash-large-image', name: 'large.png', safe_display_path: 'library/large.png', size: 4096,\n    added_at: '2026-09-07T00:00:00Z', modified_time: '2026-09-07T00:00:00Z', media_type: 'image/png', media_kind: 'photo',\n    metadata: { image_width: 2400, image_height: 1600 }, tags: [], can_delete: true,\n    media_urls: {\n      thumbnail: '/api/v1/files/large-image/thumbnail', preview: '/api/v1/files/large-image/preview',\n      content: '/api/v1/files/large-image/content', download: '/api/v1/files/large-image/download'\n    }\n  };\n  const uiConfig: Record<string, unknown> = { viewer_fit_mode: 'actual' };\n  if (fitCap !== undefined) uiConfig.viewer_actual_size_fit_cap = fitCap;\n  await page.route('**/api/v1/ui-config', async (route) => route.fulfill({\n    contentType: 'application/json', body: JSON.stringify(uiConfig)\n  }));\n  await page.route('**/api/v1/files?**', async (route) => route.fulfill({\n    contentType: 'application/json', body: JSON.stringify({ files: [file], total_count: 1, library_count: 1, facets: { kind: [] } })\n  }));\n  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600"><rect width="2400" height="1600"/></svg>';\n  for (const endpoint of ['thumbnail', 'preview', 'content']) {\n    await page.route(`**/api/v1/files/large-image/${endpoint}`, async (route) => route.fulfill({ contentType: 'image/svg+xml', body: svg }));\n  }\n\n  await signInAndOpen(page, 'large.png');\n  const stage = page.locator('.viewer-stage');\n  const image = page.locator('img.viewer-visual-media');\n  await expect(image).toBeVisible();\n  await stage.focus();\n  return { stage, image };\n}\n\ntest('actual-size mode is fit-capped by default while manual zoom can grow beyond the fitted baseline', async ({ page }) => {\n  const { stage, image } = await openOversizedActualViewer(page);\n  const stageBox = await stage.boundingBox();\n  const initial = await image.boundingBox();\n  expect(stageBox).not.toBeNull();\n  expect(initial).not.toBeNull();\n  expect(initial!.width).toBeLessThanOrEqual(stageBox!.width);\n  expect(initial!.width).toBeLessThan(2400);\n\n  await stage.dispatchEvent('wheel', { deltaY: -120, ctrlKey: true, clientX: stageBox!.x + stageBox!.width / 2, clientY: stageBox!.y + stageBox!.height / 2 });\n  await expect.poll(async () => (await image.boundingBox())?.width ?? 0).toBeGreaterThan(initial!.width);\n});\n\ntest('actual-size fit cap can be disabled to preserve intrinsic 1:1 startup size', async ({ page }) => {\n  const { image } = await openOversizedActualViewer(page, false);\n  await expect.poll(async () => (await image.boundingBox())?.width ?? 0).toBeGreaterThan(2398);\n  expect((await image.boundingBox())!.width).toBeLessThan(2402);\n});\n'''
          test_path.write_text(text + addition)
          PY
          gofmt -w internal/serve/config.go internal/serve/ui_config.go internal/serve/ui_config_test.go
      - name: Go focused tests
        run: go test ./internal/serve
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check and unit tests
        working-directory: frontend
        run: npm run check && npm run test:unit
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Viewer browser regression
        working-directory: frontend
        run: npm run test:e2e -- viewer-fit-mode.spec.ts
      - name: Commit validated implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-416-implement.yml
          git config user.name "gooru-maintainer"
          git config user.email "gooru-maintainer@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): bound actual-size viewer mode by fit"
          git push origin HEAD:feat/416-bound-actual-size
