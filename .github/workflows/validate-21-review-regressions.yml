name: validate-21-review-regressions

on:
  push:
    branches:
      - fix/21-review-regressions

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright test tests/review-regressions.spec.ts --project=chromium
