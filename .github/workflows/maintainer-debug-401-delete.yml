name: maintainer-debug-401-delete

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/maintainer-debug-401-delete.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run implementation script with captured output
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          doc = yaml.safe_load(Path('.github/workflows/maintainer-implement-401-delete.yml').read_text())
          steps = doc['jobs']['implement']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Implement durable selected-file removal')
          Path('/tmp/maintainer-401-implement.sh').write_text(script)
          PY
          if bash -x /tmp/maintainer-401-implement.sh > /tmp/maintainer-401.log 2>&1; then
            exit 0
          fi
          git reset --hard origin/develop
          git clean -fdx
          git checkout -B maintainer/debug-401-delete origin/develop
          cp /tmp/maintainer-401.log .maintainer-401-error.log
          git add .maintainer-401-error.log
          git -c user.name=chatgpt-codex-connector -c user.email=chatgpt-codex-connector@users.noreply.github.com commit -m 'chore(maintainer): capture #401 implementation failure'
          git push --force origin maintainer/debug-401-delete
          exit 1
