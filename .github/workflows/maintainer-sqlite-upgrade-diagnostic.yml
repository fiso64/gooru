name: Maintainer SQLite upgrade diagnostic

on:
  push:
    branches:
      - maintainer/sqlite-foreground-upgrade

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Inventory transaction starts
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -E '\.Begin\(\)|BeginTx\(' -- '*.go' || true
      - name: Reproduce foreground transaction upgrade
        shell: bash
        run: |
          set +e
          go test -count=1 -run TestForegroundTransactionReadThenWriteSurvivesConcurrentCommit -v ./internal/database
          status=$?
          set -e
          echo "targeted regression exit status: $status"
          exit 0
