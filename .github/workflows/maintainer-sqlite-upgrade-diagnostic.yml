name: Maintainer SQLite upgrade diagnostic

on:
  push:
    branches:
      - maintainer/sqlite-foreground-upgrade

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - name: Inspect gosqlite transaction support
        shell: bash
        run: |
          set -euo pipefail
          driver_dir="$(go list -f '{{.Dir}}' gosqlite.org)"
          echo "driver_dir=$driver_dir"
          grep -R -n -E 'BeginTx|BEGIN IMMEDIATE|txlock|Transaction' "$driver_dir" | head -n 160 || true
      - name: Reproduce foreground transaction upgrade
        shell: bash
        run: |
          set +e
          go test -count=1 -run TestForegroundTransactionReadThenWriteSurvivesConcurrentCommit -v ./internal/database
          status=$?
          set -e
          echo "targeted regression exit status: $status"
          exit 0
