name: tmp-170-atomic-handoff

on:
  push:
    branches: [fix/22-image-geometry-hold]
    paths:
      - .github/workflows/tmp-170-atomic-handoff.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/22-image-geometry-hold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply presentation handoff change
        run: echo '' | base64 -d | python3
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Static check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Focused viewer regression
        working-directory: frontend
        run: npx playwright test tests/viewer-image-geometry-hold.spec.ts tests/viewer-animation.spec.ts tests/viewer-zoom-pan.spec.ts --project=chromium
      - name: Commit validated attempt and remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/tmp-170-atomic-handoff.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add frontend/src/lib/components/ViewerStage.svelte frontend/tests/viewer-image-geometry-hold.spec.ts .github/workflows/tmp-170-atomic-handoff.yml
          git commit -m "fix(viewer): make image handoff visually atomic"
          git push origin HEAD:fix/22-image-geometry-hold
