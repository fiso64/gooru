name: Temporary tag batching patch

on:
  push:
    branches:
      - agent/issue-549-batch-tag-queries
    paths:
      - .github/workflows/temporary-batch-tag-queries.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify regressions are red before implementation
        shell: bash
        run: |
          set -euo pipefail
          for test_name in \
            TestBatchGetTagsRespectsVariableBudget \
            TestBatchGetOrCreateTagsBatchesInserts \
            TestBatchGetOrCreateTagsUsesInputSpellingForExistingTag
          do
            if go test ./internal/database -run "^${test_name}$" -count=1; then
              echo "expected ${test_name} to fail before implementation" >&2
              exit 1
            fi
          done

      - name: Batch tag lookups and creation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/database/database.go')
          text = path.read_text()
          start_marker = 'func (s *Store) BatchGetTags(q Querier, parsedTags []types.ParsedTag) (map[string]int64, error) {'
          end_marker = 'func (s *Store) BatchInsertContents(q Querier, hashes []string) error {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r'''func parsedTagString(tag types.ParsedTag) string {
          	if tag.Value == "" {
          		return tag.Key
          	}
          	return tag.Key + ":" + tag.Value
          }
          
          func (s *Store) BatchGetTags(q Querier, parsedTags []types.ParsedTag) (map[string]int64, error) {
          	tagIDMap := make(map[string]int64)
          	if len(parsedTags) == 0 {
          		return tagIDMap, nil
          	}
          
          	const columns = 2 // key, value
          	batchSize := maxVars / columns
          	for i := 0; i < len(parsedTags); i += batchSize {
          		end := i + batchSize
          		if end > len(parsedTags) {
          			end = len(parsedTags)
          		}
          		batch := parsedTags[i:end]
          
          		placeholders := make([]string, len(batch))
          		args := make([]interface{}, 0, len(batch)*columns)
          		for j, tag := range batch {
          			placeholders[j] = "(?, ?)"
          			args = append(args, tag.Key, tag.Value)
          		}
          		query := `WITH requested(key, value) AS (VALUES ` + strings.Join(placeholders, ",") + `)
          			SELECT t.id, requested.key, requested.value
          			FROM requested
          			JOIN tags t ON t.key = requested.key AND t.value = requested.value`
          
          		rows, err := q.Query(query, args...)
          		if err != nil {
          			return nil, err
          		}
          		for rows.Next() {
          			var id int64
          			var key, value string
          			if err := rows.Scan(&id, &key, &value); err != nil {
          				rows.Close()
          				return nil, err
          			}
          			tagIDMap[parsedTagString(types.ParsedTag{Key: key, Value: value})] = id
          		}
          		if err := rows.Err(); err != nil {
          			rows.Close()
          			return nil, err
          		}
          		if err := rows.Close(); err != nil {
          			return nil, err
          		}
          	}
          	return tagIDMap, nil
          }
          
          func (s *Store) BatchGetOrCreateTags(q Querier, parsedTags []types.ParsedTag) (map[string]int64, error) {
          	tagIDMap, err := s.BatchGetTags(q, parsedTags)
          	if err != nil {
          		return nil, err
          	}
          
          	missing := make([]types.ParsedTag, 0, len(parsedTags)-len(tagIDMap))
          	seenMissing := make(map[string]struct{})
          	for _, tag := range parsedTags {
          		tagStr := parsedTagString(tag)
          		if _, exists := tagIDMap[tagStr]; exists {
          			continue
          		}
          		if _, exists := seenMissing[tagStr]; exists {
          			continue
          		}
          		seenMissing[tagStr] = struct{}{}
          		missing = append(missing, tag)
          	}
          	if len(missing) == 0 {
          		return tagIDMap, nil
          	}
          
          	const columns = 2 // key, value
          	batchSize := maxVars / columns
          	for i := 0; i < len(missing); i += batchSize {
          		end := i + batchSize
          		if end > len(missing) {
          			end = len(missing)
          		}
          		batch := missing[i:end]
          		placeholders := make([]string, len(batch))
          		args := make([]interface{}, 0, len(batch)*columns)
          		for j, tag := range batch {
          			placeholders[j] = "(?, ?)"
          			args = append(args, tag.Key, tag.Value)
          		}
          		query := "INSERT OR IGNORE INTO tags (key, value) VALUES " + strings.Join(placeholders, ",")
          		if _, err := q.Exec(query, args...); err != nil {
          			return nil, err
          		}
          	}
          
          	created, err := s.BatchGetTags(q, missing)
          	if err != nil {
          		return nil, err
          	}
          	for tagStr, id := range created {
          		tagIDMap[tagStr] = id
          	}
          	return tagIDMap, nil
          }
          
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          gofmt -w internal/database/database.go

      - name: Validate database package
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/database -count=1

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fiso64'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git rm .github/workflows/temporary-batch-tag-queries.yml
          git add internal/database/database.go
          git commit -m 'perf: batch tag lookups and creation'
          git push origin HEAD:agent/issue-549-batch-tag-queries
