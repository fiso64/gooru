name: Temporary completion repair

on:
  push:
    branches:
      - fix/387-completion-stability
    paths:
      - .github/workflows/tmp-387-completion-repair.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/387-completion-stability
          fetch-depth: 0
      - name: Apply repair and regressions
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/describe('plain tag suggestions'/describe('plainTagSuggestions'/" .github/tmp-387-repair.py
          python3 .github/tmp-387-repair.py
          gofmt -w internal/database/database_test.go
      - name: Validate Go suggestions
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/database ./internal/serve
      - name: Validate frontend unit and type checks
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run test:unit -- --run src/lib/utils/tagSuggestions.test.ts src/lib/state/libraryWorkflow.test.ts
          npm run check
      - name: Validate browser completion regression
        shell: bash
        working-directory: frontend
        env:
          CI: '1'
        run: |
          set -euo pipefail
          npm run test:e2e -- tests/search-completion-ranking.spec.ts
      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git add frontend/src/lib/queries/library.ts frontend/src/lib/state/libraryWorkflow.svelte.ts frontend/src/lib/utils/tagSuggestions.ts frontend/src/lib/utils/tagSuggestions.test.ts frontend/src/lib/state/libraryWorkflow.test.ts frontend/tests/search-completion-ranking.spec.ts internal/database/database.go internal/database/database_test.go
          git config user.name 'Gooru Maintainer'
          git config user.email 'maintainer@users.noreply.github.com'
          git commit -m 'fix: stabilize search completions'
          git push origin HEAD:fix/387-completion-stability
