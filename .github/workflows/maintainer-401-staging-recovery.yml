name: Maintainer #401 upload staging recovery

on:
  push:
    branches:
      - maintainer/401-upload-staging-recovery
    paths:
      - .github/workflows/maintainer-401-staging-recovery.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/401-upload-staging-recovery
      - name: Inspect upload import path
        shell: bash
        run: |
          set -euo pipefail
          rg -n 'func .*ImportUploadedFiles|func .*importUploadedFiles|StagedUpload|AnalysisPath' internal/serve | head -n 160
