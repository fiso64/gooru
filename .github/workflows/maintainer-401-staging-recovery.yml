name: Maintainer #401 upload staging recovery

on:
  push:
    branches:
      - maintainer/401-upload-staging-recovery
    paths:
      - .github/workflows/maintainer-401-staging-recovery.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/401-upload-staging-recovery
      - name: Apply recovery fixes and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          activation = Path('internal/serve/upload_durable_activation.go')
          text = activation.read_text()
          old = '''\t\tif durableUploadNeedsActivation(file) {\n\t\t\tstaged[i].Path = file.destinationPath\n\t\t}\n'''
          new = '''\t\tif durableUploadNeedsActivation(file) {\n\t\t\tstaged[i].Path = file.destinationPath\n\t\t\tstaged[i].AnalysisPath = file.destinationPath\n\t\t}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'activation mapping block count={text.count(old)}')
          text = text.replace(old, new)
          old = '''\t\tif stagedErr != nil || destinationErr != nil || !os.SameFile(stagedInfo, destinationInfo) {\n\t\t\treturn errUploadConflict\n\t\t}\n\t} else if err := os.Link(stagedPath, destinationPath); err != nil {\n\t\tif errors.Is(err, os.ErrExist) {\n\t\t\treturn errUploadConflict\n\t\t}\n\t\treturn errors.New("failed to activate durable upload")\n\t}\n'''
          new = '''\t\tif stagedErr != nil || destinationErr != nil || !os.SameFile(stagedInfo, destinationInfo) {\n\t\t\t_ = os.Remove(markerPath)\n\t\t\treturn errUploadConflict\n\t\t}\n\t} else if err := os.Link(stagedPath, destinationPath); err != nil {\n\t\t_ = os.Remove(markerPath)\n\t\tif errors.Is(err, os.ErrExist) {\n\t\t\treturn errUploadConflict\n\t\t}\n\t\treturn errors.New("failed to activate durable upload")\n\t}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'activation conflict block count={text.count(old)}')
          activation.write_text(text.replace(old, new))

          durable = Path('internal/serve/uploads_durable.go')
          text = durable.read_text()
          old = '''\tcase backgroundUploadPhaseStaged:\n\t\tactivated, err := activateSavedReplacements(files)\n\t\tif err != nil { return fmt.Errorf("recover canceled staged upload replacements: %w", err) }\n\t\tif err := rollbackSavedReplacements(activated); err != nil { return fmt.Errorf("rollback canceled staged upload replacements: %w", err) }\n\t\treturn removeCanceledSavedUploads(files)\n\tcase backgroundUploadPhaseActivated:\n\t\tactivated, err := activatedSavedReplacementsFromCheckpoint(files, checkpoint)\n\t\tif err != nil { return fmt.Errorf("recover canceled activated upload replacements: %w", err) }\n\t\tif err := rollbackSavedReplacements(activated); err != nil { return fmt.Errorf("rollback canceled activated upload replacements: %w", err) }\n\t\treturn removeCanceledSavedUploads(files)\n\tcase backgroundUploadPhaseImported:\n\t\tif checkpoint.Response == nil { return errors.New("canceled imported upload checkpoint is missing response") }\n\t\tactivated, err := activatedSavedReplacementsFromCheckpoint(files, checkpoint)\n\t\tif err != nil { return fmt.Errorf("recover canceled imported upload replacements: %w", err) }\n\t\tif err := settleSavedReplacements(activated, *checkpoint.Response); err != nil { return fmt.Errorf("settle canceled imported upload replacements: %w", err) }\n\t\treturn nil\n'''
          new = '''\tcase backgroundUploadPhaseStaged:\n\t\tactivated, err := activateSavedReplacements(files)\n\t\tif err != nil { return fmt.Errorf("recover canceled staged upload replacements: %w", err) }\n\t\treturn cleanupCanceledClaimedUpload(files, activated)\n\tcase backgroundUploadPhaseActivated:\n\t\tactivated, err := activatedSavedReplacementsFromCheckpoint(files, checkpoint)\n\t\tif err != nil { return fmt.Errorf("recover canceled activated upload replacements: %w", err) }\n\t\treturn cleanupCanceledClaimedUpload(files, activated)\n\tcase backgroundUploadPhaseImported:\n\t\tif checkpoint.Response == nil { return errors.New("canceled imported upload checkpoint is missing response") }\n\t\tactivated, err := activatedSavedReplacementsFromCheckpoint(files, checkpoint)\n\t\tif err != nil { return fmt.Errorf("recover canceled imported upload replacements: %w", err) }\n\t\tif err := settleSavedReplacements(activated, *checkpoint.Response); err != nil { return fmt.Errorf("settle canceled imported upload replacements: %w", err) }\n\t\tif err := settleDurableNonreplacementActivations(files); err != nil { return fmt.Errorf("settle canceled imported durable uploads: %w", err) }\n\t\treturn nil\n'''
          if text.count(old) != 1:
              raise SystemExit(f'cancellation phase block count={text.count(old)}')
          text = text.replace(old, new)
          start = text.find('\nfunc removeCanceledSavedUploads(files []savedUpload) error {')
          end = text.find('\nfunc waitForDurableUpload(', start)
          if start < 0 or end < 0:
              raise SystemExit('removeCanceledSavedUploads block not found')
          text = text[:start] + text[end:]
          text = text.replace('\n\t"os"\n', '\n')
          durable.write_text(text)

          tests = Path('internal/serve/uploads_durable_test.go')
          text = tests.read_text()
          old = '''\tstagedPath := filepath.Join(targetDir, "photo.jpg")\n\tif got := string(mustReadFile(t, stagedPath)); got != "hello" {\n'''
          new = '''\tstagingDir, stagingErr := durableUploadStagingDir(targetDir, store.operation.ID)\n\tif stagingErr != nil {\n\t\tt.Fatal(stagingErr)\n\t}\n\tstagedPath := filepath.Join(stagingDir, "photo.jpg")\n\tif got := string(mustReadFile(t, stagedPath)); got != "hello" {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'async staging assertion count={text.count(old)}')
          text = text.replace(old, new)
          old = '''\tstagedPath := filepath.Join(uploadDir, "pending.txt")\n\tif got := string(mustReadFile(t, stagedPath)); got != "hello" {\n'''
          new = '''\tstagingDir, stagingErr := durableUploadStagingDir(uploadDir, operation.ID)\n\tif stagingErr != nil {\n\t\t_ = client.Close()\n\t\tt.Fatal(stagingErr)\n\t}\n\tstagedPath := filepath.Join(stagingDir, "pending.txt")\n\tif got := string(mustReadFile(t, stagedPath)); got != "hello" {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'cancel staging assertion count={text.count(old)}')
          tests.write_text(text.replace(old, new))

          staging_tests = Path('internal/serve/upload_durable_staging_test.go')
          text = staging_tests.read_text().rstrip() + r'''

func TestActivateDurableUploadDestinationDropsStaleMarkerOnConflictingReplay(t *testing.T) {
	root := t.TempDir()
	server := newUploadTestServer(t, root, true, &recordingUploadLibrary{})
	req := uploadRequest(t, map[string]string{"photo.jpg": "staged"}, nil)
	_, saved, err := server.stageDurableMultipartUpload(req, testDurableUploadOperationID)
	if err != nil {
		t.Fatal(err)
	}
	markerPath := saved[0].path + durableUploadActivatedMarkerSuffix
	if err := os.WriteFile(markerPath, nil, 0600); err != nil {
		t.Fatal(err)
	}
	if err := os.WriteFile(saved[0].destinationPath, []byte("racer"), 0600); err != nil {
		t.Fatal(err)
	}
	if _, err := activateSavedDurableUploads(saved); !errors.Is(err, errUploadConflict) {
		t.Fatalf("activation error = %v, want upload conflict", err)
	}
	if _, err := os.Stat(markerPath); !errors.Is(err, os.ErrNotExist) {
		t.Fatalf("stale activation marker remains after conflict: %v", err)
	}
	if err := rollbackDurableNonreplacementActivations(saved); err != nil {
		t.Fatal(err)
	}
	if got := string(mustReadFile(t, saved[0].destinationPath)); got != "racer" {
		t.Fatalf("rollback removed racing destination: %q", got)
	}
}
'''
          staging_tests.write_text(text)
          PY
          gofmt -w internal/serve/upload_durable_activation.go internal/serve/uploads_durable.go internal/serve/uploads_durable_test.go internal/serve/upload_durable_staging_test.go
      - name: Validate focused recovery suite
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/serve
          go test ./internal/database
          go build ./...
      - name: Commit validated recovery fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/serve/upload_durable_activation.go internal/serve/uploads_durable.go internal/serve/uploads_durable_test.go internal/serve/upload_durable_staging_test.go
          git diff --cached --check
          git commit -m 'fix(upload): preserve durable staging through import recovery'
          git push origin HEAD:maintainer/401-upload-staging-recovery
