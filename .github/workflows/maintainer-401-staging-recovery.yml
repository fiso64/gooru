name: Maintainer #401 upload staging recovery

on:
  push:
    branches:
      - maintainer/401-upload-staging-recovery

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/401-upload-staging-recovery
          fetch-depth: 0
      - name: Validate durable upload staging recovery
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/database ./internal/serve
          go build ./...
