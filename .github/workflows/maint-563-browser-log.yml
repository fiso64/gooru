name: Maintainer 563 browser log

on:
  push:
    branches:
      - maint/563-minor-ui-improvements
    paths:
      - .github/workflows/maint-563-browser-log.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/563-minor-ui-improvements
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reuse final patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/maint-563-final.yml').read_text()
          block = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/maint-563-patch.py').write_text(script)
          PY
          python3 /tmp/maint-563-patch.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Run focused browser suite and preserve output
        id: browser
        working-directory: frontend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('playwright.config.ts')
          text = p.read_text().replace('127.0.0.1:4173', '127.0.0.1:43164')
          text = text.replace("npm run preview -- --host 127.0.0.1'", "npm run preview -- --host 127.0.0.1 --port 43164'")
          p.write_text(text)
          PY
          npx playwright install chromium
          set +e
          npm run test:e2e -- grid-keyboard-cursor.spec.ts shortcut-focus.spec.ts tag-input-behavior.spec.ts paged-library.spec.ts font-style.spec.ts 2>&1 | tee ../maint-563-e2e.log
          status=${PIPESTATUS[0]}
          set -e
          exit $status
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maint-563-browser-diagnostics
          path: |
            maint-563-e2e.log
            frontend/test-results
          if-no-files-found: warn
