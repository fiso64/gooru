name: Apply CBZ upload limit fix

on:
  push:
    branches:
      - fix/22-cbz-upload-ingress
    paths:
      - .github/workflows/apply-cbz-upload-limit-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/22-cbz-upload-ingress
      - name: Patch upload-specific request limits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('internal/serve/auth.go')
          text = auth.read_text()
          old = '''func requestSizeMiddleware(limit int64, next http.Handler) http.Handler {
          \treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          \t\tr.Body = http.MaxBytesReader(w, r.Body, limit)
          \t\tnext.ServeHTTP(w, r)
          \t})
          }
          '''
          new = '''func requestSizeMiddleware(limit int64, next http.Handler) http.Handler {
          \treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          \t\t// Uploads have their own per-file limit and stream large bodies to disk.
          \t\t// Applying the generic API-body cap here makes large media impossible
          \t\t// even when uploads.max_file_size_bytes is intentionally left unset.
          \t\tif r.URL.Path != "/api/v1/uploads" {
          \t\t\tr.Body = http.MaxBytesReader(w, r.Body, limit)
          \t\t}
          \t\tnext.ServeHTTP(w, r)
          \t})
          }
          '''
          if old not in text:
              raise SystemExit('requestSizeMiddleware snippet not found')
          auth.write_text(text.replace(old, new))

          uploads = Path('internal/serve/uploads.go')
          text = uploads.read_text()
          old = '''func (s *Server) uploadRequestBodyLimit() int64 {
          \tlimit := s.cfg.Server.MaxRequestBodyBytes
          \tif s.cfg.Uploads.MaxFileSizeBytes > 0 {
          \t\tuploadLimit := s.cfg.Uploads.MaxFileSizeBytes*maxUploadFiles + (1 << 20)
          \t\tif limit <= 0 || uploadLimit < limit {
          \t\t\tlimit = uploadLimit
          \t\t}
          \t}
          \treturn limit
          }
          '''
          new = '''func (s *Server) uploadRequestBodyLimit() int64 {
          \tmaxFileSize := s.cfg.Uploads.MaxFileSizeBytes
          \tif maxFileSize <= 0 {
          \t\treturn 0
          \t}
          \tconst multipartOverhead int64 = 1 << 20
          \tconst safeLimit int64 = 1 << 62
          \tif maxFileSize > (safeLimit-multipartOverhead)/maxUploadFiles {
          \t\treturn safeLimit
          \t}
          \treturn maxFileSize*maxUploadFiles + multipartOverhead
          }
          '''
          if old not in text:
              raise SystemExit('uploadRequestBodyLimit snippet not found')
          uploads.write_text(text.replace(old, new))

          docs = Path('docs/CONFIG.md')
          text = docs.read_text()
          text = text.replace(
              '`server.max_request_body_bytes` | `33554432` (32 MiB) | Maximum HTTP request body size. Must be greater than zero. This is an HTTP-level limit; upload-specific limits can be configured separately.',
              '`server.max_request_body_bytes` | `33554432` (32 MiB) | Maximum request body size for the regular API. Must be greater than zero. Browser/API uploads are governed separately by `uploads.max_file_size_bytes` so large media is not accidentally capped by this generic limit.'
          )
          text = text.replace(
              '`uploads.max_file_size_bytes` | `0` | Optional upload per-file size setting. A zero value leaves the upload-specific limit unset; the request is still bounded by `server.max_request_body_bytes`.',
              '`uploads.max_file_size_bytes` | `0` | Optional upload per-file size setting. A zero value leaves the upload-specific size limit unset; set this explicitly when deployments need a hard upload cap. The generic `server.max_request_body_bytes` limit does not cap `/uploads`.'
          )
          docs.write_text(text)
          PY
          rm .github/workflows/apply-cbz-upload-limit-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/serve/auth.go internal/serve/uploads.go docs/CONFIG.md .github/workflows/apply-cbz-upload-limit-fix.yml
          git commit -m 'fix(uploads): separate media size limits from API bodies'
          git push origin HEAD:fix/22-cbz-upload-ingress
