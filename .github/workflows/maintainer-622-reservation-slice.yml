name: Maintainer 622 reservation slice

on:
  push:
    branches:
      - maintainer/622-logical-upload-session

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/622-logical-upload-session
          fetch-depth: 0
      - name: Apply reservation cardinality slice
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('internal/serve/uploads_durable.go')
          text = path.read_text()
          old = '"net/http"\n\t"os"\n\t"strings"'
          new = '"net/http"\n\t"os"\n\t"strconv"\n\t"strings"'
          assert text.count(old) == 1, 'unexpected imports shape'
          text = text.replace(old, new, 1)
          old = '\tuploadReservationHeader                 = "X-Gooru-Upload-Reserve"\n\tuploadOperationHeader                   = "X-Gooru-Upload-Operation-ID"'
          new = '\tuploadReservationHeader                 = "X-Gooru-Upload-Reserve"\n\tuploadSegmentCountHeader                = "X-Gooru-Upload-Segment-Count"\n\tuploadOperationHeader                   = "X-Gooru-Upload-Operation-ID"'
          assert text.count(old) == 1, 'unexpected upload header constants shape'
          text = text.replace(old, new, 1)
          old = '\tif strings.EqualFold(strings.TrimSpace(r.Header.Get(uploadReservationHeader)), "true") {\n\t\ts.reserveDurableUpload(w, operations)\n\t\treturn\n\t}'
          new = '\tif strings.EqualFold(strings.TrimSpace(r.Header.Get(uploadReservationHeader)), "true") {\n\t\tsegmentCount, err := durableUploadReservationSegmentCount(r)\n\t\tif err != nil {\n\t\t\twriteError(w, http.StatusBadRequest, "invalid_request", err.Error(), nil)\n\t\t\treturn\n\t\t}\n\t\ts.reserveDurableUpload(w, operations, segmentCount)\n\t\treturn\n\t}'
          assert text.count(old) == 1, 'unexpected reservation dispatch shape'
          text = text.replace(old, new, 1)
          old = 'func (s *Server) reserveDurableUpload(w http.ResponseWriter, operations durableUploadOperationStore) {\n\toperation, err := operations.CreateBackgroundOperation(core.BackgroundOperationRequest{Kind: backgroundUploadImportOperationKind, Visible: false, ProgressTotal: 1})'
          new = 'func durableUploadReservationSegmentCount(r *http.Request) (int64, error) {\n\tvalues := r.Header.Values(uploadSegmentCountHeader)\n\tif len(values) == 0 {\n\t\treturn 1, nil\n\t}\n\tif len(values) != 1 {\n\t\treturn 0, errors.New("upload segment count must be one positive integer")\n\t}\n\tvalue := strings.TrimSpace(values[0])\n\tif value == "" {\n\t\treturn 0, errors.New("upload segment count must be a positive integer")\n\t}\n\tsegmentCount, err := strconv.ParseInt(value, 10, 64)\n\tif err != nil || segmentCount <= 0 {\n\t\treturn 0, errors.New("upload segment count must be a positive integer")\n\t}\n\treturn segmentCount, nil\n}\n\nfunc (s *Server) reserveDurableUpload(w http.ResponseWriter, operations durableUploadOperationStore, segmentCount int64) {\n\toperation, err := operations.CreateBackgroundOperation(core.BackgroundOperationRequest{Kind: backgroundUploadImportOperationKind, Visible: false, ProgressTotal: segmentCount})'
          assert text.count(old) == 1, 'unexpected reservation function shape'
          text = text.replace(old, new, 1)
          path.write_text(text)
          test_path = Path('internal/serve/uploads_durable_reservation_test.go')
          assert not test_path.exists(), 'reservation test file already exists'
          test_path.write_text(base64.b64decode('').decode())
          PY
          gofmt -w internal/serve/uploads_durable.go internal/serve/uploads_durable_reservation_test.go
      - name: Test reservation behavior
        run: go test ./internal/serve -run '^TestDurableUploadReservation' -count=1
      - name: Test serve package
        run: go test ./internal/serve -count=1
      - name: Commit validated slice and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fiso64"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git rm .github/workflows/maintainer-622-reservation-slice.yml
          git add internal/serve/uploads_durable.go internal/serve/uploads_durable_reservation_test.go
          git commit -m "feat: reserve logical upload segment capacity"
          git push origin HEAD:maintainer/622-logical-upload-session
