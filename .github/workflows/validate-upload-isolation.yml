name: validate-upload-isolation
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/21-upload-batch-error-isolation
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply focused patch
        run: python3 .github/scripts/apply_upload_isolation.py
      - name: Format
        run: gofmt -w internal/serve/uploads.go internal/serve/uploads_test.go
      - name: Focused upload tests
        run: go test ./internal/serve -run 'Upload' -count=1
      - name: Full Go tests
        run: go test ./...
      - name: Commit validated patch
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/serve/uploads.go internal/serve/uploads_test.go
          git commit -m 'fix(upload): isolate oversized files within batches [patch-applied]'
          git push origin HEAD:fix/21-upload-batch-error-isolation
