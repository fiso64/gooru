name: Validate 248 dropdown

on:
  push:
    branches:
      - fix/248-reusable-dropdown-dismissal

permissions:
  contents: read

jobs:
  browser:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        run: npm run check
      - name: Upload dropdown browser regression
        shell: bash
        run: |
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -n "$browser" ]; then
            export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$browser"
          fi
          npx playwright test tests/upload-drop-control.spec.ts --project=chromium
