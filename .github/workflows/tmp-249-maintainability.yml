name: Temporary 249 maintainability validation

on:
  push:
    branches:
      - feat/249-upload-item-tags
    paths:
      - .github/workflows/tmp-249-maintainability.yml
      - .github/tmp-249-maintainability.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/249-upload-item-tags
      - name: Apply maintainability refactor
        run: python3 .github/tmp-249-maintainability.py
      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w gooru/tagging.go gooru/tagging_known_file_tags.go
          git diff --check
          go test -count=1 ./...
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gooru-maintainer-bot"
          git config user.email "maintainer@localhost"
          git add gooru/tagging.go gooru/tagging_known_file_tags.go
          git commit -m 'refactor: share durable tagging follow-up persistence'
          git push origin HEAD:feat/249-upload-item-tags
