name: Auto-lock fiso64 threads

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    if: github.event.issue.user.login == 'fiso64' || github.event.pull_request.user.login == 'fiso64'
    runs-on: ubuntu-latest
    steps:
      - name: Lock conversation
        env:
          GH_TOKEN: ${{ github.token }}
          THREAD_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: gh api --method PUT "repos/${{ github.repository }}/issues/${THREAD_NUMBER}/lock"
