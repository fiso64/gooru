name: Maintainer 670 legacy startup smoke

on:
  push:
    branches:
      - agent/670-eager-media-metadata

permissions:
  contents: read

jobs:
  legacy-startup-smoke:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/gooru-670-smoke" ./cmd/gooru
      - name: Create initialized historical collision fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/gooru-670-collision.db"
          rm -f "$fixture" "$fixture-wal" "$fixture-shm" "$fixture-journal"

          # Initialize through the real CLI so the fixture contains all normal
          # database identity/configuration state, including hashing strategy.
          printf '2\n' | "$RUNNER_TEMP/gooru-670-smoke" --database "$fixture" init

          # Then reproduce only the historical #670 migration collision: keep
          # schema_migrations at the current clean version, but downgrade the
          # media_metadata projection to its legacy location-keyed shape.
          cat > internal/database/maintainer_670_collision_fixture_test.go <<'EOF'
          package database

          import (
              "database/sql"
              "os"
              "testing"
          )

          func TestMaintainerCreate670CollisionFixture(t *testing.T) {
              path := os.Getenv("GOORU_COLLISION_DB")
              if path == "" {
                  t.Fatal("GOORU_COLLISION_DB is required")
              }
              db, err := sql.Open("sqlite3", path)
              if err != nil {
                  t.Fatal(err)
              }
              defer db.Close()

              version, dirty, err := currentMigrationVersion(db)
              if err != nil {
                  t.Fatal(err)
              }
              if version != historicalMediaMetadataCollisionMaxVersion || dirty {
                  t.Fatalf("fresh initialized migration state = (%d, %t), want (%d, false)", version, dirty, historicalMediaMetadataCollisionMaxVersion)
              }

              if _, err := db.Exec(`INSERT INTO contents (hash) VALUES ('legacy-startup')`); err != nil {
                  t.Fatal(err)
              }
              if _, err := db.Exec(`
                  INSERT INTO locations (public_id, content_hash, path, size_bytes, mod_time, extension)
                  VALUES ('legacy_startup', 'legacy-startup', '/library/legacy-startup.jpg', 10, 100, '.jpg')
              `); err != nil {
                  t.Fatal(err)
              }
              if _, err := db.Exec(`
                  INSERT INTO media_metadata (content_hash, media_kind, mime_type, image_width, updated_at)
                  VALUES ('legacy-startup', 'photo', 'image/jpeg', 640, '2026-09-01 12:00:00')
              `); err != nil {
                  t.Fatal(err)
              }

              downSQL, err := migrationsFS.ReadFile("migrations/038_media_metadata_content_identity.down.sql")
              if err != nil {
                  t.Fatal(err)
              }
              if _, err := db.Exec(string(downSQL)); err != nil {
                  t.Fatalf("recreate legacy location-keyed media metadata: %v", err)
              }

              columns, err := tableColumnNames(db, "media_metadata")
              if err != nil {
                  t.Fatal(err)
              }
              if !columns["location_id"] || columns["content_hash"] {
                  t.Fatalf("historical collision columns = %#v", columns)
              }
              version, dirty, err = currentMigrationVersion(db)
              if err != nil {
                  t.Fatal(err)
              }
              if version != historicalMediaMetadataCollisionMaxVersion || dirty {
                  t.Fatalf("collision ledger = (%d, %t), want (%d, false)", version, dirty, historicalMediaMetadataCollisionMaxVersion)
              }
          }
          EOF
          GOORU_COLLISION_DB="$fixture" go test -count=1 ./internal/database -run '^TestMaintainerCreate670CollisionFixture$'
          rm internal/database/maintainer_670_collision_fixture_test.go
          echo "GOORU_COLLISION_DB=$fixture" >> "$GITHUB_ENV"
      - name: Start server against collided database
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gooru-670-smoke.log"
          "$RUNNER_TEMP/gooru-670-smoke" --database "$GOORU_COLLISION_DB" serve --listen 127.0.0.1:45670 >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          healthy=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:45670/api/v1/health | grep -q '"status":"ok"'; then
              healthy=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo 'server failed startup smoke:' >&2
            cat "$log" >&2
            exit 1
          fi
          if grep -q 'no such column: mm.content_hash' "$log"; then
            echo 'legacy migration collision error still present:' >&2
            cat "$log" >&2
            exit 1
          fi
          echo 'legacy collided database repaired and server health endpoint reached'
