name: Maintainer 670 legacy startup smoke

on:
  push:
    branches:
      - agent/670-eager-media-metadata

permissions:
  contents: read

jobs:
  legacy-startup-smoke:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create historical collided database fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/gooru-670-collision.db"
          rm -f "$fixture" "$fixture-wal" "$fixture-shm" "$fixture-journal"
          cat > internal/database/maintainer_670_collision_fixture_test.go <<'EOF'
          package database

          import (
              "database/sql"
              "os"
              "testing"
          )

          func TestMaintainerCreate670CollisionFixture(t *testing.T) {
              path := os.Getenv("GOORU_COLLISION_DB")
              if path == "" {
                  t.Fatal("GOORU_COLLISION_DB is required")
              }
              db, err := sql.Open("sqlite3", path)
              if err != nil {
                  t.Fatal(err)
              }
              defer db.Close()

              migrations, err := loadEmbeddedMigrations()
              if err != nil {
                  t.Fatal(err)
              }
              if err := ensureMigrationTable(db); err != nil {
                  t.Fatal(err)
              }
              var migration39 embeddedMigration
              for _, migration := range migrations {
                  if migration.version < historicalMediaMetadataCollisionVersion {
                      if err := applyMigration(db, migration); err != nil {
                          t.Fatalf("apply migration %d: %v", migration.version, err)
                      }
                      continue
                  }
                  if migration.version == 39 {
                      migration39 = migration
                  }
              }
              if migration39.version == 0 {
                  t.Fatal("migration 39 not found")
              }

              if _, err := db.Exec(`INSERT INTO contents (hash) VALUES ('legacy-startup')`); err != nil {
                  t.Fatal(err)
              }
              res, err := db.Exec(`
                  INSERT INTO locations (public_id, content_hash, path, size_bytes, mod_time, extension)
                  VALUES ('legacy_startup', 'legacy-startup', '/library/legacy-startup.jpg', 10, 100, '.jpg')
              `)
              if err != nil {
                  t.Fatal(err)
              }
              locationID, err := res.LastInsertId()
              if err != nil {
                  t.Fatal(err)
              }
              if _, err := db.Exec(`
                  INSERT INTO media_metadata (location_id, media_kind, mime_type, image_width, updated_at)
                  VALUES (?, 'photo', 'image/jpeg', 640, '2026-09-01 12:00:00')
              `, locationID); err != nil {
                  t.Fatal(err)
              }
              if err := setMigrationVersion(db, historicalMediaMetadataCollisionVersion, false); err != nil {
                  t.Fatal(err)
              }
              if err := applyMigration(db, migration39); err != nil {
                  t.Fatal(err)
              }
          }
          EOF
          GOORU_COLLISION_DB="$fixture" go test -count=1 ./internal/database -run '^TestMaintainerCreate670CollisionFixture$'
          rm internal/database/maintainer_670_collision_fixture_test.go
          echo "GOORU_COLLISION_DB=$fixture" >> "$GITHUB_ENV"
      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/gooru-670-smoke" ./cmd/gooru
      - name: Start server against collided database
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gooru-670-smoke.log"
          "$RUNNER_TEMP/gooru-670-smoke" --database "$GOORU_COLLISION_DB" serve --listen 127.0.0.1:45670 >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          healthy=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:45670/api/v1/health | grep -q '"status":"ok"'; then
              healthy=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo 'server failed startup smoke:' >&2
            cat "$log" >&2
            exit 1
          fi
          if grep -q 'no such column: mm.content_hash' "$log"; then
            echo 'legacy migration collision error still present:' >&2
            cat "$log" >&2
            exit 1
          fi
          echo 'legacy collided database repaired and server health endpoint reached'
