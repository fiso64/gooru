name: autonomous-394-final-validation

on:
  push:
    branches:
      - 'feat/394-preview-options'

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go formatting
        run: |
          test -z "$(gofmt -l internal/serve/preview_options_test.go internal/serve/preview_quality_test.go)"
      - name: Go validation
        run: |
          go test ./...
          go build ./...
      - name: Frontend validation
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run check
          npm run test:unit
          npx playwright install chromium
          npm run test:e2e -- viewer-full-media-default.spec.ts
          npm run build
      - name: Remove temporary validation workflow
        run: |
          rm .github/workflows/autonomous-394-final-validation.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove preview validation workflow [394-final-validation]'
          git push origin HEAD:feat/394-preview-options
