name: temporary maintainer validation
on:
  push:
    branches:
      - refactor/28-source-metadata
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Focused metadata tests
        run: go test ./internal/serve -run 'Test(Image|Video)Metadata'
      - name: Full Go tests
        run: go test ./...
      - name: Build
        run: go build ./...
