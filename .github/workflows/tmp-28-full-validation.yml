name: Temporary encryption validation

on:
  push:
    branches:
      - feat/28-encryption-key-file-config

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/28-encryption-key-file-config
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run all Go tests
        run: go test ./...
      - name: Build all Go packages
        run: go build ./...
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-28-full-validation.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-28-full-validation.yml
          git commit -m "ci: remove temporary encryption validation"
          git push origin HEAD:feat/28-encryption-key-file-config
