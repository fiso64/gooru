name: temp validate 113
on:
  push:
    branches:
      - feat/113-common-tags-sidebar
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go build
        run: go build ./...
      - name: Go tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Common tags browser coverage
        working-directory: frontend
        run: npx playwright test common-tags-sidebar.spec.ts --project=chromium
