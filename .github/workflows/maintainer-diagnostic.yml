name: Maintainer diagnostic

on:
  push:
    branches:
      - maintainer/554-metadata-source-capability

permissions:
  contents: write

jobs:
  compile:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/554-metadata-source-capability
      - name: Apply path capability fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/serve/browse.go')
          text = path.read_text()
          old = '''\t\t} else if s.meta != nil {\n\t\t\tif metadata, err := s.meta.Metadata(ctx, file, mediaType, mediaKind); err == nil {\n\t\t\t\tdto.Metadata = metadata\n\t\t\t}\n\t\t}\n'''
          new = '''\t\t} else if s.meta != nil {\n\t\t\tif pathProvider, ok := s.meta.(MediaMetadataPathProvider); ok {\n\t\t\t\tif metadata, err := pathProvider.Metadata(ctx, file, mediaType, mediaKind); err == nil {\n\t\t\t\t\tdto.Metadata = metadata\n\t\t\t\t}\n\t\t\t}\n\t\t}\n'''
          if old not in text:
              raise SystemExit('expected browse metadata block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/serve/browse.go
      - name: Validate affected packages
        run: go test ./internal/serve ./cmd/gooru ./cmd/gooru/cmd
      - name: Commit validated fix and remove diagnostic workflow
        run: |
          git rm .github/workflows/maintainer-diagnostic.yml
          git add internal/serve/browse.go
          git config user.name 'fiso64'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git commit -m 'fix: use optional path metadata capability in browse fallback'
          git push origin HEAD:maintainer/554-metadata-source-capability
