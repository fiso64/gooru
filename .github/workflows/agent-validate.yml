name: Agent validation

on:
  push:
    branches:
      - docs/serve-config-reference

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go build
        run: go build ./...
      - name: Go tests
        run: go test ./...
