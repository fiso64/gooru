name: Temporary 333 upload contention profile
on:
  push:
    branches: [perf/333-upload-contention-profile]
    paths:
      - '.github/workflows/tmp-333-upload-contention-profile.yml'
      - 'internal/query/**'
jobs:
  profile:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Full tests and build
        run: go test ./... && go build ./...
      - name: Profile browse latency under real async uploads
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP:-/tmp}/gooru-333-upload-${GITHUB_RUN_ID}"
          rm -rf "$ROOT"; mkdir -p "$ROOT/uploads" "$ROOT/source"
          DB="$ROOT/library.db"
          printf '1\n' | go run ./cmd/gooru --database "$DB" init >/dev/null
          python3 - "$DB" <<'PY'
          import sqlite3, sys
          db=sys.argv[1]
          c=sqlite3.connect(db)
          c.execute('PRAGMA foreign_keys=ON'); c.execute('PRAGMA synchronous=OFF'); c.execute('PRAGMA journal_mode=MEMORY')
          triggers=c.execute("SELECT name,sql FROM sqlite_master WHERE type='trigger' AND sql IS NOT NULL").fetchall()
          for name,_ in triggers: c.execute('DROP TRIGGER IF EXISTS "'+name.replace('"','""')+'"')
          c.execute('BEGIN IMMEDIATE')
          c.execute("INSERT INTO tags(key,value) VALUES ('hidden','')")
          hidden=c.execute("SELECT id FROM tags WHERE key='hidden' AND value='' ").fetchone()[0]
          for i in range(39): c.execute("INSERT INTO tags(key,value) VALUES (?,?)",('filler',f'v{i:02d}'))
          rows=[(f'{i+1:064x}',) for i in range(10000)]
          c.executemany('INSERT INTO contents(hash) VALUES (?)',rows)
          cols=[r[1] for r in c.execute('PRAGMA table_info(locations)')]
          if 'public_id' in cols:
              c.executemany("INSERT INTO locations(content_hash,path,size_bytes,mod_time,extension,tags_cache,public_id) VALUES (?,?,?,?,?,?,?)",[(h,f'/fixture/{i:05d}.png',1,1788696000,'.png','hidden',f'bench_{i:032x}') for i,(h,) in enumerate(rows)])
          else:
              c.executemany("INSERT INTO locations(content_hash,path,size_bytes,mod_time,extension,tags_cache) VALUES (?,?,?,?,?,?)",[(h,f'/fixture/{i:05d}.png',1,1788696000,'.png','hidden') for i,(h,) in enumerate(rows)])
          c.executemany('INSERT INTO content_tags(content_hash,tag_id) VALUES (?,?)',[(h,hidden) for (h,) in rows])
          c.execute('UPDATE tags SET files_count=10000 WHERE id=?',(hidden,))
          for table,stmt,args in [
              ('tag_key_counts',"INSERT INTO tag_key_counts(key,files_count) VALUES ('hidden',10000)",()),
              ('kind_counts',"INSERT INTO kind_counts(kind,files_count) VALUES ('photo',10000)",()),
              ('tag_kind_counts',"INSERT INTO tag_kind_counts(tag_id,kind,files_count) VALUES (?,'photo',10000)",(hidden,)),
              ('tag_key_kind_counts',"INSERT INTO tag_key_kind_counts(key,kind,files_count) VALUES ('hidden','photo',10000)",()),
          ]:
              if c.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name=?",(table,)).fetchone(): c.execute(stmt,args)
          c.commit()
          for _,sql in triggers: c.execute(sql)
          c.commit(); c.close()
          PY
          PORT=$((22000 + GITHUB_RUN_ID % 10000))
          cat > "$ROOT/serve.yaml" <<YAML
          server:
            listen: 127.0.0.1:${PORT}
          database:
            path: ${DB}
          auth:
            enabled: false
          uploads:
            enabled: true
            targets:
              - id: default
                name: Default
                path: ${ROOT}/uploads
            max_file_size_bytes: 1048576
          jobs:
            max_running: 2
            max_queued: 32
          logging:
            level: warn
          YAML
          go run ./cmd/gooru --config "$ROOT/serve.yaml" serve >"$ROOT/server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          python3 - "$PORT" "$ROOT" <<'PY'
          import concurrent.futures, json, pathlib, statistics, sys, time, urllib.request
          port=int(sys.argv[1]); root=pathlib.Path(sys.argv[2]); base=f'http://127.0.0.1:{port}'
          for _ in range(200):
              try:
                  urllib.request.urlopen(base+'/api/v1/health',timeout=1).read(); break
              except Exception: time.sleep(.05)
          else: raise SystemExit('server readiness timeout')
          payload=(b'gooru-upload-profile-'*16384)[:262144]
          files=[]
          for i in range(500):
              p=root/'source'/f'upload-{i:04d}.txt'; p.write_bytes(payload+str(i).encode()); files.append(p)
          def multipart(paths,boundary):
              out=bytearray()
              for p in paths:
                  out += f'--{boundary}\r\nContent-Disposition: form-data; name="files"; filename="{p.name}"\r\nContent-Type: text/plain\r\n\r\n'.encode()
                  out += p.read_bytes()+b'\r\n'
              out += f'--{boundary}--\r\n'.encode(); return bytes(out)
          batches=[files[i:i+50] for i in range(0,len(files),50)]
          def upload(idx,paths):
              boundary=f'gooru333{idx}'; body=multipart(paths,boundary)
              req=urllib.request.Request(base+'/api/v1/uploads',data=body,method='POST',headers={'Content-Type':f'multipart/form-data; boundary={boundary}','Prefer':'respond-async'})
              t=time.perf_counter()
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return {'status':r.status,'ms':(time.perf_counter()-t)*1000}
              except Exception as e: return {'status':'error','ms':(time.perf_counter()-t)*1000,'body':str(e)}
          paths={
              'tags':'/api/v1/tags?counts=true',
              'root':'/api/v1/files?include_facets=true&limit=60',
              'hidden_no_facets':'/api/v1/files?query=hidden&limit=60',
              'hidden':'/api/v1/files?query=hidden&include_facets=true&limit=60',
          }
          samples={k:[] for k in paths}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              futs=[ex.submit(upload,i,b) for i,b in enumerate(batches)]
              stop=time.monotonic()+12
              while time.monotonic()<stop:
                  for name,path in paths.items():
                      t=time.perf_counter()
                      try:
                          urllib.request.urlopen(base+path,timeout=5).read(); samples[name].append((time.perf_counter()-t)*1000)
                      except Exception: samples[name].append(5000.0)
                  time.sleep(.03)
              upload_results=[f.result() for f in futs]
          def stats(xs):
              ys=sorted(xs); n=len(ys)
              return {'n':n,'p50_ms':statistics.median(ys),'p95_ms':ys[min(n-1,int(n*.95))],'max_ms':max(ys)}
          result={'requests':{k:stats(v) for k,v in samples.items()},'uploads':upload_results}
          print('GOORU_UPLOAD_CONTENTION_RESULT='+json.dumps(result,sort_keys=True))
          (root/'profile.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          bad=[u for u in upload_results if u['status'] != 202]
          if bad: raise SystemExit('upload requests failed: '+json.dumps(bad[:3]))
          if result['requests']['hidden']['p95_ms'] > 12:
              raise SystemExit('key-wide filtered browse remains too slow under upload contention: '+json.dumps(result['requests']['hidden']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upload-contention-profile
          path: ${{ runner.temp }}/gooru-333-upload-${{ github.run_id }}/profile.json
          if-no-files-found: warn