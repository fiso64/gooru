name: validate cbz kind
on:
  push:
    branches: [feat/22-cbz-kind]

# Temporary branch-local validation; remove before merge.
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check
        id: check
        continue-on-error: true
        shell: bash
        run: set -o pipefail; npm run check 2>&1 | tee ../check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbz-check-log-2
          path: check.log
      - if: ${{ steps.check.outcome == 'failure' }}
        run: exit 1
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/shell.spec.ts --project=chromium
