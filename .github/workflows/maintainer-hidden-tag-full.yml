name: Maintainer hidden-tag full validation

on:
  push:
    branches:
      - perf/333-hidden-tag-facets-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Full Go validation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 420s go test ./... > /tmp/full-test.log 2>&1
          test_status=$?
          timeout 180s go build ./... > /tmp/full-build.log 2>&1
          build_status=$?
          set -e
          git config user.name "Gooru autonomous maintainer"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/maintainer-hidden-tag-full.yml
          if [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            { echo '=== go test ./... ==='; cat /tmp/full-test.log; echo '=== go build ./... ==='; cat /tmp/full-build.log; } > .maintainer-hidden-tag-full.log
            git add -A
            git commit -m "ci: capture hidden-tag full validation failure"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit 1
          fi
          git add -A
          git commit -m "ci: remove temporary hidden-tag full validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
