name: Apply maintainer 636 patch
on:
  push:
    branches: [maintainer/636-literal-relink-scope]
permissions:
  contents: write
jobs:
  apply:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 temp/maintainer_636.py
          gofmt -w internal/database/database.go gooru/sync_test.go
          go test ./...
          git config user.name autonomous-maintainer
          git config user.email actions@users.noreply.github.com
          git add internal/database/database.go gooru/sync_test.go
          git rm temp/maintainer_636.py .github/workflows/maintainer-636-apply.yml
          git commit -m 'Treat relink directory scope literally (#636)'
          git push origin HEAD:maintainer/636-literal-relink-scope
