name: Temporary #416 frontend validation

on:
  push:
    branches:
      - feat/416-bound-actual-size

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/416-bound-actual-size
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply reviewed implementation
        shell: bash
        run: |
          git show fc49899ce24d9ff3ff19ae0ca332eb402215941b:.github/workflows/tmp-416-implement.yml > /tmp/old-416.yml
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          text = Path('/tmp/old-416.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          Path('/tmp/implement-416.py').write_text(textwrap.dedent(text[start:end]))
          PY
          python3 /tmp/implement-416.py
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/components/ViewerStage.svelte')
          text = p.read_text()
          old = "  const minimumZoom = $derived(fitMode === 'actual' && !boundActualSizeToFit ? Math.min(1, fitGeometry.scale) : 1);\n  const panLimits"
          new = "  const minimumZoom = $derived(fitMode === 'actual' && !boundActualSizeToFit ? Math.min(1, fitGeometry.scale) : 1);\n  const maximumZoom = $derived(fitMode === 'actual' && boundActualSizeToFit && geometry.scale > 0 ? Math.max(32, 32 / geometry.scale) : 32);\n  const panLimits"
          if old not in text: raise SystemExit('missing zoom insertion anchor')
          text = text.replace(old, new, 1)
          old = "Math.max(minimumZoom, Math.min(32, zoom * Math.exp(-event.deltaY * 0.0075)))"
          new = "Math.max(minimumZoom, Math.min(maximumZoom, zoom * Math.exp(-event.deltaY * 0.0075)))"
          if old not in text: raise SystemExit('missing wheel clamp anchor')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build
