name: tmp encrypted upload persistence
on:
  push:
    branches: [feat/28-encrypted-upload-persistence]
permissions:
  contents: write
jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/28-encrypted-upload-persistence
          fetch-depth: 0
      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace('internal/serve/browse.go',
              'type GooruLibrary struct {\n\tclient   *core.Client\n\tverbose  bool\n\tmetadata MediaMetadataProvider\n}',
              'type GooruLibrary struct {\n\tclient     *core.Client\n\tverbose    bool\n\tmetadata   MediaMetadataProvider\n\tencryption EncryptionConfig\n}')

          replace('internal/serve/server.go',
              'if gooruLibrary, ok := library.(*GooruLibrary); ok {\n\t\tgooruLibrary.metadata = metadata\n\t}',
              'if gooruLibrary, ok := library.(*GooruLibrary); ok {\n\t\tgooruLibrary.metadata = metadata\n\t\tgooruLibrary.encryption = cfg.Encryption\n\t}')

          replace('internal/serve/uploads.go',
              'size, copyErr := copyUpload(dst, src, s.cfg.Uploads.MaxFileSizeBytes)',
              'size, copyErr := s.persistUploadedFile(dst, src)')
          replace('internal/serve/uploads.go',
              'analysisSource, analysisSize, analysisModTime, err := openUploadAnalysisSource(analysisPath)',
              'analysisSource, analysisSize, analysisModTime, err := l.openUploadAnalysisSource(analysisPath)')
          replace('internal/serve/uploads.go',
              'metadata, err := importedMediaMetadata(ctx, provider, file, analysisPaths[file.Path], mediaType, mediaKind)',
              'metadata, err := l.importedMediaMetadata(ctx, provider, file, analysisPaths[file.Path], mediaType, mediaKind)')

          Path('internal/serve/upload_analysis_source.go').write_text(r'''package serve

import (
    "context"
    "fmt"
    "io"
    "os"

    "gooru.local/internal/encryptedfile"
    "gooru.local/types"
)

type uploadAnalysisSource interface {
    io.ReaderAt
    io.Closer
}

func (l *GooruLibrary) openUploadAnalysisSource(path string) (uploadAnalysisSource, int64, int64, error) {
    if l.encryption.Enabled {
        file, err := encryptedfile.Open(path, l.encryption.Key)
        if err != nil {
            return nil, 0, 0, err
        }
        return file, file.Size(), file.ModTime().Unix(), nil
    }
    file, err := os.Open(path)
    if err != nil {
        return nil, 0, 0, err
    }
    info, err := file.Stat()
    if err != nil {
        _ = file.Close()
        return nil, 0, 0, err
    }
    if info.IsDir() {
        _ = file.Close()
        return nil, 0, 0, fmt.Errorf("upload analysis source is a directory")
    }
    return file, info.Size(), info.ModTime().Unix(), nil
}

func (l *GooruLibrary) importedMediaMetadata(ctx context.Context, provider MediaMetadataProvider, file types.FileInfo, analysisPath string, mediaType string, mediaKind string) (MediaMetadata, error) {
    if sourceProvider, ok := provider.(MediaMetadataSourceProvider); ok && analysisPath != "" {
        source, size, _, err := l.openUploadAnalysisSource(analysisPath)
        if err != nil {
            return MediaMetadata{}, err
        }
        defer source.Close()
        return sourceProvider.MetadataFromSource(ctx, file, source, size, mediaType, mediaKind)
    }
    analysisFile := file
    if analysisPath != "" {
        analysisFile.Path = analysisPath
    }
    return provider.Metadata(ctx, analysisFile, mediaType, mediaKind)
}
''')

          Path('internal/serve/upload_encryption.go').write_text(r'''package serve

import (
    "io"
    "os"

    "gooru.local/internal/encryptedfile"
)

func (s *Server) persistUploadedFile(dst *os.File, src io.Reader) (int64, error) {
    if !s.cfg.Encryption.Enabled {
        return copyUpload(dst, src, s.cfg.Uploads.MaxFileSizeBytes)
    }
    if s.cfg.Uploads.MaxFileSizeBytes <= 0 {
        return encryptedfile.EncryptStream(dst, src, s.cfg.Encryption.Key)
    }
    limited := &io.LimitedReader{R: src, N: s.cfg.Uploads.MaxFileSizeBytes + 1}
    size, err := encryptedfile.EncryptStream(dst, limited, s.cfg.Encryption.Key)
    if err != nil {
        return size, err
    }
    if size > s.cfg.Uploads.MaxFileSizeBytes {
        return size, errUploadTooLarge
    }
    return size, nil
}
''')

          Path('internal/serve/upload_encryption_e2e_test.go').write_text(r'''package serve

import (
    "bytes"
    "image/color"
    "io"
    "net/http"
    "net/http/httptest"
    "os"
    "path/filepath"
    "testing"

    core "gooru.local/gooru"
    "gooru.local/internal/encryptedfile"
    "gooru.local/internal/securekey"
    "gooru.local/types"
)

func TestEncryptedUploadImportAndContentGoldenPath(t *testing.T) {
    dir := t.TempDir()
    dbPath := filepath.Join(dir, "gooru.db")
    if err := core.Init(dbPath, types.StrategyFull, false); err != nil {
        t.Fatalf("init db: %v", err)
    }
    client, err := core.New(dbPath, false)
    if err != nil {
        t.Fatalf("open client: %v", err)
    }
    defer client.Close()

    uploadDir := filepath.Join(dir, "uploads")
    cfg := DefaultConfig(filepath.Join(dir, "serve.db"))
    cfg.Auth.Enabled = false
    cfg.Encryption.Enabled = true
    cfg.Encryption.Key = bytes.Repeat([]byte{0x5a}, securekey.Size)
    cfg.Uploads.Enabled = true
    cfg.Uploads.Targets = []UploadTarget{{ID: "default", Name: "Default", Path: uploadDir}}
    server := NewServerWithLibrary(cfg, NewGooruLibrary(client, false))

    plaintext := tinyPNG(t, 7, 5, color.RGBA{R: 31, G: 101, B: 211, A: 255})
    rec := httptest.NewRecorder()
    server.Handler().ServeHTTP(rec, uploadBinaryRequest(t, map[string][]byte{"secret.png": plaintext}, []string{"private"}))
    if rec.Code != http.StatusOK {
        t.Fatalf("upload status = %d: %s", rec.Code, rec.Body.String())
    }

    storedPath := filepath.Join(uploadDir, "secret.png")
    stored, err := os.ReadFile(storedPath)
    if err != nil {
        t.Fatalf("read stored upload: %v", err)
    }
    if bytes.Equal(stored, plaintext) || bytes.Contains(stored, plaintext) {
        t.Fatal("encrypted upload persisted plaintext bytes")
    }

    opened, err := encryptedfile.Open(storedPath, cfg.Encryption.Key)
    if err != nil {
        t.Fatalf("open encrypted upload: %v", err)
    }
    decrypted, err := io.ReadAll(opened)
    if closeErr := opened.Close(); err == nil && closeErr != nil {
        err = closeErr
    }
    if err != nil {
        t.Fatalf("read encrypted upload: %v", err)
    }
    if !bytes.Equal(decrypted, plaintext) {
        t.Fatal("decrypted upload differs from request body")
    }

    file, err := client.GetFileInfoByPath(storedPath)
    if err != nil {
        t.Fatalf("uploaded image was not imported: %v", err)
    }
    if file.Size != int64(len(plaintext)) {
        t.Fatalf("registered plaintext size = %d, want %d", file.Size, len(plaintext))
    }
    metadata, err := client.GetMediaMetadata(file.ID)
    if err != nil {
        t.Fatalf("uploaded image metadata: %v", err)
    }
    if metadata.ImageWidth == nil || *metadata.ImageWidth != 7 || metadata.ImageHeight == nil || *metadata.ImageHeight != 5 {
        t.Fatalf("uploaded image metadata = %+v", metadata)
    }

    content := httptest.NewRecorder()
    server.Handler().ServeHTTP(content, httptest.NewRequest(http.MethodGet, "/api/v1/files/"+file.PublicID+"/content", nil))
    if content.Code != http.StatusOK {
        t.Fatalf("content status = %d: %s", content.Code, content.Body.String())
    }
    if !bytes.Equal(content.Body.Bytes(), plaintext) {
        t.Fatal("served encrypted upload differs from original plaintext")
    }
}

func TestEncryptedUploadHonorsPlaintextSizeLimit(t *testing.T) {
    cfg := DefaultConfig(filepath.Join(t.TempDir(), "gooru.db"))
    cfg.Encryption.Enabled = true
    cfg.Encryption.Key = bytes.Repeat([]byte{0x2c}, securekey.Size)
    cfg.Uploads.MaxFileSizeBytes = 4
    server := NewServer(cfg)

    dst, err := os.CreateTemp(t.TempDir(), "encrypted-upload-*")
    if err != nil {
        t.Fatal(err)
    }
    defer dst.Close()
    if _, err := server.persistUploadedFile(dst, bytes.NewReader([]byte("12345"))); err != errUploadTooLarge {
        t.Fatalf("persist oversized encrypted upload error = %v, want %v", err, errUploadTooLarge)
    }
}
''')
          PY
          gofmt -w internal/serve/browse.go internal/serve/server.go internal/serve/uploads.go internal/serve/upload_analysis_source.go internal/serve/upload_encryption.go internal/serve/upload_encryption_e2e_test.go
      - name: Validate
        run: |
          go test ./internal/encryptedfile ./internal/serve
          go test ./...
          go build ./...
      - name: Commit validated change
        shell: bash
        run: |
          rm .github/workflows/tmp-encrypted-upload-persistence.yml
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/serve .github/workflows/tmp-encrypted-upload-persistence.yml
