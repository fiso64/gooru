name: Validate encrypted upload persistence

on:
  push:
    branches:
      - "feat/28-encrypted-upload-persistence"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/28-encrypted-upload-persistence"
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 .github/tmp-encrypted-upload-patch.py
          gofmt -w internal/serve/browse.go internal/serve/server.go internal/serve/uploads.go internal/serve/upload_analysis_source.go internal/serve/upload_encryption.go internal/serve/upload_encryption_e2e_test.go
      - name: Test
        run: |
          go test ./internal/encryptedfile ./internal/serve
          go test ./...
          go build ./...
      - name: Commit
        run: |
          rm .github/tmp-encrypted-upload-patch.py .github/workflows/tmp-encrypted-upload-persistence.yml
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(encryption): persist uploads encrypted at rest"
          git push origin HEAD:feat/28-encrypted-upload-persistence
