name: maintainer 401 route switch

on:
  push:
    branches:
      - maintainer/401-durable-upload-http-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch production upload route and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/serve/server.go')
          s = p.read_text()
          old = 'mux.Handle("/api/v1/uploads", s.adminProtected(http.HandlerFunc(s.handleUpload)))'
          new = 'mux.Handle("/api/v1/uploads", s.adminProtected(http.HandlerFunc(s.handleUploadEndpoint)))'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy upload route, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/maintainer-401-route-switch.yml
          gofmt -w internal/serve/server.go
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/serve/server.go
          git commit -m 'feat(upload): route HTTP uploads through durable admission'
          git push origin HEAD:maintainer/401-durable-upload-http-v2
