name: Maintainer issue 656 patch

on:
  push:
    branches:
      - maintainer/issue-656-untrack-external-delete

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/issue-656-untrack-external-delete
      - name: Apply issue 656 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} copies, found {actual}: {old[:100]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # Durable batch: mixed confirmation stages/deletes managed files and only untracks external ones.
          path = 'internal/serve/background_file_removals.go'
          replace(path,
              'stagingToken := ""\n\tif mode == "delete" {',
              'stagingToken := ""\n\tphysicalDelete := mode == "delete" || mode == "delete_or_untrack"\n\tif physicalDelete {')
          replace(path,
              '\t\tif mode == "delete" {\n\t\t\tmanagedPath, ok := s.managedDeleteCandidatePath(fileStoragePath(file))\n\t\t\tif !ok {\n\t\t\t\treturn core.BackgroundTaskRequest{}, ErrFileNotManaged\n\t\t\t}\n\t\t\titem.OriginalPath = managedPath\n\t\t\titem.StagingPath = filepath.Join(\n\t\t\t\tfilepath.Dir(managedPath),\n\t\t\t\tfmt.Sprintf(".gooru-delete-%s-%06d", stagingToken, index),\n\t\t\t)\n\t\t}',
              '\t\tif physicalDelete {\n\t\t\tmanagedPath, ok := s.managedDeleteCandidatePath(fileStoragePath(file))\n\t\t\tif !ok && mode == "delete" {\n\t\t\t\treturn core.BackgroundTaskRequest{}, ErrFileNotManaged\n\t\t\t}\n\t\t\tif ok {\n\t\t\t\titem.OriginalPath = managedPath\n\t\t\t\titem.StagingPath = filepath.Join(\n\t\t\t\t\tfilepath.Dir(managedPath),\n\t\t\t\t\tfmt.Sprintf(".gooru-delete-%s-%06d", stagingToken, index),\n\t\t\t\t)\n\t\t\t}\n\t\t}')
          replace(path,
              'if mode != "delete" && mode != "untrack" {',
              'if mode != "delete" && mode != "untrack" && mode != "delete_or_untrack" {')
          replace(path,
              '\tcase "delete":\n\t\treturn s.resumeManagedFileDeletionBatch(ctx, input.Files, publicIDs)\n\tdefault:',
              '\tcase "delete":\n\t\treturn s.resumeManagedFileDeletionBatch(ctx, input.Files, publicIDs)\n\tcase "delete_or_untrack":\n\t\tmanagedFiles := make([]backgroundFileRemovalBatchFile, 0, len(input.Files))\n\t\tfor _, file := range input.Files {\n\t\t\tif file.OriginalPath == "" && file.StagingPath == "" {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif file.OriginalPath == "" || file.StagingPath == "" {\n\t\t\t\treturn errors.New("mixed file removal batch has incomplete managed deletion paths")\n\t\t\t}\n\t\t\tmanagedFiles = append(managedFiles, file)\n\t\t}\n\t\treturn s.resumeManagedFileDeletionBatch(ctx, managedFiles, publicIDs)\n\tdefault:')

          # Admission/API: strict delete still rejects mixed selections; confirmed mixed mode is one durable operation.
          path = 'internal/serve/file_removals.go'
          replace(path,
              'if request.Mode == "delete" {\n\t\ttask, err = backgroundFileRemovalApplyDeleteRetryPolicy(task)',
              'if request.Mode == "delete" || request.Mode == "delete_or_untrack" {\n\t\ttask, err = backgroundFileRemovalApplyDeleteRetryPolicy(task)')
          replace(path,
              'if request.Mode != "untrack" && request.Mode != "delete" {\n\t\treturn errors.New("mode must be untrack or delete")\n\t}',
              'if request.Mode != "untrack" && request.Mode != "delete" && request.Mode != "delete_or_untrack" {\n\t\treturn errors.New("mode must be untrack, delete, or delete_or_untrack")\n\t}')

          # API contract: expose mixed mode only on the bulk selector endpoint.
          path = 'docs/openapi.yaml'
          p = Path(path)
          text = p.read_text()
          text = text.replace(
              'summary: Untrack or physically delete a selected set of files.\n      description: Accepts the same explicit-ID or query-with-exclusions selector used by bulk UI actions. Physical deletion is accepted only when every selected file is inside configured upload targets.',
              'summary: Untrack or physically delete a selected set of files.\n      description: Accepts the same explicit-ID or query-with-exclusions selector used by bulk UI actions. Strict physical deletion is accepted only when every selected file is inside configured upload targets. After explicit confirmation, delete_or_untrack deletes managed files while only untracking files outside configured upload targets.'
          )
          marker = '    FileRemovalRequest:'
          before, sep, after = text.partition(marker)
          if not sep:
              raise SystemExit('FileRemovalRequest schema marker not found')
          old = 'enum: [untrack, delete]'
          if old not in after:
              raise SystemExit('FileRemovalRequest mode enum not found')
          after = after.replace(old, 'enum: [untrack, delete, delete_or_untrack]', 1)
          p.write_text(before + sep + after)

          # UI: transform the 409 into a second confirmation; never issue split durable requests.
          path = 'frontend/src/lib/components/AuthenticatedApp.svelte'
          replace(path,
              "'bulk-untrack-selected' | 'bulk-delete-selected' | 'untrack-file' | 'delete-file';",
              "'bulk-untrack-selected' | 'bulk-delete-selected' | 'bulk-delete-or-untrack-selected' | 'untrack-file' | 'delete-file' | 'untrack-external-file';")
          replace(path,
              "} else if (actionDialog.kind === 'bulk-untrack-selected' || actionDialog.kind === 'bulk-delete-selected') {\n        const selector = await ensureSelectionReady();\n        await filesRemovalMutation.mutateAsync({\n          ...selector,\n          mode: actionDialog.kind === 'bulk-delete-selected' ? 'delete' : 'untrack'\n        });\n        library.clearSelection();\n      } else if (actionDialog.kind === 'untrack-file' || actionDialog.kind === 'delete-file') {\n        await fileRemovalMutation.mutateAsync({ id: actionDialog.id, mode: actionDialog.kind === 'delete-file' ? 'delete' : 'untrack' });",
              "} else if (actionDialog.kind === 'bulk-untrack-selected' || actionDialog.kind === 'bulk-delete-selected' || actionDialog.kind === 'bulk-delete-or-untrack-selected') {\n        const selector = await ensureSelectionReady();\n        await filesRemovalMutation.mutateAsync({\n          ...selector,\n          mode: actionDialog.kind === 'bulk-delete-selected'\n            ? 'delete'\n            : actionDialog.kind === 'bulk-delete-or-untrack-selected'\n              ? 'delete_or_untrack'\n              : 'untrack'\n        });\n        library.clearSelection();\n      } else if (actionDialog.kind === 'untrack-file' || actionDialog.kind === 'delete-file' || actionDialog.kind === 'untrack-external-file') {\n        await fileRemovalMutation.mutateAsync({ id: actionDialog.id, mode: actionDialog.kind === 'delete-file' ? 'delete' : 'untrack' });")
          replace(path,
              "    } catch (error) {\n      actionDialog = { ...actionDialog, busy: false, error: errorMessage(error) };\n    }",
              "    } catch (error) {\n      if (error instanceof ApiError && error.code === 'file_not_managed') {\n        if (actionDialog.kind === 'bulk-delete-selected') {\n          actionDialog = { ...actionDialog, kind: 'bulk-delete-or-untrack-selected', busy: false, error: '' };\n          return;\n        }\n        if (actionDialog.kind === 'delete-file') {\n          actionDialog = { ...actionDialog, kind: 'untrack-external-file', busy: false, error: '' };\n          return;\n        }\n      }\n      actionDialog = { ...actionDialog, busy: false, error: errorMessage(error) };\n    }")
          replace(path,
              "      case 'bulk-delete-selected': return 'Delete selected files';\n      case 'untrack-file': return 'Remove from library';\n      case 'delete-file': return 'Delete file';",
              "      case 'bulk-delete-selected': return 'Delete selected files';\n      case 'bulk-delete-or-untrack-selected': return 'Delete managed files and untrack external files?';\n      case 'untrack-file': return 'Remove from library';\n      case 'delete-file': return 'Delete file';\n      case 'untrack-external-file': return 'Untrack file instead?';")
          replace(path,
              "      case 'bulk-delete-selected': return `Permanently delete ${selectedCount} selected file${selectedCount === 1 ? '' : 's'} from disk and remove them from the library. Only files in managed upload targets can be deleted.`;\n      case 'untrack-file': return `Untrack \\\"${actionDialog.name}\\\" from the library. The file remains on disk.`;\n      case 'delete-file': return `Permanently delete \\\"${actionDialog.name}\\\" from disk and remove it from the library.`;",
              "      case 'bulk-delete-selected': return `Permanently delete ${selectedCount} selected file${selectedCount === 1 ? '' : 's'} from disk and remove them from the library. Only files in managed upload targets can be deleted.`;\n      case 'bulk-delete-or-untrack-selected': return 'Some selected files are outside configured upload targets. Delete managed files and untrack the external files? External files will remain on disk.';\n      case 'untrack-file': return `Untrack \\\"${actionDialog.name}\\\" from the library. The file remains on disk.`;\n      case 'delete-file': return `Permanently delete \\\"${actionDialog.name}\\\" from disk and remove it from the library.`;\n      case 'untrack-external-file': return `\\\"${actionDialog.name}\\\" is outside configured upload targets. Untrack it from the library instead? The file will remain on disk.`;")
          replace(path,
              "      case 'bulk-delete-selected': return 'Delete files';\n      case 'untrack-file': return 'Remove';\n      case 'delete-file': return 'Delete file';",
              "      case 'bulk-delete-selected': return 'Delete files';\n      case 'bulk-delete-or-untrack-selected': return 'Delete and untrack';\n      case 'untrack-file': return 'Remove';\n      case 'delete-file': return 'Delete file';\n      case 'untrack-external-file': return 'Untrack';")
          replace(path,
              "destructive={actionDialog.kind === 'save-delete' || actionDialog.kind === 'bulk-untrack-selected' || actionDialog.kind === 'bulk-delete-selected' || actionDialog.kind === 'untrack-file' || actionDialog.kind === 'delete-file'}",
              "destructive={actionDialog.kind === 'save-delete' || actionDialog.kind === 'bulk-untrack-selected' || actionDialog.kind === 'bulk-delete-selected' || actionDialog.kind === 'bulk-delete-or-untrack-selected' || actionDialog.kind === 'untrack-file' || actionDialog.kind === 'delete-file' || actionDialog.kind === 'untrack-external-file'}")
          replace(path,
              "input={actionDialog.kind !== 'save-delete' && actionDialog.kind !== 'bulk-untrack-selected' && actionDialog.kind !== 'bulk-delete-selected' && actionDialog.kind !== 'untrack-file' && actionDialog.kind !== 'delete-file'}",
              "input={actionDialog.kind !== 'save-delete' && actionDialog.kind !== 'bulk-untrack-selected' && actionDialog.kind !== 'bulk-delete-selected' && actionDialog.kind !== 'bulk-delete-or-untrack-selected' && actionDialog.kind !== 'untrack-file' && actionDialog.kind !== 'delete-file' && actionDialog.kind !== 'untrack-external-file'}")

          # Backend regression: mixed task records deletion paths only for managed files.
          p = Path('internal/serve/file_removals_managed_storage_test.go')
          text = p.read_text()
          addition = r'''

func TestMixedRemovalTaskDeletesManagedAndOnlyUntracksExternal(t *testing.T) {
	managedRoot := t.TempDir()
	managedPath := filepath.Join(managedRoot, "managed.jpg")
	externalPath := filepath.Join(t.TempDir(), "external.jpg")
	for _, path := range []string{managedPath, externalPath} {
		if err := os.WriteFile(path, []byte("data"), 0o600); err != nil {
			t.Fatal(err)
		}
	}
	cfg := DefaultConfig(filepath.Join(t.TempDir(), "gooru.db"))
	cfg.Uploads.Targets = []UploadTarget{{ID: "managed", Name: "Managed", Path: managedRoot}}
	server := NewServerWithLibrary(cfg, emptyLibrary{})

	task, err := server.backgroundFileRemovalBatchTask("delete_or_untrack", []types.FileInfo{
		{PublicID: "managed", Path: managedPath},
		{PublicID: "external", Path: externalPath},
	})
	if err != nil {
		t.Fatal(err)
	}
	var input backgroundFileRemovalBatchInput
	if err := json.Unmarshal([]byte(task.InputKey), &input); err != nil {
		t.Fatal(err)
	}
	if input.Mode != "delete_or_untrack" || len(input.Files) != 2 {
		t.Fatalf("unexpected mixed removal payload: %+v", input)
	}
	if input.Files[0].OriginalPath != managedPath || input.Files[0].StagingPath == "" {
		t.Fatalf("managed file was not staged for deletion: %+v", input.Files[0])
	}
	if input.Files[1].OriginalPath != "" || input.Files[1].StagingPath != "" {
		t.Fatalf("external file must only be untracked: %+v", input.Files[1])
	}
}
'''
          if 'TestMixedRemovalTaskDeletesManagedAndOnlyUntracksExternal' not in text:
              p.write_text(text.rstrip() + addition + '\n')

          # Browser regression: first strict delete gets 409, second confirmed request is one mixed operation.
          p = Path('frontend/tests/selection-ui-modal.spec.ts')
          text = p.read_text()
          addition = r'''


test('mixed delete asks to untrack external files before one confirmed removal request', async ({ page }) => {
  await mockApp(page);
  const removals: Array<Record<string, unknown>> = [];
  await page.route('**/api/v1/files', async (route) => {
    if (route.request().method() !== 'DELETE') return route.fallback();
    const removal = route.request().postDataJSON() as Record<string, unknown>;
    removals.push(removal);
    if (removal.mode === 'delete') {
      await route.fulfill({
        status: 409,
        contentType: 'application/json',
        body: JSON.stringify({ error: { code: 'file_not_managed', message: 'one or more selected files are outside configured upload targets; untrack them instead' } })
      });
      return;
    }
    await route.fulfill({
      status: 200,
      contentType: 'application/json',
      body: JSON.stringify({ mode: removal.mode, removed_locations: 2, selector: {} })
    });
  });

  await selectFirstFile(page);
  await page.keyboard.press('Shift+Delete');
  let dialog = page.getByRole('dialog', { name: 'Delete selected files' });
  await dialog.getByRole('button', { name: 'Delete files' }).click();

  dialog = page.getByRole('dialog', { name: 'Delete managed files and untrack external files?' });
  await expect(dialog).toBeVisible();
  await expect(dialog).toContainText('External files will remain on disk.');
  expect(removals).toEqual([{ mode: 'delete', selection_id: 'selection-one', exclude_file_ids: ['one'] }]);

  await dialog.getByRole('button', { name: 'Delete and untrack' }).click();
  await expect.poll(() => removals.length).toBe(2);
  expect(removals[1]).toEqual({ mode: 'delete_or_untrack', selection_id: 'selection-one', exclude_file_ids: ['one'] });
  await expect(dialog).toHaveCount(0);
});
'''
          if "mixed delete asks to untrack external files" not in text:
              p.write_text(text.rstrip() + addition + '\n')
          PY
          gofmt -w internal/serve/background_file_removals.go internal/serve/file_removals.go internal/serve/file_removals_managed_storage_test.go
      - name: Generate API client
        working-directory: frontend
        run: |
          npm ci --prefer-offline --no-audit
          npm run generate:api
      - name: Validate backend
        run: go test -count=1 ./internal/serve
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run check
          npx playwright install chromium
          npx playwright test selection-ui-modal.spec.ts
      - name: Commit generated patch and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/maintainer-issue-656.yml
          git config user.name "OpenAI Maintainer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: confirm mixed delete and untrack for external files"
          git push origin HEAD:maintainer/issue-656-untrack-external-delete
