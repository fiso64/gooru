name: tmp-333-rename-summary-validate

on:
  push:
    branches:
      - perf/333-exact-tag-kind-summary

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/333-exact-tag-kind-summary
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Focused regressions
        run: go test ./internal/database ./gooru ./internal/serve
      - name: Full Go suite
        run: go test ./...
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-333-rename-summary-validate.yml
          git commit -m 'ci: remove temporary rename-summary validation'
          git push origin HEAD:perf/333-exact-tag-kind-summary
