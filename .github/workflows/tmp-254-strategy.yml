name: tmp-254-added-at-strategy
on:
  push:
    branches: [feat/254-added-at-strategy]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Apply product patch
        run: python .github/tmp-254-strategy.py
      - name: Format
        run: gofmt -w types/types.go internal/database/database.go internal/serve/config.go internal/serve/uploads.go internal/serve/upload_stream.go internal/serve/upload_added_at_strategy_test.go
      - name: Validate backend
        run: go test ./...
      - name: Diff check
        run: git diff --check
      - name: Commit product patch
        run: |
          git config user.name chatgpt-codex-connector
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add types internal docs
          if ! git diff --cached --quiet; then
            git commit -m 'feat(upload): add added-at strategies'
            git push origin HEAD:feat/254-added-at-strategy
          fi