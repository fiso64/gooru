name: maintainer-249-final-test-scope

on:
  push:
    branches: [feat/249-upload-item-tags]
    paths:
      - .github/workflows/maintainer-249-final-test-scope.yml

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/249-upload-item-tags
          fetch-depth: 0
      - name: Scope viewer assertions and remove stale selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          spec = Path('frontend/tests/upload-viewer.spec.ts')
          text = spec.read_text()
          old = '''  const alphaTagInput = page.getByLabel('Tags for alpha.png');\n  await alphaTagInput.press('-');\n  await expect(page.getByLabel('Remove tags from alpha.png')).toBeFocused();\n  await page.getByLabel('Remove tags from alpha.png').press('+');\n  await expect(page.getByLabel('Tags for alpha.png')).toBeFocused();'''
          new = '''  const alphaTagInput = alphaDialog.getByRole('textbox', { name: 'Tags for alpha.png' });\n  await alphaTagInput.press('-');\n  const alphaUntagInput = alphaDialog.getByRole('textbox', { name: 'Remove tags from alpha.png' });\n  await expect(alphaUntagInput).toBeFocused();\n  await alphaUntagInput.press('+');\n  await expect(alphaDialog.getByRole('textbox', { name: 'Tags for alpha.png' })).toBeFocused();'''
          if old not in text:
              raise SystemExit('staged viewer tag-mode assertion anchor missing')
          spec.write_text(text.replace(old, new, 1))

          panel = Path('frontend/src/lib/components/UploadPanel.svelte')
          text = panel.read_text()
          old = '.upload-row :is(button:not(.upload-row-open-target), input, a) {'
          new = '.upload-row :is(button:not(.upload-row-open-target), input) {'
          if old not in text:
              raise SystemExit('row z-index selector anchor missing')
          panel.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/maintainer-249-final-test-scope.yml
          git config user.name 'fiso64'
          git config user.email '64778819+fiso64@users.noreply.github.com'
          git add frontend/tests/upload-viewer.spec.ts frontend/src/lib/components/UploadPanel.svelte .github/workflows/maintainer-249-final-test-scope.yml
          git commit -m 'test(upload): scope staged viewer shortcuts'
          git push origin HEAD:feat/249-upload-item-tags
