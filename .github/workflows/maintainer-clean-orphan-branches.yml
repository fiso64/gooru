name: maintainer-clean-orphan-branches

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/maintainer-clean-orphan-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, gooru]
    steps:
      - name: Remove superseded maintainer branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" maintainer/debug-401-delete >/dev/null 2>&1 && \
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete maintainer/debug-401-delete || true
          git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" maintainer/inspect-401-delete >/dev/null 2>&1 && \
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete maintainer/inspect-401-delete || true
