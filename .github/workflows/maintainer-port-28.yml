name: maintainer-validate-28-source-hashing

on:
  push:
    branches:
      - refactor/28-source-hashing-current

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Focused source hashing tests
        run: go test ./internal/hashing/hashes ./internal/hashing ./gooru
      - name: Full Go test suite
        run: go test ./...
      - name: Build all Go packages
        run: go build ./...
