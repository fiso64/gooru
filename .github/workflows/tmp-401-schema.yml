name: Temporary #401 durable work schema validation

on:
  push:
    branches:
      - refactor/401-durable-work-schema

permissions:
  contents: write

concurrency:
  group: temporary-401-schema
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/401-durable-work-schema
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Database package tests
        run: go test ./internal/database
      - name: Full Go tests
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Remove superseded sibling branch
        run: git push origin --delete refactor/401-durable-work-model
