name: Temporary UI modal validation

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Validate Select all spacing
        continue-on-error: true
        run: npx playwright test tests/selection-ui-modal.spec.ts --project=chromium -g "real visible space"
      - name: Validate toolbar labels and order
        continue-on-error: true
        run: npx playwright test tests/selection-ui-modal.spec.ts --project=chromium -g "action order and labels"
      - name: Validate toolbar icon distinctions
        continue-on-error: true
        run: npx playwright test tests/selection-ui-modal.spec.ts --project=chromium -g "distinct icons"
      - name: Validate modal Enter policy
        continue-on-error: true
        run: npx playwright test tests/selection-ui-modal.spec.ts --project=chromium -g "plain Enter"
