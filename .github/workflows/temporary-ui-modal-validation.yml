name: Temporary UI modal validation

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Validate selection toolbar
        run: npx playwright test tests/selection-ui-modal.spec.ts --project=chromium -g "selection toolbar"
      - name: Validate modal Enter policy
        run: npx playwright test tests/selection-ui-modal.spec.ts --project=chromium -g "plain Enter"
