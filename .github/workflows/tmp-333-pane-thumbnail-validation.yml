name: Temporary 333 pane thumbnail validation

on:
  push:
    branches: [perf/333-pane-thumbnail-activation]
    paths:
      - 'frontend/src/lib/utils/viewportActivation.ts'
      - 'frontend/src/lib/utils/viewportActivation.test.ts'
      - 'frontend/src/lib/components/MediaCard.svelte'
      - 'frontend/src/lib/components/MediaGrid.svelte'
      - '.github/workflows/tmp-333-pane-thumbnail-validation.yml'

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Production build
        working-directory: frontend
        run: npm run build
