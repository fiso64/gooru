name: issue-21 validation

on:
  push:
    branches:
      - agent/issue-21-exact-concept-port

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Align and instrument scroll regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          spec = Path('frontend/tests/shell.spec.ts')
          text = spec.read_text()
          text = text.replace(
              "await page.evaluate(() => window.scrollTo(0, 10_000));",
              "await page.locator('.main').evaluate((node) => { node.scrollTop = 10_000; node.dispatchEvent(new Event('scroll')); });"
          )
          text = text.replace(
              "await page.evaluate((step) => window.scrollTo(0, step * 2_500), i + 1);",
              "await page.locator('.main').evaluate((node, step) => { node.scrollTop = step * 2_500; node.dispatchEvent(new Event('scroll')); }, i + 1);"
          )
          text = text.replace(
              "await page.evaluate(() => window.scrollTo(0, 0));",
              "await page.locator('.main').evaluate((node) => { node.scrollTop = 0; node.dispatchEvent(new Event('scroll')); });"
          )
          needle = "  await expect(page.getByRole('button', { name: 'Preview large-560.jpg' })).toHaveCount(1);"
          debug = "  console.log('FILE_REQUESTS', JSON.stringify(fileRequests));\n  console.log('MAIN_METRICS', await page.locator('.main').evaluate((node) => ({ scrollTop: node.scrollTop, scrollHeight: node.scrollHeight, clientHeight: node.clientHeight })));\n" + needle
          text = text.replace(needle, debug)
          spec.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Diagnose large-library scroll
        working-directory: frontend
        run: npx playwright test tests/shell.spec.ts -g "loads paginated large libraries"
