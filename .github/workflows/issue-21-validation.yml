name: issue-21 validation

on:
  push:
    branches:
      - agent/issue-21-exact-concept-port

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply recovery patch and diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = app.read_text().replace("  import { createViewportState } from '$lib/state/viewport.svelte';\n", '').replace('  const viewport = createViewportState();\n', '')
          old = "  $effect(() => {\n    fileMetadataKey;\n    fileMetadata = null;\n  });\n\n  $effect(() => {\n    fileMetadataKey;\n    const metadataPage = filesQuery.data?.pages.find((page) => page.facets);\n    if (!metadataPage) return;\n    fileMetadata = {\n      total_count: metadataPage.total_count,\n      library_count: metadataPage.library_count,\n      facets: metadataPage.facets\n    };\n  });"
          new = "  let observedFileMetadataKey = $state('');\n\n  $effect(() => {\n    const key = fileMetadataKey;\n    if (key !== observedFileMetadataKey) { observedFileMetadataKey = key; fileMetadata = null; }\n    const metadataPage = filesQuery.data?.pages.find((page) => page.facets);\n    if (!metadataPage) return;\n    fileMetadata = { total_count: metadataPage.total_count, library_count: metadataPage.library_count, facets: metadataPage.facets };\n  });"
          text = text.replace(old, new).replace('        viewportHeight={viewport.height}\n        scrollY={viewport.scrollY}\n', '')
          app.write_text(text)
          grid = Path('frontend/src/lib/components/MediaGrid.svelte')
          text = grid.read_text().replace('    viewportHeight,\n    scrollY,\n', '').replace('    viewportHeight: number;\n    scrollY: number;\n', '').replace('  let paneHeight = $state(viewportHeight || 900);\n  let paneScrollY = $state(scrollY || 0);\n', '  let paneHeight = $state(900);\n  let paneScrollY = $state(0);\n')
          text = text.replace('  const virtual = $derived(virtualGrid(files, gridWidth, paneHeight, paneScrollY, gridTop, totalCount || files.length, retainedStartIndex));', "  const virtualItemCount = $derived(Math.max(totalCount || 0, retainedStartIndex + files.length + (hasNextPage ? 1 : 0)));\n  const virtual = $derived(virtualGrid(files, gridWidth, paneHeight, paneScrollY, gridTop, virtualItemCount, retainedStartIndex));")
          grid.write_text(text)
          spec = Path('frontend/tests/shell.spec.ts')
          text = spec.read_text().replace("await page.evaluate(() => window.scrollTo(0, 10_000));", "await page.locator('.main').evaluate((node) => { node.scrollTop = 10_000; node.dispatchEvent(new Event('scroll')); });").replace("await page.evaluate((step) => window.scrollTo(0, step * 2_500), i + 1);", "await page.locator('.main').evaluate((node, step) => { node.scrollTop = step * 2_500; node.dispatchEvent(new Event('scroll')); }, i + 1);").replace("await page.evaluate(() => window.scrollTo(0, 0));", "await page.locator('.main').evaluate((node) => { node.scrollTop = 0; node.dispatchEvent(new Event('scroll')); });")
          needle = "  await expect(page.getByRole('button', { name: 'Preview large-560.jpg' })).toHaveCount(1);"
          debug = "  console.log('TRACE_REQUESTS', JSON.stringify(fileRequests));\n  console.log('TRACE_HEADING', await page.locator('.library-head-meta').textContent());\n  console.log('TRACE_MAIN', await page.locator('.main').evaluate((node) => ({scrollTop: node.scrollTop, scrollHeight: node.scrollHeight, clientHeight: node.clientHeight})));\n  console.log('TRACE_HOST', await page.locator('.virtual-grid').evaluate((node) => ({offsetTop: (node as HTMLElement).offsetTop, offsetHeight: (node as HTMLElement).offsetHeight, styleHeight: (node as HTMLElement).style.height})));\n  console.log('TRACE_GRID', await page.locator('[data-testid=virtual-media-grid]').evaluate((node) => ({transform: (node as HTMLElement).style.transform, width: node.getBoundingClientRect().width, count: node.querySelectorAll('.thumb').length, first: node.querySelector('.thumb-open')?.getAttribute('aria-label'), last: Array.from(node.querySelectorAll('.thumb-open')).at(-1)?.getAttribute('aria-label')})));\n" + needle
          text = text.replace(needle, debug)
          spec.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Trace large-library scroll
        working-directory: frontend
        run: npx playwright test tests/shell.spec.ts -g "loads paginated large libraries"
