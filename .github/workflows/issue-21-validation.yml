name: issue-21 validation

on:
  push:
    branches:
      - agent/issue-21-exact-concept-port

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Align source and browser regression with concept scroll pane
        run: |
          python3 - <<'PY'
          from pathlib import Path

          search = Path('frontend/src/lib/components/SearchBar.svelte')
          text = search.read_text()
          text = text.replace("'tag, namespace:value, -exclude'", "'tag, namespace:value, -exclude — try \"subject:\" or \"hero\"'")
          text = text.replace('<span class="neg-symbol">-</span>', '<span class="neg-symbol">−</span>')
          search.write_text(text)

          spec = Path('frontend/tests/shell.spec.ts')
          text = spec.read_text()
          text = text.replace(
              "await page.evaluate(() => window.scrollTo(0, 10_000));",
              "await page.locator('.main').evaluate((node) => { node.scrollTop = 10_000; node.dispatchEvent(new Event('scroll')); });"
          )
          text = text.replace(
              "await page.evaluate((step) => window.scrollTo(0, step * 2_500), i + 1);",
              "await page.locator('.main').evaluate((node, step) => { node.scrollTop = step * 2_500; node.dispatchEvent(new Event('scroll')); }, i + 1);"
          )
          text = text.replace(
              "await page.evaluate(() => window.scrollTo(0, 0));",
              "await page.locator('.main').evaluate((node) => { node.scrollTop = 0; node.dispatchEvent(new Event('scroll')); });"
          )
          spec.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Build Go packages
        run: go build ./...
      - name: Run Go tests
        run: go test ./...
      - name: Persist validated source/test alignment
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/components/SearchBar.svelte frontend/tests/shell.spec.ts
          git commit -m "#21 align search and scroll regression with concept"
          git push
