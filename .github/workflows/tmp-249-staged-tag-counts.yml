name: Temporary 249 staged tag count validation

on:
  push:
    branches:
      - feat/249-upload-item-tags
    paths:
      - .github/workflows/tmp-249-staged-tag-counts.yml
      - .github/tmp-249-staged-tag-counts.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/249-upload-item-tags
      - name: Apply staged tag count optimization
        run: python3 .github/tmp-249-staged-tag-counts.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- frontend/src/lib/state/uploadStagedTagCounts.ts frontend/src/lib/state/uploadStagedTagCounts.test.ts frontend/src/lib/state/uploadWorkflow.svelte.ts frontend/src/lib/state/uploadWorkflow.svelte.test.ts frontend/src/lib/utils/tagSuggestions.ts frontend/src/lib/utils/tagSuggestions.test.ts frontend/src/lib/components/UploadPanel.svelte frontend/src/lib/components/AuthenticatedApp.svelte
          git config user.name "gooru-maintainer-bot"
          git config user.email "maintainer@localhost"
          git add frontend/src/lib/state/uploadStagedTagCounts.ts frontend/src/lib/state/uploadStagedTagCounts.test.ts frontend/src/lib/state/uploadWorkflow.svelte.ts frontend/src/lib/state/uploadWorkflow.svelte.test.ts frontend/src/lib/utils/tagSuggestions.ts frontend/src/lib/utils/tagSuggestions.test.ts frontend/src/lib/components/UploadPanel.svelte frontend/src/lib/components/AuthenticatedApp.svelte
          git commit -m 'perf: maintain staged upload tag counts incrementally'
          git push origin HEAD:feat/249-upload-item-tags
