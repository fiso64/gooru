name: Validate #333 simple kind facet fast path

on:
  push:
    branches:
      - perf/333-simple-type-facet-summary

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/333-simple-type-facet-summary
      - name: Apply core fast path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gooru/query.go')
          text = path.read_text()
          old = '''func (c *Client) KindFacetsByQuery(expression string, verbose bool) ([]types.TagWithCount, error) {
          \tsqlQuery, args, err := c.buildLocationQuery(expression)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tif sqlQuery == "" {
          \t\treturn c.store.KindFacets()
          \t}
          \tif verbose {
          \t\tfmt.Fprintf(os.Stderr, "--- DEBUG ---\\nExpression: %s\\nBuilt SQL : %s\\nSQL Args  : %v\\n-------------\\n", expression, sqlQuery, args)
          \t}
          \treturn c.store.KindFacetsByLocationQuery(sqlQuery, args)
          }
          '''
          new = '''func (c *Client) KindFacetsByQuery(expression string, verbose bool) ([]types.TagWithCount, error) {
          \tif kind, ok := simpleKindFacetFilter(expression); ok {
          \t\tfacets, err := c.store.KindFacets()
          \t\tif err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\treturn filterKindFacet(facets, kind), nil
          \t}
          \tsqlQuery, args, err := c.buildLocationQuery(expression)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tif sqlQuery == "" {
          \t\treturn c.store.KindFacets()
          \t}
          \tif verbose {
          \t\tfmt.Fprintf(os.Stderr, "--- DEBUG ---\\nExpression: %s\\nBuilt SQL : %s\\nSQL Args  : %v\\n-------------\\n", expression, sqlQuery, args)
          \t}
          \treturn c.store.KindFacetsByLocationQuery(sqlQuery, args)
          }
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('KindFacetsByQuery shape changed; refusing blind patch')
          PY
          gofmt -w gooru/query.go gooru/query_kind_fastpath.go gooru/query_kind_fastpath_test.go
      - name: Commit core patch
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name 'chatgpt-codex-connector[bot]'
            git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
            git add gooru/query.go gooru/query_kind_fastpath.go gooru/query_kind_fastpath_test.go
            git commit -m 'perf(query): serve simple kind facets from summary'
            git push origin HEAD:perf/333-simple-type-facet-summary
          fi
      - name: Formatting
        run: test -z "$(gofmt -l gooru/query.go gooru/query_kind_fastpath.go gooru/query_kind_fastpath_test.go)"
      - name: Focused tests
        run: go test ./gooru -run 'Test(SimpleKindFacetFilter|FilterKindFacet)$' -count=1
      - name: Query and database packages
        run: go test ./gooru ./internal/query ./internal/database -count=1
      - name: Server package
        run: go test ./internal/serve -count=1
