name: temp-21-cursor-contrast
on:
  push:
    branches:
      - fix/21-cursor-contrast
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate cursor contrast slice
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
          npm run check
          npm run test:unit
          npm run build
          npx playwright test tests/grid-keyboard-cursor.spec.ts --project=chromium
