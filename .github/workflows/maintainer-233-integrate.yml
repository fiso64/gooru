name: Maintainer 233 integration validation

on:
  push:
    branches:
      - fix/233-job-failure-diagnostics

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[maintainer-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/233-job-failure-diagnostics
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Integrate latest develop
        run: |
          git fetch origin develop
          git merge --no-commit --no-ff origin/develop
          rm .github/workflows/maintainer-233-integrate.yml
      - name: Validate integrated tree
        run: |
          go test ./internal/serve ./internal/database
          go test ./...
          go build ./...
      - name: Commit integrated tree
        run: |
          git config user.name "fiso64"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git add -A
          git commit -m "merge: integrate develop after #234 [maintainer-integrated]"
          git push origin HEAD:fix/233-job-failure-diagnostics
