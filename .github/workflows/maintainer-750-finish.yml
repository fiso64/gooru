name: maintainer-750-finish

on:
  push:
    branches:
      - maintainer/750-honest-added-order

permissions:
  contents: write

jobs:
  finish:
    if: github.repository == 'fiso64/gooru'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintainer/750-honest-added-order
          fetch-depth: 0
      - name: Complete honest added ordering integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new, expected in replacements:
                  if new in s and old not in s:
                      continue
                  count = s.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} matches, got {count}: {old!r}')
                  s = s.replace(old, new)
              p.write_text(s)

          patch('internal/serve/upload_stream.go', [
              ('\taddedAt       time.Time\n}', '\taddedAt       time.Time\n\taddedOrder    int64\n}', 1),
              ('\t\tstreamed[i].addedAt = resolveUploadAddedAt(addedAtStrategy, streamed[i].sourceModTime, queueTime, queueFirstTime, queueLastTime, queueIndex, queueTotal)\n', '\t\tstreamed[i].addedAt = resolveUploadAddedAt(addedAtStrategy, streamed[i].sourceModTime, queueTime, queueFirstTime, queueLastTime, queueIndex, queueTotal)\n\t\tstreamed[i].addedOrder = resolveUploadAddedOrder(addedAtStrategy, queueIndex, queueTotal)\n', 1),
              ('\t\t\tfinalized.addedAt = file.addedAt\n', '\t\t\tfinalized.addedAt = file.addedAt\n\t\t\tfinalized.addedOrder = file.addedOrder\n', 1),
          ])

          patch('internal/serve/upload_durable_staging.go', [
              ('\t\tstreamed[i].addedAt = resolveUploadAddedAt(addedAtStrategy, streamed[i].sourceModTime, queueTime, queueFirstTime, queueLastTime, queueIndex, queueTotal)\n', '\t\tstreamed[i].addedAt = resolveUploadAddedAt(addedAtStrategy, streamed[i].sourceModTime, queueTime, queueFirstTime, queueLastTime, queueIndex, queueTotal)\n\t\tstreamed[i].addedOrder = resolveUploadAddedOrder(addedAtStrategy, queueIndex, queueTotal)\n', 1),
              ('addedAt: file.addedAt, conflictPolicy: conflictPolicy', 'addedAt: file.addedAt, addedOrder: file.addedOrder, conflictPolicy: conflictPolicy', 1),
          ])

          patch('internal/serve/background_uploads.go', [
              ('\tAddedAt         time.Time `json:"added_at,omitempty"`\n', '\tAddedAt         time.Time `json:"added_at,omitempty"`\n\tAddedOrder      int64     `json:"added_order,omitempty"`\n', 1),
              ('\t\t\tAddedAt:         file.addedAt,\n', '\t\t\tAddedAt:         file.addedAt,\n\t\t\tAddedOrder:      file.addedOrder,\n', 1),
              ('\t\t\taddedAt:         file.AddedAt,\n', '\t\t\taddedAt:         file.AddedAt,\n\t\t\taddedOrder:      file.AddedOrder,\n', 1),
          ])

          patch('internal/serve/browse.go', [
              ('AddedAt:         time.Unix(file.AddedAt, 0).UTC(),', 'AddedAt:         time.UnixMilli(file.AddedAt).UTC(),', 1),
          ])
          patch('internal/serve/browse_test.go', [
              ('page.Files[0].AddedAt.Unix() != storedFile.AddedAt', 'page.Files[0].AddedAt.UnixMilli() != storedFile.AddedAt', 1),
          ])

          patch('internal/database/database_test.go', [
              ('if file.AddedAt != 1234 {', 'if file.AddedAt != 1234*1000 {', 2),
              ('added_at=%d want 1234', 'added_at=%d want %d', 1),
              ('t.Fatalf("added_at=%d want %d", file.AddedAt)', 't.Fatalf("added_at=%d want %d", file.AddedAt, int64(1234*1000))', 1),
              ('existing added_at changed to %d, want stable 1234', 'existing added_at changed to %d, want stable %d', 1),
              ('t.Fatalf("existing added_at changed to %d, want stable %d", file.AddedAt)', 't.Fatalf("existing added_at changed to %d, want stable %d", file.AddedAt, int64(1234*1000))', 1),
          ])

          patch('internal/database/migration_test.go', [
              ('if explicit != 4321 {', 'if explicit != 4321*1000 {', 1),
              ('t.Fatalf("explicit added_at = %d, want 4321", explicit)', 't.Fatalf("explicit added_at = %d, want %d", explicit, int64(4321*1000))', 1),
              ('if automatic <= 0 || automatic == 99 {', 'if automatic < 100000000000 || automatic == 99*1000 {', 1),
              ('if addedAt != 2468 {', 'if addedAt != 2468*1000 {', 1),
              ('t.Fatalf("backfilled added_at = %d, want legacy mod_time 2468", addedAt)', 't.Fatalf("backfilled added_at = %d, want legacy mod_time %d", addedAt, int64(2468*1000))', 1),
          ])

          patch('internal/database/migration_collision_test.go', [
              ('\t\t\tmigrations, err := loadEmbeddedMigrations()\n\t\t\tif err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tif err := ensureMigrationTable(db); err != nil {', '\t\t\tmigrations, err := loadEmbeddedMigrations()\n\t\t\tif err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tif len(migrations) == 0 {\n\t\t\t\tt.Fatal("no embedded migrations")\n\t\t\t}\n\t\t\tlatestVersion := migrations[len(migrations)-1].version\n\t\t\tif err := ensureMigrationTable(db); err != nil {', 1),
              ('if version != 40 || dirty {', 'if version != latestVersion || dirty {', 1),
              ('t.Fatalf("schema_migrations = (%d, %t), want (40, false)", version, dirty)', 't.Fatalf("schema_migrations = (%d, %t), want (%d, false)", version, dirty, latestVersion)', 1),
          ])

          patch('internal/database/performance_indexes_test.go', [
              ('ORDER BY l.added_at DESC, l.id ASC', 'ORDER BY l.added_at DESC, l.added_order DESC, l.id ASC', 2),
              ('idx_locations_added_at_desc_id_asc', 'idx_locations_added_at_order_desc_id_asc', 1),
              ('idx_locations_extension_lower_added_at_desc_id_asc', 'idx_locations_extension_lower_added_at_order_desc_id_asc', 1),
          ])

          patch('types/types.go', [
              ('AddedAt     int64 // Unix time; zero lets the database assign insertion time', 'AddedAt     int64 // Unix milliseconds; zero lets the database assign insertion time', 1),
              ('AddedAt     int64 // Unix time\n', 'AddedAt     int64 // Unix milliseconds\n', 1),
          ])
          PY
          gofmt -w internal/serve/upload_stream.go internal/serve/upload_durable_staging.go internal/serve/background_uploads.go internal/serve/browse.go internal/serve/browse_test.go internal/database/database_test.go internal/database/migration_test.go internal/database/migration_collision_test.go internal/database/performance_indexes_test.go types/types.go
      - name: Audit ordering call sites
        shell: bash
        run: |
          set -euo pipefail
          echo '--- added timestamp conversions ---'
          grep -RInE 'time\.Unix\([^)]*AddedAt|AddedAt.*Unix\(' --include='*.go' gooru internal types cmd 2>/dev/null || true
          echo '--- sorted-page call sites ---'
          grep -RInE 'Get(AllFilesInfo|FilesInfoByLocationQuery)PageSorted' --include='*.go' . | head -n 300 || true
          echo '--- upload added-order transport ---'
          grep -RIn 'addedOrder\|AddedOrder' --include='*.go' internal/serve internal/database gooru | head -n 400
      - name: Validate focused packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/database ./gooru ./internal/serve
      - name: Validate full repository
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
      - name: Commit validated integration and remove temporary runner files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintainer-750-finish.yml
          if [ -f .github/maintainer-750-trigger ]; then git rm .github/maintainer-750-trigger; fi
          git add internal/serve/upload_stream.go internal/serve/upload_durable_staging.go internal/serve/background_uploads.go internal/serve/browse.go internal/serve/browse_test.go internal/database/database_test.go internal/database/migration_test.go internal/database/migration_collision_test.go internal/database/performance_indexes_test.go types/types.go
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'upload: finish durable honest added ordering'
          git push origin HEAD:maintainer/750-honest-added-order
