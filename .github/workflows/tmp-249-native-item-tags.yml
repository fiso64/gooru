name: Temporary 249 native item tags

on:
  push:
    branches:
      - feat/249-upload-item-tags
    paths:
      - .github/workflows/tmp-249-native-item-tags.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/249-upload-item-tags
      - name: Apply patch
        run: python3 .github/tmp-249-native-item-tags.py
      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/serve/background_uploads.go internal/serve/upload_durable_staging.go internal/serve/upload_item_tags_test.go
          git diff --check
          go test ./internal/serve
          cd frontend
          npm ci
          npm run test:unit -- src/lib/api/client.uploadOrdering.test.ts src/lib/api/segmentedUploads.test.ts src/lib/state/uploadWorkflow.chunking.test.ts src/lib/state/uploadWorkflow.svelte.test.ts
          npm run check
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gooru-maintainer-bot"
          git config user.email "maintainer@localhost"
          git add \
            frontend/src/lib/state/uploadWorkflow.svelte.ts \
            frontend/src/lib/state/uploadWorkflow.chunking.test.ts \
            frontend/src/lib/queries/library.ts \
            frontend/src/lib/api/client.ts \
            frontend/src/lib/api/client.uploadOrdering.test.ts \
            frontend/src/lib/api/segmentedUploads.ts \
            frontend/src/lib/api/segmentedUploads.test.ts \
            internal/serve/background_uploads.go \
            internal/serve/upload_durable_staging.go \
            internal/serve/upload_item_tags_test.go
          git commit -m 'feat: send per-file upload tags natively'
          git push origin HEAD:feat/249-upload-item-tags
