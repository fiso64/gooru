name: Maintainer 231 exact transition lifetime

on:
  push:
    branches:
      - feat/231-comic-ui

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/231-comic-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Match supplied transition lifetime
        run: |
          sed -i "s/nextComicEntered ? 520 : 460/520/" frontend/src/lib/components/ViewerStage.svelte
          grep -F "setTimeout(() => { comicTransition = ''; }, 520);" frontend/src/lib/components/ViewerStage.svelte
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Focused Chromium comic UI
        working-directory: frontend
        run: npx playwright test tests/comic-ui.spec.ts --project=chromium
      - name: Commit validated correction and remove harness
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '1144995+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/ViewerStage.svelte
          git rm .github/workflows/maintainer-231-lifetime.yml
          git commit -m 'fix(comics): match supplied transition lifetime'
          git push origin HEAD:feat/231-comic-ui
