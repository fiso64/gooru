name: Maintainer gosqlite validation
on:
  push:
    branches: [refactor/28-gosqlite-driver-v2]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Tidy and enforce driver removal
        run: |
          go mod tidy
          if git grep -n 'github.com/mattn/go-sqlite3' -- '*.go' go.mod; then
            echo 'mattn go-sqlite3 reference remains' >&2
            exit 1
          fi
          if go list -deps ./... | grep -q '^github.com/mattn/go-sqlite3$'; then
            echo 'mattn go-sqlite3 remains in the dependency graph' >&2
            exit 1
          fi
          if ! git diff --quiet -- go.mod go.sum; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m 'build: tidy gosqlite dependencies'
            git push
          fi
      - name: Go build
        run: go build ./...
      - name: Go tests
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Frontend build
        working-directory: frontend
        run: npm run build
