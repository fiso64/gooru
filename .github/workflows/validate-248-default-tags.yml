name: Validate 248 upload default tags

on:
  push:
    branches:
      - feat/248-upload-target-default-tags

permissions:
  contents: read

concurrency:
  group: validate-248-default-tags
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/248-upload-target-default-tags
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Focused upload browser coverage
        working-directory: frontend
        run: npm run test:e2e -- upload-drop-control.spec.ts --project=chromium
