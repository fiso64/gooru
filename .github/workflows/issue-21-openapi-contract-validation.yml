name: issue-21 OpenAPI contract validation

on:
  push:
    branches:
      - agent/issue-21-exact-concept-port

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply OpenAPI contract correction
        run: python3 .github/scripts/issue21_openapi_contract_patch.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate typed API contract
        working-directory: frontend
        run: npm run generate:api
      - name: Verify generated CSRF typing is used
        run: |
          grep -q '"X-Gooru-CSRF"' frontend/src/lib/api/openapi.ts
          ! grep -q 'csrfHeaders(' frontend/src/lib/api/client.ts
          git diff --check
      - name: Check frontend with zero warnings
        working-directory: frontend
        run: |
          npm run check | tee /tmp/svelte-check.log
          grep -q "svelte-check found 0 errors and 0 warnings" /tmp/svelte-check.log
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Build Go packages
        run: go build ./...
      - name: Run Go tests
        run: go test ./...
      - name: Persist validated OpenAPI contract correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/openapi.yaml frontend/src/lib/api/client.ts frontend/src/lib/api/openapi.ts
          git commit -m "#21 type CSRF-protected generated API mutations [skip ci]"
          git push
