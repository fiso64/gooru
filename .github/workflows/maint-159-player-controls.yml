name: maint-159-player-controls

on:
  push:
    branches: [maint/159-player-controls]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/159-player-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply focused player-controls patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/lib/components/ViewerStage.svelte')
          text = path.read_text()
          if 'videoSeekPointerId' not in text:
              replacements = [
                  ("  let playbackControlsIdle = $state(false);\n  let playbackControlsTimer: ReturnType<typeof setTimeout> | undefined;",
                   "  let playbackControlsIdle = $state(false);\n  let playbackControlsTimer: ReturnType<typeof setTimeout> | undefined;\n  let videoSeekPointerId: number | undefined;\n  let cursorIdle = $state(false);\n  let cursorIdleTimer: ReturnType<typeof setTimeout> | undefined;"),
                  ("      if (playbackControlsTimer) clearTimeout(playbackControlsTimer);\n    };",
                   "      if (playbackControlsTimer) clearTimeout(playbackControlsTimer);\n      if (cursorIdleTimer) clearTimeout(cursorIdleTimer);\n    };"),
                  ("    const syncFullscreen = () => {\n      isFullscreen = document.fullscreenElement === stage;\n      resize();\n    };",
                   "    const syncFullscreen = () => {\n      isFullscreen = document.fullscreenElement === stage;\n      resize();\n      if (isFullscreen) scheduleCursorIdle();\n      else {\n        cursorIdle = false;\n        if (cursorIdleTimer) clearTimeout(cursorIdleTimer);\n        cursorIdleTimer = undefined;\n      }\n    };"),
                  ("  async function togglePlayback() {\n    const media = videoElement ?? audioElement;\n    if (!media) return;\n    showPlaybackControls();\n    if (media.paused) await media.play();\n    else media.pause();\n  }",
                   "  async function togglePlayback() {\n    const media = videoElement ?? audioElement;\n    if (!media) return;\n    if (media.paused) await media.play();\n    else media.pause();\n  }\n\n  function scheduleCursorIdle(event?: PointerEvent) {\n    cursorIdle = false;\n    if (cursorIdleTimer) clearTimeout(cursorIdleTimer);\n    cursorIdleTimer = undefined;\n    if (!isFullscreen) return;\n    const target = event?.target;\n    if (target instanceof Element && target.closest('.lightbox-video-controls')) return;\n    cursorIdleTimer = setTimeout(() => {\n      cursorIdle = true;\n      cursorIdleTimer = undefined;\n    }, 1000);\n  }\n\n  function handleStagePointerMove(event: PointerEvent) {\n    scheduleCursorIdle(event);\n    if (renderedFile.media_kind !== 'video') return;\n    const stage = stageElement;\n    if (!stage) return;\n    const rect = stage.getBoundingClientRect();\n    const revealDistance = Math.min(160, Math.max(80, rect.height * 0.22));\n    if (event.clientY >= rect.bottom - revealDistance) showPlaybackControls();\n  }\n\n  function handleControlsPointerEnter(event: PointerEvent) {\n    showPlaybackControls();\n    scheduleCursorIdle(event);\n  }"),
                  ("  function handleViewerKeydown(event: KeyboardEvent) {\n    if (event.defaultPrevented || hasCommandModifier(event) || isEditableShortcutTarget(event.target)) return;\n    showPlaybackControls();",
                   "  function handleViewerKeydown(event: KeyboardEvent) {\n    if (event.defaultPrevented || hasCommandModifier(event) || isEditableShortcutTarget(event.target)) return;"),
                  ("  function seekVideo(event: MouseEvent) {\n    restoreStageFocusAfterPointer(event);\n    const video = videoElement;\n    if (!video || !videoLength) return;\n    const button = event.currentTarget;\n    if (!(button instanceof HTMLElement)) return;\n    const rect = button.getBoundingClientRect();\n    if (!rect.width) return;\n    video.currentTime = Math.max(0, Math.min(videoLength, ((event.clientX - rect.left) / rect.width) * videoLength));\n    syncVideo();\n  }",
                   "  function seekVideoAt(clientX: number, control: HTMLElement) {\n    const video = videoElement;\n    if (!video || !videoLength) return;\n    const rect = control.getBoundingClientRect();\n    if (!rect.width) return;\n    video.currentTime = Math.max(0, Math.min(videoLength, ((clientX - rect.left) / rect.width) * videoLength));\n    syncVideo();\n  }\n\n  function seekVideo(event: MouseEvent) {\n    restoreStageFocusAfterPointer(event);\n    const control = event.currentTarget;\n    if (!(control instanceof HTMLElement)) return;\n    seekVideoAt(event.clientX, control);\n  }\n\n  function beginVideoSeek(event: PointerEvent) {\n    if (event.button !== 0) return;\n    const control = event.currentTarget;\n    if (!(control instanceof HTMLElement)) return;\n    event.preventDefault();\n    restoreStageFocusAfterPointer(event);\n    videoSeekPointerId = event.pointerId;\n    control.setPointerCapture(event.pointerId);\n    seekVideoAt(event.clientX, control);\n  }\n\n  function dragVideoSeek(event: PointerEvent) {\n    if (videoSeekPointerId !== event.pointerId) return;\n    const control = event.currentTarget;\n    if (!(control instanceof HTMLElement)) return;\n    seekVideoAt(event.clientX, control);\n  }\n\n  function endVideoSeek(event: PointerEvent) {\n    if (videoSeekPointerId !== event.pointerId) return;\n    const control = event.currentTarget;\n    if (control instanceof HTMLElement) {\n      seekVideoAt(event.clientX, control);\n      if (control.hasPointerCapture(event.pointerId)) control.releasePointerCapture(event.pointerId);\n    }\n    videoSeekPointerId = undefined;\n  }"),
                  ("<div bind:this={stageElement} class:fullscreen={isFullscreen} class:waiting={waitingForTarget} class=\"lightbox-stage viewer-stage\" tabindex=\"-1\" aria-busy={waitingForTarget} onpointermove={showPlaybackControls}>",
                   "<div bind:this={stageElement} class:fullscreen={isFullscreen} class:waiting={waitingForTarget} class:cursor-idle={isFullscreen && cursorIdle} class=\"lightbox-stage viewer-stage\" tabindex=\"-1\" aria-busy={waitingForTarget} onpointermove={handleStagePointerMove}>"),
                  ("    <div class=\"lightbox-video-controls\" class:is-idle={playbackControlsIdle} onpointerenter={showPlaybackControls} onfocusin={showPlaybackControls}>",
                   "    <div class=\"lightbox-video-controls\" class:is-idle={playbackControlsIdle} onpointerenter={handleControlsPointerEnter} onfocusin={showPlaybackControls}>"),
                  ("      <button class=\"video-progress\" type=\"button\" aria-label=\"Seek video\" onclick={seekVideo}>\n        <span style={`width: ${videoProgress}%`}></span>\n      </button>",
                   "      <button class=\"video-progress\" type=\"button\" aria-label=\"Seek video\" onclick={seekVideo} onpointerdown={beginVideoSeek} onpointermove={dragVideoSeek} onpointerup={endVideoSeek} onpointercancel={endVideoSeek}>\n        <span style={`width: ${videoProgress}%`}></span>\n      </button>"),
                  ("  :global(.viewer-stage:fullscreen) {\n    width: 100vw;\n    height: 100vh;\n    background: #000;\n  }",
                   "  :global(.viewer-stage:fullscreen) {\n    width: 100vw;\n    height: 100vh;\n    background: #000;\n  }\n\n  :global(.viewer-stage:fullscreen.cursor-idle) {\n    cursor: none;\n  }"),
              ]
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected ViewerStage fragment: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          test = Path('frontend/tests/viewer-player-controls.spec.ts')
          if not test.exists():
              test.write_text(r'''import { expect, test, type Page } from '@playwright/test';

const session = {
  user: { id: 'usr_test', username: 'mac', role: 'admin' },
  capabilities: { upload: true, tag: true, delete: true, admin: true },
  csrf_token: 'csrf-one'
};

function videoItem() {
  return {
    id: 'clip', content_id: 'hash-clip', name: 'clip.mp4', safe_display_path: 'library/clip.mp4',
    size: 2048, modified_time: '2026-05-20T00:00:00Z', media_type: 'video/mp4', media_kind: 'video',
    metadata: { image_width: 1280, image_height: 720, duration_seconds: 120 }, tags: [],
    media_urls: {
      thumbnail: '/api/v1/files/clip/thumbnail', preview: '/api/v1/files/clip/preview',
      content: '/api/v1/files/clip/content', download: '/api/v1/files/clip/download'
    }
  };
}

async function mockApp(page: Page) {
  let loggedIn = false;
  const files = [videoItem()];
  await page.route('**/api/v1/auth/me', async (route) => route.fulfill({ status: loggedIn ? 200 : 401, contentType: 'application/json', body: JSON.stringify(loggedIn ? session : { error: { code: 'unauthorized', message: 'login required' } }) }));
  await page.route('**/api/v1/auth/login', async (route) => { loggedIn = true; await route.fulfill({ contentType: 'application/json', body: JSON.stringify(session) }); });
  await page.route('**/api/v1/jobs', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/saved-searches', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/upload-targets', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/tags?**', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ tags: [] }) }));
  await page.route('**/api/v1/search/suggestions?**', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ items: [] }) }));
  await page.route('**/api/v1/files?**', async (route) => route.fulfill({ contentType: 'application/json', body: JSON.stringify({ files, total_count: 1, library_count: 1, facets: { kind: [] } }) }));
  await page.route('**/api/v1/files/clip/thumbnail', async (route) => route.fulfill({ contentType: 'image/svg+xml', body: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32"/></svg>' }));
  await page.route('**/api/v1/files/clip/preview', async (route) => route.fulfill({ contentType: 'image/svg+xml', body: '<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720"><rect width="1280" height="720"/></svg>' }));
  await page.route('**/api/v1/files/clip/content', async (route) => route.fulfill({ status: 204, body: '' }));

  await page.goto('/');
  await page.getByLabel('Username').fill('mac');
  await page.getByLabel('Password').fill('correct horse');
  await page.getByRole('button', { name: 'Sign in' }).click();
  await expect(page.getByRole('heading', { name: 'Library' })).toBeVisible();
  await page.getByRole('button', { name: 'Preview clip.mp4' }).click();
  const video = page.locator('video.viewer-visual-media');
  await expect(video).toBeVisible();
  await video.evaluate((node) => {
    const state = { time: 30, paused: true };
    Object.defineProperty(node, 'duration', { configurable: true, get: () => 120 });
    Object.defineProperty(node, 'currentTime', { configurable: true, get: () => state.time, set: (value) => { state.time = value; } });
    Object.defineProperty(node, 'paused', { configurable: true, get: () => state.paused });
    node.play = async () => { state.paused = false; node.dispatchEvent(new Event('play')); };
    node.pause = () => { state.paused = true; node.dispatchEvent(new Event('pause')); };
    node.dispatchEvent(new Event('loadedmetadata'));
  });
  return video;
}

async function controlsOpacity(page: Page) {
  return page.locator('.lightbox-video-controls').evaluate((node) => Number.parseFloat(getComputedStyle(node).opacity));
}

test('keyboard playback shortcuts stay chrome-free and pointer proximity reveals controls', async ({ page }) => {
  const video = await mockApp(page);
  const controls = page.locator('.lightbox-video-controls');
  const stage = page.locator('.viewer-stage');
  await page.waitForTimeout(2200);
  await expect.poll(() => controlsOpacity(page)).toBe(0);

  await stage.focus();
  await page.keyboard.press('Shift+ArrowRight');
  await expect.poll(() => video.evaluate((node) => node.currentTime)).toBe(35);
  await expect.poll(() => controlsOpacity(page)).toBe(0);

  await page.keyboard.press('Space');
  await expect.poll(() => video.evaluate((node) => node.paused)).toBe(false);
  await expect.poll(() => controlsOpacity(page)).toBe(0);

  const box = await stage.boundingBox();
  expect(box).not.toBeNull();
  await page.mouse.move(box!.x + box!.width / 2, box!.y + 20);
  await page.waitForTimeout(80);
  expect(await controlsOpacity(page)).toBe(0);
  await page.mouse.move(box!.x + box!.width / 2, box!.y + box!.height - 30);
  await expect.poll(() => controlsOpacity(page)).toBeGreaterThan(0.9);
});

test('seekbar drags live and clamps outside both ends', async ({ page }) => {
  const video = await mockApp(page);
  const progress = page.getByRole('button', { name: 'Seek video' });
  const box = await progress.boundingBox();
  expect(box).not.toBeNull();

  await page.mouse.move(box!.x + box!.width * 0.25, box!.y + box!.height / 2);
  await page.mouse.down();
  await page.mouse.move(box!.x + box!.width + 80, box!.y + box!.height / 2, { steps: 4 });
  await expect.poll(() => video.evaluate((node) => node.currentTime)).toBe(120);
  await page.mouse.move(box!.x - 80, box!.y + box!.height / 2, { steps: 4 });
  await expect.poll(() => video.evaluate((node) => node.currentTime)).toBe(0);
  await page.mouse.up();
});

test('fullscreen hides an inactive cursor except over player controls', async ({ page }) => {
  await mockApp(page);
  const stage = page.locator('.viewer-stage');
  await stage.focus();
  await page.keyboard.press('f');
  await expect.poll(() => stage.evaluate((node) => document.fullscreenElement === node)).toBe(true);

  const box = await stage.boundingBox();
  expect(box).not.toBeNull();
  await page.mouse.move(box!.x + box!.width / 2, box!.y + box!.height / 2);
  await page.waitForTimeout(1100);
  await expect.poll(() => stage.evaluate((node) => getComputedStyle(node).cursor)).toBe('none');

  const controls = page.locator('.lightbox-video-controls');
  const controlsBox = await controls.boundingBox();
  expect(controlsBox).not.toBeNull();
  await page.mouse.move(controlsBox!.x + controlsBox!.width / 2, controlsBox!.y + controlsBox!.height / 2);
  await page.waitForTimeout(1100);
  expect(await stage.evaluate((node) => getComputedStyle(node).cursor)).not.toBe('none');
});
''')
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm run check
          npm run test:unit
          npm run build
          npx playwright test tests/viewer-player-controls.spec.ts --project=chromium
      - name: Commit validated patch
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/lib/components/ViewerStage.svelte frontend/tests/viewer-player-controls.spec.ts; then
            exit 0
          fi
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/components/ViewerStage.svelte frontend/tests/viewer-player-controls.spec.ts
          git commit -m 'feat(viewer): refine player controls interactions'
          git push origin HEAD:maint/159-player-controls
