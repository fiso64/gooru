name: maint-159-player-controls

on:
  push:
    branches:
      - maint/159-player-controls

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/159-player-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/components/ViewerStage.svelte')
          s = p.read_text()
          if 'videoSeekPointerId' not in s:
              pairs = [
                ("  let playbackControlsIdle = $state(false);\n  let playbackControlsTimer: ReturnType<typeof setTimeout> | undefined;", "  let playbackControlsIdle = $state(false);\n  let playbackControlsTimer: ReturnType<typeof setTimeout> | undefined;\n  let videoSeekPointerId: number | undefined;\n  let cursorIdle = $state(false);\n  let cursorIdleTimer: ReturnType<typeof setTimeout> | undefined;"),
                ("      if (playbackControlsTimer) clearTimeout(playbackControlsTimer);\n    };", "      if (playbackControlsTimer) clearTimeout(playbackControlsTimer);\n      if (cursorIdleTimer) clearTimeout(cursorIdleTimer);\n    };"),
                ("    const syncFullscreen = () => {\n      isFullscreen = document.fullscreenElement === stage;\n      resize();\n    };", "    const syncFullscreen = () => {\n      isFullscreen = document.fullscreenElement === stage;\n      resize();\n      if (isFullscreen) scheduleCursorIdle();\n      else {\n        cursorIdle = false;\n        if (cursorIdleTimer) clearTimeout(cursorIdleTimer);\n        cursorIdleTimer = undefined;\n      }\n    };"),
                ("  async function togglePlayback() {\n    const media = videoElement ?? audioElement;\n    if (!media) return;\n    showPlaybackControls();\n    if (media.paused) await media.play();\n    else media.pause();\n  }", "  async function togglePlayback() {\n    const media = videoElement ?? audioElement;\n    if (!media) return;\n    if (media.paused) await media.play();\n    else media.pause();\n  }\n\n  function scheduleCursorIdle(event?: PointerEvent) {\n    cursorIdle = false;\n    if (cursorIdleTimer) clearTimeout(cursorIdleTimer);\n    cursorIdleTimer = undefined;\n    if (!isFullscreen) return;\n    const target = event?.target;\n    if (target instanceof Element && target.closest('.lightbox-video-controls')) return;\n    cursorIdleTimer = setTimeout(() => { cursorIdle = true; cursorIdleTimer = undefined; }, 1000);\n  }\n\n  function handleStagePointerMove(event: PointerEvent) {\n    scheduleCursorIdle(event);\n    if (renderedFile.media_kind !== 'video') return;\n    const rect = stageElement?.getBoundingClientRect();\n    if (!rect) return;\n    const revealDistance = Math.min(160, Math.max(80, rect.height * 0.22));\n    if (event.clientY >= rect.bottom - revealDistance) showPlaybackControls();\n  }\n\n  function handleControlsPointerEnter(event: PointerEvent) {\n    showPlaybackControls();\n    scheduleCursorIdle(event);\n  }"),
                ("  function handleViewerKeydown(event: KeyboardEvent) {\n    if (event.defaultPrevented || hasCommandModifier(event) || isEditableShortcutTarget(event.target)) return;\n    showPlaybackControls();", "  function handleViewerKeydown(event: KeyboardEvent) {\n    if (event.defaultPrevented || hasCommandModifier(event) || isEditableShortcutTarget(event.target)) return;"),
                ("  function seekVideo(event: MouseEvent) {\n    restoreStageFocusAfterPointer(event);\n    const video = videoElement;\n    if (!video || !videoLength) return;\n    const button = event.currentTarget;\n    if (!(button instanceof HTMLElement)) return;\n    const rect = button.getBoundingClientRect();\n    if (!rect.width) return;\n    video.currentTime = Math.max(0, Math.min(videoLength, ((event.clientX - rect.left) / rect.width) * videoLength));\n    syncVideo();\n  }", "  function seekVideoAt(clientX: number, control: HTMLElement) {\n    const video = videoElement;\n    if (!video || !videoLength) return;\n    const rect = control.getBoundingClientRect();\n    if (!rect.width) return;\n    video.currentTime = Math.max(0, Math.min(videoLength, ((clientX - rect.left) / rect.width) * videoLength));\n    syncVideo();\n  }\n\n  function seekVideo(event: MouseEvent) {\n    restoreStageFocusAfterPointer(event);\n    const control = event.currentTarget;\n    if (control instanceof HTMLElement) seekVideoAt(event.clientX, control);\n  }\n\n  function beginVideoSeek(event: PointerEvent) {\n    if (event.button !== 0) return;\n    const control = event.currentTarget;\n    if (!(control instanceof HTMLElement)) return;\n    event.preventDefault();\n    restoreStageFocusAfterPointer(event);\n    videoSeekPointerId = event.pointerId;\n    control.setPointerCapture(event.pointerId);\n    seekVideoAt(event.clientX, control);\n  }\n\n  function dragVideoSeek(event: PointerEvent) {\n    if (videoSeekPointerId !== event.pointerId) return;\n    const control = event.currentTarget;\n    if (control instanceof HTMLElement) seekVideoAt(event.clientX, control);\n  }\n\n  function endVideoSeek(event: PointerEvent) {\n    if (videoSeekPointerId !== event.pointerId) return;\n    const control = event.currentTarget;\n    if (control instanceof HTMLElement) {\n      seekVideoAt(event.clientX, control);\n      if (control.hasPointerCapture(event.pointerId)) control.releasePointerCapture(event.pointerId);\n    }\n    videoSeekPointerId = undefined;\n  }"),
                ("<div bind:this={stageElement} class:fullscreen={isFullscreen} class:waiting={waitingForTarget} class=\"lightbox-stage viewer-stage\" tabindex=\"-1\" aria-busy={waitingForTarget} onpointermove={showPlaybackControls}>", "<div bind:this={stageElement} class:fullscreen={isFullscreen} class:waiting={waitingForTarget} class:cursor-idle={isFullscreen && cursorIdle} class=\"lightbox-stage viewer-stage\" tabindex=\"-1\" aria-busy={waitingForTarget} onpointermove={handleStagePointerMove}>"),
                ("    <div class=\"lightbox-video-controls\" class:is-idle={playbackControlsIdle} onpointerenter={showPlaybackControls} onfocusin={showPlaybackControls}>", "    <div class=\"lightbox-video-controls\" class:is-idle={playbackControlsIdle} onpointerenter={handleControlsPointerEnter} onfocusin={showPlaybackControls}>"),
                ("      <button class=\"video-progress\" type=\"button\" aria-label=\"Seek video\" onclick={seekVideo}>", "      <button class=\"video-progress\" type=\"button\" aria-label=\"Seek video\" onclick={seekVideo} onpointerdown={beginVideoSeek} onpointermove={dragVideoSeek} onpointerup={endVideoSeek} onpointercancel={endVideoSeek}>"),
                ("  :global(.viewer-stage:fullscreen) {\n    width: 100vw;\n    height: 100vh;\n    background: #000;\n  }", "  :global(.viewer-stage:fullscreen) {\n    width: 100vw;\n    height: 100vh;\n    background: #000;\n  }\n\n  :global(.viewer-stage:fullscreen.cursor-idle) {\n    cursor: none;\n  }")
              ]
              for old, new in pairs:
                  if old not in s: raise SystemExit('missing expected fragment: ' + old[:70])
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Install and validate
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check
          npm run test:unit
          npm run build
          npx playwright test tests/viewer-player-controls.spec.ts --project=chromium
      - name: Persist validated implementation
        run: |
          if git diff --quiet -- frontend/src/lib/components/ViewerStage.svelte; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/components/ViewerStage.svelte
          git commit -m 'feat(viewer): refine player control interactions'
          git push origin HEAD:maint/159-player-controls
