name: Patch 285 viewer shortcuts

on:
  push:
    branches:
      - feat/285-viewer-shortcut-hints

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply focused source and regression changes
        run: node .github/patch-285.mjs
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/components/PreviewDialog.svelte frontend/src/lib/components/ShortcutsView.svelte frontend/tests/viewer-shortcuts.spec.ts
          git commit -m 'feat(webui): add viewer original-media shortcut hints'
          git push origin HEAD:feat/285-viewer-shortcut-hints
