name: Temporary PR 381 Self-Hosted Repair

on:
  push:
    branches:
      - fix/349-selection-snapshots

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/349-selection-snapshots
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply repair from temporary source workflow
        shell: bash
        run: |
          awk '/python3 <<'"'"'PY'"'"'/{capture=1; next} /^          PY$/{capture=0} capture { sub(/^          /, ""); print }' .github/workflows/tmp-381-repair.yml > /tmp/pr381-repair.py
          test -s /tmp/pr381-repair.py
          python3 /tmp/pr381-repair.py
          gofmt -w internal/serve/browse.go internal/serve/file_selections.go internal/serve/file_selections_test.go internal/serve/server.go gooru/query.go internal/database/database.go
          git config user.name "chatgpt-codex-connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/components/AuthenticatedApp.svelte internal/serve/server.go internal/serve/browse.go internal/serve/file_selections.go internal/serve/file_selections_test.go gooru/query.go internal/database/database.go
          git commit -m "fix(selection): bound immutable snapshot resources"
          git push origin HEAD:fix/349-selection-snapshots

      - name: Go tests
        run: go test ./internal/database ./gooru ./internal/serve

      - name: Frontend install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit

      - name: Frontend check
        working-directory: frontend
        run: npm run check

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Selection browser regression
        working-directory: frontend
        run: npm run test:e2e -- selection-ui-modal.spec.ts

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Remove temporary workflows
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/tmp-381-repair.yml .github/workflows/tmp-381-selfhosted.yml
          git commit -m "ci: remove temporary PR 381 validation workflows"
          git push origin HEAD:fix/349-selection-snapshots
