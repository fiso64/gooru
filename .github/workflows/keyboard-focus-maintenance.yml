name: Keyboard focus maintenance

on:
  push:
    branches: [feat/21-keyboard-grid-focus]

permissions:
  contents: write

jobs:
  complete-and-validate:
    if: "${{ github.event.head_commit.message != 'feat(ui): wire keyboard focus shortcuts' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/21-keyboard-grid-focus
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Complete scoped keyboard shortcuts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected snippet in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace('frontend/src/lib/utils/keyboard.ts',
              'export function hasCommandModifier(event: KeyboardEvent) {\n  return event.altKey || event.ctrlKey || event.metaKey;\n}\n',
              '''export function hasCommandModifier(event: KeyboardEvent) {\n  return event.altKey || event.ctrlKey || event.metaKey;\n}\n\nexport type LibraryShortcutAction = 'select-all' | 'tag-selected' | 'untag-selected' | null;\n\nexport function libraryShortcutAction(key: string, selectedCount: number): LibraryShortcutAction {\n  switch (key.toLowerCase()) {\n    case 'a': return 'select-all';\n    case 't': return selectedCount > 0 ? 'tag-selected' : null;\n    case 'u': return selectedCount > 0 ? 'untag-selected' : null;\n    default: return null;\n  }\n}\n''')

          replace('frontend/src/lib/utils/keyboard.test.ts',
              "import { isEditableShortcutTarget, isInteractiveShortcutTarget } from './keyboard';",
              "import { isEditableShortcutTarget, isInteractiveShortcutTarget, libraryShortcutAction } from './keyboard';")
          replace('frontend/src/lib/utils/keyboard.test.ts',
              "});\n",
              """\n  it('maps library action shortcuts without enabling tag actions for an empty selection', () => {\n    expect(libraryShortcutAction('a', 0)).toBe('select-all');\n    expect(libraryShortcutAction('A', 3)).toBe('select-all');\n    expect(libraryShortcutAction('t', 2)).toBe('tag-selected');\n    expect(libraryShortcutAction('u', 2)).toBe('untag-selected');\n    expect(libraryShortcutAction('t', 0)).toBeNull();\n    expect(libraryShortcutAction('u', 0)).toBeNull();\n  });\n});\n""",)

          p = Path('frontend/src/lib/components/AuthenticatedApp.svelte')
          text = p.read_text()
          text = text.replace("  import { errorMessage } from '$lib/utils/format';\n", "  import { errorMessage } from '$lib/utils/format';\n  import { hasCommandModifier, isEditableShortcutTarget, libraryShortcutAction } from '$lib/utils/keyboard';\n", 1)
          old = '''  function isTypingTarget(target: EventTarget | null) {\n    if (!(target instanceof HTMLElement)) return false;\n    return target.isContentEditable || target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT';\n  }\n\n  function handleKeydown(event: KeyboardEvent) {\n    const shortcutsKey = event.key === '?' || (event.code === 'Slash' && event.shiftKey);\n    if (shortcutsKey && !event.altKey && !event.ctrlKey && !event.metaKey && !isTypingTarget(event.target)) {\n      event.preventDefault();\n      setRoute('shortcuts');\n      return;\n    }\n    library.handleKeydown(event, loadedFiles);\n  }\n'''
          new = '''  function handleKeydown(event: KeyboardEvent) {\n    if (event.defaultPrevented) return;\n    const editable = isEditableShortcutTarget(event.target);\n    const modified = hasCommandModifier(event);\n    const shortcutsKey = event.key === '?' || (event.code === 'Slash' && event.shiftKey);\n    if (shortcutsKey && !modified && !editable) {\n      event.preventDefault();\n      setRoute('shortcuts');\n      return;\n    }\n\n    if (!modified && !editable && library.route === 'library' && !library.activeFile && actionDialog.kind === 'none') {\n      const action = libraryShortcutAction(event.key, selectedCount);\n      if (action) {\n        event.preventDefault();\n        if (action === 'select-all') library.selectAll();\n        else if (action === 'tag-selected') bulkTagSelected();\n        else bulkUntagSelected();\n        return;\n      }\n    }\n\n    library.handleKeydown(event, loadedFiles);\n  }\n'''
          if old not in text:
              raise SystemExit('missing AuthenticatedApp key handler')
          text = text.replace(old, new, 1)
          text = text.replace('              Select all\n', '              Select <u>a</u>ll\n', 1)
          p.write_text(text)

          p = Path('frontend/src/lib/components/PreviewDialog.svelte')
          text = p.read_text()
          text = text.replace("  import { hasCommandModifier, isInteractiveShortcutTarget } from '$lib/utils/keyboard';", "  import { hasCommandModifier, isEditableShortcutTarget, isInteractiveShortcutTarget } from '$lib/utils/keyboard';", 1)
          old = '''  function handlePlaybackKeydown(event: KeyboardEvent) {\n    if (event.defaultPrevented || hasCommandModifier(event) || event.code !== 'Space') return;\n\n    // A modal owns shortcuts even if focus accidentally remains on the control\n    // that opened it. Only native controls *inside* this preview get to keep Space.\n    const target = event.target;\n    const targetInsidePreview = target instanceof Node && Boolean(dialogElement?.contains(target));\n    if (targetInsidePreview && isInteractiveShortcutTarget(target)) return;\n\n    event.preventDefault();\n    event.stopPropagation();\n    if (videoElement || audioElement) void togglePlayback();\n    else dialogElement?.focus({ preventScroll: true });\n  }\n'''
          new = '''  function handleViewerKeydown(event: KeyboardEvent) {\n    if (event.defaultPrevented || hasCommandModifier(event)) return;\n\n    if (event.key.toLowerCase() === 't' && !isEditableShortcutTarget(event.target)) {\n      event.preventDefault();\n      event.stopPropagation();\n      focusTagInput();\n      return;\n    }\n\n    if (event.code !== 'Space') return;\n\n    // A modal owns shortcuts even if focus accidentally remains on the control\n    // that opened it. Only native controls *inside* this preview get to keep Space.\n    const target = event.target;\n    const targetInsidePreview = target instanceof Node && Boolean(dialogElement?.contains(target));\n    if (targetInsidePreview && isInteractiveShortcutTarget(target)) return;\n\n    event.preventDefault();\n    event.stopPropagation();\n    if (videoElement || audioElement) void togglePlayback();\n    else dialogElement?.focus({ preventScroll: true });\n  }\n'''
          if old not in text:
              raise SystemExit('missing PreviewDialog playback handler')
          text = text.replace(old, new, 1)
          text = text.replace('<svelte:window onkeydown={handlePlaybackKeydown} />', '<svelte:window onkeydown={handleViewerKeydown} />', 1)
          p.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate
        run: |
          go build ./...
          go test ./...
          cd frontend
          npm run test:unit
          npm run check
          npm run build
      - name: Commit completed implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/utils/keyboard.ts frontend/src/lib/utils/keyboard.test.ts frontend/src/lib/components/AuthenticatedApp.svelte frontend/src/lib/components/PreviewDialog.svelte
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(ui): wire keyboard focus shortcuts"
          git push origin HEAD:feat/21-keyboard-grid-focus
