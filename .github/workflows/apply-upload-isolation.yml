name: apply-upload-isolation
on:
  push:
    branches:
      - fix/21-upload-batch-error-isolation

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.head_commit.message == 'ci: apply upload batch isolation patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/21-upload-batch-error-isolation
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply focused patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('internal/serve/uploads.go')
          text = path.read_text()

          replacements = [
              (
                  '''type StagedUpload struct {\n\tName         string\n\tPath         string\n\tAnalysisPath string\n\tSize         int64\n\tTargetID     string\n\tStatus       string\n}''',
                  '''type StagedUpload struct {\n\tName         string\n\tPath         string\n\tAnalysisPath string\n\tSize         int64\n\tTargetID     string\n\tStatus       string\n\tError        string\n}'''
              ),
              (
                  '''\tsaved, err := s.saveUploadedFiles(target, files, conflictPolicy)\n\tif err != nil {\n\t\tif errors.Is(err, errUploadTooLarge) {\n\t\t\twriteError(w, http.StatusRequestEntityTooLarge, "payload_too_large", err.Error(), uploadErrorDetails(err))\n\t\t\treturn\n\t\t}\n\t\twriteError(w, http.StatusBadRequest, "invalid_request", err.Error(), uploadErrorDetails(err))\n\t\treturn\n\t}\n''',
                  '''\tsaved, err := s.saveUploadedFiles(target, files, conflictPolicy)\n\tif err != nil {\n\t\tif errors.Is(err, errUploadTooLarge) {\n\t\t\twriteError(w, http.StatusRequestEntityTooLarge, "payload_too_large", err.Error(), uploadErrorDetails(err))\n\t\t\treturn\n\t\t}\n\t\twriteError(w, http.StatusBadRequest, "invalid_request", err.Error(), uploadErrorDetails(err))\n\t\treturn\n\t}\n\tif len(saved) == 1 && saved[0].status == "error" && saved[0].error == errUploadTooLarge.Error() {\n\t\tfileErr := uploadFileError{name: saved[0].name, err: errUploadTooLarge}\n\t\twriteError(w, http.StatusRequestEntityTooLarge, "payload_too_large", fileErr.Error(), uploadErrorDetails(fileErr))\n\t\treturn\n\t}\n'''
              ),
              (
                  '''\tstatus          string\n\treplace         bool\n}''',
                  '''\tstatus          string\n\terror           string\n\treplace         bool\n}'''
              ),
              (
                  '''\t\tif copyErr != nil || closeErr != nil {\n\t\t\t_ = os.Remove(tmpPath)\n\t\t\tremoveSavedUploads(saved)\n\t\t\tif copyErr != nil {\n\t\t\t\treturn nil, uploadFileError{name: name, err: copyErr}\n\t\t\t}\n\t\t\treturn nil, uploadFileError{name: name, err: fmt.Errorf("failed to write uploaded file")}\n\t\t}\n''',
                  '''\t\tif copyErr != nil || closeErr != nil {\n\t\t\t_ = os.Remove(tmpPath)\n\t\t\tif errors.Is(copyErr, errUploadTooLarge) {\n\t\t\t\tsaved = append(saved, savedUpload{name: name, size: header.Size, targetID: target.ID, status: "error", error: copyErr.Error()})\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tremoveSavedUploads(saved)\n\t\t\tif copyErr != nil {\n\t\t\t\treturn nil, uploadFileError{name: name, err: copyErr}\n\t\t\t}\n\t\t\treturn nil, uploadFileError{name: name, err: fmt.Errorf("failed to write uploaded file")}\n\t\t}\n'''
              ),
              (
                  '''\t\tif file.status == "skipped" {\n\t\t\tcontinue\n\t\t}\n''',
                  '''\t\tif file.status == "skipped" || file.status == "error" {\n\t\t\tcontinue\n\t\t}\n'''
              ),
              (
                  '''\t\tout = append(out, StagedUpload{Name: file.name, Path: path, AnalysisPath: path, Size: file.size, TargetID: file.targetID, Status: file.status})\n''',
                  '''\t\tout = append(out, StagedUpload{Name: file.name, Path: path, AnalysisPath: path, Size: file.size, TargetID: file.targetID, Status: file.status, Error: file.error})\n'''
              ),
              (
                  '''\tfor _, file := range files {\n\t\tdto := UploadedFileDTO{Name: file.Name, Size: file.Size, TargetID: file.TargetID}\n\t\tif file.Status == "skipped" {\n''',
                  '''\tfor _, file := range files {\n\t\tdto := UploadedFileDTO{Name: file.Name, Size: file.Size, TargetID: file.TargetID}\n\t\tif file.Status == "error" {\n\t\t\tdto.Status = "error"\n\t\t\tdto.Error = file.Error\n\t\t\tresponse.Files = append(response.Files, dto)\n\t\t\tcontinue\n\t\t}\n\t\tif file.Status == "skipped" {\n'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'uploads.go replacement matched {count} times: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path('internal/serve/uploads_test.go')
          tests = test_path.read_text()
          old_test = '''func TestUploadCleansEarlierFilesWhenBatchFails(t *testing.T) {\n\tdir := t.TempDir()\n\tserver := newUploadTestServer(t, dir, true, &recordingUploadLibrary{})\n\tserver.cfg.Uploads.MaxFileSizeBytes = 3\n\trec := httptest.NewRecorder()\n\n\tserver.Handler().ServeHTTP(rec, uploadRequest(t, map[string]string{\n\t\t"a.txt": "ok",\n\t\t"b.txt": "too-large",\n\t}, nil))\n\n\tassertAPIError(t, rec, http.StatusRequestEntityTooLarge, "payload_too_large")\n\tif entries, err := os.ReadDir(dir); err != nil || len(entries) != 0 {\n\t\tt.Fatalf("failed batch should not leave uploaded files, entries=%v err=%v", entries, err)\n\t}\n}\n'''
          new_test = '''func TestUploadIsolatesOversizedFileWithinBatch(t *testing.T) {\n\tdir := t.TempDir()\n\tserver := newUploadTestServer(t, dir, true, &recordingUploadLibrary{})\n\tserver.cfg.Uploads.MaxFileSizeBytes = 3\n\trec := httptest.NewRecorder()\n\n\tserver.Handler().ServeHTTP(rec, uploadRequest(t, map[string]string{\n\t\t"a.txt": "ok",\n\t\t"b.txt": "too-large",\n\t}, nil))\n\n\tif rec.Code != http.StatusOK {\n\t\tt.Fatalf("expected 200, got %d: %s", rec.Code, rec.Body.String())\n\t}\n\tvar response UploadImportResponse\n\tif err := json.NewDecoder(rec.Body).Decode(&response); err != nil {\n\t\tt.Fatalf("decode response: %v", err)\n\t}\n\tbyName := make(map[string]UploadedFileDTO, len(response.Files))\n\tfor _, file := range response.Files {\n\t\tbyName[file.Name] = file\n\t}\n\tif byName["a.txt"].Status != "imported" {\n\t\tt.Fatalf("valid sibling should import, got %+v", byName)\n\t}\n\tif byName["b.txt"].Status != "error" || byName["b.txt"].Error != errUploadTooLarge.Error() {\n\t\tt.Fatalf("oversized member should fail independently, got %+v", byName)\n\t}\n\tif got := string(mustReadFile(t, filepath.Join(dir, "a.txt"))); got != "ok" {\n\t\tt.Fatalf("valid sibling was not retained: %q", got)\n\t}\n\tif _, err := os.Stat(filepath.Join(dir, "b.txt")); !os.IsNotExist(err) {\n\t\tt.Fatalf("oversized member should not be retained, err=%v", err)\n\t}\n}\n'''
          if tests.count(old_test) != 1:
              raise SystemExit('batch regression test replacement did not match exactly once')
          tests = tests.replace(old_test, new_test, 1)

          old_recording = '''\t\tresponse.Files = append(response.Files, UploadedFileDTO{Name: file.Name, Size: file.Size, TargetID: file.TargetID, Status: status})\n'''
          new_recording = '''\t\tresponse.Files = append(response.Files, UploadedFileDTO{Name: file.Name, Size: file.Size, TargetID: file.TargetID, Status: status, Error: file.Error})\n'''
          if tests.count(old_recording) != 1:
              raise SystemExit('recording importer replacement did not match exactly once')
          tests = tests.replace(old_recording, new_recording, 1)
          test_path.write_text(tests)
          PY
          gofmt -w internal/serve/uploads.go internal/serve/uploads_test.go
      - name: Focused upload tests
        run: go test ./internal/serve -run 'Upload' -count=1
      - name: Full Go tests
        run: go test ./...
      - name: Commit validated patch
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/serve/uploads.go internal/serve/uploads_test.go
          git commit -m 'fix(upload): isolate oversized files within batches [patch-applied]'
          git push origin HEAD:fix/21-upload-batch-error-isolation
