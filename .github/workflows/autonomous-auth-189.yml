name: autonomous auth 189 validation

on:
  push:
    branches:
      - fix/189-revoke-sessions-on-password-change

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test auth package
        run: go test ./internal/serve
      - name: Race test auth package
        run: go test -race ./internal/serve
