name: Temporary namespace suggestion validation

on:
  push:
    branches:
      - perf/333-namespace-suggestions-summary

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch namespace suggestion query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/database/database.go')
          text = path.read_text()
          start = text.index('func (s *Store) ListNamespaceSuggestions')
          end = text.index('func (s *Store) ListTagValueSuggestions', start)
          block = text[start:end]
          old = "SELECT key || ':' AS tag_str, SUM(files_count) AS total_files\n\t\tFROM tags\n\t\tWHERE value != '' AND lower(key) LIKE ?\n\t\tGROUP BY key\n\t\tORDER BY total_files DESC, tag_str ASC"
          new = "SELECT key || ':' AS tag_str, files_count\n\t\tFROM tag_key_counts\n\t\tWHERE files_count > 0 AND lower(key) LIKE ?\n\t\tORDER BY files_count DESC, tag_str ASC"
          if block.count(old) != 1:
              raise SystemExit('expected one namespace aggregation')
          path.write_text(text[:start] + block.replace(old, new) + text[end:])
          PY
          gofmt -w internal/database/database.go internal/database/namespace_suggestions_test.go
      - name: Validate database package
        run: go test ./internal/database
      - name: Validate browse integration
        run: go test ./internal/serve
      - name: Commit validated change and remove temporary workflow
        run: |
          rm .github/workflows/tmp-namespace-suggestions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/database/database.go internal/database/namespace_suggestions_test.go .github/workflows/tmp-namespace-suggestions.yml
          git commit -m "perf(db): serve namespace suggestions from summary"
          git push origin HEAD:perf/333-namespace-suggestions-summary
