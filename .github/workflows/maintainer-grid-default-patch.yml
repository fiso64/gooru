name: Maintainer grid default patch

on:
  push:
    branches:
      - feat/278-grid-layout-types
    paths:
      - .github/workflows/maintainer-grid-default-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/278-grid-layout-types
      - name: Apply exact default/documentation edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('internal/serve/config.go'): [
                  ('DefaultGridSize      = 180', 'DefaultGridSize      = 200'),
              ],
              Path('docs/CONFIG.md'): [
                  ('| `ui.grid_size` | `180` | Target gallery cell size in pixels. Must be between `64` and `1024`. In `square` and `fit` modes it controls square cell width; in `tile` mode it controls the target justified-row height. |',
                   '| `ui.grid_size` | `200` | Base gallery cell size in pixels. Must be between `64` and `1024`. `fit` uses this value directly; `square` and `tile` receive a fixed 40px layout boost, so the default effective square width / tile row target is 240px. |'),
                  ('  grid_size: 180\n', '  grid_size: 200\n'),
              ],
          }
          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          git diff --check
          git diff --exit-code --quiet && { echo 'expected patch produced no changes' >&2; exit 1; } || true
      - name: Commit patch
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add internal/serve/config.go docs/CONFIG.md
          git commit -m "fix(ui): raise default gallery size"
          git push origin HEAD:feat/278-grid-layout-types
