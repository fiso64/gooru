name: Temporary Common tags header validation

on:
  push:
    branches:
      - fix/113-common-tags-header-toggle

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/113-common-tags-header-toggle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply header interaction fix and regression
        run: echo '' | base64 -d | python3
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Static check
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser regression
        working-directory: frontend
        run: npx playwright test tests/common-tags-sidebar.spec.ts --project=chromium
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-113-header-toggle.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sidebar): make Common tags header toggle visible"
          git push origin HEAD:fix/113-common-tags-header-toggle
