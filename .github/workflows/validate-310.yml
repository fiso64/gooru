name: Validate 310

on:
  push:
    branches:
      - fix/310-viewport-anchor
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-310-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Page-turn regression
    runs-on: [self-hosted, gooru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply patch helper once
        run: |
          python scripts/patch_310_keyset.py
          if git diff --quiet; then
            exit 0
          fi
          gofmt -w types/types.go internal/serve/pagination.go internal/serve/browse.go internal/serve/browse_test.go
          git config user.name "Gooru Maintainer"
          git config user.email "64778819+fiso64@users.noreply.github.com"
          git add types/types.go internal/serve/pagination.go internal/serve/browse.go internal/serve/browse_test.go
          git commit -m "fix: stabilize file pagination across library updates"
          git push origin HEAD:fix/310-viewport-anchor
      - name: Go regression
        run: go test ./internal/serve ./gooru
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit
      - name: Frontend check
        working-directory: frontend
        run: npm run check
      - name: Focused Chromium regression
        working-directory: frontend
        run: npx playwright test tests/grid-page-turn-regression.spec.ts tests/grid-scroll-performance.spec.ts --project=chromium
