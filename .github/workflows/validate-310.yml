name: Validate 310

on:
  push:
    branches:
      - fix/310-viewport-anchor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-310-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend page-turn regression
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Check
        run: npm run check
      - name: Focused Chromium regression
        run: npx playwright test tests/grid-scroll-performance.spec.ts --project=chromium
