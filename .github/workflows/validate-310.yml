name: Validate #310

on:
  push:
    branches:
      - fix/310-stable-infinite-grid

permissions:
  contents: read

jobs:
  frontend:
    runs-on: [self-hosted, gooru]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Check
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Focused grid regression
        run: |
          CHROME="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$CHROME" ]; then
            echo "No system Chromium found on runner" >&2
            exit 1
          fi
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$CHROME" npm run test:e2e -- grid-scroll-performance.spec.ts
