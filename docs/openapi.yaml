openapi: 3.1.0
info:
  title: Gooru Serve API
  version: 0.1.0
  description: Initial API contract for the gooru serve web application stack.
servers:
  - url: /api/v1
paths:
  /build:
    get:
      summary: Get running build identity.
      responses:
        "200":
          description: Running server version and source revision.
          content:
            application/json:
              schema:
                type: object
                required: [version, revision, dirty, development]
                properties:
                  version:
                    type: string
                  revision:
                    type: string
                  dirty:
                    type: boolean
                  development:
                    type: boolean
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /auth/login:
    post:
      summary: Create a DB-backed browser session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated user, capabilities, CSRF token, and HttpOnly session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      summary: Revoke the current session and clear its cookie.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/me:
    get:
      summary: Return the current user, capabilities, and a fresh CSRF token.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Current session details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/change-password:
    post:
      summary: Change the current user's password.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /file-selections:
    post:
      summary: Create an immutable snapshot of the files matching a library query.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileSelectionCreateRequest"
      responses:
        "201":
          description: Immutable file selection snapshot created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileSelectionCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /file-selections/{id}:
    delete:
      summary: Release an immutable file selection snapshot.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204":
          description: Snapshot released or already absent.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /file-selections/{id}/members:
    post:
      summary: Return which candidate file IDs belong to an immutable selection snapshot.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileSelectionMembersRequest"
      responses:
        "200":
          description: Candidate IDs that are members of the snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileSelectionMembersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          description: Selection snapshot expired or is no longer available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /file-downloads:
    post:
      summary: Prepare a short-lived bulk download for a selected set of files.
      description: Creates an owner-scoped download ticket for either explicit file IDs or an immutable selection snapshot with include/exclude deltas. The ticket is then consumed through the streaming GET endpoint so browsers do not need to buffer the ZIP in JavaScript.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileDownloadRequest"
      responses:
        "201":
          description: Bulk download ticket created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDownloadCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          description: Referenced selection snapshot expired or is no longer available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /file-downloads/{id}:
    get:
      summary: Stream a prepared selected-file download.
      description: Streams a single selected original with the same semantics as the per-file download endpoint. Selections of two or more files stream directly into a ZIP using stored entries (no compression). ZIP archives are generated incrementally and may omit Content-Length.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A direct original response for one selected file, or a streaming ZIP archive for multiple selected files.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          description: Download ticket or referenced selection snapshot expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /files:
    get:
      summary: List tracked files for browser grids.
      security:
        - sessionAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: page_token
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [added, name, modified, size, kind]
            default: added
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: include_facets
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Page of tracked files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Untrack or physically delete a selected set of files.
      description: Accepts the same explicit-ID or query-with-exclusions selector used by bulk UI actions. Strict physical deletion is accepted only when every selected file is inside configured upload targets. After explicit confirmation, delete_or_untrack deletes managed files while only untracking files outside configured upload targets.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileRemovalRequest"
      responses:
        "200":
          description: Selected file locations were removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRemovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Physical deletion was requested for a selection containing files outside configured upload targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /files/search:
    post:
      summary: Search tracked files with query state in the request body.
      description: Read-only alternative to GET /files for clients that must keep free-form library query text out of browser/proxy URL histories. Uses the same search service and pagination semantics as GET /files.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileSearchRequest"
      responses:
        "200":
          description: Page of tracked files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /files/{id}:
    get:
      summary: Get one tracked file by opaque file ID.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tracked file details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Untrack a file location or delete managed uploaded content.
      description: Untrack removes only the selected database location. Delete also removes the underlying file, but is accepted only for paths inside configured upload targets.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [untrack, delete]
                  default: untrack
      responses:
        "200":
          description: File location was untracked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteFileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Physical deletion was requested for a file outside configured upload targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /files/{id}/thumbnail:
    get:
      summary: Get a cacheable thumbnail for a tracked file.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
          description: Requested thumbnail size. Must be one of the configured thumbnail_sizes values.
      responses:
        "200":
          description: Thumbnail image derivative.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Gooru-Cache:
              schema:
                type: string
                enum: [hit, miss]
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
  /files/{id}/preview:
    get:
      summary: Get a cacheable preview derivative for a tracked file.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preview image derivative.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Gooru-Cache:
              schema:
                type: string
                enum: [hit, miss]
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
  /files/{id}/lossless:
    get:
      summary: Get the optional lossless baseline JPEG display derivative of a tracked progressive JPEG.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lossless JPEG display derivative retaining APP/COM metadata.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /files/{id}/pdf:
    get:
      summary: Get a PDF page manifest or a rendered page image for a tracked PDF.
      description: When page is omitted, returns the bounded document page count and a URL prefix for page images. When page is supplied, returns a PNG raster of that page. Requires Poppler pdfinfo and pdftoppm on the server; logical media sources are used in protected mode. Responses are private and not stored by browsers in protected mode.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: One-based page number; omitting it requests the manifest.
          schema:
            type: integer
            minimum: 1
            maximum: 10000
      responses:
        "200":
          description: PDF page manifest when page is omitted, or a PNG image when page is present.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Gooru-Cache:
              description: Present for rendered page responses.
              schema:
                type: string
                enum: [hit, miss]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PDFDocumentManifest"
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{id}/content:
    get:
      summary: Stream original content for a tracked file.
      description: Supports HTTP range requests for browser audio and video seeking.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        "200":
          description: Full original file content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial original file content.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    head:
      summary: Get original content metadata for a tracked file.
      description: Returns the same original-media headers and range semantics as GET without a response body.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        "200":
          description: Original file metadata.
        "206":
          description: Partial original file metadata.
          headers:
            Content-Range:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{id}/download:
    get:
      summary: Download original content for a tracked file.
      description: Streams original media with an attachment content disposition and range support.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full original file download.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial original file download.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    head:
      summary: Get original download metadata for a tracked file.
      description: Returns the same attachment and range headers as GET without a response body.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Original file download metadata.
          headers:
            Content-Disposition:
              schema:
                type: string
        "206":
          description: Partial original file download metadata.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /comics/{id}:
    get:
      summary: List naturally ordered image pages in a CBZ comic.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comic page manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
  /comics/{id}/{page}:
    get:
      summary: Stream one naturally ordered image page from a CBZ comic.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Requested comic page image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
  /files/tags:
    post:
      summary: Add tags to selected files.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PreferAsync"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagMutationRequest"
      responses:
        "200":
          $ref: "#/components/responses/TagMutation"
        "202":
          $ref: "#/components/responses/AsyncOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      summary: Replace tags on selected files.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PreferAsync"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagMutationRequest"
      responses:
        "200":
          $ref: "#/components/responses/TagMutation"
        "202":
          $ref: "#/components/responses/AsyncOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      summary: Remove tags from selected files.
      description: If tags is empty, all tags are removed from the selected files.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PreferAsync"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagMutationRequest"
      responses:
        "200":
          $ref: "#/components/responses/TagMutation"
        "202":
          $ref: "#/components/responses/AsyncOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /ui-state:
    post:
      summary: Seal WebUI library state into an opaque protected-mode token
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserURLState'
      responses:
        '201':
          description: Protected state token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /ui-state/{token}:
    get:
      summary: Resolve an opaque protected-mode WebUI state token
      security:
        - cookieAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Restored library state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserURLState'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Protected state token expired
  /upload-targets:
    get:
      summary: List configured upload targets.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Configured upload targets without filesystem paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTargetsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /uploads:
    post:
      summary: Upload files into a configured upload target and import them.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PreferAsync"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                added_at_strategy:
                  type: string
                  enum: [queue, reverse_queue, modtime]
                  description: Override the selected upload target's added-at strategy for this submission.
                queue_time_ms:
                  type: array
                  items: { type: integer, format: int64 }
                  description: Client-captured queue timestamps in Unix milliseconds, one per file.
                queue_first_time_ms:
                  type: integer
                  format: int64
                  description: Earliest client-captured queue timestamp in this submission; used with `queue_last_time_ms` to reverse queues consistently across one-file async worker requests.
                queue_last_time_ms:
                  type: integer
                  format: int64
                  description: Latest client-captured queue timestamp in this submission; used with `queue_first_time_ms` to reverse queues consistently across one-file async worker requests.
                queue_index:
                  type: array
                  items: { type: integer, minimum: 0 }
                  description: Stable queue indexes, one per file.
                queue_total:
                  type: array
                  items: { type: integer, minimum: 1 }
                  description: Queue batch size, one per file.
                source_modtime_ms:
                  type: array
                  description: Source modification timestamps in Unix milliseconds, in the same order as `files`. Invalid or missing entries are treated as unavailable.
                  items:
                    type: integer
                    format: int64
                target_id:
                  type: string
                  description: Configured upload target ID. Defaults to the first configured target.
                conflict_policy:
                  type: string
                  enum: [rename, error]
                  default: rename
                  description: How to handle a requested filename that already exists in the target; omitted values default to rename, while error rejects the request on a path collision.
                tags:
                  type: string
                  description: Space- or comma-separated fallback initial tags applied to files that do not provide item_tags.
                item_tags:
                  type: array
                  items:
                    type: string
                  description: Per-file initial tag strings aligned with files. Each entry accepts space- or comma-separated tags; an explicit empty entry means no tags for that file and suppresses fallback tags. Omit item_tags entirely to apply fallback tags to every file.
      responses:
        "200":
          description: Synchronous upload/import result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadImportResponse"
        "202":
          $ref: "#/components/responses/AsyncOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tags:
    get:
      summary: List known tags.
      security:
        - sessionAuth: []
      parameters:
        - name: counts
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Maximum tags to return. Defaults to 200 and is capped at 500.
          schema:
            type: integer
            default: 200
            maximum: 500
      responses:
        "200":
          description: Tags, optionally with counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tags/namespaces:
    get:
      summary: List tag namespaces.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Known tag namespaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespacesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /search/suggestions:
    post:
      summary: Return search suggestions with free-form query state in the request body.
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionRequest"
      responses:
        "200":
          description: Search suggestions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      summary: Return tag autocomplete suggestions.
      security:
        - sessionAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Current token prefix. Use namespace:value prefixes such as `kind:` for value suggestions.
        - name: existing
          in: query
          required: false
          schema:
            type: string
          description: Existing query expression; already-present tags are filtered from suggestions when parseable.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Matching tag suggestions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /saved-searches:
    get:
      summary: List saved searches for the current user.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Current user's saved searches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearchesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a saved search for the current user.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchRequest"
      responses:
        "201":
          description: Saved search created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /saved-searches/reorder:
    put:
      summary: Replace the saved-search order for the current user.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchReorderRequest"
      responses:
        "200":
          description: Saved-search order replaced.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /saved-searches/{id}:
    put:
      summary: Replace one saved search.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchRequest"
      responses:
        "200":
          description: Saved search updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete one saved search.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Saved search deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /maintenance-jobs:
    get:
      summary: List manually runnable maintenance jobs.
      description: Returns the backend-owned catalog of maintenance jobs that an administrator can start manually from the Jobs view.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Manually runnable maintenance jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceJobListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /maintenance-jobs/{id}:
    post:
      summary: Run a maintenance job.
      description: Requests the selected backend-owned maintenance job through the durable background job system. A 200 response with created=false means an equivalent job is already pending or running. Explicit no-work requests still create an observable durable job that completes normally.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: An equivalent maintenance job is already pending or running; no duplicate durable work was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceJobRunResponse"
        "202":
          description: New durable maintenance work was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceJobRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Maintenance job ID is not registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Maintenance work could not be queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /operations:
    get:
      summary: List durable background operations.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: query
          required: false
          description: Specific durable operation IDs to return. May be repeated; at most 64 unique IDs are accepted. Completed results are included for this bounded status-batch form.
          schema:
            type: array
            maxItems: 64
            items:
              type: string
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Zero-based number of visible operations to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Visible durable operations matching the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundOperationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: Clear visible terminal durable operation history.
      description: Removes completed, failed, and canceled visible operations together with their terminal child task history. Pending/running operations, hidden implementation operations, and operations with active child tasks are retained.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Terminal operation history cleared.
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared:
                    type: integer
                    format: int64
                    minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /operations/events:
    get:
      summary: Stream durable background operation change signals.
      description: Sends payload-free `operations` server-sent events after committed Jobs-visible operation or task state changes, plus an initial reconciliation signal and periodic keepalive comments. Requires an authenticated administrator session.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Long-lived server-sent event stream of Jobs invalidation signals.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /operations/cancel-all:
    delete:
      summary: Cancel all visible active durable background operations.
      description: Cancels every visible pending or running durable operation. Terminal history and hidden implementation operations are not affected.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Active visible operations canceled.
          content:
            application/json:
              schema:
                type: object
                required: [canceled]
                properties:
                  canceled:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Active operations could not be listed or canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /operations/{id}:
    get:
      summary: Get one durable background operation.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Durable operation state, including a structured result when completed and available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Cancel an active durable background operation.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRF"
      responses:
        "202":
          description: Operation canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    CSRF:
      name: X-Gooru-CSRF
      in: header
      required: true
      schema:
        type: string
      description: CSRF token returned by /auth/login or /auth/me. Required for cookie-authenticated mutating requests.
    PreferAsync:
      name: Prefer
      in: header
      required: false
      schema:
        type: string
        enum: [respond-async]
      description: Set to respond-async to accept the mutation asynchronously; poll the returned durable operation as documented by the endpoint.
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: gooru_session
  responses:
    Unauthorized:
      description: Missing or invalid session cookie.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Request is forbidden, including failed CSRF validation or insufficient privileges.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request body or uploaded file is too large.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service is temporarily unavailable, including a full durable-operation admission window.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TagMutation:
      description: Aggregate tag mutation result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TagMutationResponse"
    AsyncOperation:
      description: Mutation was accepted as a durable background operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BackgroundOperation"

    UnsupportedMedia:
      description: The requested media derivative cannot be generated for this file.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    AuthMeResponse:
      type: object
      required: [user, capabilities]
      properties:
        user:
          $ref: "#/components/schemas/User"
        capabilities:
          type: object
          required: [upload, tag, delete, admin]
          properties:
            upload:
              type: boolean
            tag:
              type: boolean
            delete:
              type: boolean
            admin:
              type: boolean
        csrf_token:
          type: string
    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin]
    FileSearchRequest:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 200
        page_token:
          type: string
        sort:
          type: string
          enum: [added, name, modified, size, kind]
        order:
          type: string
          enum: [asc, desc]
        include_facets:
          type: boolean
    SuggestionRequest:
      type: object
      properties:
        q:
          type: string
        existing:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 200
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    PDFDocumentManifest:
      type: object
      required: [page_count, page_url_prefix]
      properties:
        page_count:
          type: integer
          minimum: 1
          maximum: 10000
        page_url_prefix:
          type: string
          description: Same-origin authenticated PDF image endpoint prefix ending in ?page=.
    ComicPage:
      type: object
      required: [index, name, url]
      properties:
        index:
          type: integer
          minimum: 0
        name:
          type: string
        url:
          type: string
        preview:
          type: string
        lossless:
          type: string
    ComicManifest:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items:
            $ref: "#/components/schemas/ComicPage"
    FileSelectionCreateRequest:
      type: object
      properties:
        query:
          type: string
          description: Library query to snapshot. Empty is treated as *.
    FileSelectionCreateResponse:
      type: object
      required: [id, count]
      properties:
        id:
          type: string
        count:
          type: integer
          minimum: 0
    FileSelectionMembersRequest:
      type: object
      required: [file_ids]
      properties:
        file_ids:
          type: array
          items:
            type: string
    FileSelectionMembersResponse:
      type: object
      required: [file_ids]
      properties:
        file_ids:
          type: array
          items:
            type: string
    FileDownloadRequest:
      type: object
      description: Exactly one of file_ids or selection_id must be provided. Include/exclude deltas are valid only with selection_id.
      properties:
        file_ids:
          type: array
          items:
            type: string
        selection_id:
          type: string
          description: Immutable selection snapshot ID. Mutually exclusive with file_ids.
        include_file_ids:
          type: array
          items:
            type: string
          description: Explicit additions to a selection snapshot. Valid only with selection_id.
        exclude_file_ids:
          type: array
          items:
            type: string
          description: Explicit exclusions from a selection snapshot. Valid only with selection_id.
    FileDownloadCreateResponse:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
        url:
          type: string
          description: Same-origin URL that streams the prepared selected-file response.
    FileRemovalSelector:
      type: object
      properties:
        file_ids:
          type: array
          items:
            type: string
        query:
          type: string
        selection_id:
          type: string
          description: Immutable selection snapshot ID. Mutually exclusive with file_ids and query.
        include_file_ids:
          type: array
          items:
            type: string
          description: Explicit additions to a selection snapshot. Valid only with selection_id.
        exclude_file_ids:
          type: array
          items:
            type: string
          description: Explicit exclusions from a query or selection snapshot.
    FileRemovalRequest:
      allOf:
        - $ref: "#/components/schemas/FileRemovalSelector"
        - type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [untrack, delete, delete_or_untrack]
    FileRemovalResponse:
      type: object
      required: [mode, selector, removed_locations]
      properties:
        mode:
          type: string
          enum: [untrack, delete, delete_or_untrack]
        selector:
          $ref: "#/components/schemas/FileRemovalSelector"
        removed_locations:
          type: integer
          minimum: 0
    TagMutationRequest:
      type: object
      required: [tags]
      properties:
        file_ids:
          type: array
          items:
            type: string
          description: Opaque file IDs. Exactly one of file_ids or query must be provided.
        query:
          type: string
          description: Query selector. Exactly one of file_ids or query must be provided.
        selection_id:
          type: string
          description: Immutable selection snapshot ID. Mutually exclusive with file_ids and query.
        include_file_ids:
          type: array
          items:
            type: string
          description: Explicit additions to a selection snapshot. Valid only with selection_id.
        exclude_file_ids:
          type: array
          items:
            type: string
          description: Explicit exclusions from a query or selection snapshot.
        tags:
          type: array
          items:
            type: string
        verbose:
          type: boolean
          default: false
    TagMutationResponse:
      type: object
      required: [operation, selector, affected_count]
      properties:
        operation:
          type: string
          enum: [add, set, remove]
        selector:
          type: object
          properties:
            file_ids:
              type: array
              items:
                type: string
            query:
              type: string
            exclude_file_ids:
              type: array
              items:
                type: string
        matched_files:
          type: integer
        affected_count:
          type: integer
        notifications:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind:
                type: string
                enum: [move_detected, modified, unknown]
              original_path:
                type: string
              old_path:
                type: string
              new_path:
                type: string
              orphaned_tags:
                type: array
                items:
                  type: string
    UploadImportResponse:
      type: object
      required: [files, affected_count]
      properties:
        files:
          type: array
          items:
            type: object
            required: [name, size, target_id, status]
            properties:
              id:
                type: string
                description: Opaque stable file-location identifier for imported or existing library content. Omitted when no library file identity is available.
              name:
                type: string
              size:
                type: integer
                format: int64
              target_id:
                type: string
              status:
                type: string
                enum: [uploaded, imported, duplicate_existing, duplicate_in_batch, skipped, error]
              error:
                type: string
        affected_count:
          type: integer
        notifications:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind:
                type: string
                enum: [move_detected, modified, unknown]
              original_path:
                type: string
              old_path:
                type: string
              new_path:
                type: string
              orphaned_tags:
                type: array
                items:
                  type: string
    UploadTargetsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, added_at_strategy]
            properties:
              id:
                type: string
              name:
                type: string
              added_at_strategy:
                type: string
                enum: [queue, reverse_queue, modtime]
                description: Default added-at strategy configured for this upload target.
              default_tags:
                type: array
                items:
                  type: string
                description: Visible editable tags and -tag exclusions prefilled for this upload target.
    MaintenanceJob:
      type: object
      required: [id, name, description, running]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        running:
          type: boolean
          description: True when this maintenance job already has a pending or running durable operation.
    MaintenanceJobListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MaintenanceJob"
    MaintenanceJobRunResponse:
      type: object
      required: [job, created]
      properties:
        job:
          $ref: "#/components/schemas/MaintenanceJob"
        created:
          type: boolean
          description: True when this invocation created new durable maintenance work.
    BackgroundOperation:
      type: object
      required: [id, kind, status, progress_total, progress_completed, progress_failed, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, canceled]
        stage:
          type: string
          enum: [receiving, importing]
          description: Optional user-visible lifecycle stage for upload_import operations. Receiving is active synchronous request-body work; importing is durable queued/running processing.
        progress_total:
          type: integer
          format: int64
          minimum: 0
        progress_completed:
          type: integer
          format: int64
          minimum: 0
        progress_completed_prefix:
          type: integer
          format: int64
          minimum: 0
          description: For upload_import operations, number of leading upload files whose analysis stage has completed. Omitted for other operation kinds.
        progress_failed:
          type: integer
          format: int64
          minimum: 0
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Optional overall operation progress fraction. Uploads omit this while receiving when the request length is unknown.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error_code:
          type: string
        error_message:
          type: string
        result: {}
    BackgroundOperationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackgroundOperation"

    BrowserURLState:
      type: object
      properties:
        query:
          type: string
        kind:
          type: string
        sort:
          type: string
          enum: [added, name, modified, size, kind]
        order:
          type: string
          enum: [asc, desc]
        file_id:
          type: string
    FileListResponse:
      type: object
      required: [files, total_count, library_count]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
        next_page_token:
          type: string
        previous_page_token:
          type: string
        total_count:
          type: integer
          description: Total number of files matching the current query.
        library_count:
          type: integer
          description: Total tracked files in the library.
        facets:
          $ref: "#/components/schemas/Facets"
    Facets:
      type: object
      properties:
        kind:
          type: array
          items:
            $ref: "#/components/schemas/FacetValue"
    FacetValue:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
    File:
      type: object
      required:
        - id
        - content_id
        - name
        - safe_display_path
        - size
        - added_at
        - modified_time
        - media_type
        - media_kind
        - viewer_support
        - metadata
        - tags
        - media_urls
        - can_delete
      properties:
        id:
          type: string
          description: Opaque stable file-location identifier.
        content_id:
          type: string
          description: Content fingerprint for the tracked file.
        name:
          type: string
        path:
          type: string
          description: Absolute filesystem path. Omitted unless server path exposure is enabled.
        safe_display_path:
          type: string
          description: Display-only non-absolute path hint, such as the last directory plus filename.
        size:
          type: integer
          format: int64
        added_at:
          type: string
          format: date-time
        modified_time:
          type: string
          format: date-time
        media_type:
          type: string
        media_kind:
          type: string
          enum: [photo, video, gif, audio, comic, pdf, other]
        viewer_support:
          type: string
          enum: [supported, unsupported_media_type]
          description: Backend-owned indication of whether the built-in viewer supports this media type.
        metadata:
          $ref: "#/components/schemas/MediaMetadata"
        tags:
          type: array
          items:
            type: string
        media_urls:
          $ref: "#/components/schemas/MediaURLs"
        can_delete:
          type: boolean
          description: True when the file path is inside a configured upload target and may be physically deleted through the API.
    MediaMetadata:
      type: object
      description: Optional media metadata. Fields are omitted when unavailable or extraction fails.
      properties:
        image_width:
          type: integer
        image_height:
          type: integer
        video_width:
          type: integer
        video_height:
          type: integer
        video_duration:
          type: number
          format: double
        audio_duration:
          type: number
          format: double
        frame_count:
          type: integer
        page_count:
          type: integer
          minimum: 1
          description: Number of displayable pages for paged media such as CBZ comics.
    MediaURLs:
      type: object
      required: [thumbnail, preview, content, download]
      properties:
        thumbnail:
          type: string
        preview:
          type: string
        lossless:
          type: string
          description: Optional lossless display derivative, absent when unavailable.
        pdf:
          type: string
          description: Optional authenticated PDF manifest/page endpoint, absent when the PDF viewer tools are unavailable.
        content:
          type: string
        download:
          type: string
    TagListResponse:
      type: object
      required: [tags, library_count]
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        library_count:
          type: integer
          description: Total tracked files in the library.
        facets:
          $ref: "#/components/schemas/Facets"
    Tag:
      type: object
      required: [name]
      properties:
        name:
          type: string
        namespace:
          type: string
        value:
          type: string
        count:
          type: integer
    DeleteFileResponse:
      type: object
      required: [mode, removed_locations]
      properties:
        mode:
          type: string
          enum: [untrack, delete]
        removed_locations:
          type: integer
    MetaTag:
      type: object
      required: [name, syntax, hint, requires_value]
      properties:
        name:
          type: string
        syntax:
          type: string
        hint:
          type: string
        requires_value:
          type: boolean
    SuggestionsResponse:
      type: object
      required: [items, meta_tags]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        meta_tags:
          type: array
          description: Complete backend-owned catalog of supported query metatags.
          items:
            $ref: "#/components/schemas/MetaTag"
    NamespacesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
    SavedSearchReorderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
    SavedSearchRequest:
      type: object
      required: [name, query]
      properties:
        name:
          type: string
        query:
          type: string
        sort:
          type: string
          enum: [added, name, modified, size, kind]
          default: added
        order:
          type: string
          enum: [asc, desc]
          default: desc
    SavedSearch:
      type: object
      required: [id, name, query, sort, order, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        query:
          type: string
        sort:
          type: string
          enum: [added, name, modified, size, kind]
        order:
          type: string
          enum: [asc, desc]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SavedSearchesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SavedSearch"
