openapi: 3.1.0
info:
  title: Gooru Serve API
  version: 0.1.0
  description: Initial API contract for the gooru serve web application stack.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /auth/login:
    post:
      summary: Create a DB-backed browser session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated user, capabilities, CSRF token, and HttpOnly session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      summary: Revoke the current session and clear its cookie.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/me:
    get:
      summary: Return the current user, capabilities, and a fresh CSRF token.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Current session details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/change-password:
    post:
      summary: Change the current user's password.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /files:
    get:
      summary: List tracked files for browser grids.
      security:
        - sessionAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: page_token
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [added, name, modified, size, kind]
            default: added
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: include_facets
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Page of tracked files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      summary: Untrack or physically delete a selected set of files.
      description: Accepts the same explicit-ID or query-with-exclusions selector used by bulk UI actions. Physical deletion is accepted only when every selected file is inside configured upload targets.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileRemovalRequest"
      responses:
        "200":
          description: Selected file locations were removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRemovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Physical deletion was requested for a selection containing files outside configured upload targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /files/{id}:
    get:
      summary: Get one tracked file by opaque file ID.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tracked file details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Untrack a file location or delete managed uploaded content.
      description: Untrack removes only the selected database location. Delete also removes the underlying file, but is accepted only for paths inside configured upload targets.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [untrack, delete]
                  default: untrack
      responses:
        "200":
          description: File location was untracked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteFileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Physical deletion was requested for a file outside configured upload targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /files/{id}/thumbnail:
    get:
      summary: Get a cacheable thumbnail for a tracked file.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
          description: Requested thumbnail size. Must be one of the configured thumbnail_sizes values.
      responses:
        "200":
          description: Thumbnail image derivative.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Gooru-Cache:
              schema:
                type: string
                enum: [hit, miss]
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
  /files/{id}/preview:
    get:
      summary: Get a cacheable preview derivative for a tracked file.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preview image derivative.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Gooru-Cache:
              schema:
                type: string
                enum: [hit, miss]
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
  /files/{id}/content:
    get:
      summary: Stream original content for a tracked file.
      description: Supports HTTP range requests for browser audio and video seeking.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        "200":
          description: Full original file content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial original file content.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{id}/download:
    get:
      summary: Download original content for a tracked file.
      description: Streams original media with an attachment content disposition and range support.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Full original file download.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial original file download.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /comics/{id}:
    get:
      summary: List naturally ordered image pages in a CBZ comic.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comic page manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComicManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
  /comics/{id}/{page}:
    get:
      summary: Stream one naturally ordered image page from a CBZ comic.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Requested comic page image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
  /files/tags:
    post:
      summary: Add tags to selected files.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PreferAsync"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagMutationRequest"
      responses:
        "200":
          $ref: "#/components/responses/TagMutation"
        "202":
          $ref: "#/components/responses/AsyncJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      summary: Replace tags on selected files.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PreferAsync"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagMutationRequest"
      responses:
        "200":
          $ref: "#/components/responses/TagMutation"
        "202":
          $ref: "#/components/responses/AsyncJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      summary: Remove tags from selected files.
      description: If tags is empty, all tags are removed from the selected files.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PreferAsync"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagMutationRequest"
      responses:
        "200":
          $ref: "#/components/responses/TagMutation"
        "202":
          $ref: "#/components/responses/AsyncJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /upload-targets:
    get:
      summary: List configured upload targets.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Configured upload targets without filesystem paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTargetsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /uploads:
    post:
      summary: Upload files into a configured upload target and import them.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PreferAsync"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                added_at_strategy:
                  type: string
                  enum: [queue, reverse_queue, modtime]
                  description: Override the selected upload target's added-at strategy for this submission.
                queue_time_ms:
                  type: array
                  items: { type: integer, format: int64 }
                  description: Client-captured queue timestamps in Unix milliseconds, one per file.
                queue_index:
                  type: array
                  items: { type: integer, minimum: 0 }
                  description: Stable queue indexes, one per file.
                queue_total:
                  type: array
                  items: { type: integer, minimum: 1 }
                  description: Queue batch size, one per file.
                source_modtime_ms:
                  type: array
                  description: Source modification timestamps in Unix milliseconds, in the same order as `files`. Invalid or missing entries are treated as unavailable.
                  items:
                    type: integer
                    format: int64
                target_id:
                  type: string
                  description: Configured upload target ID. Defaults to the first configured target.
                conflict_policy:
                  type: string
                  enum: [skip, rename, replace]
                  description: How to handle uploaded filenames that already exist in the target.
                tags:
                  type: string
                  description: Space- or comma-separated initial tags.
      responses:
        "200":
          description: Synchronous upload/import result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadImportResponse"
        "202":
          $ref: "#/components/responses/AsyncJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tags:
    get:
      summary: List known tags.
      security:
        - sessionAuth: []
      parameters:
        - name: counts
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Maximum tags to return. Defaults to 200 and is capped at 500.
          schema:
            type: integer
            default: 200
            maximum: 500
      responses:
        "200":
          description: Tags, optionally with counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tags/namespaces:
    get:
      summary: List tag namespaces.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Known tag namespaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespacesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /search/suggestions:
    get:
      summary: Return tag autocomplete suggestions.
      security:
        - sessionAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Current token prefix. Use namespace:value prefixes such as `kind:` for value suggestions.
        - name: existing
          in: query
          required: false
          schema:
            type: string
          description: Existing query expression; already-present tags are filtered from suggestions when parseable.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Matching tag suggestions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /saved-searches:
    get:
      summary: List saved searches for the current user.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Current user's saved searches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearchesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a saved search for the current user.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchRequest"
      responses:
        "201":
          description: Saved search created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /saved-searches/{id}:
    put:
      summary: Replace one saved search.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchRequest"
      responses:
        "200":
          description: Saved search updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete one saved search.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Saved search deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs:
    get:
      summary: List asynchronous jobs.
      security:
        - sessionAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, completed, failed, canceled]
      responses:
        "200":
          description: Jobs matching the optional status filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: Clear finished jobs.
      security:
        - sessionAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [completed, failed, canceled]
            default: completed
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Number of finished jobs removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /jobs/{id}:
    get:
      summary: Get an asynchronous job.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Cancel an asynchronous job.
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRF"
      responses:
        "202":
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    CSRF:
      name: X-Gooru-CSRF
      in: header
      required: true
      schema:
        type: string
      description: CSRF token returned by /auth/login or /auth/me. Required for cookie-authenticated mutating requests.
    PreferAsync:
      name: Prefer
      in: header
      required: false
      schema:
        type: string
        enum: [respond-async]
      description: Set to respond-async to enqueue the mutation and poll the returned job.
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: gooru_session
  responses:
    Unauthorized:
      description: Missing or invalid session cookie.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Request is forbidden, including failed CSRF validation or insufficient privileges.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request body or uploaded file is too large.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service is temporarily unavailable, including a full job queue.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TagMutation:
      description: Aggregate tag mutation result.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TagMutationResponse"
    AsyncJob:
      description: Mutation was queued as an asynchronous job.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Job"
    UnsupportedMedia:
      description: The requested media derivative cannot be generated for this file.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    AuthMeResponse:
      type: object
      required: [user, capabilities]
      properties:
        user:
          $ref: "#/components/schemas/User"
        capabilities:
          type: object
          required: [upload, tag, delete, admin]
          properties:
            upload:
              type: boolean
            tag:
              type: boolean
            delete:
              type: boolean
            admin:
              type: boolean
        csrf_token:
          type: string
    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    ComicPage:
      type: object
      required: [index, name, url]
      properties:
        index:
          type: integer
          minimum: 0
        name:
          type: string
        url:
          type: string
    ComicManifest:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items:
            $ref: "#/components/schemas/ComicPage"
    FileRemovalSelector:
      type: object
      properties:
        file_ids:
          type: array
          items:
            type: string
        query:
          type: string
        exclude_file_ids:
          type: array
          items:
            type: string
    FileRemovalRequest:
      allOf:
        - $ref: "#/components/schemas/FileRemovalSelector"
        - type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [untrack, delete]
    FileRemovalResponse:
      type: object
      required: [mode, selector, removed_locations]
      properties:
        mode:
          type: string
          enum: [untrack, delete]
        selector:
          $ref: "#/components/schemas/FileRemovalSelector"
        removed_locations:
          type: integer
          minimum: 0
    TagMutationRequest:
      type: object
      required: [tags]
      properties:
        file_ids:
          type: array
          items:
            type: string
          description: Opaque file IDs. Exactly one of file_ids or query must be provided.
        query:
          type: string
          description: Query selector. Exactly one of file_ids or query must be provided.
        exclude_file_ids:
          type: array
          items:
            type: string
          description: Opaque file IDs to exclude from a query selector. Only valid with query.
        tags:
          type: array
          items:
            type: string
        verbose:
          type: boolean
          default: false
    TagMutationResponse:
      type: object
      required: [operation, selector, affected_count]
      properties:
        operation:
          type: string
          enum: [add, set, remove]
        selector:
          type: object
          properties:
            file_ids:
              type: array
              items:
                type: string
            query:
              type: string
            exclude_file_ids:
              type: array
              items:
                type: string
        matched_files:
          type: integer
        affected_count:
          type: integer
        notifications:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind:
                type: string
                enum: [move_detected, modified, unknown]
              original_path:
                type: string
              old_path:
                type: string
              new_path:
                type: string
              orphaned_tags:
                type: array
                items:
                  type: string
    UploadImportResponse:
      type: object
      required: [files, affected_count]
      properties:
        files:
          type: array
          items:
            type: object
            required: [name, size, target_id, status]
            properties:
              name:
                type: string
              size:
                type: integer
                format: int64
              target_id:
                type: string
              status:
                type: string
                enum: [uploaded, imported, duplicate_existing, duplicate_in_batch, skipped, error]
              error:
                type: string
        affected_count:
          type: integer
        notifications:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind:
                type: string
                enum: [move_detected, modified, unknown]
              original_path:
                type: string
              old_path:
                type: string
              new_path:
                type: string
              orphaned_tags:
                type: array
                items:
                  type: string
    UploadTargetsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, added_at_strategy]
            properties:
              id:
                type: string
              name:
                type: string
              added_at_strategy:
                type: string
                enum: [queue, reverse_queue, modtime]
                description: Default added-at strategy configured for this upload target.
    Job:
      type: object
      required: [id, type, status, submitted_at]
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, canceled]
        progress:
          type: number
          minimum: 0
          maximum: 1
        submitted_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        result: {}
        error:
          type: string
    JobListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
    FileListResponse:
      type: object
      required: [files, total_count, library_count]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
        next_page_token:
          type: string
        previous_page_token:
          type: string
        total_count:
          type: integer
          description: Total number of files matching the current query.
        library_count:
          type: integer
          description: Total tracked files in the library.
        facets:
          $ref: "#/components/schemas/Facets"
    Facets:
      type: object
      properties:
        kind:
          type: array
          items:
            $ref: "#/components/schemas/FacetValue"
    FacetValue:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          type: integer
    File:
      type: object
      required:
        - id
        - content_id
        - name
        - safe_display_path
        - size
        - added_at
        - modified_time
        - media_type
        - media_kind
        - metadata
        - tags
        - media_urls
        - can_delete
      properties:
        id:
          type: string
          description: Opaque stable file-location identifier.
        content_id:
          type: string
          description: Content hash for the tracked file.
        name:
          type: string
        path:
          type: string
          description: Absolute filesystem path. Omitted unless server path exposure is enabled.
        safe_display_path:
          type: string
          description: Display-only non-absolute path hint, such as the last directory plus filename.
        size:
          type: integer
          format: int64
        added_at:
          type: string
          format: date-time
        modified_time:
          type: string
          format: date-time
        media_type:
          type: string
        media_kind:
          type: string
          enum: [photo, video, gif, audio, other]
        metadata:
          $ref: "#/components/schemas/MediaMetadata"
        tags:
          type: array
          items:
            type: string
        media_urls:
          $ref: "#/components/schemas/MediaURLs"
        can_delete:
          type: boolean
          description: True when the file path is inside a configured upload target and may be physically deleted through the API.
    MediaMetadata:
      type: object
      description: Optional media metadata. Fields are omitted when unavailable or extraction fails.
      properties:
        image_width:
          type: integer
        image_height:
          type: integer
        video_width:
          type: integer
        video_height:
          type: integer
        video_duration:
          type: number
          format: double
        audio_duration:
          type: number
          format: double
        frame_count:
          type: integer
        page_count:
          type: integer
          minimum: 1
          description: Number of displayable pages for paged media such as CBZ comics.
    MediaURLs:
      type: object
      required: [thumbnail, preview, content, download]
      properties:
        thumbnail:
          type: string
        preview:
          type: string
        content:
          type: string
        download:
          type: string
    TagListResponse:
      type: object
      required: [tags, library_count]
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        library_count:
          type: integer
          description: Total tracked files in the library.
        facets:
          $ref: "#/components/schemas/Facets"
    Tag:
      type: object
      required: [name]
      properties:
        name:
          type: string
        namespace:
          type: string
        value:
          type: string
        count:
          type: integer
    DeleteFileResponse:
      type: object
      required: [mode, removed_locations]
      properties:
        mode:
          type: string
          enum: [untrack, delete]
        removed_locations:
          type: integer
    MetaTag:
      type: object
      required: [name, syntax, hint, requires_value]
      properties:
        name:
          type: string
        syntax:
          type: string
        hint:
          type: string
        requires_value:
          type: boolean
    SuggestionsResponse:
      type: object
      required: [items, meta_tags]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        meta_tags:
          type: array
          description: Complete backend-owned catalog of supported query metatags.
          items:
            $ref: "#/components/schemas/MetaTag"
    NamespacesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string
    SavedSearchRequest:
      type: object
      required: [name, query]
      properties:
        name:
          type: string
        query:
          type: string
        sort:
          type: string
          enum: [added, name, modified, size, kind]
          default: added
        order:
          type: string
          enum: [asc, desc]
          default: desc
    SavedSearch:
      type: object
      required: [id, name, query, sort, order, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        query:
          type: string
        sort:
          type: string
          enum: [added, name, modified, size, kind]
        order:
          type: string
          enum: [asc, desc]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SavedSearchesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SavedSearch"
