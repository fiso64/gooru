openapi: 3.1.0
info:
  title: Gooru API
  version: 1.0.0
paths:
  /api/v1/auth/me:
    get:
      summary: Return the authenticated session
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      summary: Authenticate with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      summary: Clear the current session
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/files:
    get:
      summary: List files visible to the authenticated user
      parameters:
        - in: query
          name: query
          schema:
            type: string
        - in: query
          name: include
          schema:
            type: string
            description: Comma-separated relation set. Supported values include tags, ratings, urls, named_fields, sources, file_metadata, and media.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Matching files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/files/{hash}:
    get:
      summary: Fetch one file by SHA-256 hash
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
        - in: query
          name: include
          schema:
            type: string
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/files/{hash}/content:
    get:
      summary: Stream original file content
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Original file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: binary
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/files/{hash}/thumbnail:
    get:
      summary: Return or generate a thumbnail derivative
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
        - in: query
          name: size
          schema:
            type: integer
      responses:
        '200':
          description: Thumbnail image
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/files/{hash}/preview:
    get:
      summary: Return or generate a preview derivative
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Preview media
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/files/{hash}/archive:
    get:
      summary: Describe archive/comic contents
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archive metadata and page list
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/files/{hash}/archive/pages/{page}:
    get:
      summary: Stream one archive/comic page
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
        - in: path
          name: page
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Archive page bytes
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/files/batch:
    post:
      summary: Apply one or more metadata mutations to a set of file hashes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileBatchMutation'
      responses:
        '200':
          description: Mutation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationResult'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/search/suggestions:
    get:
      summary: Return structured search suggestions
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: context
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Search suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchSuggestion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/tags:
    get:
      summary: List tags
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
  /api/v1/ratings:
    get:
      summary: List rating namespaces
      responses:
        '200':
          description: Ratings
  /api/v1/sources:
    get:
      summary: List source statistics
      responses:
        '200':
          description: Sources
  /api/v1/saved-searches:
    get:
      summary: List saved searches for the current user
      responses:
        '200':
          description: Saved searches
    post:
      summary: Create a saved search
      responses:
        '201':
          description: Saved search created
  /api/v1/saved-searches/{id}:
    patch:
      summary: Update a saved search
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved search updated
    delete:
      summary: Delete a saved search
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Saved search deleted
  /api/v1/saved-searches/reorder:
    post:
      summary: Persist saved-search ordering
      responses:
        '200':
          description: Ordering updated
  /api/v1/uploads:
    post:
      summary: Upload one or more files
      responses:
        '200':
          description: Upload accepted
  /api/v1/upload-targets:
    get:
      summary: List configured upload targets
      responses:
        '200':
          description: Upload targets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTargets'
  /api/v1/jobs:
    get:
      summary: List jobs
      responses:
        '200':
          description: Jobs
    post:
      summary: Submit a job
      responses:
        '202':
          description: Job submitted
  /api/v1/jobs/{id}:
    get:
      summary: Fetch one job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job
  /api/v1/jobs/{id}/events:
    get:
      summary: Stream server-sent job events
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event stream
  /api/v1/ui-config:
    get:
      summary: Return frontend runtime configuration
      responses:
        '200':
          description: Runtime configuration
  /api/v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Healthy
  /api/v1/version:
    get:
      summary: Return version information
      responses:
        '200':
          description: Version
components:
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
  schemas:
    Session:
      type: object
      required: [user, capabilities, csrf_token]
      properties:
        user:
          type: object
          required: [id, username, role]
          properties:
            id:
              type: string
            username:
              type: string
            role:
              type: string
        capabilities:
          type: object
          required: [upload, tag, delete, admin]
          properties:
            upload:
              type: boolean
            tag:
              type: boolean
            delete:
              type: boolean
            admin:
              type: boolean
        csrf_token:
          type: string
    FileList:
      type: object
      required: [files, total_count, library_count, facets]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        total_count:
          type: integer
          format: int64
        library_count:
          type: integer
          format: int64
        facets:
          type: object
          additionalProperties: true
    File:
      type: object
      required: [hash, name, path, added_at, modified_at, size, tags, ratings, urls, named_fields, sources, file_metadata, source_count, media_kind]
      properties:
        hash:
          type: string
        name:
          type: string
        path:
          type: string
        added_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
        ratings:
          type: object
          additionalProperties:
            type: number
        urls:
          type: array
          items:
            type: string
        named_fields:
          type: object
          additionalProperties:
            type: string
        sources:
          type: array
          items:
            type: string
        file_metadata:
          type: object
          additionalProperties:
            type: string
        source_count:
          type: integer
        media_kind:
          type: string
        mime_type:
          type: string
        width:
          type: integer
        height:
          type: integer
        duration_ms:
          type: integer
        archive_page_count:
          type: integer
    FileBatchMutation:
      type: object
      required: [hashes]
      properties:
        hashes:
          type: array
          minItems: 1
          items:
            type: string
        add_tags:
          type: array
          items:
            type: string
        remove_tags:
          type: array
          items:
            type: string
        ratings:
          type: object
          additionalProperties:
            type: number
        add_urls:
          type: array
          items:
            type: string
        remove_urls:
          type: array
          items:
            type: string
        named_fields:
          type: object
          additionalProperties:
            type: string
    MutationResult:
      type: object
      required: [affected_count]
      properties:
        affected_count:
          type: integer
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    SearchSuggestion:
      type: object
      required: [kind, value, label]
      properties:
        kind:
          type: string
        value:
          type: string
        label:
          type: string
        namespace:
          type: string
        count:
          type: integer
          format: int64
        selected:
          type: boolean
    Tag:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
          format: int64
    UploadTargets:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, added_at_strategy]
            properties:
              id:
                type: string
              name:
                type: string
              added_at_strategy:
                type: string
                enum: [queue, reverse_queue, modtime]
                description: Default added-at strategy configured for this upload target.
              default_tags:
                type: array
                items:
                  type: string
                description: Visible editable ordinary tags prefilled for this upload target.
    Job:
      type: object
      required: [id, type, status, submitted_at]
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
        submitted_at:
          type: string
          format: date-time
    Notification:
      type: object
      required: [level, text]
      properties:
        level:
          type: string
          enum: [info, warning, error]
        text:
          type: string
